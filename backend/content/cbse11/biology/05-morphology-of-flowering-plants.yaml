# CBSE Class 11 Biology (NCERT, rationalised syllabus), chapter 5. Format: content/README.md.
subject: cbse11-bio
chapter: 5
title: Morphology of Flowering Plants
tips:
  c11b_root: Tap roots grow from the radicle (most dicots); fibrous roots grow from the base of the stem (monocots like wheat).
  c11b_ovary: 'Superior ovary: other floral parts arise below it (hypogynous). Inferior ovary: other parts arise above it (epigynous).'
  b11_cactus_spine: "Cactus stems do the photosynthesis. Which organ was reduced to stop water loss?"
  b11_fabaceae: "Pea and beans are legumes with pods. The family is named after the Latin word for bean, 'faba'."
  b11_parthenocarpy: "Seedless bananas form without fertilisation. 'Partheno' means virgin."
  b11_pinnate: "Neem leaflets are arranged along a central axis like a feather (pinna)."
  b11_pneumatophore: "Mangrove mud has little air. Roots grow upward out of the mud to do what?"
  b11_potato: "A potato has 'eyes' (nodes with buds). Roots don't have nodes or buds."
  b11_scutellum: "In grasses the single cotyledon is shield-shaped. Coleoptile covers the plumule."
  b11_solanaceae: "Potato, tomato and brinjal belong to the potato family, named after Solanum."
  b11_venation: "Grass and banana leaves have veins running side by side. Which group is grass?"
  b11_whorls: "Calyx, corolla, androecium, gynoecium. Count them."
concepts:
- code: cbse11b.morph.vegetative
  title: Root, stem and leaf
  notes: |
    Root: tap root (mustard), fibrous (wheat), adventitious (grass, banyan); regions: root cap, meristematic, elongation,
    maturation (root hairs). Modifications: storage (carrot, turnip, sweet potato), prop roots (banyan), stilt roots (maize,
    sugarcane), pneumatophores (Rhizophora). Stem: nodes, internodes, buds; modifications: underground storage (potato
    tuber, ginger rhizome, onion bulb, colocasia corm), tendrils (cucumber), thorns (Bougainvillea, Citrus), phylloclade
    (Opuntia), runners/stolons/offsets. Leaf: base, petiole, lamina; venation reticulate (dicots) or parallel (monocots);
    simple and compound (pinnate: neem; palmate: silk cotton); phyllotaxy alternate, opposite, whorled; modified as
    tendrils (pea), spines (cactus).
  explanations:
    text: 'Roots hold the plant and absorb water; stems carry water and food and hold up leaves; leaves make food. Each can be modified for special jobs: carrots store food in roots, potatoes in stems, and cactus spines are leaves.'
    visual: 'Draw a potato with its ''eyes'': each eye is a bud at a node, which proves the potato is a stem, not a root.'
    step_by_step: 'Step 1: Look for nodes and buds (stem). Step 2: Look for a root cap and no nodes (root). Step 3: Check leaf venation: net (dicot) or parallel (monocot).'
    real_world: Mangroves along Kerala's coast have breathing roots (pneumatophores) that stick up out of the salty mud.
  picture:
    kind: compare
    columns:
    - title: Food store
      points:
      - carrot
      - potato
      - ginger
      - onion
    - title: Plant part
      points:
      - tap root
      - stem tuber
      - rhizome (stem)
      - bulb (leaves)
    alt: Food storage organs and the part of the plant each one comes from.
  activity:
    type: sort
    prompt: Which part of the plant has been modified?
    bins:
    - Root
    - Stem
    - Leaf
    items:
    - label: Carrot
      bin: Root
      clue: Does it have nodes, buds or leaves on it?
      why: 'No nodes or buds: a tap root swollen with food.'
    - label: Sweet potato
      bin: Root
      clue: Does it have eyes (buds) like a potato?
      why: A swollen adventitious root, with no nodes.
    - label: Pneumatophores of mangroves
      bin: Root
      clue: Do these grow up out of the mud to breathe?
      why: Breathing roots that grow upward in swamps.
    - label: Prop roots of banyan
      bin: Root
      clue: Do they grow down from branches into the soil?
      why: Hanging adventitious roots that support the branches.
    - label: Potato
      bin: Stem
      clue: Look for 'eyes'. What are they?
      why: The eyes are buds at nodes, so a potato is a stem tuber.
    - label: Ginger
      bin: Stem
      clue: Does it have nodes and scale leaves?
      why: Nodes and buds mark it as an underground stem (rhizome).
    - label: Thorns of Citrus
      bin: Stem
      clue: 'Where does a thorn grow: from a leaf base or an axillary bud?'
      why: Thorns grow from axillary buds, so they are modified stems.
    - label: Tendrils of cucumber
      bin: Stem
      clue: Do they grow from axillary buds?
      why: 'Cucumber tendrils come from axillary buds: stem tendrils.'
    - label: Flattened green stem of Opuntia
      bin: Stem
      clue: It looks like a leaf. Does it have nodes?
      why: A flattened stem (phylloclade) does the photosynthesis.
    - label: Spines of cactus
      bin: Leaf
      clue: 'Where do the spines grow: as leaves or from buds?'
      why: Leaves reduced to spines cut water loss.
    - label: Tendrils of pea
      bin: Leaf
      clue: Do they grow where leaflets would be?
      why: Pea tendrils are modified leaflets.
    - label: Pitcher of a pitcher plant
      bin: Leaf
      clue: Which part forms the pitcher and its lid?
      why: The leaf is modified into a pitcher that traps insects.
  items:
  - prompt: 'A potato is a modified:'
    options:
    - stem
    - root
    - leaf
    - fruit
    answer: stem
    difficulty: 1
    hints:
    - Has eyes (buds).
    - Nodes.
    solution: A stem (tuber).
    mistakes: {"root": "b11_potato", "leaf": "b11_potato", "fruit": "b11_potato"}
  - prompt: Wheat has which type of root system?
    options:
    - fibrous
    - tap
    - prop
    - pneumatophore
    answer: fibrous
    difficulty: 1
    hints:
    - Monocot.
    - Many thin roots.
    solution: Fibrous.
    mistakes:
      tap: c11b_root
  - prompt: 'Pneumatophores help mangroves to:'
    options:
    - get oxygen for respiration
    - store food
    - climb
    - catch insects
    answer: get oxygen for respiration
    difficulty: 2
    hints:
    - Waterlogged mud.
    - Grow upward.
    solution: They take in air.
    mistakes: {"store food": "b11_pneumatophore", "climb": "b11_pneumatophore", "catch insects": "b11_pneumatophore"}
  - prompt: 'Spines of cactus are modified:'
    options:
    - leaves
    - stems
    - roots
    - flowers
    answer: leaves
    difficulty: 2
    hints:
    - Reduce water loss.
    - The stem is green.
    solution: Leaves.
    mistakes: {"stems": "b11_cactus_spine", "roots": "b11_cactus_spine", "flowers": "b11_cactus_spine"}
  - prompt: 'Parallel venation is typical of:'
    options:
    - monocots
    - dicots
    - gymnosperms
    - ferns
    answer: monocots
    difficulty: 1
    hints:
    - Grass, banana.
    - Veins side by side.
    solution: Monocots.
    mistakes: {"dicots": "b11_venation", "gymnosperms": "b11_venation", "ferns": "b11_venation"}
  - prompt: Neem has which type of compound leaf?
    options:
    - pinnately compound
    - palmately compound
    - simple
    - needle-like
    answer: pinnately compound
    difficulty: 2
    hints:
    - Leaflets along an axis.
    - Like a feather.
    solution: Pinnately compound.
    mistakes: {"palmately compound": "b11_pinnate", "simple": "b11_pinnate", "needle-like": "b11_pinnate"}
- code: cbse11b.morph.flower
  title: Flower, fruit, seed and families
  after:
  - cbse11b.morph.vegetative
  notes: |
    Inflorescence: racemose (main axis grows on) and cymose (main axis ends in a flower). Flower: modified shoot;
    actinomorphic/zygomorphic; bisexual/unisexual; hypogynous (superior ovary: mustard, china rose), perigynous (plum,
    rose), epigynous (inferior ovary: guava, cucumber). Whorls: calyx, corolla (aestivation: valvate, twisted, imbricate,
    vexillary), androecium (epipetalous stamens), gynoecium (apocarpous/syncarpous; placentation: marginal, axile,
    parietal, free central, basal). Fruit: ripened ovary; parthenocarpic fruits. Seed: dicot (bean) and monocot (maize,
    with endosperm, scutellum, coleoptile). Semi-technical description and floral formula; families Fabaceae (pea),
    Solanaceae (potato, tomato), Liliaceae (onion).
  explanations:
    text: 'A flower is a shoot built for reproduction, with four rings of parts: sepals, petals, stamens and carpels. After fertilisation, the ovary becomes a fruit and ovules become seeds. Botanists write a floral formula to describe a flower briefly.'
    visual: 'Draw a flower in cross-section: sepals outside, then petals, then stamens, and the carpel with the ovary at the centre. Mark whether the ovary sits above (superior) or below (inferior) the other parts.'
    step_by_step: 'Step 1: Count each whorl. Step 2: Note symmetry and ovary position. Step 3: Write the floral formula (K, C, A, G). Step 4: Identify the fruit type.'
    real_world: 'Bananas sold in markets are parthenocarpic: they develop without fertilisation, so they have no proper seeds.'
  picture:
    kind: flow
    steps:
    - Calyx (sepals)
    - Corolla (petals)
    - Androecium (stamens)
    - Gynoecium (carpels)
    alt: The four whorls of a flower from outside to inside.
  activity:
    type: sort
    prompt: Where does the ovary sit compared with the other floral parts?
    bins:
    - Superior (hypogynous)
    - Half-inferior (perigynous)
    - Inferior (epigynous)
    items:
    - label: Mustard
      bin: Superior (hypogynous)
      clue: Do the petals and sepals grow from below the ovary?
      why: The ovary sits on top, with the other parts below it.
    - label: China rose (hibiscus)
      bin: Superior (hypogynous)
      clue: Is the ovary at the highest point of the thalamus?
      why: The other parts arise below the ovary.
    - label: Brinjal
      bin: Superior (hypogynous)
      clue: Where are the sepals compared with the ovary?
      why: Sepals, petals and stamens arise below the ovary.
    - label: Plum
      bin: Half-inferior (perigynous)
      clue: Do the other parts arise from a rim around the ovary, at about its level?
      why: The thalamus forms a cup, with the parts on its rim at the ovary's level.
    - label: Rose
      bin: Half-inferior (perigynous)
      clue: Is the ovary inside a cup, with parts on the rim?
      why: A cup-shaped thalamus, parts at the same level as the ovary.
    - label: Peach
      bin: Half-inferior (perigynous)
      clue: Is the thalamus a cup around the ovary but not fused to it?
      why: The ovary is half-inferior.
    - label: Guava
      bin: Inferior (epigynous)
      clue: Look for the sepal remains on the fruit. Top or bottom?
      why: 'The sepals are on top of the fruit: the thalamus has grown around the ovary and fused with it.'
    - label: Cucumber
      bin: Inferior (epigynous)
      clue: Is the flower above the young fruit?
      why: The ovary is fused inside the thalamus, with the other parts above it.
    - label: Ray florets of sunflower
      bin: Inferior (epigynous)
      clue: Do the other parts arise above the ovary?
      why: The ovary is below, fused with the thalamus.
  items:
  - prompt: How many whorls does a typical complete flower have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Calyx, corolla, androecium, gynoecium.
    - Count.
    solution: Four.
    mistakes: {"3": "b11_whorls", "5": "b11_whorls"}
  - prompt: 'A guava flower with the ovary below the other parts is:'
    options:
    - epigynous
    - hypogynous
    - perigynous
    - agynous
    answer: epigynous
    difficulty: 2
    hints:
    - Inferior ovary.
    - Parts on top.
    solution: Epigynous.
    mistakes:
      hypogynous: c11b_ovary
  - prompt: 'A fruit that develops without fertilisation is:'
    options:
    - parthenocarpic
    - aggregate
    - composite
    - 'false'
    answer: parthenocarpic
    difficulty: 2
    hints:
    - Seedless banana.
    - Virgin fruit.
    solution: Parthenocarpic.
    mistakes: {"aggregate": "b11_parthenocarpy", "composite": "b11_parthenocarpy", "false": "b11_parthenocarpy"}
  - prompt: Which family includes pea and beans?
    options:
    - Fabaceae
    - Solanaceae
    - Liliaceae
    - Poaceae
    answer: Fabaceae
    difficulty: 1
    hints:
    - Legumes.
    - Pod fruits.
    solution: Fabaceae.
    mistakes: {"Solanaceae": "b11_fabaceae", "Liliaceae": "b11_fabaceae", "Poaceae": "b11_fabaceae"}
  - prompt: 'In a maize seed, the single cotyledon is called the:'
    options:
    - scutellum
    - coleoptile
    - plumule
    - testa
    answer: scutellum
    difficulty: 2
    hints:
    - Shield-shaped.
    - Monocot.
    solution: The scutellum.
    mistakes: {"coleoptile": "b11_scutellum", "plumule": "b11_scutellum", "testa": "b11_scutellum"}
  - prompt: 'Potato, brinjal and tomato belong to:'
    options:
    - Solanaceae
    - Fabaceae
    - Liliaceae
    - Brassicaceae
    answer: Solanaceae
    difficulty: 2
    hints:
    - Potato family.
    - Solanum.
    solution: Solanaceae.
    mistakes: {"Fabaceae": "b11_solanaceae", "Liliaceae": "b11_solanaceae", "Brassicaceae": "b11_solanaceae"}
