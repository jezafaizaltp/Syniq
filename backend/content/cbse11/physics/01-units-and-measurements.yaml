# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse11-phy
chapter: 1
title: Units and Measurements
tips:
  c11p_sigfig: Leading zeros never count as significant figures; zeros between digits always do; trailing zeros after a decimal point do.
  c11p_dims: "Write each quantity in M, L, T step by step: velocity [LT⁻¹], acceleration [LT⁻²]. Then build the one asked for from its formula."
  p11_dimless: "Write the units of each quantity. Which one is a length divided by a length, so the units cancel?"
  p11_dims_check: "Each term must have the same dimensions. Check every term of each equation for length, speed, etc."
  p11_dims_ke: "KE = ½mv². Write the dimensions of m and of v², then multiply."
  p11_dims_limit: "Pure numbers have no dimensions. Can a dimension check ever see them?"
  p11_dims_pressure: "Pressure = force ÷ area: [MLT⁻²] ÷ [L²]. Subtract the powers of L."
  p11_km_m: "1 km = 1000 m."
  p11_si_base: "List them: metre, kilogram, second, ampere, kelvin, mole and one for light. Count."
  p11_sig_product: "When multiplying, the answer keeps as many significant figures as the least precise measurement."
  p11_sig_zeros: "Trailing zeros after a decimal point are significant: they show how precisely you measured."
  p11_units: "Joule is energy, watt power, pascal pressure. Force is named after the man of the three laws."
concepts:
- code: cbse11p.units.si
  title: SI units and significant figures
  notes: |
    Physical quantities are measured in units. SI base units (7): metre (m), kilogram (kg), second (s), ampere (A),
    kelvin (K), mole (mol), candela (cd). Derived units: newton = kg m s⁻², joule = N m, watt = J s⁻¹. Prefixes: kilo 10³,
    mega 10⁶, milli 10⁻³, micro 10⁻⁶, nano 10⁻⁹. Significant figures: all non-zero digits; zeros between them; trailing
    zeros after a decimal point; not leading zeros (0.00304 has 3). Rounding: result of × or ÷ has as many significant
    figures as the least precise value; + or − as many decimal places as the least precise.
  explanations:
    text: 'Scientists all over the world use the same seven SI base units, like the metre, kilogram and second. Other units, like the newton and joule, are built from them. Significant figures show how precise a measurement is: 0.00304 has three, because the leading zeros only show where the decimal point is.'
    visual: 'Write 0.00304 and circle the digits that carry information: 3, 0, 4. The first zeros just hold place. In 2.500 all four digits count: the final zeros show the measurement was precise to a thousandth.'
    step_by_step: 'Step 1: Ignore leading zeros. Step 2: Count all non-zero digits. Step 3: Count zeros between them. Step 4: Count trailing zeros only if there is a decimal point.'
    real_world: Medicine doses are written in milligrams (10⁻³ g) or micrograms (10⁻⁶ g); getting the prefix right is a matter of safety.
  picture:
    kind: compare
    columns:
    - title: Quantity
      points:
      - length
      - mass
      - time
      - electric current
    - title: SI unit
      points:
      - metre (m)
      - kilogram (kg)
      - second (s)
      - ampere (A)
    alt: 'SI base units: the metre for length, kilogram for mass, second for time and ampere for current.'
  activity:
    type: sort
    prompt: Is it one of the seven SI base units, or is it built from them?
    bins:
    - SI base unit
    - Built from base units
    items:
    - label: metre (length)
      bin: SI base unit
      clue: Can you write a metre using other units?
      why: Length is a base quantity; the metre is one of the seven base units.
    - label: kilogram (mass)
      bin: SI base unit
      clue: Is mass defined from length and time?
      why: Mass is a base quantity, measured in kilograms.
    - label: second (time)
      bin: SI base unit
      clue: Can time be broken into other quantities?
      why: 'Time is a base quantity: the second.'
    - label: ampere (current)
      bin: SI base unit
      clue: Is current one of the seven base quantities?
      why: Electric current is a base quantity, so the ampere is a base unit.
    - label: kelvin (temperature)
      bin: SI base unit
      clue: Is temperature measured in a base unit?
      why: 'Thermodynamic temperature is a base quantity: the kelvin.'
    - label: mole (amount)
      bin: SI base unit
      clue: Is 'amount of substance' a base quantity?
      why: 'Amount of substance is a base quantity: the mole.'
    - label: candela (light)
      bin: SI base unit
      clue: 'Luminous intensity: base or built?'
      why: 'Luminous intensity is the seventh base quantity: the candela.'
    - label: newton (force)
      bin: Built from base units
      clue: Force = mass × acceleration. What units does that give?
      why: '1 N = 1 kg m s⁻²: built from base units.'
    - label: joule (energy)
      bin: Built from base units
      clue: Work = force × distance. What does that make?
      why: 1 J = 1 N m = 1 kg m² s⁻².
    - label: coulomb (charge)
      bin: Built from base units
      clue: Charge = current × time. Which units multiply?
      why: '1 C = 1 A s: built from the ampere and the second.'
    - label: watt (power)
      bin: Built from base units
      clue: Power = energy ÷ time. What is that in base units?
      why: 1 W = 1 J s⁻¹ = 1 kg m² s⁻³.
    - label: hertz (frequency)
      bin: Built from base units
      clue: Frequency counts per second. What unit is that?
      why: 1 Hz = 1 s⁻¹, built from the second.
  items:
  - prompt: How many SI base units are there?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - m, kg, s, A, K, mol, cd.
    - Count.
    solution: Seven.
    mistakes: {"3": "p11_si_base", "5": "p11_si_base"}
  - prompt: How many significant figures are in 0.00304?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Leading zeros don't count.
    - 3, 0, 4.
    solution: Three.
    mistakes:
      '6': c11p_sigfig
  - prompt: How many significant figures are in 2.500?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Trailing zeros after a decimal count.
    - 2, 5, 0, 0.
    solution: Four.
    mistakes: {"2": "p11_sig_zeros", "3": "p11_sig_zeros"}
  - prompt: Convert 5 km into metres.
    answer: '5000'
    check: 5*10**3
    difficulty: 1
    hints:
    - kilo = 10³.
    - 5 × 1000.
    solution: 5,000 m.
    mistakes: {"500": "p11_km_m", "50000": "p11_km_m"}
  - prompt: Which is the SI unit of force?
    options:
    - newton
    - joule
    - watt
    - pascal
    answer: newton
    difficulty: 1
    hints:
    - kg m s⁻².
    - Named after Newton.
    solution: Force is measured in newtons.
    mistakes: {"joule": "p11_units", "watt": "p11_units", "pascal": "p11_units"}
  - prompt: A rectangle measures 2.5 m by 1.25 m. Its area is 3.125 m². To how many significant figures should it be given?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 'Product: fewest significant figures.'
    - 2.5 has 2.
    solution: 'Two significant figures: 3.1 m².'
    mistakes: {"4": "p11_sig_product", "3": "p11_sig_product"}
- code: cbse11p.units.dims
  title: Dimensions and dimensional analysis
  after:
  - cbse11p.units.si
  notes: |
    Dimensions show how a quantity depends on base quantities [M], [L], [T]. Velocity [LT⁻¹]; acceleration [LT⁻²]; force
    [MLT⁻²]; work/energy [ML²T⁻²]; power [ML²T⁻³]; pressure [ML⁻¹T⁻²]. Dimensionless: angle, strain, refractive index.
    Uses: check equations (principle of homogeneity: each term must have the same dimensions), convert units, derive
    relations (pendulum period T ∝ √(l/g)). Limits: can't find pure-number constants or handle sums of terms.
  explanations:
    text: Every quantity can be written in terms of mass [M], length [L] and time [T]. Speed is [LT⁻¹]; force is [MLT⁻²]. A correct equation must have the same dimensions on both sides, so dimensions help you catch mistakes and even guess formulas.
    visual: 'Check v = u + at: [LT⁻¹] = [LT⁻¹] + [LT⁻²][T] = [LT⁻¹]. Every term matches, so the equation is dimensionally correct.'
    step_by_step: 'Step 1: Write each quantity''s dimensions. Step 2: Combine powers when multiplying (add) or dividing (subtract). Step 3: Compare both sides. Step 4: If they differ, the equation is wrong.'
    real_world: Engineers use dimensional checks to catch errors in spreadsheets before building bridges.
  picture:
    kind: compare
    columns:
    - title: Quantity
      points:
      - velocity
      - force
      - energy
    - title: Dimensions
      points:
      - '[LT⁻¹]'
      - '[MLT⁻²]'
      - '[ML²T⁻²]'
    alt: Velocity has dimensions [LT⁻¹], force [MLT⁻²] and energy [ML²T⁻²].
  activity:
    type: sort
    prompt: Sort each quantity by its dimensions.
    bins:
    - '[M L T⁻²]'
    - '[M L² T⁻²]'
    - '[M L⁻¹ T⁻²]'
    - '[L T⁻¹]'
    items:
    - label: Force
      bin: '[M L T⁻²]'
      clue: F = ma. What are the dimensions of mass × acceleration?
      why: Mass [M] × acceleration [L T⁻²] = [M L T⁻²].
    - label: Weight
      bin: '[M L T⁻²]'
      clue: Weight is mg. What kind of quantity is it?
      why: Weight is a force, so it is [M L T⁻²].
    - label: Work
      bin: '[M L² T⁻²]'
      clue: Work = force × distance. What does the extra length do?
      why: '[M L T⁻²] × [L] = [M L² T⁻²].'
    - label: Kinetic energy
      bin: '[M L² T⁻²]'
      clue: '½mv²: what are the dimensions of v²?'
      why: '[M] × [L T⁻¹]² = [M L² T⁻²]. The ½ has no dimensions.'
    - label: Torque
      bin: '[M L² T⁻²]'
      clue: Torque = force × perpendicular distance. Which quantity does it look like?
      why: Force × length gives [M L² T⁻²], the same as work, though torque is not energy.
    - label: Pressure
      bin: '[M L⁻¹ T⁻²]'
      clue: Pressure = force ÷ area. What does dividing by L² do?
      why: '[M L T⁻²] ÷ [L²] = [M L⁻¹ T⁻²].'
    - label: Stress
      bin: '[M L⁻¹ T⁻²]'
      clue: Stress is force per area. Like what?
      why: 'Force per area, like pressure: [M L⁻¹ T⁻²].'
    - label: Young's modulus
      bin: '[M L⁻¹ T⁻²]'
      clue: Y = stress ÷ strain. What are the dimensions of strain?
      why: Strain has no dimensions, so Y has the dimensions of stress.
    - label: Velocity
      bin: '[L T⁻¹]'
      clue: Distance per time. Any mass in it?
      why: Length ÷ time = [L T⁻¹].
    - label: Speed of light
      bin: '[L T⁻¹]'
      clue: It's a speed. What are speed's dimensions?
      why: Any speed is [L T⁻¹], however large.
  items:
  - prompt: What are the dimensions of force?
    options:
    - '[MLT⁻²]'
    - '[MLT⁻¹]'
    - '[ML²T⁻²]'
    - '[LT⁻²]'
    answer: '[MLT⁻²]'
    difficulty: 1
    hints:
    - F = ma.
    - '[M][LT⁻²].'
    solution: Force = mass × acceleration = [MLT⁻²].
    mistakes:
      '[ML²T⁻²]': c11p_dims
  - prompt: What are the dimensions of kinetic energy?
    options:
    - '[ML²T⁻²]'
    - '[MLT⁻²]'
    - '[ML²T⁻¹]'
    - '[MLT]'
    answer: '[ML²T⁻²]'
    difficulty: 1
    hints:
    - ½mv².
    - '[M][L²T⁻²].'
    solution: Energy is [ML²T⁻²].
    mistakes: {"[MLT⁻²]": "p11_dims_ke", "[ML²T⁻¹]": "p11_dims_ke", "[MLT]": "p11_dims_ke"}
  - prompt: Which quantity is dimensionless?
    options:
    - Strain
    - Speed
    - Force
    - Power
    answer: Strain
    difficulty: 2
    hints:
    - Ratio of two lengths.
    - No units.
    solution: 'Strain = change in length ÷ length: dimensionless.'
    mistakes: {"Speed": "p11_dimless", "Force": "p11_dimless", "Power": "p11_dimless"}
  - prompt: In [MᵃLᵇTᶜ] for pressure, what is b?
    options:
    - −1
    - '1'
    - '2'
    - −2
    answer: −1
    difficulty: 2
    hints:
    - Pressure = force/area.
    - '[MLT⁻²]/[L²].'
    solution: Pressure is [ML⁻¹T⁻²], so b = −1.
    mistakes: {"1": "p11_dims_pressure", "2": "p11_dims_pressure", "−2": "p11_dims_pressure"}
  - prompt: Which equation is dimensionally correct?
    options:
    - s = ut + ½at²
    - v = u + at²
    - s = u + at
    - v² = u + 2as
    answer: s = ut + ½at²
    difficulty: 2
    hints:
    - Each term should be a length.
    - ut and at² are lengths.
    solution: All terms in s = ut + ½at² have dimension [L].
    mistakes: {"v = u + at²": "p11_dims_check", "s = u + at": "p11_dims_check", "v² = u + 2as": "p11_dims_check"}
  - prompt: 'Dimensional analysis cannot find:'
    options:
    - dimensionless constants like ½ or 2π
    - whether an equation is consistent
    - how to convert units
    - the form of a simple relation
    answer: dimensionless constants like ½ or 2π
    difficulty: 2
    hints:
    - Pure numbers have no dimensions.
    - Limitation.
    solution: Pure-number constants can't be found by dimensions.
    mistakes: {"whether an equation is consistent": "p11_dims_limit", "how to convert units": "p11_dims_limit", "the form of a simple relation": "p11_dims_limit"}
