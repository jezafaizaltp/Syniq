# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse11-phy
chapter: 1
title: Units and Measurements
tips:
  c11p_sigfig: Leading zeros never count as significant figures; zeros between digits always do; trailing zeros after a decimal point do.
  c11p_dims: 'Write each quantity in M, L, T: velocity [LT⁻¹], acceleration [LT⁻²], force [MLT⁻²], energy [ML²T⁻²].'
concepts:
- code: cbse11p.units.si
  title: SI units and significant figures
  notes: |
    Physical quantities are measured in units. SI base units (7): metre (m), kilogram (kg), second (s), ampere (A),
    kelvin (K), mole (mol), candela (cd). Derived units: newton = kg m s⁻², joule = N m, watt = J s⁻¹. Prefixes: kilo 10³,
    mega 10⁶, milli 10⁻³, micro 10⁻⁶, nano 10⁻⁹. Significant figures: all non-zero digits; zeros between them; trailing
    zeros after a decimal point; not leading zeros (0.00304 has 3). Rounding: result of × or ÷ has as many significant
    figures as the least precise value; + or − as many decimal places as the least precise.
  explanations:
    text: 'Scientists all over the world use the same seven SI base units, like the metre, kilogram and second. Other units, like the newton and joule, are built from them. Significant figures show how precise a measurement is: 0.00304 has three, because the leading zeros only show where the decimal point is.'
    visual: 'Write 0.00304 and circle the digits that carry information: 3, 0, 4. The first zeros just hold place. In 2.500 all four digits count: the final zeros show the measurement was precise to a thousandth.'
    step_by_step: 'Step 1: Ignore leading zeros. Step 2: Count all non-zero digits. Step 3: Count zeros between them. Step 4: Count trailing zeros only if there is a decimal point.'
    real_world: Medicine doses are written in milligrams (10⁻³ g) or micrograms (10⁻⁶ g); getting the prefix right is a matter of safety.
  picture:
    kind: compare
    columns:
    - title: Quantity
      points:
      - length
      - mass
      - time
      - electric current
    - title: SI unit
      points:
      - metre (m)
      - kilogram (kg)
      - second (s)
      - ampere (A)
    alt: 'SI base units: the metre for length, kilogram for mass, second for time and ampere for current.'
  items:
  - prompt: How many SI base units are there?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - m, kg, s, A, K, mol, cd.
    - Count.
    solution: Seven.
  - prompt: How many significant figures are in 0.00304?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Leading zeros don't count.
    - 3, 0, 4.
    solution: Three.
    mistakes:
      '6': c11p_sigfig
  - prompt: How many significant figures are in 2.500?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Trailing zeros after a decimal count.
    - 2, 5, 0, 0.
    solution: Four.
  - prompt: Convert 5 km into metres.
    answer: '5000'
    check: 5*10**3
    difficulty: 1
    hints:
    - kilo = 10³.
    - 5 × 1000.
    solution: 5,000 m.
  - prompt: Which is the SI unit of force?
    options:
    - newton
    - joule
    - watt
    - pascal
    answer: newton
    difficulty: 1
    hints:
    - kg m s⁻².
    - Named after Newton.
    solution: Force is measured in newtons.
  - prompt: A rectangle measures 2.5 m by 1.25 m. Its area is 3.125 m². To how many significant figures should it be given?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 'Product: fewest significant figures.'
    - 2.5 has 2.
    solution: 'Two significant figures: 3.1 m².'
- code: cbse11p.units.dims
  title: Dimensions and dimensional analysis
  after:
  - cbse11p.units.si
  notes: |
    Dimensions show how a quantity depends on base quantities [M], [L], [T]. Velocity [LT⁻¹]; acceleration [LT⁻²]; force
    [MLT⁻²]; work/energy [ML²T⁻²]; power [ML²T⁻³]; pressure [ML⁻¹T⁻²]. Dimensionless: angle, strain, refractive index.
    Uses: check equations (principle of homogeneity: each term must have the same dimensions), convert units, derive
    relations (pendulum period T ∝ √(l/g)). Limits: can't find pure-number constants or handle sums of terms.
  explanations:
    text: Every quantity can be written in terms of mass [M], length [L] and time [T]. Speed is [LT⁻¹]; force is [MLT⁻²]. A correct equation must have the same dimensions on both sides, so dimensions help you catch mistakes and even guess formulas.
    visual: 'Check v = u + at: [LT⁻¹] = [LT⁻¹] + [LT⁻²][T] = [LT⁻¹]. Every term matches, so the equation is dimensionally correct.'
    step_by_step: 'Step 1: Write each quantity''s dimensions. Step 2: Combine powers when multiplying (add) or dividing (subtract). Step 3: Compare both sides. Step 4: If they differ, the equation is wrong.'
    real_world: Engineers use dimensional checks to catch errors in spreadsheets before building bridges.
  picture:
    kind: compare
    columns:
    - title: Quantity
      points:
      - velocity
      - force
      - energy
    - title: Dimensions
      points:
      - '[LT⁻¹]'
      - '[MLT⁻²]'
      - '[ML²T⁻²]'
    alt: Velocity has dimensions [LT⁻¹], force [MLT⁻²] and energy [ML²T⁻²].
  items:
  - prompt: What are the dimensions of force?
    options:
    - '[MLT⁻²]'
    - '[MLT⁻¹]'
    - '[ML²T⁻²]'
    - '[LT⁻²]'
    answer: '[MLT⁻²]'
    difficulty: 1
    hints:
    - F = ma.
    - '[M][LT⁻²].'
    solution: Force = mass × acceleration = [MLT⁻²].
    mistakes:
      '[ML²T⁻²]': c11p_dims
  - prompt: What are the dimensions of kinetic energy?
    options:
    - '[ML²T⁻²]'
    - '[MLT⁻²]'
    - '[ML²T⁻¹]'
    - '[MLT]'
    answer: '[ML²T⁻²]'
    difficulty: 1
    hints:
    - ½mv².
    - '[M][L²T⁻²].'
    solution: Energy is [ML²T⁻²].
  - prompt: Which quantity is dimensionless?
    options:
    - Strain
    - Speed
    - Force
    - Power
    answer: Strain
    difficulty: 2
    hints:
    - Ratio of two lengths.
    - No units.
    solution: 'Strain = change in length ÷ length: dimensionless.'
  - prompt: In [MᵃLᵇTᶜ] for pressure, what is b?
    options:
    - −1
    - '1'
    - '2'
    - −2
    answer: −1
    difficulty: 2
    hints:
    - Pressure = force/area.
    - '[MLT⁻²]/[L²].'
    solution: Pressure is [ML⁻¹T⁻²], so b = −1.
  - prompt: Which equation is dimensionally correct?
    options:
    - s = ut + ½at²
    - v = u + at²
    - s = u + at
    - v² = u + 2as
    answer: s = ut + ½at²
    difficulty: 2
    hints:
    - Each term should be a length.
    - ut and at² are lengths.
    solution: All terms in s = ut + ½at² have dimension [L].
  - prompt: 'Dimensional analysis cannot find:'
    options:
    - dimensionless constants like ½ or 2π
    - whether an equation is consistent
    - how to convert units
    - the form of a simple relation
    answer: dimensionless constants like ½ or 2π
    difficulty: 2
    hints:
    - Pure numbers have no dimensions.
    - Limitation.
    solution: Pure-number constants can't be found by dimensions.
