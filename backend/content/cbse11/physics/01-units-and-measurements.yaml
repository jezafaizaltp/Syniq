# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse11-phy
chapter: 1
title: Units and Measurements
tips:
  c11p_sigfig: Leading zeros never count as significant figures; zeros between digits always do; trailing zeros after a decimal point do.
  c11p_dims: "Write each quantity in M, L, T step by step: velocity [LT⁻¹], acceleration [LT⁻²]. Then build the one asked for from its formula."
  p11_dimless: "Write the units of each quantity. Which one is a length divided by a length, so the units cancel?"
  p11_dims_check: "Each term must have the same dimensions. Check every term of each equation for length, speed, etc."
  p11_dims_ke: "KE = ½mv². Write the dimensions of m and of v², then multiply."
  p11_dims_limit: "Pure numbers have no dimensions. Can a dimension check ever see them?"
  p11_dims_pressure: "Pressure = force ÷ area: [MLT⁻²] ÷ [L²]. Subtract the powers of L."
  p11_km_m: "1 km = 1000 m."
  p11_si_base: "List them: metre, kilogram, second, ampere, kelvin, mole and one for light. Count."
  p11_sig_product: "When multiplying, the answer keeps as many significant figures as the least precise measurement."
  p11_sig_zeros: "Trailing zeros after a decimal point are significant: they show how precisely you measured."
  p11_units: "Joule is energy, watt power, pascal pressure. Force is named after the man of the three laws."
  c11p01_sf: Count from the first non-zero digit. Zeros between digits count; trailing zeros after a decimal point count; leading zeros never do.
  c11p01_unit: Write the prefix as a power of ten, then multiply or divide.
  c11p01_dim: Replace each quantity by its dimensions in M, L and T, then collect the powers.
concepts:
- code: cbse11p.units.si
  title: SI units and significant figures
  notes: |
    Physical quantities are measured in units. SI base units (7): metre (m), kilogram (kg), second (s), ampere (A),
    kelvin (K), mole (mol), candela (cd). Derived units: newton = kg m s⁻², joule = N m, watt = J s⁻¹. Prefixes: kilo 10³,
    mega 10⁶, milli 10⁻³, micro 10⁻⁶, nano 10⁻⁹. Significant figures: all non-zero digits; zeros between them; trailing
    zeros after a decimal point; not leading zeros (0.00304 has 3). Rounding: result of × or ÷ has as many significant
    figures as the least precise value; + or − as many decimal places as the least precise.
  explanations:
    text: 'Scientists all over the world use the same seven SI base units, like the metre, kilogram and second. Other units, like the newton and joule, are built from them. Significant figures show how precise a measurement is: 0.00304 has three, because the leading zeros only show where the decimal point is.'
    visual: 'Write 0.00304 and circle the digits that carry information: 3, 0, 4. The first zeros just hold place. In 2.500 all four digits count: the final zeros show the measurement was precise to a thousandth.'
    step_by_step: 'Step 1: Ignore leading zeros. Step 2: Count all non-zero digits. Step 3: Count zeros between them. Step 4: Count trailing zeros only if there is a decimal point.'
    real_world: Medicine doses are written in milligrams (10⁻³ g) or micrograms (10⁻⁶ g); getting the prefix right is a matter of safety.
  picture:
    kind: compare
    columns:
    - title: Quantity
      points:
      - length
      - mass
      - time
      - electric current
    - title: SI unit
      points:
      - metre (m)
      - kilogram (kg)
      - second (s)
      - ampere (A)
    alt: 'SI base units: the metre for length, kilogram for mass, second for time and ampere for current.'
  activity:
    type: sort
    prompt: Is it one of the seven SI base units, or is it built from them?
    bins:
    - SI base unit
    - Built from base units
    items:
    - label: metre (length)
      bin: SI base unit
      clue: Can you write a metre using other units?
      why: Length is a base quantity; the metre is one of the seven base units.
    - label: kilogram (mass)
      bin: SI base unit
      clue: Is mass defined from length and time?
      why: Mass is a base quantity, measured in kilograms.
    - label: second (time)
      bin: SI base unit
      clue: Can time be broken into other quantities?
      why: 'Time is a base quantity: the second.'
    - label: ampere (current)
      bin: SI base unit
      clue: Is current one of the seven base quantities?
      why: Electric current is a base quantity, so the ampere is a base unit.
    - label: kelvin (temperature)
      bin: SI base unit
      clue: Is temperature measured in a base unit?
      why: 'Thermodynamic temperature is a base quantity: the kelvin.'
    - label: mole (amount)
      bin: SI base unit
      clue: Is 'amount of substance' a base quantity?
      why: 'Amount of substance is a base quantity: the mole.'
    - label: candela (light)
      bin: SI base unit
      clue: 'Luminous intensity: base or built?'
      why: 'Luminous intensity is the seventh base quantity: the candela.'
    - label: newton (force)
      bin: Built from base units
      clue: Force = mass × acceleration. What units does that give?
      why: '1 N = 1 kg m s⁻²: built from base units.'
    - label: joule (energy)
      bin: Built from base units
      clue: Work = force × distance. What does that make?
      why: 1 J = 1 N m = 1 kg m² s⁻².
    - label: coulomb (charge)
      bin: Built from base units
      clue: Charge = current × time. Which units multiply?
      why: '1 C = 1 A s: built from the ampere and the second.'
    - label: watt (power)
      bin: Built from base units
      clue: Power = energy ÷ time. What is that in base units?
      why: 1 W = 1 J s⁻¹ = 1 kg m² s⁻³.
    - label: hertz (frequency)
      bin: Built from base units
      clue: Frequency counts per second. What unit is that?
      why: 1 Hz = 1 s⁻¹, built from the second.
  lesson:
    - teach: 'Every measurement is a number and a unit. SI has 7 base units: metre, kilogram, second, ampere, kelvin, mole, candela. Other units, like the newton (kg m s⁻²), are built from them.'
      check:
        prompt: Which of these is an SI base unit?
        options:
        - kelvin
        - newton
        - joule
        answer: kelvin
        why: Newton and joule are derived from base units.
      ways:
      - style: visual
        teach: The seven SI base units and what each one measures.
        picture:
          kind: compare
          columns:
          - title: Mechanics
            points:
            - 'length: metre (m)'
            - 'mass: kilogram (kg)'
            - 'time: second (s)'
          - title: Electricity and heat
            points:
            - 'current: ampere (A)'
            - 'temperature: kelvin (K)'
          - title: Chemistry and light
            points:
            - 'amount: mole (mol)'
            - 'luminous intensity: candela (cd)'
          alt: 'The seven SI base units: metre, kilogram and second for mechanics; ampere and kelvin for electricity and heat; mole and candela for chemistry and light.'
      - style: real_world
        teach: 'A recipe from abroad says ''8 oz flour, bake at 350 °F''. Without a shared system you must convert everything. SI is that shared system: a scientist in Kochi and one in Kyoto both write 9.8 m s⁻² and mean the same thing.'
    - teach: 'Prefixes scale units by powers of ten: kilo 10³, centi 10⁻², milli 10⁻³, micro 10⁻⁶, nano 10⁻⁹. So 3 mm = 3 × 10⁻³ m.'
      check:
        prompt: 250 g in kilograms?
        options:
        - '0.25'
        - '2.5'
        - 250 000
        answer: '0.25'
        why: 1 g = 10⁻³ kg, so 250 × 10⁻³.
      ways:
      - style: step_by_step
        teach: 'Step 1: Spot the prefix. Step 2: Replace it with its power of ten: k → 10³, c → 10⁻², m → 10⁻³, μ → 10⁻⁶, n → 10⁻⁹. Step 3: Multiply. 3 mm = 3 × 10⁻³ m; 5 km = 5 × 10³ m.'
      - style: visual
        teach: Prefixes on a powers-of-ten ladder, from nano to kilo.
        picture:
          kind: number_line
          from: -9
          to: 3
          points:
          - at: -9
            label: nano 10⁻⁹
          - at: -6
            label: micro 10⁻⁶
          - at: -3
            label: milli 10⁻³
          - at: -2
            label: centi
          - at: 0
            label: base unit
          - at: 3
            label: kilo 10³
          alt: 'A line of powers of ten from minus 9 to 3: nano at minus 9, micro at minus 6, milli at minus 3, centi at minus 2, the base unit at 0 and kilo at 3.'
    - teach: Significant figures show how precise a value is. Leading zeros never count (0.0042 has 2). In × or ÷, the answer keeps as many significant figures as the least precise value.
      picture:
        kind: compare
        columns:
        - title: Number
          points:
          - '0.0042'
          - '3.00'
          - '1205'
        - title: Significant figures
          points:
          - '2'
          - '3'
          - '4'
        alt: Examples of counting significant figures.
      check:
        prompt: Significant figures in 6.020?
        options:
        - '4'
        - '3'
        - '2'
        answer: '4'
        why: 6, 0, 2 and the trailing zero after the decimal point.
      ways:
      - style: step_by_step
        teach: 'Step 1: Non-zero digits always count. Step 2: Zeros between them count. Step 3: Leading zeros never count. Step 4: Trailing zeros after a decimal point count: 2.500 has 4. Step 5: In × or ÷, round to the fewest significant figures of the inputs.'
      - style: real_world
        teach: 'A ruler marked in mm can''t tell you a length to a thousandth of a mm. If you measure 4.2 cm and 3.17 cm and multiply on a calculator, its 8 digits are fake precision: your answer can only be as good as the 4.2, so 2 figures.'
  items:
  - prompt: How many SI base units are there?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - m, kg, s, A, K, mol, cd.
    - Count.
    solution: "Seven: metre, kilogram, second, ampere, kelvin, mole and candela. Every other unit is built from these."
    mistakes: {"3": "p11_si_base", "5": "p11_si_base"}
  - prompt: How many significant figures are in 0.00304?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Leading zeros don't count.
    - 3, 0, 4.
    solution: "Leading zeros only place the decimal point and do not count; 3, 0, 4 count. So three."
    mistakes:
      '6': c11p_sigfig
  - prompt: How many significant figures are in 2.500?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Trailing zeros after a decimal count.
    - 2, 5, 0, 0.
    solution: "Trailing zeros after a decimal point are measured, so they count: 2, 5, 0, 0 gives four."
    mistakes: {"2": "p11_sig_zeros", "3": "p11_sig_zeros"}
  - prompt: Convert 5 km into metres.
    answer: '5000'
    check: 5*10**3
    difficulty: 1
    hints:
    - kilo = 10³.
    - 5 × 1000.
    solution: "1 km = 1,000 m, so 5 km = 5 × 1,000 = 5,000 m."
    mistakes: {"500": "p11_km_m", "50000": "p11_km_m"}
  - prompt: Which is the SI unit of force?
    options:
    - newton
    - joule
    - watt
    - pascal
    answer: newton
    difficulty: 1
    hints:
    - kg m s⁻².
    - "It is named after the scientist of the laws of motion."
    solution: Force is measured in newtons.
    mistakes: {"joule": "p11_units", "watt": "p11_units", "pascal": "p11_units"}
  - prompt: A rectangle measures 2.5 m by 1.25 m. Its area is 3.125 m². To how many significant figures should it be given?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 'Product: fewest significant figures.'
    - 2.5 has 2.
    solution: 'Two significant figures: 3.1 m².'
    mistakes: {"4": "p11_sig_product", "3": "p11_sig_product"}
  - prompt: How many significant figures are in 0.0570?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Leading zeros only place the decimal point.
    - A trailing zero after the point does count.
    solution: 'Step 1: digits 5, 7, 0 count. Step 2: 3.'
    mistakes:
      '5': c11p01_sf
      '2': c11p01_sf
  - prompt: Convert 3.6 km/h into m/s.
    answer: '1'
    check: 3.6*1000/3600
    difficulty: 1
    hints:
    - 1 km = 1000 m and 1 h = 3600 s.
    - Multiply by 1000, divide by 3600.
    solution: 'Step 1: 3.6 × 1000 / 3600. Step 2: 1 m/s.'
    mistakes:
      '3.6': c11p01_unit
      '12.96': c11p01_unit
  - prompt: Which is the SI unit of power?
    options:
    - watt
    - joule
    - pascal
    answer: watt
    difficulty: 1
    hints:
    - Power is energy per second.
    - J s⁻¹ has its own name.
    solution: 'Step 1: power = J/s. Step 2: watt.'
    mistakes:
      joule: c11p01_unit
      pascal: c11p01_unit
  - prompt: Write 4500 nm in metres.
    options:
    - 4.5 × 10⁻⁶ m
    - 4.5 × 10⁻⁹ m
    - 4.5 × 10⁻³ m
    answer: 4.5 × 10⁻⁶ m
    difficulty: 2
    hints:
    - 1 nm = 10⁻⁹ m.
    - 4500 = 4.5 × 10³.
    solution: 'Step 1: 4.5 × 10³ × 10⁻⁹. Step 2: 4.5 × 10⁻⁶ m.'
    mistakes:
      4.5 × 10⁻⁹ m: c11p01_unit
      4.5 × 10⁻³ m: c11p01_unit
  - prompt: How many significant figures are in 3.0 × 10⁴?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - The power of ten does not add figures.
    - Look only at 3.0.
    solution: 'Step 1: 3.0 has 3 and a trailing 0. Step 2: 2.'
    mistakes:
      '5': c11p01_sf
      '1': c11p01_sf
  - prompt: 12.5 + 1.25 + 0.125 should be written to how many decimal places?
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - For addition, look at decimal places, not significant figures.
    - Which value has the fewest decimal places?
    solution: 'Step 1: 12.5 has 1 decimal place. Step 2: answer 13.9 (1 place).'
    mistakes:
      '3': c11p01_sf
      '2': c11p01_sf
  - prompt: A length is 2.0 cm and a width 1.234 cm. Their product should keep how many significant figures?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - For multiplication use significant figures.
    - Find the less precise value.
    solution: 'Step 1: 2.0 has 2 s.f. Step 2: keep 2.'
    mistakes:
      '4': c11p01_sf
      '3': c11p01_sf
  - prompt: 1 light year is about 9.46 × 10¹⁵ m. Which unit is it a unit of?
    options:
    - distance
    - time
    - speed
    answer: distance
    difficulty: 1
    hints:
    - It is given in metres.
    - It is how far light goes in a year.
    solution: 'Step 1: value is in m. Step 2: a unit of distance.'
    mistakes:
      time: c11p01_unit
      speed: c11p01_unit
  - prompt: Round 2.745 to 3 significant figures (round 5 to the even digit).
    options:
    - '2.74'
    - '2.75'
    - '2.7'
    answer: '2.74'
    difficulty: 3
    hints:
    - Keep 2, 7, 4 and look at the next digit.
    - With a 5 followed by nothing, the kept digit ends even.
    solution: 'Step 1: next digit is 5, kept digit 4 is even. Step 2: 2.74.'
    mistakes:
      '2.75': c11p01_sf
      '2.7': c11p01_sf
  - prompt: 'Assertion (A): The number 0.00450 has three significant figures.

      Reason (R): Leading zeros are not significant, but trailing zeros after the decimal point are.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true. The leading zeros don''t count; 4, 5 and the trailing 0 do, giving 3: R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'The length and breadth of a sheet are 4.234 m and 1.005 m. The area, to the correct significant figures, is:'
    options:
    - 4.255 m²
    - 4.25517 m²
    - 4.3 m²
    answer: 4.255 m²
    hints:
    - Each length has 4 significant figures.
    - Round the product to that many.
    solution: 4.234 × 1.005 = 4.25517; both have 4 significant figures, so 4.255 m².
    mistakes:
      4.25517 m²: p11_sig_product
      4.3 m²: c11p01_sf
    exam: short
    difficulty: 2
  - prompt: Which of these is NOT an SI base unit?
    options:
    - Newton
    - Kelvin
    - Mole
    answer: Newton
    hints:
    - Which one can be written using other units?
    - Recall F = ma.
    solution: 'The newton is derived: kg m s⁻². Kelvin and mole are base units.'
    mistakes:
      Kelvin: p11_si_base
      Mole: p11_si_base
    exam: one_mark
    difficulty: 2
- code: cbse11p.units.dims
  title: Dimensions and dimensional analysis
  after:
  - cbse11p.units.si
  notes: |
    Dimensions show how a quantity depends on base quantities [M], [L], [T]. Velocity [LT⁻¹]; acceleration [LT⁻²]; force
    [MLT⁻²]; work/energy [ML²T⁻²]; power [ML²T⁻³]; pressure [ML⁻¹T⁻²]. Dimensionless: angle, strain, refractive index.
    Uses: check equations (principle of homogeneity: each term must have the same dimensions), convert units, derive
    relations (pendulum period T ∝ √(l/g)). Limits: can't find pure-number constants or handle sums of terms.
  explanations:
    text: Every quantity can be written in terms of mass [M], length [L] and time [T]. Speed is [LT⁻¹]; force is [MLT⁻²]. A correct equation must have the same dimensions on both sides, so dimensions help you catch mistakes and even guess formulas.
    visual: 'Check v = u + at: [LT⁻¹] = [LT⁻¹] + [LT⁻²][T] = [LT⁻¹]. Every term matches, so the equation is dimensionally correct.'
    step_by_step: 'Step 1: Write each quantity''s dimensions. Step 2: Combine powers when multiplying (add) or dividing (subtract). Step 3: Compare both sides. Step 4: If they differ, the equation is wrong.'
    real_world: Engineers use dimensional checks to catch errors in spreadsheets before building bridges.
  picture:
    kind: compare
    columns:
    - title: Quantity
      points:
      - velocity
      - force
      - energy
    - title: Dimensions
      points:
      - '[LT⁻¹]'
      - '[MLT⁻²]'
      - '[ML²T⁻²]'
    alt: Velocity has dimensions [LT⁻¹], force [MLT⁻²] and energy [ML²T⁻²].
  activity:
    type: sort
    prompt: Sort each quantity by its dimensions.
    bins:
    - '[M L T⁻²]'
    - '[M L² T⁻²]'
    - '[M L⁻¹ T⁻²]'
    - '[L T⁻¹]'
    items:
    - label: Force
      bin: '[M L T⁻²]'
      clue: F = ma. What are the dimensions of mass × acceleration?
      why: Mass [M] × acceleration [L T⁻²] = [M L T⁻²].
    - label: Weight
      bin: '[M L T⁻²]'
      clue: Weight is mg. What kind of quantity is it?
      why: Weight is a force, so it is [M L T⁻²].
    - label: Work
      bin: '[M L² T⁻²]'
      clue: Work = force × distance. What does the extra length do?
      why: '[M L T⁻²] × [L] = [M L² T⁻²].'
    - label: Kinetic energy
      bin: '[M L² T⁻²]'
      clue: '½mv²: what are the dimensions of v²?'
      why: '[M] × [L T⁻¹]² = [M L² T⁻²]. The ½ has no dimensions.'
    - label: Torque
      bin: '[M L² T⁻²]'
      clue: Torque = force × perpendicular distance. Which quantity does it look like?
      why: Force × length gives [M L² T⁻²], the same as work, though torque is not energy.
    - label: Pressure
      bin: '[M L⁻¹ T⁻²]'
      clue: Pressure = force ÷ area. What does dividing by L² do?
      why: '[M L T⁻²] ÷ [L²] = [M L⁻¹ T⁻²].'
    - label: Stress
      bin: '[M L⁻¹ T⁻²]'
      clue: Stress is force per area. Like what?
      why: 'Force per area, like pressure: [M L⁻¹ T⁻²].'
    - label: Young's modulus
      bin: '[M L⁻¹ T⁻²]'
      clue: Y = stress ÷ strain. What are the dimensions of strain?
      why: Strain has no dimensions, so Y has the dimensions of stress.
    - label: Velocity
      bin: '[L T⁻¹]'
      clue: Distance per time. Any mass in it?
      why: Length ÷ time = [L T⁻¹].
    - label: Speed of light
      bin: '[L T⁻¹]'
      clue: It's a speed. What are speed's dimensions?
      why: Any speed is [L T⁻¹], however large.
  lesson:
    - teach: Dimensions show how a quantity is built from mass [M], length [L] and time [T]. Speed = length/time, so [LT⁻¹]. Acceleration [LT⁻²]. Force = mass × acceleration = [MLT⁻²].
      check:
        prompt: Dimensions of momentum (mass × velocity)?
        options:
        - '[MLT⁻¹]'
        - '[MLT⁻²]'
        - '[ML²T⁻¹]'
        answer: '[MLT⁻¹]'
        why: '[M] × [LT⁻¹].'
      ways:
      - style: visual
        teach: Building dimensions up from length and time, one step at a time.
        picture:
          kind: flow
          steps:
          - Length [L]
          - Speed = L/T → [LT⁻¹]
          - Acceleration = speed/T → [LT⁻²]
          - Force = M × acc → [MLT⁻²]
          alt: 'Start from length, divide by time for speed, divide again for acceleration, multiply by mass for force: M L T to the minus 2.'
      - style: step_by_step
        teach: 'Step 1: Write the quantity''s defining formula. Step 2: Replace each quantity with its dimensions. Step 3: Combine the powers. Momentum mv: [M][LT⁻¹] = [MLT⁻¹]. Numbers like ½ or 2π have no dimensions.'
    - teach: 'Principle of homogeneity: every term in a correct equation has the same dimensions. So you can check an equation: v = u + at works because at has [LT⁻²][T] = [LT⁻¹].'
      check:
        prompt: Which term could be added to a length?
        options:
        - ½at²
        - at
        - a/t
        answer: ½at²
        why: '[LT⁻²][T²] = [L].'
      ways:
      - style: visual
        teach: 'Checking v = u + at term by term: every term must have the same dimensions.'
        picture:
          kind: compare
          columns:
          - title: v
            points:
            - '[LT⁻¹]'
          - title: u
            points:
            - '[LT⁻¹]'
          - title: at
            points:
            - '[LT⁻²][T] = [LT⁻¹]'
          alt: v, u, and a times t all have dimensions L T to the minus 1, so the equation v equals u plus at is dimensionally correct.
      - style: real_world
        teach: 'You can''t add 5 apples to 3 kilometres. A physics equation is the same: each term must be the same kind of quantity. If you find a speed added to an acceleration, the equation is wrong, however neat it looks.'
    - teach: Dimensional analysis can derive relations (pendulum T ∝ √(l/g)) and convert units, but it cannot find pure numbers like 2π, and fails for sums or for sin, log and exp.
      picture:
        kind: compare
        columns:
        - title: Can do
          points:
          - check equations
          - convert units
          - guess relations
        - title: Cannot do
          points:
          - find 2π or ½
          - handle sin or log
          - tell apart equal-dimension quantities
        alt: What dimensional analysis can and cannot do.
      check:
        prompt: 'Dimensional analysis cannot give:'
        options:
        - the 2π in T = 2π√(l/g)
        - that T depends on l and g
        - the unit of T
        answer: the 2π in T = 2π√(l/g)
        why: 2π has no dimensions.
      ways:
      - style: step_by_step
        teach: 'Step 1: Guess T ∝ lᵃgᵇ. Step 2: Write dimensions: [T] = [L]ᵃ[LT⁻²]ᵇ. Step 3: Match powers: T: −2b = 1, L: a + b = 0. Step 4: b = −½, a = ½, so T ∝ √(l/g). The 2π must come from experiment or theory.'
      - style: real_world
        teach: 'Dimensions are like checking a bill''s currency: they tell you the answer is in rupees, not whether it''s ₹100 or ₹200. So dimensional analysis gives T ∝ √(l/g) but can''t tell you the 2π in front.'
