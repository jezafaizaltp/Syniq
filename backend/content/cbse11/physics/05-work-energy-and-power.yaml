# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 5. Format: content/README.md.
subject: cbse11-phy
chapter: 5
title: Work, Energy and Power
tips:
  c11p_work_angle: Work = F s cos θ. Only the part of the force along the motion does work; at 90° the work is zero.
  c11p_ke_square: "Kinetic energy depends on v², not v. Square the factor by which the speed changes."
  p11_elastic: "Momentum is conserved in every collision. KE is conserved only when nothing is lost to heat, sound or deformation."
  p11_energy_cons: "mgh = ½mv², so v = √(2gh). Take the square root at the end."
  p11_ke: "KE = ½mv². Square v and don't forget the ½."
  p11_kwh: "Energy (kWh) = power in kW × hours. 100 W is 0.1 kW."
  p11_pe: "PE = mgh."
  p11_power: "P = work ÷ time."
  p11_power_fv: "P = F × v."
  p11_spring_energy: "U = ½kx². Square the extension."
  p11_work: "W = F × s when force and motion are in the same direction."
  p11_work_energy: "Net work = change in KE = ½m(v² − u²). Square each speed before subtracting."
  c11p05_work: "Work uses only the part of the force along the motion: W = Fs cos θ. Find the angle between the force and the motion."
  c11p05_ke: Kinetic energy has v squared, so square the speed before multiplying by ½m.
  c11p05_energy: "Break the quantity into its parts: power is a rate (per second), and a rate multiplied by a time gives a total. Track what is lost and what is gained."
concepts:
- code: cbse11p.wep.work
  title: Work and the work-energy theorem
  notes: |
    Work W = F·s = Fs cos θ (joule). Positive if force has a component along motion, negative if against (friction),
    zero if perpendicular (centripetal force, carrying a bag horizontally). Variable force: area under F–x graph.
    Kinetic energy K = ½mv². Work-energy theorem: net work = ΔK. Spring force F = −kx; work stored = ½kx².
  explanations:
    text: 'Work is done when a force moves something along its direction: W = Fs cos θ. If the force is at right angles to the motion, no work is done. The work done by the net force equals the change in kinetic energy, ½mv².'
    visual: 'Pull a suitcase with 50 N along a handle at 60° to the ground for 10 m. Only the forward part, 50 cos 60° = 25 N, does work: 25 × 10 = 250 J.'
    step_by_step: 'Step 1: Find the force and displacement. Step 2: Find the angle between them. Step 3: W = Fs cos θ. Step 4: For speed changes, set net work = ½mv² − ½mu².'
    real_world: 'A satellite in circular orbit: gravity is always at right angles to its motion, so it does no work and the speed stays the same.'
  picture:
    kind: compare
    columns:
    - title: Angle between F and s
      points:
      - 0°
      - 90°
      - 180°
    - title: Work
      points:
      - positive, maximum
      - zero
      - negative
    alt: When the force is along the motion work is positive, at 90° it is zero, and when opposite it is negative.
  activity:
    type: formula
    prompt: 'Work W = F s cos θ: only the part of the force along the motion does work.'
    inputs:
    - name: f
      label: Force F
      min: 0
      max: 50
      step: 5
      start: 0
      unit: N
    - name: s
      label: Distance s
      min: 0
      max: 20
      step: 1
      start: 0
      unit: m
    - name: c
      label: cos θ (angle between F and motion)
      min: -1
      max: 1
      step: 0.5
      start: 1
    outputs:
    - name: w
      label: Work done
      expr: f*s*c
      unit: J
    goals:
    - prompt: Pull a box 10 m with a 20 N rope at 60° to the ground.
      want:
        f: 20
        s: 10
        c: 0.5
      mistakes:
      - when:
          f: 20
          s: 10
          c: 1
        say: '200 J counts the whole pull, but only the part along the ground does work: cos 60° = 0.5.'
      - when:
          f: 20
          s: 10
          c: -0.5
        say: A negative cos θ would mean the rope pulls backwards. 60° gives cos θ = +0.5.
    - prompt: 'Carry a bag across a room: the force holds it up, the motion is sideways. Make the work 0, with F and s not 0.'
      want:
        w: 0
        f:
        - 5
        - 50
        s:
        - 1
        - 20
      mistakes:
      - when:
          c:
          - 0.5
          - 1
          f:
          - 5
          - 50
          s:
          - 1
          - 20
        say: Up and sideways are at 90°, and cos 90° = 0. Holding a bag while walking does no work on it.
    - prompt: Friction of 15 N acts on a block sliding 4 m. Make the work done by friction.
      want:
        f: 15
        s: 4
        w: -60
      mistakes:
      - when:
          f: 15
          s: 4
          c: 1
        say: '+60 J would mean friction helps the motion. It acts backwards: θ = 180°, cos θ = −1.'
  lesson:
    - teach: 'Work W = Fs cos θ, where θ is the angle between force and displacement. Unit: joule. Positive when the force helps the motion, negative when it opposes (friction), zero when perpendicular.'
      check:
        prompt: 'Carrying a bag while walking on level ground, the work done by your upward hold on the bag is:'
        options:
        - zero
        - positive
        - negative
        answer: zero
        why: 'The force is up, the motion is sideways: θ = 90°.'
      ways:
      - style: visual
        teach: The angle between force and motion decides the sign of the work.
        picture:
          kind: compare
          columns:
          - title: 'θ < 90°: positive'
            points:
            - pulling a cart forward
            - gravity on a falling ball
          - title: 'θ = 90°: zero'
            points:
            - carrying a bag on level ground
            - string on a whirling stone
          - title: 'θ > 90°: negative'
            points:
            - friction on a sliding box
            - brakes on a car
          alt: Work is positive when the force has a part along the motion, zero when it is at right angles, and negative when it opposes the motion, like friction.
      - style: step_by_step
        teach: 'Step 1: Find the force F and displacement s. Step 2: Find the angle θ between them. Step 3: W = Fs cos θ. Example: 30 N at 60° over 8 m: 30 × 8 × ½ = 120 J. Step 4: Check the sign from θ.'
    - teach: 'Kinetic energy K = ½mv². Work-energy theorem: net work on a body = change in its kinetic energy.'
      check:
        prompt: KE of a 4 kg trolley at 5 m/s?
        options:
        - 50 J
        - 10 J
        - 100 J
        answer: 50 J
        why: ½ × 4 × 25.
      ways:
      - style: visual
        teach: Kinetic energy of a 1 kg ball grows with the square of its speed.
        picture:
          kind: bars
          unit: J
          bars:
          - label: 1 m/s
            value: 0.5
          - label: 2 m/s
            value: 2
          - label: 3 m/s
            value: 4.5
          - label: 4 m/s
            value: 8
          alt: 'A 1 kilogram ball has 0.5 joules at 1 metre per second, 2 at 2, 4.5 at 3 and 8 at 4: each doubling of speed makes the energy four times larger.'
      - style: real_world
        teach: A car at 60 km/h needs about four times the braking distance it needs at 30 km/h, because its kinetic energy is four times as much and the brakes do roughly the same work per metre to remove it.
    - teach: For a varying force, work is the area under the F–x graph. A spring (F = −kx) stores ½kx² when stretched or squeezed by x.
      picture:
        kind: compare
        columns:
        - title: Angle θ
          points:
          - 0°
          - 90°
          - 180°
        - title: Work
          points:
          - +Fs
          - '0'
          - −Fs
        alt: How the angle changes the work done.
      check:
        prompt: Spring k = 400 N/m, squeezed 0.05 m. Energy stored?
        options:
        - 0.5 J
        - 10 J
        - 20 J
        answer: 0.5 J
        why: ½ × 400 × 0.0025.
      ways:
      - style: step_by_step
        teach: 'Step 1: Draw the F–x graph. Step 2: Work = area under it. Step 3: For a spring, F = kx gives a triangle: area ½ × x × kx = ½kx². Example: k = 400 N/m, x = 0.05 m: ½ × 400 × 0.0025 = 0.5 J.'
      - style: real_world
        teach: Stretching a gym spring gets harder the further you pull, because the force grows with x. The work you put in is stored, and released when you let go, which is how a catapult or a toy gun works.
  items:
  - prompt: A 20 N force moves a box 5 m in its own direction. Find the work done (in J).
    answer: '100'
    check: 20*5
    difficulty: 1
    hints:
    - W = Fs.
    - 20 × 5.
    solution: "W = Fs = 20 × 5 = 100 J."
    mistakes: {"4": "p11_work", "25": "p11_work"}
  - prompt: A 50 N force at 60° to the motion moves a suitcase 10 m. Find the work done (in J).
    answer: '250'
    check: 50*10*cos(pi/3)
    difficulty: 2
    hints:
    - W = Fs cos θ.
    - 50 × 10 × ½.
    solution: "W = Fs cos θ = 50 × 10 × 0.5 = 250 J."
    mistakes:
      '500': c11p_work_angle
  - prompt: Find the kinetic energy of a 2 kg ball moving at 3 m/s (in J).
    answer: '9'
    check: Rational(1,2)*2*9
    difficulty: 1
    hints:
    - ½mv².
    - ½ × 2 × 9.
    solution: "KE = ½mv² = ½ × 2 × 9 = 9 J."
    mistakes: {"18": "p11_ke", "6": "p11_ke", "3": "p11_ke"}
  - prompt: A 1 kg body speeds up from 2 m/s to 4 m/s. Find the net work done on it (in J).
    answer: '6'
    check: Rational(1,2)*(16-4)
    difficulty: 2
    hints:
    - ΔK = ½m(v² − u²).
    - ½ × (16 − 4).
    solution: "Work–energy theorem: W = ½m(v² − u²) = ½ × 1 × (16 − 4) = 6 J."
    mistakes: {"2": "p11_work_energy", "12": "p11_work_energy", "4": "p11_work_energy"}
  - prompt: A spring with k = 200 N/m is stretched 0.1 m. Find the energy stored (in J).
    answer: '1'
    check: Rational(1,2)*200*Rational(1,100)
    difficulty: 2
    hints:
    - ½kx².
    - ½ × 200 × 0.01.
    solution: "U = ½kx² = ½ × 200 × 0.01 = 1 J."
    mistakes: {"2": "p11_spring_energy", "20": "p11_spring_energy", "10": "p11_spring_energy"}
  - prompt: 'If a car''s speed doubles, its kinetic energy becomes:'
    options:
    - 4 times
    - 2 times
    - the same
    - half
    answer: 4 times
    difficulty: 1
    hints:
    - KE ∝ v².
    - 2² = 4.
    solution: "KE = ½mv², so doubling v gives 2² = 4 times the KE."
    mistakes:
      2 times: c11p_ke_square
  - prompt: A 15 N force pushes a cart 4 m in its own direction. Find the work done (in J).
    answer: '60'
    check: 15*4
    difficulty: 1
    hints:
    - θ = 0°, cos 0° = 1.
    - W = Fs.
    solution: 'Step 1: 15 × 4. Step 2: 60 J.'
    mistakes:
      '19': c11p05_work
      '3.75': c11p05_work
  - prompt: Find the kinetic energy of a 0.1 kg ball at 20 m/s (in J).
    answer: '20'
    check: 0.5*0.1*400
    difficulty: 1
    hints:
    - K = ½mv².
    - v² = 400.
    solution: 'Step 1: ½ × 0.1 × 400. Step 2: 20 J.'
    mistakes:
      '1': c11p05_ke
      '2': c11p05_ke
  - prompt: 'Friction does work on a sliding box. That work is:'
    options:
    - negative
    - positive
    - zero
    answer: negative
    difficulty: 1
    hints:
    - Friction points against the motion.
    - cos 180° = −1.
    solution: 'Step 1: θ = 180°. Step 2: W < 0.'
    mistakes:
      positive: c11p05_work
      zero: c11p05_work
  - prompt: A 40 N force at 60° to the ground pulls a sledge 5 m. Find the work done (in J).
    answer: '100'
    check: 40*5*0.5
    difficulty: 2
    hints:
    - Use cos 60°.
    - cos 60° = ½.
    solution: 'Step 1: 40 × 5 × ½. Step 2: 100 J.'
    mistakes:
      '200': c11p05_work
      '173': c11p05_work
  - prompt: A 2 kg cart speeds up from 3 m/s to 5 m/s. Find the net work done on it (in J).
    answer: '16'
    check: 0.5*2*(25-9)
    difficulty: 2
    hints:
    - Net work = change in KE.
    - ½m(v² − u²).
    solution: 'Step 1: 1 × (25 − 9). Step 2: 16 J.'
    mistakes:
      '4': c11p05_ke
      '2': c11p05_ke
  - prompt: A spring stores 2 J when stretched 0.1 m. Find its spring constant (in N/m).
    answer: '400'
    check: 2*2/0.01
    difficulty: 2
    hints:
    - Energy = ½kx².
    - Solve for k.
    solution: 'Step 1: 2 = ½k(0.01). Step 2: k = 400 N/m.'
    mistakes:
      '20': c11p05_work
      '200': c11p05_work
  - prompt: 'A satellite moves in a circular orbit. The work done by gravity on it per round is:'
    options:
    - zero
    - positive
    - negative
    answer: zero
    difficulty: 2
    hints:
    - Gravity points to the centre.
    - The motion is along the circle.
    solution: 'Step 1: force ⟂ motion at every point. Step 2: W = 0.'
    mistakes:
      positive: c11p05_work
      negative: c11p05_work
  - prompt: 'Two bodies have equal momentum; one has 4 times the mass of the other. Ratio KE(heavy) : KE(light) = ?'
    options:
    - '1 : 4'
    - '4 : 1'
    - '1 : 1'
    answer: '1 : 4'
    difficulty: 3
    hints:
    - K = p²/2m.
    - Same p, so K ∝ 1/m.
    solution: 'Step 1: K = p²/2m. Step 2: heavy has ¼ the KE: 1 : 4.'
    mistakes:
      '4 : 1': c11p05_ke
      '1 : 1': c11p05_ke
  - prompt: Force rises steadily from 0 to 10 N over 4 m. Find the work done (in J).
    answer: '20'
    check: 0.5*4*10
    difficulty: 3
    hints:
    - Work = area under F–x.
    - It is a triangle.
    solution: 'Step 1: ½ × 4 × 10. Step 2: 20 J.'
    mistakes:
      '40': c11p05_work
      '10': c11p05_work
  - prompt: 'Assertion (A): The work done by the centripetal force on a body in uniform circular motion is zero.

      Reason (R): The centripetal force is always perpendicular to the body''s displacement.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true. With θ = 90°, cos θ = 0, so W = 0: R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A 1000 kg car speeds up from 10 m/s to 20 m/s. How much net work is done on it?'
    options:
    - 150000 J
    - 50000 J
    - 200000 J
    answer: 150000 J
    hints:
    - Find K before and after.
    - Work = change in K.
    solution: K₁ = ½ × 1000 × 100 = 50000 J; K₂ = 200000 J. W = 150000 J.
    mistakes:
      50000 J: p11_work_energy
      200000 J: c11p_ke_square
    exam: case
    difficulty: 2
  - prompt: 'If the speed of a body is doubled, its kinetic energy becomes:'
    options:
    - 4 times
    - 2 times
    - half
    answer: 4 times
    hints:
    - K = ½mv².
    - What happens to v² when v doubles?
    solution: v² becomes (2v)² = 4v², so K becomes 4 times.
    mistakes:
      2 times: c11p_ke_square
      half: p11_ke
    exam: one_mark
    difficulty: 2
- code: cbse11p.wep.energy
  title: Potential energy, conservation and power
  after:
  - cbse11p.wep.work
  notes: |
    Gravitational PE near the Earth: mgh. Conservative forces (gravity, spring): work independent of path; mechanical energy
    K + U is conserved when only they act. Falling from height h: v = √(2gh). Non-conservative (friction) convert energy
    to heat. Power P = W/t = Fv (watt); 1 hp = 746 W; kWh is a unit of energy (3.6 × 10⁶ J). Collisions: momentum always
    conserved; KE conserved only in elastic collisions.
  explanations:
    text: 'Potential energy is stored energy, like mgh for a raised object. When only gravity or springs act, kinetic + potential energy stays constant: a falling stone loses PE and gains the same KE. Power is how fast work is done: P = W/t.'
    visual: 'A 2 kg ball held 5 m up has PE = 2 × 10 × 5 = 100 J (g = 10). Halfway down: 50 J PE + 50 J KE. Just before landing: 100 J KE, speed √(2gh) = 10 m/s.'
    step_by_step: 'Step 1: Find energy at the start (KE + PE). Step 2: Find energy at the end. Step 3: Set them equal (no friction). Step 4: Solve for the unknown. Step 5: Power = energy ÷ time.'
    real_world: 'Electricity bills count ''units'': 1 unit = 1 kWh. A 100 W bulb on for 10 hours uses 1 unit.'
  picture:
    kind: bars
    bars:
    - label: 'Top: PE'
      value: 100
    - label: 'Top: KE'
      value: 0
    - label: 'Middle: PE'
      value: 50
    - label: 'Middle: KE'
      value: 50
    - label: 'Bottom: PE'
      value: 0
    - label: 'Bottom: KE'
      value: 100
    alt: 'As a 2 kg ball falls 5 m, its potential energy turns into kinetic energy: 100 and 0 joules at the top, 50 and 50 halfway, 0 and 100 at the bottom.'
    unit: J
  activity:
    type: formula
    prompt: A squashed spring stores ½kx². Released, it turns that energy into the ball's ½mv².
    inputs:
    - name: k
      label: Spring constant k
      min: 100
      max: 1000
      step: 100
      start: 100
      unit: N/m
    - name: x
      label: Squeeze x
      min: 0
      max: 0.5
      step: 0.05
      start: 0
      unit: m
    - name: m
      label: Ball's mass
      min: 0.5
      max: 5
      step: 0.5
      start: 0.5
      unit: kg
    outputs:
    - name: pe
      label: Energy stored
      expr: 0.5*k*x^2
      unit: J
      places: 2
    - name: v
      label: Launch speed
      expr: sqrt(k*x^2/m)
      unit: m/s
      places: 2
    goals:
    - prompt: Store 8 J in a 400 N/m spring.
      want:
        k: 400
        pe: 8
      mistakes:
      - when:
          k: 400
          x: 0.4
        say: 'Doubling x stores 4 times the energy: 0.4 m gives 32 J. E = ½kx².'
      - when:
          k: 400
          x: 0.1
        say: 0.1 m stores only 2 J. Energy grows with x².
    - prompt: Launch a 1 kg ball at 4 m/s with k = 100 N/m.
      want:
        k: 100
        m: 1
        v: 4
      mistakes:
      - when:
          k: 100
          m: 1
          x: 0.2
        say: 0.2 m gives 2 m/s. Here v grows in step with x, so double the squeeze.
    - prompt: Keep k = 100 and x = 0.4 m. Choose the mass so the ball leaves at 2 m/s.
      want:
        k: 100
        x: 0.4
        v: 2
      mistakes:
      - when:
          k: 100
          x: 0.4
          m: 2
        say: 'Twice the mass gives 4 ÷ √2 ≈ 2.83 m/s, not half: the energy is shared out as ½mv², so v falls as 1/√m.'
  lesson:
    - teach: 'Gravitational potential energy near the Earth is mgh. A spring stores ½kx². These come from conservative forces: their work depends only on start and end points.'
      check:
        prompt: PE of a 3 kg pot on a 2 m shelf (g = 10)?
        options:
        - 60 J
        - 6 J
        - 30 J
        answer: 60 J
        why: 3 × 10 × 2.
      ways:
      - style: visual
        teach: 'A 3 kg ball falling 4 m: potential energy turns into kinetic energy (g = 10).'
        picture:
          kind: bars
          unit: J
          bars:
          - label: 'top: PE'
            value: 120
          - label: 'top: KE'
            value: 0
          - label: 'half way: PE'
            value: 60
          - label: 'half way: KE'
            value: 60
          - label: 'bottom: KE'
            value: 120
          alt: At the top the ball has 120 joules of potential energy and none kinetic; half way down 60 and 60; at the bottom 120 joules kinetic. The total stays 120.
      - style: step_by_step
        teach: 'Step 1: U = mgh near the Earth. Step 2: Ask if the force is conservative (gravity, spring) or not (friction). Step 3: For a conservative force, work depends only on start and end height, not the path.'
    - teach: If only conservative forces act, mechanical energy K + U stays constant. A body falling from height h reaches v = √(2gh). Friction turns some energy into heat.
      check:
        prompt: 'A ball dropped from 20 m (g = 10) hits the ground at:'
        options:
        - 20 m/s
        - 200 m/s
        - 10 m/s
        answer: 20 m/s
        why: √(2 × 10 × 20) = 20.
      ways:
      - style: visual
        teach: Following the energy of a body dropped from height h with no friction.
        picture:
          kind: flow
          steps:
          - 'At the top: K = 0, U = mgh'
          - 'Falling: U drops, K grows by the same amount'
          - 'At the bottom: U = 0, K = mgh'
          - ½mv² = mgh, so v = √(2gh)
          alt: At the top all the energy is potential; as the body falls potential energy turns into kinetic energy; at the bottom all of it is kinetic, giving v equals root 2gh.
      - style: real_world
        teach: 'A roller coaster climbs slowly to the highest hill, then needs no engine: height turns into speed on the way down and speed back into height on the next hump. Each hump is a little lower, as friction takes some energy as heat and sound.'
    - teach: Power P = W/t = Fv, in watts. 1 kWh = 3.6 × 10⁶ J is a unit of energy. In every collision momentum is conserved; kinetic energy is conserved only in elastic ones.
      picture:
        kind: flow
        steps:
        - 'Top: all PE'
        - 'Halfway: half PE, half KE'
        - 'Bottom: all KE'
        alt: Energy changing form as a body falls.
      check:
        prompt: A 1 kW heater runs for 3 h. Energy used?
        options:
        - 3 kWh
        - 3000 kWh
        - 0.33 kWh
        answer: 3 kWh
        why: 1 kW × 3 h.
      ways:
      - style: step_by_step
        teach: 'Step 1: Power = work ÷ time, in watts. Step 2: For a steady force at speed v: P = Fv. Step 3: Energy bills use kWh: a 1 kW heater for 1 hour = 3.6 × 10⁶ J. Step 4: In elastic collisions both momentum and KE are conserved; in others only momentum.'
      - style: real_world
        teach: Two students climb the same staircase, doing the same work. The one who runs up in 10 s develops more power than the one who walks up in 30 s. Power measures how fast energy is used, not how much.
  items:
  - prompt: Find the potential energy of a 2 kg ball 5 m above the ground. Take g = 10 m/s² (in J).
    answer: '100'
    check: 2*10*5
    difficulty: 1
    hints:
    - mgh.
    - 2 × 10 × 5.
    solution: "PE = mgh = 2 × 10 × 5 = 100 J."
    mistakes: {"10": "p11_pe", "50": "p11_pe"}
  - prompt: A stone is dropped from 5 m. Taking g = 10 m/s², find its speed just before hitting the ground (in m/s).
    answer: '10'
    check: sqrt(2*10*5)
    difficulty: 2
    hints:
    - v = √(2gh).
    - √100.
    solution: "mgh = ½mv², so v = √(2gh) = √(2 × 10 × 5) = √100 = 10 m/s."
    mistakes: {"100": "p11_energy_cons", "50": "p11_energy_cons"}
  - prompt: A motor does 6000 J of work in 30 s. Find its power (in W).
    answer: '200'
    check: 6000/30
    difficulty: 1
    hints:
    - P = W/t.
    - 6000/30.
    solution: "P = W/t = 6000/30 = 200 W."
    mistakes: {"180000": "p11_power", "20": "p11_power"}
  - prompt: A 100 W bulb is on for 10 hours. How many kWh does it use?
    answer: '1'
    check: Rational(100,1000)*10
    difficulty: 1
    hints:
    - Energy = power × time.
    - 0.1 kW × 10 h.
    solution: "Energy = 0.1 kW × 10 h = 1 kWh."
    mistakes: {"1000": "p11_kwh", "10": "p11_kwh"}
  - prompt: In which collision is kinetic energy conserved?
    options:
    - Elastic collision
    - Inelastic collision
    - Perfectly inelastic collision
    - None
    answer: Elastic collision
    difficulty: 1
    hints:
    - Bounce without loss.
    - Ideal.
    solution: Only elastic collisions conserve KE.
    mistakes: {"Inelastic collision": "p11_elastic", "Perfectly inelastic collision": "p11_elastic", "None": "p11_elastic"}
  - prompt: A car engine exerts 2000 N at a steady 15 m/s. Find the power (in W).
    answer: '30000'
    check: 2000*15
    difficulty: 2
    hints:
    - P = Fv.
    - 2000 × 15.
    solution: "P = Fv = 2000 × 15 = 30,000 W (30 kW)."
    mistakes: {"2015": "p11_power_fv", "133": "p11_power_fv"}
  - prompt: Find the PE of a 50 kg climber 10 m up a wall (g = 10) (in J).
    answer: '5000'
    check: 50*10*10
    difficulty: 1
    hints:
    - PE = mgh.
    - 50 × 10 × 10.
    solution: 'Step 1: mgh. Step 2: 5000 J.'
    mistakes:
      '500': c11p05_energy
      '70': c11p05_energy
  - prompt: A pump does 9000 J of work in 1 minute. Find its power (in W).
    answer: '150'
    check: 9000/60
    difficulty: 1
    hints:
    - Power = work ÷ time in seconds.
    - 1 minute = 60 s.
    solution: 'Step 1: 9000/60. Step 2: 150 W.'
    mistakes:
      '9000': c11p05_energy
      '540000': c11p05_energy
  - prompt: 'The kilowatt hour is a unit of:'
    options:
    - energy
    - power
    - force
    answer: energy
    difficulty: 1
    hints:
    - kW × h.
    - Power × time.
    solution: 'Step 1: power × time = energy. Step 2: energy.'
    mistakes:
      power: c11p05_energy
      force: c11p05_energy
  - prompt: A ball is dropped from 45 m (g = 10). Find its speed on reaching the ground (in m/s).
    answer: '30'
    check: (2*10*45)**0.5
    difficulty: 2
    hints:
    - mgh = ½mv².
    - v = √(2gh).
    solution: 'Step 1: √900. Step 2: 30 m/s.'
    mistakes:
      '900': c11p05_energy
      '45': c11p05_energy
  - prompt: A 600 W motor lifts a 30 kg load at steady speed (g = 10). Find the speed (in m/s).
    answer: '2'
    check: 600/300
    difficulty: 2
    hints:
    - P = Fv.
    - F = weight = 300 N.
    solution: 'Step 1: 600 = 300v. Step 2: v = 2 m/s.'
    mistakes:
      '20': c11p05_energy
      '0.5': c11p05_energy
  - prompt: A pendulum bob passes its lowest point at 2 m/s (g = 10). How high above that point does it rise (in m)?
    answer: '0.2'
    check: 4/20
    difficulty: 2
    hints:
    - All KE at the bottom becomes PE at the top.
    - h = v²/2g.
    solution: 'Step 1: 4/20. Step 2: 0.2 m.'
    mistakes:
      '0.4': c11p05_energy
      '2': c11p05_energy
  - prompt: 'In a perfectly inelastic collision (bodies stick):'
    options:
    - momentum is conserved but some KE is lost
    - both momentum and KE are conserved
    - neither is conserved
    answer: momentum is conserved but some KE is lost
    difficulty: 2
    hints:
    - Momentum is conserved in every collision.
    - Sticking means some energy becomes heat and sound.
    solution: 'Step 1: p conserved. Step 2: KE partly lost.'
    mistakes:
      both momentum and KE are conserved: c11p05_energy
      neither is conserved: c11p05_energy
  - prompt: A 1 kg block slides down a 5 m rough slope from rest and reaches 8 m/s at the bottom (drop 5 m, g = 10). How much energy went to friction (in J)?
    answer: '18'
    check: 50-32
    difficulty: 3
    hints:
    - PE lost = mgh.
    - KE gained = ½mv². The rest is heat.
    solution: 'Step 1: PE 50 J, KE 32 J. Step 2: 18 J to friction.'
    mistakes:
      '32': c11p05_energy
      '50': c11p05_energy
  - prompt: A 2 kg ball at 4 m/s hits a 2 kg ball at rest in an elastic head-on collision. Speed of the second ball after (in m/s)?
    answer: '4'
    check: '4'
    difficulty: 3
    hints:
    - Equal masses, elastic, head-on.
    - They swap velocities.
    solution: 'Step 1: equal masses exchange velocities. Step 2: 4 m/s.'
    mistakes:
      '2': c11p05_energy
      '0': c11p05_energy
  - prompt: 'Assertion (A): In an inelastic collision, the total momentum is conserved.

      Reason (R): In an inelastic collision, the total kinetic energy is conserved.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is true, but R is false
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is true: momentum is conserved in every collision without outside force. R is false: some kinetic energy turns into heat, sound or deformation.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_r
      Both A and R are true, but R does not explain A: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Situation: A 1.5 kW electric iron is used for 2 hours a day for 30 days. At ₹8 per unit (kWh), what is the cost?'
    options:
    - ₹720
    - ₹360
    - ₹24
    answer: ₹720
    hints:
    - Energy = power × time in kWh.
    - 1.5 × 2 × 30 units.
    solution: 1.5 × 2 × 30 = 90 kWh; 90 × 8 = ₹720.
    mistakes:
      ₹360: p11_kwh
      ₹24: p11_power
    exam: competency
    difficulty: 2
  - prompt: A pump lifts 200 kg of water through 10 m in 20 s. Find its power (g = 10 m/s²).
    options:
    - 1000 W
    - 20000 W
    - 100 W
    answer: 1000 W
    hints:
    - Work = mgh.
    - Power = work/time.
    solution: W = 200 × 10 × 10 = 20000 J; P = 20000/20 = 1000 W.
    mistakes:
      20000 W: p11_power
      100 W: c11p05_energy
    exam: short
    difficulty: 2
