# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 6. Format: content/README.md.
subject: cbse11-phy
chapter: 6
title: System of Particles and Rotational Motion
tips:
  c11p_torque: Torque = force × perpendicular distance from the axis. Push far from the hinge for more turning effect.
  c11p_angular_momentum: 'With no external torque, Iω stays constant: if I goes down, ω goes up.'
  p11_balance: "Balance torques: m₁d₁ = m₂d₂. The heavier child sits closer."
  p11_com: "x_cm = (m₁x₁ + m₂x₂)/(m₁ + m₂). The heavier mass pulls the centre towards itself."
  p11_disc_i: "For a disc, I = ½MR²."
  p11_equilibrium: "A body can have zero net force and still spin. What else must vanish?"
  p11_ring_com: "By symmetry every bit of the ring has a partner directly opposite. Where do they balance?"
  p11_ring_i: "For a ring, I = MR². Square the radius."
  p11_rot_ke: "Rotational KE = ½Iω²."
  p11_torque: "Torque = force × distance from the pivot. Try pushing a door near its hinges."
  p11_torque_alpha: "τ = Iα, so α = τ/I."
  p11_v_omega: "v = ωr, so ω = v/r."
  c11p06_com: Multiply each mass by its position, add, then divide by the total mass.
  c11p06_tq: Torque = force × perpendicular distance from the pivot. Balance means clockwise torque equals anticlockwise torque.
  c11p06_rot: 'Match the rotational formula to its straight-line twin: m ↔ I, v ↔ ω, F ↔ τ, p ↔ L.'
concepts:
- code: cbse11p.rot.com
  title: Centre of mass and torque
  notes: |
    Centre of mass: x_cm = Σmᵢxᵢ/Σmᵢ; for symmetric uniform bodies at the geometric centre. It moves as if all external
    forces acted on the total mass there. Torque τ = r × F, magnitude rF sin θ (N m) = force × perpendicular distance.
    Equilibrium of a rigid body: net force = 0 and net torque = 0 (principle of moments: clockwise = anticlockwise).
    Centre of gravity coincides with centre of mass in uniform g.
  explanations:
    text: 'The centre of mass is the average position of the mass; a body balances there. Torque is the turning effect of a force: force × perpendicular distance from the pivot. For a body to balance, the clockwise and anticlockwise torques must be equal.'
    visual: 'A see-saw: a 30 kg child sits 2 m from the pivot. Where should a 40 kg child sit? 30 × 2 = 40 × d, so d = 1.5 m.'
    step_by_step: 'Step 1: Choose the pivot. Step 2: For each force, find its perpendicular distance. Step 3: Torque = F × d. Step 4: Set clockwise = anticlockwise for balance.'
    real_world: Door handles are placed far from the hinges so a small push gives a big torque.
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 5
      P:
      - 5
      - 4
      B:
      - 8
      - 5
      _L:
      - 1
      - 4
      _R:
      - 8
      - 4
    segments:
    - - A
      - B
    - - A
      - P
      - 2 m (30 kg)
    - - P
      - B
      - 1.5 m (40 kg)
    alt: 'A see-saw balanced on a pivot P: 30 kg at 2 m on one side and 40 kg at 1.5 m on the other.'
  activity:
    type: formula
    prompt: Mass m₁ sits at 0 and mass m₂ at the far end of a light rod of length L. The centre of mass is at m₂L ÷ (m₁ + m₂).
    inputs:
    - name: a
      label: m₁ (at 0)
      min: 1
      max: 10
      step: 1
      start: 1
      unit: kg
    - name: b
      label: m₂ (at the end)
      min: 1
      max: 10
      step: 1
      start: 1
      unit: kg
    - name: l
      label: Rod length L
      min: 1
      max: 10
      step: 1
      start: 1
      unit: m
    outputs:
    - name: xcm
      label: Centre of mass from m₁
      expr: b*l/(a+b)
      unit: m
      places: 2
    goals:
    - prompt: m₁ = 2 kg and the rod is 4 m long. Choose m₂ so the centre of mass is 3 m from m₁.
      want:
        a: 2
        l: 4
        xcm: 3
      mistakes:
      - when:
          a: 2
          l: 4
          b:
          - 1
          - 2
        say: With m₂ no heavier than m₁, the centre is at or before the middle (2 m). It moves toward the heavier mass.
      - when:
          a: 2
          l: 4
          b: 3
        say: m₂ = 3 puts it at 2.4 m. The centre sits 3 times as far from m₁ as from m₂, so m₂ must be 3 times m₁.
    - prompt: Make the centre of mass sit exactly in the middle of a 6 m rod.
      want:
        l: 6
        xcm: 3
      mistakes:
      - when:
          l: 6
          xcm:
          - 0.1
          - 2.9
        say: It's nearer m₁, so m₁ is heavier. The middle needs equal masses.
      - when:
          l: 6
          xcm:
          - 3.1
          - 5.9
        say: It's nearer m₂, so m₂ is heavier. The middle needs equal masses.
    - prompt: A 1 kg and a 9 kg mass sit at the ends of a 10 m rod. Put the 1 kg mass at 0 and find the centre.
      want:
        a: 1
        b: 9
        l: 10
      mistakes:
      - when:
          a: 9
          b: 1
          l: 10
        say: 'That puts the 9 kg mass at 0. Swap them: m₁ = 1 kg sits at 0.'
  lesson:
    - teach: 'The centre of mass is the mass-weighted average position: x_cm = Σmᵢxᵢ / Σmᵢ. For a uniform symmetric body it is at the geometric centre, even if no mass is there (a ring).'
      check:
        prompt: 1 kg at x = 0 and 1 kg at x = 4 m. Centre of mass?
        options:
        - 2 m
        - 4 m
        - 0 m
        answer: 2 m
        why: 'Equal masses: halfway.'
      ways:
      - style: visual
        teach: '4 kg at x = 0 and 1 kg at x = 5 m: the centre of mass sits nearer the heavier mass.'
        picture:
          kind: number_line
          from: 0
          to: 5
          points:
          - at: 0
            label: 4 kg
          - at: 1
            label: centre of mass
          - at: 5
            label: 1 kg
          alt: On a line from 0 to 5 metres, a 4 kilogram mass at 0 and a 1 kilogram mass at 5 have their centre of mass at 1 metre, closer to the heavier one.
      - style: step_by_step
        teach: 'Step 1: Multiply each mass by its position. Step 2: Add these products. Step 3: Divide by the total mass. (4 × 0 + 1 × 5)/(4 + 1) = 5/5 = 1 m. Step 4: Check: it must lie between the masses, nearer the heavier one.'
    - teach: 'Torque is the turning effect of a force: τ = rF sin θ = force × perpendicular distance from the axis. Unit N m. A longer spanner gives more torque for the same force.'
      check:
        prompt: 10 N applied at right angles, 0.3 m from a hinge. Torque?
        options:
        - 3 N m
        - 30 N m
        - 0.03 N m
        answer: 3 N m
        why: 10 × 0.3.
      ways:
      - style: visual
        teach: The same 40 N push gives more torque the further it acts from the hinge.
        picture:
          kind: bars
          unit: N m
          bars:
          - label: at 0.1 m
            value: 4
          - label: at 0.25 m
            value: 10
          - label: at 0.5 m
            value: 20
          alt: A 40 newton force gives 4 newton metres of torque at 0.1 metres, 10 at 0.25 metres and 20 at 0.5 metres from the axis.
      - style: real_world
        teach: 'Door handles sit at the edge far from the hinges. Try pushing a door open near the hinge: it takes a much bigger push. Same turning effect, smaller distance, so you need more force: τ = force × perpendicular distance.'
    - teach: 'A rigid body is in equilibrium when the net force is zero AND the net torque is zero. For a balanced see-saw: clockwise moments = anticlockwise moments.'
      picture:
        kind: compare
        columns:
        - title: Left side
          points:
          - mass 20 kg
          - distance 3 m
          - moment 60
        - title: Right side
          points:
          - mass 30 kg
          - distance 2 m
          - moment 60
        alt: 'A balanced see-saw: equal moments on both sides.'
      check:
        prompt: Can a body have zero net force but still start rotating?
        options:
        - yes, if the net torque is not zero
        - no, never
        - only if it is moving
        answer: yes, if the net torque is not zero
        why: Two equal, opposite forces along different lines (a couple) give torque but no net force.
      ways:
      - style: step_by_step
        teach: 'Step 1: Pick the pivot. Step 2: For each force, moment = force × distance from the pivot. Step 3: Clockwise total = anticlockwise total. 25 kg at 2 m vs 50 kg at d: 25 × 2 = 50 × d, so d = 1 m.'
      - style: real_world
        teach: A shopkeeper's beam balance hangs level only when the moments on both sides match. With equal arms, that means equal weights. A steelyard with one short arm lets a small weight far out balance a heavy sack close in.
  items:
  - prompt: Masses 2 kg at x = 0 and 3 kg at x = 5 m. Find the x-coordinate of the centre of mass (in m).
    answer: '3'
    check: Rational(2*0+3*5,5)
    difficulty: 1
    hints:
    - Σmx/Σm.
    - 15/5.
    solution: "x_cm = (2 × 0 + 3 × 5)/(2 + 3) = 15/5 = 3 m."
    mistakes: {"2.5": "p11_com", "5": "p11_com"}
  - prompt: A 30 kg child sits 2 m from a see-saw pivot. How far on the other side must a 40 kg child sit to balance (in m)?
    answer: 3/2
    check: Rational(60,40)
    difficulty: 2
    hints:
    - 30 × 2 = 40 × d.
    - 60/40.
    solution: "Moments balance: 30 × 2 = 40 × d, so d = 60/40 = 1.5 m."
    mistakes: {"8/3": "p11_balance", "2": "p11_balance"}
  - prompt: A 20 N force acts at right angles to a spanner 0.25 m long. Find the torque (in N m).
    answer: '5'
    check: 20*Rational(1,4)
    difficulty: 1
    hints:
    - τ = Fd.
    - 20 × 0.25.
    solution: "τ = rF = 0.25 × 20 = 5 N m."
    mistakes:
      '80': c11p_torque
  - prompt: Where is the centre of mass of a uniform ring?
    options:
    - "At its centre, where there is no mass"
    - "On the ring itself, at any point of it"
    - "At the top point of the ring"
    - "Anywhere, it depends on how it is held"
    answer: At its centre, where there is no mass
    difficulty: 2
    hints:
    - Symmetry.
    - Can be outside the material.
    solution: At the geometric centre, even though no material is there.
    mistakes: {"On the ring itself, at any point of it": "p11_ring_com", "At the top point of the ring": "p11_ring_com", "Anywhere, it depends on how it is held": "p11_ring_com"}
  - prompt: Why is a door handle placed far from the hinges?
    options:
    - "Larger distance gives more torque"
    - "To make the door look nicer"
    - "To reduce friction at the hinges"
    - "To increase the mass of the door"
    answer: Larger distance gives more torque
    difficulty: 1
    hints:
    - τ = F × d.
    - Bigger d.
    solution: A larger distance gives more turning effect for the same force.
    mistakes: {"To make the door look nicer": "p11_torque", "To reduce friction at the hinges": "p11_torque", "To increase the mass of the door": "p11_torque"}
  - prompt: 'For a rigid body to be in equilibrium:'
    options:
    - net force and net torque are both zero
    - only net force is zero
    - only net torque is zero
    - it must be at rest on the ground
    answer: net force and net torque are both zero
    difficulty: 2
    hints:
    - No moving, no turning.
    - Two conditions.
    solution: Both net force and net torque must be zero.
    mistakes: {"only net force is zero": "p11_equilibrium", "only net torque is zero": "p11_equilibrium", "it must be at rest on the ground": "p11_equilibrium"}
  - prompt: Masses 1 kg at x = 0 and 4 kg at x = 10 m. Find x_cm (in m).
    answer: '8'
    check: 40/5
    difficulty: 1
    hints:
    - Σmx = 0 + 40.
    - Divide by total mass 5.
    solution: 'Step 1: 40/5. Step 2: 8 m.'
    mistakes:
      '5': c11p06_com
      '2': c11p06_com
  - prompt: A 50 N force acts at right angles to a 0.4 m wrench. Find the torque (in N m).
    answer: '20'
    check: 50*0.4
    difficulty: 1
    hints:
    - τ = F × perpendicular distance.
    - 50 × 0.4.
    solution: 'Step 1: 50 × 0.4. Step 2: 20 N m.'
    mistakes:
      '125': c11p06_tq
      '50.4': c11p06_tq
  - prompt: Where is the centre of mass of a uniform rod?
    options:
    - at its midpoint
    - at one end
    - one-third from an end
    answer: at its midpoint
    difficulty: 1
    hints:
    - The rod is symmetric.
    - Equal mass on each side of the middle.
    solution: 'Step 1: symmetry. Step 2: midpoint.'
    mistakes:
      at one end: c11p06_com
      one-third from an end: c11p06_com
  - prompt: A 25 kg child sits 1.6 m from a see-saw pivot. Where must a 40 kg adult sit to balance (in m)?
    answer: '1'
    check: 25*1.6/40
    difficulty: 2
    hints:
    - 'Moments balance: 25 × 1.6 = 40 × d.'
    - Solve for d.
    solution: 'Step 1: 40 = 40d. Step 2: d = 1 m.'
    mistakes:
      '1.6': c11p06_tq
      '2.56': c11p06_tq
  - prompt: A 30 N force acts at 30° to a 0.5 m spanner. Find the torque (in N m).
    answer: '7.5'
    check: 30*0.5*0.5
    difficulty: 2
    hints:
    - τ = rF sin θ.
    - sin 30° = ½.
    solution: 'Step 1: 0.5 × 30 × ½. Step 2: 7.5 N m.'
    mistakes:
      '15': c11p06_tq
      '13': c11p06_tq
  - prompt: Masses 2 kg at (0, 0), 2 kg at (4, 0) and 4 kg at (0, 4). Find y_cm (in m).
    answer: '2'
    check: 16/8
    difficulty: 2
    hints:
    - Use y-coordinates only.
    - Σmy = 0 + 0 + 16.
    solution: 'Step 1: 16/8. Step 2: 2 m.'
    mistakes:
      '4': c11p06_com
      '1': c11p06_com
  - prompt: Why is it easier to open a door by pushing near the handle than near the hinge?
    options:
    - "the perpendicular distance is larger, giving more torque"
    - "the door is lighter there, so it needs less force"
    - "friction is less there than it is near the hinge"
    answer: the perpendicular distance is larger, giving more torque
    difficulty: 1
    hints:
    - τ = F × d.
    - Where is d biggest?
    solution: 'Step 1: larger d. Step 2: same force, more torque.'
    mistakes:
      "the door is lighter there, so it needs less force": c11p06_tq
      "friction is less there than it is near the hinge": c11p06_tq
  - prompt: A 2 m uniform plank of weight 100 N rests on supports at its ends. A 300 N load sits 0.5 m from the left end. Find the force on the right support (in N).
    answer: '125'
    check: (300*0.5+100*1)/2
    difficulty: 3
    hints:
    - Take moments about the left support.
    - The plank's weight acts at its middle.
    solution: 'Step 1: R × 2 = 300 × 0.5 + 100 × 1 = 250. Step 2: R = 125 N.'
    mistakes:
      '200': c11p06_tq
      '75': c11p06_tq
  - prompt: 'A shell bursts in mid-air into pieces. The centre of mass of the pieces:'
    options:
    - "continues on the original path"
    - "stops at once and then falls"
    - "moves straight down to the ground"
    answer: continues on the original path
    difficulty: 3
    hints:
    - The burst is due to internal forces.
    - Only external forces change the centre of mass motion.
    solution: 'Step 1: only gravity acts externally. Step 2: the CM follows the same parabola.'
    mistakes:
      "stops at once and then falls": c11p06_com
      "moves straight down to the ground": c11p06_com
  - prompt: 'Assertion (A): The centre of mass of a ring lies at its centre, where there is no mass.

      Reason (R): The centre of mass is the mass-weighted average position, which need not be at a point occupied by mass.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true. By symmetry the average position of a uniform ring is its centre, which is empty: R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A 1 m uniform rod of mass 2 kg has a 1 kg mass fixed at its right end. How far from the left end is the centre of mass of the system?'
    options:
    - 2/3 m
    - 1/2 m
    - 1/3 m
    answer: 2/3 m
    hints:
    - The rod's own mass acts at its middle, 0.5 m.
    - (2 × 0.5 + 1 × 1)/3.
    solution: x_cm = (1 + 1)/3 = 2/3 m from the left end.
    mistakes:
      1/2 m: p11_com
      1/3 m: c11p06_com
    exam: case
    difficulty: 2
  - prompt: 'Torque is zero when the force acts:'
    options:
    - along the line through the axis
    - at right angles to the arm
    - at the far end of the arm
    answer: along the line through the axis
    hints:
    - τ = rF sin θ.
    - When is sin θ zero?
    solution: If the force points along r (θ = 0), sin θ = 0, so τ = 0.
    mistakes:
      at right angles to the arm: p11_torque
      at the far end of the arm: c11p_torque
    exam: one_mark
    difficulty: 2
- code: cbse11p.rot.dynamics
  title: Moment of inertia and angular momentum
  after:
  - cbse11p.rot.com
  notes: |
    Rotational analogues: angular displacement θ, angular velocity ω, angular acceleration α. v = ωr. Moment of inertia
    I = Σmr² (rotational 'mass'): ring about axis MR², disc ½MR², rod about centre ML²/12, solid sphere ⅖MR².
    Rotational KE = ½Iω². τ = Iα. Angular momentum L = Iω; conserved if no external torque (ice-skater pulls arms in
    and spins faster). Rolling KE = ½mv² + ½Iω².
  explanations:
    text: 'Moment of inertia is to rotation what mass is to straight-line motion: how hard it is to change the spin. It depends on how far the mass is from the axis: I = Σmr². Angular momentum L = Iω stays constant without outside torque, so a skater pulling in their arms (smaller I) spins faster.'
    visual: 'A skater spins with arms out (large I, slow ω). The skater pulls their arms in: I halves, so ω doubles, because Iω must stay the same.'
    step_by_step: 'Step 1: Find I for the shape (use the standard formula). Step 2: For spin speed changes with no torque, set I₁ω₁ = I₂ω₂. Step 3: Rotational KE = ½Iω². Step 4: τ = Iα for angular acceleration.'
    real_world: Divers tuck in tightly to spin faster, then stretch out to slow down before entering the water.
  picture:
    kind: compare
    columns:
    - title: Straight line
      points:
      - mass m
      - velocity v
      - force F = ma
      - momentum p = mv
    - title: Rotation
      points:
      - moment of inertia I
      - angular velocity ω
      - torque τ = Iα
      - angular momentum L = Iω
    alt: 'Rotational quantities mirror straight-line ones: I for m, ω for v, τ = Iα for F = ma, and L = Iω for p = mv.'
  activity:
    type: formula
    prompt: A skater spins at 2 rev/s with moment of inertia I = 6 kg m². With no outside torque, Iω stays 12.
    inputs:
    - name: i
      label: Moment of inertia I
      min: 1
      max: 12
      step: 0.5
      start: 6
      unit: kg m²
    outputs:
    - name: w
      label: Spin
      expr: 12/i
      unit: rev/s
      places: 2
    - name: l
      label: Angular momentum Iω
      expr: i*(12/i)
      places: 1
    - name: ke
      label: Kinetic energy vs start
      expr: 6/i
      unit: ×
      places: 2
    goals:
    - prompt: The skater pulls their arms in and halves their moment of inertia.
      want:
        i: 3
      mistakes:
      - when:
          i: 12
        say: 'That doubles I: arms stretched further, so the spin slows.'
      - when:
          i: 4
        say: Two-thirds, not half. Half of 6 is 3.
    - prompt: Make the skater spin at 3 rev/s.
      want:
        w: 3
      mistakes:
      - when:
          i:
          - 6.5
          - 12
        say: Larger I means a slower spin. Iω stays 12, so to speed up, I must shrink.
    - prompt: Angular momentum is kept, but is kinetic energy? Make it 3 times the start.
      want:
        ke: 3
      mistakes:
      - when:
          ke:
          - 0.5
          - 0.99
        say: 'Spreading the arms lowers the kinetic energy. Pulling them in raises it: the skater''s muscles do work.'
  lesson:
    - teach: 'Rotation has its own versions of motion words: angle θ, angular velocity ω, angular acceleration α, with v = ωr. Moment of inertia I = Σmr² plays the role of mass.'
      check:
        prompt: A point 0.2 m from the axis, ω = 10 rad/s. Its speed?
        options:
        - 2 m/s
        - 50 m/s
        - 0.02 m/s
        answer: 2 m/s
        why: v = ωr = 10 × 0.2.
      ways:
      - style: visual
        teach: Each straight-line quantity has a rotational partner.
        picture:
          kind: compare
          columns:
          - title: Straight line
            points:
            - distance x
            - velocity v
            - mass m
            - force F = ma
            - KE ½mv²
          - title: Rotation
            points:
            - angle θ
            - angular velocity ω
            - moment of inertia I
            - torque τ = Iα
            - KE ½Iω²
          alt: Distance, velocity, mass, force and kinetic energy in straight-line motion match angle, angular velocity, moment of inertia, torque and rotational kinetic energy.
      - style: step_by_step
        teach: 'Step 1: Find ω in rad/s (1 rev/s = 2π rad/s). Step 2: Speed of a point v = ωr. Step 3: For a set of masses, I = Σmr², each m times its distance from the axis squared.'
    - teach: 'I depends on how mass is spread: ring MR², disc ½MR², rod about centre ML²/12, solid sphere ⅖MR². Mass far from the axis means a bigger I. Rotational KE = ½Iω², and τ = Iα.'
      check:
        prompt: 'Same mass and radius: which has the larger I about its axis?'
        options:
        - a ring
        - a disc
        - they are equal
        answer: a ring
        why: All the ring's mass is at radius R.
      ways:
      - style: visual
        teach: 'Same mass and radius, different spreads: the ring is hardest to spin.'
        picture:
          kind: bars
          unit: × MR²
          bars:
          - label: ring
            value: 1
          - label: disc
            value: 0.5
          - label: solid sphere
            value: 0.4
          alt: For the same mass and radius, a ring has moment of inertia M R squared, a disc half of that, and a solid sphere two fifths.
      - style: real_world
        teach: A tightrope walker carries a long pole. Its mass is far from the body, so the walker's moment of inertia is large and the body turns slowly when they start to tip, giving time to correct the balance.
    - teach: 'Angular momentum L = Iω. With no external torque, L stays constant: a skater pulling in their arms makes I smaller, so ω grows.'
      picture:
        kind: compare
        columns:
        - title: Straight line
          points:
          - m
          - v
          - F = ma
          - p = mv
        - title: Rotation
          points:
          - I
          - ω
          - τ = Iα
          - L = Iω
        alt: Straight-line and rotational quantities side by side.
      check:
        prompt: 'I halves with no outside torque. ω becomes:'
        options:
        - double
        - half
        - the same
        answer: double
        why: Iω stays fixed.
      ways:
      - style: step_by_step
        teach: 'Step 1: Check there is no outside torque. Step 2: Write I₁ω₁ = I₂ω₂. Step 3: Solve. If I falls to a third, ω triples. Example: 3 rev/s with I cut to a third gives 9 rev/s.'
      - style: real_world
        teach: 'A diver leaps off the board stretched out and then tucks into a ball: the spin speeds up. Opening out again just before entering the water slows the spin. Angular momentum stays the same throughout.'
  items:
  - prompt: A ring of mass 2 kg and radius 0.5 m spins about its axis. Find its moment of inertia (in kg m²).
    answer: 1/2
    check: 2*Rational(1,4)
    difficulty: 1
    hints:
    - I = MR².
    - 2 × 0.25.
