# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse11-phy
chapter: 2
title: Motion in a Straight Line
tips:
  c11p_suvat: List what you know (u, v, a, s, t), pick the equation that has exactly those plus the unknown.
  c11p_free_fall: "In free fall, a = g downward the whole time, even at the top. Which quantity changes from upward to downward there?"
  p11_accel: "a = change in velocity ÷ time."
  p11_displacement: "Displacement is the net change in position: east steps minus west steps."
  p11_distance: "Distance counts every step walked, whatever the direction."
  p11_free_fall: "s = ½gt² from rest. Square the time before multiplying."
  p11_max_height: "At the top v = 0. Use v² = u² − 2gh and solve for h."
  p11_relative: "For the same direction, relative speed is the difference of the speeds."
  p11_stopping: "Use v² = u² − 2as with v = 0, so s = u²/(2a)."
  p11_v_u_at: "v = u + at with u = 0."
  p11_vt_area: "Displacement is the area under the v–t graph. Here it is a triangle: ½ × base × height."
  p11_xt_slope: "Slope = change in position ÷ change in time. Which quantity is that?"
  c11p02_disp: Displacement is final position minus starting position, with a sign. Distance is the whole path length.
  c11p02_graph: "Slope means how fast the plotted quantity changes per second; the area under a v–t graph adds up velocity × time. Which quantity is each?"
  c11p02_suvat: List u, v, a, s, t, mark what you know, and pick the equation without the unknown you don't need.
concepts:
- code: cbse11p.line.kinematics
  title: Position, velocity and acceleration
  notes: |
    Position x relative to an origin; displacement Δx = x₂ − x₁ (can be negative); distance is path length (≥ |Δx|).
    Average velocity = Δx/Δt; average speed = distance/time. Instantaneous velocity v = dx/dt (slope of x–t graph).
    Acceleration a = dv/dt (slope of v–t graph); area under v–t graph = displacement. Uniform motion: straight x–t line.
    Relative velocity of B with respect to A: v_BA = v_B − v_A.
  explanations:
    text: Displacement is the change in position (with direction); distance is how far you actually travelled. Velocity is how fast position changes; acceleration is how fast velocity changes. On a velocity–time graph, the slope is acceleration and the area underneath is displacement.
    visual: Walk 4 m east then 3 m west. Distance = 7 m, displacement = 1 m east. On a v–t graph, a line rising from 0 to 20 m/s in 4 s has slope 5 m/s² and area ½ × 4 × 20 = 40 m.
    step_by_step: 'Step 1: Choose a positive direction. Step 2: Displacement = final − initial position. Step 3: Velocity = displacement ÷ time. Step 4: Acceleration = change in velocity ÷ time. Step 5: Use graph slopes and areas.'
    real_world: 'Two trains moving towards each other at 60 km/h and 40 km/h close the gap at 100 km/h: their relative speed.'
  picture:
    kind: geometry
    points:
      O:
      - 1
      - 1
      A:
      - 8
      - 8
      _B:
      - 8
      - 1
    segments:
    - - O
      - A
      - v–t line
    - - O
      - _B
      - t = 4 s
    - - _B
      - A
      - v = 20 m/s
    alt: A velocity–time graph rising in a straight line from 0 to 20 m/s in 4 s; the slope is the acceleration and the triangle's area is the displacement.
  activity:
    type: formula
    prompt: Walk east, then turn and walk west. Speed uses the whole path; velocity uses only where you end up.
    inputs:
    - name: e
      label: East first
      min: 0
      max: 100
      step: 10
      start: 0
      unit: m
    - name: w
      label: Then west
      min: 0
      max: 100
      step: 10
      start: 0
      unit: m
    - name: t
      label: Total time
      min: 10
      max: 100
      step: 10
      start: 10
      unit: s
    outputs:
    - name: dist
      label: Distance walked
      expr: e+w
      unit: m
    - name: disp
      label: Displacement (east +)
      expr: e-w
      unit: m
    - name: speed
      label: Average speed
      expr: (e+w)/t
      unit: m/s
      places: 2
    - name: vel
      label: Average velocity
      expr: (e-w)/t
      unit: m/s
      places: 2
    goals:
    - prompt: Make the average velocity 0 but the average speed 3 m/s.
      want:
        vel: 0
        speed: 3
      mistakes:
      - when:
          e: 0
          w: 0
        say: Standing still gives 0 for both. Walk somewhere and come back.
      - when:
          vel:
          - 0.1
          - 10
        say: You end up east of the start, so the velocity isn't 0. Come all the way back.
    - prompt: Make the average speed 2 m/s and the average velocity 1 m/s.
      want:
        speed: 2
        vel: 1
      mistakes:
      - when:
          vel: 2
        say: 'That''s a velocity of 2: you went one way only. Walk back part of the way: the path stays long but the displacement shrinks.'
      - when:
          speed: 1
          vel: 1
        say: Speed and velocity match only when you never turn back. Add some walking west.
    - prompt: Finish 40 m west of the start, after walking 100 m in all.
      want:
        disp: -40
        dist: 100
      mistakes:
      - when:
          disp: 40
          dist: 100
        say: '+40 m ends east of the start. West is the negative direction: walk further west than east.'
  lesson:
    - teach: Position is measured from an origin, with a sign for direction. Displacement = final − initial position (can be negative). Distance is the total path length, never negative.
      check:
        prompt: A cyclist goes 6 m east, then 6 m west. Displacement?
        options:
        - 0 m
        - 12 m
        - 6 m
        answer: 0 m
        why: They end where they started.
      ways:
      - style: visual
        teach: 'Walk 6 m east then 2 m west: distance 8 m, displacement only 4 m.'
        picture:
          kind: number_line
          from: -1
          to: 7
          points:
          - at: 0
            label: start
          - at: 6
            label: turn
          - at: 4
            label: 'end: +4 m'
          jumps:
          - from: 0
            to: 6
            label: 6 m east
          - from: 6
            to: 4
            label: 2 m west
          alt: 'Starting at 0, a walk of 6 metres east and 2 metres back west ends at plus 4: the path is 8 metres but the displacement is 4 metres.'
      - style: real_world
        teach: 'A running race on a 400 m track: after one full lap your distance is 400 m but your displacement is zero, because you finish where you started. Displacement only cares about start and end points.'
    - teach: Average velocity = displacement/time; average speed = distance/time. Velocity v = dx/dt is the slope of the x–t graph; acceleration a = dv/dt is the slope of the v–t graph.
      check:
        prompt: 'A straight, rising x–t line means:'
        options:
        - constant velocity
        - constant acceleration
        - at rest
        answer: constant velocity
        why: Constant slope means constant velocity.
      ways:
      - style: step_by_step
        teach: 'Step 1: Average velocity = total displacement ÷ total time. Step 2: Average speed = total distance ÷ total time. Step 3: On an x–t graph, velocity is the slope. Step 4: On a v–t graph, acceleration is the slope.'
      - style: visual
        teach: What the slope tells you on each kind of graph.
        picture:
          kind: compare
          columns:
          - title: x–t graph
            points:
            - slope = velocity
            - 'straight line: steady v'
            - 'flat: at rest'
          - title: v–t graph
            points:
            - slope = acceleration
            - area = displacement
            - 'flat: steady v'
          alt: On a position-time graph the slope is velocity and a flat line means rest; on a velocity-time graph the slope is acceleration and the area is displacement.
    - teach: The area under a v–t graph is the displacement. Relative velocity of B with respect to A is v_B − v_A.
      picture:
        kind: compare
        columns:
        - title: Graph
          points:
          - slope of x–t
          - slope of v–t
          - area under v–t
        - title: Gives
          points:
          - velocity
          - acceleration
          - displacement
        alt: What motion graphs tell you.
      check:
        prompt: 'v–t graph: constant 5 m/s for 6 s. Displacement?'
        options:
        - 30 m
        - 11 m
        - 5 m
        answer: 30 m
        why: Rectangle area 5 × 6.
      ways:
      - style: step_by_step
        teach: 'Step 1: Split the area under the v–t graph into rectangles and triangles. Step 2: Find each area. Step 3: Add: that''s the displacement. Step 4: For relative velocity, subtract: v_BA = v_B − v_A, with signs for direction.'
      - style: real_world
        teach: 'Two trains on parallel tracks both at 60 km/h in the same direction: from one, the other seems to stand still (60 − 60 = 0). If they run towards each other, each sees the other rush by at 120 km/h.'
  items:
  - prompt: A person walks 4 m east then 3 m west. What is the displacement (in m, east positive)?
    answer: '1'
    check: 4 - 3
    difficulty: 1
    hints:
    - 4 − 3.
    - Direction matters.
    solution: "Displacement counts direction: +4 − 3 = +1 m, that is 1 m east."
    mistakes: {"7": "p11_displacement", "-1": "p11_displacement"}
  - prompt: In the same walk, what is the distance travelled (in m)?
    answer: '7'
    check: 4 + 3
    difficulty: 1
    hints:
    - Add the lengths.
    - 4 + 3.
    solution: "Distance is the full path, ignoring direction: 4 + 3 = 7 m."
    mistakes: {"1": "p11_distance"}
  - prompt: A car goes from 0 to 20 m/s in 4 s. Find its acceleration (in m/s²).
    answer: '5'
    check: 20/4
    difficulty: 1
    hints:
    - a = Δv/Δt.
    - 20/4.
    solution: "a = (v − u)/t = (20 − 0)/4 = 5 m/s²."
    mistakes: {"80": "p11_accel", "4": "p11_accel"}
  - prompt: From a v–t graph rising from 0 to 20 m/s in 4 s, find the displacement (in m).
    answer: '40'
    check: Rational(1,2)*4*20
    difficulty: 2
    hints:
    - Area of triangle.
    - ½ × 4 × 20.
    solution: "Displacement = area under the v–t graph = triangle ½ × 4 × 20 = 40 m."
    mistakes: {"80": "p11_vt_area", "20": "p11_vt_area"}
  - prompt: Two cars move in the same direction at 70 km/h and 50 km/h. What is the speed of the faster relative to the slower (in km/h)?
    answer: '20'
    check: 70 - 50
    difficulty: 1
    hints:
    - v_BA = v_B − v_A.
    - 70 − 50.
    solution: "Same direction, so subtract: v_rel = 70 − 50 = 20 km/h."
    mistakes: {"120": "p11_relative", "70": "p11_relative"}
  - prompt: 'The slope of a position–time graph gives:'
    options:
    - velocity
    - acceleration
    - displacement
    - distance
    answer: velocity
    difficulty: 1
    hints:
    - Change in position per time.
    - dx/dt.
    solution: Slope of x–t graph = velocity.
    mistakes: {"acceleration": "p11_xt_slope", "displacement": "p11_xt_slope", "distance": "p11_xt_slope"}
  - prompt: A runner goes 100 m north then 40 m south. Find the displacement (in m, north positive).
    answer: '60'
    check: 100-40
    difficulty: 1
    hints:
    - Give south a minus sign.
    - Add with signs.
    solution: 'Step 1: +100 − 40. Step 2: 60 m north.'
    mistakes:
      '140': c11p02_disp
      '-60': c11p02_disp
  - prompt: A car travels 120 km in 2 h. Find its average speed (in km/h).
    answer: '60'
    check: 120/2
    difficulty: 1
    hints:
    - Average speed = distance ÷ time.
    - Divide 120 by 2.
    solution: 'Step 1: 120/2. Step 2: 60 km/h.'
    mistakes:
      '240': c11p02_disp
      '122': c11p02_disp
  - prompt: Velocity changes from 30 m/s to 10 m/s in 5 s. Find the acceleration (in m/s²).
    answer: '-4'
    check: (10-30)/5
    difficulty: 1
    hints:
    - a = (v − u)/t.
    - The car is slowing down, so expect a sign.
    solution: 'Step 1: (10 − 30)/5. Step 2: −4 m/s².'
    mistakes:
      '4': c11p02_graph
      '8': c11p02_graph
  - prompt: 'A body goes round a circular track of radius 7 m once. Its displacement is:'
    options:
    - '0'
    - 44 m
    - 14 m
    answer: '0'
    difficulty: 2
    hints:
    - Where does it finish?
    - Displacement only cares about start and end.
    solution: 'Step 1: start = end. Step 2: displacement 0.'
    mistakes:
      44 m: c11p02_disp
      14 m: c11p02_disp
  - prompt: A v–t graph is a straight line from 0 to 12 m/s in 6 s. Find the displacement (in m).
    answer: '36'
    check: 0.5*6*12
    difficulty: 2
    hints:
    - The area is a triangle.
    - ½ × base × height.
    solution: 'Step 1: ½ × 6 × 12. Step 2: 36 m.'
    mistakes:
      '72': c11p02_graph
      '2': c11p02_graph
  - prompt: 'The slope of a velocity–time graph gives:'
    options:
    - acceleration
    - displacement
    - speed
    answer: acceleration
    difficulty: 1
    hints:
    - Slope = change in y ÷ change in x.
    - Change in velocity per unit time.
    solution: 'Step 1: Δv/Δt. Step 2: acceleration.'
    mistakes:
      displacement: c11p02_graph
      speed: c11p02_graph
  - prompt: Two trains move towards each other at 40 km/h and 60 km/h. Find the speed of one relative to the other (in km/h).
    answer: '100'
    check: 40+60
    difficulty: 2
    hints:
    - 'Opposite directions: one velocity is negative.'
    - v_A − v_B with signs.
    solution: 'Step 1: 40 − (−60). Step 2: 100 km/h.'
    mistakes:
      '20': c11p02_disp
      '2400': c11p02_disp
  - prompt: x = 3t² + 2t (x in m, t in s). Find the velocity at t = 2 s (in m/s).
    answer: '14'
    check: 6*2+2
    difficulty: 3
    hints:
    - Velocity is dx/dt.
    - Differentiate, then put t = 2.
    solution: 'Step 1: v = 6t + 2. Step 2: 14 m/s.'
    mistakes:
      '16': c11p02_graph
      '12': c11p02_graph
  - prompt: A car drives 30 km at 30 km/h, then 30 km at 60 km/h. Find the average speed (in km/h).
    answer: '40'
    check: 60/(1+0.5)
    difficulty: 3
    hints:
    - Average speed is total distance ÷ total time, not the average of the speeds.
    - Find each part's time.
    solution: 'Step 1: times 1 h and 0.5 h. Step 2: 60/1.5 = 40 km/h.'
    mistakes:
      '45': c11p02_disp
      '90': c11p02_disp
  - prompt: 'Assertion (A): The magnitude of displacement can be less than the distance travelled.

      Reason (R): Displacement depends only on the initial and final positions, not on the path taken.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true. Since displacement ignores the path, a winding route makes distance longer than displacement: R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A car''s v–t graph rises in a straight line from 0 to 20 m/s in 10 s. How far does it travel in those 10 s?'
    options:
    - 100 m
    - 200 m
    - 2 m
    answer: 100 m
    hints:
    - Distance = area under the v–t graph.
    - The area is a triangle.
    solution: Area = ½ × 10 × 20 = 100 m.
    mistakes:
      200 m: p11_vt_area
      2 m: c11p02_graph
    exam: case
    difficulty: 2
  - prompt: Two cars move towards each other on a straight road at 15 m/s and 25 m/s. What is the speed of one relative to the other?
    options:
    - 40 m/s
    - 10 m/s
    - 25 m/s
    answer: 40 m/s
    hints:
    - Take one direction as positive.
    - v_B − v_A with opposite signs.
    solution: 25 − (−15) = 40 m/s.
    mistakes:
      10 m/s: p11_relative
      25 m/s: p11_relative
    exam: short
    difficulty: 2
- code: cbse11p.line.equations
  title: Equations of uniformly accelerated motion
  after:
  - cbse11p.line.kinematics
  notes: |
    For constant acceleration: v = u + at; s = ut + ½at²; v² = u² + 2as; sₙ (distance in nth second) = u + a(2n − 1)/2.
    Free fall: a = g ≈ 9.8 m/s² downward (often 10 m/s² for easy numbers). Thrown up with speed u: time to top u/g, max
    height u²/2g. Stopping distance ∝ u² for the same braking. Sign convention: choose a positive direction and stick to it.
  explanations:
    text: 'When acceleration is constant, three equations connect initial speed u, final speed v, acceleration a, displacement s and time t: v = u + at, s = ut + ½at², v² = u² + 2as. For falling objects, a = g, about 9.8 m/s².'
    visual: 'A ball is thrown up at 20 m/s (take g = 10). It slows by 10 m/s every second: 20, 10, 0. It stops after 2 s at 20 m high, then falls back.'
    step_by_step: 'Step 1: Write down u, v, a, s, t: which do you know? Step 2: Pick the equation that has those and the unknown. Step 3: Choose up or down as positive. Step 4: Substitute and solve.'
    real_world: 'Doubling a car''s speed makes its braking distance four times longer, because s = v²/2a: one reason speed limits near schools are low.'
  picture:
    kind: compare
    columns:
    - title: Equation
      points:
      - v = u + at
      - s = ut + ½at²
      - v² = u² + 2as
    - title: Missing quantity
      points:
      - s
      - v
      - t
    alt: v = u + at has no s, s = ut + ½at² has no v, and v² = u² + 2as has no t.
  activity:
    type: formula
    prompt: A ball is thrown straight up at u m/s (g = 10 m/s²). It rises to h = u² ÷ 2g and takes u ÷ g to reach the top.
    inputs:
    - name: u
      label: Throw speed u
      min: 0
      max: 90
      step: 1
      start: 10
      unit: m/s
    outputs:
    - name: h
      label: Greatest height
      expr: u^2/20
      unit: m
      places: 1
    - name: tup
      label: Time to the top
      expr: u/10
      unit: s
      places: 1
    - name: tt
      label: Time in the air
      expr: u/5
      unit: s
      places: 1
    goals:
    - prompt: Throw the ball so it rises 45 m.
      want:
        h: 45
      mistakes:
      - when:
          u: 45
        say: 45 m/s would send it up 101 m. The height is u² ÷ 2g, so u² = 2 × 10 × 45.
      - when:
          u: 90
        say: 'That''s twice 45: it would rise 405 m. Height grows with u², not u.'
      - when:
          u:
          - 1
          - 29
        say: Not high enough yet. h = u² ÷ 20.
    - prompt: Make the ball spend 4 s in the air altogether.
      want:
        tt: 4
      mistakes:
      - when:
          u: 40
        say: u = 40 takes 4 s just to reach the top. Up and down take the same time, so the top comes at 2 s.
    - prompt: Throw it 80 m high.
      want:
        h: 80
      mistakes:
      - when:
          u: 80
        say: 'u = 80 rises 320 m. Height goes as u²: u² = 2 × 10 × 80.'
      - when:
          u:
          - 1
          - 39
        say: Not high enough yet. h = u² ÷ 20.
  lesson:
    - teach: 'For constant acceleration: v = u + at, s = ut + ½at², v² = u² + 2as. u is starting velocity, v final, a acceleration, s displacement, t time.'
      check:
        prompt: u = 4 m/s, a = 3 m/s², t = 2 s. v = ?
        options:
        - 10 m/s
        - 7 m/s
        - 12 m/s
        answer: 10 m/s
        why: 4 + 3 × 2.
      ways:
      - style: visual
        teach: A v–t graph for constant acceleration explains the first two equations.
        picture:
          kind: area_grid
          cols:
          - size: 3
            label: t
          rows:
          - size: 1
            label: v − u = at
          - size: 2
            label: u
          cells:
          - - 'triangle: ½ × t × at'
          - - 'rectangle: ut'
          alt: Under a v-t graph rising from u to v, the area is a rectangle ut plus a triangle half t times at, giving s equals ut plus half a t squared.
      - style: real_world
        teach: A scooter starts from rest at a signal and speeds up steadily by 1.5 m/s every second. After 6 s it is at 9 m/s (v = u + at). It has covered only 27 m (s = ½at²), because it was slow at first.
    - teach: Pick the equation that has your three knowns and your unknown. No time given? Use v² = u² + 2as.
      check:
        prompt: From rest, a = 4 m/s², over 8 m. Final speed?
        options:
        - 8 m/s
        - 32 m/s
        - 64 m/s
        answer: 8 m/s
        why: v² = 0 + 2 × 4 × 8 = 64.
      ways:
      - style: visual
        teach: Pick the equation by which quantity is missing from your problem.
        picture:
          kind: compare
          columns:
          - title: No s
            points:
            - v = u + at
          - title: No v
            points:
            - s = ut + ½at²
          - title: No t
            points:
            - v² = u² + 2as
          alt: If displacement is not involved use v equals u plus at; if final velocity is not involved use s equals ut plus half at squared; if time is not involved use v squared equals u squared plus 2as.
      - style: step_by_step
        teach: 'Step 1: List u, v, a, s, t. Step 2: Mark the three you know and the one you want. Step 3: Choose the equation without the fifth. Step 4: Put signs in: decelerating means a is negative. Example: stop from 15 m/s at −5 m/s²: 0 = 225 − 10s, s = 22.5 m.'
    - teach: 'Free fall: a = g ≈ 9.8 m/s² (often 10) downward. Thrown up at u: time to top u/g, maximum height u²/2g. At the top the velocity is zero, but the acceleration is still g.'
      picture:
        kind: flow
        steps:
        - List u, v, a, s, t
        - Mark the unknown
        - Choose the equation
        - Substitute with signs
        alt: How to choose an equation of motion.
      check:
        prompt: Thrown up at 30 m/s (g = 10). Time to reach the top?
        options:
        - 3 s
        - 6 s
        - 300 s
        answer: 3 s
        why: u/g = 30/10.
      ways:
      - style: step_by_step
        teach: 'Step 1: Take up as positive, so a = −g. Step 2: At the top v = 0. Step 3: Time up = u/g. Step 4: Height H = u²/2g. Step 5: It takes the same time to come down and lands at speed u.'
      - style: real_world
        teach: 'Drop a coin and a ball from the same balcony: without air they land together, since both speed up at g. Air slows a feather, which is why the feather-and-hammer drop on the Moon showed them landing together.'
  items:
  - prompt: A car starts from rest with acceleration 2 m/s². Find its speed after 5 s (in m/s).
    answer: '10'
    check: 0 + 2*5
    difficulty: 1
    hints:
    - v = u + at.
    - 0 + 2 × 5.
    solution: "v = u + at = 0 + 2 × 5 = 10 m/s."
    mistakes: {"5": "p11_v_u_at", "25": "p11_v_u_at"}
  - prompt: A car starts from rest with acceleration 2 m/s². How far does it go in 5 s (in m)?
    answer: '25'
    check: Rational(1,2)*2*5**2
    difficulty: 1
    hints:
    - s = ut + ½at².
    - ½ × 2 × 25.
    solution: "s = ut + ½at² = 0 + ½ × 2 × 5² = 25 m."
    mistakes:
      '50': c11p_suvat
  - prompt: A ball is thrown up at 20 m/s. Taking g = 10 m/s², find the maximum height (in m).
    answer: '20'
    check: 20**2/(2*10)
    difficulty: 2
    hints:
    - v² = u² − 2gh, v = 0.
    - 400/20.
    solution: "At the top v = 0, so v² = u² − 2gh gives h = u²/(2g) = 400/20 = 20 m."
    mistakes: {"40": "p11_max_height", "2": "p11_max_height"}
  - prompt: A stone is dropped from rest. Taking g = 10 m/s², how far does it fall in 3 s (in m)?
    answer: '45'
    check: Rational(1,2)*10*9
    difficulty: 1
    hints:
    - s = ½gt².
    - ½ × 10 × 9.
    solution: "s = ½gt² = ½ × 10 × 3² = 45 m."
    mistakes: {"90": "p11_free_fall", "30": "p11_free_fall", "15": "p11_free_fall"}
  - prompt: A car moving at 20 m/s brakes with deceleration 5 m/s². Find its stopping distance (in m).
    answer: '40'
    check: 20**2/(2*5)
    difficulty: 2
    hints:
    - v² = u² − 2as.
    - 400/10.
    solution: "v² = u² − 2as with v = 0: s = u²/(2a) = 400/10 = 40 m."
    mistakes: {"80": "p11_stopping", "4": "p11_stopping", "20": "p11_stopping"}
  - prompt: At the highest point of a vertical throw, which is zero?
    options:
    - Velocity
    - Acceleration
    - Both
    - Neither
    answer: Velocity
    difficulty: 2
    hints:
    - It stops for an instant.
    - Gravity still acts.
    solution: The velocity is zero; acceleration is still g.
    mistakes:
      Acceleration: c11p_free_fall
  - prompt: A bike starts from rest with acceleration 3 m/s². Find its speed after 4 s (in m/s).
    answer: '12'
    check: 3*4
    difficulty: 1
    hints:
    - Use v = u + at.
    - u = 0.
    solution: 'Step 1: 0 + 3 × 4. Step 2: 12 m/s.'
    mistakes:
      '7': c11p02_suvat
      '24': c11p02_suvat
  - prompt: From rest with a = 4 m/s², how far does a car go in 3 s (in m)?
    answer: '18'
    check: 0.5*4*9
    difficulty: 1
    hints:
    - s = ut + ½at².
    - u = 0, so only ½at².
    solution: 'Step 1: ½ × 4 × 9. Step 2: 18 m.'
    mistakes:
      '36': c11p02_suvat
      '6': c11p02_suvat
  - prompt: A stone is dropped from rest (g = 10 m/s²). Find its speed after 2 s (in m/s).
    answer: '20'
    check: 10*2
    difficulty: 1
    hints:
    - 'Free fall: a = g.'
    - v = u + gt.
    solution: 'Step 1: 0 + 10 × 2. Step 2: 20 m/s.'
    mistakes:
      '5': c11p02_suvat
      '40': c11p02_suvat
  - prompt: A car at 30 m/s brakes to rest in 6 s. Find the deceleration (in m/s²).
    answer: '5'
    check: 30/6
    difficulty: 2
    hints:
    - v = u + at with v = 0.
    - Size of a is u/t.
    solution: 'Step 1: 0 = 30 + 6a, a = −5. Step 2: deceleration 5 m/s².'
    mistakes:
      '180': c11p02_suvat
      '0.2': c11p02_suvat
  - prompt: A ball is thrown up at 15 m/s (g = 10). Find the maximum height (in m).
    answer: '11.25'
    check: 15**2/20
    difficulty: 2
    hints:
    - At the top v = 0.
    - H = u²/2g.
    solution: 'Step 1: 225/20. Step 2: 11.25 m.'
    mistakes:
      '22.5': c11p02_suvat
      '1.5': c11p02_suvat
  - prompt: A car at 10 m/s accelerates at 2 m/s² for 5 s. Distance covered (in m)?
    answer: '75'
    check: 10*5+0.5*2*25
    difficulty: 2
    hints:
    - s = ut + ½at².
    - Both terms count here.
    solution: 'Step 1: 50 + 25. Step 2: 75 m.'
    mistakes:
      '50': c11p02_suvat
      '100': c11p02_suvat
  - prompt: 'At the top of its flight, a ball thrown straight up has:'
    options:
    - zero velocity, acceleration g downward
    - zero velocity and zero acceleration
    - zero acceleration only
    answer: zero velocity, acceleration g downward
    difficulty: 2
    hints:
    - Gravity never switches off.
    - Velocity changes sign at the top.
    solution: 'Step 1: v = 0 momentarily. Step 2: a = g downward throughout.'
    mistakes:
      zero velocity and zero acceleration: c11p02_suvat
      zero acceleration only: c11p02_suvat
  - prompt: If the speed of a car doubles, its stopping distance (same braking) becomes how many times?
    answer: '4'
    check: 2**2
    difficulty: 3
    hints:
    - Use v² = u² + 2as with v = 0.
    - s ∝ u².
    solution: 'Step 1: s = u²/2a. Step 2: (2u)² gives 4 times.'
    mistakes:
      '2': c11p02_suvat
      '8': c11p02_suvat
  - prompt: From rest with a = 2 m/s², how far does a body go in the 5th second (in m)?
    answer: '9'
    check: 0+2*(2*5-1)/2
    difficulty: 3
    hints:
    - 'Distance in nth second: u + a(2n − 1)/2.'
    - 'Or: s(5) − s(4).'
    solution: 'Step 1: 25 − 16. Step 2: 9 m.'
    mistakes:
      '25': c11p02_suvat
      '10': c11p02_suvat
  - prompt: 'Assertion (A): At the highest point of a ball thrown straight up, its acceleration is zero.

      Reason (R): At the highest point, the ball''s velocity is momentarily zero.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: gravity still acts, so the acceleration is g downward. R is true: only the velocity is zero there.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: A car moving at 30 m/s brakes with a deceleration of 5 m/s². How far does it travel before stopping?
    options:
    - 90 m
    - 180 m
    - 6 m
    answer: 90 m
    hints:
    - 'No time given: use v² = u² + 2as.'
    - v = 0, a = −5.
    solution: 0 = 900 − 10s → s = 90 m.
    mistakes:
      180 m: p11_stopping
      6 m: c11p02_suvat
    exam: short
    difficulty: 2
  - prompt: 'Situation: A stone is dropped into a well and hits the water after 3 s. Taking g = 10 m/s², how deep is the water surface below the top?'
    options:
    - 45 m
    - 30 m
    - 90 m
    answer: 45 m
    hints:
    - Dropped means u = 0.
    - s = ½gt².
    solution: s = ½ × 10 × 9 = 45 m (ignoring the time for sound to travel up).
    mistakes:
      30 m: p11_free_fall
      90 m: c11p_free_fall
    exam: competency
    difficulty: 2
