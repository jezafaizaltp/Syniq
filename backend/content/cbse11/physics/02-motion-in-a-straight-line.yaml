# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse11-phy
chapter: 2
title: Motion in a Straight Line
tips:
  c11p_suvat: List what you know (u, v, a, s, t), pick the equation that has exactly those plus the unknown.
  c11p_free_fall: In free fall, take a = g downward. At the top of a vertical throw, the velocity is 0, not the acceleration.
concepts:
- code: cbse11p.line.kinematics
  title: Position, velocity and acceleration
  notes: |
    Position x relative to an origin; displacement Δx = x₂ − x₁ (can be negative); distance is path length (≥ |Δx|).
    Average velocity = Δx/Δt; average speed = distance/time. Instantaneous velocity v = dx/dt (slope of x–t graph).
    Acceleration a = dv/dt (slope of v–t graph); area under v–t graph = displacement. Uniform motion: straight x–t line.
    Relative velocity of B with respect to A: v_BA = v_B − v_A.
  explanations:
    text: Displacement is the change in position (with direction); distance is how far you actually travelled. Velocity is how fast position changes; acceleration is how fast velocity changes. On a velocity–time graph, the slope is acceleration and the area underneath is displacement.
    visual: Walk 4 m east then 3 m west. Distance = 7 m, displacement = 1 m east. On a v–t graph, a line rising from 0 to 20 m/s in 4 s has slope 5 m/s² and area ½ × 4 × 20 = 40 m.
    step_by_step: 'Step 1: Choose a positive direction. Step 2: Displacement = final − initial position. Step 3: Velocity = displacement ÷ time. Step 4: Acceleration = change in velocity ÷ time. Step 5: Use graph slopes and areas.'
    real_world: 'Two trains moving towards each other at 60 km/h and 40 km/h close the gap at 100 km/h: their relative speed.'
  picture:
    kind: geometry
    points:
      O:
      - 1
      - 1
      A:
      - 8
      - 8
      _B:
      - 8
      - 1
    segments:
    - - O
      - A
      - v–t line
    - - O
      - _B
      - t = 4 s
    - - _B
      - A
      - v = 20 m/s
    alt: A velocity–time graph rising in a straight line from 0 to 20 m/s in 4 s; the slope is the acceleration and the triangle's area is the displacement.
  activity:
    type: formula
    prompt: Walk east, then turn and walk west. Speed uses the whole path; velocity uses only where you end up.
    inputs:
    - name: e
      label: East first
      min: 0
      max: 100
      step: 10
      start: 0
      unit: m
    - name: w
      label: Then west
      min: 0
      max: 100
      step: 10
      start: 0
      unit: m
    - name: t
      label: Total time
      min: 10
      max: 100
      step: 10
      start: 10
      unit: s
    outputs:
    - name: dist
      label: Distance walked
      expr: e+w
      unit: m
    - name: disp
      label: Displacement (east +)
      expr: e-w
      unit: m
    - name: speed
      label: Average speed
      expr: (e+w)/t
      unit: m/s
      places: 2
    - name: vel
      label: Average velocity
      expr: (e-w)/t
      unit: m/s
      places: 2
    goals:
    - prompt: Make the average velocity 0 but the average speed 3 m/s.
      want:
        vel: 0
        speed: 3
      mistakes:
      - when:
          e: 0
          w: 0
        say: Standing still gives 0 for both. Walk somewhere and come back.
      - when:
          vel:
          - 0.1
          - 10
        say: You end up east of the start, so the velocity isn't 0. Come all the way back.
    - prompt: Make the average speed 2 m/s and the average velocity 1 m/s.
      want:
        speed: 2
        vel: 1
      mistakes:
      - when:
          vel: 2
        say: 'That''s a velocity of 2: you went one way only. Walk back part of the way: the path stays long but the displacement shrinks.'
      - when:
          speed: 1
          vel: 1
        say: Speed and velocity match only when you never turn back. Add some walking west.
    - prompt: Finish 40 m west of the start, after walking 100 m in all.
      want:
        disp: -40
        dist: 100
      mistakes:
      - when:
          disp: 40
          dist: 100
        say: '+40 m ends east of the start. West is the negative direction: walk further west than east.'
  items:
  - prompt: A person walks 4 m east then 3 m west. What is the displacement (in m, east positive)?
    answer: '1'
    check: 4 - 3
    difficulty: 1
    hints:
    - 4 − 3.
    - Direction matters.
    solution: 1 m east.
  - prompt: In the same walk, what is the distance travelled (in m)?
    answer: '7'
    check: 4 + 3
    difficulty: 1
    hints:
    - Add the lengths.
    - 4 + 3.
    solution: 7 m.
  - prompt: A car goes from 0 to 20 m/s in 4 s. Find its acceleration (in m/s²).
    answer: '5'
    check: 20/4
    difficulty: 1
    hints:
    - a = Δv/Δt.
    - 20/4.
    solution: 5 m/s².
  - prompt: From a v–t graph rising from 0 to 20 m/s in 4 s, find the displacement (in m).
    answer: '40'
    check: Rational(1,2)*4*20
    difficulty: 2
    hints:
    - Area of triangle.
    - ½ × 4 × 20.
    solution: 40 m.
  - prompt: Two cars move in the same direction at 70 km/h and 50 km/h. What is the speed of the faster relative to the slower (in km/h)?
    answer: '20'
    check: 70 - 50
    difficulty: 1
    hints:
    - v_BA = v_B − v_A.
    - 70 − 50.
    solution: 20 km/h.
  - prompt: 'The slope of a position–time graph gives:'
    options:
    - velocity
    - acceleration
    - displacement
    - distance
    answer: velocity
    difficulty: 1
    hints:
    - Change in position per time.
    - dx/dt.
    solution: Slope of x–t graph = velocity.
- code: cbse11p.line.equations
  title: Equations of uniformly accelerated motion
  after:
  - cbse11p.line.kinematics
  notes: |
    For constant acceleration: v = u + at; s = ut + ½at²; v² = u² + 2as; sₙ (distance in nth second) = u + a(2n − 1)/2.
    Free fall: a = g ≈ 9.8 m/s² downward (often 10 m/s² for easy numbers). Thrown up with speed u: time to top u/g, max
    height u²/2g. Stopping distance ∝ u² for the same braking. Sign convention: choose a positive direction and stick to it.
  explanations:
    text: 'When acceleration is constant, three equations connect initial speed u, final speed v, acceleration a, displacement s and time t: v = u + at, s = ut + ½at², v² = u² + 2as. For falling objects, a = g, about 9.8 m/s².'
    visual: 'A ball is thrown up at 20 m/s (take g = 10). It slows by 10 m/s every second: 20, 10, 0. It stops after 2 s at 20 m high, then falls back.'
    step_by_step: 'Step 1: Write down u, v, a, s, t: which do you know? Step 2: Pick the equation that has those and the unknown. Step 3: Choose up or down as positive. Step 4: Substitute and solve.'
    real_world: 'Doubling a car''s speed makes its braking distance four times longer, because s = v²/2a: one reason speed limits near schools are low.'
  picture:
    kind: compare
    columns:
    - title: Equation
      points:
      - v = u + at
      - s = ut + ½at²
      - v² = u² + 2as
    - title: Missing quantity
      points:
      - s
      - v
      - t
    alt: v = u + at has no s, s = ut + ½at² has no v, and v² = u² + 2as has no t.
  activity:
    type: formula
    prompt: A ball is thrown straight up at u m/s (g = 10 m/s²). It rises to h = u² ÷ 2g and takes u ÷ g to reach the top.
    inputs:
    - name: u
      label: Throw speed u
      min: 0
      max: 90
      step: 1
      start: 10
      unit: m/s
    outputs:
    - name: h
      label: Greatest height
      expr: u^2/20
      unit: m
      places: 1
    - name: tup
      label: Time to the top
      expr: u/10
      unit: s
      places: 1
    - name: tt
      label: Time in the air
      expr: u/5
      unit: s
      places: 1
    goals:
    - prompt: Throw the ball so it rises 45 m.
      want:
        h: 45
      mistakes:
      - when:
          u: 45
        say: 45 m/s would send it up 101 m. The height is u² ÷ 2g, so u² = 2 × 10 × 45.
      - when:
          u: 90
        say: 'That''s twice 45: it would rise 405 m. Height grows with u², not u.'
      - when:
          u:
          - 1
          - 29
        say: Not high enough yet. h = u² ÷ 20.
    - prompt: Make the ball spend 4 s in the air altogether.
      want:
        tt: 4
      mistakes:
      - when:
          u: 40
        say: u = 40 takes 4 s just to reach the top. Up and down take the same time, so the top comes at 2 s.
    - prompt: Throw it 80 m high.
      want:
        h: 80
      mistakes:
      - when:
          u: 80
        say: 'u = 80 rises 320 m. Height goes as u²: u² = 2 × 10 × 80.'
      - when:
          u:
          - 1
          - 39
        say: Not high enough yet. h = u² ÷ 20.
  items:
  - prompt: A car starts from rest with acceleration 2 m/s². Find its speed after 5 s (in m/s).
    answer: '10'
    check: 0 + 2*5
    difficulty: 1
    hints:
    - v = u + at.
    - 0 + 2 × 5.
    solution: 10 m/s.
  - prompt: A car starts from rest with acceleration 2 m/s². How far does it go in 5 s (in m)?
    answer: '25'
    check: Rational(1,2)*2*5**2
    difficulty: 1
    hints:
    - s = ut + ½at².
    - ½ × 2 × 25.
    solution: 25 m.
    mistakes:
      '50': c11p_suvat
  - prompt: A ball is thrown up at 20 m/s. Taking g = 10 m/s², find the maximum height (in m).
    answer: '20'
    check: 20**2/(2*10)
    difficulty: 2
    hints:
    - v² = u² − 2gh, v = 0.
    - 400/20.
    solution: 20 m.
  - prompt: A stone is dropped from rest. Taking g = 10 m/s², how far does it fall in 3 s (in m)?
    answer: '45'
    check: Rational(1,2)*10*9
    difficulty: 1
    hints:
    - s = ½gt².
    - ½ × 10 × 9.
    solution: 45 m.
  - prompt: A car moving at 20 m/s brakes with deceleration 5 m/s². Find its stopping distance (in m).
    answer: '40'
    check: 20**2/(2*5)
    difficulty: 2
    hints:
    - v² = u² − 2as.
    - 400/10.
    solution: 40 m.
  - prompt: At the highest point of a vertical throw, which is zero?
    options:
    - Velocity
    - Acceleration
    - Both
    - Neither
    answer: Velocity
    difficulty: 2
    hints:
    - It stops for an instant.
    - Gravity still acts.
    solution: The velocity is zero; acceleration is still g.
    mistakes:
      Acceleration: c11p_free_fall
