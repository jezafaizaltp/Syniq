# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 13. Format: content/README.md.
subject: cbse11-phy
chapter: 13
title: Oscillations
tips:
  c11p_shm: 'In SHM, a = −ω²x: acceleration is greatest at the extremes and zero at the mean position, while speed is the other way round.'
  c11p_period: "Pendulum T = 2π√(l/g); spring T = 2π√(m/k). Check which quantities actually appear in each formula."
  p11_amax: "a_max = Aω²."
  p11_damped: "A swing left alone slowly stops. What gets smaller with each swing?"
  p11_frequency: "Frequency = oscillations ÷ time."
  p11_pendulum: "T ∝ √L. Take the square root of the factor."
  p11_resonance: "Push a swing at exactly its own rhythm and it goes higher and higher."
  p11_restoring: "F = −kx. Where is the spring stretched the most?"
  p11_shm_v: "v = ω√(A² − x²)."
  p11_spring_period: "T = 2π√(m/k), so T ∝ √m."
  p11_vmax: "v_max = Aω."
  c11p13_shm: In SHM, speed is greatest at the middle (ωA) and acceleration is greatest at the ends (ω²A).
  c11p13_period: 'Spring: T = 2π√(m/k). Pendulum: T = 2π√(L/g). A factor inside the square root changes T by its square root.'
  c11p13_energy: Total energy ½kA² stays fixed; it moves between KE and PE as the body swings.
concepts:
- code: cbse11p.osc.shm
  title: Simple harmonic motion
  notes: |
    Periodic motion repeats after a period T; frequency ν = 1/T (Hz). Oscillation: to and fro about a mean position.
    SHM: x(t) = A cos(ωt + φ); amplitude A, angular frequency ω = 2π/T, phase. Velocity v = −ωA sin(ωt + φ), maximum ωA at
    the mean position; v = ω√(A² − x²). Acceleration a = −ω²x, maximum ω²A at the extremes. SHM is the projection of
    uniform circular motion on a diameter. Restoring force F = −kx.
  explanations:
    text: Simple harmonic motion is a smooth back-and-forth swing where the pull back to the middle grows with the distance from it. The object moves fastest through the middle and stops for an instant at each end.
    visual: 'Picture a ball going round a circle at steady speed and its shadow on a wall: the shadow moves back and forth in SHM.'
    step_by_step: 'Step 1: Find ω = 2π/T. Step 2: Max speed = ωA, at the middle. Step 3: Max acceleration = ω²A, at the ends. Step 4: Speed at x is ω√(A² − x²).'
    real_world: A child on a swing, a guitar string and the quartz crystal in a watch all show nearly simple harmonic motion.
  picture:
    kind: number_line
    from: -5
    to: 5
    step: 1
    points:
    - at: -5
      label: 'extreme: v = 0'
    - at: 0
      label: 'mean: v max'
    - at: 5
      label: 'extreme: v = 0'
    alt: 'An oscillation from −5 to +5: speed is zero at the extremes and greatest at the mean position.'
  activity:
    type: formula
    prompt: A mass on a spring swings between x = −10 and +10 cm. Total energy stays fixed; PE share = (x/A)², KE share = 1 − (x/A)².
    inputs:
    - name: x
      label: Position x
      min: -10
      max: 10
      step: 1
      start: 3
      unit: cm
    outputs:
    - name: pe
      label: PE share
      expr: (x/10)^2
      places: 2
    - name: ke
      label: KE share
      expr: 1-(x/10)^2
      places: 2
    - name: force
      label: Restoring force (k = 1)
      expr: -x
    goals:
    - prompt: Find a place where KE and PE are about equal.
      want:
        pe:
        - 0.45
        - 0.55
      mistakes:
      - when:
          x: 5
        say: 'At half the amplitude PE is only ¼: energy goes as x². Equal shares need x = A ÷ √2 ≈ 7 cm.'
      - when:
          x: -5
        say: 'At half the amplitude PE is only ¼: energy goes as x². Equal shares need x = A ÷ √2 ≈ 7 cm.'
    - prompt: Find where the mass moves fastest.
      want:
        ke: 1
      mistakes:
      - when:
          pe: 1
        say: 'At the ends the mass stops for an instant to turn: KE = 0 there.'
    - prompt: Find where the spring pulls hardest to the left.
      want:
        x: 10
      mistakes:
      - when:
          x: -10
        say: At −10 the spring pulls right, back toward the middle. The pull always points back to 0.
      - when:
          x: 0
        say: 'At the middle the force is zero: that''s where it moves fastest, not where it''s pulled hardest.'
  lesson:
    - teach: Periodic motion repeats every period T; frequency ν = 1/T in hertz. Oscillation is to-and-fro motion about a mean position, like a swing.
      check:
        prompt: A swing completes 1 oscillation in 4 s. Frequency?
        options:
        - 0.25 Hz
        - 4 Hz
        - 2 Hz
        answer: 0.25 Hz
        why: ν = 1/T.
      ways:
      - style: visual
        teach: 'Periodic, oscillatory and simple harmonic: each is a narrower kind of the one before.'
        picture:
          kind: compare
          columns:
          - title: Periodic
            points:
            - repeats every T
            - Earth round the Sun
          - title: Oscillatory
            points:
            - to and fro about a mean
            - a swing
          - title: Simple harmonic
            points:
            - F = −kx exactly
            - small pendulum swings
          alt: Periodic motion just repeats, like the Earth's orbit; oscillatory motion goes to and fro about a mean position, like a swing; simple harmonic motion is oscillation with a restoring force exactly proportional to displacement.
      - style: step_by_step
        teach: 'Step 1: Count oscillations and time. Step 2: Period T = time ÷ number of oscillations. Step 3: Frequency ν = 1/T, in Hz. Example: 24 swings in 12 s: T = 0.5 s, ν = 2 Hz. Step 4: ω = 2πν.'
    - teach: In simple harmonic motion the restoring force is F = −kx, so a = −ω²x. Position x = A cos(ωt + φ), with amplitude A and ω = 2π/T. SHM is the shadow of uniform circular motion on a diameter.
      check:
        prompt: 'In SHM, the acceleration always points:'
        options:
        - towards the mean position
        - away from the mean position
        - along the velocity
        answer: towards the mean position
        why: 'a = −ω²x: opposite to displacement.'
      ways:
      - style: visual
        teach: SHM is the shadow of a point going round a circle at steady speed.
        picture:
          kind: geometry
          axes: true
          range:
          - -3
          - 3
          points:
            O:
            - 0
            - 0
            P:
            - 1.2
            - 1.6
            x:
            - 1.2
            - 0
          segments:
          - - O
            - P
            - A
          - - P
            - x
            - shadow drop
          circles:
          - centre: O
            radius: 2
          angles:
          - at: O
            from: x
            to: P
            label: ωt
          alt: A point P moves round a circle of radius A; its shadow x on the horizontal diameter moves to and fro as x equals A cos omega t, which is simple harmonic motion.
      - style: real_world
        teach: 'Shine a torch sideways at a ball stuck on a turning potter''s wheel: its shadow on the wall slides to and fro, fastest in the middle and pausing at each end. That shadow is doing simple harmonic motion.'
    - teach: 'Speed v = ω√(A² − x²): largest (ωA) at the mean position, zero at the extremes. Acceleration is largest (ω²A) at the extremes and zero at the mean position.'
      picture:
        kind: compare
        columns:
        - title: Position
          points:
          - mean (x = 0)
          - extreme (x = ±A)
        - title: Speed and acceleration
          points:
          - speed ωA, a = 0
          - speed 0, a = ω²A
        alt: Speed and acceleration at key points in SHM.
      check:
        prompt: A = 0.05 m, ω = 10 rad/s. Maximum speed?
        options:
        - 0.5 m/s
        - 5 m/s
        - 0.005 m/s
        answer: 0.5 m/s
        why: ωA = 10 × 0.05.
      ways:
      - style: step_by_step
        teach: 'Step 1: Maximum speed v_max = ωA, at the mean position. Step 2: At any x, v = ω√(A² − x²). Step 3: Maximum acceleration a_max = ω²A, at the extremes. Example: A = 0.5 m, ω = 4 rad/s: v_max = 2 m/s, a_max = 8 m/s².'
      - style: real_world
        teach: On a playground swing you feel almost weightless and pause at the highest points, where speed is zero but acceleration is greatest. You whoosh fastest through the bottom, where acceleration is zero.
  items:
  - prompt: A body makes 10 oscillations in 5 s. Find its frequency (in Hz).
    answer: '2'
    check: 10/5
    difficulty: 1
    hints:
    - ν = number/time.
    - 10/5.
    solution: "f = oscillations/time = 10/5 = 2 Hz."
    mistakes: {"0.5": "p11_frequency", "50": "p11_frequency"}
  - prompt: A body in SHM has amplitude 0.1 m and ω = 20 rad/s. Find its maximum speed (in m/s).
    answer: '2'
    check: 20*Rational(1,10)
    difficulty: 1
    hints:
    - v_max = ωA.
    - 20 × 0.1.
    solution: "v_max = Aω = 0.1 × 20 = 2 m/s."
    mistakes: {"200": "p11_vmax", "0.005": "p11_vmax"}
  - prompt: For the same motion, find the maximum acceleration (in m/s²).
    answer: '40'
    check: 20**2*Rational(1,10)
    difficulty: 2
    hints:
    - a_max = ω²A.
    - 400 × 0.1.
    solution: "a_max = Aω² = 0.1 × 400 = 40 m/s²."
    mistakes: {"2": "p11_amax", "4": "p11_amax"}
  - prompt: A body in SHM has A = 5 cm and ω = 2 rad/s. Find its speed (in cm/s) when x = 3 cm.
    answer: '8'
    check: 2*sqrt(5**2-3**2)
    difficulty: 2
    hints:
    - v = ω√(A² − x²).
    - 2 × √16.
    solution: "v = ω√(A² − x²) = 2 × √(25 − 9) = 2 × 4 = 8 cm/s."
    mistakes: {"10": "p11_shm_v", "4": "p11_shm_v", "6": "p11_shm_v"}
  - prompt: 'In SHM, the acceleration is greatest:'
    options:
    - at the extreme positions
    - at the mean position
    - halfway out
    - it is constant
    answer: at the extreme positions
    difficulty: 1
    hints:
    - a = −ω²x.
    - Largest x.
    solution: Acceleration is greatest at the extremes.
    mistakes:
      at the mean position: c11p_shm
  - prompt: 'The restoring force in SHM is:'
    options:
    - "proportional to displacement and opposite to it"
    - "constant in size throughout the motion"
    - "proportional to velocity and along it"
    - "zero at the extremes of the motion"
    answer: proportional to displacement and opposite to it
    difficulty: 2
    hints:
    - F = −kx.
    - Pulls back to the middle.
    solution: "In SHM F = −kx: the force grows with displacement and always points back to the mean position."
    mistakes: {"constant in size throughout the motion": "p11_restoring", "proportional to velocity and along it": "p11_restoring", "zero at the extremes of the motion": "p11_restoring"}
  - prompt: A body makes 30 oscillations in 10 s. Find its period (in s).
    answer: 1/3
    check: 10/30
    difficulty: 1
    hints:
    - Period = time for one oscillation.
    - 10 ÷ 30.
    solution: 'Step 1: 10/30. Step 2: 1/3 s.'
    mistakes:
      '3': c11p13_shm
      '300': c11p13_shm
  - prompt: A body in SHM has period 2π s. Find ω (in rad/s).
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - ω = 2π/T.
    - 2π ÷ 2π.
    solution: 'Step 1: 2π/2π. Step 2: 1 rad/s.'
    mistakes:
      '2': c11p13_shm
      '4': c11p13_shm
  - prompt: 'In SHM the speed is greatest:'
    options:
    - at the mean position
    - at the extremes
    - halfway to the extreme
    answer: at the mean position
    difficulty: 1
    hints:
    - v = ω√(A² − x²).
    - When is A² − x² largest?
    solution: 'Step 1: x = 0 gives the largest value. Step 2: mean position.'
    mistakes:
      at the extremes: c11p13_shm
      halfway to the extreme: c11p13_shm
  - prompt: A = 0.2 m, ω = 5 rad/s. Find the maximum acceleration (in m/s²).
    answer: '5'
    check: 25*0.2
    difficulty: 2
    hints:
    - a_max = ω²A.
    - 25 × 0.2.
    solution: 'Step 1: ω² = 25. Step 2: 25 × 0.2 = 5 m/s².'
    mistakes:
      '1': c11p13_shm
      '25': c11p13_shm
  - prompt: A = 10 cm, ω = 3 rad/s. Find the speed when x = 6 cm (in cm/s).
    answer: '24'
    check: 3*(100-36)**0.5
    difficulty: 2
    hints:
    - v = ω√(A² − x²).
    - √(100 − 36) = 8.
    solution: 'Step 1: 3 × 8. Step 2: 24 cm/s.'
    mistakes:
      '30': c11p13_shm
      '12': c11p13_shm
  - prompt: x = 4 cos(πt) cm. Find the period (in s).
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - ω is the number in front of t.
    - T = 2π/ω.
    solution: 'Step 1: ω = π. Step 2: T = 2 s.'
    mistakes:
      '4': c11p13_shm
      1/2: c11p13_shm
  - prompt: Which motion is periodic but NOT simple harmonic?
    options:
    - the Earth going round the Sun
    - a small pendulum swing
    - a mass bobbing on a spring
    answer: the Earth going round the Sun
    difficulty: 2
    hints:
    - SHM needs to-and-fro motion about a mean position.
    - Which one goes round, not back and forth?
    solution: 'Step 1: orbit repeats but has no to-and-fro restoring force ∝ x. Step 2: periodic, not SHM.'
    mistakes:
      a small pendulum swing: c11p13_shm
      a mass bobbing on a spring: c11p13_shm
  - prompt: In SHM, a = −16x (SI units). Find the period (in s).
    options:
    - π/2
    - 2π
    - π/4
    answer: π/2
    difficulty: 3
    hints:
    - a = −ω²x, so ω² = 16.
    - T = 2π/ω.
    solution: 'Step 1: ω = 4. Step 2: T = 2π/4 = π/2 s.'
    mistakes:
      2π: c11p13_shm
      π/4: c11p13_shm
  - prompt: Maximum speed is 1 m/s and maximum acceleration 4 m/s² in an SHM. Find the amplitude (in m).
    answer: 1/4
    check: 1/4
    difficulty: 3
    hints:
    - ωA = 1 and ω²A = 4.
    - 'Divide: ω = 4.'
    solution: 'Step 1: ω = 4. Step 2: A = 1/4 m.'
    mistakes:
      '4': c11p13_shm
      1/2: c11p13_shm
  - prompt: 'Assertion (A): In SHM, the acceleration is zero at the mean position.

      Reason (R): In SHM, acceleration is proportional to displacement from the mean position.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true. At the mean position x = 0, so a = −ω²x = 0: R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A piston in an engine moves in SHM with amplitude 0.05 m at 50 oscillations per second. Find its maximum speed (take π = 3.14).'
    options:
    - 15.7 m/s
    - 2.5 m/s
    - 4930 m/s
    answer: 15.7 m/s
    hints:
    - ω = 2πν = 100π rad/s.
    - v_max = ωA.
    solution: v_max = 100π × 0.05 = 5π ≈ 15.7 m/s.
    mistakes:
      2.5 m/s: p11_vmax
      4930 m/s: p11_amax
    exam: case
    difficulty: 2
  - prompt: The displacement of a particle is x = 3 sin(2πt) m. What is its amplitude?
    options:
    - 3 m
    - 2π m
    - 6 m
    answer: 3 m
    hints:
    - Compare with x = A sin(ωt).
    - Which number multiplies the sine?
    solution: A = 3 m; ω = 2π rad/s.
    mistakes:
      2π m: c11p_shm
      6 m: c11p13_shm
    exam: one_mark
    difficulty: 2
- code: cbse11p.osc.systems
  title: Springs, pendulums and energy
  after:
  - cbse11p.osc.shm
  notes: |
    Spring–mass system: F = −kx, ω = √(k/m), T = 2π√(m/k). Simple pendulum (small angles): T = 2π√(L/g), independent of
    mass and amplitude. Energy in SHM: KE = ½k(A² − x²), PE = ½kx², total E = ½kA² constant; KE and PE exchange twice per
    period. Damped oscillations: amplitude falls due to friction. Forced oscillations and resonance: amplitude is largest
    when the driving frequency matches the natural frequency (soldiers break step on bridges).
  explanations:
    text: A mass on a spring and a swinging pendulum both move in SHM. The spring's period depends on the mass and stiffness; the pendulum's only on its length and g. Energy keeps swapping between kinetic and potential, but the total stays the same.
    visual: 'Draw a pendulum at three points: at each end it''s all potential energy; at the bottom it''s all kinetic. Halfway, it''s a mix.'
    step_by_step: 'Step 1: Spring: T = 2π√(m/k). Step 2: Pendulum: T = 2π√(L/g). Step 3: Total energy = ½kA². Step 4: Look at how T changes when you change m, k or L.'
    real_world: Soldiers break step when marching across a bridge so their footsteps can't drive it at its natural frequency (resonance).
  picture:
    kind: flow
    steps:
    - 'End: all potential'
    - 'Moving in: PE → KE'
    - 'Middle: all kinetic'
    - 'Moving out: KE → PE'
    alt: Energy in an oscillation swaps between potential at the ends and kinetic in the middle.
  activity:
    type: formula
    prompt: A simple pendulum of length L swings with period T = 2π√(L ÷ g).
    inputs:
    - name: l
      label: Length L
      min: 0.1
      max: 4
      step: 0.1
      start: 0.1
      unit: m
    - name: g
      label: g
      min: 1
      max: 25
      step: 0.1
      start: 1
      unit: m/s²
    outputs:
    - name: t
      label: Period T
      expr: 2*pi*sqrt(l/g)
      unit: s
      places: 2
    goals:
    - prompt: 'On Earth (g = 9.8), make a seconds pendulum: period 2 s.'
      want:
        g: 9.8
        t:
        - 1.99
        - 2.02
      mistakes:
      - when:
          g: 9.8
          t:
          - 0.85
          - 1.15
        say: That swings over and back in 1 s. A seconds pendulum takes 1 s each way, so its full period is 2 s.
    - prompt: Keep g = 9.8. Make a period of 4 s, double the 1 m pendulum's.
      want:
        g: 9.8
        l: 4
      mistakes:
      - when:
          g: 9.8
          l: 2
        say: Doubling L gives only √2 × the period (2.84 s). T ∝ √L, so L must be 4 times as long.
    - prompt: Keep L = 1 m. Change g so the period is about 4 s.
      want:
        l: 1
        t:
        - 3.9
        - 4.1
      mistakes:
      - when:
          l: 1
          g:
          - 4.8
          - 5
        say: 'Halving g doesn''t double T: T ∝ 1/√g, so g must drop to a quarter.'
  lesson:
    - teach: 'A mass m on a spring of constant k oscillates with T = 2π√(m/k). Heavier mass or softer spring: longer period.'
      check:
        prompt: 'Spring constant k is made 4 times larger. The period:'
        options:
        - halves
        - doubles
        - is 4 times
        answer: halves
        why: T ∝ 1/√k.
      ways:
      - style: step_by_step
        teach: 'Step 1: T = 2π√(m/k). Step 2: Mass × 9 → T × 3; k × 4 → T ÷ 2. Step 3: ω = √(k/m). Example: m = 0.5 kg, k = 50 N/m: ω = √100 = 10 rad/s, T = 2π/10 ≈ 0.63 s.'
      - style: visual
        teach: How a spring's period responds when you change the mass on it.
        picture:
          kind: compare
          columns:
          - title: Mass multiplied by
            points:
            - '4'
            - '9'
            - 1/4
          - title: Period multiplied by
            points:
            - '2'
            - '3'
            - 1/2
          alt: Multiplying the mass on a spring by 4 doubles the period, by 9 triples it, and by one quarter halves it, because period goes as the square root of mass.
    - teach: A simple pendulum (small swings) has T = 2π√(L/g). It does not depend on the bob's mass or (small) amplitude, which is why pendulum clocks keep time.
      check:
        prompt: 'A heavier bob on the same string. Period:'
        options:
        - stays the same
        - increases
        - decreases
        answer: stays the same
        why: Mass does not appear in T = 2π√(L/g).
      ways:
      - style: visual
        teach: The period of a pendulum depends on its length and on g, but not on the bob's mass.
        picture:
          kind: compare
          columns:
          - title: Changes T
            points:
            - 'length L: T ∝ √L'
            - 'gravity g: T ∝ 1/√g'
          - title: Does not change T
            points:
            - mass of the bob
            - small amplitude
          alt: A pendulum's period grows with the square root of its length and falls with the square root of g; the bob's mass and a small amplitude make no difference.
      - style: real_world
        teach: 'Old grandfather clocks have a screw under the bob. If the clock runs slow, you raise the bob a little: a shorter pendulum swings faster. Changing the bob for a heavier one would not help at all.'
    - teach: 'Energy in SHM: PE = ½kx², KE = ½k(A² − x²), total ½kA² stays constant. Friction damps the amplitude. A driving force at the natural frequency causes resonance: a very large amplitude.'
      picture:
        kind: compare
        columns:
        - title: System
          points:
          - spring
          - pendulum
        - title: Period
          points:
          - 2π√(m/k)
          - 2π√(L/g)
        alt: Period formulas for a spring and a pendulum.
      check:
        prompt: 'At the mean position, the energy is:'
        options:
        - all kinetic
        - all potential
        - half and half
        answer: all kinetic
        why: x = 0 makes PE zero.
      ways:
      - style: step_by_step
        teach: 'Step 1: Total energy E = ½kA², fixed. Step 2: PE at x = ½kx². Step 3: KE = E − PE = ½k(A² − x²). Step 4: At x = A/3, PE is a ninth of E and KE eight ninths. Damping slowly drains E; resonance pumps it up.'
      - style: real_world
        teach: 'Pushing a child on a swing works best if you push once each swing, in time with it: the amplitude grows and grows. That is resonance. Pushing at random times does little, and friction slowly brings the swing to rest: damping.'
  items:
  - prompt: A pendulum's length is made four times larger. By what factor does its period increase?
    answer: '2'
    check: sqrt(4)
    difficulty: 1
    hints:
    - T ∝ √L.
    - √4.
    solution: "T = 2π√(L/g) ∝ √L, so 4 times L gives √4 = 2 times T."
    mistakes: {"4": "p11_pendulum", "16": "p11_pendulum"}
  - prompt: A spring with k = 100 N/m is stretched 0.2 m. Find its total oscillation energy (in J) if released.
    answer: '2'
    check: Rational(1,2)*100*Rational(2,10)**2
    difficulty: 1
    hints:
    - E = ½kA².
    - ½ × 100 × 0.04.
    solution: "Total energy = ½kA² = ½ × 100 × 0.04 = 2 J."
    mistakes: {"4": "p11_spring_energy", "20": "p11_spring_energy", "10": "p11_spring_energy"}
  - prompt: A mass on a spring has period 2 s. The mass is made four times larger. Find the new period (in s).
    answer: '4'
    check: 2*sqrt(4)
    difficulty: 2
    hints:
    - T ∝ √m.
    - 2 × √4.
    solution: "T = 2π√(m/k) ∝ √m, so 4 times m gives 2 × 2 = 4 s."
    mistakes: {"8": "p11_spring_period", "1": "p11_spring_period"}
