# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 10. Format: content/README.md.
subject: cbse11-phy
chapter: 10
title: Thermal Properties of Matter
tips:
  c11p_temp: To convert Celsius to kelvin add 273.15; to Fahrenheit use F = 9C/5 + 32.
  c11p_heat: 'Heat to warm a body: Q = mcΔT. During melting or boiling the temperature stays fixed and Q = mL.'
  p11_c_equals_f: "Set F = C in F = 9C/5 + 32 and solve."
  p11_cooling: "A very hot cup cools fast at first, then slowly. What is shrinking as it cools?"
  p11_kelvin: "T(K) = T(°C) + 273."
  p11_latent: "Q = mL. Use the given mass."
  p11_linear_exp: "ΔL = αLΔT gives metres. Convert to mm at the end."
  p11_mixing: "Equal masses of the same liquid meet halfway: heat lost = heat gained."
  p11_pressure_cooker: "At higher pressure water must be hotter before it can boil."
  p11_radiation: "Space between the Sun and Earth is nearly empty. Which kind of heat transfer needs no medium?"
  p11_volume_exp: "A cube grows in length, width and height, each by α."
  p11_water_anomaly: "Water shrinks as it cools, until just above freezing, when it starts to expand again. That's why lakes freeze from the top."
concepts:
- code: cbse11p.thermal.expansion
  title: Temperature and thermal expansion
  notes: |
    Temperature measures hotness; heat is energy transferred because of a temperature difference. Scales: tF = 9tC/5 + 32;
    T(K) = tC + 273.15. Ideal-gas thermometer; absolute zero 0 K = −273.15 °C. Thermal expansion: linear ΔL = αLΔT, area
    ΔA = 2αAΔT, volume ΔV = γVΔT, with γ = 3α. Anomalous expansion of water: it contracts from 0 °C to 4 °C (densest at
    4 °C), so lakes freeze from the top and aquatic life survives. Thermal stress when expansion is prevented.
  explanations:
    text: 'Temperature tells how hot something is; heat is energy that flows from hot to cold. Most things expand when heated, by an amount that depends on their length and the temperature rise. Water is unusual: it is densest at 4 °C.'
    visual: 'Draw a 1 m steel rod heated by 100 °C: it grows by αLΔT = about 1 mm. That''s why rail tracks have small gaps.'
    step_by_step: 'Step 1: Find the temperature change ΔT. Step 2: Use ΔL = αLΔT (or ΔV = γVΔT). Step 3: Add ΔL to the original length.'
    real_world: Gaps are left between concrete slabs and rail tracks so they don't buckle in summer heat.
  picture:
    kind: number_line
    from: -40
    to: 100
    step: 20
    points:
    - at: -40
      label: −40 °C = −40 °F
    - at: 0
      label: ice melts
    - at: 100
      label: water boils
    alt: 'A Celsius number line: −40 °C equals −40 °F, ice melts at 0 °C and water boils at 100 °C.'
  activity:
    type: formula
    prompt: Change the Celsius temperature. °F = 9/5 × °C + 32, and kelvin = °C + 273.
    inputs:
    - name: c
      label: Celsius
      min: -50
      max: 110
      step: 1
      start: 20
      unit: °C
    outputs:
    - name: f
      label: Fahrenheit
      expr: 9*c/5+32
      unit: °F
      places: 1
    - name: k
      label: Kelvin
      expr: c+273
      unit: K
    goals:
    - prompt: Find the temperature where °C and °F read the same number.
      want:
        f: -40
      mistakes:
      - when:
          c: 0
        say: 0 °C is 32 °F. The two scales cross far below freezing.
      - when:
          c:
          - -39
          - 110
        say: 'The Fahrenheit number is still bigger. Go colder: °F falls 9/5 as fast as °C.'
    - prompt: Body temperature is 98.6 °F. Set it in °C.
      want:
        f: 98.6
      mistakes:
      - when:
          c:
          - 60
          - 70
        say: 'You took away 32 but didn''t scale. A Celsius degree is 9/5 of a Fahrenheit degree: (98.6 − 32) × 5/9.'
    - prompt: Make 300 K.
      want:
        k: 300
      mistakes:
      - when:
          c: -27
        say: '−27 °C is 246 K. Going from kelvin to °C you subtract 273: 300 − 273.'
      - when:
          c:
          - 100
          - 110
        say: Water would be boiling. 300 K is about room temperature.
  items:
  - prompt: Convert 100 °C to Fahrenheit.
    answer: '212'
    check: Rational(9,5)*100 + 32
    difficulty: 1
    hints:
    - F = 9C/5 + 32.
    - 180 + 32.
    solution: 212 °F.
    mistakes:
      '132': c11p_temp
  - prompt: Convert 27 °C to kelvin (use 273).
    answer: '300'
    check: 27 + 273
    difficulty: 1
    hints:
    - Add 273.
    - 27 + 273.
    solution: 300 K.
    mistakes: {"246": "p11_kelvin", "27": "p11_kelvin"}
  - prompt: At what temperature do the Celsius and Fahrenheit scales read the same number?
    answer: '-40'
    check: '-40'
    difficulty: 2
    hints:
    - Set F = C.
    - C = 9C/5 + 32.
    solution: −40.
    mistakes: {"0": "p11_c_equals_f", "40": "p11_c_equals_f", "-32": "p11_c_equals_f"}
  - prompt: A 10 m rod (α = 10⁻⁵ /°C) is heated by 50 °C. Find its increase in length in mm.
    answer: '5'
    check: Rational(1,10**5)*10*50*1000
    difficulty: 2
    hints:
    - ΔL = αLΔT.
    - 10⁻⁵ × 10 × 50 = 0.005 m.
    solution: 5 mm.
    mistakes: {"0.005": "p11_linear_exp", "50": "p11_linear_exp"}
  - prompt: 'Water has its greatest density at:'
    options:
    - 4 °C
    - 0 °C
    - 100 °C
    - −4 °C
    answer: 4 °C
    difficulty: 1
    hints:
    - Anomalous expansion.
    - Lakes freeze on top.
    solution: Water is densest at 4 °C.
    mistakes: {"0 °C": "p11_water_anomaly", "100 °C": "p11_water_anomaly", "−4 °C": "p11_water_anomaly"}
  - prompt: 'For a solid, the volume expansion coefficient γ is about:'
    options:
    - 3α
    - α
    - 2α
    - α/3
    answer: 3α
    difficulty: 2
    hints:
    - Three dimensions.
    - Each grows by α.
    solution: γ = 3α.
    mistakes: {"α": "p11_volume_exp", "2α": "p11_volume_exp", "α/3": "p11_volume_exp"}
- code: cbse11p.thermal.heat
  title: Specific heat, latent heat and heat transfer
  after:
  - cbse11p.thermal.expansion
  notes: |
    Heat capacity S = ΔQ/ΔT; specific heat capacity c = ΔQ/(mΔT) (J kg⁻¹ K⁻¹; water 4186, very high). Molar specific heat.
    Calorimetry: heat lost = heat gained. Change of state at constant temperature: Q = mL; latent heat of fusion of ice
    3.33 × 10⁵ J/kg, of vaporisation of water 22.6 × 10⁵ J/kg. Boiling point rises with pressure (pressure cooker).
    Heat transfer: conduction H = KA(T_C − T_D)/L; convection (natural, forced; sea breeze); radiation (no medium needed;
    black bodies absorb and emit best). Newton's law of cooling: rate of cooling ∝ temperature difference with surroundings.
  explanations:
    text: 'Specific heat is how much heat one kilogram needs to warm by one degree. Water needs a lot, which is why it heats slowly. When ice melts or water boils, heat goes into changing the state, not the temperature: that''s latent heat.'
    visual: 'Draw a heating graph for ice: a rising line to 0 °C, a flat part while it melts, a rising line to 100 °C, then a long flat part while it boils.'
    step_by_step: 'Step 1: Warming: Q = mcΔT. Step 2: Melting or boiling: Q = mL. Step 3: Add the heat for each stage. Step 4: In mixing problems, heat lost by hot = heat gained by cold.'
    real_world: Coastal cities have milder weather because the sea, with water's high specific heat, warms and cools slowly.
  picture:
    kind: flow
    steps:
    - Ice warms to 0 °C
    - Ice melts (flat)
    - Water warms to 100 °C
    - Water boils (flat)
    alt: 'Heating ice: temperature rises, stays flat while melting, rises again, then stays flat while boiling.'
  activity:
    type: formula
    prompt: Mix hot and cold water. Heat lost by the hot = heat gained by the cold, so they meet at (m₁t₁ + m₂t₂) ÷ (m₁ + m₂).
    inputs:
    - name: a
      label: Hot water mass
      min: 1
      max: 10
      step: 1
      start: 1
      unit: kg
    - name: ta
      label: Hot water temperature
      min: 0
      max: 100
      step: 5
      start: 60
      unit: °C
    - name: b
      label: Cold water mass
      min: 1
      max: 10
      step: 1
      start: 1
      unit: kg
    - name: tb
      label: Cold water temperature
      min: 0
      max: 100
      step: 5
      start: 10
      unit: °C
    outputs:
    - name: t
      label: Final temperature
      expr: (a*ta+b*tb)/(a+b)
      unit: °C
      places: 1
    goals:
    - prompt: Mix hot water at 80 °C with 3 kg at 20 °C to end at 50 °C. How much hot water?
      want:
        ta: 80
        b: 3
        tb: 20
        t: 50
      mistakes:
      - when:
          ta: 80
          b: 3
          tb: 20
          a:
          - 1
          - 2
        say: 'Too little hot water: the mix ends below 50 °C. Both waters change by 30 °C, so the masses must be equal.'
      - when:
          ta: 80
          b: 3
          tb: 20
          a:
          - 4
          - 10
        say: 'Too much hot water: the mix ends above 50 °C.'
    - prompt: 1 kg of water at 100 °C is mixed with cold water at 10 °C and ends at 40 °C. How much cold water?
      want:
        a: 1
        ta: 100
        tb: 10
        t: 40
      mistakes:
      - when:
          a: 1
          ta: 100
          tb: 10
          b: 1
        say: Equal masses meet halfway, at 55 °C. The hot water falls 60 °C, the cold rises only 30 °C, so it needs twice the mass.
      - when:
          a: 1
          ta: 100
          tb: 10
          b:
          - 3
          - 10
        say: 'Too much cold water: the mix ends below 40 °C.'
    - prompt: Mix 2 kg at 70 °C with 3 kg at 20 °C.
      want:
        a: 2
        ta: 70
        b: 3
        tb: 20
      mistakes:
      - when:
          a: 3
          ta: 70
          b: 2
          tb: 20
        say: 'Masses swapped: it''s 2 kg of hot water and 3 kg of cold.'
  items:
  - prompt: How much heat (in J) warms 2 kg of water by 10 °C? (c = 4200 J/kg°C)
    answer: '84000'
    check: 2*4200*10
    difficulty: 1
    hints:
    - Q = mcΔT.
    - 2 × 4200 × 10.
    solution: 84,000 J.
    mistakes:
      '8400': c11p_heat
  - prompt: How much heat (in J) melts 0.5 kg of ice at 0 °C? (L = 3.3 × 10⁵ J/kg)
    answer: '165000'
    check: Rational(1,2)*330000
    difficulty: 1
    hints:
    - Q = mL.
    - 0.5 × 330,000.
    solution: 165,000 J.
    mistakes: {"330000": "p11_latent", "660000": "p11_latent"}
  - prompt: 1 kg of water at 80 °C is mixed with 1 kg of water at 20 °C. Find the final temperature (°C).
    answer: '50'
    check: (80+20)/2
    difficulty: 2
    hints:
    - Equal masses, same substance.
    - Average.
    solution: 50 °C.
    mistakes: {"100": "p11_mixing", "60": "p11_mixing"}
  - prompt: 'Heat from the Sun reaches the Earth by:'
    options:
    - radiation
    - conduction
    - convection
    - evaporation
    answer: radiation
    difficulty: 1
    hints:
    - Space is almost empty.
    - No medium needed.
    solution: Radiation needs no medium.
    mistakes: {"conduction": "p11_radiation", "convection": "p11_radiation", "evaporation": "p11_radiation"}
  - prompt: 'Food cooks faster in a pressure cooker because:'
    options:
    - higher pressure raises the boiling point
    - the steam is cooler
    - it uses less water
    - it stops convection
    answer: higher pressure raises the boiling point
    difficulty: 2
    hints:
    - Boiling point depends on pressure.
    - Above 100 °C.
    solution: Higher pressure lets water boil above 100 °C.
    mistakes: {"the steam is cooler": "p11_pressure_cooker", "it uses less water": "p11_pressure_cooker", "it stops convection": "p11_pressure_cooker"}
  - prompt: 'Newton''s law of cooling says the rate of cooling is proportional to:'
    options:
    - the temperature difference with the surroundings
    - the mass of the body
    - time
    - the square of temperature
    answer: the temperature difference with the surroundings
    difficulty: 2
    hints:
    - Hot tea cools fast at first.
    - Small difference, slow cooling.
    solution: Rate of cooling ∝ (T − T_surroundings).
    mistakes: {"the mass of the body": "p11_cooling", "time": "p11_cooling", "the square of temperature": "p11_cooling"}
