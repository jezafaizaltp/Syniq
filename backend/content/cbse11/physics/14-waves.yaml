# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 14. Format: content/README.md.
subject: cbse11-phy
chapter: 14
title: Waves
tips:
  c11p_wave: Wave speed v = fλ. The frequency is set by the source; the speed by the medium.
  c11p_beats: Beat frequency is the difference of the two frequencies, not their sum.
concepts:
- code: cbse11p.waves.travel
  title: Travelling waves
  notes: |
    A wave carries energy without carrying matter. Transverse (particles move perpendicular: string) and longitudinal
    (parallel: sound in air, compressions and rarefactions). Mechanical waves need a medium. Displacement y = a sin(kx − ωt
    + φ); wavelength λ, wave number k = 2π/λ, period T, ω = 2π/T, frequency ν. Speed v = λν = ω/k. Speed on a string v =
    √(T/μ). Speed of sound v = √(B/ρ) (Newton–Laplace: √(γP/ρ)); about 343 m/s in air at 20 °C, faster in water and solids;
    independent of pressure, rises with temperature.
  explanations:
    text: A wave is a travelling disturbance that carries energy, not the material itself. In a transverse wave the particles move up and down; in a longitudinal wave, like sound, they move back and forth along the wave. Speed = frequency × wavelength.
    visual: 'Draw a wave on a string: crests and troughs. One wavelength λ is crest to crest. If the source makes ν waves each second, the wave moves νλ metres each second.'
    step_by_step: 'Step 1: Note the frequency and wavelength. Step 2: v = νλ. Step 3: For a string, v = √(T/μ). Step 4: Check that changing medium changes speed but not frequency.'
    real_world: Thunder arrives after lightning because sound (about 340 m/s) is far slower than light; counting the seconds tells you how far away the storm is.
  picture:
    kind: compare
    columns:
    - title: Wave type
      points:
      - transverse
      - longitudinal
    - title: Particle motion
      points:
      - perpendicular to wave travel
      - along wave travel
    - title: Example
      points:
      - wave on a string
      - sound in air
    alt: Transverse waves move particles across the direction of travel; longitudinal waves move them along it.
  items:
  - prompt: A wave has frequency 50 Hz and wavelength 4 m. Find its speed (in m/s).
    answer: '200'
    check: 50*4
    difficulty: 1
    hints:
    - v = νλ.
    - 50 × 4.
    solution: 200 m/s.
    mistakes:
      '12.5': c11p_wave
  - prompt: Sound travels at 340 m/s. Find the wavelength (in m) of a 170 Hz note.
    answer: '2'
    check: 340/170
    difficulty: 1
    hints:
    - λ = v/ν.
    - 340/170.
    solution: 2 m.
  - prompt: A string has tension 100 N and mass per unit length 0.01 kg/m. Find the wave speed (in m/s).
    answer: '100'
    check: sqrt(100/Rational(1,100))
    difficulty: 2
    hints:
    - v = √(T/μ).
    - √10000.
    solution: 100 m/s.
  - prompt: 'Sound waves in air are:'
    options:
    - longitudinal
    - transverse
    - electromagnetic
    - standing only
    answer: longitudinal
    difficulty: 1
    hints:
    - Compressions and rarefactions.
    - Back and forth.
    solution: Sound in air is longitudinal.
  - prompt: When sound passes from air into water, what stays the same?
    options:
    - frequency
    - speed
    - wavelength
    - direction always
    answer: frequency
    difficulty: 2
    hints:
    - Set by the source.
    - Speed changes with medium.
    solution: Frequency stays the same; speed and wavelength change.
    mistakes:
      speed: c11p_wave
  - prompt: Thunder is heard 3 s after the lightning. Taking sound speed 340 m/s, how far away (in m) is the storm?
    answer: '1020'
    check: 340*3
    difficulty: 2
    hints:
    - d = vt.
    - 340 × 3.
    solution: 1,020 m.
- code: cbse11p.waves.superposition
  title: Superposition, standing waves and beats
  after:
  - cbse11p.waves.travel
  notes: |
    Principle of superposition: displacements add. Reflection: at a rigid end, phase change π; at an open end, none.
    Standing waves: nodes (zero displacement) and antinodes; adjacent nodes λ/2 apart. String fixed at both ends: λn =
    2L/n, νn = nv/(2L), all harmonics (fundamental n = 1). Closed pipe (one end closed): ν = (2n − 1)v/(4L), only odd
    harmonics. Open pipe: ν = nv/(2L), all harmonics. Beats: two close frequencies give loudness that rises and falls,
    beat frequency = |ν₁ − ν₂|; used to tune instruments.
  explanations:
    text: 'When two waves meet, they add up. A wave reflected back along a string adds to the incoming one to make a standing wave with still points (nodes) and big-swing points (antinodes). Two notes with close frequencies make beats: a wobble in loudness.'
    visual: 'Draw a string fixed at both ends vibrating in its simplest way: one loop, nodes at the ends, an antinode in the middle. Its length is half a wavelength.'
    step_by_step: 'Step 1: For a string or open pipe, νn = nv/(2L). Step 2: For a closed pipe, only odd multiples of v/(4L). Step 3: For beats, subtract the two frequencies.'
    real_world: Guitarists tune by listening for beats between two strings; when the wobble stops, the notes match.
  picture:
    kind: number_line
    from: 0
    to: 4
    step: 1
    points:
    - at: 0
      label: node
    - at: 1
      label: antinode
    - at: 2
      label: node
    - at: 3
      label: antinode
    - at: 4
      label: node
    alt: Along a standing wave, nodes and antinodes alternate; nodes are half a wavelength apart.
  items:
  - prompt: Two tuning forks of 256 Hz and 260 Hz sound together. How many beats per second are heard?
    answer: '4'
    check: 260 - 256
    difficulty: 1
    hints:
    - Difference.
    - 260 − 256.
    solution: 4 beats per second.
    mistakes:
      '516': c11p_beats
  - prompt: A string 0.5 m long, fixed at both ends, carries waves at 200 m/s. Find its fundamental frequency (in Hz).
    answer: '200'
    check: 200/(2*Rational(1,2))
    difficulty: 2
    hints:
    - ν = v/(2L).
    - 200/1.
    solution: 200 Hz.
  - prompt: An open pipe has fundamental frequency 300 Hz. Find the frequency (in Hz) of its second harmonic.
    answer: '600'
    check: 2*300
    difficulty: 2
    hints:
    - 'Open pipe: all harmonics.'
    - 2 × 300.
    solution: 600 Hz.
  - prompt: A pipe closed at one end has fundamental 100 Hz. Find its next possible frequency (in Hz).
    answer: '300'
    check: 3*100
    difficulty: 2
    hints:
    - 'Closed pipe: odd harmonics only.'
    - 3 × 100.
    solution: 300 Hz.
    mistakes:
      '200': c11p_beats
  - prompt: 'The distance between two neighbouring nodes in a standing wave is:'
    options:
    - λ/2
    - λ
    - λ/4
    - 2λ
    answer: λ/2
    difficulty: 1
    hints:
    - Node–antinode–node.
    - Half a wave.
    solution: Adjacent nodes are λ/2 apart.
  - prompt: 'At a node of a standing wave, the displacement is:'
    options:
    - always zero
    - always maximum
    - half the amplitude
    - changing fastest
    answer: always zero
    difficulty: 1
    hints:
    - Node = still point.
    - Waves cancel.
    solution: Nodes don't move.
