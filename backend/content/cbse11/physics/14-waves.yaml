# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 14. Format: content/README.md.
subject: cbse11-phy
chapter: 14
title: Waves
tips:
  c11p_wave: "Wave speed v = fλ. The medium decides the speed. Which quantity is fixed by whatever is making the wave?"
  c11p_beats: Beat frequency is the difference of the two frequencies, not their sum.
  p11_fundamental_string: "For a string fixed at both ends, f₁ = v/(2L)."
  p11_harmonic: "In an open pipe, the nth harmonic is n × f₁."
  p11_node: "A node is a point where the two waves always cancel."
  p11_nodes: "Sketch one full wavelength of a standing wave and count the nodes in it."
  p11_sound_type: "Air layers are pushed and pulled along the same line the sound travels."
  p11_string_speed: "v = √(T/μ). Divide, then take the square root."
  p11_thunder: "Distance = speed × time. Light arrives almost instantly."
  p11_wavelength: "v = fλ, so λ = v/f."
  c11p14_wave: Speed = frequency × wavelength. Frequency is set by the source and stays the same between media.
  c11p14_sw: 'Draw the standing wave: fixed ends are nodes, open ends antinodes. Neighbouring nodes are λ/2 apart.'
  c11p14_beats: Beats per second = the difference of the two frequencies.
concepts:
- code: cbse11p.waves.travel
  title: Travelling waves
  notes: |
    A wave carries energy without carrying matter. Transverse (particles move perpendicular: string) and longitudinal
    (parallel: sound in air, compressions and rarefactions). Mechanical waves need a medium. Displacement y = a sin(kx − ωt
    + φ); wavelength λ, wave number k = 2π/λ, period T, ω = 2π/T, frequency ν. Speed v = λν = ω/k. Speed on a string v =
    √(T/μ). Speed of sound v = √(B/ρ) (Newton–Laplace: √(γP/ρ)); about 343 m/s in air at 20 °C, faster in water and solids;
    independent of pressure, rises with temperature.
  explanations:
    text: A wave is a travelling disturbance that carries energy, not the material itself. In a transverse wave the particles move up and down; in a longitudinal wave, like sound, they move back and forth along the wave. Speed = frequency × wavelength.
    visual: 'Draw a wave on a string: crests and troughs. One wavelength λ is crest to crest. If the source makes ν waves each second, the wave moves νλ metres each second.'
    step_by_step: 'Step 1: Note the frequency and wavelength. Step 2: v = νλ. Step 3: For a string, v = √(T/μ). Step 4: Check that changing medium changes speed but not frequency.'
    real_world: Thunder arrives after lightning because sound (about 340 m/s) is far slower than light; counting the seconds tells you how far away the storm is.
  picture:
    kind: compare
    columns:
    - title: Wave type
      points:
      - transverse
      - longitudinal
    - title: Particle motion
      points:
      - perpendicular to wave travel
      - along wave travel
    - title: Example
      points:
      - wave on a string
      - sound in air
    alt: Transverse waves move particles across the direction of travel; longitudinal waves move them along it.
  activity:
    type: formula
    prompt: A wave on a stretched string travels at v = √(T ÷ μ), with μ the mass per metre in kg/m.
    inputs:
    - name: t
      label: Tension T
      min: 10
      max: 1000
      step: 10
      start: 10
      unit: N
    - name: mu
      label: Mass per metre μ
      min: 1
      max: 20
      step: 1
      start: 1
      unit: g/m
    outputs:
    - name: v
      label: Wave speed
      expr: sqrt(t/(mu/1000))
      unit: m/s
      places: 1
    goals:
    - prompt: Make a wave travel at 100 m/s on a 5 g/m string.
      want:
        mu: 5
        v: 100
      mistakes:
      - when:
          mu: 5
          t: 500
        say: '500 N gives 316 m/s. Use kg/m: μ = 0.005 kg/m, so T = v² × μ.'
    - prompt: Keep μ = 5 g/m. Make the wave twice as fast, 200 m/s.
      want:
        mu: 5
        v: 200
      mistakes:
      - when:
          mu: 5
          t: 100
        say: Doubling T gives √2 × the speed (141 m/s). v ∝ √T, so the tension must be 4 times as big.
    - prompt: Keep T = 90 N. Choose the string so the wave travels at 150 m/s.
      want:
        t: 90
        v: 150
      mistakes:
      - when:
          t: 90
          mu:
          - 5
          - 20
        say: A heavier string slows the wave. μ = T ÷ v².
  lesson:
    - teach: 'A wave carries energy, not matter: the medium''s particles only vibrate. Transverse waves vibrate across the direction of travel (a string); longitudinal waves vibrate along it (sound, with compressions and rarefactions).'
      check:
        prompt: 'A ripple passes a floating leaf. The leaf:'
        options:
        - bobs up and down, staying in place
        - travels with the ripple
        - sinks
        answer: bobs up and down, staying in place
        why: Energy moves on; the water only vibrates.
      ways:
      - style: visual
        teach: Transverse and longitudinal waves differ in which way the particles move.
        picture:
          kind: compare
          columns:
          - title: Transverse
            points:
            - particles move across
            - crests and troughs
            - wave on a string
          - title: Longitudinal
            points:
            - particles move along
            - compressions and rarefactions
            - sound in air
          alt: In a transverse wave the particles move across the direction of travel, making crests and troughs; in a longitudinal wave they move along it, making compressions and rarefactions.
      - style: real_world
        teach: A Mexican wave in a cricket stadium travels all the way round, but every spectator stays in their own seat, just standing up and sitting down. The wave carries the pattern and energy, not the people.
    - teach: Wave speed v = νλ = ω/k, where k = 2π/λ and ω = 2πν. On a string v = √(T/μ). Sound in air ≈ 343 m/s at 20 °C, faster in water and in solids.
      check:
        prompt: ν = 100 Hz, λ = 3 m. Speed?
        options:
        - 300 m/s
        - 33 m/s
        - 103 m/s
        answer: 300 m/s
        why: 100 × 3.
      ways:
      - style: step_by_step
        teach: 'Step 1: v = νλ. Step 2: If you know two, find the third. Example: 440 Hz with λ = 0.75 m gives v = 330 m/s. Step 3: On a string v = √(T/μ): tension in newtons, μ in kg/m. Step 4: Time = distance ÷ speed for echoes and thunder.'
      - style: visual
        teach: Sound travels much faster in water and steel than in air.
        picture:
          kind: bars
          unit: m/s
          bars:
          - label: air (20 °C)
            value: 343
          - label: water
            value: 1480
          - label: steel
            value: 5900
          alt: Sound moves at about 343 metres per second in air, about 1480 in water and about 5900 in steel.
    - teach: When a wave enters a new medium its frequency stays the same, so its wavelength changes with the speed. Sound speed in a gas rises with temperature but not with pressure.
      picture:
        kind: compare
        columns:
        - title: Wave
          points:
          - on a string
          - sound in air
          - light
        - title: Type
          points:
          - transverse
          - longitudinal
          - transverse, no medium needed
        alt: Kinds of waves.
      check:
        prompt: 'Sound goes from air into water and speeds up. Its wavelength:'
        options:
        - increases
        - decreases
        - stays the same
        answer: increases
        why: Same ν, larger v, so larger λ.
      ways:
      - style: step_by_step
        teach: 'Step 1: Crossing into a new medium, the source still sets the frequency, so ν stays. Step 2: The speed changes. Step 3: So λ = v/ν changes in step with v. A 1000 Hz note: λ ≈ 0.34 m in air, ≈ 1.48 m in water.'
      - style: real_world
        teach: 'Sound reaches you sooner on a hot afternoon than on a cold morning, because warm air carries it faster. But pumping up the air pressure at the same temperature does not change the speed: density and pressure rise together and cancel.'
  items:
  - prompt: A wave has frequency 50 Hz and wavelength 4 m. Find its speed (in m/s).
    answer: '200'
    check: 50*4
    difficulty: 1
    hints:
    - v = νλ.
    - 50 × 4.
    solution: 200 m/s.
    mistakes:
      '12.5': c11p_wave
  - prompt: Sound travels at 340 m/s. Find the wavelength (in m) of a 170 Hz note.
    answer: '2'
    check: 340/170
    difficulty: 1
    hints:
    - λ = v/ν.
    - 340/170.
    solution: 2 m.
    mistakes: {"0.5": "p11_wavelength", "57800": "p11_wavelength"}
  - prompt: A string has tension 100 N and mass per unit length 0.01 kg/m. Find the wave speed (in m/s).
    answer: '100'
    check: sqrt(100/Rational(1,100))
    difficulty: 2
    hints:
    - v = √(T/μ).
    - √10000.
    solution: 100 m/s.
    mistakes: {"10": "p11_string_speed", "10000": "p11_string_speed"}
  - prompt: 'Sound waves in air are:'
    options:
    - longitudinal
    - transverse
    - electromagnetic
    - standing only
    answer: longitudinal
    difficulty: 1
    hints:
    - Compressions and rarefactions.
    - Back and forth.
    solution: Sound in air is longitudinal.
    mistakes: {"transverse": "p11_sound_type", "electromagnetic": "p11_sound_type", "standing only": "p11_sound_type"}
  - prompt: When sound passes from air into water, what stays the same?
    options:
    - frequency
    - speed
    - wavelength
    - direction always
    answer: frequency
    difficulty: 2
    hints:
    - Set by the source.
    - Speed changes with medium.
    solution: Frequency stays the same; speed and wavelength change.
    mistakes:
      speed: c11p_wave
  - prompt: Thunder is heard 3 s after the lightning. Taking sound speed 340 m/s, how far away (in m) is the storm?
    answer: '1020'
    check: 340*3
    difficulty: 2
    hints:
    - d = vt.
    - 340 × 3.
    solution: 1,020 m.
    mistakes: {"113": "p11_thunder", "340": "p11_thunder"}
  - prompt: A wave has speed 330 m/s and wavelength 1.5 m. Find its frequency (in Hz).
    answer: '220'
    check: 330/1.5
    difficulty: 1
    hints:
    - ν = v/λ.
    - 330 ÷ 1.5.
    solution: 'Step 1: 330/1.5. Step 2: 220 Hz.'
    mistakes:
      '495': c11p14_wave
      '331.5': c11p14_wave
  - prompt: 'Waves on a string are:'
    options:
    - transverse
    - longitudinal
    - neither
    answer: transverse
    difficulty: 1
    hints:
    - Pluck a string and watch it move.
    - It moves sideways while the wave runs along.
    solution: 'Step 1: motion ⟂ travel. Step 2: transverse.'
    mistakes:
      longitudinal: c11p14_wave
      neither: c11p14_wave
  - prompt: 'Sound cannot travel through:'
    options:
    - a vacuum
    - water
    - steel
    answer: a vacuum
    difficulty: 1
    hints:
    - Sound is a mechanical wave.
    - It needs particles to vibrate.
    solution: 'Step 1: no medium, no sound. Step 2: vacuum.'
    mistakes:
      water: c11p14_wave
      steel: c11p14_wave
  - prompt: A string has tension 64 N and μ = 0.04 kg/m. Find the wave speed (in m/s).
    answer: '40'
    check: (64/0.04)**0.5
    difficulty: 2
    hints:
    - v = √(T/μ).
    - 64/0.04 = 1600.
    solution: 'Step 1: √1600. Step 2: 40 m/s.'
    mistakes:
      '1600': c11p14_wave
      '2.56': c11p14_wave
  - prompt: y = 0.02 sin(4πx − 400πt) (SI). Find the wave speed (in m/s).
    answer: '100'
    check: 400/4
    difficulty: 2
    hints:
    - v = ω/k.
    - ω = 400π, k = 4π.
    solution: 'Step 1: 400π/4π. Step 2: 100 m/s.'
    mistakes:
      '1600': c11p14_wave
      '0.01': c11p14_wave
  - prompt: A 500 Hz sound goes from air (340 m/s) into water (1480 m/s). Its frequency in water (Hz)?
    answer: '500'
    check: '500'
    difficulty: 2
    hints:
    - What sets the frequency?
    - The source keeps vibrating at the same rate.
    solution: 'Step 1: frequency is set by the source. Step 2: 500 Hz.'
    mistakes:
      '2176': c11p14_wave
      '115': c11p14_wave
  - prompt: An echo returns 2 s after a shout at a cliff (sound 340 m/s). How far is the cliff (in m)?
    answer: '340'
    check: 340*2/2
    difficulty: 2
    hints:
    - The sound goes there and back.
    - Halve the total distance.
    solution: 'Step 1: total 680 m. Step 2: 340 m.'
    mistakes:
      '680': c11p14_wave
      '170': c11p14_wave
  - prompt: Tension in a string is made 4 times larger. The wave speed becomes how many times?
    answer: '2'
    check: 4**0.5
    difficulty: 3
    hints:
    - v ∝ √T.
    - √4.
    solution: 'Step 1: √4. Step 2: 2 times.'
    mistakes:
      '4': c11p14_wave
      '16': c11p14_wave
  - prompt: 'The speed of sound in air rises when:'
    options:
    - temperature rises
    - pressure rises at fixed temperature
    - loudness rises
    answer: temperature rises
    difficulty: 3
    hints:
    - v = √(γP/ρ); P/ρ is fixed at fixed T.
    - Which change alters P/ρ?
    solution: 'Step 1: v ∝ √T. Step 2: temperature rises.'
    mistakes:
      pressure rises at fixed temperature: c11p14_wave
      loudness rises: c11p14_wave
  - prompt: 'Assertion (A): Sound cannot travel through outer space.

      Reason (R): Sound is a mechanical wave and needs a material medium.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Sound needs particles to vibrate and space has almost none, so R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A bat sends out a 50 kHz squeak in air (sound speed 340 m/s). What is the wavelength of the squeak?'
    options:
    - 6.8 mm
    - 6.8 m
    - 0.15 mm
    answer: 6.8 mm
    hints:
    - λ = v/ν.
    - 50 kHz = 50,000 Hz.
    solution: λ = 340/50000 = 0.0068 m = 6.8 mm. Such short waves let bats find tiny insects.
    mistakes:
      6.8 m: c11p_wave
      0.15 mm: p11_wavelength
    exam: case
    difficulty: 2
  - prompt: 'A string''s tension is reduced to one quarter. The speed of waves on it becomes:'
    options:
    - half
    - one quarter
    - double
    answer: half
    hints:
    - v = √(T/μ).
    - What is √(1/4)?
    solution: v ∝ √T, so a quarter of T gives half the speed.
    mistakes:
      one quarter: p11_string_speed
      double: c11p14_wave
    exam: one_mark
    difficulty: 2
- code: cbse11p.waves.superposition
  title: Superposition, standing waves and beats
  after:
  - cbse11p.waves.travel
  notes: |
    Principle of superposition: displacements add. Reflection: at a rigid end, phase change π; at an open end, none.
    Standing waves: nodes (zero displacement) and antinodes; adjacent nodes λ/2 apart. String fixed at both ends: λn =
    2L/n, νn = nv/(2L), all harmonics (fundamental n = 1). Closed pipe (one end closed): ν = (2n − 1)v/(4L), only odd
    harmonics. Open pipe: ν = nv/(2L), all harmonics. Beats: two close frequencies give loudness that rises and falls,
    beat frequency = |ν₁ − ν₂|; used to tune instruments.
  explanations:
    text: 'When two waves meet, they add up. A wave reflected back along a string adds to the incoming one to make a standing wave with still points (nodes) and big-swing points (antinodes). Two notes with close frequencies make beats: a wobble in loudness.'
    visual: 'Draw a string fixed at both ends vibrating in its simplest way: one loop, nodes at the ends, an antinode in the middle. Its length is half a wavelength.'
    step_by_step: 'Step 1: For a string or open pipe, νn = nv/(2L). Step 2: For a closed pipe, only odd multiples of v/(4L). Step 3: For beats, subtract the two frequencies.'
    real_world: Guitarists tune by listening for beats between two strings; when the wobble stops, the notes match.
  picture:
    kind: number_line
    from: 0
    to: 4
    step: 1
    points:
    - at: 0
      label: node
    - at: 1
      label: antinode
    - at: 2
      label: node
    - at: 3
      label: antinode
    - at: 4
      label: node
    alt: Along a standing wave, nodes and antinodes alternate; nodes are half a wavelength apart.
  activity:
    type: formula
    prompt: A pipe closed at one end holds a node at the closed end and an antinode at the open end. Sound speed is 340 m/s.
    inputs:
    - name: n
      label: Harmonic number n
      min: 1
      max: 9
      step: 1
      start: 1
    - name: l
      label: Pipe length L
      min: 10
      max: 100
      step: 5
      start: 10
      unit: cm
    outputs:
    - name: f
      label: Frequency n × v ÷ 4L
      expr: n*340/(4*l/100)
      unit: Hz
      places: 1
    - name: odd
      label: Fits a closed pipe? (1 yes, 0 no)
      expr: (1-(-1)^n)/2
    goals:
    - prompt: Make a closed pipe whose lowest note is 170 Hz.
      want:
        n: 1
        f: 170
      mistakes:
      - when:
          n: 1
          l: 100
        say: '100 cm gives 85 Hz. A closed pipe holds a quarter wave: λ = 4L, so L = 340 ÷ (4 × 170).'
    - prompt: Keep the 50 cm closed pipe. Make the next note above 170 Hz.
      want:
        l: 50
        n: 3
      mistakes:
      - when:
          l: 50
          n: 2
        say: '340 Hz would be the 2nd harmonic, but a closed pipe needs a node at one end and an antinode at the other: only odd harmonics fit.'
    - prompt: Make 850 Hz in the 50 cm closed pipe.
      want:
        l: 50
        f: 850
      mistakes:
      - when:
          l: 50
          odd: 0
        say: Even harmonics can't form in a closed pipe. Use an odd n.
      - when:
          l: 50
          n:
          - 6
          - 9
        say: 'Too high: 170 Hz × n = 850.'
  lesson:
    - teach: 'Superposition: when waves overlap, their displacements add. Two equal waves travelling opposite ways form a standing wave with nodes (no motion) and antinodes (most motion). Neighbouring nodes are λ/2 apart.'
      check:
        prompt: λ = 0.8 m. Distance between neighbouring nodes?
        options:
        - 0.4 m
        - 0.8 m
        - 0.2 m
        answer: 0.4 m
        why: λ/2.
      ways:
      - style: visual
        teach: Along a standing wave, nodes and antinodes alternate a quarter wavelength apart.
        picture:
          kind: number_line
          from: 0
          to: 4
          step: 0.5
          points:
          - at: 0
            label: N
          - at: 1
            label: A
          - at: 2
            label: N
          - at: 3
            label: A
          - at: 4
            label: N
          alt: 'Along a standing wave, a node, then an antinode, then a node, and so on: neighbouring nodes are half a wavelength apart and a node to the next antinode is a quarter wavelength.'
      - style: real_world
        teach: 'Pluck a guitar string and watch closely: it blurs most in the middle and not at all at the ends. The still ends are nodes and the blurred middle is an antinode, made by waves bouncing back and forth along the string.'
    - teach: 'A string fixed at both ends has nodes at both ends: νₙ = nv/(2L), all harmonics. An open pipe also gives nv/(2L). A pipe closed at one end gives only odd harmonics: (2n − 1)v/(4L).'
      check:
        prompt: Closed pipe fundamental 150 Hz. Next possible frequency?
        options:
        - 450 Hz
        - 300 Hz
        - 600 Hz
        answer: 450 Hz
        why: 'Only odd multiples: 3 × 150.'
      ways:
      - style: visual
        teach: Which harmonics each system allows, with the fundamental ν₁ in each.
        picture:
          kind: compare
          columns:
          - title: String, both ends fixed
            points:
            - ν₁ = v/2L
            - 'all harmonics: ν₁, 2ν₁, 3ν₁'
          - title: Open pipe
            points:
            - ν₁ = v/2L
            - 'all harmonics: ν₁, 2ν₁, 3ν₁'
          - title: Pipe closed at one end
            points:
            - ν₁ = v/4L
            - 'odd only: ν₁, 3ν₁, 5ν₁'
          alt: A string fixed at both ends and an open pipe both have fundamental v over 2L and all harmonics; a pipe closed at one end has fundamental v over 4L and only odd harmonics.
      - style: step_by_step
        teach: 'Step 1: Decide the system: string, open pipe or closed pipe. Step 2: Write its fundamental: v/2L or v/4L. Step 3: Multiply by the allowed n. Example: a 0.8 m string with v = 240 m/s: ν₁ = 150 Hz, then 300, 450 Hz.'
    - teach: 'Beats: two sounds with close frequencies make the loudness rise and fall |ν₁ − ν₂| times a second. Musicians tune until the beats vanish.'
      picture:
        kind: compare
        columns:
        - title: Set-up
          points:
          - string, both ends fixed
          - open pipe
          - closed pipe
        - title: Harmonics
          points:
          - 'all: nv/2L'
          - 'all: nv/2L'
          - 'odd only: (2n − 1)v/4L'
        alt: Which harmonics each set-up allows.
      check:
        prompt: Forks of 440 Hz and 443 Hz together give how many beats per second?
        options:
        - '3'
        - '883'
        - '441.5'
        answer: '3'
        why: 443 − 440.
      ways:
      - style: step_by_step
        teach: 'Step 1: Beat frequency = |ν₁ − ν₂|. Step 2: To find an unknown fork, the answer is known ± beats: two choices. Step 3: Load the unknown with wax (lowers it) or file it (raises it) and see whether the beats go up or down to choose.'
      - style: real_world
        teach: 'A veena or guitar player tunes a string against a reference note: a slow ''wah-wah'' throb means the notes are nearly equal. As the peg turns, the throb slows and finally disappears when the two match exactly.'
  items:
  - prompt: Two tuning forks of 256 Hz and 260 Hz sound together. How many beats per second are heard?
    answer: '4'
    check: 260 - 256
    difficulty: 1
    hints:
    - Difference.
    - 260 − 256.
    solution: 4 beats per second.
    mistakes:
      '516': c11p_beats
  - prompt: A string 0.5 m long, fixed at both ends, carries waves at 200 m/s. Find its fundamental frequency (in Hz).
    answer: '200'
    check: 200/(2*Rational(1,2))
    difficulty: 2
    hints:
    - ν = v/(2L).
    - 200/1.
    solution: 200 Hz.
    mistakes: {"400": "p11_fundamental_string", "100": "p11_fundamental_string"}
  - prompt: An open pipe has fundamental frequency 300 Hz. Find the frequency (in Hz) of its second harmonic.
    answer: '600'
    check: 2*300
    difficulty: 2
    hints:
    - 'Open pipe: all harmonics.'
    - 2 × 300.
    solution: 600 Hz.
    mistakes: {"900": "p11_harmonic", "150": "p11_harmonic"}
  - prompt: A pipe closed at one end has fundamental 100 Hz. Find its next possible frequency (in Hz).
    answer: '300'
    check: 3*100
    difficulty: 2
    hints:
    - 'Closed pipe: odd harmonics only.'
    - 3 × 100.
    solution: 300 Hz.
    mistakes:
      '200': c11p_beats
  - prompt: 'The distance between two neighbouring nodes in a standing wave is:'
    options:
    - λ/2
    - λ
    - λ/4
    - 2λ
    answer: λ/2
    difficulty: 1
    hints:
    - Node–antinode–node.
    - Half a wave.
    solution: Adjacent nodes are λ/2 apart.
    mistakes: {"λ": "p11_nodes", "λ/4": "p11_nodes", "2λ": "p11_nodes"}
  - prompt: 'At a node of a standing wave, the displacement is:'
    options:
    - always zero
    - always maximum
    - half the amplitude
    - changing fastest
    answer: always zero
    difficulty: 1
    hints:
    - Node = still point.
    - Waves cancel.
    solution: Nodes don't move.
    mistakes: {"always maximum": "p11_node", "half the amplitude": "p11_node", "changing fastest": "p11_node"}
  - prompt: Two forks of 512 Hz and 506 Hz sound together. Find the beats per second.
    answer: '6'
    check: 512-506
    difficulty: 1
    hints:
    - Beat frequency = difference.
    - 512 − 506.
    solution: 'Step 1: 512 − 506. Step 2: 6.'
    mistakes:
