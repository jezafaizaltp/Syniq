# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 11. Format: content/README.md.
subject: cbse11-phy
chapter: 11
title: Thermodynamics
tips:
  c11p_firstlaw: 'First law: ΔQ = ΔU + ΔW. Heat given to the gas is positive; work done BY the gas is positive.'
  c11p_carnot: Carnot efficiency η = 1 − T₂/T₁ uses kelvin temperatures, never Celsius.
  p11_adiabatic: "Adiabatic: Q = 0. Work done on the gas goes into its internal energy."
  p11_carnot: "The Carnot engine takes in and gives out heat at fixed temperatures, and moves between them without any heat flow."
  p11_cop: "COP of a fridge = heat removed ÷ work put in."
  p11_efficiency: "Efficiency = work out ÷ heat in = (Q₁ − Q₂)/Q₁."
  p11_isochoric: "Isochoric means constant volume. W = PΔV; what is ΔV?"
  p11_isothermal: "An ideal gas's internal energy depends only on temperature. Isothermal means T stays fixed."
  p11_kelvin_planck: "Kelvin–Planck is about engines. Energy conservation is the first law, not the second."
  p11_work_pv: "W = PΔV. Use the change in volume."
  p11_zeroth: "If A and B are each in thermal equilibrium with C, they share one property. A thermometer reads it."
  c11p11_first: "Write ΔQ = ΔU + ΔW with signs. A state variable depends only on the state the gas is in, not on the path it took to get there."
  c11p11_proc: 'Name the process first: isothermal (ΔU = 0), adiabatic (ΔQ = 0), isochoric (W = 0), isobaric (W = PΔV).'
  c11p11_eng: 'Efficiency = useful work ÷ heat taken in. For Carnot, use kelvin temperatures: 1 − T_cold/T_hot.'
concepts:
- code: cbse11p.thermo.firstlaw
  title: Zeroth and first laws
  notes: |
    Thermal equilibrium: no net heat flow. Zeroth law: if A and B are each in equilibrium with C, they are in equilibrium
    with each other (basis of temperature). Internal energy U: sum of molecular kinetic and potential energies; a state
    variable. Heat and work are ways of transferring energy, not state variables. First law: ΔQ = ΔU + ΔW, ΔW = PΔV.
    Specific heats of gases: Cp − Cv = R (Mayer). Processes: isothermal (T constant, ΔU = 0, W = nRT ln(V₂/V₁)), adiabatic
    (no heat, PV^γ constant), isochoric (V constant, W = 0), isobaric (P constant, W = PΔV). Work = area under P–V curve.
  explanations:
    text: 'Thermodynamics is about heat, work and energy. The first law is energy conservation: heat you give a gas either raises its internal energy or lets it do work by expanding. Different processes keep different things constant.'
    visual: 'Draw a P–V graph: the work done by a gas is the area under its curve. A flat line (constant pressure) gives a rectangle: W = P × ΔV.'
    step_by_step: 'Step 1: Identify the process (which quantity is constant). Step 2: Find W (zero if volume is constant; PΔV at constant pressure). Step 3: Use ΔQ = ΔU + ΔW for the unknown.'
    real_world: A bicycle pump gets warm because you do work compressing the air quickly, raising its internal energy.
  picture:
    kind: compare
    columns:
    - title: Process
      points:
      - isothermal
      - adiabatic
      - isochoric
      - isobaric
    - title: Constant
      points:
      - temperature
      - no heat exchange
      - volume
      - pressure
    alt: Four thermodynamic processes and what each keeps constant.
  activity:
    type: formula
    prompt: 'First law: ΔU = Q − W. Q is heat given TO the gas; W is work done BY the gas.'
    inputs:
    - name: q
      label: Heat into the gas Q
      min: -500
      max: 500
      step: 50
      start: 0
      unit: J
    - name: w
      label: Work done by the gas W
      min: -500
      max: 500
      step: 50
      start: 0
      unit: J
    outputs:
    - name: du
      label: Change in internal energy ΔU
      expr: q-w
      unit: J
    goals:
    - prompt: A gas takes in 300 J of heat and its internal energy rises by 200 J. Set the work it did.
      want:
        q: 300
        du: 200
      mistakes:
      - when:
          q: 300
          w: -100
        say: 'W is the work done BY the gas. Here ΔU is less than Q, so the gas spent 100 J pushing outward: W = +100.'
    - prompt: A gas expands at constant temperature and does 250 J of work. Set Q.
      want:
        w: 250
        du: 0
      mistakes:
      - when:
          w: 250
          q: 0
        say: 'Q = 0 makes ΔU = −250: the gas would cool. At constant temperature U stays the same, so heat must flow in to pay for the work.'
    - prompt: A gas is squashed with no heat flow (adiabatic) and 400 J of work is done ON it.
      want:
        q: 0
        w: -400
      mistakes:
      - when:
          q: 0
          w: 400
        say: W = +400 is the gas doing work. Work done ON the gas makes W negative, so ΔU = 0 − (−400).
      - when:
          q:
          - 50
          - 500
        say: 'Adiabatic means no heat flows: Q = 0.'
  lesson:
    - teach: 'Two bodies in thermal equilibrium have no net heat flow. Zeroth law: if A and B are each in equilibrium with C, they are in equilibrium with each other. That is why a thermometer works.'
      check:
        prompt: 'The zeroth law lets us define:'
        options:
        - temperature
        - heat
        - work
        answer: temperature
        why: 'Bodies in equilibrium share one property: temperature.'
      ways:
      - style: visual
        teach: 'Zeroth law: two bodies that each match a third body also match each other.'
        picture:
          kind: flow
          steps:
          - A is in equilibrium with C
          - B is in equilibrium with C
          - So A and B are in equilibrium
          - They share one temperature
          alt: If body A and body B are each in thermal equilibrium with C, the thermometer, then A and B are in equilibrium with each other and have the same temperature.
      - style: real_world
        teach: 'A thermometer under your tongue and then in your sibling''s mouth both read 37 °C. The thermometer is the third body C: because each of you matches it, you match each other, with no heat flowing between you.'
    - teach: 'First law: ΔQ = ΔU + ΔW. Heat given to a gas raises its internal energy and/or lets it do work. At constant pressure, W = PΔV; generally W is the area under the P–V graph.'
      check:
        prompt: Gas gets 800 J heat, does 300 J work. ΔU?
        options:
        - 500 J
        - 1100 J
        - −500 J
        answer: 500 J
        why: 800 − 300.
      ways:
      - style: visual
        teach: 'First law as an energy account: heat in is split between internal energy and work.'
        picture:
          kind: bars
          unit: J
          bars:
          - label: heat in ΔQ
            value: 900
          - label: internal energy ΔU
            value: 650
          - label: work by gas ΔW
            value: 250
          alt: '900 joules of heat go into a gas: 650 joules raise its internal energy and 250 joules are done as work, adding back to 900.'
      - style: step_by_step
        teach: 'Step 1: Heat into the gas is +, heat out is −. Step 2: Work done BY the gas is +, work done ON it is −. Step 3: Use ΔQ = ΔU + ΔW. Step 4: At constant pressure W = PΔV; otherwise, the area under the P–V curve.'
    - teach: 'Processes: isothermal (T constant, ΔU = 0, so Q = W), adiabatic (no heat, so ΔU = −W), isochoric (V constant, W = 0, so Q = ΔU), isobaric (P constant, W = PΔV). For gases Cp − Cv = R.'
      picture:
        kind: compare
        columns:
        - title: Process
          points:
          - isothermal
          - adiabatic
          - isochoric
          - isobaric
        - title: Key fact
          points:
          - ΔU = 0
          - ΔQ = 0
          - W = 0
          - W = PΔV
        alt: The four basic thermodynamic processes.
      check:
        prompt: A gas is heated in a sealed rigid box. Work done by it?
        options:
        - zero
        - PΔV > 0
        - equal to the heat
        answer: zero
        why: Volume does not change.
      ways:
      - style: step_by_step
        teach: 'Step 1: Name the process. Step 2: Find which quantity is zero: isothermal ΔU = 0, adiabatic Q = 0, isochoric W = 0. Step 3: Put that zero into ΔQ = ΔU + ΔW. Step 4: The other two are then equal (or opposite).'
      - style: real_world
        teach: 'Pump up a cycle tyre fast and the pump barrel gets hot: there''s no time for heat to escape, so the work you do goes into the air''s internal energy (adiabatic). A pressure cooker on a low flame heats food at almost fixed volume (isochoric).'
  items:
  - prompt: A gas absorbs 500 J of heat and does 200 J of work. Find the change in internal energy (in J).
    answer: '300'
    check: 500 - 200
    difficulty: 1
    hints:
    - ΔU = ΔQ − ΔW.
    - 500 − 200.
    solution: "First law: ΔU = Q − W = 500 − 200 = 300 J."
    mistakes:
      '700': c11p_firstlaw
  - prompt: A gas expands from 2 m³ to 5 m³ at a constant pressure of 1000 Pa. Find the work done (in J).
    answer: '3000'
    check: 1000*(5-2)
    difficulty: 1
    hints:
    - W = PΔV.
    - 1000 × 3.
    solution: "W = PΔV = 1000 × (5 − 2) = 3,000 J."
    mistakes: {"7000": "p11_work_pv", "5000": "p11_work_pv"}
  - prompt: 'In an isothermal process for an ideal gas, the change in internal energy is:'
    options:
    - zero
    - equal to the heat supplied
    - negative
    - equal to PV
    answer: zero
    difficulty: 2
    hints:
    - U depends only on T.
    - T is constant.
    solution: ΔU = 0 because T doesn't change.
    mistakes: {"equal to the heat supplied": "p11_isothermal", "negative": "p11_isothermal", "equal to PV": "p11_isothermal"}
  - prompt: 'In an isochoric process, the work done is:'
    options:
    - zero
    - PΔV
    - maximum
    - equal to heat
    answer: zero
    difficulty: 1
    hints:
    - Volume doesn't change.
    - ΔV = 0.
    solution: W = PΔV = 0.
    mistakes: {"PΔV": "p11_isochoric", "maximum": "p11_isochoric", "equal to heat": "p11_isochoric"}
  - prompt: 'The zeroth law of thermodynamics leads to the idea of:'
    options:
    - temperature
    - entropy
    - heat engines
    - internal energy
    answer: temperature
    difficulty: 2
    hints:
    - Equilibrium with a third body.
    - Thermometers.
    solution: "If A and B are each in equilibrium with C, they are in equilibrium with each other; the shared property is temperature."
    mistakes: {"entropy": "p11_zeroth", "heat engines": "p11_zeroth", "internal energy": "p11_zeroth"}
  - prompt: In an adiabatic compression, 400 J of work is done on a gas. Find ΔU (in J).
    answer: '400'
    check: 0 - (-400)
    difficulty: 2
    hints:
    - 'No heat: ΔQ = 0.'
    - ΔU = −ΔW, and ΔW = −400.
    solution: "Adiabatic means Q = 0. Work done on the gas is W = −400 J, so ΔU = Q − W = 0 + 400 = +400 J."
    mistakes: {"-400": "p11_adiabatic", "0": "p11_adiabatic"}
  - prompt: A gas absorbs 1200 J and its internal energy rises by 700 J. Find the work done by the gas (in J).
    answer: '500'
    check: 1200-700
    difficulty: 1
    hints:
    - ΔW = ΔQ − ΔU.
    - 1200 − 700.
    solution: 'Step 1: 1200 − 700. Step 2: 500 J.'
    mistakes:
      '1900': c11p11_first
      '-500': c11p11_first
  - prompt: A gas at constant pressure 2 × 10⁵ Pa expands by 0.01 m³. Find the work done (in J).
    answer: '2000'
    check: 2e5*0.01
    difficulty: 1
    hints:
    - W = PΔV.
    - 2 × 10⁵ × 10⁻².
    solution: 'Step 1: 2 × 10³. Step 2: 2000 J.'
    mistakes:
      '20000': c11p11_first
      '200': c11p11_first
  - prompt: 'In an adiabatic process:'
    options:
    - no heat enters or leaves
    - temperature stays constant
    - volume stays constant
    answer: no heat enters or leaves
    difficulty: 1
    hints:
    - '''Adiabatic'' means insulated.'
    - ΔQ = 0.
    solution: 'Step 1: ΔQ = 0. Step 2: no heat exchange.'
    mistakes:
      temperature stays constant: c11p11_proc
      volume stays constant: c11p11_proc
  - prompt: A gas expands adiabatically and does 150 J of work. Find ΔU (in J).
    answer: '-150'
    check: '-150'
    difficulty: 2
    hints:
    - ΔQ = 0.
    - ΔU = −ΔW.
    solution: 'Step 1: 0 = ΔU + 150. Step 2: ΔU = −150 J.'
    mistakes:
      '150': c11p11_first
      '0': c11p11_proc
  - prompt: In an isothermal expansion an ideal gas does 400 J of work. Heat absorbed (in J)?
    answer: '400'
    check: '400'
    difficulty: 2
    hints:
    - 'Isothermal: ΔU = 0.'
    - So ΔQ = ΔW.
    solution: 'Step 1: ΔU = 0. Step 2: Q = 400 J.'
    mistakes:
      '0': c11p11_proc
      '-400': c11p11_first
  - prompt: A gas is heated at constant volume with 250 J. Find ΔU (in J).
    answer: '250'
    check: '250'
    difficulty: 2
    hints:
    - 'Isochoric: W = 0.'
    - All heat goes into U.
    solution: 'Step 1: W = 0. Step 2: ΔU = 250 J.'
    mistakes:
      '0': c11p11_proc
      '-250': c11p11_first
  - prompt: Which is NOT a state variable?
    options:
    - heat
    - internal energy
    - temperature
    answer: heat
    difficulty: 2
    hints:
    - A state variable depends only on the present state.
    - Which one depends on the path taken?
    solution: 'Step 1: heat depends on the path. Step 2: not a state variable.'
    mistakes:
      internal energy: c11p11_first
      temperature: c11p11_first
  - prompt: For a gas, Cv = 20.8 J/mol K. Find Cp (R = 8.3) in J/mol K.
    answer: '29.1'
    check: 20.8+8.3
    difficulty: 3
    hints:
    - 'Mayer: Cp − Cv = R.'
    - Add R.
    solution: 'Step 1: 20.8 + 8.3. Step 2: 29.1 J/mol K.'
    mistakes:
      '12.5': c11p11_first
      '20.8': c11p11_first
  - prompt: A gas goes round a closed cycle and does 60 J of net work. Net heat absorbed (in J)?
    answer: '60'
    check: '60'
    difficulty: 3
    hints:
    - A cycle returns to the start state.
    - ΔU over a full cycle is 0.
    solution: 'Step 1: ΔU = 0. Step 2: Q = W = 60 J.'
    mistakes:
      '0': c11p11_first
      '-60': c11p11_first
  - prompt: 'Assertion (A): In an isothermal expansion of an ideal gas, all the heat absorbed is converted into work.

      Reason (R): The internal energy of an ideal gas depends only on its temperature.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true. With T fixed, ΔU = 0 by R, so ΔQ = ΔW: R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A gas in a cylinder absorbs 800 J of heat while its piston is pushed out at a constant pressure of 10⁵ Pa through 3 × 10⁻³ m³. Find the change in internal energy.'
    options:
    - 500 J
    - 1100 J
    - 300 J
    answer: 500 J
    hints:
    - Work by the gas = PΔV.
    - ΔU = ΔQ − ΔW.
    solution: W = 10⁵ × 3 × 10⁻³ = 300 J; ΔU = 800 − 300 = 500 J.
    mistakes:
      1100 J: c11p_firstlaw
      300 J: p11_work_pv
    exam: case
    difficulty: 2
  - prompt: In which process is the work done by the gas equal to the decrease in its internal energy?
    options:
    - Adiabatic
    - Isothermal
    - Isochoric
    answer: Adiabatic
    hints:
    - Which process has ΔQ = 0?
    - Then ΔU = −ΔW.
    solution: 'With no heat exchange, ΔU = −ΔW: the gas uses its own internal energy to do work.'
    mistakes:
      Isothermal: p11_isothermal
      Isochoric: p11_isochoric
    exam: one_mark
    difficulty: 2
- code: cbse11p.thermo.secondlaw
  title: Second law and heat engines
  after:
  - cbse11p.thermo.firstlaw
  notes: |
    Heat engine: absorbs Q₁ from a hot reservoir, does work W, rejects Q₂ to a cold sink; efficiency η = W/Q₁ = 1 − Q₂/Q₁.
    Refrigerator/heat pump: takes Q₂ from the cold body using work W; coefficient of performance α = Q₂/W. Second law:
    Kelvin–Planck (no engine can turn all heat into work) and Clausius (no device can move heat from cold to hot without
    work). Reversible and irreversible processes. Carnot engine: two isothermal + two adiabatic steps; η = 1 − T₂/T₁ (K);
    no engine between the same reservoirs is more efficient (Carnot's theorem).
  explanations:
    text: A heat engine turns some heat into work, but the second law says it must always throw some heat away to a colder place. No engine can be 100% efficient. The best possible engine, the Carnot engine, has efficiency 1 − T_cold/T_hot.
    visual: 'Draw a hot box at the top, an engine in the middle and a cold box at the bottom. Arrows: Q₁ in from the top, W out to the side, Q₂ down to the cold box. W = Q₁ − Q₂.'
    step_by_step: 'Step 1: Write W = Q₁ − Q₂. Step 2: Efficiency = W/Q₁. Step 3: For Carnot, convert temperatures to kelvin and use 1 − T₂/T₁.'
    real_world: A car engine wastes most of its fuel energy as heat through the radiator and exhaust; typical efficiencies are only 25–40%.
  picture:
    kind: flow
    steps:
    - Hot reservoir gives Q₁
    - Engine does work W
    - Cold sink gets Q₂
    - W = Q₁ − Q₂
    alt: A heat engine takes Q₁ from the hot reservoir, does work W, and rejects Q₂ to the cold sink.
  activity:
    type: formula
    prompt: The best a heat engine can do is the Carnot efficiency 1 − T_cold ÷ T_hot, with both temperatures in kelvin.
    inputs:
    - name: th
      label: Hot side T_hot
      min: 300
      max: 800
      step: 1
      start: 300
      unit: K
    - name: tc
      label: Cold side T_cold
      min: 1
      max: 400
      step: 1
      start: 1
      unit: K
    outputs:
    - name: eff
      label: Carnot efficiency
      expr: 1-tc/th
      places: 3
    goals:
    - prompt: The hot side is at 327 °C and the cold side at 27 °C. Set them and read the efficiency.
      want:
        th: 600
        tc: 300
      mistakes:
      - when:
          th: 327
          tc: 27
        say: 'Those are °C. Carnot''s formula needs kelvin: add 273 to each.'
    - prompt: Keep the cold side at 300 K. Make the efficiency 0.6.
      want:
        tc: 300
        eff: 0.6
      mistakes:
      - when:
          tc: 300
          th: 720
        say: '720 K gives 0.583. Efficiency isn''t in proportion to T_hot: 1 − 300/T = 0.6 means 300/T = 0.4.'
    - prompt: The hot side is at 400 K. Make the efficiency 0.25.
      want:
        th: 400
        eff: 0.25
      mistakes:
      - when:
          th: 400
          tc: 100
        say: T_cold = 100 K gives 0.75. Efficiency is 1 − T_cold/T_hot, so T_cold must be 75% of 400.
  lesson:
    - teach: A heat engine takes Q₁ from a hot source, does work W, and dumps Q₂ to a cold sink. Efficiency η = W/Q₁ = 1 − Q₂/Q₁, always less than 1.
      check:
        prompt: Engine takes 500 J, does 100 J of work. Efficiency?
        options:
        - 20%
        - 80%
        - 5%
        answer: 20%
        why: 100/500.
      ways:
      - style: visual
        teach: 'A heat engine: heat in from the hot source, some becomes work, the rest goes to the sink.'
        picture:
          kind: flow
          steps:
          - Hot source gives Q₁
          - Engine does work W = Q₁ − Q₂
          - Cold sink takes Q₂
          - η = W/Q₁ = 1 − Q₂/Q₁
          alt: Heat Q1 flows from the hot source into the engine, the engine does work W, and the rest, Q2, goes to the cold sink; efficiency is W over Q1.
      - style: real_world
        teach: A car engine burns petrol at a very high temperature but turns only about a third of the energy into motion. The rest leaves as hot exhaust and through the radiator. No engine can avoid sending some heat to a colder place.
    - teach: 'Second law. Kelvin–Planck: no engine can turn all its heat into work. Clausius: heat will not flow from cold to hot by itself; a refrigerator needs work. Its coefficient of performance is Q₂/W.'
      check:
        prompt: Fridge removes 600 J using 200 J of work. COP?
        options:
        - '3'
        - '0.33'
        - '4'
        answer: '3'
        why: 600/200.
      ways:
      - style: visual
        teach: 'Engine and refrigerator are mirror images: the fridge uses work to move heat uphill.'
        picture:
          kind: compare
          columns:
          - title: Heat engine
            points:
            - heat flows hot → cold
            - gives out work
            - η = W/Q₁
          - title: Refrigerator
            points:
            - heat pumped cold → hot
            - needs work in
            - COP = Q₂/W
          alt: A heat engine lets heat flow from hot to cold and gives out work; a refrigerator uses work to pump heat from cold to hot, and its coefficient of performance is Q2 over W.
      - style: step_by_step
        teach: 'Step 1: Kelvin–Planck: some heat must always be rejected, so η < 1. Step 2: Clausius: heat goes cold → hot only if work is put in. Step 3: Refrigerator COP = heat removed ÷ work, and it can be more than 1. A fridge removing 900 J with 300 J of work has COP 3.'
    - teach: 'A Carnot engine (two isothermal + two adiabatic steps) is the most efficient possible between two temperatures: η = 1 − T₂/T₁, with T in kelvin.'
      picture:
        kind: flow
        steps:
        - Take Q₁ from hot T₁
        - Do work W
        - Reject Q₂ to cold T₂
        - η = 1 − T₂/T₁
        alt: Energy flow through a heat engine.
      check:
        prompt: Carnot engine between 400 K and 300 K. Efficiency?
        options:
        - 25%
        - 75%
        - 33%
        answer: 25%
        why: 1 − 300/400.
      ways:
      - style: step_by_step
        teach: 'Step 1: Convert both temperatures to kelvin. Step 2: η = 1 − T₂/T₁. Step 3: Turn it into a percentage. Example: 400 K and 280 K: η = 1 − 0.7 = 0.3 = 30%. Step 4: A real engine between the same temperatures does worse.'
      - style: real_world
        teach: 'Power stations use very hot steam and cool it with river or sea water: the bigger the gap between source and sink temperatures, the higher the best possible efficiency. That is why engineers keep pushing boiler temperatures up.'
  items:
  - prompt: An engine takes 1000 J of heat and rejects 600 J. Find its efficiency as a percentage.
    answer: '40'
    check: (1000-600)*100/1000
    difficulty: 1
    hints:
    - W = 1000 − 600.
    - η = W/Q₁.
    solution: "Work = 1000 − 600 = 400 J; η = W/Q₁ = 400/1000 = 40%."
    mistakes: {"60": "p11_efficiency", "400": "p11_efficiency"}
  - prompt: A Carnot engine works between 500 K and 300 K. Find its efficiency as a percentage.
    answer: '40'
    check: (1 - Rational(300,500))*100
    difficulty: 1
    hints:
    - 1 − T₂/T₁.
    - 1 − 300/500.
    solution: "η = 1 − T₂/T₁ = 1 − 300/500 = 0.4 = 40%."
    mistakes:
      '60': c11p_carnot
  - prompt: A Carnot engine works between 127 °C and 27 °C. Find its efficiency as a percentage (use +273).
    answer: '25'
    check: (1 - Rational(300,400))*100
    difficulty: 2
    hints:
    - 400 K and 300 K.
    - 1 − 300/400.
    solution: "In kelvin: 400 K and 300 K. η = 1 − 300/400 = 0.25 = 25%."
    mistakes:
      '79': c11p_carnot
  - prompt: A refrigerator removes 300 J from inside using 100 J of work. Find its coefficient of performance.
    answer: '3'
    check: 300/100
    difficulty: 2
    hints:
    - α = Q₂/W.
    - 300/100.
    solution: "COP = Q₂/W = 300/100 = 3."
    mistakes: {"1/3": "p11_cop", "4": "p11_cop"}
  - prompt: Which statement is the Kelvin–Planck form of the second law?
    options:
    - "No engine can convert all the heat it absorbs into work"
    - "Energy cannot be created or destroyed, only changed"
    - "Heat can flow from a cold body to a hot one by itself"
    - "The internal energy of a gas depends only on volume"
    answer: No engine can convert all the heat it absorbs into work
    difficulty: 2
    hints:
    - Some heat must be rejected.
    - η < 1.
