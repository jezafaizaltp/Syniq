# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse11-phy
chapter: 7
title: Gravitation
tips:
  c11p_inverse_square: 'Gravity follows an inverse square law: doubling the distance makes the force one quarter, not one half.'
  c11p_escape: Escape speed √(2gR) does not depend on the mass of the object being launched.
concepts:
- code: cbse11p.grav.law
  title: Newton's law of gravitation and g
  notes: |
    Kepler's laws: planets move in ellipses with the Sun at a focus; equal areas in equal times; T² ∝ a³. Universal law:
    F = Gm₁m₂/r², G = 6.67 × 10⁻¹¹ N m² kg⁻². g = GM/R² ≈ 9.8 m/s² at the surface. g decreases with height:
    g(h) ≈ g(1 − 2h/R) for small h; with depth: g(d) = g(1 − d/R), zero at the centre. Weight = mg changes, mass doesn't.
  explanations:
    text: 'Every two masses attract each other with a force F = Gm₁m₂/r². The force gets weaker with the square of distance: twice as far means a quarter of the force. On Earth''s surface this gives g ≈ 9.8 m/s², which gets smaller as you go up a mountain or down a mine.'
    visual: 'Draw the Earth and the Moon with an arrow from each pointing to the other: equal and opposite pulls. Move the Moon twice as far: draw the arrows a quarter as long.'
    step_by_step: 'Step 1: Write F = Gm₁m₂/r². Step 2: For ratio problems, see how each quantity changes. Step 3: Distance doubled → force ÷ 4. Step 4: For g at height or depth, use the formulas.'
    real_world: Kepler's third law lets astronomers work out how long a planet takes to go round the Sun from its distance.
  picture:
    kind: compare
    columns:
    - title: Change
      points:
      - mass of one body × 2
      - distance × 2
      - distance × 3
    - title: Force becomes
      points:
      - × 2
      - ÷ 4
      - ÷ 9
    alt: Doubling one mass doubles the gravitational force; doubling the distance makes it a quarter; tripling the distance makes it a ninth.
  items:
  - prompt: 'If the distance between two masses is doubled, the gravitational force becomes:'
    options:
    - one quarter
    - half
    - double
    - four times
    answer: one quarter
    difficulty: 1
    hints:
    - Inverse square law.
    - 1/2².
    solution: F ∝ 1/r², so it becomes 1/4.
    mistakes:
      half: c11p_inverse_square
  - prompt: If the distance between two masses is tripled, by what factor does the force decrease?
    answer: '9'
    check: 3**2
    difficulty: 1
    hints:
    - 1/r².
    - 3².
    solution: It becomes 1/9 of the original.
  - prompt: 'Kepler''s third law states that T² is proportional to:'
    options:
    - a³
    - a²
    - a
    - 1/a²
    answer: a³
    difficulty: 2
    hints:
    - Square of period, cube of distance.
    - Harmonic law.
    solution: T² ∝ a³.
  - prompt: A person weighs 600 N on Earth. What is their mass if g = 10 m/s² (in kg)?
    answer: '60'
    check: 600/10
    difficulty: 1
    hints:
    - W = mg.
    - 600/10.
    solution: 60 kg.
  - prompt: What is the value of g at the centre of the Earth?
    options:
    - Zero
    - 9.8 m/s²
    - Twice 9.8 m/s²
    - Infinite
    answer: Zero
    difficulty: 2
    hints:
    - g(d) = g(1 − d/R).
    - d = R.
    solution: g = 0 at the centre.
  - prompt: 'Your mass on the Moon compared with on Earth is:'
    options:
    - the same
    - one sixth
    - six times
    - zero
    answer: the same
    difficulty: 1
    hints:
    - Mass is the amount of matter.
    - Weight changes.
    solution: Mass stays the same; only weight changes.
- code: cbse11p.grav.orbits
  title: Potential energy, escape speed and satellites
  after:
  - cbse11p.grav.law
  notes: |
    Gravitational PE: U = −GMm/r (zero at infinity). Escape speed vₑ = √(2GM/R) = √(2gR) ≈ 11.2 km/s for Earth.
    Orbital speed near the surface v₀ = √(gR) ≈ 7.9 km/s; vₑ = √2 v₀. Satellites: v = √(GM/r), period T = 2π√(r³/GM).
    Geostationary satellite: period 24 h, about 36,000 km above the equator. Energy of orbiting satellite = −GMm/2r.
    Weightlessness in orbit: free fall.
  explanations:
    text: 'To escape Earth''s gravity completely, an object must be launched at about 11.2 km/s: the escape speed √(2gR). A satellite in a low orbit moves at about 7.9 km/s. Geostationary satellites take 24 hours per orbit, so they stay above the same place.'
    visual: 'Imagine firing a cannonball sideways faster and faster from a tall mountain. Slow: it lands nearby. At about 7.9 km/s: the ground curves away as fast as it falls, so it orbits. At 11.2 km/s: it escapes.'
    step_by_step: 'Step 1: For escape, use vₑ = √(2gR). Step 2: For a low orbit, v₀ = √(gR). Step 3: vₑ = √2 × v₀. Step 4: Remember neither depends on the satellite''s mass.'
    real_world: ISRO's INSAT and GSAT satellites are geostationary, used for TV, weather and communication.
  picture:
    kind: compare
    columns:
    - title: Low orbit speed
      points:
      - √(gR)
      - ≈ 7.9 km/s
      - circles Earth
    - title: Escape speed
      points:
      - √(2gR)
      - ≈ 11.2 km/s
      - leaves Earth
    alt: Low orbit speed is √(gR), about 7.9 km/s; escape speed is √(2gR), about 11.2 km/s.
  items:
  - prompt: What is the approximate escape speed from Earth?
    options:
    - 11.2 km/s
    - 7.9 km/s
    - 3 km/s
    - 300,000 km/s
    answer: 11.2 km/s
    difficulty: 1
    hints:
    - Faster than orbit speed.
    - About 11.
    solution: About 11.2 km/s.
  - prompt: 'Escape speed depends on the mass of the object launched:'
    options:
    - No, it doesn't
    - Yes, heavier needs more
    - Yes, lighter needs more
    - Only for rockets
    answer: No, it doesn't
    difficulty: 2
    hints:
    - vₑ = √(2GM/R).
    - Only the planet's M and R.
    solution: Escape speed is the same for any object.
    mistakes:
      Yes, heavier needs more: c11p_escape
  - prompt: What is the period of a geostationary satellite (in hours)?
    answer: '24'
    check: '24'
    difficulty: 1
    hints:
    - Same as Earth's rotation.
    - One day.
    solution: 24 hours.
  - prompt: Orbital speed near Earth is v₀. Escape speed is √2 times that. If v₀ = 8 km/s, find vₑ squared (in km²/s²).
    answer: '128'
    check: 2*8**2
    difficulty: 2
    hints:
    - vₑ = √2 × 8.
    - 'Square it: 2 × 64.'
    solution: vₑ² = 128, so vₑ ≈ 11.3 km/s.
  - prompt: 'Astronauts in an orbiting spacecraft feel weightless because:'
    options:
    - they and the craft are in free fall together
    - there is no gravity in space
    - they have no mass
    - the Moon pulls them
    answer: they and the craft are in free fall together
    difficulty: 2
    hints:
    - Gravity is still about 90% there.
    - Falling together.
    solution: They fall together with the craft, so nothing presses on them.
  - prompt: 'Gravitational potential energy is taken as zero:'
    options:
    - at infinity
    - at the Earth's surface
    - at the centre of the Earth
    - on the Moon
    answer: at infinity
    difficulty: 2
    hints:
    - U = −GMm/r.
    - r → ∞.
    solution: U = 0 at infinite distance; it is negative elsewhere.
