# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse11-phy
chapter: 7
title: Gravitation
tips:
  c11p_inverse_square: "Gravity follows an inverse square law: F ∝ 1/r². Square the distance factor and turn it upside down."
  c11p_escape: Escape speed √(2gR) does not depend on the mass of the object being launched.
  p11_escape: "7.9 km/s is orbital speed near the surface; 300,000 km/s is light. Escape speed is √2 times orbital speed."
  p11_escape_sq: "vₑ = √2 v₀, so vₑ² = 2v₀²."
  p11_g_centre: "At the centre, Earth's mass pulls equally in every direction. What is the net pull?"
  p11_geostationary: "A geostationary satellite stays over the same spot, so it turns once with the Earth."
  p11_inverse_square: "F ∝ 1/r². Tripling r divides the force by 3²."
  p11_kepler3: "Kepler's third law: the square of the period goes with the cube of the orbit size."
  p11_mass_moon: "Weight depends on g; mass is the amount of matter. Does matter change when you travel?"
  p11_pe_zero: "U = −GMm/r. Where does this formula give zero?"
  p11_weight_mass: "Weight W = mg, so m = W/g."
  p11_weightless: "At the space station's height, g is still about 90% of its surface value. Both astronaut and craft are falling round the Earth."
concepts:
- code: cbse11p.grav.law
  title: Newton's law of gravitation and g
  notes: |
    Kepler's laws: planets move in ellipses with the Sun at a focus; equal areas in equal times; T² ∝ a³. Universal law:
    F = Gm₁m₂/r², G = 6.67 × 10⁻¹¹ N m² kg⁻². g = GM/R² ≈ 9.8 m/s² at the surface. g decreases with height:
    g(h) ≈ g(1 − 2h/R) for small h; with depth: g(d) = g(1 − d/R), zero at the centre. Weight = mg changes, mass doesn't.
  explanations:
    text: 'Every two masses attract each other with a force F = Gm₁m₂/r². The force gets weaker with the square of distance: twice as far means a quarter of the force. On Earth''s surface this gives g ≈ 9.8 m/s², which gets smaller as you go up a mountain or down a mine.'
    visual: 'Draw the Earth and the Moon with an arrow from each pointing to the other: equal and opposite pulls. Move the Moon twice as far: draw the arrows a quarter as long.'
    step_by_step: 'Step 1: Write F = Gm₁m₂/r². Step 2: For ratio problems, see how each quantity changes. Step 3: Distance doubled → force ÷ 4. Step 4: For g at height or depth, use the formulas.'
    real_world: Kepler's third law lets astronomers work out how long a planet takes to go round the Sun from its distance.
  picture:
    kind: compare
    columns:
    - title: Change
      points:
      - mass of one body × 2
      - distance × 2
      - distance × 3
    - title: Force becomes
      points:
      - × 2
      - ÷ 4
      - ÷ 9
    alt: Doubling one mass doubles the gravitational force; doubling the distance makes it a quarter; tripling the distance makes it a ninth.
  activity:
    type: formula
    prompt: Rise h Earth radii above the surface. You're then (1 + h) radii from the centre, and g = 9.8 ÷ (1 + h)².
    inputs:
    - name: h
      label: Height above the surface
      min: 0
      max: 5
      step: 0.25
      start: 0
      unit: R
    outputs:
    - name: r
      label: Distance from the centre
      expr: 1+h
      unit: R
      places: 2
    - name: g
      label: g there
      expr: 9.8/(1+h)^2
      unit: m/s²
      places: 2
    goals:
    - prompt: Go where g is a quarter of its surface value.
      want:
        h: 1
      mistakes:
      - when:
          h: 3
        say: At h = 3R you're 4R from the centre, so g falls to 1/16. g goes as 1/r², with r measured from the centre.
      - when:
          h: 4
        say: '4R up is 5R from the centre: g/25. A quarter needs r = 2R.'
    - prompt: Go where g is one-ninth.
      want:
        h: 2
      mistakes:
      - when:
          h: 3
        say: '3R up is 4R from the centre: g/16. One-ninth needs r = 3R, which is 2R above the surface.'
      - when:
          h: 4.5
        say: That's 5.5R from the centre. One-ninth needs r = 3R.
    - prompt: Go where g is about 4.36 m/s².
      want:
        g:
        - 4.3
        - 4.4
      mistakes:
      - when:
          h:
          - 1
          - 5
        say: 'Too high: g is already below 4.36. 9.8 ÷ 4.36 = 2.25 = 1.5², so r = 1.5R.'
      - when:
          h: 0.25
        say: 'Not high enough yet: g is still 6.27.'
  items:
  - prompt: 'If the distance between two masses is doubled, the gravitational force becomes:'
    options:
    - one quarter
    - half
    - double
    - four times
    answer: one quarter
    difficulty: 1
    hints:
    - Inverse square law.
    - 1/2².
    solution: F ∝ 1/r², so it becomes 1/4.
    mistakes:
      half: c11p_inverse_square
  - prompt: If the distance between two masses is tripled, by what factor does the force decrease?
    answer: '9'
    check: 3**2
    difficulty: 1
    hints:
    - 1/r².
    - 3².
    solution: It becomes 1/9 of the original.
    mistakes: {"3": "p11_inverse_square", "6": "p11_inverse_square"}
  - prompt: 'Kepler''s third law states that T² is proportional to:'
    options:
    - a³
    - a²
    - a
    - 1/a²
    answer: a³
    difficulty: 2
    hints:
    - Square of period, cube of distance.
    - Harmonic law.
    solution: T² ∝ a³.
    mistakes: {"a²": "p11_kepler3", "a": "p11_kepler3", "1/a²": "p11_kepler3"}
  - prompt: A person weighs 600 N on Earth. What is their mass if g = 10 m/s² (in kg)?
    answer: '60'
    check: 600/10
    difficulty: 1
    hints:
    - W = mg.
    - 600/10.
    solution: 60 kg.
    mistakes: {"6000": "p11_weight_mass", "600": "p11_weight_mass"}
  - prompt: What is the value of g at the centre of the Earth?
    options:
    - Zero
    - 9.8 m/s²
    - Twice 9.8 m/s²
    - Infinite
    answer: Zero
    difficulty: 2
    hints:
    - g(d) = g(1 − d/R).
    - d = R.
    solution: g = 0 at the centre.
    mistakes: {"9.8 m/s²": "p11_g_centre", "Twice 9.8 m/s²": "p11_g_centre", "Infinite": "p11_g_centre"}
  - prompt: 'Your mass on the Moon compared with on Earth is:'
    options:
    - the same
    - one sixth
    - six times
    - zero
    answer: the same
    difficulty: 1
    hints:
    - Mass is the amount of matter.
    - Weight changes.
    solution: Mass stays the same; only weight changes.
    mistakes: {"one sixth": "p11_mass_moon", "six times": "p11_mass_moon", "zero": "p11_mass_moon"}
- code: cbse11p.grav.orbits
  title: Potential energy, escape speed and satellites
  after:
  - cbse11p.grav.law
  notes: |
    Gravitational PE: U = −GMm/r (zero at infinity). Escape speed vₑ = √(2GM/R) = √(2gR) ≈ 11.2 km/s for Earth.
    Orbital speed near the surface v₀ = √(gR) ≈ 7.9 km/s; vₑ = √2 v₀. Satellites: v = √(GM/r), period T = 2π√(r³/GM).
    Geostationary satellite: period 24 h, about 36,000 km above the equator. Energy of orbiting satellite = −GMm/2r.
    Weightlessness in orbit: free fall.
  explanations:
    text: 'To escape Earth''s gravity completely, an object must be launched at about 11.2 km/s: the escape speed √(2gR). A satellite in a low orbit moves at about 7.9 km/s. Geostationary satellites take 24 hours per orbit, so they stay above the same place.'
    visual: 'Imagine firing a cannonball sideways faster and faster from a tall mountain. Slow: it lands nearby. At about 7.9 km/s: the ground curves away as fast as it falls, so it orbits. At 11.2 km/s: it escapes.'
    step_by_step: 'Step 1: For escape, use vₑ = √(2gR). Step 2: For a low orbit, v₀ = √(gR). Step 3: vₑ = √2 × v₀. Step 4: Remember neither depends on the satellite''s mass.'
    real_world: ISRO's INSAT and GSAT satellites are geostationary, used for TV, weather and communication.
  picture:
    kind: compare
    columns:
    - title: Low orbit speed
      points:
      - √(gR)
      - ≈ 7.9 km/s
      - circles Earth
    - title: Escape speed
      points:
      - √(2gR)
      - ≈ 11.2 km/s
      - leaves Earth
    alt: Low orbit speed is √(gR), about 7.9 km/s; escape speed is √(2gR), about 11.2 km/s.
  activity:
    type: formula
    prompt: 'For a planet with surface gravity g and radius R: escape speed √(2gR); speed of a low orbit √(gR).'
    inputs:
    - name: g
      label: Surface g
      min: 1
      max: 20
      step: 0.2
      start: 1
      unit: m/s²
    - name: r
      label: Radius R (thousand km)
      min: 1
      max: 70
      step: 0.2
      start: 1
    outputs:
    - name: ve
      label: Escape speed
      expr: sqrt(2*g*r*1000000)/1000
      unit: km/s
      places: 2
    - name: vo
      label: Low-orbit speed
      expr: sqrt(g*r*1000000)/1000
      unit: km/s
      places: 2
    goals:
    - prompt: Earth (g = 9.8, R = 6400 km) has v_e = 11.2 km/s. Keep g = 9.8 and make v_e twice as big.
      want:
        g: 9.8
        ve:
        - 22.3
        - 22.5
      mistakes:
      - when:
          g: 9.8
          r: 12.8
        say: 'Doubling R raises v_e only by √2, to 15.8 km/s. v_e = √(2gR): to double it, R must be 4 times as big.'
    - prompt: On a planet with g = 2, make the low-orbit speed 4 km/s.
      want:
        g: 2
        vo: 4
      mistakes:
      - when:
          g: 2
          ve: 4
        say: 'That''s the escape speed at 4 km/s. A low orbit needs less: v_e ÷ √2.'
    - prompt: 'Make Earth: g = 9.8, R = 6400 km. Read both speeds.'
      want:
        g: 9.8
        r: 6.4
      mistakes:
      - when:
          g: 9.8
          r: 64
        say: 'R is in thousands of km: 6400 km is 6.4.'
      - when:
          r: 6.4
          g:
          - 10
          - 20
        say: Earth's g is 9.8.
  items:
  - prompt: What is the approximate escape speed from Earth?
    options:
    - 11.2 km/s
    - 7.9 km/s
    - 3 km/s
    - 300,000 km/s
    answer: 11.2 km/s
    difficulty: 1
    hints:
    - Faster than orbit speed.
    - About 11.
    solution: About 11.2 km/s.
    mistakes: {"7.9 km/s": "p11_escape", "3 km/s": "p11_escape", "300,000 km/s": "p11_escape"}
  - prompt: 'Escape speed depends on the mass of the object launched:'
    options:
    - No, it doesn't
    - Yes, heavier needs more
    - Yes, lighter needs more
    - Only for rockets
    answer: No, it doesn't
    difficulty: 2
    hints:
    - vₑ = √(2GM/R).
    - Only the planet's M and R.
    solution: Escape speed is the same for any object.
    mistakes:
      Yes, heavier needs more: c11p_escape
  - prompt: What is the period of a geostationary satellite (in hours)?
    answer: '24'
    check: '24'
    difficulty: 1
    hints:
    - Same as Earth's rotation.
    - One day.
    solution: 24 hours.
    mistakes: {"12": "p11_geostationary", "1": "p11_geostationary"}
  - prompt: Orbital speed near Earth is v₀. Escape speed is √2 times that. If v₀ = 8 km/s, find vₑ squared (in km²/s²).
    answer: '128'
    check: 2*8**2
    difficulty: 2
    hints:
    - vₑ = √2 × 8.
    - 'Square it: 2 × 64.'
    solution: vₑ² = 128, so vₑ ≈ 11.3 km/s.
    mistakes: {"64": "p11_escape_sq", "16": "p11_escape_sq"}
  - prompt: 'Astronauts in an orbiting spacecraft feel weightless because:'
    options:
    - they and the craft are in free fall together
    - there is no gravity in space
    - they have no mass
    - the Moon pulls them
    answer: they and the craft are in free fall together
    difficulty: 2
    hints:
    - Gravity is still about 90% there.
    - Falling together.
    solution: They fall together with the craft, so nothing presses on them.
    mistakes: {"there is no gravity in space": "p11_weightless", "they have no mass": "p11_weightless", "the Moon pulls them": "p11_weightless"}
  - prompt: 'Gravitational potential energy is taken as zero:'
    options:
    - at infinity
    - at the Earth's surface
    - at the centre of the Earth
    - on the Moon
    answer: at infinity
    difficulty: 2
    hints:
    - U = −GMm/r.
    - r → ∞.
    solution: U = 0 at infinite distance; it is negative elsewhere.
    mistakes: {"at the Earth's surface": "p11_pe_zero", "at the centre of the Earth": "p11_pe_zero", "on the Moon": "p11_pe_zero"}
