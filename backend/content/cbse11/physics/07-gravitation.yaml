# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse11-phy
chapter: 7
title: Gravitation
tips:
  c11p_inverse_square: "Gravity follows an inverse square law: F ∝ 1/r². Square the distance factor and turn it upside down."
  c11p_escape: Escape speed √(2gR) does not depend on the mass of the object being launched.
  p11_escape: "7.9 km/s is orbital speed near the surface; 300,000 km/s is light. Escape speed is √2 times orbital speed."
  p11_escape_sq: "vₑ = √2 v₀, so vₑ² = 2v₀²."
  p11_g_centre: "At the centre, Earth's mass pulls equally in every direction. What is the net pull?"
  p11_geostationary: "A geostationary satellite stays over the same spot, so it turns once with the Earth."
  p11_inverse_square: "F ∝ 1/r². Tripling r divides the force by 3²."
  p11_kepler3: "Kepler's third law: the square of the period goes with the cube of the orbit size."
  p11_mass_moon: "Weight depends on g; mass is the amount of matter. Does matter change when you travel?"
  p11_pe_zero: "U = −GMm/r. Where does this formula give zero?"
  p11_weight_mass: "Weight W = mg, so m = W/g."
  p11_weightless: "At the space station's height, g is still about 90% of its surface value. Both astronaut and craft are falling round the Earth."
  c11p07_inv: 'Gravity follows an inverse square: change the distance by a factor k and the force changes by 1/k².'
  c11p07_g: g = GM/R². Weight = mg changes from place to place; mass does not.
  c11p07_orbit: Escape speed is √2 times the low orbital speed. Orbits and escape do not depend on the satellite's own mass.
concepts:
- code: cbse11p.grav.law
  title: Newton's law of gravitation and g
  notes: |
    Kepler's laws: planets move in ellipses with the Sun at a focus; equal areas in equal times; T² ∝ a³. Universal law:
    F = Gm₁m₂/r², G = 6.67 × 10⁻¹¹ N m² kg⁻². g = GM/R² ≈ 9.8 m/s² at the surface. g decreases with height:
    g(h) ≈ g(1 − 2h/R) for small h; with depth: g(d) = g(1 − d/R), zero at the centre. Weight = mg changes, mass doesn't.
  explanations:
    text: 'Every two masses attract each other with a force F = Gm₁m₂/r². The force gets weaker with the square of distance: twice as far means a quarter of the force. On Earth''s surface this gives g ≈ 9.8 m/s², which gets smaller as you go up a mountain or down a mine.'
    visual: 'Draw the Earth and the Moon with an arrow from each pointing to the other: equal and opposite pulls. Move the Moon twice as far: draw the arrows a quarter as long.'
    step_by_step: 'Step 1: Write F = Gm₁m₂/r². Step 2: For ratio problems, see how each quantity changes. Step 3: Distance doubled → force ÷ 4. Step 4: For g at height or depth, use the formulas.'
    real_world: Kepler's third law lets astronomers work out how long a planet takes to go round the Sun from its distance.
  picture:
    kind: compare
    columns:
    - title: Change
      points:
      - mass of one body × 2
      - distance × 2
      - distance × 3
    - title: Force becomes
      points:
      - × 2
      - ÷ 4
      - ÷ 9
    alt: Doubling one mass doubles the gravitational force; doubling the distance makes it a quarter; tripling the distance makes it a ninth.
  activity:
    type: formula
    prompt: Rise h Earth radii above the surface. You're then (1 + h) radii from the centre, and g = 9.8 ÷ (1 + h)².
    inputs:
    - name: h
      label: Height above the surface
      min: 0
      max: 5
      step: 0.25
      start: 0
      unit: R
    outputs:
    - name: r
      label: Distance from the centre
      expr: 1+h
      unit: R
      places: 2
    - name: g
      label: g there
      expr: 9.8/(1+h)^2
      unit: m/s²
      places: 2
    goals:
    - prompt: Go where g is a quarter of its surface value.
      want:
        h: 1
      mistakes:
      - when:
          h: 3
        say: At h = 3R you're 4R from the centre, so g falls to 1/16. g goes as 1/r², with r measured from the centre.
      - when:
          h: 4
        say: '4R up is 5R from the centre: g/25. A quarter needs r = 2R.'
    - prompt: Go where g is one-ninth.
      want:
        h: 2
      mistakes:
      - when:
          h: 3
        say: '3R up is 4R from the centre: g/16. One-ninth needs r = 3R, which is 2R above the surface.'
      - when:
          h: 4.5
        say: That's 5.5R from the centre. One-ninth needs r = 3R.
    - prompt: Go where g is about 4.36 m/s².
      want:
        g:
        - 4.3
        - 4.4
      mistakes:
      - when:
          h:
          - 1
          - 5
        say: 'Too high: g is already below 4.36. 9.8 ÷ 4.36 = 2.25 = 1.5², so r = 1.5R.'
      - when:
          h: 0.25
        say: 'Not high enough yet: g is still 6.27.'
  lesson:
    - teach: 'Every two masses attract: F = Gm₁m₂/r², with G = 6.67 × 10⁻¹¹ N m² kg⁻². The force halves if one mass halves, and falls to a quarter if the distance doubles.'
      check:
        prompt: 'Both masses doubled, distance the same. The force becomes:'
        options:
        - 4 times
        - 2 times
        - the same
        answer: 4 times
        why: 'F ∝ m₁m₂: 2 × 2.'
      ways:
      - style: visual
        teach: 'Inverse square: as the distance grows, the force falls much faster.'
        picture:
          kind: bars
          unit: × F
          bars:
          - label: r
            value: 1
          - label: 4r
            value: 0.0625
          - label: 5r
            value: 0.04
          - label: 10r
            value: 0.01
          alt: At distance r the force is F; at 4r it is one sixteenth of F, at 5r one twenty-fifth, and at 10r one hundredth.
      - style: step_by_step
        teach: 'Step 1: Write F = Gm₁m₂/r². Step 2: Spot what changes: a mass or the distance. Step 3: A mass changes by k → F changes by k. Step 4: Distance changes by k → F changes by 1/k². Double one mass and double r: F × 2 ÷ 4 = F/2.'
    - teach: 'Kepler: planets move in ellipses with the Sun at one focus; a line to the Sun sweeps equal areas in equal times; T² ∝ a³.'
      check:
        prompt: 'A planet moves fastest when it is:'
        options:
        - closest to the Sun
        - farthest from the Sun
        - it moves at the same speed throughout
        answer: closest to the Sun
        why: 'Equal areas: a shorter radius needs a longer arc.'
      ways:
      - style: visual
        teach: Kepler's three laws of planetary motion, side by side in one look.
        picture:
          kind: compare
          columns:
          - title: 1. Orbits
            points:
            - ellipses
            - Sun at one focus
          - title: 2. Areas
            points:
            - equal areas in equal times
            - faster when nearer the Sun
          - title: 3. Periods
            points:
            - T² ∝ a³
            - far planets take much longer
          alt: Planets move in ellipses with the Sun at a focus, sweep equal areas in equal times so they move faster near the Sun, and their period squared is proportional to the semi-major axis cubed.
      - style: real_world
        teach: Earth is closest to the Sun in early January and farthest in early July, so it moves a little faster in January. Saturn is about 9.5 times farther out than Earth; Kepler's third law gives a year of about 29 Earth years, which is what we see.
    - teach: At the surface g = GM/R² ≈ 9.8 m/s². g falls with height (≈ g(1 − 2h/R)) and with depth (g(1 − d/R)), reaching zero at the centre. Mass never changes; weight mg does.
      picture:
        kind: compare
        columns:
        - title: Distance ×
          points:
          - '2'
          - '3'
          - '4'
        - title: Force ×
          points:
          - 1/4
          - 1/9
          - 1/16
        alt: Inverse square law.
      check:
        prompt: 'At depth R/2 below the surface, g is:'
        options:
        - g/2
        - g/4
        - 2g
        answer: g/2
        why: g(1 − ½).
      ways:
      - style: step_by_step
        teach: 'Step 1: At the surface g = GM/R². Step 2: Going up by small h: g'' ≈ g(1 − 2h/R). Step 3: Going down by d: g'' = g(1 − d/R). Step 4: At the centre d = R so g'' = 0. Mass stays the same throughout; weight mg'' changes.'
      - style: real_world
        teach: A 60 kg astronaut is still 60 kg on the Moon, but weighs only about a sixth as much, because the Moon's g is about 1.6 m/s². A scale shows weight; a beam balance compares masses and reads the same on both.
  items:
  - prompt: 'If the distance between two masses is doubled, the gravitational force becomes:'
    options:
    - one quarter
    - half
    - double
    - four times
    answer: one quarter
    difficulty: 1
    hints:
    - Inverse square law.
    - 1/2².
    solution: F ∝ 1/r², so it becomes 1/4.
    mistakes:
      half: c11p_inverse_square
  - prompt: If the distance between two masses is tripled, by what factor does the force decrease?
    answer: '9'
    check: 3**2
    difficulty: 1
    hints:
    - 1/r².
    - 3².
    solution: It becomes 1/9 of the original.
    mistakes: {"3": "p11_inverse_square", "6": "p11_inverse_square"}
  - prompt: 'Kepler''s third law states that T² is proportional to:'
    options:
    - a³
    - a²
    - a
    - 1/a²
    answer: a³
    difficulty: 2
    hints:
    - Square of period, cube of distance.
    - Harmonic law.
    solution: "Kepler's law of periods: the square of the period is proportional to the cube of the semi-major axis, T² ∝ a³."
    mistakes: {"a²": "p11_kepler3", "a": "p11_kepler3", "1/a²": "p11_kepler3"}
  - prompt: A person weighs 600 N on Earth. What is their mass if g = 10 m/s² (in kg)?
    answer: '60'
    check: 600/10
    difficulty: 1
    hints:
    - W = mg.
    - 600/10.
    solution: "W = mg, so m = W/g = 600/10 = 60 kg."
    mistakes: {"6000": "p11_weight_mass", "600": "p11_weight_mass"}
  - prompt: What is the value of g at the centre of the Earth?
    options:
    - Zero
    - 9.8 m/s²
    - Twice 9.8 m/s²
    - Infinite
    answer: Zero
    difficulty: 2
    hints:
    - g(d) = g(1 − d/R).
    - d = R.
    solution: g = 0 at the centre.
    mistakes: {"9.8 m/s²": "p11_g_centre", "Twice 9.8 m/s²": "p11_g_centre", "Infinite": "p11_g_centre"}
  - prompt: 'Your mass on the Moon compared with on Earth is:'
    options:
    - the same
    - one sixth
    - six times
    - zero
    answer: the same
    difficulty: 1
    hints:
    - Mass is the amount of matter.
    - Weight changes.
    solution: Mass stays the same; only weight changes.
    mistakes: {"one sixth": "p11_mass_moon", "six times": "p11_mass_moon", "zero": "p11_mass_moon"}
  - prompt: If the distance between two masses is halved, the force becomes how many times?
    answer: '4'
    check: 2**2
    difficulty: 1
    hints:
    - F ∝ 1/r².
    - (1/2)² in the denominator.
    solution: 'Step 1: r → r/2. Step 2: F × 4.'
    mistakes:
      '2': c11p07_inv
      1/4: c11p07_inv
  - prompt: 'A 70 kg astronaut goes to the Moon. Their mass there is (in kg):'
    answer: '70'
    check: '70'
    difficulty: 1
    hints:
    - Mass is the amount of matter.
    - It does not depend on g.
    solution: 'Step 1: mass is unchanged. Step 2: 70 kg.'
    mistakes:
      '700': c11p07_g
      '11.7': c11p07_g
  - prompt: Kepler's second law says a planet sweeps equal ______ in equal times.
    options:
    - areas
    - distances
    - angles
    answer: areas
    difficulty: 1
    hints:
    - Picture the line from the Sun to the planet.
    - It sweeps out a region.
    solution: 'Step 1: law of areas. Step 2: areas.'
    mistakes:
      distances: c11p07_inv
      angles: c11p07_inv
  - prompt: An object weighs 900 N on Earth. What does it weigh at a height equal to Earth's radius (in N)?
    answer: '225'
    check: 900/4
    difficulty: 2
    hints:
    - Its distance from Earth's centre doubles.
    - Weight ∝ 1/r².
    solution: 'Step 1: r → 2R, so ¼. Step 2: 225 N.'
    mistakes:
      '450': c11p07_inv
      '0': c11p07_inv
  - prompt: Find the gravitational force between two 1000 kg masses 1 m apart (G = 6.67 × 10⁻¹¹), in units of 10⁻⁵ N.
    answer: '6.67'
    check: '6.67'
    difficulty: 2
    hints:
    - F = Gm₁m₂/r².
    - 1000 × 1000 = 10⁶.
    solution: 'Step 1: 6.67 × 10⁻¹¹ × 10⁶. Step 2: 6.67 × 10⁻⁵ N.'
    mistakes:
      '667': c11p07_inv
      '0.667': c11p07_inv
  - prompt: Planet A is 4 times farther from its star than planet B. T_A is how many times T_B?
    answer: '8'
    check: 4**1.5
    difficulty: 2
    hints:
    - T² ∝ a³.
    - T ∝ a^(3/2).
    solution: 'Step 1: 4^(3/2). Step 2: 8.'
    mistakes:
      '16': c11p07_inv
      '64': c11p07_inv
  - prompt: 'As you go deeper into a mine, g:'
    options:
    - decreases
    - increases
    - stays the same
    answer: decreases
    difficulty: 2
    hints:
    - g(d) = g(1 − d/R).
    - At the centre it is zero.
    solution: 'Step 1: d grows, (1 − d/R) shrinks. Step 2: decreases.'
    mistakes:
      increases: c11p07_g
      stays the same: c11p07_g
  - prompt: A planet has twice Earth's mass and twice its radius. g there is what fraction of Earth's g?
    answer: 1/2
    check: 2/4
    difficulty: 3
    hints:
    - g = GM/R².
    - M × 2, R² × 4.
    solution: 'Step 1: 2/4. Step 2: g/2.'
    mistakes:
      '1': c11p07_g
      '2': c11p07_g
  - prompt: At what height (as a fraction of R) does g fall by 1%, using g(1 − 2h/R)?
    answer: 1/200
    check: '0.005'
    difficulty: 3
    hints:
    - 2h/R = 0.01.
    - Solve for h/R.
    solution: 'Step 1: 2h/R = 1/100. Step 2: h = R/200.'
    mistakes:
      1/100: c11p07_g
      1/50: c11p07_g
  - prompt: 'Assertion (A): The acceleration due to gravity is zero at the centre of the Earth.

      Reason (R): At the centre, the pull of the Earth''s mass is equal in all directions and cancels.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true. At the centre, mass all around pulls equally every way, so the net pull is zero: R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A planet has the same density as Earth but twice its radius. What is g on its surface compared with Earth''s?'
    options:
    - 2g
    - g/2
    - 4g
    answer: 2g
    hints:
    - g = GM/R² and M = ρ × (4/3)πR³.
    - So g ∝ ρR.
    solution: g = (4/3)πGρR, so with the same ρ and double R, g doubles.
    mistakes:
      g/2: p11_inverse_square
      4g: c11p07_g
    exam: case
    difficulty: 2
  - prompt: At what height above the Earth's surface does g become 1/4 of its surface value? (R = Earth's radius)
    options:
    - h = R
    - h = 2R
    - h = R/4
    answer: h = R
    hints:
    - g ∝ 1/r² from the centre.
    - 1/4 means r doubles.
    solution: r = 2R from the centre, so the height above the surface is R.
    mistakes:
      h = 2R: p11_g_centre
      h = R/4: c11p07_inv
    exam: short
    difficulty: 2
- code: cbse11p.grav.orbits
  title: Potential energy, escape speed and satellites
  after:
  - cbse11p.grav.law
  notes: |
    Gravitational PE: U = −GMm/r (zero at infinity). Escape speed vₑ = √(2GM/R) = √(2gR) ≈ 11.2 km/s for Earth.
    Orbital speed near the surface v₀ = √(gR) ≈ 7.9 km/s; vₑ = √2 v₀. Satellites: v = √(GM/r), period T = 2π√(r³/GM).
    Geostationary satellite: period 24 h, about 36,000 km above the equator. Energy of orbiting satellite = −GMm/2r.
    Weightlessness in orbit: free fall.
  explanations:
    text: 'To escape Earth''s gravity completely, an object must be launched at about 11.2 km/s: the escape speed √(2gR). A satellite in a low orbit moves at about 7.9 km/s. Geostationary satellites take 24 hours per orbit, so they stay above the same place.'
    visual: 'Imagine firing a cannonball sideways faster and faster from a tall mountain. Slow: it lands nearby. At about 7.9 km/s: the ground curves away as fast as it falls, so it orbits. At 11.2 km/s: it escapes.'
    step_by_step: 'Step 1: For escape, use vₑ = √(2gR). Step 2: For a low orbit, v₀ = √(gR). Step 3: vₑ = √2 × v₀. Step 4: Remember neither depends on the satellite''s mass.'
    real_world: ISRO's INSAT and GSAT satellites are geostationary, used for TV, weather and communication.
  picture:
    kind: compare
    columns:
    - title: Low orbit speed
      points:
      - √(gR)
      - ≈ 7.9 km/s
      - circles Earth
    - title: Escape speed
      points:
      - √(2gR)
      - ≈ 11.2 km/s
      - leaves Earth
    alt: Low orbit speed is √(gR), about 7.9 km/s; escape speed is √(2gR), about 11.2 km/s.
  activity:
    type: formula
    prompt: 'For a planet with surface gravity g and radius R: escape speed √(2gR); speed of a low orbit √(gR).'
    inputs:
    - name: g
      label: Surface g
      min: 1
      max: 20
      step: 0.2
      start: 1
      unit: m/s²
    - name: r
      label: Radius R (thousand km)
      min: 1
      max: 70
      step: 0.2
      start: 1
    outputs:
    - name: ve
      label: Escape speed
      expr: sqrt(2*g*r*1000000)/1000
      unit: km/s
      places: 2
    - name: vo
      label: Low-orbit speed
      expr: sqrt(g*r*1000000)/1000
      unit: km/s
      places: 2
    goals:
    - prompt: Earth (g = 9.8, R = 6400 km) has v_e = 11.2 km/s. Keep g = 9.8 and make v_e twice as big.
      want:
        g: 9.8
        ve:
        - 22.3
        - 22.5
      mistakes:
      - when:
          g: 9.8
          r: 12.8
        say: 'Doubling R raises v_e only by √2, to 15.8 km/s. v_e = √(2gR): to double it, R must be 4 times as big.'
    - prompt: On a planet with g = 2, make the low-orbit speed 4 km/s.
      want:
        g: 2
        vo: 4
      mistakes:
      - when:
          g: 2
          ve: 4
        say: 'That''s the escape speed at 4 km/s. A low orbit needs less: v_e ÷ √2.'
    - prompt: 'Make Earth: g = 9.8, R = 6400 km. Read both speeds.'
      want:
        g: 9.8
        r: 6.4
      mistakes:
      - when:
          g: 9.8
          r: 64
        say: 'R is in thousands of km: 6400 km is 6.4.'
      - when:
          r: 6.4
          g:
          - 10
          - 20
        say: Earth's g is 9.8.
  lesson:
    - teach: Gravitational PE is U = −GMm/r, taken as zero at infinity, so it is negative everywhere else. Bound objects have negative total energy.
      check:
        prompt: Why is gravitational PE negative near a planet?
        options:
        - it is taken as zero at infinity and gravity pulls inward
        - mass is negative
        - g is negative
        answer: it is taken as zero at infinity and gravity pulls inward
        why: You must add energy to pull the body away to infinity.
      ways:
      - style: visual
        teach: 'U = −GMm/r: zero far away, more negative as you come closer.'
        picture:
          kind: number_line
          from: -4
          to: 0
          points:
          - at: -4
            label: 'at R: −GMm/R'
          - at: -2
            label: 'at 2R: half as deep'
          - at: -1
            label: at 4R
          - at: 0
            label: 'infinity: 0'
          alt: Potential energy is most negative at the surface, half as deep at twice the radius, and rises towards zero far away at infinity.
      - style: real_world
        teach: Think of the Earth's gravity as a deep well. Zero is ground level outside the well, at infinity. Anything near the Earth is down inside, at a negative level, and must be given energy to climb out.
    - teach: Escape speed vₑ = √(2GM/R) = √(2gR) ≈ 11.2 km/s for Earth. It does not depend on the launched object's mass.
      check:
        prompt: 'A 1 kg and a 100 kg probe launched from Earth. Escape speed:'
        options:
        - is the same for both
        - is greater for 100 kg
        - is greater for 1 kg
        answer: is the same for both
        why: m cancels out of the energy balance.
      ways:
      - style: visual
        teach: Escape speed comes from making kinetic energy fill the well exactly.
        picture:
          kind: flow
          steps:
          - 'Start: ½mv² − GMm/R'
          - 'Just escapes: 0 at infinity'
          - ½mv² = GMm/R
          - vₑ = √(2GM/R) ≈ 11.2 km/s
          alt: 'Set the starting kinetic energy plus potential energy equal to zero at infinity: half m v squared equals G M m over R, giving the escape speed root 2GM over R, about 11.2 kilometres per second.'
      - style: step_by_step
        teach: 'Step 1: Total energy at launch = ½mv² − GMm/R. Step 2: To just escape, it must reach 0. Step 3: Solve: v = √(2GM/R) = √(2gR). Step 4: m cancels, so a pebble and a rocket need the same escape speed.'
    - teach: A satellite at radius r moves at v = √(GM/r) with period T = 2π√(r³/GM). Near the surface v₀ = √(gR) ≈ 7.9 km/s, and vₑ = √2 v₀. Geostationary satellites orbit once in 24 h above the equator.
      picture:
        kind: compare
        columns:
        - title: Speed
          points:
          - orbit near surface
          - escape
        - title: Earth value
          points:
          - ≈ 7.9 km/s
          - ≈ 11.2 km/s
        alt: Orbital and escape speeds for Earth.
      check:
        prompt: 'A higher satellite orbit has:'
        options:
        - lower speed and longer period
        - higher speed
        - the same period
        answer: lower speed and longer period
        why: v ∝ 1/√r, T ∝ r^(3/2).
      ways:
      - style: step_by_step
        teach: 'Step 1: Gravity gives the centripetal force: GMm/r² = mv²/r. Step 2: So v = √(GM/r). Step 3: Period T = 2πr/v = 2π√(r³/GM). Step 4: Near the surface v₀ = √(gR) ≈ 7.9 km/s, and vₑ = √2 × v₀.'
      - style: real_world
        teach: INSAT and GSAT weather and TV satellites sit about 36,000 km up over the equator, going round once in 24 h. They keep pace with the Earth, so a dish on a roof can point at one spot and never move.
  items:
  - prompt: What is the approximate escape speed from Earth?
    options:
    - 11.2 km/s
    - 7.9 km/s
    - 3 km/s
    - 300,000 km/s
    answer: 11.2 km/s
    difficulty: 1
    hints:
    - Faster than orbit speed.
    - About 11.
    solution: "v_e = √(2gR) = √(2 × 9.8 × 6.4 × 10⁶) ≈ 11.2 km/s."
