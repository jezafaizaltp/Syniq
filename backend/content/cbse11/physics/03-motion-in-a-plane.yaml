# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse11-phy
chapter: 3
title: Motion in a Plane
tips:
  c11p_vector_add: 'Vectors at right angles combine by Pythagoras: R = √(A² + B²). Don''t add the sizes directly.'
  c11p_range: Range R = u² sin 2θ / g is largest at θ = 45°; angles θ and 90° − θ give the same range.
  p11_centripetal: "a = v²/r. Square the speed first."
  p11_complementary: "R depends on sin 2θ. Compare sin 60° and sin 120°."
  p11_component: "Horizontal component = F cos θ, with θ measured from the horizontal."
  p11_magnitude: "|v| = √(x² + y²)."
  p11_max_resultant: "The resultant is largest when both forces point the same way."
  p11_proj_height: "H = u² sin²θ / (2g). Square sin θ as well as u."
  p11_range: "R = u² sin 2θ / g. At 45°, sin 2θ = sin 90°."
  p11_resultant: "R² = A² + B² + 2AB cos θ. cos 120° is negative."
  p11_time_flight: "T = 2u sin θ ÷ g. The 2 covers going up and coming down. Put in u, sin 30° = ½ and g."
  p11_vector: "A vector needs a direction. Speed tells how fast; which one also says which way?"
  c11p03_vec: Draw the two vectors tail to head. If they are at right angles use Pythagoras; otherwise use R² = A² + B² + 2AB cos θ.
  c11p03_comp: The component next to the angle uses cos; the one opposite uses sin.
  c11p03_proj: Split the launch speed into u cos θ (steady) and u sin θ (slowed by g). Then use the formula for T, H or R.
concepts:
- code: cbse11p.plane.vectors
  title: Vectors and their addition
  notes: |
    Scalars have magnitude only (mass, time, speed); vectors have magnitude and direction (displacement, velocity, force).
    Addition: triangle/parallelogram law; R = √(A² + B² + 2AB cos θ). Perpendicular: R = √(A² + B²). Resolution:
    A_x = A cos θ, A_y = A sin θ. Unit vectors î, ĵ, k̂. Multiplying by a scalar changes length (and reverses direction if
    negative). Relative velocity in 2D (rain–man problems).
  explanations:
    text: 'Scalars have only size, like mass. Vectors have size and direction, like velocity. To add vectors, place them head to tail; the resultant joins start to end. At right angles, use Pythagoras: 3 and 4 give 5. Any vector can be split into x and y parts: A cos θ and A sin θ.'
    visual: 'Draw an arrow 3 units east, then from its tip an arrow 4 units north. The arrow from the start to the final tip is 5 units long: the resultant.'
    step_by_step: 'Step 1: Draw vectors head to tail. Step 2: If at right angles, use Pythagoras. Step 3: Otherwise split each into x and y components. Step 4: Add components separately. Step 5: Recombine with Pythagoras.'
    real_world: A boat crossing a river at 4 m/s while the current flows at 3 m/s actually moves at 5 m/s at an angle.
  picture:
    kind: geometry
    points:
      O:
      - 1
      - 1
      A:
      - 7
      - 1
      B:
      - 7
      - 9
    segments:
    - - O
      - A
      - '3'
    - - A
      - B
      - '4'
    - - O
      - B
      - R = 5
    alt: Adding a vector of 3 east and 4 north head to tail gives a resultant of 5.
  activity:
    type: formula
    prompt: Two forces A and B act at an angle θ. The resultant is R = √(A² + B² + 2AB cos θ).
    inputs:
    - name: a
      label: Force A
      min: 1
      max: 10
      step: 1
      start: 1
      unit: N
    - name: b
      label: Force B
      min: 1
      max: 10
      step: 1
      start: 1
      unit: N
    - name: c
      label: 'cos θ: 1 same way, −1 opposite'
      min: -1
      max: 1
      step: 0.5
      start: 1
    outputs:
    - name: r
      label: Resultant R
      expr: sqrt(a^2+b^2+2*a*b*c)
      unit: N
      places: 2
    goals:
    - prompt: Make forces of 3 N and 4 N give a resultant of 5 N.
      want:
        a: 3
        b: 4
        r: 5
      mistakes:
      - when:
          a: 3
          b: 4
          c: 1
        say: 'Pointing the same way they add to 7 N. 5 N needs them at right angles: 3² + 4² = 5², cos 90° = 0.'
      - when:
          a: 3
          b: 4
          c: -1
        say: Opposite ways leave only 1 N. Turn them to a right angle.
    - prompt: Make forces of 6 N and 8 N give the smallest resultant they can.
      want:
        a: 6
        b: 8
        r: 2
      mistakes:
      - when:
          a: 6
          b: 8
          c: 0
        say: At right angles they give 10 N. The smallest is when they pull in opposite directions.
    - prompt: Make two 5 N forces give a resultant of exactly 5 N.
      want:
        a: 5
        b: 5
        r: 5
      mistakes:
      - when:
          a: 5
          b: 5
          c: 0.5
        say: 'At 60° they give 8.66 N. Spread them wider: at 120° the resultant equals each force.'
      - when:
          a: 5
          b: 5
          c: 0
        say: At 90° they give 7.07 N. Open the angle further.
  lesson:
    - teach: 'A scalar has only size (mass, speed, time). A vector has size and direction (displacement, velocity, force). Vectors add by the triangle rule: put the tail of the second at the head of the first.'
      check:
        prompt: Which is a scalar?
        options:
        - speed
        - force
        - displacement
        answer: speed
        why: Speed has no direction attached.
      ways:
      - style: visual
        teach: 'Triangle rule: 9 m east then 12 m north gives a resultant of 15 m.'
        picture:
          kind: geometry
          points:
            O:
            - 1
            - 1
            A:
            - 7
            - 1
            B:
            - 7
            - 9
          segments:
          - - O
            - A
            - 9 m east
          - - A
            - B
            - 12 m north
          - - O
            - B
            - R = 15 m
          alt: An arrow 9 metres east followed by an arrow 12 metres north; the arrow from the start to the end is the resultant, 15 metres long.
      - style: real_world
        teach: 'Speed is a scalar: the speedometer reads 40 km/h whichever way you turn. Velocity is a vector: 40 km/h north is different from 40 km/h south. A pilot must add the wind''s velocity to the plane''s to know where it really goes.'
    - teach: 'For vectors A and B at angle θ: R = √(A² + B² + 2AB cos θ). At 90°, R = √(A² + B²). Same direction gives A + B (largest); opposite gives |A − B| (smallest).'
      check:
        prompt: 6 N and 8 N at right angles. Resultant?
        options:
        - 10 N
        - 14 N
        - 2 N
        answer: 10 N
        why: √(36 + 64) = 10.
      ways:
      - style: step_by_step
        teach: 'Step 1: Note A, B and the angle θ between them. Step 2: R = √(A² + B² + 2AB cos θ). Step 3: θ = 0 gives A + B, the largest. θ = 180° gives |A − B|, the smallest. θ = 90° gives √(A² + B²).'
      - style: visual
        teach: 'Forces of 7 N and 24 N: the resultant depends on the angle between them.'
        picture:
          kind: bars
          unit: N
          bars:
          - label: same way (0°)
            value: 31
          - label: at 90°
            value: 25
          - label: opposite (180°)
            value: 17
          alt: Forces of 7 and 24 newtons give a resultant of 31 newtons in the same direction, 25 at right angles and 17 in opposite directions.
    - teach: A vector A at angle θ to the x-axis has components A_x = A cos θ and A_y = A sin θ. In unit-vector form A = A_x î + A_y ĵ, and |A| = √(A_x² + A_y²).
      picture:
        kind: compare
        columns:
        - title: Component
          points:
          - along the angle (x)
          - across the angle (y)
        - title: Formula
          points:
          - A cos θ
          - A sin θ
        alt: Resolving a vector into components.
      check:
        prompt: 20 N at 30° to the horizontal. Vertical component?
        options:
        - 10 N
        - 17.3 N
        - 20 N
        answer: 10 N
        why: 20 sin 30° = 10.
      ways:
      - style: step_by_step
        teach: 'Step 1: Measure θ from the x-axis. Step 2: A_x = A cos θ (the side next to the angle). Step 3: A_y = A sin θ. Step 4: Check: √(A_x² + A_y²) = A. Example: 20 N at 30°: A_x ≈ 17.3 N, A_y = 10 N.'
      - style: real_world
        teach: 'Pulling a suitcase by a slanted handle: part of your pull drags it forward (the horizontal component) and part lifts it a little (the vertical component). A lower handle angle puts more of your pull into moving forward.'
  items:
  - prompt: Two forces of 3 N and 4 N act at right angles. Find the resultant (in N).
    answer: '5'
    check: sqrt(3**2+4**2)
    difficulty: 1
    hints:
    - √(3² + 4²).
    - √25.
    solution: "R = √(3² + 4²) = √25 = 5 N."
    mistakes:
      '7': c11p_vector_add
  - prompt: Which is a vector quantity?
    options:
    - Velocity
    - Mass
    - Time
    - Speed
    answer: Velocity
    difficulty: 1
    hints:
    - Has direction.
    - Speed with direction.
    solution: Velocity has magnitude and direction.
    mistakes: {"Mass": "p11_vector", "Time": "p11_vector", "Speed": "p11_vector"}
  - prompt: A 10 N force acts at 60° to the horizontal. Find its horizontal component (in N).
    answer: '5'
    check: 10*cos(pi/3)
    difficulty: 1
    hints:
    - F cos θ.
    - 10 × 1/2.
    solution: "F_x = F cos 60° = 10 × 0.5 = 5 N."
    mistakes: {"8.66": "p11_component", "10": "p11_component"}
  - prompt: Two equal forces of 10 N act at 120° to each other. Find the resultant (in N).
    answer: '10'
    check: sqrt(100+100+2*100*cos(2*pi/3))
    difficulty: 2
    hints:
    - R² = A² + B² + 2AB cos 120°.
    - 100 + 100 − 100.
    solution: "R = √(P² + Q² + 2PQ cos θ) = √(100 + 100 + 200 × (−½)) = √100 = 10 N."
    mistakes: {"20": "p11_resultant", "0": "p11_resultant", "17.3": "p11_resultant"}
  - prompt: Find the magnitude of the vector 6î + 8ĵ.
    answer: '10'
    check: sqrt(36+64)
    difficulty: 1
    hints:
    - √(36 + 64).
    - √100.
    solution: "|A| = √(6² + 8²) = √100 = 10."
    mistakes: {"14": "p11_magnitude", "100": "p11_magnitude"}
  - prompt: What is the maximum resultant of forces 5 N and 12 N (in N)?
    answer: '17'
    check: 5 + 12
    difficulty: 2
    hints:
    - Same direction.
    - 5 + 12.
    solution: 17 N when they point the same way.
    mistakes: {"13": "p11_max_resultant", "7": "p11_max_resultant"}
  - prompt: Two forces of 5 N and 12 N act at right angles. Find the resultant (in N).
    answer: '13'
    check: (25+144)**0.5
    difficulty: 1
    hints:
    - 'Right angle: use Pythagoras.'
    - √(5² + 12²).
    solution: 'Step 1: 25 + 144 = 169. Step 2: 13 N.'
    mistakes:
      '17': c11p03_vec
      '7': c11p03_vec
  - prompt: What is the smallest possible resultant of forces 7 N and 3 N (in N)?
    answer: '4'
    check: 7-3
    difficulty: 1
    hints:
    - Smallest when they point opposite ways.
    - Subtract.
    solution: 'Step 1: opposite directions. Step 2: 7 − 3 = 4 N.'
    mistakes:
      '10': c11p03_vec
      '0': c11p03_vec
  - prompt: Pick the vector quantity.
    options:
    - momentum
    - energy
    - temperature
    answer: momentum
    difficulty: 1
    hints:
    - Which one has a direction?
    - p = mv, and v has a direction.
    solution: 'Step 1: momentum = mass × velocity. Step 2: it is a vector.'
    mistakes:
      energy: c11p03_vec
      temperature: c11p03_vec
  - prompt: A 30 N force acts at 60° to the horizontal. Find its vertical component (in N, to the nearest whole).
    answer: '26'
    check: round(30*0.866)
    difficulty: 2
    hints:
    - Vertical is across from the 60° angle.
    - sin 60° ≈ 0.866.
    solution: 'Step 1: 30 sin 60°. Step 2: ≈ 26 N.'
    mistakes:
      '15': c11p03_comp
      '30': c11p03_comp
  - prompt: Find the magnitude of 5î − 12ĵ.
    answer: '13'
    check: (25+144)**0.5
    difficulty: 2
    hints:
    - '|A| = √(A_x² + A_y²).'
    - The minus sign disappears when squared.
    solution: 'Step 1: √(25 + 144). Step 2: 13.'
    mistakes:
      '7': c11p03_vec
      '17': c11p03_vec
  - prompt: Two forces of 4 N each act at 60°. Find the resultant (in N, to 1 decimal place).
    answer: '6.9'
    check: round((16+16+2*16*0.5)**0.5,1)
    difficulty: 2
    hints:
    - Use R² = A² + B² + 2AB cos θ.
    - cos 60° = ½.
    solution: 'Step 1: R² = 16 + 16 + 16 = 48. Step 2: R = √48 ≈ 6.9 N.'
    mistakes:
      '8': c11p03_vec
      '4': c11p03_vec
  - prompt: Multiplying a vector by −2 does what?
    options:
    - doubles its length and reverses its direction
    - halves its length
    - only reverses its direction
    answer: doubles its length and reverses its direction
    difficulty: 2
    hints:
    - The number 2 changes the length.
    - The minus sign changes the direction.
    solution: 'Step 1: |−2| = 2 doubles the length. Step 2: the minus reverses it.'
    mistakes:
      halves its length: c11p03_vec
      only reverses its direction: c11p03_vec
  - prompt: A = 3î + 4ĵ and B = î − 2ĵ. Find |A + B|.
    options:
    - 2√5
    - '6'
    - '4'
    answer: 2√5
    difficulty: 3
    hints:
    - Add î parts and ĵ parts separately.
    - Then find the magnitude.
    solution: 'Step 1: A + B = 4î + 2ĵ. Step 2: √20 = 2√5.'
    mistakes:
      '6': c11p03_vec
      '4': c11p03_vec
  - prompt: Rain falls vertically at 3 m/s; a person walks at 4 m/s. At what speed does the rain seem to hit the person (in m/s)?
    answer: '5'
    check: (9+16)**0.5
    difficulty: 3
    hints:
    - Relative velocity = rain velocity − person velocity.
    - The two are at right angles.
    solution: 'Step 1: √(3² + 4²). Step 2: 5 m/s.'
    mistakes:
      '7': c11p03_vec
      '1': c11p03_vec
  - prompt: 'Assertion (A): Two vectors of magnitudes 3 and 5 can never have a resultant of magnitude 1.

      Reason (R): The resultant of two vectors lies between the difference and the sum of their magnitudes.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true. The resultant must lie between 5 − 3 = 2 and 5 + 3 = 8, so 1 is impossible: R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A boat heads straight across a river at 4 m/s while the river flows at 3 m/s. What is the boat''s actual speed relative to the bank?'
    options:
    - 5 m/s
    - 7 m/s
    - 1 m/s
    answer: 5 m/s
    hints:
    - The two velocities are at right angles.
    - Use √(A² + B²).
    solution: √(16 + 9) = 5 m/s.
    mistakes:
      7 m/s: p11_resultant
      1 m/s: c11p_vector_add
    exam: case
    difficulty: 2
  - prompt: A vector A = 3î + 4ĵ. What angle does it make with the x-axis (tan θ)?
    options:
    - tan θ = 4/3
    - tan θ = 3/4
    - tan θ = 5/3
    answer: tan θ = 4/3
    hints:
    - tan θ = A_y/A_x.
    - A_y = 4, A_x = 3.
    solution: "tan θ = A_y/A_x = 4/3."
    mistakes:
      tan θ = 3/4: p11_component
      tan θ = 5/3: c11p03_comp
    exam: one_mark
    difficulty: 2
- code: cbse11p.plane.projectile
  title: Projectile and circular motion
  after:
  - cbse11p.plane.vectors
  notes: |
    Projectile launched with speed u at angle θ: horizontal velocity u cos θ constant; vertical acceleration −g. Time of
    flight T = 2u sin θ/g; maximum height H = u² sin² θ/2g; range R = u² sin 2θ/g (maximum at 45°, R_max = u²/g).
    Path is a parabola. Uniform circular motion: speed constant, direction changes; centripetal acceleration a = v²/r =
    ω²r towards the centre; v = ωr; ω = 2π/T.
  explanations:
    text: 'A projectile moves sideways at a steady speed while gravity pulls it down, so it follows a parabola. The range is largest at 45°. In circular motion at steady speed, the velocity keeps changing direction, so there is an acceleration towards the centre: v²/r.'
    visual: Throw a ball at 45°. Its horizontal motion is steady, like a car on a road; its vertical motion is like a ball thrown up and caught. Put them together and you get a curved arch.
    step_by_step: 'Step 1: Split u into u cos θ (horizontal) and u sin θ (vertical). Step 2: Use T = 2u sin θ/g for time. Step 3: Range = horizontal speed × time. Step 4: For circles, a = v²/r towards the centre.'
    real_world: A javelin thrower aims near 45° (a little less, because the release is above ground) for the longest throw.
  picture:
    kind: compare
    columns:
    - title: Projectile
      points:
      - time T = 2u sin θ/g
      - height H = u² sin² θ/2g
      - range R = u² sin 2θ/g
    - title: Circular motion
      points:
      - v = ωr
      - a = v²/r
      - towards centre
    alt: For a projectile, T = 2u sin θ/g, H = u² sin² θ/2g and R = u² sin 2θ/g; in circular motion v = ωr and the acceleration v²/r points to the centre.
  activity:
    type: formula
    prompt: A stone is thrown sideways from a cliff of height H (g = 10 m/s²). It falls for t = √(2H ÷ g) and travels u × t sideways.
    inputs:
    - name: h
      label: Cliff height H
      min: 5
      max: 125
      step: 5
      start: 5
      unit: m
    - name: u
      label: Sideways speed u
      min: 0
      max: 30
      step: 1
      start: 0
      unit: m/s
    outputs:
    - name: t
      label: Time to fall
      expr: sqrt(h/5)
      unit: s
      places: 2
    - name: x
      label: Lands this far out
      expr: u*sqrt(h/5)
      unit: m
      places: 1
    - name: vy
      label: Downward speed on landing
      expr: 10*sqrt(h/5)
      unit: m/s
      places: 1
    goals:
    - prompt: From an 80 m cliff, make the stone land 60 m out.
      want:
        h: 80
        x: 60
      mistakes:
      - when:
          h: 80
          u: 20
        say: 20 m/s for 4 s carries it 80 m. The fall takes √(2 × 80 ÷ 10) = 4 s, so u = 60 ÷ 4.
      - when:
          h: 80
          u: 30
        say: '30 m/s for 4 s goes 120 m. The fall always takes 4 s from 80 m: u = 60 ÷ 4.'
    - prompt: Make the stone stay in the air for 3 s.
      want:
        t: 3
      mistakes:
      - when:
          h:
          - 5
          - 40
          u:
          - 1
          - 30
        say: 'Throwing faster doesn''t keep it up longer: only the height sets the fall time. Raise the cliff.'
      - when:
          h:
          - 50
          - 125
        say: 'Too high: the fall now lasts more than 3 s. H = ½ g t².'
    - prompt: From a 20 m cliff, make the stone land 40 m out.
      want:
        h: 20
        x: 40
      mistakes:
      - when:
          h: 20
          u:
          - 1
          - 30
          x:
          - 0
          - 39
        say: Short. The fall from 20 m lasts 2 s, so u = 40 ÷ 2.
  lesson:
    - teach: A projectile launched at speed u and angle θ keeps a steady horizontal velocity u cos θ, while its vertical velocity u sin θ is slowed and reversed by g. The path is a parabola.
      check:
        prompt: 'At the top of a projectile''s path, its velocity is:'
        options:
        - horizontal, u cos θ
        - zero
        - vertical
        answer: horizontal, u cos θ
        why: Only the vertical part becomes zero.
      ways:
      - style: visual
        teach: A projectile's motion splits into two independent parts.
        picture:
          kind: compare
          columns:
          - title: Horizontal
            points:
            - u cos θ
            - no acceleration
            - same speed all along
          - title: Vertical
            points:
            - u sin θ at the start
            - acceleration g down
            - zero at the top
          alt: Horizontally the projectile keeps a steady speed u cos theta; vertically it starts at u sin theta, slows under gravity, stops at the top and comes back down.
      - style: real_world
        teach: 'Drop one ball and fire another sideways from the same height at the same moment: they hit the floor together. Sideways speed doesn''t change how fast gravity pulls down; the two motions are independent.'
    - teach: Time of flight T = 2u sin θ/g. Maximum height H = u² sin²θ/2g. Range R = u² sin 2θ/g, greatest at 45° (R = u²/g). Angles θ and 90° − θ give the same range.
      check:
        prompt: u = 10 m/s, θ = 45°, g = 10. Range?
        options:
        - 10 m
        - 5 m
        - 20 m
        answer: 10 m
        why: u²/g = 100/10.
      ways:
      - style: step_by_step
        teach: 'Step 1: Vertical: time up = u sin θ/g, total T = 2u sin θ/g. Step 2: Height H = u² sin²θ/2g. Step 3: Range R = horizontal speed × T = u² sin 2θ/g. Step 4: sin 2θ is biggest at θ = 45°.'
      - style: visual
        teach: 'Range for u = 25 m/s (g = 10) at different angles: 30° and 60° tie, 45° is best.'
        picture:
          kind: bars
          unit: m
          bars:
          - label: 15°
            value: 31.3
          - label: 30°
            value: 54.1
          - label: 45°
            value: 62.5
          - label: 60°
            value: 54.1
          - label: 75°
            value: 31.3
          alt: 'Ranges are about 31 metres at 15 degrees, 54 at 30, 62.5 at 45, 54 at 60 and 31 at 75: complementary angles give the same range and 45 degrees gives the most.'
    - teach: In uniform circular motion the speed stays constant but the direction keeps changing, so there is an acceleration v²/r = ω²r towards the centre. v = ωr and ω = 2π/T.
      picture:
        kind: compare
        columns:
        - title: Quantity
          points:
          - T
          - H
          - R
        - title: Formula
          points:
          - 2u sin θ / g
          - u² sin²θ / 2g
          - u² sin 2θ / g
        alt: Projectile formulas.
      check:
        prompt: A wheel turns once every 2 s. ω = ?
        options:
        - π rad/s
        - 2π rad/s
        - 4π rad/s
        answer: π rad/s
        why: 2π/2.
      ways:
      - style: step_by_step
        teach: 'Step 1: ω = 2π/T. Step 2: v = ωr. Step 3: Centripetal acceleration a = v²/r = ω²r, pointing to the centre. Example: r = 2 m, v = 4 m/s: a = 8 m/s².'
      - style: real_world
        teach: 'Swing a bucket of water in a circle: let go and it flies off in a straight line along the tangent. The string''s pull towards your hand is what kept turning it: that''s the centripetal force.'
  items:
  - prompt: A ball is thrown at 20 m/s at 45°. Taking g = 10 m/s², find its range (in m).
    answer: '40'
    check: 20**2*sin(pi/2)/10
    difficulty: 1
    hints:
    - R = u² sin 2θ/g.
    - 400 × 1/10.
