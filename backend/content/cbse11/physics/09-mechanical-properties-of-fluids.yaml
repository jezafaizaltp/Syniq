# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse11-phy
chapter: 9
title: Mechanical Properties of Fluids
tips:
  c11p_pressure: 'Pressure at depth h in a liquid: P = P₀ + ρgh. Gauge pressure is only the ρgh part.'
  c11p_bernoulli: 'Bernoulli: P + ½ρv² + ρgh stays constant along a streamline, so where a fluid speeds up its pressure falls.'
  p11_archimedes: "Archimedes' principle: the push up equals the weight of the fluid pushed aside."
  p11_atm: "1 atm is about 100 kPa: the weight of a 10 m column of water on each square metre."
  p11_continuity: "Av = constant. Halve the area and what happens to the speed?"
  p11_depth_pressure: "P = hρg. Which quantities appear in that formula?"
  p11_hydraulic_lift: "Pressure is the same on both pistons: F₁/A₁ = F₂/A₂. The small piston needs the smaller force."
  p11_pressure: "P = F/A."
  p11_terminal: "As speed grows, air drag grows. At terminal velocity, the forces on the drop add up to zero."
  p11_torricelli: "v = √(2gh). Take the square root."
  p11_viscosity_heat: "Warm honey or cold honey: which pours more easily?"
  c11p09_p: 'Pressure in a liquid grows with depth: ρgh. Add atmospheric pressure only if the question asks for total pressure.'
  c11p09_flow: 'Narrow part of a pipe: faster flow (A₁v₁ = A₂v₂). Faster flow on a level streamline: lower pressure.'
  c11p09_st: A drop has one surface (2S/r); a soap bubble has two (4S/r).
concepts:
- code: cbse11p.fluids.pressure
  title: Pressure and Pascal's law
  notes: |
    Pressure P = F/A (Pa); acts in all directions in a fluid at rest. At depth h: P = Pa + ρgh (gauge pressure ρgh).
    Hydrostatic paradox: pressure depends only on depth, not vessel shape. Atmospheric pressure ≈ 1.013 × 10⁵ Pa = 76 cm
    of mercury (barometer). Pascal's law: pressure applied to an enclosed fluid is transmitted undiminished to every part.
    Hydraulic lift: F₂ = F₁ × A₂/A₁. Buoyancy (Archimedes): upthrust = weight of fluid displaced.
  explanations:
    text: 'Pressure is force on each square metre. In a liquid, it grows with depth: P = ρgh more than the air pressure on top. Pascal''s law says a push on a closed liquid spreads equally everywhere, which lets a small force lift a car.'
    visual: 'Draw a hydraulic lift: a small piston of area A₁ and a big one of area A₂, joined by oil. The same pressure acts on both, so the big piston gets a force A₂/A₁ times larger.'
    step_by_step: 'Step 1: Pressure from depth = ρgh. Step 2: Add the air pressure on the surface for absolute pressure. Step 3: For a hydraulic lift, F₂/A₂ = F₁/A₁.'
    real_world: 'Car brakes are hydraulic: a light push on the pedal is passed through brake oil to large pistons at every wheel.'
  picture:
    kind: flow
    steps:
    - Push small piston
    - Pressure rises in oil
    - Same pressure reaches big piston
    - Big force lifts load
    alt: In a hydraulic lift, pressure from the small piston passes through the oil to the big piston.
  activity:
    type: formula
    prompt: 'A hydraulic lift: pressure on the small piston reaches the big one unchanged, so F₂ = F₁ × A₂ ÷ A₁.'
    inputs:
    - name: f1
      label: Push on small piston F₁
      min: 10
      max: 500
      step: 10
      start: 10
      unit: N
    - name: a1
      label: Small piston A₁
      min: 1
      max: 20
      step: 1
      start: 1
      unit: cm²
    - name: a2
      label: Big piston A₂
      min: 50
      max: 1000
      step: 50
      start: 50
      unit: cm²
    outputs:
    - name: p
      label: Pressure in the oil
      expr: f1/a1
      unit: N/cm²
      places: 1
    - name: f2
      label: Lift on big piston F₂
      expr: f1*a2/a1
      unit: N
    goals:
    - prompt: Lift a 10 000 N car with a 100 N push on a 5 cm² piston. Choose A₂.
      want:
        f1: 100
        a1: 5
        f2: 10000
      mistakes:
      - when:
          f1: 100
          a1: 5
          a2: 100
        say: 100 cm² gives only 2000 N. The same pressure (20 N/cm²) acts on every cm² of the big piston.
      - when:
          f1: 100
          a1: 5
          a2:
          - 550
          - 1000
        say: That's more area than you need.
    - prompt: A₁ = 4 cm² and A₂ = 800 cm². What push lifts 12 000 N?
      want:
        a1: 4
        a2: 800
        f2: 12000
      mistakes:
      - when:
          a1: 4
          a2: 800
          f1:
          - 70
          - 500
        say: More than needed. The big piston is 200 times larger, so the push is 12 000 ÷ 200.
      - when:
          a1: 4
          a2: 800
          f1:
          - 10
          - 50
        say: Not enough to lift it.
    - prompt: Make the pressure in the oil 20 N/cm² using a 10 cm² small piston.
      want:
        a1: 10
        p: 20
      mistakes:
      - when:
          a1: 10
          f1: 20
        say: 20 N on 10 cm² is 2 N/cm². Pressure = force ÷ area.
  lesson:
    - teach: 'Pressure P = F/A. In a liquid at rest it acts equally in all directions and grows with depth: P = Pa + ρgh. The extra part ρgh is gauge pressure; it depends on depth, not on the vessel''s shape.'
      check:
        prompt: Gauge pressure 2 m down in water (ρ = 1000, g = 10)?
        options:
        - 20 000 Pa
        - 2000 Pa
        - 200 Pa
        answer: 20 000 Pa
        why: 1000 × 10 × 2.
      ways:
      - style: visual
        teach: Gauge pressure in water grows steadily with depth (ρ = 1000 kg/m³, g = 10).
        picture:
          kind: bars
          unit: kPa
          bars:
          - label: 2 m
            value: 20
          - label: 5 m
            value: 50
          - label: 15 m
            value: 150
          - label: 20 m
            value: 200
          alt: 'Gauge pressure in water is 20 kilopascals at 2 metres, 50 at 5 metres, 150 at 15 metres and 200 at 20 metres: it grows in step with depth.'
      - style: real_world
        teach: A dam wall is built much thicker at the bottom than at the top, because water pressure grows with depth. A swimmer diving to the bottom of a deep pool feels the pressure in their ears rise the same way.
    - teach: 'Pascal''s law: pressure applied to an enclosed fluid reaches every part undiminished. So in a hydraulic lift F₂ = F₁ × A₂/A₁: a small push on a small piston lifts a big load.'
      check:
        prompt: 'A₂ is 20 times A₁. A 50 N push lifts:'
        options:
        - 1000 N
        - 2.5 N
        - 70 N
        answer: 1000 N
        why: 50 × 20.
      ways:
      - style: visual
        teach: 'A hydraulic lift: the same pressure on a 40 times bigger piston gives a 40 times bigger force.'
        picture:
          kind: flow
          steps:
          - Push 100 N on A₁ = 0.01 m²
          - Pressure = 10,000 Pa everywhere
          - 'On A₂ = 0.4 m²: F = 10,000 × 0.4'
          - Lifts 4,000 N
          alt: A 100 newton push on a small piston makes a pressure of 10,000 pascals that reaches the large piston of area 0.4 square metres, giving a lifting force of 4,000 newtons.
      - style: step_by_step
        teach: 'Step 1: Pressure on the small piston P = F₁/A₁. Step 2: Pascal: the same P reaches the big piston. Step 3: F₂ = P × A₂ = F₁ × A₂/A₁. Step 4: The small piston moves further, so no energy is gained.'
    - teach: 'Archimedes: a body in a fluid feels an upthrust equal to the weight of fluid it pushes aside. It floats if it can displace its own weight before it is fully under.'
      picture:
        kind: compare
        columns:
        - title: Depth
          points:
          - 1 m
          - 5 m
          - 10 m
        - title: Gauge pressure in water
          points:
          - 10 kPa
          - 50 kPa
          - 100 kPa
        alt: Pressure rising with depth in water.
      check:
        prompt: A block displaces 0.002 m³ of water (ρ = 1000, g = 10). Upthrust?
        options:
        - 20 N
        - 2 N
        - 200 N
        answer: 20 N
        why: 1000 × 0.002 × 10.
      ways:
      - style: step_by_step
        teach: 'Step 1: Upthrust = weight of fluid displaced = ρ_fluid × V_displaced × g. Step 2: Compare with the body''s weight. Step 3: Upthrust can match the weight before fully under → floats. Can''t → sinks. Step 4: Floating fraction under water = ρ_body/ρ_fluid.'
      - style: real_world
        teach: 'A steel ship floats though a steel nail sinks: the hull''s shape pushes aside a huge volume of water, whose weight equals the ship''s. Ships ride a little lower in fresh river water than in the denser sea.'
  items:
  - prompt: Find the gauge pressure (in Pa) at 10 m depth in water (ρ = 1000 kg/m³, g = 10 m/s²).
    answer: '100000'
    check: 1000*10*10
    difficulty: 1
    hints:
    - ρgh.
    - 1000 × 10 × 10.
    solution: 10⁵ Pa.
    mistakes:
      '200000': c11p_pressure
  - prompt: A force of 50 N on a piston of area 0.01 m² gives what pressure (in Pa)?
    answer: '5000'
    check: 50/Rational(1,100)
    difficulty: 1
    hints:
    - P = F/A.
    - 50 ÷ 0.01.
    solution: 5,000 Pa.
    mistakes: {"0.5": "p11_pressure", "500": "p11_pressure"}
  - prompt: In a hydraulic lift, A₁ = 0.01 m² and A₂ = 0.5 m². What force (in N) on the small piston lifts 10,000 N?
    answer: '200'
    check: 10000*Rational(1,100)/Rational(1,2)
    difficulty: 2
    hints:
    - F₁ = F₂ × A₁/A₂.
    - 10000 × 0.01 ÷ 0.5.
    solution: 200 N.
    mistakes: {"500000": "p11_hydraulic_lift", "50": "p11_hydraulic_lift"}
  - prompt: 'Pressure at a given depth in a liquid depends on:'
    options:
    - depth, liquid density and g
    - the shape of the vessel
    - the total volume of liquid
    - the area of the base
    answer: depth, liquid density and g
    difficulty: 2
    hints:
    - P = ρgh.
    - Hydrostatic paradox.
    solution: Only depth, density and g matter, not the vessel's shape.
    mistakes: {"the shape of the vessel": "p11_depth_pressure", "the total volume of liquid": "p11_depth_pressure", "the area of the base": "p11_depth_pressure"}
  - prompt: 'Atmospheric pressure at sea level is about:'
    options:
    - 1.013 × 10⁵ Pa
    - 1.013 × 10³ Pa
    - 9.8 Pa
    - 76 Pa
    answer: 1.013 × 10⁵ Pa
    difficulty: 1
    hints:
    - 76 cm of mercury.
    - About 100,000 Pa.
    solution: About 1.013 × 10⁵ Pa.
    mistakes: {"1.013 × 10³ Pa": "p11_atm", "9.8 Pa": "p11_atm", "76 Pa": "p11_atm"}
  - prompt: 'The upthrust on a body in a fluid equals:'
    options:
    - the weight of fluid it displaces
    - its own weight
    - its volume
    - the fluid pressure at the top
    answer: the weight of fluid it displaces
    difficulty: 1
    hints:
    - Archimedes' principle.
    - Displaced fluid.
    solution: Upthrust = weight of displaced fluid.
    mistakes: {"its own weight": "p11_archimedes", "its volume": "p11_archimedes", "the fluid pressure at the top": "p11_archimedes"}
  - prompt: Find the gauge pressure at 5 m depth in sea water (ρ = 1030, g = 10) (in Pa).
    answer: '51500'
    check: 1030*10*5
    difficulty: 1
    hints:
    - ρgh.
    - 1030 × 10 × 5.
    solution: 'Step 1: ρgh. Step 2: 51 500 Pa.'
    mistakes:
      '5150': c11p09_p
      '152800': c11p09_p
  - prompt: A 600 N person stands on shoes of total area 0.03 m². Find the pressure (in Pa).
    answer: '20000'
    check: 600/0.03
    difficulty: 1
    hints:
    - P = F/A.
    - 600 ÷ 0.03.
    solution: 'Step 1: 600/0.03. Step 2: 20 000 Pa.'
    mistakes:
      '18': c11p09_p
      '2000': c11p09_p
  - prompt: Why is a dam built thicker at the bottom?
    options:
    - water pressure is greater at greater depth
    - to look stronger
    - water is heavier at the top
    answer: water pressure is greater at greater depth
    difficulty: 1
    hints:
    - P = ρgh.
    - Which part has the largest h?
    solution: 'Step 1: pressure rises with depth. Step 2: the base must resist more.'
    mistakes:
      to look stronger: c11p09_p
      water is heavier at the top: c11p09_p
  - prompt: A hydraulic press has pistons of area 0.02 m² and 0.8 m². What force on the small piston lifts 20 000 N?
    answer: '500'
    check: 20000*0.02/0.8
    difficulty: 2
    hints:
    - Same pressure on both pistons.
    - F₁ = F₂ × A₁/A₂.
    solution: 'Step 1: 20 000 × 0.02/0.8. Step 2: 500 N.'
    mistakes:
      '800000': c11p09_p
      '400': c11p09_p
  - prompt: Find the total pressure 20 m under a lake (Pa = 1 × 10⁵ Pa, ρ = 1000, g = 10), in units of 10⁵ Pa.
    answer: '3'
    check: (1e5+1000*10*20)/1e5
    difficulty: 2
    hints:
    - Total = Pa + ρgh.
    - ρgh = 2 × 10⁵.
    solution: 'Step 1: 1 + 2 = 3. Step 2: 3 × 10⁵ Pa.'
    mistakes:
      '2': c11p09_p
      '21': c11p09_p
  - prompt: 'Three vessels of different shapes are filled with water to the same height. The pressure at the bottom is:'
    options:
    - the same in all
    - largest in the widest
    - largest in the narrowest
    answer: the same in all
    difficulty: 2
    hints:
    - P = Pa + ρgh.
    - Does shape appear in that formula?
    solution: 'Step 1: same h, same liquid. Step 2: same pressure.'
    mistakes:
      largest in the widest: c11p09_p
      largest in the narrowest: c11p09_p
  - prompt: A 1 kg block of volume 4 × 10⁻⁴ m³ is fully under water (g = 10). Find its apparent weight (in N).
    answer: '6'
    check: 10-1000*4e-4*10
    difficulty: 2
    hints:
    - Upthrust = ρVg.
    - Apparent weight = weight − upthrust.
    solution: 'Step 1: upthrust 4 N. Step 2: 10 − 4 = 6 N.'
    mistakes:
      '4': c11p09_p
      '14': c11p09_p
  - prompt: A mercury barometer reads 76 cm. If water were used instead (13.6 times less dense), about how tall would the column be (in m)?
    answer: '10.3'
    check: round(0.76*13.6,1)
    difficulty: 3
    hints:
    - 'Same pressure: ρh is the same.'
    - h_water = 0.76 × 13.6.
    solution: 'Step 1: 0.76 × 13.6 ≈ 10.3. Step 2: about 10.3 m.'
    mistakes:
      '0.056': c11p09_p
      '76': c11p09_p
  - prompt: Wood of density 600 kg/m³ floats in water. What fraction of its volume is under water?
    answer: 3/5
    check: 600/1000
    difficulty: 3
    hints:
    - 'Floating: weight = upthrust.'
    - Fraction under = ρ_wood/ρ_water.
    solution: 'Step 1: 600/1000. Step 2: 3/5.'
    mistakes:
      2/5: c11p09_p
      5/3: c11p09_p
  - prompt: 'Assertion (A): The pressure at the bottom of a tall thin jar and a short wide basin can be different even if they hold the same volume of water.

      Reason (R): Liquid pressure depends on depth, not on the shape of the vessel or the volume of liquid.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true. The tall jar has a greater depth of water, so more pressure at the bottom: R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A car service station lift has a small piston of area 0.02 m² and a large one of area 1 m². What force on the small piston lifts a 15,000 N car?'
    options:
    - 300 N
    - 750,000 N
    - 15,000 N
    answer: 300 N
    hints:
    - F₁ = F₂ × A₁/A₂.
    - 15,000 × 0.02.
    solution: F₁ = 15,000 × 0.02/1 = 300 N.
    mistakes:
      750,000 N: p11_hydraulic_lift
      15,000 N: c11p09_p
    exam: case
    difficulty: 2
  - prompt: A block of wood of density 600 kg/m³ floats in water (1000 kg/m³). What fraction of its volume is under water?
    options:
    - 3/5
    - 2/5
    - 5/3
    answer: 3/5
    hints:
    - 'Floating: weight = upthrust.'
    - Fraction under = ρ_wood/ρ_water.
    solution: 600/1000 = 3/5 of the block is under water.
    mistakes:
      2/5: p11_archimedes
      5/3: p11_archimedes
    exam: short
    difficulty: 2
- code: cbse11p.fluids.flow
  title: Fluid flow, viscosity and surface tension
  after:
  - cbse11p.fluids.pressure
  notes: |
    Streamline flow: each particle follows a smooth path. Equation of continuity: A₁v₁ = A₂v₂ (narrow pipe → faster flow).
    Bernoulli's principle: P + ½ρv² + ρgh = constant along a streamline. Uses: Venturi meter, aerofoil lift, atomiser,
    Torricelli's law v = √(2gh). Viscosity: internal friction, F = ηA(dv/dx), coefficient η (Pa s); falls with temperature
    for liquids. Stokes' law F = 6πηrv; terminal velocity v = 2r²(ρ − σ)g/(9η). Reynolds number Re = ρvd/η; turbulence
    when Re > about 2000. Surface tension S = force per unit length (N/m) = surface energy per unit area; excess pressure in
    a drop 2S/r, in a soap bubble 4S/r; capillary rise h = 2S cos θ/(ρgr).
  explanations:
    text: 'When a river narrows, the water speeds up: that''s the continuity equation. Bernoulli''s principle adds that faster-moving fluid has lower pressure. Viscosity is a fluid''s stickiness, and surface tension is the skin-like pull at a liquid''s surface.'
    visual: Draw a pipe that narrows from area 4 to area 1. The same water must pass each second, so its speed becomes 4 times greater in the narrow part, and its pressure there drops.
    step_by_step: 'Step 1: Continuity: A₁v₁ = A₂v₂. Step 2: Bernoulli: compare P + ½ρv² + ρgh at two points. Step 3: Speed up means pressure down at the same height.'
    real_world: An aeroplane wing is curved so that air moves faster over the top; the lower pressure above gives lift.
  picture:
    kind: compare
    columns:
    - title: Idea
      points:
      - Continuity
      - Bernoulli
      - Stokes
    - title: Formula
      points:
      - A₁v₁ = A₂v₂
      - P + ½ρv² + ρgh = constant
      - F = 6πηrv
    alt: 'Three flow rules: continuity, Bernoulli''s principle and Stokes'' law.'
  activity:
    type: formula
    prompt: 'Water flows from a wide pipe into a narrow one. The same volume passes each second: A₁v₁ = A₂v₂, and area goes as diameter².'
    inputs:
    - name: d1
      label: Wide pipe's diameter
      min: 1
      max: 10
      step: 1
      start: 1
      unit: cm
    - name: v1
      label: Speed in the wide pipe
      min: 1
      max: 10
      step: 1
      start: 1
      unit: m/s
    - name: d2
      label: Narrow pipe's diameter
      min: 1
      max: 10
      step: 1
      start: 2
      unit: cm
    outputs:
    - name: v2
      label: Speed in the narrow pipe
      expr: v1*(d1/d2)^2
      unit: m/s
      places: 2
    goals:
    - prompt: Water moves at 2 m/s in a 4 cm pipe. Choose the narrow pipe so the water leaves at 8 m/s.
      want:
        d1: 4
        v1: 2
        v2: 8
      mistakes:
      - when:
          d1: 4
          v1: 2
          d2: 1
        say: '1 cm makes it 32 m/s. Speed depends on area, and area goes as diameter²: half the width is a quarter of the area.'
    - prompt: A 10 cm pipe carries water at 1 m/s. Make it 25 times faster in the narrow part.
      want:
        d1: 10
        v1: 1
        v2: 25
      mistakes:
      - when:
          d1: 10
          v1: 1
          d2: 4
        say: 4 cm is 2.5 times narrower, which makes it 6.25 times faster. You need 25 = 5², so 5 times narrower.
    - prompt: Make the speed stay the same when the pipe joins another.
      want:
        v2:
        - 0.99
        - 1.01
        v1: 1
      mistakes:
      - when:
          v1: 1
          v2:
          - 1.1
          - 100
        say: The second pipe is narrower, so the water speeds up. Make the diameters equal.
      - when:
          v1: 1
          v2:
          - 0.01
          - 0.9
        say: The second pipe is wider, so the water slows. Make the diameters equal.
  lesson:
    - teach: 'In steady (streamline) flow, the same volume passes every section each second: A₁v₁ = A₂v₂. So water speeds up where a pipe narrows, as when you squeeze a hose.'
      check:
        prompt: 'Area halves. The flow speed:'
        options:
        - doubles
        - halves
        - stays the same
        answer: doubles
        why: Av is constant.
      ways:
      - style: visual
        teach: 'A pipe narrowing from 8 cm² to 2 cm²: a quarter of the area, four times the speed.'
        picture:
          kind: compare
          columns:
          - title: Wide part
            points:
            - A₁ = 8 cm²
            - v₁ = 1.5 m/s
          - title: Narrow part
            points:
            - A₂ = 2 cm²
            - v₂ = 6 m/s
          alt: Water moving at 1.5 metres per second in an 8 square centimetre section speeds up to 6 metres per second in a 2 square centimetre section, since A times v stays the same.
      - style: real_world
        teach: Put your thumb over the end of a garden hose and the water shoots out much further. The same volume must pass every second through a smaller opening, so it has to move faster.
    - teach: 'Bernoulli: P + ½ρv² + ρgh is constant along a streamline. Where flow is faster, pressure is lower. This explains aeroplane lift and atomisers. Water from a hole h below the surface leaves at v = √(2gh).'
      check:
        prompt: 'Air flows faster over the top of a wing. The pressure on top is:'
        options:
        - lower
        - higher
        - the same
        answer: lower
        why: 'Faster flow, lower pressure: the wing is pushed up.'
      ways:
      - style: visual
        teach: Along a horizontal streamline, the faster the flow, the lower the pressure.
        picture:
          kind: flow
          steps:
          - 'Wide pipe: slow flow, high pressure'
          - 'Narrow throat: fast flow, low pressure'
          - 'Wide again: slow, pressure rises'
          alt: In a pipe with a narrow throat, the fluid flows slowly at high pressure in the wide parts and fast at low pressure in the throat.
      - style: real_world
        teach: 'In a strong wind, a tin roof can lift off: the fast air above has lower pressure than the still air inside the house, which pushes up. Blow over a strip of paper held below your lips and it rises for the same reason.'
    - teach: 'Viscosity is fluid friction (η, Pa s); for liquids it falls when heated. A sphere falling through fluid reaches terminal velocity when drag 6πηrv balances weight minus upthrust. Surface tension S (N/m): extra pressure 2S/r in a drop, 4S/r in a soap bubble.'
      picture:
        kind: compare
        columns:
        - title: Pipe section
          points:
          - wide
          - narrow
        - title: Speed and pressure
          points:
          - slow, higher pressure
          - fast, lower pressure
        alt: Continuity and Bernoulli in a pipe.
      check:
        prompt: Why does a soap bubble use 4S/r and not 2S/r?
        options:
        - it has two surfaces
        - it is larger
        - soap has double S
        answer: it has two surfaces
        why: An inner and an outer film.
      ways:
      - style: step_by_step
        teach: 'Step 1: A sphere falling through a liquid feels weight down, upthrust and drag 6πηrv up. Step 2: Drag grows with speed. Step 3: When up = down, acceleration stops: terminal velocity. Step 4: Surface tension: extra pressure 2S/r in a drop, 4S/r in a bubble (two surfaces).'
      - style: real_world
        teach: 'Raindrops fall from clouds kilometres up but reach only a few metres per second, not hundreds: air drag rises with speed until it balances their weight. Honey poured from a warm jar flows faster than from a cold one: heating lowers viscosity.'
  items:
  - prompt: Water flows at 2 m/s in a pipe of area 6 cm². What is its speed (in m/s) where the area is 3 cm²?
    answer: '4'
    check: 6*2/3
    difficulty: 1
    hints:
    - A₁v₁ = A₂v₂.
    - 6 × 2 ÷ 3.
    solution: 4 m/s.
    mistakes: {"1": "p11_continuity", "2": "p11_continuity"}
  - prompt: Water leaks from a hole 5 m below the surface of a tank. Find its speed (in m/s), g = 10 m/s².
    answer: '10'
    check: sqrt(2*10*5)
    difficulty: 2
    hints:
    - 'Torricelli: v = √(2gh).'
    - √100.
    solution: 10 m/s.
    mistakes: {"100": "p11_torricelli", "50": "p11_torricelli"}
  - prompt: 'Where fluid flows faster along a horizontal streamline, its pressure is:'
    options:
    - lower
    - higher
    - unchanged
    - zero
    answer: lower
    difficulty: 1
    hints:
    - Bernoulli.
    - ½ρv² rises, so P falls.
    solution: Faster flow means lower pressure.
    mistakes:
      higher: c11p_bernoulli
  - prompt: 'When a liquid is heated, its viscosity usually:'
    options:
    - decreases
    - increases
    - stays the same
    - becomes infinite
    answer: decreases
    difficulty: 2
    hints:
    - Hot honey flows easily.
    - Molecules move apart.
    solution: Liquids become less viscous when heated.
    mistakes: {"increases": "p11_viscosity_heat", "stays the same": "p11_viscosity_heat", "becomes infinite": "p11_viscosity_heat"}
  - prompt: Surface tension of soap solution is 0.03 N/m. Find the excess pressure (in Pa) inside a soap bubble of radius 0.01 m.
    answer: '12'
    check: 4*Rational(3,100)/Rational(1,100)
    difficulty: 2
    hints:
    - 'Bubble: 4S/r (two surfaces).'
    - 4 × 0.03 ÷ 0.01.
    solution: 12 Pa.
    mistakes:
      '6': c11p_bernoulli
  - prompt: 'A falling raindrop stops speeding up and moves at constant speed because:'
    options:
    - viscous drag balances its weight minus upthrust
    - gravity switches off
    - air pressure pushes it up
    - surface tension stops it
    answer: viscous drag balances its weight minus upthrust
    difficulty: 2
    hints:
    - Terminal velocity.
    - Net force zero.
    solution: At terminal velocity the drag force balances the net downward force.
    mistakes: {"gravity switches off": "p11_terminal", "air pressure pushes it up": "p11_terminal", "surface tension stops it": "p11_terminal"}
  - prompt: Water flows at 3 m/s in a pipe of area 10 cm². Find its speed where the area is 5 cm² (in m/s).
    answer: '6'
    check: 3*10/5
    difficulty: 1
    hints:
    - A₁v₁ = A₂v₂.
    - Area halves.
    solution: 'Step 1: 30 = 5v. Step 2: v = 6 m/s.'
    mistakes:
      '1.5': c11p09_flow
      '15': c11p09_flow
  - prompt: Water leaks from a hole 20 m below the surface (g = 10). Find its speed (in m/s).
    answer: '20'
    check: (2*10*20)**0.5
    difficulty: 1
    hints:
    - 'Torricelli: v = √(2gh).'
    - √400.
    solution: 'Step 1: √(400). Step 2: 20 m/s.'
    mistakes:
      '400': c11p09_flow
      '200': c11p09_flow
  - prompt: Viscosity of honey ______ when it is warmed.
    options:
    - decreases
    - increases
    - does not change
    answer: decreases
    difficulty: 1
    hints:
    - Warm honey pours faster.
    - Less internal friction.
    solution: 'Step 1: liquids get runnier when heated. Step 2: decreases.'
    mistakes:
      increases: c11p09_flow
      does not change: c11p09_flow
  - prompt: Find the excess pressure inside a water drop of radius 1 mm (S = 0.07 N/m) (in Pa).
    answer: '140'
    check: 2*0.07/0.001
    difficulty: 2
    hints:
    - 'A drop has one surface: 2S/r.'
    - r = 10⁻³ m.
    solution: 'Step 1: 0.14/0.001. Step 2: 140 Pa.'
    mistakes:
      '280': c11p09_st
      '70': c11p09_st
  - prompt: 'Two sheets of paper held apart; you blow between them. They:'
    options:
    - move together
    - move apart
    - stay still
    answer: move together
    difficulty: 2
    hints:
    - Air between is moving fast.
    - Fast air means lower pressure.
    solution: 'Step 1: pressure between drops. Step 2: outside air pushes them together.'
    mistakes:
      move apart: c11p09_flow
      stay still: c11p09_flow
  - prompt: A pipe of diameter 4 cm narrows to 2 cm. Water enters at 1 m/s. Find its speed in the narrow part (in m/s).
    answer: '4'
    check: 1*(4/2)**2
    difficulty: 2
    hints:
    - Area ∝ diameter².
    - Diameter halves, area quarters.
    solution: 'Step 1: A₂ = A₁/4. Step 2: v₂ = 4 m/s.'
    mistakes:
      '2': c11p09_flow
      '0.25': c11p09_flow
  - prompt: Above about what Reynolds number does flow in a pipe usually become turbulent?
    options:
    - '2000'
    - '20'
    - '2'
    answer: '2000'
    difficulty: 2
    hints:
    - Re = ρvd/η compares inertia with viscosity.
    - Low Re is smooth flow.
    solution: 'Step 1: Re above roughly 2000. Step 2: turbulent.'
    mistakes:
      '20': c11p09_flow
      '2': c11p09_flow
  - prompt: Terminal velocity v ∝ r². A drop of radius 2r falls at how many times the terminal speed of a drop of radius r?
    answer: '4'
    check: 2**2
    difficulty: 3
    hints:
    - v = 2r²(ρ − σ)g/9η.
    - Square the factor 2.
    solution: 'Step 1: (2)². Step 2: 4 times.'
    mistakes:
      '2': c11p09_flow
      '8': c11p09_flow
  - prompt: Water rises 3 cm in a capillary tube. How high does it rise in a tube of half the radius (in cm)?
    answer: '6'
    check: 3*2
    difficulty: 3
    hints:
    - h = 2S cos θ/(ρgr).
    - h ∝ 1/r.
    solution: 'Step 1: r halves, h doubles. Step 2: 6 cm.'
    mistakes:
      '1.5': c11p09_st
      '12': c11p09_st
  - prompt: 'Assertion (A): Water flows faster in the narrow parts of a pipe.

      Reason (R): For steady flow, the product of area and speed is the same at every section.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both true. Since Av is constant, a smaller A needs a larger v: R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Situation: A tank has a small hole 1.8 m below the water surface. Taking g = 10 m/s², with what speed does water come out?'
    options:
    - 6 m/s
    - 36 m/s
    - 18 m/s
    answer: 6 m/s
    hints:
    - 'Torricelli: v = √(2gh).'
    - √(2 × 10 × 1.8).
    solution: v = √36 = 6 m/s.
    mistakes:
      36 m/s: p11_torricelli
      18 m/s: c11p09_flow
    exam: competency
    difficulty: 2
  - prompt: 'The excess pressure inside a soap bubble of radius r and surface tension S is:'
    options:
    - 4S/r
    - 2S/r
    - S/r
    answer: 4S/r
    hints:
    - A soap bubble has two surfaces.
    - A drop has one surface and 2S/r.
    solution: Two surfaces double a drop's 2S/r, giving 4S/r.
    mistakes:
      2S/r: c11p09_st
      S/r: c11p09_st
    exam: one_mark
    difficulty: 2
