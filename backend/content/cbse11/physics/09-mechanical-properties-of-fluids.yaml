# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse11-phy
chapter: 9
title: Mechanical Properties of Fluids
tips:
  c11p_pressure: 'Pressure at depth h in a liquid: P = P₀ + ρgh. Gauge pressure is only the ρgh part.'
  c11p_bernoulli: 'Bernoulli: P + ½ρv² + ρgh stays constant along a streamline, so where a fluid speeds up its pressure falls.'
  p11_archimedes: "Archimedes' principle: the push up equals the weight of the fluid pushed aside."
  p11_atm: "1 atm is about 100 kPa: the weight of a 10 m column of water on each square metre."
  p11_continuity: "Av = constant. Halve the area and what happens to the speed?"
  p11_depth_pressure: "P = hρg. Which quantities appear in that formula?"
  p11_hydraulic_lift: "Pressure is the same on both pistons: F₁/A₁ = F₂/A₂. The small piston needs the smaller force."
  p11_pressure: "P = F/A."
  p11_terminal: "As speed grows, air drag grows. At terminal velocity, the forces on the drop add up to zero."
  p11_torricelli: "v = √(2gh). Take the square root."
  p11_viscosity_heat: "Warm honey or cold honey: which pours more easily?"
concepts:
- code: cbse11p.fluids.pressure
  title: Pressure and Pascal's law
  notes: |
    Pressure P = F/A (Pa); acts in all directions in a fluid at rest. At depth h: P = Pa + ρgh (gauge pressure ρgh).
    Hydrostatic paradox: pressure depends only on depth, not vessel shape. Atmospheric pressure ≈ 1.013 × 10⁵ Pa = 76 cm
    of mercury (barometer). Pascal's law: pressure applied to an enclosed fluid is transmitted undiminished to every part.
    Hydraulic lift: F₂ = F₁ × A₂/A₁. Buoyancy (Archimedes): upthrust = weight of fluid displaced.
  explanations:
    text: 'Pressure is force on each square metre. In a liquid, it grows with depth: P = ρgh more than the air pressure on top. Pascal''s law says a push on a closed liquid spreads equally everywhere, which lets a small force lift a car.'
    visual: 'Draw a hydraulic lift: a small piston of area A₁ and a big one of area A₂, joined by oil. The same pressure acts on both, so the big piston gets a force A₂/A₁ times larger.'
    step_by_step: 'Step 1: Pressure from depth = ρgh. Step 2: Add the air pressure on the surface for absolute pressure. Step 3: For a hydraulic lift, F₂/A₂ = F₁/A₁.'
    real_world: 'Car brakes are hydraulic: a light push on the pedal is passed through brake oil to large pistons at every wheel.'
  picture:
    kind: flow
    steps:
    - Push small piston
    - Pressure rises in oil
    - Same pressure reaches big piston
    - Big force lifts load
    alt: In a hydraulic lift, pressure from the small piston passes through the oil to the big piston.
  activity:
    type: formula
    prompt: 'A hydraulic lift: pressure on the small piston reaches the big one unchanged, so F₂ = F₁ × A₂ ÷ A₁.'
    inputs:
    - name: f1
      label: Push on small piston F₁
      min: 10
      max: 500
      step: 10
      start: 10
      unit: N
    - name: a1
      label: Small piston A₁
      min: 1
      max: 20
      step: 1
      start: 1
      unit: cm²
    - name: a2
      label: Big piston A₂
      min: 50
      max: 1000
      step: 50
      start: 50
      unit: cm²
    outputs:
    - name: p
      label: Pressure in the oil
      expr: f1/a1
      unit: N/cm²
      places: 1
    - name: f2
      label: Lift on big piston F₂
      expr: f1*a2/a1
      unit: N
    goals:
    - prompt: Lift a 10 000 N car with a 100 N push on a 5 cm² piston. Choose A₂.
      want:
        f1: 100
        a1: 5
        f2: 10000
      mistakes:
      - when:
          f1: 100
          a1: 5
          a2: 100
        say: 100 cm² gives only 2000 N. The same pressure (20 N/cm²) acts on every cm² of the big piston.
      - when:
          f1: 100
          a1: 5
          a2:
          - 550
          - 1000
        say: That's more area than you need.
    - prompt: A₁ = 4 cm² and A₂ = 800 cm². What push lifts 12 000 N?
      want:
        a1: 4
        a2: 800
        f2: 12000
      mistakes:
      - when:
          a1: 4
          a2: 800
          f1:
          - 70
          - 500
        say: More than needed. The big piston is 200 times larger, so the push is 12 000 ÷ 200.
      - when:
          a1: 4
          a2: 800
          f1:
          - 10
          - 50
        say: Not enough to lift it.
    - prompt: Make the pressure in the oil 20 N/cm² using a 10 cm² small piston.
      want:
        a1: 10
        p: 20
      mistakes:
      - when:
          a1: 10
          f1: 20
        say: 20 N on 10 cm² is 2 N/cm². Pressure = force ÷ area.
  items:
  - prompt: Find the gauge pressure (in Pa) at 10 m depth in water (ρ = 1000 kg/m³, g = 10 m/s²).
    answer: '100000'
    check: 1000*10*10
    difficulty: 1
    hints:
    - ρgh.
    - 1000 × 10 × 10.
    solution: 10⁵ Pa.
    mistakes:
      '200000': c11p_pressure
  - prompt: A force of 50 N on a piston of area 0.01 m² gives what pressure (in Pa)?
    answer: '5000'
    check: 50/Rational(1,100)
    difficulty: 1
    hints:
    - P = F/A.
    - 50 ÷ 0.01.
    solution: 5,000 Pa.
    mistakes: {"0.5": "p11_pressure", "500": "p11_pressure"}
  - prompt: In a hydraulic lift, A₁ = 0.01 m² and A₂ = 0.5 m². What force (in N) on the small piston lifts 10,000 N?
    answer: '200'
    check: 10000*Rational(1,100)/Rational(1,2)
    difficulty: 2
    hints:
    - F₁ = F₂ × A₁/A₂.
    - 10000 × 0.01 ÷ 0.5.
    solution: 200 N.
    mistakes: {"500000": "p11_hydraulic_lift", "50": "p11_hydraulic_lift"}
  - prompt: 'Pressure at a given depth in a liquid depends on:'
    options:
    - depth, liquid density and g
    - the shape of the vessel
    - the total volume of liquid
    - the area of the base
    answer: depth, liquid density and g
    difficulty: 2
    hints:
    - P = ρgh.
    - Hydrostatic paradox.
    solution: Only depth, density and g matter, not the vessel's shape.
    mistakes: {"the shape of the vessel": "p11_depth_pressure", "the total volume of liquid": "p11_depth_pressure", "the area of the base": "p11_depth_pressure"}
  - prompt: 'Atmospheric pressure at sea level is about:'
    options:
    - 1.013 × 10⁵ Pa
    - 1.013 × 10³ Pa
    - 9.8 Pa
    - 76 Pa
    answer: 1.013 × 10⁵ Pa
    difficulty: 1
    hints:
    - 76 cm of mercury.
    - About 100,000 Pa.
    solution: About 1.013 × 10⁵ Pa.
    mistakes: {"1.013 × 10³ Pa": "p11_atm", "9.8 Pa": "p11_atm", "76 Pa": "p11_atm"}
  - prompt: 'The upthrust on a body in a fluid equals:'
    options:
    - the weight of fluid it displaces
    - its own weight
    - its volume
    - the fluid pressure at the top
    answer: the weight of fluid it displaces
    difficulty: 1
    hints:
    - Archimedes' principle.
    - Displaced fluid.
    solution: Upthrust = weight of displaced fluid.
    mistakes: {"its own weight": "p11_archimedes", "its volume": "p11_archimedes", "the fluid pressure at the top": "p11_archimedes"}
- code: cbse11p.fluids.flow
  title: Fluid flow, viscosity and surface tension
  after:
  - cbse11p.fluids.pressure
  notes: |
    Streamline flow: each particle follows a smooth path. Equation of continuity: A₁v₁ = A₂v₂ (narrow pipe → faster flow).
    Bernoulli's principle: P + ½ρv² + ρgh = constant along a streamline. Uses: Venturi meter, aerofoil lift, atomiser,
    Torricelli's law v = √(2gh). Viscosity: internal friction, F = ηA(dv/dx), coefficient η (Pa s); falls with temperature
    for liquids. Stokes' law F = 6πηrv; terminal velocity v = 2r²(ρ − σ)g/(9η). Reynolds number Re = ρvd/η; turbulence
    when Re > about 2000. Surface tension S = force per unit length (N/m) = surface energy per unit area; excess pressure in
    a drop 2S/r, in a soap bubble 4S/r; capillary rise h = 2S cos θ/(ρgr).
  explanations:
    text: 'When a river narrows, the water speeds up: that''s the continuity equation. Bernoulli''s principle adds that faster-moving fluid has lower pressure. Viscosity is a fluid''s stickiness, and surface tension is the skin-like pull at a liquid''s surface.'
    visual: Draw a pipe that narrows from area 4 to area 1. The same water must pass each second, so its speed becomes 4 times greater in the narrow part, and its pressure there drops.
    step_by_step: 'Step 1: Continuity: A₁v₁ = A₂v₂. Step 2: Bernoulli: compare P + ½ρv² + ρgh at two points. Step 3: Speed up means pressure down at the same height.'
    real_world: An aeroplane wing is curved so that air moves faster over the top; the lower pressure above gives lift.
  picture:
    kind: compare
    columns:
    - title: Idea
      points:
      - Continuity
      - Bernoulli
      - Stokes
    - title: Formula
      points:
      - A₁v₁ = A₂v₂
      - P + ½ρv² + ρgh = constant
      - F = 6πηrv
    alt: 'Three flow rules: continuity, Bernoulli''s principle and Stokes'' law.'
  activity:
    type: formula
    prompt: 'Water flows from a wide pipe into a narrow one. The same volume passes each second: A₁v₁ = A₂v₂, and area goes as diameter².'
    inputs:
    - name: d1
      label: Wide pipe's diameter
      min: 1
      max: 10
      step: 1
      start: 1
      unit: cm
    - name: v1
      label: Speed in the wide pipe
      min: 1
      max: 10
      step: 1
      start: 1
      unit: m/s
    - name: d2
      label: Narrow pipe's diameter
      min: 1
      max: 10
      step: 1
      start: 2
      unit: cm
    outputs:
    - name: v2
      label: Speed in the narrow pipe
      expr: v1*(d1/d2)^2
      unit: m/s
      places: 2
    goals:
    - prompt: Water moves at 2 m/s in a 4 cm pipe. Choose the narrow pipe so the water leaves at 8 m/s.
      want:
        d1: 4
        v1: 2
        v2: 8
      mistakes:
      - when:
          d1: 4
          v1: 2
          d2: 1
        say: '1 cm makes it 32 m/s. Speed depends on area, and area goes as diameter²: half the width is a quarter of the area.'
    - prompt: A 10 cm pipe carries water at 1 m/s. Make it 25 times faster in the narrow part.
      want:
        d1: 10
        v1: 1
        v2: 25
      mistakes:
      - when:
          d1: 10
          v1: 1
          d2: 4
        say: 4 cm is 2.5 times narrower, which makes it 6.25 times faster. You need 25 = 5², so 5 times narrower.
    - prompt: Make the speed stay the same when the pipe joins another.
      want:
        v2:
        - 0.99
        - 1.01
        v1: 1
      mistakes:
      - when:
          v1: 1
          v2:
          - 1.1
          - 100
        say: The second pipe is narrower, so the water speeds up. Make the diameters equal.
      - when:
          v1: 1
          v2:
          - 0.01
          - 0.9
        say: The second pipe is wider, so the water slows. Make the diameters equal.
  items:
  - prompt: Water flows at 2 m/s in a pipe of area 6 cm². What is its speed (in m/s) where the area is 3 cm²?
    answer: '4'
    check: 6*2/3
    difficulty: 1
    hints:
    - A₁v₁ = A₂v₂.
    - 6 × 2 ÷ 3.
    solution: 4 m/s.
    mistakes: {"1": "p11_continuity", "2": "p11_continuity"}
  - prompt: Water leaks from a hole 5 m below the surface of a tank. Find its speed (in m/s), g = 10 m/s².
    answer: '10'
    check: sqrt(2*10*5)
    difficulty: 2
    hints:
    - 'Torricelli: v = √(2gh).'
    - √100.
    solution: 10 m/s.
    mistakes: {"100": "p11_torricelli", "50": "p11_torricelli"}
  - prompt: 'Where fluid flows faster along a horizontal streamline, its pressure is:'
    options:
    - lower
    - higher
    - unchanged
    - zero
    answer: lower
    difficulty: 1
    hints:
    - Bernoulli.
    - ½ρv² rises, so P falls.
    solution: Faster flow means lower pressure.
    mistakes:
      higher: c11p_bernoulli
  - prompt: 'When a liquid is heated, its viscosity usually:'
    options:
    - decreases
    - increases
    - stays the same
    - becomes infinite
    answer: decreases
    difficulty: 2
    hints:
    - Hot honey flows easily.
    - Molecules move apart.
    solution: Liquids become less viscous when heated.
    mistakes: {"increases": "p11_viscosity_heat", "stays the same": "p11_viscosity_heat", "becomes infinite": "p11_viscosity_heat"}
  - prompt: Surface tension of soap solution is 0.03 N/m. Find the excess pressure (in Pa) inside a soap bubble of radius 0.01 m.
    answer: '12'
    check: 4*Rational(3,100)/Rational(1,100)
    difficulty: 2
    hints:
    - 'Bubble: 4S/r (two surfaces).'
    - 4 × 0.03 ÷ 0.01.
    solution: 12 Pa.
    mistakes:
      '6': c11p_bernoulli
  - prompt: 'A falling raindrop stops speeding up and moves at constant speed because:'
    options:
    - viscous drag balances its weight minus upthrust
    - gravity switches off
    - air pressure pushes it up
    - surface tension stops it
    answer: viscous drag balances its weight minus upthrust
    difficulty: 2
    hints:
    - Terminal velocity.
    - Net force zero.
    solution: At terminal velocity the drag force balances the net downward force.
    mistakes: {"gravity switches off": "p11_terminal", "air pressure pushes it up": "p11_terminal", "surface tension stops it": "p11_terminal"}
