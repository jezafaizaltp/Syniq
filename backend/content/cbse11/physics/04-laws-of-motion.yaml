# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 4. Format: content/README.md.
subject: cbse11-phy
chapter: 4
title: Laws of Motion
tips:
  c11p_net_force: Use the net (total) force in F = ma. Subtract friction or opposing forces first.
  c11p_third_law: Action and reaction act on different bodies, so they never cancel each other.
concepts:
- code: cbse11p.laws.newton
  title: Newton's three laws
  notes: |
    First law (inertia): a body stays at rest or in uniform motion unless a net external force acts. Second law: F = dp/dt
    = ma; momentum p = mv; impulse = FΔt = Δp. Unit: newton. Third law: for every action there is an equal and opposite
    reaction, acting on different bodies. Conservation of momentum: with no external force, total momentum stays constant
    (gun recoil, rockets). Equilibrium: net force zero.
  explanations:
    text: 'Newton''s first law: things keep doing what they are doing unless a force acts. Second: force = mass × acceleration, or rate of change of momentum. Third: forces come in equal and opposite pairs acting on different objects. When no outside force acts, total momentum stays the same.'
    visual: 'A bullet fired from a gun: the gun pushes the bullet forward, the bullet pushes the gun back. A light bullet gets high speed; the heavy gun recoils slowly, so momenta are equal and opposite.'
    step_by_step: 'Step 1: Draw the object and every force on it. Step 2: Find the net force. Step 3: Use F = ma. Step 4: For collisions or explosions, set total momentum before = after.'
    real_world: Seat belts and airbags increase the time of stopping, reducing the force for the same change in momentum.
  picture:
    kind: flow
    steps:
    - 'Before: gun and bullet at rest (p = 0)'
    - Gun fires
    - 'Bullet: forward momentum'
    - 'Gun: equal backward momentum'
    - Total still 0
    alt: 'Momentum is conserved when a gun fires: the bullet''s forward momentum equals the gun''s backward momentum, keeping the total at zero.'
  activity:
    type: formula
    prompt: A person stands on a scale in a lift. The scale reads the push N = m(g + a), with g = 10 and a positive when the lift accelerates upward.
    inputs:
    - name: m
      label: Person's mass
      min: 30
      max: 80
      step: 5
      start: 30
      unit: kg
    - name: a
      label: Lift's acceleration (up +)
      min: -10
      max: 10
      step: 1
      start: 0
      unit: m/s²
    outputs:
    - name: n
      label: Scale reading
      expr: m*(10+a)
      unit: N
    - name: kg
      label: What the scale shows
      expr: m*(10+a)/10
      unit: kg
      places: 1
    goals:
    - prompt: A 50 kg person in a lift accelerating upward at 2 m/s².
      want:
        m: 50
        a: 2
      mistakes:
      - when:
          m: 50
          a: -2
        say: −2 is accelerating downward, and the scale would read less. Up is positive here.
    - prompt: Make a 60 kg person feel weightless.
      want:
        m: 60
        n: 0
      mistakes:
      - when:
          m: 60
          a: 0
        say: 'a = 0 is a lift at rest or moving steadily: the scale reads the full 600 N. Weightless means falling freely, a = −g.'
    - prompt: The lift moves up but is slowing down. A 70 kg person's scale reads 560 N. Set a.
      want:
        m: 70
        n: 560
      mistakes:
      - when:
          m: 70
          a:
          - 1
          - 10
        say: 'Moving up doesn''t mean accelerating up. It''s slowing, so the acceleration points down: negative.'
      - when:
          m: 70
          a:
          - -10
          - -3
        say: 'Too much: the reading is now below 560 N. 70(10 + a) = 560.'
  items:
  - prompt: A force gives a 5 kg mass an acceleration of 4 m/s². Find the force (in N).
    answer: '20'
    check: 5*4
    difficulty: 1
    hints:
    - F = ma.
    - 5 × 4.
    solution: 20 N.
  - prompt: A 2 kg ball moves at 3 m/s. Find its momentum (in kg m/s).
    answer: '6'
    check: 2*3
    difficulty: 1
    hints:
    - p = mv.
    - 2 × 3.
    solution: 6 kg m/s.
  - prompt: A 4 kg gun fires a 0.02 kg bullet at 400 m/s. Find the recoil speed of the gun (in m/s).
    answer: '2'
    check: Rational(2,100)*400/4
    difficulty: 2
    hints:
    - Momentum conserved.
    - 0.02 × 400 / 4.
    solution: 8/4 = 2 m/s.
  - prompt: A force of 10 N acts on a body for 3 s. Find the impulse (in N s).
    answer: '30'
    check: 10*3
    difficulty: 1
    hints:
    - Impulse = FΔt.
    - 10 × 3.
    solution: 30 N s.
  - prompt: Why don't action and reaction forces cancel?
    options:
    - They act on different bodies
    - They are unequal
    - They act in the same direction
    - One is always zero
    answer: They act on different bodies
    difficulty: 2
    hints:
    - Third law.
    - Different objects.
    solution: They act on different bodies.
    mistakes:
      They are unequal: c11p_third_law
  - prompt: 'A passenger lurches forward when a bus stops suddenly. This is due to:'
    options:
    - inertia of motion
    - inertia of rest
    - the third law
    - friction only
    answer: inertia of motion
    difficulty: 1
    hints:
    - The body wants to keep moving.
    - First law.
    solution: The body tends to stay in motion.
- code: cbse11p.laws.friction
  title: Friction and circular motion
  after:
  - cbse11p.laws.newton
  notes: |
    Friction opposes relative motion. Static friction adjusts up to μₛN; kinetic friction f = μₖN (μₖ < μₛ). Rolling
    friction is much smaller. Friction is necessary (walking, braking) but wastes energy (use lubricants, ball bearings).
    Net force: F_net = applied − friction. Circular motion needs centripetal force mv²/r: on a level road from friction
    (v_max = √(μrg)); on a banked road the normal force helps. Apparent weight in a lift: m(g + a) up, m(g − a) down.
  explanations:
    text: Friction is the force that resists sliding. Kinetic friction is μN, where N is the normal force. To find motion, subtract friction from the applied force before using F = ma. A car turning a corner needs a centripetal force, and on a flat road friction provides it.
    visual: Push a 10 kg box with 50 N on a floor with μ = 0.3 (g = 10). Friction = 0.3 × 100 = 30 N. Net force = 20 N, so a = 2 m/s².
    step_by_step: 'Step 1: Find the normal force (often mg). Step 2: Friction = μN. Step 3: Net force = applied − friction. Step 4: a = net force ÷ mass. Step 5: For turns, set friction ≥ mv²/r.'
    real_world: Racetracks and highways are banked at curves so cars can turn safely at higher speeds without relying only on friction.
  picture:
    kind: compare
    columns:
    - title: Static friction
      points:
      - before sliding
      - up to μₛN
      - larger
    - title: Kinetic friction
      points:
      - while sliding
      - equals μₖN
      - smaller
    alt: Static friction acts before sliding and can reach μₛN; kinetic friction acts while sliding, equals μₖN and is smaller.
  activity:
    type: formula
    prompt: A box on a floor (g = 10). Friction can hold it up to μmg. Push harder than that and it slides.
    inputs:
    - name: m
      label: Mass
      min: 1
      max: 20
      step: 1
      start: 1
      unit: kg
    - name: mu
      label: μ
      min: 0
      max: 1
      step: 0.05
      start: 0
    - name: f
      label: Your push
      min: 0
      max: 100
      step: 5
      start: 0
      unit: N
    outputs:
    - name: fmax
      label: Greatest friction μmg
      expr: mu*m*10
      unit: N
      places: 1
    - name: acc
      label: Acceleration
      expr: max(0,f-mu*m*10)/m
      unit: m/s²
      places: 2
    goals:
    - prompt: A 10 kg box, μ = 0.4. Find the biggest push that doesn't move it.
      want:
        m: 10
        mu: 0.4
        f: 40
      mistakes:
      - when:
          m: 10
          mu: 0.4
          f: 5
        say: That's tiny next to the box's weight. Friction is μ × weight, and the weight is mg = 100 N.
      - when:
          m: 10
          mu: 0.4
          f:
          - 45
          - 100
        say: 'That push beats friction: the box slides.'
    - prompt: A 5 kg box and a 30 N push. Choose μ so it accelerates at 2 m/s².
      want:
        m: 5
        f: 30
        acc: 2
      mistakes:
      - when:
          m: 5
          f: 30
          mu: 0
        say: 'With no friction it accelerates at 6 m/s². Friction takes μmg of the push: 30 − 50μ = 5 × 2.'
      - when:
          m: 5
          f: 30
          acc: 0
        say: 'Too much friction: the box doesn''t move at all.'
    - prompt: Make friction able to hold back 60 N on a 20 kg box.
      want:
        m: 20
        fmax: 60
      mistakes:
      - when:
          m: 20
          mu: 0.6
        say: μ = 0.6 gives 120 N. Friction is μ × 200 N here, so μ = 60 ÷ 200.
  items:
  - prompt: A 10 kg box is on a floor with μ = 0.3. Taking g = 10 m/s², find the kinetic friction (in N).
    answer: '30'
    check: Rational(3,10)*100
    difficulty: 1
    hints:
    - f = μmg.
    - 0.3 × 100.
    solution: 30 N.
  - prompt: The same box is pushed with 50 N. Find its acceleration (in m/s²).
    answer: '2'
    check: (50-30)/10
    difficulty: 2
    hints:
    - Net = 50 − 30.
    - 20/10.
    solution: 2 m/s².
    mistakes:
      '5': c11p_net_force
  - prompt: A 1000 kg car turns on a curve of radius 50 m at 10 m/s. Find the centripetal force needed (in N).
    answer: '2000'
    check: 1000*100/50
    difficulty: 2
    hints:
    - F = mv²/r.
    - 1000 × 100/50.
    solution: 2,000 N.
  - prompt: A 60 kg person stands in a lift accelerating upward at 2 m/s². Taking g = 10 m/s², find the apparent weight (in N).
    answer: '720'
    check: 60*(10+2)
    difficulty: 2
    hints:
    - m(g + a).
    - 60 × 12.
    solution: 720 N.
  - prompt: Which is usually the smallest?
    options:
    - Rolling friction
    - Static friction
    - Kinetic (sliding) friction
    - They are all equal
    answer: Rolling friction
    difficulty: 1
    hints:
    - Why wheels were invented.
    - Rolling is easier.
    solution: Rolling friction is smallest.
  - prompt: On a flat road, what provides the centripetal force for a turning car?
    options:
    - Friction between tyres and road
    - The engine
    - Gravity
    - Air resistance
    answer: Friction between tyres and road
    difficulty: 2
    hints:
    - Toward the centre.
    - Tyres grip.
    solution: Friction provides it.
