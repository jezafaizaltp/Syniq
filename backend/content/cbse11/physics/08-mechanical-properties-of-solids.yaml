# CBSE Class 11 Physics (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse11-phy
chapter: 8
title: Mechanical Properties of Solids
tips:
  c11p_stress: Stress is force per unit area (N/m², a pressure unit); strain is a ratio with no unit.
  c11p_young: Young's modulus Y = stress ÷ strain = (F/A) ÷ (ΔL/L) = FL/(AΔL).
concepts:
- code: cbse11p.solids.stress
  title: Stress, strain and Hooke's law
  notes: |
    Elasticity: a body regains its shape when the deforming force is removed; plasticity: it does not. Stress = restoring
    force per unit area, σ = F/A (N m⁻² = Pa). Kinds: tensile/compressive (longitudinal), shearing, hydraulic (volume).
    Strain = fractional change: longitudinal ΔL/L, shearing Δx/L (= tan θ), volume ΔV/V; dimensionless. Hooke's law: for
    small deformations stress ∝ strain. Stress–strain curve: proportional limit, yield point, ultimate tensile strength,
    fracture point. Ductile materials (copper) have a long plastic region; brittle ones (glass) break soon after the
    elastic limit. Elastomers (rubber) stretch a lot without obeying Hooke's law.
  explanations:
    text: 'Pull a wire and it stretches a little. Stress is the force on each square metre of its cross-section; strain is how much it stretched compared with its length. For small stretches, stress and strain are proportional: that''s Hooke''s law.'
    visual: 'Picture a stress–strain graph: a straight line first (Hooke''s law), then it bends at the yield point, rises to the highest stress the material can take, and ends where the wire snaps.'
    step_by_step: 'Step 1: Stress = force ÷ area. Step 2: Strain = change in length ÷ original length. Step 3: In the straight-line region, stress ÷ strain is constant.'
    real_world: Steel ropes in lifts are chosen so that the working stress stays far below the elastic limit, with a large safety factor.
  picture:
    kind: flow
    steps:
    - Proportional limit
    - Elastic limit / yield point
    - Ultimate tensile strength
    - Fracture point
    alt: 'Stages on a stress–strain curve: proportional limit, yield point, ultimate strength, then fracture.'
  activity:
    type: order
    prompt: A metal wire is stretched more and more. Put what happens in order.
    steps:
    - Strain grows in step with stress (Hooke's law)
    - 'Proportional limit: the straight line ends'
    - 'Yield point: the wire starts to flow'
    - 'Plastic region: it no longer springs back'
    - 'Ultimate tensile strength: greatest stress'
    - 'Fracture: the wire breaks'
    reasons:
      'Proportional limit: the straight line ends': The graph starts as a straight line. Only once the stress is past that region does it stop being proportional.
      'Yield point: the wire starts to flow': 'Yielding comes after the elastic region: until then, removing the load lets the wire spring back.'
      'Plastic region: it no longer springs back': Permanent stretch only begins once the wire has yielded.
      'Ultimate tensile strength: greatest stress': The highest stress is reached well into the plastic region, after the wire has been permanently stretched.
      'Fracture: the wire breaks': 'Breaking is last: after the greatest stress the wire narrows (necks) and then snaps.'
  items:
  - prompt: A force of 200 N acts on a wire of cross-section 2 × 10⁻⁶ m². Find the stress in units of 10⁶ N/m².
    answer: '100'
    check: 200/(2*10**-6)/10**6
    difficulty: 1
    hints:
    - σ = F/A.
    - 200 ÷ (2 × 10⁻⁶) = 10⁸.
    solution: 10⁸ N/m² = 100 × 10⁶ N/m².
    mistakes:
      '400': c11p_stress
  - prompt: A 2 m wire stretches by 1 mm. Find the strain in units of 10⁻⁴.
    answer: '5'
    check: Rational(1,1000)/2*10**4
    difficulty: 1
    hints:
    - Strain = ΔL/L.
    - 0.001 ÷ 2 = 5 × 10⁻⁴.
    solution: Strain = 5 × 10⁻⁴.
  - prompt: What is the unit of strain?
    options:
    - It has no unit
    - N/m²
    - metre
    - newton
    answer: It has no unit
    difficulty: 1
    hints:
    - Ratio of two lengths.
    - Units cancel.
    solution: Strain is dimensionless.
    mistakes:
      N/m²: c11p_stress
  - prompt: 'A material that breaks soon after the elastic limit is called:'
    options:
    - brittle
    - ductile
    - elastomeric
    - plastic
    answer: brittle
    difficulty: 2
    hints:
    - Glass.
    - Little plastic region.
    solution: Brittle materials like glass fracture soon after the elastic limit.
  - prompt: 'Hooke''s law says that, within the elastic limit:'
    options:
    - stress is proportional to strain
    - stress is constant
    - strain is constant
    - stress is proportional to strain squared
    answer: stress is proportional to strain
    difficulty: 1
    hints:
    - Straight line.
    - σ ∝ ε.
    solution: Stress ∝ strain for small deformations.
  - prompt: Which kind of stress changes the volume of a body, not its shape?
    options:
    - hydraulic stress
    - shearing stress
    - tensile stress
    - torsional stress
    answer: hydraulic stress
    difficulty: 2
    hints:
    - Pressure from all sides.
    - Body under water.
    solution: Hydraulic (volume) stress acts equally from all sides.
- code: cbse11p.solids.moduli
  title: Elastic moduli
  after:
  - cbse11p.solids.stress
  notes: |
    Modulus of elasticity = stress/strain. Young's modulus Y = (F/A)/(ΔL/L) = FL/(AΔL); steel ≈ 2 × 10¹¹ Pa. Shear
    modulus (modulus of rigidity) G = (F/A)/(Δx/L) = F/(Aθ); G ≈ Y/3 for most materials. Bulk modulus B = −p/(ΔV/V);
    compressibility k = 1/B (gases most compressible, solids least). Poisson's ratio = lateral strain/longitudinal strain
    (dimensionless, about 0.28 for steel). Elastic potential energy per unit volume = ½ × stress × strain. Uses: cranes'
    ropes, I-shaped beams (bending depression δ = WL³/(4bd³Y), so depth d matters most).
  explanations:
    text: 'Each material has its own stiffness number, called a modulus: stress divided by strain. Young''s modulus is for stretching, shear modulus for twisting sideways, and bulk modulus for squeezing from all sides.'
    visual: 'Draw a wire stretched by a weight: Y = (weight × length) ÷ (area × stretch). A stiffer material, like steel, stretches less than copper under the same weight.'
    step_by_step: 'Step 1: Find stress F/A. Step 2: Find strain ΔL/L. Step 3: Divide stress by strain. Step 4: Check units: the modulus has the units of stress (Pa).'
    real_world: 'Bridge beams have an I-shaped section: the depth resists bending most, while less steel keeps the weight down.'
  picture:
    kind: compare
    columns:
    - title: Modulus
      points:
      - Young's (Y)
      - Shear (G)
      - Bulk (B)
    - title: Deformation
      points:
      - change in length
      - change in shape
      - change in volume
    alt: Young's modulus is for length change, shear modulus for shape change and bulk modulus for volume change.
  activity:
    type: formula
    prompt: A steel wire (Y = 2 × 10¹¹ Pa) carries a load F. It stretches by ΔL = FL ÷ (AY).
    inputs:
    - name: f
      label: Load F
      min: 1
      max: 50
      step: 1
      start: 1
      unit: kN
    - name: l
      label: Length L
      min: 1
      max: 10
      step: 1
      start: 1
      unit: m
    - name: a
      label: Cross-section A
      min: 5
      max: 100
      step: 5
      start: 100
      unit: mm²
    outputs:
    - name: stress
      label: Stress F/A
      expr: f*1000/a
      unit: MPa
      places: 1
    - name: strain
      label: Strain
      expr: f*1000/a/200000
      places: 5
    - name: dl
      label: Stretch ΔL
      expr: 5*f*l/a
      unit: mm
      places: 2
    goals:
    - prompt: A 2 m steel wire carries 10 kN. Choose its area so it stretches 1 mm.
      want:
        f: 10
        l: 2
        dl: 1
      mistakes:
      - when:
          f: 10
          l: 2
          a: 50
        say: '50 mm² stretches 2 mm. A thicker wire shares the load: doubling A halves ΔL.'
      - when:
          f: 10
          l: 2
          a:
          - 5
          - 45
        say: 'Too thin: it stretches more than 1 mm.'
    - prompt: A 4 m wire of area 20 mm² may stretch at most 2 mm. Find the largest load.
      want:
        l: 4
        a: 20
        dl: 2
      mistakes:
      - when:
          l: 4
          a: 20
          f:
          - 3
          - 50
        say: 'Too much: the wire stretches past 2 mm. ΔL = 5 × F × 4 ÷ 20.'
    - prompt: Make the strain 0.001 (a 0.1% stretch).
      want:
        strain: 0.001
      mistakes:
      - when:
          strain:
          - 0.0001
          - 0.0009
        say: Not enough. Strain = stress ÷ Y, so you need a stress of 200 MPa.
      - when:
          strain:
          - 0.0011
          - 0.05
        say: Too much. Strain = stress ÷ Y, so you need a stress of 200 MPa.
  items:
  - prompt: Stress is 2 × 10⁸ Pa and strain is 10⁻³. Find Young's modulus in units of 10¹¹ Pa.
    answer: '2'
    check: 2*10**8/Rational(1,1000)/10**11
    difficulty: 1
    hints:
    - Y = stress/strain.
    - 2 × 10⁸ ÷ 10⁻³ = 2 × 10¹¹.
    solution: Y = 2 × 10¹¹ Pa.
    mistakes:
      '0.5': c11p_young
  - prompt: A wire of length 2 m, area 10⁻⁶ m² stretches 1 mm under 100 N. Find Y in units of 10¹¹ Pa.
    answer: '2'
    check: 100*2/(Rational(1,10**6)*Rational(1,1000))/10**11
    difficulty: 2
    hints:
    - Y = FL/(AΔL).
    - 100 × 2 ÷ (10⁻⁶ × 10⁻³).
    solution: Y = 2 × 10¹¹ Pa.
  - prompt: Which modulus applies to a liquid?
    options:
    - bulk modulus
    - Young's modulus
    - shear modulus
    - none
    answer: bulk modulus
    difficulty: 1
    hints:
    - Liquids have no fixed shape.
    - Only volume changes.
    solution: Fluids have only a bulk modulus.
  - prompt: 'Compressibility is:'
    options:
    - the reciprocal of bulk modulus
    - the same as Young's modulus
    - stress × strain
    - the reciprocal of strain
    answer: the reciprocal of bulk modulus
    difficulty: 2
    hints:
    - k = 1/B.
    - Easy to squeeze = small B.
    solution: Compressibility k = 1/B.
  - prompt: Find the elastic energy per unit volume (in J/m³) when stress is 4 × 10⁶ Pa and strain is 2 × 10⁻³.
    answer: '4000'
    check: Rational(1,2)*4*10**6*2*Rational(1,1000)
    difficulty: 2
    hints:
    - ½ × stress × strain.
    - ½ × 4 × 10⁶ × 2 × 10⁻³.
    solution: 4,000 J/m³.
  - prompt: 'Poisson''s ratio compares:'
    options:
    - lateral strain with longitudinal strain
    - stress with strain
    - shear with bulk modulus
    - force with area
    answer: lateral strain with longitudinal strain
    difficulty: 2
    hints:
    - Wire gets thinner as it stretches.
    - Ratio of two strains.
    solution: Poisson's ratio = lateral strain ÷ longitudinal strain.
