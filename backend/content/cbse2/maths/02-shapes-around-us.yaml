# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 2
title: Shapes Around Us
concepts:
- code: cbse2m.shapes.solid
  title: Solid shapes around us
  notes: |
    Everyday things have solid shapes: ball (sphere), dice (cube), box (cuboid), tin/glass (cylinder), party cap (cone).
    Things that roll and things that slide. Curved and flat surfaces.
  explanations:
    text: 'Look around: a ball is round all over, a dice is a cube, a box is a cuboid, a tin is a cylinder and a party cap is a cone. Round shapes roll; flat shapes slide.'
    visual: Draw a ball, a dice, a box, a tin and a party cap in a row, and write the shape name under each.
    step_by_step: 'Step 1: Look at the thing. Step 2: Is it round, flat or both? Step 3: Does it roll or slide? Step 4: Name the shape.'
    real_world: Footballs are round so they roll; bricks are cuboids so they stack.
  picture:
    kind: compare
    columns:
    - title: Rolls
      points:
      - ball
      - marble
    - title: Slides
      points:
      - dice
      - box
    - title: Rolls and slides
      points:
      - tin
      - glass
    alt: A ball and a marble roll, a dice and a box slide, a tin and a glass can roll and slide.
  activity:
    type: sort
    prompt: What shape is it?
    bins:
    - Sphere
    - Cube
    - Cuboid
    - Cylinder
    - Cone
    items:
    - label: 🏐 Ball
      bin: Sphere
      clue: Round all over.
      why: A sphere.
    - label: 🎲 Dice
      bin: Cube
      clue: All faces the same square.
      why: A cube.
    - label: 📦 Shoe box
      bin: Cuboid
      clue: Flat faces, longer one way.
      why: A cuboid.
    - label: 🥫 Tin
      bin: Cylinder
      clue: Round ends, it can roll on its side.
      why: A cylinder.
    - label: 🍦 Ice-cream cone
      bin: Cone
      clue: Round on top, pointy at the bottom.
      why: A cone.
    - label: 🧱 Brick
      bin: Cuboid
      clue: Long, with 6 flat faces.
      why: A cuboid.
    - label: 🕯️ Candle
      bin: Cylinder
      clue: Round ends, straight sides.
      why: A cylinder.
  items:
  - prompt: 'A ball is shaped like a:'
    options:
    - sphere
    - cube
    - cone
    - box
    answer: sphere
    difficulty: 1
    hints:
    - Round all over.
    - It rolls.
    solution: A ball is a sphere.
    mistakes: {"cube": "m4_sphere"}
  - prompt: 'A dice is shaped like a:'
    options:
    - cube
    - sphere
    - cone
    - cylinder
    answer: cube
    difficulty: 1
    hints:
    - All faces are squares.
    - Six faces.
    solution: A dice is a cube.
    mistakes: {"sphere": "m4_dice"}
  - prompt: Which one can roll?
    options:
    - ball
    - book
    - brick
    - box
    answer: ball
    difficulty: 1
    hints:
    - It is round.
    - No flat face.
    solution: A ball rolls.
    mistakes: {"box": "m1_roll"}
  - prompt: 'A party cap is shaped like a:'
    options:
    - cone
    - cube
    - cylinder
    - sphere
    answer: cone
    difficulty: 1
    hints:
    - Pointed at the top.
    - Round at the bottom.
    solution: A party cap is a cone.
    mistakes: {"cylinder": "m3_clown_hat"}
  - prompt: Which can roll and also slide?
    options:
    - tin
    - ball
    - dice
    - brick
    answer: tin
    difficulty: 2
    hints:
    - Flat ends, curved side.
    - Like a glass.
    solution: A tin (cylinder) rolls on its side and slides on its end.
    mistakes: {"ball": "m4_roll_slide"}
  - prompt: How many faces does a dice have?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Dots go from 1 to 6.
    - One number on each face.
    solution: A dice has 6 faces.
    mistakes:
      '4': c2_count_once
- code: cbse2m.shapes.flat
  title: 'Flat shapes: circle, square, triangle, rectangle'
  after:
  - cbse2m.shapes.solid
  notes: |
    Flat shapes: circle (no corners), triangle (3 sides, 3 corners), square (4 equal sides), rectangle (4 sides,
    opposite sides equal). Finding them around us: clock, sandwich, window, door.
  explanations:
    text: Flat shapes have sides and corners. A triangle has 3 sides, a square and a rectangle have 4, and a circle has none. A clock is a circle, a door is a rectangle.
    visual: Draw a circle, a triangle, a square and a rectangle. Count and write the number of corners inside each.
    step_by_step: 'Step 1: Count the sides. Step 2: Count the corners. Step 3: Are the sides equal? Step 4: Name the shape.'
    real_world: 'Road signs come in shapes: a round STOP sign in some places, a triangle for warning.'
  picture:
    kind: bars
    bars:
    - label: circle
      value: 0
    - label: triangle
      value: 3
    - label: square
      value: 4
    - label: rectangle
      value: 4
    alt: 'Corners of each shape: circle 0, triangle 3, square 4, rectangle 4.'
    unit: corners
  activity:
    type: sort
    prompt: How many sides?
    bins:
    - 0 (round)
    - 3 sides
    - 4 sides
    items:
    - label: Triangle
      bin: 3 sides
      clue: Count the corners. Each corner joins 2 sides.
      why: A triangle has 3 sides.
    - label: Circle
      bin: 0 (round)
      clue: Trace it. Any straight sides?
      why: A circle has no straight sides.
    - label: Square
      bin: 4 sides
      clue: Count all the sides, all equal.
      why: A square has 4 sides.
    - label: Rectangle
      bin: 4 sides
      clue: Two long and two short.
      why: 2 + 2 = 4 sides.
    - label: A slice of pizza with straight edges
      bin: 3 sides
      clue: Count its straight edges.
      why: Its 3 edges make a triangle.
    - label: A bangle seen from above
      bin: 0 (round)
      clue: Round all the way?
      why: A round shape has no sides.
  items:
  - prompt: How many sides does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Tri means three.
    - Count the lines.
    solution: A triangle has 3 sides.
    mistakes:
      '4': c2_count_once
  - prompt: How many corners does a square have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Count the pointy parts.
    - Like a chessboard square.
    solution: A square has 4 corners.
    mistakes: {"3": "m4_square_corners", "8": "m4_square_corners"}
  - prompt: Which shape has no corners?
    options:
    - circle
    - square
    - triangle
    - rectangle
    answer: circle
    difficulty: 1
    hints:
    - It is round.
    - Like a coin.
    solution: A circle has no corners.
    mistakes: {"triangle": "m5_no_corners"}
  - prompt: 'A door is shaped like a:'
    options:
    - rectangle
    - circle
    - triangle
    - star
    answer: rectangle
    difficulty: 1
    hints:
    - Long and thin.
    - 4 corners.
    solution: A door is a rectangle.
    mistakes: {"circle": "m4_door"}
  - prompt: 2 triangles have how many corners in all?
    answer: '6'
    check: 2*3
    difficulty: 2
    hints:
    - Each triangle has 3.
    - 3 + 3.
    solution: 3 + 3 = 6.
    mistakes:
      '3': c2_count_once
      '5': c2_count_once
  - prompt: Which shape has 4 equal sides?
    options:
    - square
    - rectangle
    - triangle
    - circle
    answer: square
    difficulty: 2
    hints:
    - All sides the same.
    - Not long and thin.
    solution: A square has 4 equal sides.
    mistakes: {"rectangle": "m4_four_equal"}
