# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 2
title: Shapes Around Us
tips:
  c2m2_roll: Picture it on a slope. Curved parts roll; flat parts slide.
  c2m2_name: 'Think of something at home with that shape: a ball, a dice, a box, a tin, a cap.'
  c2m2_count: Run your finger round the shape and count each side or corner as you go.
concepts:
- code: cbse2m.shapes.solid
  title: Solid shapes around us
  notes: |
    Everyday things have solid shapes: ball (sphere), dice (cube), box (cuboid), tin/glass (cylinder), party cap (cone).
    Things that roll and things that slide. Curved and flat surfaces.
  explanations:
    text: 'Look around: a ball is round all over, a dice is a cube, a box is a cuboid, a tin is a cylinder and a party cap is a cone. Round shapes roll; flat shapes slide.'
    visual: Draw a ball, a dice, a box, a tin and a party cap in a row, and write the shape name under each.
    step_by_step: 'Step 1: Look at the thing. Step 2: Is it round, flat or both? Step 3: Does it roll or slide? Step 4: Name the shape.'
    real_world: Footballs are round so they roll; bricks are cuboids so they stack.
  picture:
    kind: compare
    columns:
    - title: Rolls
      points:
      - ball
      - marble
    - title: Slides
      points:
      - dice
      - box
    - title: Rolls and slides
      points:
      - tin
      - glass
    alt: A ball and a marble roll, a dice and a box slide, a tin and a glass can roll and slide.
  activity:
    type: sort
    prompt: What shape is it?
    bins:
    - Sphere
    - Cube
    - Cuboid
    - Cylinder
    - Cone
    items:
    - label: 🏐 Ball
      bin: Sphere
      clue: Round all over.
      why: A sphere.
    - label: 🎲 Dice
      bin: Cube
      clue: All faces the same square.
      why: A cube.
    - label: 📦 Shoe box
      bin: Cuboid
      clue: Flat faces, longer one way.
      why: A cuboid.
    - label: 🥫 Tin
      bin: Cylinder
      clue: Round ends, it can roll on its side.
      why: A cylinder.
    - label: 🍦 Ice-cream cone
      bin: Cone
      clue: Round on top, pointy at the bottom.
      why: A cone.
    - label: 🧱 Brick
      bin: Cuboid
      clue: Long, with 6 flat faces.
      why: A cuboid.
    - label: 🕯️ Candle
      bin: Cylinder
      clue: Round ends, straight sides.
      why: A cylinder.
  lesson:
    - teach: Things around us have solid shapes. A ball is a sphere. A dice is a cube. A box is a cuboid. A tin is a cylinder. A party cap is a cone.
      picture:
        kind: compare
        columns:
        - title: Thing
          points:
          - ball
          - dice
          - tin
        - title: Shape
          points:
          - sphere
          - cube
          - cylinder
        alt: Everyday things and their solid shapes.
      check:
        prompt: 'A tin is shaped like a:'
        options:
        - cylinder
        - sphere
        - cube
        answer: cylinder
        why: A tin has round flat ends and a curved side.
      ways:
      - style: real_world
        teach: In your kitchen, an orange is like a sphere, a tea box is like a cuboid, a steel glass is like a cylinder and a funnel is like a cone.
      - style: step_by_step
        teach: 'Go on a shape hunt. Step 1: Find something round like a ball. Step 2: Find something like a box. Step 3: Find something like a tin. Step 4: Put each thing next to its shape name.'
    - teach: Some surfaces are curved, like a ball. Some are flat, like the sides of a dice. Curved surfaces roll. Flat surfaces slide.
      check:
        prompt: 'A dice has:'
        options:
        - only flat faces
        - only a curved face
        - no faces
        answer: only flat faces
        why: Every side of a dice is flat.
      ways:
      - style: visual
        teach: Shapes that roll, shapes that slide, and shapes that do both.
        picture:
          kind: compare
          columns:
          - title: Only roll
            points:
            - Ball
          - title: Only slide
            points:
            - Dice
            - Box
          - title: Roll and slide
            points:
            - Tin
            - Party cap
          alt: A ball can only roll. A dice and a box can only slide. A tin and a party cap can both roll and slide.
      - style: step_by_step
        teach: 'Test a shape on a slope. Step 1: Lean a book on a few blocks to make a slope. Step 2: Put a shape at the top. Step 3: Let go and watch. Step 4: Say if it rolled, slid or stayed still.'
    - teach: A ball can only roll. A dice can only slide. A tin can roll on its side and slide on its flat end.
      check:
        prompt: Which can only slide?
        options:
        - a box
        - a ball
        - a marble
        answer: a box
        why: A box has only flat faces.
      ways:
      - style: real_world
        teach: Marbles are spheres, so they roll everywhere if you drop them. That is why marbles are kept in a box or a bag.
      - style: visual
        teach: Why a tin can roll one way and also slide another way.
        picture:
          kind: compare
          columns:
          - title: On its side
            points:
            - Curved side touches the ground
            - It rolls
          - title: On its end
            points:
            - Flat end touches the ground
            - It slides
          alt: When a tin lies on its side, its curved side touches the ground and it rolls. When it stands on its flat end, it slides.
  items:
  - prompt: 'A ball is shaped like a:'
    options:
    - sphere
    - cube
    - cone
    - box
    answer: sphere
    difficulty: 1
    hints:
    - Round all over.
    - It rolls.
    solution: A ball is a sphere.
    mistakes: {"cube": "m4_sphere"}
  - prompt: 'A dice is shaped like a:'
    options:
    - cube
    - sphere
    - cone
    - cylinder
    answer: cube
    difficulty: 1
    hints:
    - All faces are squares.
    - Six faces.
    solution: A dice is a cube.
    mistakes: {"sphere": "m4_dice"}
  - prompt: Which one can roll?
    options:
    - ball
    - book
    - brick
    - box
    answer: ball
    difficulty: 1
    hints:
    - It is round.
    - No flat face.
    solution: A ball rolls.
    mistakes: {"box": "m1_roll"}
  - prompt: 'A party cap is shaped like a:'
    options:
    - cone
    - cube
    - cylinder
    - sphere
    answer: cone
    difficulty: 1
    hints:
    - Pointed at the top.
    - Round at the bottom.
    solution: A party cap is a cone.
    mistakes: {"cylinder": "m3_clown_hat"}
  - prompt: Which can roll and also slide?
    options:
    - tin
    - ball
    - dice
    - brick
    answer: tin
    difficulty: 2
    hints:
    - Flat ends, curved side.
    - Like a glass.
    solution: A tin (cylinder) rolls on its side and slides on its end.
    mistakes: {"ball": "m4_roll_slide"}
  - prompt: How many faces does a dice have?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Dots go from 1 to 6.
    - One number on each face.
    solution: A dice has 6 faces.
    mistakes:
      '4': c2_count_once
  - prompt: 'A box of sweets is shaped like a:'
    options:
    - cuboid
    - sphere
    - cone
    answer: cuboid
    difficulty: 1
    hints:
    - It has flat faces.
    - Like a brick.
    solution: 'Step 1: A box has 6 flat faces. Step 2: It is a cuboid.'
    mistakes:
      sphere: c2m2_name
      cone: c2m2_name
  - prompt: 'An orange is shaped like a:'
    options:
    - sphere
    - cube
    - cylinder
    answer: sphere
    difficulty: 1
    hints:
    - It is round all over.
    - Like a ball.
    solution: 'Step 1: An orange is round everywhere. Step 2: It is a sphere.'
    mistakes:
      cube: c2m2_name
      cylinder: c2m2_name
  - prompt: Which one can slide?
    options:
    - a book
    - a marble
    - an orange
    answer: a book
    difficulty: 1
    hints:
    - Sliding needs a flat face.
    - Which one is flat?
    solution: 'Step 1: Marbles and oranges are round. Step 2: A book is flat, so it slides.'
    mistakes:
      a marble: c2m2_roll
      an orange: c2m2_roll
  - prompt: 'An ice-cream cone is shaped like a:'
    options:
    - cone
    - cube
    - sphere
    answer: cone
    difficulty: 1
    hints:
    - It comes to a point.
    - Like a party cap.
    solution: 'Step 1: Round top, pointed bottom. Step 2: A cone.'
    mistakes:
      cube: c2m2_name
      sphere: c2m2_name
  - prompt: How many flat faces does a tin have?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Look at the top and bottom.
    - The side is curved.
    solution: 'Step 1: Top and bottom are flat. Step 2: 2 flat faces.'
    mistakes:
      '1': c2m2_count
      '3': c2m2_count
  - prompt: Which shape has no flat face at all?
    options:
    - sphere
    - cube
    - cylinder
    answer: sphere
    difficulty: 2
    hints:
    - It is round everywhere.
    - Like a ball.
    solution: 'Step 1: Cubes and cylinders have flat faces. Step 2: A sphere has none.'
    mistakes:
      cube: c2m2_count
      cylinder: c2m2_count
  - prompt: Which would stay still on a slope?
    options:
    - a box
    - a ball
    - a tin on its side
    answer: a box
    difficulty: 2
    hints:
    - Curved things roll down.
    - Which one sits on a flat face?
    solution: 'Step 1: The ball and the tin on its side roll. Step 2: The box stays.'
    mistakes:
      a ball: c2m2_roll
      a tin on its side: c2m2_roll
  - prompt: 2 dice have how many faces in all?
    answer: '12'
    check: 6*2
    difficulty: 2
    hints:
    - One dice has 6 faces.
    - 6 + 6.
    solution: 'Step 1: 6 + 6. Step 2: = 12.'
    mistakes:
      '6': c2m2_count
      '8': c2m2_count
  - prompt: 'A toy rolls in a circle and also stands on a flat bottom. It is a:'
    options:
    - cone
    - cube
    - cuboid
    answer: cone
    difficulty: 3
    hints:
    - It has one flat base and a point.
    - Like a party cap.
    solution: 'Step 1: Cubes and cuboids cannot roll. Step 2: A cone rolls round and stands on its base.'
    mistakes:
      cube: c2m2_roll
      cuboid: c2m2_roll
  - prompt: 'Case: Children want to build a tall tower of toys. They have a ball, three boxes and a tin. Which toy will make the tower fall if it is put in the middle?'
    options:
    - "The ball, because its curved surface rolls"
    - "A box, because it has six flat faces"
    - "The tin, standing up on its flat end"
    answer: The ball, because its curved surface rolls
    hints:
    - Which toys have flat faces to stand on?
    - Which toy has no flat face?
    solution: Boxes and a tin on its end have flat faces that stay still. A ball has only a curved surface, so it rolls and the tower falls.
    mistakes:
      "A box, because it has six flat faces": c2m2_roll
      "The tin, standing up on its flat end": c2m2_roll
    exam: case
    difficulty: 2
  - prompt: 'Situation: You want a toy that will roll down a slope in a race. Which should you choose?'
    options:
    - A ball
    - A dice
    - A box
    answer: A ball
    hints:
    - What kind of surface rolls?
    - Which toy has that surface all over?
    solution: A ball has a curved surface all over, so it rolls easily. A dice and a box only slide.
    mistakes:
      A dice: c2m2_roll
      A box: c2m2_roll
    exam: competency
    difficulty: 2
- code: cbse2m.shapes.flat
  title: 'Flat shapes: circle, square, triangle, rectangle'
  after:
  - cbse2m.shapes.solid
  notes: |
    Flat shapes: circle (no corners), triangle (3 sides, 3 corners), square (4 equal sides), rectangle (4 sides,
    opposite sides equal). Finding them around us: clock, sandwich, window, door.
  explanations:
    text: Flat shapes have sides and corners. A triangle has 3 sides, a square and a rectangle have 4, and a circle has none. A clock is a circle, a door is a rectangle.
    visual: Draw a circle, a triangle, a square and a rectangle. Count and write the number of corners inside each.
    step_by_step: 'Step 1: Count the sides. Step 2: Count the corners. Step 3: Are the sides equal? Step 4: Name the shape.'
    real_world: 'Road signs come in shapes: a round STOP sign in some places, a triangle for warning.'
  picture:
    kind: bars
    bars:
    - label: circle
      value: 0
    - label: triangle
      value: 3
    - label: square
      value: 4
    - label: rectangle
      value: 4
    alt: 'Corners of each shape: circle 0, triangle 3, square 4, rectangle 4.'
    unit: corners
  activity:
    type: sort
    prompt: How many sides?
    bins:
    - 0 (round)
    - 3 sides
    - 4 sides
    items:
    - label: Triangle
      bin: 3 sides
      clue: Count the corners. Each corner joins 2 sides.
      why: A triangle has 3 sides.
    - label: Circle
      bin: 0 (round)
      clue: Trace it. Any straight sides?
      why: A circle has no straight sides.
    - label: Square
      bin: 4 sides
      clue: Count all the sides, all equal.
      why: A square has 4 sides.
    - label: Rectangle
      bin: 4 sides
      clue: Two long and two short.
      why: 2 + 2 = 4 sides.
    - label: A slice of pizza with straight edges
      bin: 3 sides
      clue: Count its straight edges.
      why: Its 3 edges make a triangle.
    - label: A bangle seen from above
      bin: 0 (round)
      clue: Round all the way?
      why: A round shape has no sides.
  lesson:
    - teach: Flat shapes are drawn on paper. A circle is round with no corners. A triangle has 3 sides and 3 corners.
      picture:
        kind: compare
        columns:
        - title: Circle
          points:
          - round
          - 0 corners
        - title: Triangle
          points:
          - 3 sides
          - 3 corners
        alt: A circle has no corners; a triangle has 3 sides and 3 corners.
      check:
        prompt: How many corners does a triangle have?
        options:
        - '3'
        - '4'
        - '0'
        answer: '3'
        why: Its 3 sides meet at 3 corners.
      ways:
      - style: step_by_step
        teach: 'Count the sides of a triangle. Step 1: Put your finger on one corner. Step 2: Run your finger along one side to the next corner: 1. Step 3: Keep going: 2, 3. Step 4: You are back where you started, so a triangle has 3 sides.'
      - style: real_world
        teach: A slice of watermelon is often cut like a triangle, and a chapati is a circle. Your plate at lunch can show you flat shapes.
    - teach: 'A square has 4 sides, all the same length. A rectangle has 4 sides: 2 long and 2 short.'
      check:
        prompt: 'A shape has 4 equal sides. It is a:'
        options:
        - square
        - triangle
        - circle
        answer: square
        why: All 4 sides of a square are equal.
      ways:
      - style: visual
        teach: 'A square and a rectangle side by side: how their sides are different.'
        picture:
          kind: compare
          columns:
          - title: Square
            points:
            - 4 sides
            - All sides the same length
          - title: Rectangle
            points:
            - 4 sides
            - 2 long sides
            - 2 short sides
          alt: 'A square has 4 sides, all the same length. A rectangle has 4 sides too: 2 long sides and 2 short sides.'
      - style: step_by_step
        teach: 'Make a square and a rectangle with sticks. Step 1: Take 4 sticks of the same length and join them: a square. Step 2: Take 2 long sticks and 2 short sticks. Step 3: Join them with the long ones opposite each other: a rectangle.'
    - teach: 'Look around: a clock is a circle, a sandwich cut corner to corner is a triangle, a window or a door is a rectangle, a carrom board is a square.'
      check:
        prompt: 'A clock face is shaped like a:'
        options:
        - circle
        - triangle
        - rectangle
        answer: circle
        why: A clock face is round.
      ways:
      - style: visual
        teach: Things in a classroom, and the flat shape each one looks like.
        picture:
          kind: compare
          columns:
          - title: Circle
            points:
            - Clock
            - Coin
          - title: Rectangle
            points:
            - Door
            - Blackboard
          - title: Square
            points:
            - Carrom board
            - Floor tile
          alt: A clock and a coin look like circles. A door and a blackboard look like rectangles. A carrom board and a floor tile look like squares.
      - style: real_world
        teach: 'Traffic signs come in different shapes: some are circles, some are triangles and some are rectangles. Drivers learn what each shape means.'
  items:
  - prompt: How many sides does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Tri means three.
    - Count the lines.
    solution: A triangle has 3 sides.
    mistakes:
      '4': c2_count_once
  - prompt: How many corners does a square have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Count the pointy parts.
    - Like a chessboard square.
    solution: A square has 4 corners.
    mistakes: {"3": "m4_square_corners", "8": "m4_square_corners"}
  - prompt: Which shape has no corners?
    options:
    - circle
    - square
    - triangle
    - rectangle
    answer: circle
    difficulty: 1
    hints:
    - It is round.
    - Like a coin.
    solution: A circle has no corners.
    mistakes: {"triangle": "m5_no_corners"}
  - prompt: 'A door is shaped like a:'
    options:
    - rectangle
    - circle
    - triangle
    - star
    answer: rectangle
    difficulty: 1
    hints:
    - Long and thin.
    - 4 corners.
    solution: A door is a rectangle.
    mistakes: {"circle": "m4_door"}
  - prompt: 2 triangles have how many corners in all?
    answer: '6'
    check: 2*3
    difficulty: 2
    hints:
    - Each triangle has 3.
    - 3 + 3.
    solution: 3 + 3 = 6.
    mistakes:
      '3': c2_count_once
      '5': c2_count_once
  - prompt: Which shape has 4 equal sides?
    options:
    - square
    - rectangle
    - triangle
    - circle
    answer: square
    difficulty: 2
    hints:
    - All sides the same.
    - Not long and thin.
    solution: A square has 4 equal sides.
    mistakes: {"rectangle": "m4_four_equal"}
  - prompt: How many sides does a rectangle have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Count round a door.
    - 2 long and 2 short.
    solution: 'Step 1: 2 long + 2 short. Step 2: 4 sides.'
    mistakes:
      '3': c2m2_count
      '2': c2m2_count
  - prompt: 'A coin is shaped like a:'
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 1
    hints:
    - It is round.
    - No corners.
    solution: 'Step 1: A coin is round. Step 2: A circle.'
    mistakes:
      square: c2m2_name
      triangle: c2m2_name
  - prompt: Which has 3 corners?
    options:
    - triangle
    - square
    - circle
    answer: triangle
    difficulty: 1
    hints:
    - '''Tri'' means three.'
    - Count the corners.
    solution: 'Step 1: A square has 4, a circle 0. Step 2: A triangle has 3.'
    mistakes:
      square: c2m2_count
      circle: c2m2_count
  - prompt: A square and a triangle have how many sides in all?
    answer: '7'
    check: 4+3
    difficulty: 2
    hints:
    - 'Square: 4 sides.'
    - 'Triangle: 3 sides.'
    solution: 'Step 1: 4 + 3. Step 2: = 7 sides.'
    mistakes:
      '6': c2m2_count
      '8': c2m2_count
  - prompt: 'A carrom board is shaped like a:'
    options:
    - square
    - circle
    - triangle
    answer: square
    difficulty: 1
    hints:
    - All 4 sides are the same.
    - It has 4 corners.
    solution: 'Step 1: 4 equal sides. Step 2: A square.'
    mistakes:
      circle: c2m2_name
      triangle: c2m2_name
  - prompt: 3 squares have how many corners in all?
    answer: '12'
    check: 4*3
    difficulty: 2
    hints:
    - One square has 4 corners.
    - 4 + 4 + 4.
    solution: 'Step 1: 4 + 4 + 4. Step 2: = 12.'
    mistakes:
      '7': c2m2_count
      '9': c2m2_count
  - prompt: Which shape has 2 long sides and 2 short sides?
    options:
    - rectangle
    - square
    - triangle
    answer: rectangle
    difficulty: 2
    hints:
    - A square's sides are all equal.
    - Think of a door.
    solution: 'Step 1: A square has equal sides. Step 2: A rectangle has 2 long and 2 short.'
    mistakes:
      square: c2m2_count
      triangle: c2m2_count
  - prompt: How many corners does a circle have?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - Is there anywhere two sides meet?
    - It is one round line.
    solution: 'Step 1: A circle has no sides that meet. Step 2: 0 corners.'
    mistakes:
      '1': c2m2_count
      '4': c2m2_count
  - prompt: A sandwich (square) is cut corner to corner once. Which shapes do you get?
    options:
    - 2 triangles
    - 2 circles
    - 2 squares
    answer: 2 triangles
    difficulty: 3
    hints:
    - Draw a line from one corner to the opposite corner.
    - Count the corners of each piece.
    solution: 'Step 1: One cut makes 2 pieces. Step 2: Each has 3 corners: triangles.'
    mistakes:
      2 circles: c2m2_count
      2 squares: c2m2_count
  - prompt: 'Case: Children make a picture of a house. They use 2 squares for the walls and a triangle for the roof. How many corners are there in the three shapes together?'
    options:
    - '11'
    - '12'
    - '8'
    answer: '11'
    hints:
    - How many corners does one square have? And two squares?
    - How many does a triangle have? Add them all.
    solution: Each square has 4 corners, so 2 squares have 8. A triangle has 3. 8 + 3 = 11 corners.
    mistakes:
      '12': c2m2_count
      '8': c2m2_count
    exam: case
    difficulty: 2
  - prompt: 'Situation: You need to draw a shape with no corners for the sun in your picture. Which shape should you draw?'
    options:
    - A circle
    - A square
    - A triangle
    answer: A circle
    hints:
    - Which shape is round all the way?
    - Which shapes have corners?
    solution: A circle is round and has no corners, so it is good for the sun.
    mistakes:
      A square: c2m2_count
      A triangle: c2m2_count
    exam: competency
    difficulty: 2
