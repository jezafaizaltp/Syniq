# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 11. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 11
title: Data Handling
concepts:
- code: cbse2m.data.sort
  title: Sorting and counting
  notes: |
    Sorting things into groups (by colour, shape, kind) and counting each group. Tally marks for counting. Which group
    has the most or fewest.
  explanations:
    text: 'To understand a heap of things, sort them into groups: all red together, all blue together. Then count each group and compare.'
    visual: 'Draw a heap of red and blue buttons, then two boxes: red buttons in one, blue in the other, with the counts written.'
    step_by_step: 'Step 1: Choose how to sort (colour, shape). Step 2: Put each thing in its group. Step 3: Count each group. Step 4: Compare.'
    real_world: 'A shopkeeper sorts fruits into baskets: apples in one, bananas in another.'
  picture:
    kind: bars
    bars:
    - label: red
      value: 6
    - label: blue
      value: 4
    - label: green
      value: 2
    alt: 'Buttons sorted by colour: 6 red, 4 blue and 2 green.'
    unit: buttons
  activity:
    type: sort
    prompt: Sort the beads by colour.
    bins:
    - Red
    - Blue
    - Green
    items:
    - label: 🔴 Bead
      bin: Red
      clue: Like a ripe tomato.
      why: It's red.
    - label: 🔵 Bead
      bin: Blue
      clue: Like the sky.
      why: It's blue.
    - label: 🟢 Bead
      bin: Green
      clue: Like a leaf.
      why: It's green.
    - label: 🍎 Apple-coloured bead
      bin: Red
      clue: What colour is an apple?
      why: Apple colour is red.
    - label: 💧 Sea-coloured bead
      bin: Blue
      clue: What colour is the sea?
      why: It's blue.
    - label: 🥒 Cucumber-coloured bead
      bin: Green
      clue: What colour is a cucumber?
      why: It's green.
  items:
  - prompt: 6 red, 4 blue and 2 green buttons. How many red?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Look at the red group.
    - Count it.
    solution: There are 6 red buttons.
  - prompt: 'Which colour has the most buttons: 6 red, 4 blue, 2 green?'
    options:
    - red
    - blue
    - green
    answer: red
    difficulty: 1
    hints:
    - Biggest number.
    - '6.'
    solution: Red has the most (6).
  - prompt: 'Which colour has the fewest: 6 red, 4 blue, 2 green?'
    options:
    - green
    - red
    - blue
    answer: green
    difficulty: 1
    hints:
    - Smallest number.
    - '2.'
    solution: Green has the fewest (2).
  - prompt: 'How many buttons in all: 6 red, 4 blue, 2 green?'
    answer: '12'
    check: 6 + 4 + 2
    difficulty: 2
    hints:
    - 6 + 4 = 10.
    - 10 + 2.
    solution: 6 + 4 + 2 = 12.
    mistakes:
      '10': c2_count_once
  - prompt: 'How many more red than blue: 6 red, 4 blue?'
    answer: '2'
    check: 6 - 4
    difficulty: 2
    hints:
    - 6 − 4.
    - Match one-to-one.
    solution: 6 − 4 = 2.
    mistakes:
      '10': c2_count_once
  - prompt: 'Sorting means:'
    options:
    - putting things in groups
    - throwing things away
    - counting backward
    - colouring things
    answer: putting things in groups
    difficulty: 1
    hints:
    - Like with like.
    - Groups.
    solution: Sorting means putting things into groups.
- code: cbse2m.data.read
  title: Reading a picture chart
  after:
  - cbse2m.data.sort
  notes: |
    A picture chart (pictograph) shows data with pictures: one picture for each thing. Reading how many, which is most
    and least, and comparing.
  explanations:
    text: A picture chart uses one picture for each thing. Count the pictures in each row to find how many, and compare the rows.
    visual: 'Draw a chart of favourite fruits: 5 mangoes, 3 bananas, 4 apples, one picture each.'
    step_by_step: 'Step 1: Read the row names. Step 2: Count the pictures in each row. Step 3: Find the most and the fewest.'
    real_world: Teachers make a chart of how many children like each game.
  picture:
    kind: bars
    bars:
    - label: mango
      value: 5
    - label: banana
      value: 3
    - label: apple
      value: 4
    alt: 'Favourite fruits in a class: 5 like mango, 3 like banana and 4 like apple.'
    unit: children
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 0
    prompt: Read the picture chart. One 🍎 means one fruit eaten.
    goals:
    - prompt: 'Riya: 🍎🍎🍎🍎🍎. How many did Riya eat?'
      target: 5
      mistakes:
      - when:
          v: 4
        say: 'Count each picture once: 1, 2, 3, 4, 5.'
    - prompt: Riya 🍎🍎🍎🍎🍎, Sam 🍎🍎. How many more did Riya eat?
      target: 3
      mistakes:
      - when:
          v: 7
        say: 'That adds both. ''How many more'' means compare: 5 − 2.'
      - when:
          v: 2
        say: That's Sam's row. Compare the two rows.
    - prompt: Sam 🍎🍎 and Anu 🍎🍎🍎🍎. How many in all?
      target: 6
      mistakes:
      - when:
          v: 2
        say: 'That compares. ''In all'' means put together: 2 + 4.'
  items:
  - prompt: A chart shows 5 mangoes, 3 bananas and 4 apples. How many like mango?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Count the mango row.
    - 5 pictures.
    solution: 5 children like mango.
  - prompt: Which fruit is liked the most (5 mango, 3 banana, 4 apple)?
    options:
    - mango
    - banana
    - apple
    answer: mango
    difficulty: 1
    hints:
    - Longest row.
    - '5.'
    solution: Mango is liked the most.
  - prompt: Which fruit is liked the least (5 mango, 3 banana, 4 apple)?
    options:
    - banana
    - mango
    - apple
    answer: banana
    difficulty: 1
    hints:
    - Shortest row.
    - '3.'
    solution: Banana is liked the least.
  - prompt: How many children in all (5 mango, 3 banana, 4 apple)?
    answer: '12'
    check: 5 + 3 + 4
    difficulty: 2
    hints:
    - 5 + 3 = 8.
    - 8 + 4.
    solution: 5 + 3 + 4 = 12.
    mistakes:
      '11': c2_count_once
      '8': c2_count_once
  - prompt: How many more like apple than banana (4 apple, 3 banana)?
    answer: '1'
    check: 4 - 3
    difficulty: 2
    hints:
    - 4 − 3.
    - Compare the rows.
    solution: 4 − 3 = 1.
    mistakes:
      '7': c2_count_once
  - prompt: 'In a picture chart, one picture stands for:'
    options:
    - one thing
    - ten things
    - nothing
    - a colour
    answer: one thing
    difficulty: 1
    hints:
    - Count one for each picture.
    - One each.
    solution: Each picture stands for one thing.
