# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 11. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 11
title: Data Handling
tips:
  m2_one_picture: "In a simple picture chart, count the pictures one by one."
  m2_only_red: "Count only the red buttons."
  m2_read_row: "Find the mango row and read only that number."
  c2m11_sort: Put things that are the same kind together, then count each group.
  c2m11_read: Put your finger on the row, count its pictures, then compare with the others.
  c2m11_diff: Bigger count minus smaller count gives how many more.

concepts:
- code: cbse2m.data.sort
  title: Sorting and counting
  notes: |
    Sorting things into groups (by colour, shape, kind) and counting each group. Tally marks for counting. Which group
    has the most or fewest.
  explanations:
    text: 'To understand a heap of things, sort them into groups: all red together, all blue together. Then count each group and compare.'
    visual: 'Draw a heap of red and blue buttons, then two boxes: red buttons in one, blue in the other, with the counts written.'
    step_by_step: 'Step 1: Choose how to sort (colour, shape). Step 2: Put each thing in its group. Step 3: Count each group. Step 4: Compare.'
    real_world: 'A shopkeeper sorts fruits into baskets: apples in one, bananas in another.'
  picture:
    kind: bars
    bars:
    - label: red
      value: 6
    - label: blue
      value: 4
    - label: green
      value: 2
    alt: 'Buttons sorted by colour: 6 red, 4 blue and 2 green.'
    unit: buttons
  activity:
    type: sort
    prompt: Sort the beads by colour.
    bins:
    - Red
    - Blue
    - Green
    items:
    - label: 🔴 Bead
      bin: Red
      clue: Like a ripe tomato.
      why: It's red.
    - label: 🔵 Bead
      bin: Blue
      clue: Like the sky.
      why: It's blue.
    - label: 🟢 Bead
      bin: Green
      clue: Like a leaf.
      why: It's green.
    - label: 🍎 Apple-coloured bead
      bin: Red
      clue: What colour is an apple?
      why: Apple colour is red.
    - label: 💧 Sea-coloured bead
      bin: Blue
      clue: What colour is the sea?
      why: It's blue.
    - label: 🥒 Cucumber-coloured bead
      bin: Green
      clue: What colour is a cucumber?
      why: It's green.
  lesson:
    - teach: 'Sorting means putting things into groups that are alike: by colour, shape or kind. Then we can count each group.'
      picture:
        kind: compare
        columns:
        - title: Red
          points:
          - ball
          - apple
          - car
        - title: Yellow
          points:
          - banana
          - duck
        alt: 'Things sorted by colour: 3 red, 2 yellow.'
      check:
        prompt: 3 red things and 2 yellow things. How many red?
        options:
        - '3'
        - '2'
        - '5'
        answer: '3'
        why: Count only the red group.
      ways:
      - style: step_by_step
        teach: 'Sort the toy box. Step 1: Take out all the toys. Step 2: Make one pile for balls, one for cars and one for dolls. Step 3: Count each pile. Step 4: Say which pile has the most.'
      - style: real_world
        teach: 'At home, clean clothes are sorted before they go into the cupboard: shirts in one pile, socks in another. Sorting makes things easy to find.'
    - teach: 'Tally marks help count: draw one line for each thing. The fifth line crosses the four: |||| with a cross means 5.'
      check:
        prompt: 'One crossed bundle of tally marks means:'
        options:
        - '5'
        - '4'
        - '10'
        answer: '5'
        why: 4 standing lines and 1 across make 5.
      ways:
      - style: visual
        teach: 'Tally marks for 8: one bundle of 5 and 3 more.'
        picture:
          kind: compare
          columns:
          - title: Bundle
            points:
            - '|||| crossed'
            - = 5
          - title: More
            points:
            - '|||'
            - = 3
          - title: Total
            points:
            - 5, then 6, 7, 8
            - = 8
          alt: Eight in tally marks is one crossed bundle of 5 and 3 more lines. Count 5, then 6, 7, 8.
      - style: real_world
        teach: In a class vote for the class monitor, the teacher makes a tally mark on the board for each vote. Crossed bundles of 5 make the votes quick to count.
    - teach: 'After counting, compare: which group has the most? Which has the fewest? How many more?'
      check:
        prompt: Cats 4, dogs 7. Which has more?
        options:
        - dogs
        - cats
        - the same
        answer: dogs
        why: 7 is more than 4.
      ways:
      - style: visual
        teach: Comparing three groups of leaves after sorting them.
        picture:
          kind: bars
          bars:
          - label: Big
            value: 9
          - label: Small
            value: 2
          - label: Long
            value: 6
          alt: There are 9 big leaves, 2 small leaves and 6 long leaves. Big has the most, small has the fewest, and there are 7 more big leaves than small ones.
      - style: step_by_step
        teach: 'Find how many more. Step 1: Count the bigger group: 7 big leaves. Step 2: Count the smaller group: 1 small leaf. Step 3: Count up from 1 to 7: 2, 3, 4, 5, 6, 7. Step 4: That is 6 more big leaves.'
  items:
  - prompt: 6 red, 4 blue and 2 green buttons. How many red?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Look at the red group.
    - Count it.
    solution: There are 6 red buttons.
    mistakes: {"12": "m2_only_red", "4": "m2_only_red"}
  - prompt: 'Which colour has the most buttons: 6 red, 4 blue, 2 green?'
    options:
    - red
    - blue
    - green
    answer: red
    difficulty: 1
    hints:
    - Biggest number.
    - '6.'
    solution: Red has the most (6).
    mistakes: {"blue": "m5_most"}
  - prompt: 'Which colour has the fewest: 6 red, 4 blue, 2 green?'
    options:
    - green
    - red
    - blue
    answer: green
    difficulty: 1
    hints:
    - Smallest number.
    - '2.'
    solution: Green has the fewest (2).
    mistakes: {"blue": "m5_least_popular"}
  - prompt: 'How many buttons in all: 6 red, 4 blue, 2 green?'
    answer: '12'
    check: 6 + 4 + 2
    difficulty: 2
    hints:
    - 6 + 4 = 10.
    - 10 + 2.
    solution: 6 + 4 + 2 = 12.
    mistakes:
      '10': c2_count_once
  - prompt: 'How many more red than blue: 6 red, 4 blue?'
    answer: '2'
    check: 6 - 4
    difficulty: 2
    hints:
    - 6 − 4.
    - Match one-to-one.
    solution: 6 − 4 = 2.
    mistakes:
      '10': c2_count_once
  - prompt: 'Sorting means:'
    options:
    - putting things in groups
    - throwing things away
    - counting backward
    - colouring things
    answer: putting things in groups
    difficulty: 1
    hints:
    - Like with like.
    - Groups.
    solution: Sorting means putting things into groups.
    mistakes: {"throwing things away": "m1_sorting"}
  - prompt: 5 circles, 3 squares, 4 triangles. Which shape has the fewest?
    options:
    - squares
    - circles
    - triangles
    answer: squares
    difficulty: 1
    hints:
    - Find the smallest number.
    - 5, 3, 4.
    solution: 'Step 1: 3 is the smallest. Step 2: Squares.'
    mistakes:
      circles: c2m11_read
      triangles: c2m11_read
  - prompt: 5 circles, 3 squares, 4 triangles. How many shapes in all?
    answer: '12'
    check: 5+3+4
    difficulty: 2
    hints:
    - Add all three.
    - 5 + 3 = 8, then + 4.
    solution: 'Step 1: 5 + 3 = 8. Step 2: 8 + 4 = 12.'
    mistakes:
      '8': c2m11_sort
      '11': c2m11_sort
  - prompt: 'Tally: |||| with a cross and || more. How many?'
    answer: '7'
    check: 5+2
    difficulty: 2
    hints:
    - A crossed bundle is 5.
    - Add the 2 lines.
    solution: 'Step 1: Bundle = 5. Step 2: 5 + 2 = 7.'
    mistakes:
      '6': c2m11_read
      '2': c2m11_read
  - prompt: 'Which way can we sort these: apple, ball, banana, bat?'
    options:
    - fruits and toys
    - big and heavy
    - hot and cold
    answer: fruits and toys
    difficulty: 2
    hints:
    - Which ones can you eat?
    - Which can you play with?
    solution: 'Step 1: Apple and banana are fruits. Step 2: Ball and bat are toys.'
    mistakes:
      big and heavy: c2m11_sort
      hot and cold: c2m11_sort
  - prompt: 8 blue pencils and 5 green pencils. How many more blue?
    answer: '3'
    check: 8-5
    difficulty: 1
    hints:
    - Bigger minus smaller.
    - 8 − 5.
    solution: 'Step 1: 8 − 5. Step 2: 3 more.'
    mistakes:
      '13': c2m11_diff
      '5': c2m11_diff
  - prompt: In a class, 9 children walk to school and 6 come by bus. How many children in all?
    answer: '15'
    check: 9+6
    difficulty: 2
    hints:
    - Add both groups.
    - 9 + 6.
    solution: 'Step 1: 9 + 6. Step 2: = 15.'
    mistakes:
      '3': c2m11_diff
      '14': c2m11_sort
  - prompt: 'Leaves sorted: big 6, small 6. Which is true?'
    options:
    - both groups are the same
    - big has more
    - small has more
    answer: both groups are the same
    difficulty: 1
    hints:
    - Compare 6 and 6.
    - Is one more?
    solution: 'Step 1: 6 = 6. Step 2: Both the same.'
    mistakes:
      big has more: c2m11_read
      small has more: c2m11_read
  - prompt: Red 7, blue 4, yellow 9 buttons. Which colour has the most?
    options:
    - yellow
    - red
    - blue
    answer: yellow
    difficulty: 1
    hints:
    - Find the biggest number.
    - 7, 4, 9.
    solution: 'Step 1: 9 is the biggest. Step 2: Yellow.'
    mistakes:
      red: c2m11_read
      blue: c2m11_read
  - prompt: Red 7, blue 4, yellow 9. How many more yellow than blue?
    answer: '5'
    check: 9-4
    difficulty: 3
    hints:
    - Use only yellow and blue.
    - 9 − 4.
    solution: 'Step 1: 9 − 4. Step 2: 5 more.'
    mistakes:
      '13': c2m11_diff
      '2': c2m11_diff
  - prompt: 'Case: A class sorts the fruit in their lunch boxes. There are 7 bananas, 7 apples and 3 oranges. One child says bananas are the most. Is the child right?'
    options:
    - "Not quite: bananas and apples are the same, and both have the most"
    - "Yes, bananas are the most, because they were counted first"
    - "No, oranges are the most, because they are the biggest fruit"
    answer: 'Not quite: bananas and apples are the same, and both have the most'
    hints:
    - Count each group.
    - Are any two groups the same?
    solution: Bananas are 7 and apples are 7, so they are the same. Both are more than oranges, which are 3.
    mistakes:
      "Yes, bananas are the most, because they were counted first": c2m11_sort
      "No, oranges are the most, because they are the biggest fruit": c2m11_sort
    exam: case
    difficulty: 2
  - prompt: 'Situation: You have a box of crayons, buttons and pencils all mixed up. You want to find out how many buttons there are. What should you do first?'
    options:
    - "Sort them into groups of crayons, buttons and pencils"
    - "Count them together in one big mixed-up pile"
    - "Throw away the crayons and count what is left"
    answer: Sort them into groups of crayons, buttons and pencils
    hints:
    - How can you count only the buttons?
    - What helps you see each kind clearly?
    solution: Sorting puts things that are alike together. Then you can count just the buttons.
    mistakes:
      "Count them together in one big mixed-up pile": c2m11_sort
      "Throw away the crayons and count what is left": c2m11_sort
    exam: competency
    difficulty: 2
- code: cbse2m.data.read
  title: Reading a picture chart
  after:
  - cbse2m.data.sort
  notes: |
    A picture chart (pictograph) shows data with pictures: one picture for each thing. Reading how many, which is most
    and least, and comparing.
  explanations:
    text: A picture chart uses one picture for each thing. Count the pictures in each row to find how many, and compare the rows.
    visual: 'Draw a chart of favourite fruits: 5 mangoes, 3 bananas, 4 apples, one picture each.'
    step_by_step: 'Step 1: Read the row names. Step 2: Count the pictures in each row. Step 3: Find the most and the fewest.'
    real_world: Teachers make a chart of how many children like each game.
  picture:
    kind: bars
    bars:
    - label: mango
      value: 5
    - label: banana
      value: 3
    - label: apple
      value: 4
    alt: 'Favourite fruits in a class: 5 like mango, 3 like banana and 4 like apple.'
    unit: children
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 0
    prompt: Read the picture chart. One 🍎 means one fruit eaten.
    goals:
    - prompt: 'Riya: 🍎🍎🍎🍎🍎. How many did Riya eat?'
      target: 5
      mistakes:
      - when:
          v: 4
        say: 'Count each picture once: 1, 2, 3, 4, 5.'
    - prompt: Riya 🍎🍎🍎🍎🍎, Sam 🍎🍎. How many more did Riya eat?
      target: 3
      mistakes:
      - when:
          v: 7
        say: 'That adds both. ''How many more'' means compare: 5 − 2.'
      - when:
          v: 2
        say: That's Sam's row. Compare the two rows.
    - prompt: Sam 🍎🍎 and Anu 🍎🍎🍎🍎. How many in all?
      target: 6
      mistakes:
      - when:
          v: 2
        say: 'That compares. ''In all'' means put together: 2 + 4.'
  lesson:
    - teach: A picture chart shows counts with pictures. Each picture means one thing. Count the pictures in a row to know how many.
      picture:
        kind: bars
        unit: children
        bars:
        - label: mango
          value: 5
        - label: banana
          value: 3
        - label: apple
          value: 4
        alt: 'Favourite fruits: mango 5, banana 3, apple 4.'
      check:
        prompt: Mango row has 5 pictures. How many like mango?
        options:
        - '5'
        - '3'
        - '4'
        answer: '5'
        why: One picture for each child.
      ways:
      - style: visual
        teach: 'A picture chart of favourite pets: each picture means one child.'
        picture:
          kind: compare
          columns:
          - title: Pet
            points:
            - Dog
            - Cat
            - Fish
          - title: Pictures
            points:
            - 🐶🐶🐶🐶🐶🐶
            - 🐱🐱🐱
            - 🐟🐟🐟🐟🐟
          alt: In the picture chart, dogs have 6 pictures, cats have 3 and fish have 5. Each picture means one child.
      - style: step_by_step
        teach: 'Read a picture chart. Step 1: Read the name of each row. Step 2: Put your finger on the first picture in a row. Step 3: Count the pictures to the end of the row. Step 4: Write the number next to the row.'
    - teach: The longest row shows the most. The shortest row shows the least.
      check:
        prompt: 'Which row shows the least: mango 5, banana 3, apple 4?'
        options:
        - banana
        - mango
        - apple
        answer: banana
        why: 3 is the smallest.
      ways:
      - style: real_world
        teach: Some classrooms have a weather chart with a sun, cloud or rain picture for each day. At the end of the month, the longest row shows the most common weather.
      - style: visual
        teach: The longest row shows the most and the shortest row shows the least.
        picture:
          kind: bars
          bars:
          - label: Sunny
            value: 9
          - label: Cloudy
            value: 6
          - label: Rainy
            value: 2
          alt: In a month's weather chart, sunny days have the longest row with 9, cloudy days have 6, and rainy days have the shortest row with 2.
    - teach: 'To find how many more, take the smaller count from the bigger. Mango 5, apple 4: 5 − 4 = 1 more.'
      check:
        prompt: Mango 5, banana 3. How many more like mango?
        options:
        - '2'
        - '8'
        - '3'
        answer: '2'
        why: 5 − 3 = 2.
      ways:
      - style: step_by_step
        teach: 'Find how many more like cats than fish. Step 1: Count cats: 10. Step 2: Count fish: 6. Step 3: Count up from 6 to 10: 7, 8, 9, 10. Step 4: 4 more children like cats.'
      - style: visual
        teach: A bar chart of the pets children in one class have at home.
        picture:
          kind: bars
          bars:
          - label: Dogs
            value: 10
          - label: Cats
            value: 7
          - label: Birds
            value: 3
          alt: 10 children have a dog, 7 have a cat and 3 have a bird. The dog bar is the tallest, so dogs are the most common pet.
  items:
  - prompt: A chart shows 5 mangoes, 3 bananas and 4 apples. How many like mango?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Count the mango row.
    - 5 pictures.
    solution: 5 children like mango.
    mistakes: {"12": "m2_read_row", "4": "m2_read_row"}
  - prompt: Which fruit is liked the most (5 mango, 3 banana, 4 apple)?
    options:
    - mango
    - banana
    - apple
    answer: mango
    difficulty: 1
    hints:
    - Longest row.
    - '5.'
    solution: Mango is liked the most.
    mistakes: {"apple": "m5_most"}
  - prompt: Which fruit is liked the least (5 mango, 3 banana, 4 apple)?
    options:
    - banana
    - mango
    - apple
    answer: banana
    difficulty: 1
    hints:
    - Shortest row.
    - '3.'
    solution: Banana is liked the least.
    mistakes: {"apple": "m5_least_popular"}
  - prompt: How many children in all (5 mango, 3 banana, 4 apple)?
    answer: '12'
    check: 5 + 3 + 4
    difficulty: 2
    hints:
    - 5 + 3 = 8.
    - 8 + 4.
    solution: 5 + 3 + 4 = 12.
    mistakes:
      '11': c2_count_once
      '8': c2_count_once
  - prompt: How many more like apple than banana (4 apple, 3 banana)?
    answer: '1'
    check: 4 - 3
    difficulty: 2
    hints:
    - 4 − 3.
    - Compare the rows.
    solution: 4 − 3 = 1.
    mistakes:
      '7': c2_count_once
  - prompt: 'In a picture chart, one picture stands for:'
    options:
    - one thing
    - ten things
    - nothing
    - a colour
    answer: one thing
    difficulty: 1
    hints:
    - Count one for each picture.
    - One each.
    solution: Each picture stands for one thing.
    mistakes: {"ten things": "m2_one_picture"}
  - prompt: 'Chart: 🐶 🐶 🐶 🐶 (dogs), 🐱 🐱 (cats). How many dogs?'
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Count the dog pictures.
    - One picture = one dog.
    solution: 'Step 1: Count 4 dogs. Step 2: 4.'
    mistakes:
      '2': c2m11_read
      '6': c2m11_read
  - prompt: 'Chart: dogs 4, cats 2. How many pets in all?'
    answer: '6'
    check: 4+2
    difficulty: 1
    hints:
    - Add both rows.
    - 4 + 2.
    solution: 'Step 1: 4 + 2. Step 2: 6 pets.'
    mistakes:
      '2': c2m11_diff
      '8': c2m11_read
  - prompt: 'Chart: dogs 4, cats 2. How many more dogs?'
    answer: '2'
    check: 4-2
    difficulty: 1
    hints:
    - Bigger minus smaller.
    - 4 − 2.
    solution: 'Step 1: 4 − 2. Step 2: 2 more.'
    mistakes:
      '6': c2m11_diff
      '4': c2m11_diff
  - prompt: 'Rainy days: Mon ☔☔, Tue ☔, Wed ☔☔☔. Which day had the most rain pictures?'
    options:
    - Wednesday
    - Monday
    - Tuesday
    answer: Wednesday
    difficulty: 2
    hints:
    - Count each row.
    - 2, 1, 3.
    solution: 'Step 1: Wednesday has 3. Step 2: Most.'
    mistakes:
      Monday: c2m11_read
      Tuesday: c2m11_read
  - prompt: 'Rainy days: Mon 2, Tue 1, Wed 3 pictures. How many pictures in all?'
    answer: '6'
    check: 2+1+3
    difficulty: 2
    hints:
    - Add all three days.
    - 2 + 1 + 3.
    solution: 'Step 1: 2 + 1 = 3. Step 2: 3 + 3 = 6.'
    mistakes:
      '5': c2m11_read
      '3': c2m11_read
  - prompt: 'Chart: red cars 6, blue cars 6, white cars 2. Which two rows are the same?'
    options:
    - red and blue
    - red and white
    - blue and white
    answer: red and blue
    difficulty: 2
    hints:
    - Find two equal counts.
    - 6, 6, 2.
    solution: 'Step 1: Red 6 and blue 6. Step 2: Red and blue.'
    mistakes:
      red and white: c2m11_read
      blue and white: c2m11_read
  - prompt: Why do we make a picture chart?
    options:
    - to see counts quickly
    - to colour for fun only
    - to hide the numbers
    answer: to see counts quickly
    difficulty: 2
    hints:
    - Long and short rows are easy to see.
    - What does it help us find?
    solution: 'Step 1: Rows show how many at a glance. Step 2: To see counts quickly.'
    mistakes:
      to colour for fun only: c2m11_read
      to hide the numbers: c2m11_read
  - prompt: 'Chart: tea 3, milk 7, juice 5. How many more children chose milk than tea?'
    answer: '4'
    check: 7-3
    difficulty: 3
    hints:
    - Use only milk and tea.
    - 7 − 3.
    solution: 'Step 1: 7 − 3. Step 2: 4 more.'
    mistakes:
      '10': c2m11_diff
      '2': c2m11_diff
  - prompt: 'Chart: tea 3, milk 7, juice 5. Which drink came second most?'
    options:
    - juice
    - tea
    - milk
    answer: juice
    difficulty: 3
    hints:
    - 'Order them: biggest first.'
    - 7, 5, 3.
    solution: 'Step 1: Milk 7 is most, juice 5 next. Step 2: Juice.'
    mistakes:
      tea: c2m11_read
      milk: c2m11_read
  - prompt: 'Case: A picture chart shows how children come to school: walk 🚶🚶🚶🚶🚶🚶🚶, bus 🚌🚌🚌, cycle 🚲🚲🚲🚲. A child says more children come by bus than by cycle. Is that right?'
    options:
    - 'No, the cycle row is longer: 4 cycle and 3 bus'
    - Yes, the bus is bigger, so more come by bus
    - They are the same
    answer: 'No, the cycle row is longer: 4 cycle and 3 bus'
    hints:
    - Count the pictures in each row.
    - Does a bigger vehicle mean more pictures?
    solution: The bus row has 3 pictures and the cycle row has 4. Each picture is one child, so more children come by cycle.
    mistakes:
      Yes, the bus is bigger, so more come by bus: c2m11_read
      They are the same: c2m11_read
    exam: case
    difficulty: 2
  - prompt: 'Situation: A chart shows the snacks children chose: samosa 9, fruit 6. How many more children chose samosa than fruit?'
    options:
    - '3'
    - '15'
    - '9'
    answer: '3'
    hints:
    - How many more means take the smaller from the bigger.
    - Count up from 6 to 9.
    solution: '9 − 6 = 3. Counting up from 6: 7, 8, 9 is 3 more.'
    mistakes:
      '15': c2m11_diff
      '9': c2m11_diff
    exam: competency
    difficulty: 2
