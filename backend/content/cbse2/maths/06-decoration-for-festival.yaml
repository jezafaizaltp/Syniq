# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 6
title: Decoration for Festival
tips:
  m2_rows: "Count each: 3 + 3 + 3, and 4 + 4. Which total is more?"
  c2m6_core: Find the part that repeats. Then say the pattern again from the start.
  c2m6_add: Count on from the bigger number, one step at a time.
  c2m6_rows: Count how many in one row, then count that many again for each row.

concepts:
- code: cbse2m.deco.pattern
  title: Patterns with shapes and colours
  notes: |
    Patterns repeat: red-blue-red-blue; circle-square-circle-square; bead patterns on a garland, rangoli designs.
    Finding what comes next and what part repeats.
  explanations:
    text: 'A pattern repeats again and again. On a festival garland: red, yellow, red, yellow. Find the part that repeats, then you know what comes next.'
    visual: 'Draw a garland of flowers: red, yellow, red, yellow, red, and ask what comes next.'
    step_by_step: 'Step 1: Find the part that repeats. Step 2: Say it aloud a few times. Step 3: Continue the pattern.'
    real_world: Rangoli and mango-leaf toran at Diwali or Onam use repeating patterns.
  picture:
    kind: flow
    steps:
    - red
    - yellow
    - red
    - yellow
    - '?'
    alt: 'A garland pattern: red, yellow, red, yellow, and next comes red.'
  activity:
    type: sort
    prompt: What comes next on the garland?
    bins:
    - 🔺
    - ⚪
    - 🟥
    items:
    - label: 🔺⚪🔺⚪🔺 ...
      bin: ⚪
      clue: They take turns.
      why: Triangle, circle, triangle, circle. Next is a circle.
    - label: 🟥🟥⚪🟥🟥 ...
      bin: ⚪
      clue: Two of one, then one of another.
      why: Square, square, circle. Next is a circle.
    - label: 🔺⚪🟥🔺⚪ ...
      bin: 🟥
      clue: The part that repeats has three shapes.
      why: Triangle, circle, square. Next is a square.
    - label: ⚪🔺🔺⚪🔺🔺⚪ ...
      bin: 🔺
      clue: One, then two of another.
      why: Circle, triangle, triangle. Next a triangle.
    - label: 🟥⚪⚪🟥⚪⚪ ...
      bin: 🟥
      clue: Where does it start again?
      why: Square, circle, circle. It starts again with a square.
  lesson:
    - teach: A pattern repeats again and again. In red, blue, red, blue, the part 'red, blue' repeats. Find the repeating part, then you can say what comes next.
      picture:
        kind: flow
        steps:
        - red
        - blue
        - red
        - blue
        - '?'
        alt: A repeating pattern of red and blue; red comes next.
      check:
        prompt: What comes next? star, moon, star, moon, ___
        options:
        - star
        - moon
        - sun
        answer: star
        why: '''star, moon'' repeats, so star comes next.'
      ways:
      - style: step_by_step
        teach: 'Make a bead pattern. Step 1: Choose two colours, green and orange. Step 2: Put green, then orange. Step 3: Repeat: green, orange, green, orange. Step 4: Ask a friend what comes next.'
      - style: real_world
        teach: Many saris and dupattas have borders with a pattern of flowers and leaves that repeats all the way along the edge.
    - teach: 'Some patterns repeat 3 things: circle, circle, square, circle, circle, square. Count how many things are in the repeating part.'
      check:
        prompt: In 'big, small, small, big, small, small', how many things repeat?
        options:
        - '3'
        - '2'
        - '6'
        answer: '3'
        why: '''big, small, small'' repeats.'
      ways:
      - style: visual
        teach: A pattern where the repeating part has 3 things.
        picture:
          kind: flow
          steps:
          - ⭐
          - ⭐
          - 🌙
          - ⭐
          - ⭐
          - 🌙
          - '?'
          alt: The pattern goes star, star, moon, star, star, moon. The repeating part is star, star, moon, which has 3 things. So the next one is a star.
      - style: step_by_step
        teach: 'Find how many are in the repeating part. Step 1: Read the pattern: clap, clap, stamp, clap, clap, stamp. Step 2: Find where it starts again: after ''stamp''. Step 3: Count the part before it: clap, clap, stamp. Step 4: There are 3 things in the repeat.'
    - teach: 'Number patterns also have a rule: 2, 4, 6, 8 adds 2 each time. 5, 10, 15 adds 5.'
      check:
        prompt: What comes next? 10, 20, 30, ___
        options:
        - '40'
        - '31'
        - '35'
        answer: '40'
        why: Each number adds 10.
      ways:
      - style: visual
        teach: A number pattern that adds 3 each time on a line.
        picture:
          kind: number_line
          from: 0
          to: 15
          step: 1
          jumps:
          - from: 3
            to: 6
            label: '+3'
          - from: 6
            to: 9
            label: '+3'
          - from: 9
            to: 12
            label: '+3'
          alt: The pattern 3, 6, 9, 12 jumps by 3 each time on the number line. The rule is add 3.
      - style: real_world
        teach: 'On a staircase, each step is one step higher than the one before. If each step is 10 cm high, the heights go 10, 20, 30, 40: a pattern that adds 10.'
  items:
  - prompt: Red, yellow, red, yellow, ___ ?
    options:
    - red
    - yellow
    - blue
    - green
    answer: red
    difficulty: 1
    hints:
    - Two colours repeat.
    - After yellow comes ...
    solution: The pattern red, yellow repeats, so red comes next.
    mistakes: {"yellow": "m5_alternate"}
  - prompt: ○ □ ○ □ ○ ___ ?
    options:
    - □
    - ○
    - △
    - ☆
    answer: □
    difficulty: 1
    hints:
    - Circle, square, ...
    - Repeat.
    solution: After circle comes square.
    mistakes: {"○": "m5_alternate"}
  - prompt: A, B, A, B, A, ___ ?
    options:
    - B
    - A
    - C
    - D
    answer: B
    difficulty: 1
    hints:
    - Two letters repeat.
    - A then B.
    solution: B comes next.
    mistakes: {"A": "m5_alternate"}
  - prompt: Big, small, small, big, small, small, ___ ?
    options:
    - big
    - small
    - medium
    answer: big
    difficulty: 2
    hints:
    - The part that repeats has 3 things.
    - big, small, small.
    solution: The repeating part is big, small, small, so big comes next.
    mistakes: {"small": "m4_core"}
  - prompt: In the pattern 2, 4, 6, 8, what comes next?
    answer: '10'
    check: 8 + 2
    difficulty: 2
    hints:
    - Add 2 each time.
    - 8 + 2.
    solution: 8 + 2 = 10.
    mistakes:
      '9': c2_count_once
  - prompt: A garland repeats 1 red, 2 yellow flowers. How many yellow in 3 repeats?
    answer: '6'
    check: 3*2
    difficulty: 2
    hints:
    - 2 yellow each time.
    - 2 + 2 + 2.
    solution: 2 + 2 + 2 = 6.
    mistakes:
      '3': c2_count_once
  - prompt: What comes next? 🌼 🌸 🌸 🌼 🌸 🌸 ___
    options:
    - 🌼
    - 🌸
    - 🍃
    answer: 🌼
    difficulty: 1
    hints:
    - Find the part that repeats.
    - One 🌼 then two 🌸.
    solution: 'Step 1: The part is 🌼 🌸 🌸. Step 2: It starts again with 🌼.'
    mistakes:
      🌸: c2m6_core
      🍃: c2m6_core
  - prompt: What comes next? 1, 3, 5, 7, ___
    answer: '9'
    check: 7+2
    difficulty: 2
    hints:
    - How much does it jump?
    - Add 2.
    solution: 'Step 1: Rule: add 2. Step 2: 7 + 2 = 9.'
    mistakes:
      '8': c2m6_core
      '10': c2m6_core
  - prompt: What comes next? X, O, O, X, O, O, ___
    options:
    - X
    - O
    - Y
    answer: X
    difficulty: 1
    hints:
    - Find the repeating part.
    - X then two O.
    solution: 'Step 1: Part: X, O, O. Step 2: Starts again with X.'
    mistakes:
      O: c2m6_core
      Y: c2m6_core
  - prompt: A garland repeats 2 red, 1 white flower. How many red flowers in 4 repeats?
    answer: '8'
    check: 2*4
    difficulty: 2
    hints:
    - Each repeat has 2 red.
    - 2, 4, 6, 8.
    solution: 'Step 1: 2 red × 4 repeats. Step 2: = 8.'
    mistakes:
      '4': c2m6_core
      '12': c2m6_core
  - prompt: What comes next? 5, 10, 15, 20, ___
    answer: '25'
    check: 20+5
    difficulty: 1
    hints:
    - Each jump is 5.
    - 20 + 5.
    solution: 'Step 1: Rule: add 5. Step 2: 25.'
    mistakes:
      '21': c2m6_core
      '30': c2m6_core
  - prompt: What comes next? 20, 18, 16, 14, ___
    answer: '12'
    check: 14-2
    difficulty: 2
    hints:
    - It is going down.
    - By how much each time?
    solution: 'Step 1: Rule: take away 2. Step 2: 14 − 2 = 12.'
    mistakes:
      '13': c2m6_core
      '16': c2m6_core
  - prompt: In the pattern A, B, C, A, B, C, what comes 7th?
    options:
    - A
    - B
    - C
    answer: A
    difficulty: 3
    hints:
    - The repeating part has 3 letters.
    - 6 letters make 2 repeats; the 7th starts again.
    solution: 'Step 1: Letters 1-6 are two repeats. Step 2: The 7th is A.'
    mistakes:
      B: c2m6_core
      C: c2m6_core
  - prompt: 'Rangoli dots: 1 dot, 2 dots, 3 dots, ___'
    options:
    - 4 dots
    - 3 dots
    - 1 dot
    answer: 4 dots
    difficulty: 1
    hints:
    - It grows each time.
    - By how many?
    solution: 'Step 1: Each step adds 1 dot. Step 2: 4 dots.'
    mistakes:
      3 dots: c2m6_core
      1 dot: c2m6_core
  - prompt: What comes next? ▲ ▲ ● ▲ ▲ ● ▲ ___
    options:
    - ▲
    - ●
    - ■
    answer: ▲
    difficulty: 2
    hints:
    - The part is ▲ ▲ ●.
    - After one ▲ comes ...
    solution: 'Step 1: The repeat is ▲ ▲ ●. Step 2: After the first ▲ comes another ▲.'
    mistakes:
      ●: c2m6_core
      ■: c2m6_core
  - prompt: 'Case: Children are making a paper chain for Diwali: red, red, gold, red, red, gold. One child adds gold next. Another says it should be red. Who is right?'
    options:
    - "Red, because the repeating part is red, red, gold"
    - "Gold, because gold was the colour that came last"
    - "Either colour is fine, because both are in the chain"
    answer: Red, because the repeating part is red, red, gold
    hints:
    - What is the part that repeats?
    - Where does the repeating part start again?
    solution: The repeating part is red, red, gold. After gold, the part starts again with red.
    mistakes:
      "Gold, because gold was the colour that came last": c2m6_core
      "Either colour is fine, because both are in the chain": c2m6_core
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are numbering the steps of a rangoli design: 4, 8, 12, 16. What should the next number be?'
    options:
    - '20'
    - '17'
    - '18'
    answer: '20'
    hints:
    - How much does each number go up by?
    - Add the same amount to 16.
    solution: 'The numbers go up by 4 each time: 4, 8, 12, 16. 16 + 4 = 20.'
    mistakes:
      '17': c2m6_core
      '18': c2m6_core
    exam: competency
    difficulty: 2
- code: cbse2m.deco.count
  title: Counting decorations
  after:
  - cbse2m.deco.pattern
  notes: |
    Counting lamps, flowers and balloons for a festival; making equal rows; adding small numbers; how many more are
    needed.
  explanations:
    text: 'To decorate for a festival we count: lamps in a row, balloons on a door. We add rows together and find how many more we need.'
    visual: 'Draw 2 rows of 5 diyas each, and count them: 5, 10.'
    step_by_step: 'Step 1: Count one row. Step 2: Count the rows. Step 3: Add the rows together.'
    real_world: At Diwali families light rows of diyas; at Christmas they hang stars.
  picture:
    kind: bars
    bars:
    - label: row 1
      value: 5
    - label: row 2
      value: 5
    - label: together
      value: 10
    alt: Two rows of 5 diyas each make 10 diyas together.
    unit: diyas
  activity:
    type: number_line
    min: 0
    max: 40
    step: 1
    start: 0
    prompt: Count the decorations.
    goals:
    - prompt: 3 rows of lamps, 5 lamps in each row
      target: 15
      mistakes:
      - when:
          v: 8
        say: 'That adds 3 and 5. Each row has 5: 5 + 5 + 5.'
      - when:
          v: 10
        say: That's two rows. There are three.
    - prompt: 2 doors, 10 balloons on each
      target: 20
      mistakes:
      - when:
          v: 12
        say: 'That adds 2 and 10. Each door has 10: 10 + 10.'
    - prompt: 4 strings of 6 flowers
      target: 24
      mistakes:
      - when:
          v: 10
        say: 'That adds 4 and 6. Add 6 four times: 6, 12, 18, 24.'
      - when:
          v: 18
        say: That's three strings. Add one more 6.
  lesson:
    - teach: 'For a festival we count decorations. Things in equal rows are easy to count: 3 rows of 4 diyas = 4, 8, 12.'
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: '1'
        - size: 1
          label: '2'
        - size: 1
          label: '3'
        - size: 1
          label: '4'
        rows:
        - size: 1
          label: row 1
        - size: 1
          label: row 2
        - size: 1
          label: row 3
        cells:
        - - diya
          - diya
          - diya
          - diya
        - - diya
          - diya
          - diya
          - diya
        - - diya
          - diya
          - diya
          - diya
        alt: '3 rows of 4 diyas: 12 in all.'
      check:
        prompt: 2 rows of 3 balloons. How many balloons?
        options:
        - '6'
        - '5'
        - '9'
        answer: '6'
        why: 3 + 3 = 6.
      ways:
      - style: step_by_step
        teach: 'Count lamps in equal rows. Step 1: Count the lamps in one row: 5. Step 2: Count the rows: 4. Step 3: Skip count by 5, once for each row: 5, 10, 15, 20. Step 4: There are 20 lamps.'
      - style: real_world
        teach: At a wedding, chairs are often set out in equal rows. The caterer counts the chairs in one row and the number of rows to know how many guests can sit.
    - teach: 'Adding: put together. 7 flowers and 5 more: count on from 7: 8, 9, 10, 11, 12.'
      check:
        prompt: 8 lamps and 3 more. How many?
        options:
        - '11'
        - '10'
        - '5'
        answer: '11'
        why: 'Count on: 9, 10, 11.'
      ways:
      - style: visual
        teach: Adding by counting on from the bigger number.
        picture:
          kind: number_line
          from: 6
          to: 14
          step: 1
          jumps:
          - from: 8
            to: 9
            label: '+1'
          - from: 9
            to: 10
            label: '+1'
          - from: 10
            to: 11
            label: '+1'
          - from: 11
            to: 12
            label: '+1'
          - from: 12
            to: 13
            label: '+1'
          alt: 'To add 8 and 5, start at 8 and count on 5 jumps: 9, 10, 11, 12, 13. So 8 + 5 = 13.'
      - style: real_world
        teach: 'If you have 8 stickers and a friend gives you 5, you do not need to count all 13 from 1. Hold 8 in your head and count on: 9, 10, 11, 12, 13.'
    - teach: 'How many more are needed? Count up from what you have to what you need. Have 6, need 10: 7, 8, 9, 10 is 4 more.'
      check:
        prompt: We need 10 stars. We have 7. How many more?
        options:
        - '3'
        - '17'
        - '7'
        answer: '3'
        why: '8, 9, 10: three more.'
      ways:
      - style: visual
        teach: 'How many more are needed: count up from what you have.'
        picture:
          kind: number_line
          from: 10
          to: 20
          step: 1
          jumps:
          - from: 13
            to: 14
            label: '1'
          - from: 14
            to: 15
            label: '2'
          - from: 15
            to: 16
            label: '3'
          - from: 16
            to: 17
            label: '4'
          - from: 17
            to: 18
            label: '5'
          alt: 'You have 13 and need 18. Count up from 13: 14, 15, 16, 17, 18. That is 5 more.'
      - style: step_by_step
        teach: 'Find how many more you need. Step 1: Say the number you have: 13 balloons. Step 2: Say the number you need: 18. Step 3: Count up from 13 to 18, putting up a finger each time. Step 4: 5 fingers are up, so you need 5 more.'
  items:
  - prompt: 2 rows of 5 diyas. How many diyas?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - 5 + 5.
    - Count in fives.
    solution: 5 + 5 = 10.
    mistakes:
      '7': c2_count_once
  - prompt: Meena has 6 balloons and gets 4 more. How many?
    answer: '10'
    check: 6 + 4
    difficulty: 1
    hints:
    - Count on from 6.
    - 7, 8, 9, 10.
    solution: 6 + 4 = 10.
    mistakes:
      '2': c2_count_once
  - prompt: We need 12 flowers. We have 9. How many more?
    answer: '3'
    check: 12 - 9
    difficulty: 2
    hints:
    - Count up from 9 to 12.
    - 10, 11, 12.
    solution: 12 − 9 = 3.
    mistakes:
      '21': c2_count_once
  - prompt: 3 strings with 4 stars each. How many stars?
    answer: '12'
    check: 3*4
    difficulty: 2
    hints:
    - 4 + 4 + 4.
    - Count in fours.
    solution: 4 + 4 + 4 = 12.
    mistakes:
      '7': c2_count_once
  - prompt: 15 lamps, 5 go out. How many still burn?
    answer: '10'
    check: 15 - 5
    difficulty: 1
    hints:
    - Take away 5.
    - 15 − 5.
    solution: 15 − 5 = 10.
    mistakes:
      '20': c2_count_once
  - prompt: 'Which has more: 3 rows of 3 or 2 rows of 4?'
    options:
    - 3 rows of 3
    - 2 rows of 4
    - both the same
    answer: 3 rows of 3
    difficulty: 2
    hints:
    - "Work out both: how many in 3 rows of 3, and how many in 2 rows of 4?"
    - "Count 3 rows of 3, then 2 rows of 4. Which number is bigger?"
    solution: 9 is more than 8.
    mistakes: {"2 rows of 4": "m2_rows"}
  - prompt: 4 rows of 2 candles. How many candles?
    answer: '8'
    check: 4*2
    difficulty: 1
    hints:
    - 2 in each row.
    - 2, 4, 6, 8.
    solution: 'Step 1: 2 + 2 + 2 + 2. Step 2: = 8.'
    mistakes:
      '6': c2m6_rows
      '10': c2m6_rows
  - prompt: Ravi has 9 balloons and gets 6 more. How many?
    answer: '15'
    check: 9+6
    difficulty: 2
    hints:
    - Count on from 9.
    - 10, 11, 12, 13, 14, 15.
    solution: 'Step 1: 9 + 6. Step 2: = 15.'
    mistakes:
      '14': c2m6_add
      '3': c2m6_add
  - prompt: We need 15 flowers. We have 10. How many more?
    answer: '5'
    check: 15-10
    difficulty: 1
    hints:
    - Count up from 10 to 15.
    - 11, 12, 13, 14, 15.
    solution: 'Step 1: 15 − 10. Step 2: = 5.'
    mistakes:
      '25': c2m6_add
      '10': c2m6_add
  - prompt: 2 strings with 5 lights each. How many lights?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - 5 on each string.
    - 5 + 5.
    solution: 'Step 1: 5 + 5. Step 2: = 10.'
    mistakes:
      '7': c2m6_rows
      '15': c2m6_rows
  - prompt: 20 balloons. 6 burst. How many are left?
    answer: '14'
    check: 20-6
    difficulty: 2
    hints:
    - Burst balloons go away.
    - Count back 6 from 20.
    solution: 'Step 1: 20 − 6. Step 2: = 14.'
    mistakes:
      '26': c2m6_add
      '16': c2m6_add
  - prompt: 3 rows of 5 diyas. How many diyas?
    answer: '15'
    check: 3*5
    difficulty: 2
    hints:
    - 5 in each row.
    - 5, 10, 15.
    solution: 'Step 1: 5 + 5 + 5. Step 2: = 15.'
    mistakes:
      '8': c2m6_rows
      '10': c2m6_rows
  - prompt: 'Which has more: 2 rows of 6 or 3 rows of 3?'
    options:
    - 2 rows of 6
    - 3 rows of 3
    - both the same
    answer: 2 rows of 6
    difficulty: 3
    hints:
    - Work out each one.
    - 6 + 6 and 3 + 3 + 3.
    solution: 'Step 1: 2 rows of 6 = 12; 3 rows of 3 = 9. Step 2: 12 is more.'
    mistakes:
      3 rows of 3: c2m6_rows
      both the same: c2m6_rows
  - prompt: Meena made 7 paper stars and Ali made 8. How many stars in all?
    answer: '15'
    check: 7+8
    difficulty: 2
    hints:
    - Put them together.
    - 7 + 8.
    solution: 'Step 1: 7 + 8. Step 2: = 15.'
    mistakes:
      '14': c2m6_add
      '1': c2m6_add
  - prompt: 12 sweets go into 2 boxes equally. How many in each box?
    answer: '6'
    check: 12/2
    difficulty: 3
    hints:
    - Share one by one into 2 boxes.
    - What + itself = 12?
    solution: 'Step 1: 6 + 6 = 12. Step 2: 6 in each box.'
    mistakes:
      '10': c2m6_rows
      '24': c2m6_rows
  - prompt: 'Case: A class needs 20 paper flowers to decorate the door. They have made 14. A child says they need 34 more. What went wrong?'
    options:
    - "The child added instead of counting up; they need 6 more"
    - "Nothing is wrong; they really do need 34 more flowers"
    - "The child forgot to count; they need 14 more flowers"
    answer: The child added instead of counting up; they need 6 more
    hints:
    - Do they need more than 20 flowers in all?
    - Count up from 14 to 20.
    solution: 'They need 20 in all and have 14. Count up from 14: 15, 16, 17, 18, 19, 20. That is 6 more.'
    mistakes:
      "Nothing is wrong; they really do need 34 more flowers": c2m6_add
      "The child forgot to count; they need 14 more flowers": c2m6_add
    exam: case
    difficulty: 2
  - prompt: 'Situation: You put candles on a cake in 3 equal rows with 6 candles in each row. How many candles are there?'
    options:
    - '18'
    - '9'
    - '12'
    answer: '18'
    hints:
    - How many in one row?
    - Count that many again for each row.
    solution: '6 candles in each of 3 rows: 6, 12, 18. There are 18 candles.'
    mistakes:
      '9': c2m6_rows
      '12': c2m6_rows
    exam: competency
    difficulty: 2
