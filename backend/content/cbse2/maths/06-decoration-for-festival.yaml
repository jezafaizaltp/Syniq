# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 6
title: Decoration for Festival
concepts:
- code: cbse2m.deco.pattern
  title: Patterns with shapes and colours
  notes: |
    Patterns repeat: red-blue-red-blue; circle-square-circle-square; bead patterns on a garland, rangoli designs.
    Finding what comes next and what part repeats.
  explanations:
    text: 'A pattern repeats again and again. On a festival garland: red, yellow, red, yellow. Find the part that repeats, then you know what comes next.'
    visual: 'Draw a garland of flowers: red, yellow, red, yellow, red, and ask what comes next.'
    step_by_step: 'Step 1: Find the part that repeats. Step 2: Say it aloud a few times. Step 3: Continue the pattern.'
    real_world: Rangoli and mango-leaf toran at Diwali or Onam use repeating patterns.
  picture:
    kind: flow
    steps:
    - red
    - yellow
    - red
    - yellow
    - '?'
    alt: 'A garland pattern: red, yellow, red, yellow, and next comes red.'
  activity:
    type: sort
    prompt: What comes next on the garland?
    bins:
    - 🔺
    - ⚪
    - 🟥
    items:
    - label: 🔺⚪🔺⚪🔺 ...
      bin: ⚪
      clue: They take turns.
      why: Triangle, circle, triangle, circle. Next is a circle.
    - label: 🟥🟥⚪🟥🟥 ...
      bin: ⚪
      clue: Two of one, then one of another.
      why: Square, square, circle. Next is a circle.
    - label: 🔺⚪🟥🔺⚪ ...
      bin: 🟥
      clue: The part that repeats has three shapes.
      why: Triangle, circle, square. Next is a square.
    - label: ⚪🔺🔺⚪🔺🔺⚪ ...
      bin: 🔺
      clue: One, then two of another.
      why: Circle, triangle, triangle. Next a triangle.
    - label: 🟥⚪⚪🟥⚪⚪ ...
      bin: 🟥
      clue: Where does it start again?
      why: Square, circle, circle. It starts again with a square.
  items:
  - prompt: Red, yellow, red, yellow, ___ ?
    options:
    - red
    - yellow
    - blue
    - green
    answer: red
    difficulty: 1
    hints:
    - Two colours repeat.
    - After yellow comes ...
    solution: The pattern red, yellow repeats, so red comes next.
  - prompt: ○ □ ○ □ ○ ___ ?
    options:
    - □
    - ○
    - △
    - ☆
    answer: □
    difficulty: 1
    hints:
    - Circle, square, ...
    - Repeat.
    solution: After circle comes square.
  - prompt: A, B, A, B, A, ___ ?
    options:
    - B
    - A
    - C
    - D
    answer: B
    difficulty: 1
    hints:
    - Two letters repeat.
    - A then B.
    solution: B comes next.
  - prompt: Big, small, small, big, small, small, ___ ?
    options:
    - big
    - small
    - medium
    answer: big
    difficulty: 2
    hints:
    - The part that repeats has 3 things.
    - big, small, small.
    solution: The repeating part is big, small, small, so big comes next.
  - prompt: In the pattern 2, 4, 6, 8, what comes next?
    answer: '10'
    check: 8 + 2
    difficulty: 2
    hints:
    - Add 2 each time.
    - 8 + 2.
    solution: 8 + 2 = 10.
    mistakes:
      '9': c2_count_once
  - prompt: A garland repeats 1 red, 2 yellow flowers. How many yellow in 3 repeats?
    answer: '6'
    check: 3*2
    difficulty: 2
    hints:
    - 2 yellow each time.
    - 2 + 2 + 2.
    solution: 2 + 2 + 2 = 6.
    mistakes:
      '3': c2_count_once
- code: cbse2m.deco.count
  title: Counting decorations
  after:
  - cbse2m.deco.pattern
  notes: |
    Counting lamps, flowers and balloons for a festival; making equal rows; adding small numbers; how many more are
    needed.
  explanations:
    text: 'To decorate for a festival we count: lamps in a row, balloons on a door. We add rows together and find how many more we need.'
    visual: 'Draw 2 rows of 5 diyas each, and count them: 5, 10.'
    step_by_step: 'Step 1: Count one row. Step 2: Count the rows. Step 3: Add the rows together.'
    real_world: At Diwali families light rows of diyas; at Christmas they hang stars.
  picture:
    kind: bars
    bars:
    - label: row 1
      value: 5
    - label: row 2
      value: 5
    - label: together
      value: 10
    alt: Two rows of 5 diyas each make 10 diyas together.
    unit: diyas
  activity:
    type: number_line
    min: 0
    max: 40
    step: 1
    start: 0
    prompt: Count the decorations.
    goals:
    - prompt: 3 rows of lamps, 5 lamps in each row
      target: 15
      mistakes:
      - when:
          v: 8
        say: 'That adds 3 and 5. Each row has 5: 5 + 5 + 5.'
      - when:
          v: 10
        say: That's two rows. There are three.
    - prompt: 2 doors, 10 balloons on each
      target: 20
      mistakes:
      - when:
          v: 12
        say: 'That adds 2 and 10. Each door has 10: 10 + 10.'
    - prompt: 4 strings of 6 flowers
      target: 24
      mistakes:
      - when:
          v: 10
        say: 'That adds 4 and 6. Add 6 four times: 6, 12, 18, 24.'
      - when:
          v: 18
        say: That's three strings. Add one more 6.
  items:
  - prompt: 2 rows of 5 diyas. How many diyas?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - 5 + 5.
    - Count in fives.
    solution: 5 + 5 = 10.
    mistakes:
      '7': c2_count_once
  - prompt: Meena has 6 balloons and gets 4 more. How many?
    answer: '10'
    check: 6 + 4
    difficulty: 1
    hints:
    - Count on from 6.
    - 7, 8, 9, 10.
    solution: 6 + 4 = 10.
    mistakes:
      '2': c2_count_once
  - prompt: We need 12 flowers. We have 9. How many more?
    answer: '3'
    check: 12 - 9
    difficulty: 2
    hints:
    - Count up from 9 to 12.
    - 10, 11, 12.
    solution: 12 − 9 = 3.
    mistakes:
      '21': c2_count_once
  - prompt: 3 strings with 4 stars each. How many stars?
    answer: '12'
    check: 3*4
    difficulty: 2
    hints:
    - 4 + 4 + 4.
    - Count in fours.
    solution: 4 + 4 + 4 = 12.
    mistakes:
      '7': c2_count_once
  - prompt: 15 lamps, 5 go out. How many still burn?
    answer: '10'
    check: 15 - 5
    difficulty: 1
    hints:
    - Take away 5.
    - 15 − 5.
    solution: 15 − 5 = 10.
    mistakes:
      '20': c2_count_once
  - prompt: 'Which has more: 3 rows of 3 or 2 rows of 4?'
    options:
    - 3 rows of 3
    - 2 rows of 4
    - both the same
    answer: 3 rows of 3
    difficulty: 2
    hints:
    - 3 rows of 3 = 9.
    - 2 rows of 4 = 8.
    solution: 9 is more than 8.
