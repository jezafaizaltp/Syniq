# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 10
title: Fun at the Fair
tips:
  m2_two_rides: "Two rides: pay 20 and then 20 again."
  c2m10_count: Lay the coins out and count on by each coin's value.
  c2m10_change: Start at the price and count up to the money you gave.
  c2m10_total: Add the prices together, tens first, then ones.

concepts:
- code: cbse2m.fair.coins
  title: Coins and notes
  notes: |
    Indian money: rupees; coins of 1, 2, 5, 10 and 20 rupees; notes of 10, 20, 50, 100. Making an amount with coins;
    counting money.
  explanations:
    text: We pay with rupees. Coins come as 1, 2, 5, 10 and 20 rupees, and notes as 10, 20, 50 and 100 rupees. We can make 10 rupees with two 5-rupee coins.
    visual: Draw a 10-rupee note and next to it two 5-rupee coins, with an equals sign between them.
    step_by_step: 'Step 1: Look at each coin or note. Step 2: Add the values. Step 3: Check the total.'
    real_world: At a fair a balloon may cost 10 rupees and a ride 20 rupees.
  picture:
    kind: bars
    bars:
    - label: ₹5
      value: 5
    - label: ₹10
      value: 10
    - label: ₹20
      value: 20
    - label: ₹50
      value: 50
    alt: 'Money values: a 5 rupee coin, a 10 rupee coin, a 20 rupee note and a 50 rupee note.'
    unit: rupees
  activity:
    type: sort
    prompt: How much money?
    bins:
    - 15 rupees
    - 50 rupees
    - 100 rupees
    items:
    - label: One ₹10 coin and one ₹5 coin
      bin: 15 rupees
      clue: 10 and 5 more.
      why: 10 + 5 = 15.
    - label: Two ₹20 notes and one ₹10 note
      bin: 50 rupees
      clue: Count 20, 40, then?
      why: 20 + 20 + 10 = 50.
    - label: One ₹50 note and two ₹20 notes and one ₹10 note
      bin: 100 rupees
      clue: Start at 50, then 70, 90 ...
      why: 50 + 20 + 20 + 10 = 100.
    - label: Three ₹5 coins
      bin: 15 rupees
      clue: Count in fives.
      why: 5, 10, 15.
    - label: Five ₹10 notes
      bin: 50 rupees
      clue: Count in tens.
      why: 10, 20, 30, 40, 50.
    - label: Two ₹50 notes
      bin: 100 rupees
      clue: 50 and 50 more.
      why: 50 + 50 = 100.
  lesson:
    - teach: We pay with rupees. There are coins of ₹1, ₹2, ₹5, ₹10 and ₹20, and notes of ₹10, ₹20, ₹50 and ₹100. The number on each tells how much it is worth.
      check:
        prompt: 'Which is worth more: a ₹5 coin or a ₹2 coin?'
        options:
        - ₹5 coin
        - ₹2 coin
        - they are the same
        answer: ₹5 coin
        why: 5 is more than 2.
      ways:
      - style: visual
        teach: Indian coins and notes, from the smallest value to the biggest.
        picture:
          kind: compare
          columns:
          - title: Coins
            points:
            - ₹1
            - ₹2
            - ₹5
            - ₹10
            - ₹20
          - title: Notes
            points:
            - ₹10
            - ₹20
            - ₹50
            - ₹100
          alt: Coins come as ₹1, ₹2, ₹5, ₹10 and ₹20. Notes come as ₹10, ₹20, ₹50 and ₹100.
      - style: real_world
        teach: A ₹10 coin and a ₹10 note look very different, but at a shop they buy exactly the same amount.
    - teach: 'To count money, count on by each coin''s value. Three ₹5 coins: 5, 10, 15. So ₹15.'
      picture:
        kind: number_line
        from: 0
        to: 20
        jumps:
        - from: 0
          to: 5
        - from: 5
          to: 10
        - from: 10
          to: 15
        alt: 'Three ₹5 coins: 5, 10, 15 rupees.'
      check:
        prompt: 'Two ₹10 notes make:'
        options:
        - ₹20
        - ₹12
        - ₹10
        answer: ₹20
        why: 10, 20.
      ways:
      - style: step_by_step
        teach: 'Count a ₹20 note, a ₹5 coin and two ₹2 coins. Step 1: Start with the biggest: 20. Step 2: Add the ₹5: 25. Step 3: Add the ₹2 coins: 27, 29. Step 4: There is ₹29.'
      - style: visual
        teach: 'Counting on by each coin''s value: four ₹2 coins.'
        picture:
          kind: number_line
          from: 0
          to: 10
          step: 1
          jumps:
          - from: 0
            to: 2
            label: ₹2
          - from: 2
            to: 4
            label: ₹2
          - from: 4
            to: 6
            label: ₹2
          - from: 6
            to: 8
            label: ₹2
          alt: 'Four ₹2 coins are four jumps of 2: 2, 4, 6, 8. So they make ₹8.'
    - teach: The same amount can be made in different ways. ₹10 = one ₹10 coin, or two ₹5 coins, or five ₹2 coins.
      check:
        prompt: How many ₹5 coins make ₹10?
        options:
        - '2'
        - '5'
        - '10'
        answer: '2'
        why: 5 + 5 = 10.
      ways:
      - style: visual
        teach: Three different ways to make the same amount, ₹20.
        picture:
          kind: compare
          columns:
          - title: Way 1
            points:
            - One ₹20 note
          - title: Way 2
            points:
            - Two ₹10 coins
          - title: Way 3
            points:
            - ₹10 + ₹5 + ₹5
          alt: ₹20 can be one ₹20 note, or two ₹10 coins, or one ₹10 coin and two ₹5 coins.
      - style: real_world
        teach: When a bus conductor has no ₹20 note to give you, they might give two ₹10 coins instead. It is the same money.
  items:
  - prompt: Two 5-rupee coins make how many rupees?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - 5 + 5.
    - Count in fives.
    solution: 5 + 5 = 10 rupees.
    mistakes:
      '2': c2_count_once
  - prompt: 'A 10-rupee note and a 2-rupee coin make:'
    answer: '12'
    check: 10 + 2
    difficulty: 1
    hints:
    - 10 + 2.
    - Add them.
    solution: 10 + 2 = 12 rupees.
    mistakes: {"8": "m3_add_money", "102": "m3_add_money"}
  - prompt: How many 10-rupee notes make 50 rupees?
    answer: '5'
    check: 50 // 10
    difficulty: 2
    hints:
    - 10, 20, 30, 40, 50.
    - Count the jumps.
    solution: 5 tens make 50.
    mistakes:
      '10': c2_count_once
  - prompt: 'Three 2-rupee coins make:'
    answer: '6'
    check: 3*2
    difficulty: 1
    hints:
    - 2 + 2 + 2.
    - Count in twos.
    solution: 2 + 2 + 2 = 6 rupees.
    mistakes:
      '5': c2_count_once
  - prompt: Which is the most money?
    options:
    - a 50-rupee note
    - a 20-rupee note
    - a 10-rupee coin
    - a 5-rupee coin
    answer: a 50-rupee note
    difficulty: 1
    hints:
    - Biggest number.
    - '50.'
    solution: 50 rupees is the most.
    mistakes: {"a 20-rupee note": "m1_most_coin"}
  - prompt: 'A 20-rupee note and a 5-rupee coin make:'
    answer: '25'
    check: 20 + 5
    difficulty: 2
    hints:
    - 20 + 5.
    - Add them.
    solution: 20 + 5 = 25 rupees.
    mistakes: {"15": "m3_add_money", "205": "m3_add_money"}
  - prompt: Four ₹5 coins make how many rupees?
    answer: '20'
    check: 5*4
    difficulty: 1
    hints:
    - Count on in 5s.
    - 5, 10, 15, 20.
    solution: 'Step 1: 5, 10, 15, 20. Step 2: ₹20.'
    mistakes:
      '9': c2m10_count
      '15': c2m10_count
  - prompt: A ₹50 note and a ₹10 note make how many rupees?
    answer: '60'
    check: 50+10
    difficulty: 1
    hints:
    - Start at 50.
    - Add 10.
    solution: 'Step 1: 50 + 10. Step 2: ₹60.'
    mistakes:
      '510': c2m10_count
      '40': c2m10_count
  - prompt: How many ₹2 coins make ₹10?
    answer: '5'
    check: 10/2
    difficulty: 2
    hints:
    - Count in 2s to 10.
    - 2, 4, 6, 8, 10.
    solution: 'Step 1: 2, 4, 6, 8, 10 is 5 coins. Step 2: 5.'
    mistakes:
      '2': c2m10_count
      '8': c2m10_count
  - prompt: Which makes ₹25?
    options:
    - ₹20 + ₹5
    - ₹10 + ₹10
    - ₹20 + ₹2
    answer: ₹20 + ₹5
    difficulty: 2
    hints:
    - Add each pair.
    - Which makes exactly 25?
    solution: 'Step 1: 20 + 5 = 25; 10 + 10 = 20; 20 + 2 = 22. Step 2: ₹20 + ₹5.'
    mistakes:
      ₹10 + ₹10: c2m10_count
      ₹20 + ₹2: c2m10_count
  - prompt: Three ₹10 notes and one ₹5 coin make how many rupees?
    answer: '35'
    check: 30+5
    difficulty: 2
    hints:
    - 'Notes: 10, 20, 30.'
    - Then add 5.
    solution: 'Step 1: 30 from notes. Step 2: 30 + 5 = ₹35.'
    mistakes:
      '8': c2m10_count
      '45': c2m10_count
  - prompt: Which is the least money?
    options:
    - a ₹1 coin
    - a ₹10 note
    - a ₹5 coin
    answer: a ₹1 coin
    difficulty: 1
    hints:
    - Look at the numbers.
    - Which is smallest?
    solution: 'Step 1: 1 < 5 < 10. Step 2: The ₹1 coin.'
    mistakes:
      a ₹10 note: c2m10_count
      a ₹5 coin: c2m10_count
  - prompt: How many ₹10 notes make ₹100?
    answer: '10'
    check: 100/10
    difficulty: 2
    hints:
    - Count in tens to 100.
    - 10, 20, 30, ...
    solution: 'Step 1: 10 jumps of 10 reach 100. Step 2: 10 notes.'
    mistakes:
      '1': c2m10_count
      '100': c2m10_count
  - prompt: Ravi has two ₹20 notes and two ₹2 coins. How much money?
    answer: '44'
    check: 40+4
    difficulty: 3
    hints:
    - 'Notes first: 20 + 20.'
    - 'Then coins: 2 + 2.'
    solution: 'Step 1: Notes = 40, coins = 4. Step 2: 40 + 4 = ₹44.'
    mistakes:
      '24': c2m10_count
      '42': c2m10_count
  - prompt: 'A ₹10 coin and a ₹10 note: which is worth more?'
    options:
    - they are worth the same
    - the coin
    - the note
    answer: they are worth the same
    difficulty: 3
    hints:
    - Look at the number on each.
    - Coin or note, what matters is the number.
    solution: 'Step 1: Both say 10. Step 2: Both are worth ₹10.'
    mistakes:
      the coin: c2m10_count
      the note: c2m10_count
  - prompt: 'Case: A child empties a piggy bank and finds one ₹10 note, three ₹5 coins and two ₹1 coins. The child says there is ₹6, because there are 6 things. How much is really there?'
    options:
    - ₹27
    - ₹6
    - ₹16
    answer: ₹27
    hints:
    - Is each coin worth just ₹1?
    - Count on by each coin's value, starting with the biggest.
    solution: 'Start with ₹10. Add three ₹5 coins: 15, 20, 25. Add two ₹1 coins: 26, 27. There is ₹27.'
    mistakes:
      ₹6: c2m10_count
      ₹16: c2m10_count
    exam: case
    difficulty: 2
  - prompt: 'Situation: You need to pay exactly ₹15 for a ride and have only ₹5 coins. How many coins do you give?'
    options:
    - '3'
    - '5'
    - '15'
    answer: '3'
    hints:
    - Count on in fives.
    - How many fives make 15?
    solution: 'Counting in fives: 5, 10, 15. That is 3 coins of ₹5.'
    mistakes:
      '5': c2m10_count
      '15': c2m10_count
    exam: competency
    difficulty: 2
- code: cbse2m.fair.buy
  title: Buying and change
  after:
  - cbse2m.fair.coins
  notes: |
    Buying things at a fair: adding prices, checking if we have enough, getting change back (simple subtraction).
  explanations:
    text: 'At the fair, add the prices of what you buy. If you pay more, the shopkeeper gives change: what you paid take away the price.'
    visual: Draw a balloon with a 10-rupee tag and a 20-rupee note being paid; draw the 10 rupees given back as change.
    step_by_step: 'Step 1: Add the prices. Step 2: See how much you pay. Step 3: Change = paid take away total.'
    real_world: When we pay 20 rupees for a 15-rupee toy, we get 5 rupees back.
  picture:
    kind: flow
    steps:
    - Price ₹15
    - Pay ₹20
    - ₹20 − ₹15
    - Change ₹5
    alt: The price is 15 rupees; you pay 20 rupees; 20 take away 15 gives 5 rupees change.
  activity:
    type: number_line
    min: 0
    max: 100
    step: 5
    start: 0
    prompt: Shop at the fair.
    goals:
    - prompt: A balloon ₹15 and a toffee ₹5. Total?
      target: 20
      mistakes:
      - when:
          v: 10
        say: 'That takes away. Buying both means add: 15 + 5.'
    - prompt: You pay ₹100 for a ₹45 kite. How much change?
      target: 55
      mistakes:
      - when:
          v: 45
        say: That's the price. Count up from 45 to 100.
      - when:
          v: 65
        say: 'Break a ten carefully: 100 − 45. Check: 45 + 55 = 100.'
    - prompt: You pay ₹50 for a ₹30 toy. How much change?
      target: 20
      hint: What you paid take away the price.
      mistakes:
      - when:
          v: 80
        say: 'Change is never more than you paid. Take away: 50 − 30.'
      - when:
          v: 30
        say: That's the price. Change is what comes back to you.
  lesson:
    - teach: 'At a fair, add prices to find the total. A balloon ₹10 and a whistle ₹5: 10 + 5 = ₹15.'
      check:
        prompt: A kite ₹20 and a top ₹10. Total?
        options:
        - ₹30
        - ₹10
        - ₹2010
        answer: ₹30
        why: 20 + 10 = 30.
      ways:
      - style: step_by_step
        teach: 'Find the total for a ₹20 kite and a ₹7 whistle. Step 1: Start at the bigger price, 20. Step 2: Count on 7: 21, 22, 23, 24, 25, 26, 27. Step 3: The total is ₹27.'
      - style: visual
        teach: 'Adding two prices by counting on along a line: a ₹13 ball and a ₹6 cap.'
        picture:
          kind: number_line
          from: 10
          to: 25
          step: 1
          jumps:
          - from: 13
            to: 19
            label: '+6'
          alt: 'Start at 13 for the ball. Jump on 6 more for the cap: 14, 15, 16, 17, 18, 19. Together they cost ₹19.'
    - teach: Check if you have enough. You need at least the price. With ₹15 you can buy a ₹12 toy, but not a ₹18 toy.
      check:
        prompt: You have ₹20. Can you buy a ₹25 car?
        options:
        - 'no'
        - 'yes'
        - only on Sundays
        answer: 'no'
        why: 20 is less than 25.
      ways:
      - style: visual
        teach: Do you have enough money? Compare what you have with the price.
        picture:
          kind: compare
          columns:
          - title: You have ₹25
            points:
            - 'Toy for ₹22: yes'
            - 'Toy for ₹25: yes'
          - title: Not enough
            points:
            - 'Toy for ₹28: no'
            - 'Toy for ₹30: no'
          alt: With ₹25 you can buy a toy for ₹22 or ₹25, but not a toy for ₹28 or ₹30, because those cost more than you have.
      - style: real_world
        teach: Before going to a stall, a child counts their coins. If the toy costs more than the coins, they choose a cheaper toy or save for next time.
    - teach: 'If you pay more than the price, you get change. Change = money paid − price. Pay ₹20 for a ₹16 toy: count up 17, 18, 19, 20 = ₹4 change.'
      picture:
        kind: number_line
        from: 15
        to: 20
        jumps:
        - from: 16
          to: 20
        alt: Counting up from 16 to 20 gives ₹4 change.
      check:
        prompt: Pay ₹10 for a ₹7 ice-cream. Change?
        options:
        - ₹3
        - ₹17
        - ₹7
        answer: ₹3
        why: '8, 9, 10: three rupees.'
      ways:
      - style: step_by_step
        teach: 'Find the change from ₹50 for a ₹46 toy. Step 1: Start at the price, 46. Step 2: Count up to 50: 47, 48, 49, 50. Step 3: You counted 4 steps. Step 4: The change is ₹4.'
      - style: real_world
        teach: Shopkeepers often count the change into your hand while saying the numbers out loud, starting from the price and stopping at the money you gave.
  items:
  - prompt: A balloon costs 10 rupees and a whistle 5 rupees. Total?
    answer: '15'
    check: 10 + 5
    difficulty: 1
    hints:
    - Add the prices.
    - 10 + 5.
    solution: 10 + 5 = 15 rupees.
    mistakes: {"5": "m3_add_money", "105": "m3_add_money"}
  - prompt: You pay 20 rupees for a 15-rupee toy. Change?
    answer: '5'
    check: 20 - 15
    difficulty: 2
    hints:
    - 20 − 15.
    - Count up from 15 to 20.
    solution: 20 − 15 = 5 rupees.
    mistakes:
      '35': c2_count_once
  - prompt: 'A ride costs 20 rupees. Two rides cost:'
    answer: '40'
    check: 2*20
    difficulty: 1
    hints:
    - 20 + 20.
    - Two tens twice.
    solution: 20 + 20 = 40 rupees.
    mistakes: {"20": "m2_two_rides", "22": "m2_two_rides"}
  - prompt: You have 50 rupees and spend 30. How much is left?
    answer: '20'
    check: 50 - 30
    difficulty: 1
    hints:
    - 50 − 30.
    - 5 tens take away 3 tens.
    solution: 50 − 30 = 20 rupees.
    mistakes:
      '80': c2_count_once
  - prompt: You have 10 rupees. Can you buy a 12-rupee toy?
    options:
    - no, 10 is less than 12
    - yes, 10 is more than 12
    - yes, they are the same
    answer: no, 10 is less than 12
    difficulty: 1
    hints:
    - Is 10 enough for 12?
    - 10 is less than 12.
    solution: 10 is less than 12, so no.
    mistakes: {"yes, 10 is more than 12": "m1_enough_money"}
  - prompt: A doll costs 25 rupees. You pay 30. Change?
    answer: '5'
    check: 30 - 25
    difficulty: 2
    hints:
    - 30 − 25.
    - Count up from 25 to 30.
    solution: 30 − 25 = 5 rupees.
    mistakes:
      '55': c2_count_once
  - prompt: A toy car costs ₹15 and a ball ₹10. Total in rupees?
    answer: '25'
    check: 15+10
    difficulty: 1
    hints:
    - Add the prices.
    - 15 + 10.
    solution: 'Step 1: 15 + 10. Step 2: ₹25.'
    mistakes:
      '5': c2m10_total
      '1510': c2m10_total
  - prompt: You pay ₹50 for a ₹40 cap. Change in rupees?
    answer: '10'
    check: 50-40
    difficulty: 1
    hints:
    - Count up from 40 to 50.
    - 50 − 40.
    solution: 'Step 1: 50 − 40. Step 2: ₹10.'
    mistakes:
      '90': c2m10_change
      '40': c2m10_change
  - prompt: Three rides cost ₹10 each. How much in all?
    answer: '30'
    check: 10*3
    difficulty: 1
    hints:
    - ₹10 three times.
    - 10, 20, 30.
    solution: 'Step 1: 10 + 10 + 10. Step 2: ₹30.'
    mistakes:
      '13': c2m10_total
      '20': c2m10_total
  - prompt: You have ₹30. Can you buy a doll for ₹25?
    options:
    - yes, 30 is more than 25
    - no, 30 is less than 25
    - only with a note
    answer: yes, 30 is more than 25
    difficulty: 1
    hints:
    - Compare 30 and 25.
    - Do you have enough?
    solution: 'Step 1: 30 > 25. Step 2: Yes, you can.'
    mistakes:
      no, 30 is less than 25: c2m10_total
      only with a note: c2m10_total
  - prompt: You pay ₹20 for a ₹13 game. Change in rupees?
    answer: '7'
    check: 20-13
    difficulty: 2
    hints:
    - Count up from 13 to 20.
    - 14, 15, ... 20.
    solution: 'Step 1: 13 to 20 is 7. Step 2: ₹7.'
    mistakes:
      '33': c2m10_change
      '13': c2m10_change
  - prompt: You have ₹40 and spend ₹15. How much is left?
    answer: '25'
    check: 40-15
    difficulty: 2
    hints:
    - Take away what you spend.
    - 40 − 15.
    solution: 'Step 1: 40 − 15. Step 2: ₹25.'
    mistakes:
      '55': c2m10_change
      '35': c2m10_change
  - prompt: A whistle ₹5, a balloon ₹10, a cap ₹20. Total for all three?
    answer: '35'
    check: 5+10+20
    difficulty: 2
    hints:
    - Add two, then the third.
    - 5 + 10 = 15.
    solution: 'Step 1: 5 + 10 = 15. Step 2: 15 + 20 = ₹35.'
    mistakes:
      '30': c2m10_total
      '25': c2m10_total
  - prompt: You have ₹50. You buy two toys of ₹20 each. How much is left?
    answer: '10'
    check: 50-20*2
    difficulty: 3
    hints:
    - First find the cost of two toys.
    - Then take it from 50.
    solution: 'Step 1: 20 + 20 = 40. Step 2: 50 − 40 = ₹10.'
    mistakes:
      '30': c2m10_total
      '40': c2m10_change
  - prompt: Which toy can you buy with ₹12?
    options:
    - a ₹10 whistle
    - a ₹15 kite
    - a ₹20 car
    answer: a ₹10 whistle
    difficulty: 2
    hints:
    - You need the price to be 12 or less.
    - Compare each price with 12.
    solution: 'Step 1: 15 and 20 are more than 12. Step 2: The ₹10 whistle.'
    mistakes:
      a ₹15 kite: c2m10_total
      a ₹20 car: c2m10_total
  - prompt: 'Case: At the fair, a child pays ₹20 for a ₹14 snack. The stall keeper gives back ₹4. The child counts up: 15, 16, 17, 18, 19, 20. What should the child say?'
    options:
    - "Politely say the change should be ₹6"
    - "Say nothing and walk away quietly"
    - "Ask for ₹14 back from the stall"
    answer: Politely say the change should be ₹6
    hints:
    - How many steps from 14 to 20?
    - Is ₹4 the right change?
    solution: Counting up from 14 to 20 is 6 steps, so the change should be ₹6, not ₹4.
