# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 10
title: Fun at the Fair
concepts:
- code: cbse2m.fair.coins
  title: Coins and notes
  notes: |
    Indian money: rupees; coins of 1, 2, 5, 10 and 20 rupees; notes of 10, 20, 50, 100. Making an amount with coins;
    counting money.
  explanations:
    text: We pay with rupees. Coins come as 1, 2, 5, 10 and 20 rupees, and notes as 10, 20, 50 and 100 rupees. We can make 10 rupees with two 5-rupee coins.
    visual: Draw a 10-rupee note and next to it two 5-rupee coins, with an equals sign between them.
    step_by_step: 'Step 1: Look at each coin or note. Step 2: Add the values. Step 3: Check the total.'
    real_world: At a fair a balloon may cost 10 rupees and a ride 20 rupees.
  picture:
    kind: bars
    bars:
    - label: ₹5
      value: 5
    - label: ₹10
      value: 10
    - label: ₹20
      value: 20
    - label: ₹50
      value: 50
    alt: 'Money values: a 5 rupee coin, a 10 rupee coin, a 20 rupee note and a 50 rupee note.'
    unit: rupees
  activity:
    type: sort
    prompt: How much money?
    bins:
    - 15 rupees
    - 50 rupees
    - 100 rupees
    items:
    - label: One ₹10 coin and one ₹5 coin
      bin: 15 rupees
      clue: 10 and 5 more.
      why: 10 + 5 = 15.
    - label: Two ₹20 notes and one ₹10 note
      bin: 50 rupees
      clue: Count 20, 40, then?
      why: 20 + 20 + 10 = 50.
    - label: One ₹50 note and two ₹20 notes and one ₹10 note
      bin: 100 rupees
      clue: Start at 50, then 70, 90 ...
      why: 50 + 20 + 20 + 10 = 100.
    - label: Three ₹5 coins
      bin: 15 rupees
      clue: Count in fives.
      why: 5, 10, 15.
    - label: Five ₹10 notes
      bin: 50 rupees
      clue: Count in tens.
      why: 10, 20, 30, 40, 50.
    - label: Two ₹50 notes
      bin: 100 rupees
      clue: 50 and 50 more.
      why: 50 + 50 = 100.
  items:
  - prompt: Two 5-rupee coins make how many rupees?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - 5 + 5.
    - Count in fives.
    solution: 5 + 5 = 10 rupees.
    mistakes:
      '2': c2_count_once
  - prompt: 'A 10-rupee note and a 2-rupee coin make:'
    answer: '12'
    check: 10 + 2
    difficulty: 1
    hints:
    - 10 + 2.
    - Add them.
    solution: 10 + 2 = 12 rupees.
  - prompt: How many 10-rupee notes make 50 rupees?
    answer: '5'
    check: 50 // 10
    difficulty: 2
    hints:
    - 10, 20, 30, 40, 50.
    - Count the jumps.
    solution: 5 tens make 50.
    mistakes:
      '10': c2_count_once
  - prompt: 'Three 2-rupee coins make:'
    answer: '6'
    check: 3*2
    difficulty: 1
    hints:
    - 2 + 2 + 2.
    - Count in twos.
    solution: 2 + 2 + 2 = 6 rupees.
    mistakes:
      '5': c2_count_once
  - prompt: Which is the most money?
    options:
    - a 50-rupee note
    - a 20-rupee note
    - a 10-rupee coin
    - a 5-rupee coin
    answer: a 50-rupee note
    difficulty: 1
    hints:
    - Biggest number.
    - '50.'
    solution: 50 rupees is the most.
  - prompt: 'A 20-rupee note and a 5-rupee coin make:'
    answer: '25'
    check: 20 + 5
    difficulty: 2
    hints:
    - 20 + 5.
    - Add them.
    solution: 20 + 5 = 25 rupees.
- code: cbse2m.fair.buy
  title: Buying and change
  after:
  - cbse2m.fair.coins
  notes: |
    Buying things at a fair: adding prices, checking if we have enough, getting change back (simple subtraction).
  explanations:
    text: 'At the fair, add the prices of what you buy. If you pay more, the shopkeeper gives change: what you paid take away the price.'
    visual: Draw a balloon with a 10-rupee tag and a 20-rupee note being paid; draw the 10 rupees given back as change.
    step_by_step: 'Step 1: Add the prices. Step 2: See how much you pay. Step 3: Change = paid take away total.'
    real_world: When we pay 20 rupees for a 15-rupee toy, we get 5 rupees back.
  picture:
    kind: flow
    steps:
    - Price ₹15
    - Pay ₹20
    - ₹20 − ₹15
    - Change ₹5
    alt: The price is 15 rupees; you pay 20 rupees; 20 take away 15 gives 5 rupees change.
  activity:
    type: number_line
    min: 0
    max: 100
    step: 5
    start: 0
    prompt: Shop at the fair.
    goals:
    - prompt: A balloon ₹15 and a toffee ₹5. Total?
      target: 20
      mistakes:
      - when:
          v: 10
        say: 'That takes away. Buying both means add: 15 + 5.'
    - prompt: You pay ₹100 for a ₹45 kite. How much change?
      target: 55
      mistakes:
      - when:
          v: 45
        say: That's the price. Count up from 45 to 100.
      - when:
          v: 65
        say: 'Break a ten carefully: 100 − 45. Check: 45 + 55 = 100.'
    - prompt: You pay ₹50 for a ₹30 toy. How much change?
      target: 20
      hint: What you paid take away the price.
      mistakes:
      - when:
          v: 80
        say: 'Change is never more than you paid. Take away: 50 − 30.'
      - when:
          v: 30
        say: That's the price. Change is what comes back to you.
  items:
  - prompt: A balloon costs 10 rupees and a whistle 5 rupees. Total?
    answer: '15'
    check: 10 + 5
    difficulty: 1
    hints:
    - Add the prices.
    - 10 + 5.
    solution: 10 + 5 = 15 rupees.
  - prompt: You pay 20 rupees for a 15-rupee toy. Change?
    answer: '5'
    check: 20 - 15
    difficulty: 2
    hints:
    - 20 − 15.
    - Count up from 15 to 20.
    solution: 20 − 15 = 5 rupees.
    mistakes:
      '35': c2_count_once
  - prompt: 'A ride costs 20 rupees. Two rides cost:'
    answer: '40'
    check: 2*20
    difficulty: 1
    hints:
    - 20 + 20.
    - Two tens twice.
    solution: 20 + 20 = 40 rupees.
  - prompt: You have 50 rupees and spend 30. How much is left?
    answer: '20'
    check: 50 - 30
    difficulty: 1
    hints:
    - 50 − 30.
    - 5 tens take away 3 tens.
    solution: 50 − 30 = 20 rupees.
    mistakes:
      '80': c2_count_once
  - prompt: You have 10 rupees. Can you buy a 12-rupee toy?
    options:
    - no, 10 is less than 12
    - yes, 10 is more than 12
    - yes, they are the same
    answer: no, 10 is less than 12
    difficulty: 1
    hints:
    - Is 10 enough for 12?
    - 10 is less than 12.
    solution: 10 is less than 12, so no.
  - prompt: A doll costs 25 rupees. You pay 30. Change?
    answer: '5'
    check: 30 - 25
    difficulty: 2
    hints:
    - 30 − 25.
    - Count up from 25 to 30.
    solution: 30 − 25 = 5 rupees.
    mistakes:
      '55': c2_count_once
