# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 5
title: Playing with Lines
concepts:
- code: cbse2m.lines.kinds
  title: Straight and curved lines
  notes: |
    Kinds of lines: straight (standing = vertical, sleeping = horizontal, slanting) and curved. Finding them in letters,
    things and pictures. Drawing with a ruler.
  explanations:
    text: Lines can be straight or curved. A straight line can stand up, lie down or slant. A curved line bends, like a rainbow.
    visual: Draw a standing line, a sleeping line, a slanting line and a curved line side by side.
    step_by_step: 'Step 1: Does it bend? If yes, it is curved. Step 2: If straight, is it standing, sleeping or slanting?'
    real_world: Railway tracks are straight lines; a rainbow is a curve.
  picture:
    kind: compare
    columns:
    - title: Straight
      points:
      - standing |
      - sleeping —
      - slanting /
    - title: Curved
      points:
      - rainbow
      - letter C
      - snake
    alt: Straight lines can stand, sleep or slant; curved lines bend, like a rainbow, the letter C or a snake.
  items:
  - prompt: A rainbow is a ___ line.
    options:
    - curved
    - straight
    - standing
    answer: curved
    difficulty: 1
    hints:
    - It bends.
    - Like an arch.
    solution: A rainbow is curved.
  - prompt: 'The letter L is made of:'
    options:
    - straight lines
    - curved lines
    - dots
    answer: straight lines
    difficulty: 1
    hints:
    - No bends.
    - One standing, one sleeping.
    solution: L has only straight lines.
  - prompt: 'The letter O is made of:'
    options:
    - a curved line
    - straight lines
    - dots
    answer: a curved line
    difficulty: 1
    hints:
    - It is round.
    - No corners.
    solution: O is one curved line.
  - prompt: A flag pole is a ___ line.
    options:
    - standing
    - sleeping
    - curved
    - wavy
    answer: standing
    difficulty: 1
    hints:
    - It points up.
    - Upright.
    solution: A flag pole is a standing line.
  - prompt: How many straight lines make the letter T?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - One sleeping on top.
    - One standing.
    solution: T has 2 straight lines.
    mistakes:
      '3': c2_count_once
  - prompt: How many straight lines make the letter E?
    answer: '4'
    check: 1 + 3
    difficulty: 2
    hints:
    - One standing line.
    - Three sleeping lines.
    solution: 'E has 1 standing and 3 sleeping lines: 4.'
    mistakes:
      '3': c2_count_once
- code: cbse2m.lines.measure
  title: Longer and shorter
  after:
  - cbse2m.lines.kinds
  notes: |
    Comparing lengths of lines and things: longer, shorter, same. Measuring with hand spans, fingers, steps or a
    ruler. Different hands give different spans, so a ruler is fairer.
  explanations:
    text: 'We can compare lines: which is longer, which is shorter. We can measure with our hand span or a ruler. A ruler is fair because it is the same for everyone.'
    visual: Draw a long pencil and a short crayon side by side, both starting at the same place.
    step_by_step: 'Step 1: Line up the ends. Step 2: See which goes further. Step 3: Or measure each and compare the numbers.'
    real_world: Tailors measure cloth with a tape so every shirt fits.
  picture:
    kind: bars
    bars:
    - label: pencil
      value: 15
    - label: crayon
      value: 8
    alt: A pencil 15 centimetres long is longer than a crayon 8 centimetres long.
    unit: cm
  items:
  - prompt: A pencil is 15 cm and a crayon is 8 cm. Which is longer?
    options:
    - pencil
    - crayon
    - both the same
    answer: pencil
    difficulty: 1
    hints:
    - 15 is more than 8.
    - Bigger number.
    solution: 15 cm > 8 cm, so the pencil is longer.
  - prompt: A table is 6 hand spans long. Another is 4. How many spans longer is the first?
    answer: '2'
    check: 6 - 4
    difficulty: 1
    hints:
    - 6 − 4.
    - Take away.
    solution: 6 − 4 = 2 spans.
    mistakes:
      '10': c2_count_once
  - prompt: Why is a ruler better than a hand span?
    options:
    - it is the same for everyone
    - it is prettier
    - it is heavier
    - it is softer
    answer: it is the same for everyone
    difficulty: 2
    hints:
    - Hands are different sizes.
    - Fair measure.
    solution: A ruler is the same for everyone.
  - prompt: A ribbon is 10 cm. Ravi cuts 3 cm off. How long is it now?
    answer: '7'
    check: 10 - 3
    difficulty: 2
    hints:
    - Take away 3.
    - 10 − 3.
    solution: 10 − 3 = 7 cm.
    mistakes:
      '13': c2_count_once
  - prompt: Two sticks of 5 cm are put end to end. How long together?
    answer: '10'
    check: 5 + 5
    difficulty: 1
    hints:
    - Add them.
    - 5 + 5.
    solution: 5 + 5 = 10 cm.
  - prompt: Which is the shortest?
    options:
    - an ant
    - a cat
    - a horse
    - a tree
    answer: an ant
    difficulty: 1
    hints:
    - Think of their sizes.
    - Tiny.
    solution: An ant is the shortest.
