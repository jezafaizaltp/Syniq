# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 5
title: Playing with Lines
tips:
  m2_curved: "A rainbow bends like an arch."
  m2_l_straight: "Draw L: one line down, one line across. Do they bend?"
  m2_longer_cm: "More centimetres means longer. Compare 15 and 8."
  m2_o_curve: "Draw O: it goes round without any corner."
  m2_standing: "A sleeping line lies flat. A flag pole points up."
  c2m5_kind: Trace the line with your finger. Does it bend, or go straight?
  c2m5_count: Draw the letter slowly and count each straight stroke.
  c2m5_len: Line the two things up from the same start. Which goes further?

concepts:
- code: cbse2m.lines.kinds
  title: Straight and curved lines
  notes: |
    Kinds of lines: straight (standing = vertical, sleeping = horizontal, slanting) and curved. Finding them in letters,
    things and pictures. Drawing with a ruler.
  explanations:
    text: Lines can be straight or curved. A straight line can stand up, lie down or slant. A curved line bends, like a rainbow.
    visual: Draw a standing line, a sleeping line, a slanting line and a curved line side by side.
    step_by_step: 'Step 1: Does it bend? If yes, it is curved. Step 2: If straight, is it standing, sleeping or slanting?'
    real_world: Railway tracks are straight lines; a rainbow is a curve.
  picture:
    kind: compare
    columns:
    - title: Straight
      points:
      - standing |
      - sleeping —
      - slanting /
    - title: Curved
      points:
      - rainbow
      - letter C
      - snake
    alt: Straight lines can stand, sleep or slant; curved lines bend, like a rainbow, the letter C or a snake.
  activity:
    type: sort
    prompt: Straight or curved?
    bins:
    - Straight
    - Curved
    items:
    - label: The edge of a ruler
      bin: Straight
      clue: Does it bend anywhere?
      why: A ruler's edge does not bend.
    - label: A rainbow 🌈
      bin: Curved
      clue: Does it bend?
      why: 'A rainbow bends: curved.'
    - label: A railway track, far away
      bin: Straight
      clue: Does it go on without turning?
      why: It goes on without bending.
    - label: A snake on the move 🐍
      bin: Curved
      clue: Does it wiggle?
      why: 'It wiggles: curved.'
    - label: A standing pole
      bin: Straight
      clue: Does it bend?
      why: Standing up, it is still a straight line.
    - label: The edge of a bangle
      bin: Curved
      clue: Go around it.
      why: 'It bends round: curved.'
  lesson:
    - teach: Lines can be straight or curved. A straight line does not bend, like the edge of a ruler. A curved line bends, like a rainbow.
      picture:
        kind: compare
        columns:
        - title: Straight
          points:
          - ruler edge
          - door frame
        - title: Curved
          points:
          - rainbow
          - bangle
        alt: Straight and curved lines around us.
      check:
        prompt: The edge of a ruler is a ___ line.
        options:
        - straight
        - curved
        - round
        answer: straight
        why: A ruler edge does not bend.
      ways:
      - style: step_by_step
        teach: 'Test a line with a ruler. Step 1: Put the edge of a ruler along the line. Step 2: If the whole line touches the ruler, it is straight. Step 3: If the line goes away from the ruler and bends, it is curved.'
      - style: real_world
        teach: A road on a hill twists and turns in curves. A railway line across flat fields often runs straight for a long way.
    - teach: Straight lines can stand (up and down, like a flag pole), sleep (flat, like the floor) or slant (tilted, like a slide).
      check:
        prompt: A slide in the park is a ___ line.
        options:
        - slanting
        - standing
        - sleeping
        answer: slanting
        why: It goes down at a tilt.
      ways:
      - style: visual
        teach: 'Three kinds of straight lines: standing, sleeping and slanting.'
        picture:
          kind: compare
          columns:
          - title: Standing
            points:
            - Up and down
            - Like a lamp post
          - title: Sleeping
            points:
            - Flat
            - Like a table top
          - title: Slanting
            points:
            - Tilted
            - Like a ladder against a wall
          alt: A standing line goes up and down, like a lamp post. A sleeping line lies flat, like a table top. A slanting line is tilted, like a ladder leaning against a wall.
      - style: real_world
        teach: When you stand up straight in the assembly line, your body is like a standing line. When you lie down to sleep, it is like a sleeping line.
    - teach: Letters are made of lines. L, T, E, H use straight lines. O, C, S use curved lines. B, D, P use both.
      check:
        prompt: Which letter uses only straight lines?
        options:
        - T
        - O
        - S
        answer: T
        why: T has two straight lines.
      ways:
      - style: visual
        teach: Letters sorted by the kind of lines they use.
        picture:
          kind: compare
          columns:
          - title: Only straight
            points:
            - F
            - I
            - K
            - N
          - title: Only curved
            points:
            - U (mostly)
            - J (mostly)
          - title: Straight and curved
            points:
            - R
            - G
          alt: F, I, K and N use only straight lines. U and J are mostly curved. R and G use both straight and curved lines.
      - style: step_by_step
        teach: 'Count the straight lines in the letter F. Step 1: Draw the standing line down the left side: 1. Step 2: Draw the top line across: 2. Step 3: Draw the shorter middle line across: 3. So F has 3 straight lines.'
  items:
  - prompt: A rainbow is a ___ line.
    options:
    - curved
    - straight
    - standing
    answer: curved
    difficulty: 1
    hints:
    - It bends.
    - Like an arch.
    solution: A rainbow is curved.
    mistakes: {"straight": "m2_curved"}
  - prompt: 'The letter L is made of:'
    options:
    - straight lines
    - curved lines
    - dots
    answer: straight lines
    difficulty: 1
    hints:
    - No bends.
    - One standing, one sleeping.
    solution: L has only straight lines.
    mistakes: {"curved lines": "m2_l_straight"}
  - prompt: 'The letter O is made of:'
    options:
    - a curved line
    - straight lines
    - dots
    answer: a curved line
    difficulty: 1
    hints:
    - It is round.
    - No corners.
    solution: O is one curved line.
    mistakes: {"straight lines": "m2_o_curve"}
  - prompt: A flag pole is a ___ line.
    options:
    - standing
    - sleeping
    - curved
    - wavy
    answer: standing
    difficulty: 1
    hints:
    - It points up.
    - Upright.
    solution: A flag pole is a standing line.
    mistakes: {"sleeping": "m2_standing"}
  - prompt: How many straight lines make the letter T?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - One sleeping on top.
    - One standing.
    solution: T has 2 straight lines.
    mistakes:
      '3': c2_count_once
  - prompt: How many straight lines make the letter E?
    answer: '4'
    check: 1 + 3
    difficulty: 2
    hints:
    - One standing line.
    - Three sleeping lines.
    solution: 'E has 1 standing and 3 sleeping lines: 4.'
    mistakes:
      '3': c2_count_once
  - prompt: 'The letter C is made of:'
    options:
    - a curved line
    - straight lines
    - no lines
    answer: a curved line
    difficulty: 1
    hints:
    - Draw C in the air.
    - Does it bend?
    solution: 'Step 1: C bends round. Step 2: It is a curved line.'
    mistakes:
      straight lines: c2m5_kind
      no lines: c2m5_kind
  - prompt: How many straight lines make the letter H?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Two standing lines.
    - One across.
    solution: 'Step 1: 2 standing + 1 sleeping. Step 2: 3 lines.'
    mistakes:
      '2': c2m5_count
      '4': c2m5_count
  - prompt: The floor is a ___ line.
    options:
    - sleeping
    - standing
    - curved
    answer: sleeping
    difficulty: 1
    hints:
    - It lies flat.
    - Like you in bed.
    solution: 'Step 1: The floor is flat. Step 2: A sleeping line.'
    mistakes:
      standing: c2m5_kind
      curved: c2m5_kind
  - prompt: Which letter uses both straight and curved lines?
    options:
    - D
    - L
    - O
    answer: D
    difficulty: 2
    hints:
    - One straight side, one curve.
    - L is all straight, O all curved.
    solution: 'Step 1: L is straight; O is curved. Step 2: D has one of each.'
    mistakes:
      L: c2m5_kind
      O: c2m5_kind
  - prompt: How many straight lines make the letter A?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Two slanting lines.
    - One across the middle.
    solution: 'Step 1: 2 slanting + 1 across. Step 2: 3 lines.'
    mistakes:
      '2': c2m5_count
      '4': c2m5_count
  - prompt: A coconut tree trunk standing tall is a ___ line.
    options:
    - standing
    - sleeping
    - slanting
    answer: standing
    difficulty: 1
    hints:
    - It goes straight up.
    - Like a flag pole.
    solution: 'Step 1: It goes up and down. Step 2: A standing line.'
    mistakes:
      sleeping: c2m5_kind
      slanting: c2m5_kind
  - prompt: Which thing has a curved edge?
    options:
    - a roti
    - a book
    - a door
    answer: a roti
    difficulty: 1
    hints:
    - Which one is round?
    - Books and doors have straight edges.
    solution: 'Step 1: Books and doors have straight edges. Step 2: A roti is round.'
    mistakes:
      a book: c2m5_kind
      a door: c2m5_kind
  - prompt: How many straight lines make the letter M?
    answer: '4'
    check: '4'
    difficulty: 3
    hints:
    - Two standing lines on the sides.
    - Two slanting lines in the middle.
    solution: 'Step 1: 2 standing + 2 slanting. Step 2: 4 lines.'
    mistakes:
      '3': c2m5_count
      '2': c2m5_count
  - prompt: 'The letter S is made of:'
    options:
    - curved lines
    - straight lines
    - a triangle
    answer: curved lines
    difficulty: 2
    hints:
    - Draw S like a snake.
    - Does it bend?
    solution: 'Step 1: S bends twice. Step 2: Curved lines.'
    mistakes:
      straight lines: c2m5_kind
      a triangle: c2m5_kind
  - prompt: 'Case: In an art class, children make letters with ice-cream sticks. The sticks are straight and cannot bend. Which letter can they NOT make well with sticks alone?'
    options:
    - O, because it needs a curved line
    - L, because it needs two straight lines
    - T, because it needs two straight lines
    answer: O, because it needs a curved line
    hints:
    - Can a straight stick make a bend?
    - Which letter is round all the way?
    solution: L and T are made of straight lines, so sticks work. O is one curved line, and straight sticks cannot bend into a curve.
    mistakes:
      L, because it needs two straight lines: c2m5_kind
      T, because it needs two straight lines: c2m5_kind
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are drawing a slide in the playground. What kind of line should the sliding part be?'
    options:
    - A slanting line
    - A sleeping line
    - A standing line
    answer: A slanting line
    hints:
    - Is a slide flat, upright, or tilted?
    - Which kind of line is tilted?
    solution: A slide is tilted so children can slide down. A tilted line is a slanting line.
    mistakes:
      A sleeping line: c2m5_kind
      A standing line: c2m5_kind
    exam: competency
    difficulty: 2
- code: cbse2m.lines.measure
  title: Longer and shorter
  after:
  - cbse2m.lines.kinds
  notes: |
    Comparing lengths of lines and things: longer, shorter, same. Measuring with hand spans, fingers, steps or a
    ruler. Different hands give different spans, so a ruler is fairer.
  explanations:
    text: 'We can compare lines: which is longer, which is shorter. We can measure with our hand span or a ruler. A ruler is fair because it is the same for everyone.'
    visual: Draw a long pencil and a short crayon side by side, both starting at the same place.
    step_by_step: 'Step 1: Line up the ends. Step 2: See which goes further. Step 3: Or measure each and compare the numbers.'
    real_world: Tailors measure cloth with a tape so every shirt fits.
  picture:
    kind: bars
    bars:
    - label: pencil
      value: 15
    - label: crayon
      value: 8
    alt: A pencil 15 centimetres long is longer than a crayon 8 centimetres long.
    unit: cm
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Measure the line with a ruler. Start at 0!
    goals:
    - prompt: The line starts at 0 and ends at 7
      target: 7
      mistakes:
      - when:
          v: 8
        say: Did you start at 1? Start at 0 on the ruler.
    - prompt: The line starts at 0 and ends at 12
      target: 12
      mistakes:
      - when:
          v: 11
        say: 'Count to the very end mark: 12.'
    - prompt: The line starts at 2 and ends at 9. How long is it?
      target: 7
      hint: Count the jumps from 2 to 9.
      mistakes:
      - when:
          v: 9
        say: The line did not start at 0. Count jumps from 2 to 9, not the end number.
      - when:
          v: 11
        say: That adds the ends. Count the jumps between 2 and 9.
  lesson:
    - teach: To compare two things, put them side by side from the same starting point. The one that goes further is longer.
      picture:
        kind: bars
        unit: cm
        bars:
        - label: pencil
          value: 15
        - label: crayon
          value: 8
        alt: A pencil of 15 cm is longer than a crayon of 8 cm.
      check:
        prompt: A pencil is 15 cm and a crayon is 8 cm. Which is shorter?
        options:
        - crayon
        - pencil
        - they are the same
        answer: crayon
        why: 8 is less than 15.
      ways:
      - style: step_by_step
        teach: 'Compare two pencils. Step 1: Put them next to each other on the table. Step 2: Line up their flat ends at the same starting point. Step 3: Look at the other ends. Step 4: The one that sticks out further is longer.'
      - style: real_world
        teach: When children compare their heights, they stand back to back on the same floor. If they stood on different steps, the comparison would be wrong.
    - teach: We can measure with hand spans, fingers or steps. But your span and a teacher's span are different sizes, so you get different numbers.
      check:
        prompt: Why do two people get different hand-span counts?
        options:
        - their hands are different sizes
        - the table moves
        - they cannot count
        answer: their hands are different sizes
        why: A bigger hand covers more each time.
      ways:
      - style: visual
        teach: The same table measured with two different hand spans.
        picture:
          kind: bars
          bars:
          - label: Parent's spans
            value: 3
          - label: Child's spans
            value: 5
          alt: The same table is 3 spans long for a parent and 5 spans long for a child, because the child's hand is smaller.
      - style: real_world
        teach: At home, a cook may measure rice with 'two handfuls'. A grown-up's handful holds more than a child's, so the rice comes out different.
    - teach: A ruler measures in centimetres (cm) and is the same for everyone. Put the thing at 0 and read the number at its other end.
      check:
        prompt: An eraser goes from 0 to 5 on a ruler. How long is it?
        options:
        - 5 cm
        - 0 cm
        - 10 cm
        answer: 5 cm
        why: From 0 to 5 is 5 cm.
      ways:
      - style: visual
        teach: 'Reading a ruler: put one end of the thing at 0.'
        picture:
          kind: number_line
          from: 0
          to: 15
          step: 1
          jumps:
          - from: 0
            to: 11
            label: eraser
          alt: An eraser is placed with one end at 0 on the ruler. Its other end is at 11, so it is 11 cm long.
      - style: step_by_step
        teach: 'Measure a leaf. Step 1: Put the bottom of the leaf at 0 on the ruler. Step 2: Keep the leaf straight along the ruler. Step 3: Look at the tip of the leaf. Step 4: Read the number there: that is its length in cm.'
  items:
  - prompt: A pencil is 15 cm and a crayon is 8 cm. Which is longer?
    options:
    - pencil
    - crayon
    - both the same
    answer: pencil
    difficulty: 1
    hints:
    - 15 is more than 8.
    - Bigger number.
    solution: 15 cm > 8 cm, so the pencil is longer.
    mistakes: {"crayon": "m2_longer_cm"}
  - prompt: A table is 6 hand spans long. Another is 4. How many spans longer is the first?
    answer: '2'
    check: 6 - 4
    difficulty: 1
    hints:
    - 6 − 4.
    - Take away.
    solution: 6 − 4 = 2 spans.
    mistakes:
      '10': c2_count_once
  - prompt: Why is a ruler better than a hand span?
    options:
    - it is the same for everyone
    - it is prettier
    - it is heavier
    - it is softer
    answer: it is the same for everyone
    difficulty: 2
    hints:
    - Hands are different sizes.
    - Fair measure.
    solution: A ruler is the same for everyone.
    mistakes: {"it is prettier": "m4_standard"}
  - prompt: A ribbon is 10 cm. Ravi cuts 3 cm off. How long is it now?
    answer: '7'
    check: 10 - 3
    difficulty: 2
    hints:
    - Take away 3.
    - 10 − 3.
    solution: 10 − 3 = 7 cm.
    mistakes:
      '13': c2_count_once
  - prompt: Two sticks of 5 cm are put end to end. How long together?
    answer: '10'
    check: 5 + 5
    difficulty: 1
    hints:
    - Add them.
    - 5 + 5.
    solution: 5 + 5 = 10 cm.
    mistakes: {"5": "m3_ten_and_ten", "25": "m3_ten_and_ten"}
  - prompt: Which is the shortest?
    options:
    - an ant
    - a cat
    - a horse
    - a tree
    answer: an ant
    difficulty: 1
    hints:
    - Think of their sizes.
    - Tiny.
    solution: An ant is the shortest.
    mistakes: {"a cat": "m1_shorter"}
  - prompt: A rope is 20 cm and a ribbon is 12 cm. How much longer is the rope?
    answer: '8'
    check: 20-12
    difficulty: 2
    hints:
    - Find the difference.
    - 20 − 12.
    solution: 'Step 1: 20 − 12. Step 2: = 8 cm.'
    mistakes:
      '32': c2m5_len
      '12': c2m5_len
  - prompt: Which is the longest?
    options:
    - a bus
    - a bicycle
    - a pencil
    answer: a bus
    difficulty: 1
    hints:
    - Picture them side by side.
    - Which one carries many people?
    solution: 'Step 1: A pencil is short, a bicycle longer. Step 2: A bus is the longest.'
    mistakes:
      a bicycle: c2m5_len
      a pencil: c2m5_len
  - prompt: A crayon goes from 0 to 7 on a ruler. How long is it in cm?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Start at 0.
    - Read the end.
    solution: 'Step 1: From 0 to 7. Step 2: 7 cm.'
    mistakes:
      '8': c2m5_len
      '6': c2m5_len
  - prompt: Three sticks of 3 cm are put end to end. How long together?
    answer: '9'
    check: 3*3
    difficulty: 2
    hints:
    - Add the three lengths.
    - 3 + 3 + 3.
    solution: 'Step 1: 3 + 3 + 3. Step 2: = 9 cm.'
    mistakes:
      '6': c2m5_len
      '33': c2m5_len
  - prompt: A string is 15 cm. You cut off 5 cm. How long is it now?
    answer: '10'
    check: 15-5
    difficulty: 1
    hints:
    - Cutting takes away.
    - 15 − 5.
    solution: 'Step 1: 15 − 5. Step 2: = 10 cm.'
    mistakes:
      '20': c2m5_len
      '5': c2m5_len
  - prompt: A table is 5 spans for a teacher. Would a child need more or fewer spans?
    options:
    - more
    - fewer
    - the same
    answer: more
    difficulty: 3
    hints:
    - Whose hand is smaller?
    - Smaller steps need more of them.
    solution: 'Step 1: A child''s span is smaller. Step 2: So more spans fit.'
    mistakes:
      fewer: c2m5_len
      the same: c2m5_len
  - prompt: Which tool is best to measure a pencil?
    options:
    - a ruler
    - a bucket
    - a clock
    answer: a ruler
    difficulty: 1
    hints:
    - We want length.
    - Which one has cm marks?
    solution: 'Step 1: A bucket holds water; a clock tells time. Step 2: A ruler measures length.'
    mistakes:
      a bucket: c2m5_len
      a clock: c2m5_len
  - prompt: A worm is 4 cm. A snake toy is 4 times as long. How long is the snake toy?
    answer: '16'
    check: 4*4
    difficulty: 3
    hints:
    - 4 times means 4 groups of 4.
    - 4, 8, 12, 16.
    solution: 'Step 1: 4 + 4 + 4 + 4. Step 2: = 16 cm.'
    mistakes:
      '8': c2m5_len
      '12': c2m5_len
  - prompt: 'Which is shorter: 9 cm or 12 cm?'
    options:
    - 9 cm
    - 12 cm
    - they are equal
    answer: 9 cm
    difficulty: 1
    hints:
    - Compare 9 and 12.
    - Smaller number is shorter.
    solution: 'Step 1: 9 < 12. Step 2: 9 cm is shorter.'
    mistakes:
      12 cm: c2m5_len
      they are equal: c2m5_len
  - prompt: 'Case: Two children measure the same classroom door with hand spans. One says 12 spans, the other says 9 spans. They argue about who is wrong. What is the best way to settle it?'
    options:
    - Measure with a ruler or measuring tape, which is the same for everyone
    - The bigger number is always right
    - The child with the smaller number is wrong
    answer: Measure with a ruler or measuring tape, which is the same for everyone
    hints:
    - Are both children's hands the same size?
    - Which tool gives the same answer for everyone?
    solution: Different hand sizes give different counts, so both can be right. A ruler or tape gives the same answer for everyone.
    mistakes:
      The bigger number is always right: c2m5_len
      The child with the smaller number is wrong: c2m5_len
    exam: case
    difficulty: 2
  - prompt: 'Situation: You measure a crayon, but you start it at 2 on the ruler instead of 0. Its other end is at 9. How long is the crayon?'
    options:
    - 7 cm
    - 9 cm
    - 11 cm
    answer: 7 cm
    hints:
    - The crayon did not start at 0.
    - How many centimetres are there from 2 to 9?
    solution: 'The crayon goes from 2 to 9. Count from 2 to 9: that is 7 cm. It is not 9 cm, because it did not start at 0.'
    mistakes:
      9 cm: c2m5_len
      11 cm: c2m5_len
    exam: competency
    difficulty: 2
