# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 5
title: Playing with Lines
tips:
  m2_curved: "A rainbow bends like an arch."
  m2_l_straight: "Draw L: one line down, one line across. Do they bend?"
  m2_longer_cm: "More centimetres means longer. Compare 15 and 8."
  m2_o_curve: "Draw O: it goes round without any corner."
  m2_standing: "A sleeping line lies flat. A flag pole points up."

concepts:
- code: cbse2m.lines.kinds
  title: Straight and curved lines
  notes: |
    Kinds of lines: straight (standing = vertical, sleeping = horizontal, slanting) and curved. Finding them in letters,
    things and pictures. Drawing with a ruler.
  explanations:
    text: Lines can be straight or curved. A straight line can stand up, lie down or slant. A curved line bends, like a rainbow.
    visual: Draw a standing line, a sleeping line, a slanting line and a curved line side by side.
    step_by_step: 'Step 1: Does it bend? If yes, it is curved. Step 2: If straight, is it standing, sleeping or slanting?'
    real_world: Railway tracks are straight lines; a rainbow is a curve.
  picture:
    kind: compare
    columns:
    - title: Straight
      points:
      - standing |
      - sleeping —
      - slanting /
    - title: Curved
      points:
      - rainbow
      - letter C
      - snake
    alt: Straight lines can stand, sleep or slant; curved lines bend, like a rainbow, the letter C or a snake.
  activity:
    type: sort
    prompt: Straight or curved?
    bins:
    - Straight
    - Curved
    items:
    - label: The edge of a ruler
      bin: Straight
      clue: Does it bend anywhere?
      why: A ruler's edge does not bend.
    - label: A rainbow 🌈
      bin: Curved
      clue: Does it bend?
      why: 'A rainbow bends: curved.'
    - label: A railway track, far away
      bin: Straight
      clue: Does it go on without turning?
      why: It goes on without bending.
    - label: A snake on the move 🐍
      bin: Curved
      clue: Does it wiggle?
      why: 'It wiggles: curved.'
    - label: A standing pole
      bin: Straight
      clue: Does it bend?
      why: Standing up, it is still a straight line.
    - label: The edge of a bangle
      bin: Curved
      clue: Go around it.
      why: 'It bends round: curved.'
  items:
  - prompt: A rainbow is a ___ line.
    options:
    - curved
    - straight
    - standing
    answer: curved
    difficulty: 1
    hints:
    - It bends.
    - Like an arch.
    solution: A rainbow is curved.
    mistakes: {"straight": "m2_curved"}
  - prompt: 'The letter L is made of:'
    options:
    - straight lines
    - curved lines
    - dots
    answer: straight lines
    difficulty: 1
    hints:
    - No bends.
    - One standing, one sleeping.
    solution: L has only straight lines.
    mistakes: {"curved lines": "m2_l_straight"}
  - prompt: 'The letter O is made of:'
    options:
    - a curved line
    - straight lines
    - dots
    answer: a curved line
    difficulty: 1
    hints:
    - It is round.
    - No corners.
    solution: O is one curved line.
    mistakes: {"straight lines": "m2_o_curve"}
  - prompt: A flag pole is a ___ line.
    options:
    - standing
    - sleeping
    - curved
    - wavy
    answer: standing
    difficulty: 1
    hints:
    - It points up.
    - Upright.
    solution: A flag pole is a standing line.
    mistakes: {"sleeping": "m2_standing"}
  - prompt: How many straight lines make the letter T?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - One sleeping on top.
    - One standing.
    solution: T has 2 straight lines.
    mistakes:
      '3': c2_count_once
  - prompt: How many straight lines make the letter E?
    answer: '4'
    check: 1 + 3
    difficulty: 2
    hints:
    - One standing line.
    - Three sleeping lines.
    solution: 'E has 1 standing and 3 sleeping lines: 4.'
    mistakes:
      '3': c2_count_once
- code: cbse2m.lines.measure
  title: Longer and shorter
  after:
  - cbse2m.lines.kinds
  notes: |
    Comparing lengths of lines and things: longer, shorter, same. Measuring with hand spans, fingers, steps or a
    ruler. Different hands give different spans, so a ruler is fairer.
  explanations:
    text: 'We can compare lines: which is longer, which is shorter. We can measure with our hand span or a ruler. A ruler is fair because it is the same for everyone.'
    visual: Draw a long pencil and a short crayon side by side, both starting at the same place.
    step_by_step: 'Step 1: Line up the ends. Step 2: See which goes further. Step 3: Or measure each and compare the numbers.'
    real_world: Tailors measure cloth with a tape so every shirt fits.
  picture:
    kind: bars
    bars:
    - label: pencil
      value: 15
    - label: crayon
      value: 8
    alt: A pencil 15 centimetres long is longer than a crayon 8 centimetres long.
    unit: cm
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Measure the line with a ruler. Start at 0!
    goals:
    - prompt: The line starts at 0 and ends at 7
      target: 7
      mistakes:
      - when:
          v: 8
        say: Did you start at 1? Start at 0 on the ruler.
    - prompt: The line starts at 0 and ends at 12
      target: 12
      mistakes:
      - when:
          v: 11
        say: 'Count to the very end mark: 12.'
    - prompt: The line starts at 2 and ends at 9. How long is it?
      target: 7
      hint: Count the jumps from 2 to 9.
      mistakes:
      - when:
          v: 9
        say: The line did not start at 0. Count jumps from 2 to 9, not the end number.
      - when:
          v: 11
        say: That adds the ends. Count the jumps between 2 and 9.
  items:
  - prompt: A pencil is 15 cm and a crayon is 8 cm. Which is longer?
    options:
    - pencil
    - crayon
    - both the same
    answer: pencil
    difficulty: 1
    hints:
    - 15 is more than 8.
    - Bigger number.
    solution: 15 cm > 8 cm, so the pencil is longer.
    mistakes: {"crayon": "m2_longer_cm"}
  - prompt: A table is 6 hand spans long. Another is 4. How many spans longer is the first?
    answer: '2'
    check: 6 - 4
    difficulty: 1
    hints:
    - 6 − 4.
    - Take away.
    solution: 6 − 4 = 2 spans.
    mistakes:
      '10': c2_count_once
  - prompt: Why is a ruler better than a hand span?
    options:
    - it is the same for everyone
    - it is prettier
    - it is heavier
    - it is softer
    answer: it is the same for everyone
    difficulty: 2
    hints:
    - Hands are different sizes.
    - Fair measure.
    solution: A ruler is the same for everyone.
    mistakes: {"it is prettier": "m4_standard"}
  - prompt: A ribbon is 10 cm. Ravi cuts 3 cm off. How long is it now?
    answer: '7'
    check: 10 - 3
    difficulty: 2
    hints:
    - Take away 3.
    - 10 − 3.
    solution: 10 − 3 = 7 cm.
    mistakes:
      '13': c2_count_once
  - prompt: Two sticks of 5 cm are put end to end. How long together?
    answer: '10'
    check: 5 + 5
    difficulty: 1
    hints:
    - Add them.
    - 5 + 5.
    solution: 5 + 5 = 10 cm.
    mistakes: {"5": "m3_ten_and_ten", "25": "m3_ten_and_ten"}
  - prompt: Which is the shortest?
    options:
    - an ant
    - a cat
    - a horse
    - a tree
    answer: an ant
    difficulty: 1
    hints:
    - Think of their sizes.
    - Tiny.
    solution: An ant is the shortest.
    mistakes: {"a cat": "m1_shorter"}
