# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 4
title: Shadow Story
tips:
  m2_ball_shadow: "A ball is round from every side. What shape is its shadow?"
  m2_book_shadow: "A standing book has straight edges and four corners."
  m2_far_small: "Things far away look tiny, like an aeroplane in the sky."
  m2_no_light: "A shadow needs light. With no light at all, is there a shadow?"
  m2_shadow: "Stand in the sun. Your body stops the light, and a dark shape appears."
  m2_shadows: "Each child makes one shadow."
  m2_square_sides: "The top of a dice is a square. Count its sides."
  m2_table_below: "The cup is on the table. So the table is lower down."
  m5_noon: "Shadows are long when the sun is low. When is the sun highest?"

concepts:
- code: cbse2m.shadow.shadows
  title: Shadows of things
  notes: |
    A shadow forms when something blocks light. The shadow has the outline of the thing: a ball gives a round shadow, a
    book gives a rectangle. Shadows are long in the morning and evening, short at noon. Matching objects to shadows.
  explanations:
    text: 'When something blocks the light, it makes a shadow. The shadow has the same outline as the thing: a ball makes a round shadow, a book makes a rectangle shadow.'
    visual: Draw a ball and its round shadow on the ground, then a book and its rectangle shadow.
    step_by_step: 'Step 1: Look at the outline of the thing. Step 2: Imagine the light behind it. Step 3: Pick the shadow with the same outline.'
    real_world: In the evening your shadow becomes very long; at noon it is short and under your feet.
  picture:
    kind: compare
    columns:
    - title: Thing
      points:
      - ball
      - book
      - ice-cream cone (side)
    - title: Shadow
      points:
      - circle
      - rectangle
      - triangle
    alt: A ball gives a circle shadow, a book gives a rectangle shadow, and a cone seen from the side gives a triangle shadow.
  activity:
    type: sort
    prompt: Which shadow does it make?
    bins:
    - A circle
    - A square
    - A triangle
    items:
    - label: ⚽ A ball
      bin: A circle
      clue: It is round from every side.
      why: A ball always makes a round shadow.
    - label: 🎲 A dice, face to the light
      bin: A square
      clue: Its face has 4 equal sides.
      why: The face is a square, so the shadow is too.
    - label: 🍕 A flat pizza slice with straight edges
      bin: A triangle
      clue: Count its corners.
      why: '3 corners: a triangle shadow.'
    - label: 🍪 A flat round biscuit, face to the light
      bin: A circle
      clue: Is the biscuit round?
      why: A round face makes a round shadow.
    - label: 🪟 A square tile, face to the light
      bin: A square
      clue: Equal sides?
      why: A square tile makes a square shadow.
    - label: 🚩 A flag with 3 corners
      bin: A triangle
      clue: Count its corners.
      why: '3 corners: triangle.'
  items:
  - prompt: What makes a shadow?
    options:
    - something blocking light
    - water
    - wind
    - sound
    answer: something blocking light
    difficulty: 1
    hints:
    - Stand in the sun.
    - Your body stops the light.
    solution: A shadow forms when something blocks light.
    mistakes: {"water": "m2_shadow"}
  - prompt: 'The shadow of a ball looks like a:'
    options:
    - circle
    - square
    - triangle
    - line
    answer: circle
    difficulty: 1
    hints:
    - The ball is round.
    - Outline.
    solution: A ball makes a round shadow.
    mistakes: {"square": "m2_ball_shadow"}
  - prompt: When is your shadow shortest?
    options:
    - at noon
    - in the morning
    - in the evening
    - at night
    answer: at noon
    difficulty: 2
    hints:
    - The sun is right above you.
    - Middle of the day.
    solution: At noon the sun is overhead and shadows are short.
    mistakes: {"in the morning": "m5_noon"}
  - prompt: 'The shadow of a book standing up looks like a:'
    options:
    - rectangle
    - circle
    - star
    - heart
    answer: rectangle
    difficulty: 1
    hints:
    - The book has 4 corners.
    - Long sides.
    solution: A book's shadow is a rectangle.
    mistakes: {"circle": "m2_book_shadow"}
  - prompt: Can you see your shadow on a dark night with no light?
    options:
    - 'no'
    - yes, a dark one
    - yes, a bright one
    answer: 'no'
    difficulty: 2
    hints:
    - A shadow needs light.
    - No light, no shadow.
    solution: Without light there is no shadow.
    mistakes: {"yes, a dark one": "m2_no_light"}
  - prompt: 3 children stand in the sun. How many shadows?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Each child makes one.
    - Count the children.
    solution: 3 children make 3 shadows.
    mistakes: {"1": "m2_shadows", "6": "m2_shadows"}
- code: cbse2m.shadow.views
  title: Seeing from different sides
  after:
  - cbse2m.shadow.shadows
  notes: |
    Things look different from the top, front and side. A glass from the top looks like a circle; from the side, a
    rectangle. Tracing outlines; describing position: near/far, on top/below, left/right.
  explanations:
    text: Things look different from different sides. A glass seen from the top looks like a circle. From the side it looks like a rectangle.
    visual: Draw a glass from the side (a rectangle) and from the top (a circle).
    step_by_step: 'Step 1: Choose a side: top, front or side. Step 2: Imagine looking from there. Step 3: Draw the outline you see.'
    real_world: A bird flying above sees the round tops of umbrellas, not their handles.
  picture:
    kind: flow
    steps:
    - Pick a thing
    - Look from the top
    - Look from the side
    - Draw both outlines
    alt: Pick a thing, look from the top, look from the side, and draw both outlines.
  activity:
    type: sort
    prompt: A glass seen from where?
    bins:
    - From the top
    - From the side
    items:
    - label: Looks like a circle
      bin: From the top
      clue: Look down into the glass.
      why: 'Looking down, you see the round rim: a circle.'
    - label: Looks like a rectangle
      bin: From the side
      clue: Look at it standing on the table.
      why: From the side, the glass looks tall and straight.
    - label: You can see inside it
      bin: From the top
      clue: Where must your eyes be to see inside?
      why: Only from above can you see inside.
    - label: You can see how tall it is
      bin: From the side
      clue: How do you see its height?
      why: Height shows from the side.
  items:
  - prompt: 'A glass seen from the top looks like a:'
    options:
    - circle
    - triangle
    - square
    - line
    answer: circle
    difficulty: 1
    hints:
    - Look into the glass.
    - Round rim.
    solution: From the top it is a circle.
    mistakes: {"square": "m4_glass_top"}
  - prompt: 'A cone seen from the side looks like a:'
    options:
    - triangle
    - circle
    - square
    - star
    answer: triangle
    difficulty: 2
    hints:
    - Pointed top, flat bottom.
    - Three corners.
    solution: A cone from the side looks like a triangle.
    mistakes: {"circle": "m4_cone_front"}
  - prompt: The cup is on the table. The table is ___ the cup.
    options:
    - below
    - on top of
    - inside
    - behind
    answer: below
    difficulty: 1
    hints:
    - The cup is higher.
    - The table holds it up.
    solution: The table is below the cup.
    mistakes: {"on top of": "m2_table_below"}
  - prompt: Which looks smaller?
    options:
    - a tree far away
    - a tree near you
    - both look the same size
    answer: a tree far away
    difficulty: 2
    hints:
    - Far things look small.
    - Think of a plane in the sky.
    solution: Things far away look smaller.
    mistakes: {"a tree near you": "m2_far_small"}
  - prompt: 'A dice seen from the top looks like a:'
    options:
    - square
    - circle
    - triangle
    - rectangle that is very long
    answer: square
    difficulty: 1
    hints:
    - All faces are equal.
    - 4 equal sides.
    solution: The top of a dice is a square.
    mistakes: {"circle": "m3_dice_face"}
  - prompt: How many sides does the top of a dice have?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - It is a square.
    - Count the edges.
    solution: A square has 4 sides.
    mistakes: {"6": "m2_square_sides", "3": "m2_square_sides"}
