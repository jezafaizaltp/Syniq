# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 4
title: Shadow Story
tips:
  m2_ball_shadow: "A ball is round from every side. What shape is its shadow?"
  m2_book_shadow: "A standing book has straight edges and four corners."
  m2_far_small: "Things far away look tiny, like an aeroplane in the sky."
  m2_no_light: "A shadow needs light. With no light at all, is there a shadow?"
  m2_shadow: "Stand in the sun. Your body stops the light, and a dark shape appears."
  m2_shadows: "Each child makes one shadow."
  m2_square_sides: "The top of a dice is a square. Count its sides."
  m2_table_below: "The cup is on the table. So the table is lower down."
  m5_noon: "Shadows are long when the sun is low. When is the sun highest?"
  c2m4_light: Think where the light comes from and what is blocking it.
  c2m4_outline: Imagine tracing round the thing with your finger. What outline do you draw?
  c2m4_view: 'Imagine looking at it from exactly that side: straight down, or straight at the front.'

concepts:
- code: cbse2m.shadow.shadows
  title: Shadows of things
  notes: |
    A shadow forms when something blocks light. The shadow has the outline of the thing: a ball gives a round shadow, a
    book gives a rectangle. Shadows are long in the morning and evening, short at noon. Matching objects to shadows.
  explanations:
    text: 'When something blocks the light, it makes a shadow. The shadow has the same outline as the thing: a ball makes a round shadow, a book makes a rectangle shadow.'
    visual: Draw a ball and its round shadow on the ground, then a book and its rectangle shadow.
    step_by_step: 'Step 1: Look at the outline of the thing. Step 2: Imagine the light behind it. Step 3: Pick the shadow with the same outline.'
    real_world: In the evening your shadow becomes very long; at noon it is short and under your feet.
  picture:
    kind: compare
    columns:
    - title: Thing
      points:
      - ball
      - book
      - ice-cream cone (side)
    - title: Shadow
      points:
      - circle
      - rectangle
      - triangle
    alt: A ball gives a circle shadow, a book gives a rectangle shadow, and a cone seen from the side gives a triangle shadow.
  activity:
    type: sort
    prompt: Which shadow does it make?
    bins:
    - A circle
    - A square
    - A triangle
    items:
    - label: ⚽ A ball
      bin: A circle
      clue: It is round from every side.
      why: A ball always makes a round shadow.
    - label: 🎲 A dice, face to the light
      bin: A square
      clue: Its face has 4 equal sides.
      why: The face is a square, so the shadow is too.
    - label: 🍕 A flat pizza slice with straight edges
      bin: A triangle
      clue: Count its corners.
      why: '3 corners: a triangle shadow.'
    - label: 🍪 A flat round biscuit, face to the light
      bin: A circle
      clue: Is the biscuit round?
      why: A round face makes a round shadow.
    - label: 🪟 A square tile, face to the light
      bin: A square
      clue: Equal sides?
      why: A square tile makes a square shadow.
    - label: 🚩 A flag with 3 corners
      bin: A triangle
      clue: Count its corners.
      why: '3 corners: triangle.'
  lesson:
    - teach: 'A shadow forms when something blocks light. Stand in the sun: your body stops the sunlight, and a dark shape appears on the ground behind you.'
      picture:
        kind: flow
        steps:
        - light
        - something blocks it
        - shadow behind
        alt: Light is blocked by a thing, making a shadow behind it.
      check:
        prompt: What do you need to make a shadow?
        options:
        - light and something to block it
        - only water
        - only a dark room
        answer: light and something to block it
        why: No light, no shadow; nothing blocking, no shadow.
      ways:
      - style: step_by_step
        teach: 'Make a shadow in a dark room. Step 1: Switch on a torch and point it at a wall. Step 2: Hold your hand between the torch and the wall. Step 3: See the dark shape on the wall. Step 4: Move your hand away: the shadow is gone.'
      - style: real_world
        teach: On a sunny day, people sit under a tree. The leaves block the sunlight, and the cool dark patch under the tree is its shadow.
    - teach: A shadow has the outline of the thing. A ball makes a round shadow. A book standing up makes a rectangle shadow.
      check:
        prompt: 'A plate held flat to the sun makes a shadow shaped like a:'
        options:
        - circle
        - triangle
        - square
        answer: circle
        why: A plate is round, so its outline is a circle.
      ways:
      - style: visual
        teach: Some things, and the shapes of the shadows they make.
        picture:
          kind: compare
          columns:
          - title: Thing
            points:
            - A plate held up
            - A book standing up
            - A party cap from the side
          - title: Shadow
            points:
            - Circle
            - Rectangle
            - Triangle
          alt: A plate held up makes a circle shadow. A book standing up makes a rectangle shadow. A party cap seen from the side makes a triangle shadow.
      - style: real_world
        teach: Shadow puppets use cut-out card shapes in front of a lamp. The audience sees only the outlines on a screen, but they can tell a bird from a horse.
    - teach: Shadows change through the day. In the morning and evening, when the sun is low, shadows are long. At noon, when the sun is high, shadows are short.
      check:
        prompt: When are shadows long?
        options:
        - morning and evening
        - only at noon
        - never
        answer: morning and evening
        why: The sun is low then.
      ways:
      - style: visual
        teach: How a shadow's length changes from morning to evening.
        picture:
          kind: bars
          bars:
          - label: Morning
            value: 8
          - label: Noon
            value: 2
          - label: Evening
            value: 8
          alt: A shadow is long in the morning, short at noon and long again in the evening.
      - style: step_by_step
        teach: 'Watch your shadow through the day. Step 1: In the morning, stand in the sun and look at your shadow: it is long. Step 2: At lunch time, look again: it is short. Step 3: In the evening, look once more: it is long again.'
  items:
  - prompt: What makes a shadow?
    options:
    - something blocking light
    - water
    - wind
    - sound
    answer: something blocking light
    difficulty: 1
    hints:
    - Stand in the sun.
    - Your body stops the light.
    solution: A shadow forms when something blocks light.
    mistakes: {"water": "m2_shadow"}
  - prompt: 'The shadow of a ball looks like a:'
    options:
    - circle
    - square
    - triangle
    - line
    answer: circle
    difficulty: 1
    hints:
    - The ball is round.
    - Outline.
    solution: A ball makes a round shadow.
    mistakes: {"square": "m2_ball_shadow"}
  - prompt: When is your shadow shortest?
    options:
    - at noon
    - in the morning
    - in the evening
    - at night
    answer: at noon
    difficulty: 2
    hints:
    - The sun is right above you.
    - Middle of the day.
    solution: At noon the sun is overhead and shadows are short.
    mistakes: {"in the morning": "m5_noon"}
  - prompt: 'The shadow of a book standing up looks like a:'
    options:
    - rectangle
    - circle
    - star
    - heart
    answer: rectangle
    difficulty: 1
    hints:
    - The book has 4 corners.
    - Long sides.
    solution: A book's shadow is a rectangle.
    mistakes: {"circle": "m2_book_shadow"}
  - prompt: Can you see your shadow on a dark night with no light?
    options:
    - 'no'
    - yes, a dark one
    - yes, a bright one
    answer: 'no'
    difficulty: 2
    hints:
    - A shadow needs light.
    - No light, no shadow.
    solution: Without light there is no shadow.
    mistakes: {"yes, a dark one": "m2_no_light"}
  - prompt: 3 children stand in the sun. How many shadows?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Each child makes one.
    - Count the children.
    solution: 3 children make 3 shadows.
    mistakes: {"1": "m2_shadows", "6": "m2_shadows"}
  - prompt: Your shadow falls behind you. Where is the sun?
    options:
    - in front of you
    - behind you
    - under you
    answer: in front of you
    difficulty: 2
    hints:
    - A shadow is on the side away from the light.
    - If the shadow is behind, the light is ...
    solution: 'Step 1: Shadows fall away from the light. Step 2: The sun is in front.'
    mistakes:
      behind you: c2m4_light
      under you: c2m4_light
  - prompt: 'A triangle cut from card makes a shadow shaped like a:'
    options:
    - triangle
    - circle
    - square
    answer: triangle
    difficulty: 1
    hints:
    - The shadow has the same outline.
    - How many corners does the card have?
    solution: 'Step 1: A shadow copies the outline. Step 2: A triangle.'
    mistakes:
      circle: c2m4_outline
      square: c2m4_outline
  - prompt: Is your shadow short or long at noon?
    options:
    - short
    - long
    - there is no sun at noon
    answer: short
    difficulty: 1
    hints:
    - Where is the sun at noon?
    - High up over your head.
    solution: 'Step 1: At noon the sun is high. Step 2: Shadows are short.'
    mistakes:
      long: c2m4_light
      there is no sun at noon: c2m4_light
  - prompt: 5 trees stand in the sun. How many shadows?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Each tree blocks light.
    - One shadow for each.
    solution: 'Step 1: Each tree makes one shadow. Step 2: 5 shadows.'
    mistakes:
      '1': c2m4_light
      '10': c2m4_light
  - prompt: Which can make a shadow?
    options:
    - a hand in front of a torch
    - a torch with nothing in front
    - a dark room with no light
    answer: a hand in front of a torch
    difficulty: 2
    hints:
    - You need light and something blocking it.
    - Which one has both?
    solution: 'Step 1: Only the hand blocks the torch light. Step 2: That makes a shadow.'
    mistakes:
      a torch with nothing in front: c2m4_light
      a dark room with no light: c2m4_light
  - prompt: 'The shadow of a door looks like a:'
    options:
    - rectangle
    - circle
    - triangle
    answer: rectangle
    difficulty: 1
    hints:
    - What shape is a door?
    - 2 long sides, 2 short.
    solution: 'Step 1: A door is a rectangle. Step 2: Its shadow is too.'
    mistakes:
      circle: c2m4_outline
      triangle: c2m4_outline
  - prompt: A dog moves its tail. What does the tail's shadow do?
    options:
    - moves too
    - stays still
    - goes away for ever
    answer: moves too
    difficulty: 2
    hints:
    - The shadow copies the thing.
    - If the thing moves...
    solution: 'Step 1: The tail blocks light as it moves. Step 2: The shadow moves too.'
    mistakes:
      stays still: c2m4_light
      goes away for ever: c2m4_light
  - prompt: Can a glass of clear water make a dark shadow?
    options:
    - "no, most light passes through it"
    - "yes, a very dark and big one"
    - "only at night, not in the day"
    answer: no, most light passes through it
    difficulty: 3
    hints:
    - Can you see through clear glass?
    - Shadows need light to be blocked.
    solution: 'Step 1: Light goes through clear glass and water. Step 2: Only a faint shadow forms.'
    mistakes:
      "yes, a very dark and big one": c2m4_light
      "only at night, not in the day": c2m4_light
  - prompt: 'In the evening, your shadow is:'
    options:
    - long
    - gone
    - very short
    answer: long
    difficulty: 2
    hints:
    - The sun is low in the evening.
    - Like in the morning.
    solution: 'Step 1: The sun is low. Step 2: Shadows are long.'
    mistakes:
      gone: c2m4_light
      very short: c2m4_light
  - prompt: 'Case: Children play a shadow game in the school playground. At lunch time, their shadows are very short and hard to step on. In the evening, the shadows are easy to step on. Why?'
    options:
    - "At noon the sun is high, so shadows are short; in the evening it is low, so shadows are long"
    - "Shadows are always the same size, so the children must have measured them the wrong way"
    - "Shadows grow bigger when children are hungry, and evening is when they feel most hungry"
    answer: At noon the sun is high, so shadows are short; in the evening it is low, so shadows are long
    hints:
    - Where is the sun at noon?
    - Where is it in the evening?
    solution: When the sun is high at noon, shadows are short. When the sun is low in the evening, shadows are long and easy to step on.
    mistakes:
      "Shadows are always the same size, so the children must have measured them the wrong way": c2m4_light
      "Shadows grow bigger when children are hungry, and evening is when they feel most hungry": c2m4_light
    exam: case
    difficulty: 2
  - prompt: 'Situation: You want to make a shadow of your hand on the wall at night. What do you need?'
    options:
    - "A light, like a torch, shining at your hand"
    - "A dark room with no light on at all"
    - "A glass of water held up near the wall"
    answer: A light, like a torch, shining at your hand
    hints:
    - What does a shadow need to form?
    - Can there be a shadow with no light?
    solution: A shadow forms when something blocks light. You need a torch or a lamp, and your hand must block its light.
    mistakes:
      "A dark room with no light on at all": c2m4_light
      "A glass of water held up near the wall": c2m4_light
    exam: competency
    difficulty: 2
- code: cbse2m.shadow.views
  title: Seeing from different sides
  after:
  - cbse2m.shadow.shadows
  notes: |
    Things look different from the top, front and side. A glass from the top looks like a circle; from the side, a
    rectangle. Tracing outlines; describing position: near/far, on top/below, left/right.
  explanations:
    text: Things look different from different sides. A glass seen from the top looks like a circle. From the side it looks like a rectangle.
    visual: Draw a glass from the side (a rectangle) and from the top (a circle).
    step_by_step: 'Step 1: Choose a side: top, front or side. Step 2: Imagine looking from there. Step 3: Draw the outline you see.'
    real_world: A bird flying above sees the round tops of umbrellas, not their handles.
  picture:
    kind: flow
    steps:
    - Pick a thing
    - Look from the top
    - Look from the side
    - Draw both outlines
    alt: Pick a thing, look from the top, look from the side, and draw both outlines.
  activity:
    type: sort
    prompt: A glass seen from where?
    bins:
    - From the top
    - From the side
    items:
    - label: Looks like a circle
      bin: From the top
      clue: Look down into the glass.
      why: 'Looking down, you see the round rim: a circle.'
    - label: Looks like a rectangle
      bin: From the side
      clue: Look at it standing on the table.
      why: From the side, the glass looks tall and straight.
    - label: You can see inside it
      bin: From the top
      clue: Where must your eyes be to see inside?
      why: Only from above can you see inside.
    - label: You can see how tall it is
      bin: From the side
      clue: How do you see its height?
      why: Height shows from the side.
  lesson:
    - teach: Things look different from different sides. A glass seen from the top looks like a circle. From the side, it looks like a rectangle.
      picture:
        kind: compare
        columns:
        - title: From the top
          points:
          - 'glass: circle'
          - 'dice: square'
        - title: From the side
          points:
          - 'glass: rectangle'
          - 'cone: triangle'
        alt: The same thing seen from the top and from the side.
      check:
        prompt: 'A tin seen from the top looks like a:'
        options:
        - circle
        - triangle
        - rectangle
        answer: circle
        why: The top of a tin is round.
      ways:
      - style: visual
        teach: A cup looks different from the top and from the side.
        picture:
          kind: compare
          columns:
          - title: From the top
            points:
            - Circle
          - title: From the side
            points:
            - Rectangle
          alt: A cup seen from the top looks like a circle. Seen from the side, it looks like a rectangle.
      - style: step_by_step
        teach: 'Look at a tin from two sides. Step 1: Put a tin on the table. Step 2: Stand up and look straight down at it: you see a circle. Step 3: Bend down and look at it from the side: you see a rectangle.'
    - teach: 'Position words tell where things are: on, under, above, below, near, far, left, right. The cup is on the table. The cat is under the table.'
      check:
        prompt: The fan is ___ the table.
        options:
        - above
        - under
        - inside
        answer: above
        why: The fan is up near the ceiling.
      ways:
      - style: visual
        teach: Position words in pairs that mean the opposite.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - 'on'
            - above
            - near
            - inside
          - title: Opposite
            points:
            - 'off'
            - below
            - far
            - outside
          alt: The opposite of on is off, of above is below, of near is far, and of inside is outside.
      - style: real_world
        teach: When your parent asks you to find their keys, they might say, 'They are on the shelf, next to the radio, behind the box.' Position words help you find things.
    - teach: Things far away look small. Things near look big. A bus far down the road looks tiny, but it is really big.
      check:
        prompt: Why does a far-away bus look small?
        options:
        - because it is far away
        - because it shrank
        - because it is a toy
        answer: because it is far away
        why: Far things look smaller than they are.
      ways:
      - style: real_world
        teach: An aeroplane high in the sky looks as small as a bird. When you see one at an airport, it is bigger than a bus.
      - style: visual
        teach: Near things look big; far things look small.
        picture:
          kind: compare
          columns:
          - title: Near you
            points:
            - A tree looks big
            - A car looks big
          - title: Far away
            points:
            - A tree looks tiny
            - A car looks like a toy
          alt: A tree and a car near you look big. Far away, a tree looks tiny and a car looks like a toy, even though they are the same size.
  items:
  - prompt: 'A glass seen from the top looks like a:'
    options:
    - circle
    - triangle
    - square
    - line
    answer: circle
    difficulty: 1
    hints:
    - Look into the glass.
    - Round rim.
    solution: From the top it is a circle.
    mistakes: {"square": "m4_glass_top"}
  - prompt: 'A cone seen from the side looks like a:'
    options:
    - triangle
    - circle
    - square
    - star
    answer: triangle
    difficulty: 2
    hints:
    - Pointed top, flat bottom.
    - Three corners.
    solution: A cone from the side looks like a triangle.
    mistakes: {"circle": "m4_cone_front"}
  - prompt: The cup is on the table. The table is ___ the cup.
    options:
    - below
    - on top of
    - inside
    - behind
    answer: below
    difficulty: 1
    hints:
    - The cup is higher.
    - The table holds it up.
    solution: The table is below the cup.
    mistakes: {"on top of": "m2_table_below"}
  - prompt: Which looks smaller?
    options:
    - a tree far away
    - a tree near you
    - both look the same size
    answer: a tree far away
    difficulty: 2
    hints:
    - Far things look small.
    - Think of a plane in the sky.
    solution: Things far away look smaller.
    mistakes: {"a tree near you": "m2_far_small"}
  - prompt: 'A dice seen from the top looks like a:'
    options:
    - square
    - circle
    - triangle
    - rectangle that is very long
    answer: square
    difficulty: 1
    hints:
    - All faces are equal.
    - 4 equal sides.
    solution: The top of a dice is a square.
    mistakes: {"circle": "m3_dice_face"}
  - prompt: How many sides does the top of a dice have?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - It is a square.
    - Count the edges.
    solution: A square has 4 sides.
    mistakes: {"6": "m2_square_sides", "3": "m2_square_sides"}
  - prompt: 'A ball seen from any side looks like a:'
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 1
    hints:
    - A ball is round all over.
    - Turn it any way.
    solution: 'Step 1: A ball is round from every side. Step 2: A circle.'
    mistakes:
      square: c2m4_view
      triangle: c2m4_view
  - prompt: 'A book lying flat, seen from the top, looks like a:'
    options:
    - rectangle
    - circle
    - triangle
    answer: rectangle
    difficulty: 1
    hints:
    - Look at the cover.
    - 2 long and 2 short sides.
    solution: 'Step 1: The cover has 4 sides, 2 long and 2 short. Step 2: A rectangle.'
    mistakes:
      circle: c2m4_view
      triangle: c2m4_view
  - prompt: The shoes are ___ the bed.
    options:
    - under
    - above
    - on top of the fan
    answer: under
    difficulty: 1
    hints:
    - Shoes are on the floor.
    - The bed is higher.
    solution: 'Step 1: Shoes are on the floor. Step 2: They are under the bed.'
    mistakes:
      above: c2m4_view
      on top of the fan: c2m4_view
  - prompt: Which looks bigger?
    options:
    - a cat near you
    - an elephant very far away
    - a house very far away
    answer: a cat near you
    difficulty: 2
    hints:
    - Near things look big.
    - Far things look small.
    solution: 'Step 1: The elephant and house are far away. Step 2: The near cat looks bigger.'
    mistakes:
      an elephant very far away: c2m4_view
      a house very far away: c2m4_view
  - prompt: 'A party cap seen from the top looks like a:'
    options:
    - circle
    - triangle
    - square
    answer: circle
    difficulty: 2
    hints:
    - Look down at the point.
    - The round edge is around it.
    solution: 'Step 1: From the top you see the round edge. Step 2: A circle.'
    mistakes:
      triangle: c2m4_view
      square: c2m4_view
  - prompt: 'A box seen from the front looks like a:'
    options:
    - rectangle or square
    - circle
    - triangle
    answer: rectangle or square
    difficulty: 2
    hints:
    - A box has flat faces.
    - Each face has 4 corners.
    solution: 'Step 1: The front face has 4 corners. Step 2: A rectangle or square.'
    mistakes:
      circle: c2m4_view
      triangle: c2m4_view
  - prompt: Riya sits to the left of Sam. Sam sits to the ___ of Riya.
    options:
    - right
    - left
    - top
    answer: right
    difficulty: 3
    hints:
    - Swap the names.
    - Left and right are opposites.
    solution: 'Step 1: Riya is on the left. Step 2: So Sam is on the right of Riya.'
    mistakes:
      left: c2m4_view
      top: c2m4_view
  - prompt: A bird flies ___ the tree.
    options:
    - above
    - under the ground below
    - inside the trunk
    answer: above
    difficulty: 1
    hints:
    - Birds fly in the sky.
    - Higher than the tree.
    solution: 'Step 1: The bird is higher. Step 2: It is above the tree.'
    mistakes:
      under the ground below: c2m4_view
      inside the trunk: c2m4_view
  - prompt: How many corners does the top of a box have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - The top is a rectangle.
    - Count the corners.
    solution: 'Step 1: The top is a rectangle. Step 2: 4 corners.'
    mistakes:
      '3': c2m4_view
      '6': c2m4_view
  - prompt: 'Case: A child looks out of a window at a train far away and says, ''That train is so small, it must be a toy train.'' Is the child right?'
    options:
    - No, it only looks small because it is far away
    - Yes, it is a toy train
    - Yes, trains get smaller when they move
    answer: No, it only looks small because it is far away
    hints:
    - How do far-away things look?
    - Does a train really change size?
    solution: Things far away look small. The train is really big; it only looks small because it is far away.
    mistakes:
      Yes, it is a toy train: c2m4_view
      Yes, trains get smaller when they move: c2m4_view
    exam: case
    difficulty: 2
  - prompt: 'Situation: You look straight down at a round birthday cake from the top. What shape do you see?'
    options:
    - A circle
    - A rectangle
    - A triangle
    answer: A circle
    hints:
    - Imagine standing over the cake and looking down.
    - What shape is its top?
    solution: A round cake seen from the top looks like a circle.
    mistakes:
      A rectangle: c2m4_view
      A triangle: c2m4_view
    exam: competency
    difficulty: 2
