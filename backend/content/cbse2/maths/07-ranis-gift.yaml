# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 7. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 7
title: Rani's Gift
concepts:
- code: cbse2m.gift.add
  title: Adding two-digit numbers
  notes: |
    Adding two-digit numbers: add the ones, then the tens; with and without carrying (making a new ten). Stories of
    gifts, sweets and money. Adding by counting on in tens.
  explanations:
    text: 'To add 24 and 13, add the ones first: 4 + 3 = 7. Then add the tens: 20 + 10 = 30. Together, 37. If the ones make 10 or more, make a new ten.'
    visual: 'Draw 24 as 2 bundles and 4 sticks, and 13 as 1 bundle and 3 sticks. Put them together: 3 bundles and 7 sticks = 37.'
    step_by_step: 'Step 1: Add the ones. Step 2: If 10 or more, make a ten. Step 3: Add the tens. Step 4: Put them together.'
    real_world: Rani adds the price of two gifts to know how much money she needs.
  picture:
    kind: number_line
    from: 20
    to: 40
    step: 2
    points:
    - at: 24
      label: '24'
    - at: 37
      label: '37'
    alt: 'Adding 13 to 24 on a number line: jump 10 to 34, then 3 more to 37.'
    jumps:
    - from: 24
      to: 34
      label: '+10'
    - from: 34
      to: 37
      label: '+3'
  items:
  - prompt: 24 + 13 = ?
    answer: '37'
    check: 24 + 13
    difficulty: 1
    hints:
    - 'Ones: 4 + 3.'
    - 'Tens: 20 + 10.'
    solution: 24 + 13 = 37.
    mistakes:
      '73': c2_tens_ones
  - prompt: 30 + 20 = ?
    answer: '50'
    check: 30 + 20
    difficulty: 1
    hints:
    - 3 tens and 2 tens.
    - 5 tens.
    solution: 30 + 20 = 50.
    mistakes:
      '5': c2_tens_ones
  - prompt: Rani has 15 sweets and gets 12 more. How many?
    answer: '27'
    check: 15 + 12
    difficulty: 1
    hints:
    - 'Ones: 5 + 2.'
    - 'Tens: 10 + 10.'
    solution: 15 + 12 = 27.
  - prompt: 28 + 5 = ?
    answer: '33'
    check: 28 + 5
    difficulty: 2
    hints:
    - '8 + 5 = 13: one new ten.'
    - 20 + 13.
    solution: 28 + 5 = 33.
    mistakes:
      '23': c2_tens_ones
      '213': c2_tens_ones
  - prompt: A gift costs 36 rupees and a card 18 rupees. Total?
    answer: '54'
    check: 36 + 18
    difficulty: 2
    hints:
    - 'Ones: 6 + 8 = 14, carry 1 ten.'
    - 'Tens: 30 + 10 + 10.'
    solution: 36 + 18 = 54.
    mistakes:
      '44': c2_tens_ones
      '414': c2_tens_ones
  - prompt: 45 + 10 = ?
    answer: '55'
    check: 45 + 10
    difficulty: 1
    hints:
    - Adding 10 adds one ten.
    - The ones stay the same.
    solution: 45 + 10 = 55.
    mistakes:
      '46': c2_tens_ones
- code: cbse2m.gift.sub
  title: Taking away two-digit numbers
  after:
  - cbse2m.gift.add
  notes: |
    Subtracting two-digit numbers: take away the ones, then the tens; with and without borrowing (breaking a ten).
    How many are left; how many more; checking by adding back.
  explanations:
    text: 'To take 12 from 38: ones first, 8 − 2 = 6; then tens, 30 − 10 = 20. Answer 26. If there are not enough ones, break a ten into 10 ones.'
    visual: 'Draw 38 as 3 bundles and 8 sticks. Cross out 1 bundle and 2 sticks. 2 bundles and 6 sticks are left: 26.'
    step_by_step: 'Step 1: Take away the ones. Step 2: If not enough ones, break a ten. Step 3: Take away the tens. Step 4: Check by adding back.'
    real_world: If Rani had 50 rupees and spent 20, she counts what is left.
  picture:
    kind: number_line
    from: 20
    to: 40
    step: 2
    points:
    - at: 38
      label: '38'
    - at: 26
      label: '26'
    alt: 'Taking 12 from 38 on a number line: jump back 10 to 28, then 2 more to 26.'
    jumps:
    - from: 38
      to: 28
      label: −10
    - from: 28
      to: 26
      label: −2
  items:
  - prompt: 38 − 12 = ?
    answer: '26'
    check: 38 - 12
    difficulty: 1
    hints:
    - 'Ones: 8 − 2.'
    - 'Tens: 30 − 10.'
    solution: 38 − 12 = 26.
    mistakes:
      '50': c2_count_once
  - prompt: 50 − 20 = ?
    answer: '30'
    check: 50 - 20
    difficulty: 1
    hints:
    - 5 tens take away 2 tens.
    - 3 tens.
    solution: 50 − 20 = 30.
    mistakes:
      '70': c2_count_once
  - prompt: Rani had 25 beads. She gave away 4. How many are left?
    answer: '21'
    check: 25 - 4
    difficulty: 1
    hints:
    - Take away 4 ones.
    - 25 − 4.
    solution: 25 − 4 = 21.
    mistakes:
      '29': c2_count_once
  - prompt: 32 − 7 = ?
    answer: '25'
    check: 32 - 7
    difficulty: 2
    hints:
    - 'Not enough ones: break a ten.'
    - 12 − 7 = 5, and 2 tens left.
    solution: 32 − 7 = 25.
    mistakes:
      '35': c2_tens_ones
      '39': c2_count_once
  - prompt: Rani has 45 rupees. A ribbon costs 18. How much is left?
    answer: '27'
    check: 45 - 18
    difficulty: 2
    hints:
    - 'Break a ten: 15 − 8 = 7.'
    - 'Tens: 3 − 1 = 2.'
    solution: 45 − 18 = 27.
    mistakes:
      '33': c2_tens_ones
      '63': c2_count_once
  - prompt: 26 + 12 = 38. So 38 − 12 = ?
    options:
    - '26'
    - '50'
    - '12'
    - '38'
    answer: '26'
    difficulty: 2
    hints:
    - Adding and taking away undo each other.
    - Go back.
    solution: If 26 + 12 = 38, then 38 − 12 = 26.
