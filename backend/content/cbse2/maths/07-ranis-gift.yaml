# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 7. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 7
title: Rani's Gift
tips:
  m2_undo: "Taking away 12 undoes adding 12. Where did we start?"
  c2m7_ones: Add the ones first. If they make 10 or more, make a new ten and add it to the tens.
  c2m7_borrow: If the top ones are too few, break one ten into 10 ones first.
  c2m7_back: Check by adding your answer back to the number you took away.

concepts:
- code: cbse2m.gift.add
  title: Adding two-digit numbers
  notes: |
    Adding two-digit numbers: add the ones, then the tens; with and without carrying (making a new ten). Stories of
    gifts, sweets and money. Adding by counting on in tens.
  explanations:
    text: 'To add 24 and 13, add the ones first: 4 + 3 = 7. Then add the tens: 20 + 10 = 30. Together, 37. If the ones make 10 or more, make a new ten.'
    visual: 'Draw 24 as 2 bundles and 4 sticks, and 13 as 1 bundle and 3 sticks. Put them together: 3 bundles and 7 sticks = 37.'
    step_by_step: 'Step 1: Add the ones. Step 2: If 10 or more, make a ten. Step 3: Add the tens. Step 4: Put them together.'
    real_world: Rani adds the price of two gifts to know how much money is needed.
  picture:
    kind: number_line
    from: 20
    to: 40
    step: 2
    points:
    - at: 24
      label: '24'
    - at: 37
      label: '37'
    alt: 'Adding 13 to 24 on a number line: jump 10 to 34, then 3 more to 37.'
    jumps:
    - from: 24
      to: 34
      label: '+10'
    - from: 34
      to: 37
      label: '+3'
  activity:
    type: sort
    prompt: Find the total. Add the ones first, then the tens.
    bins:
    - '37'
    - '49'
    - '62'
    - '80'
    items:
    - label: 24 + 13
      bin: '37'
      clue: 'Ones: 4 + 3. Tens: 20 + 10.'
      why: 7 ones and 3 tens make 37.
    - label: 32 + 17
      bin: '49'
      clue: 'Ones: 2 + 7. Tens: 30 + 10.'
      why: 9 ones and 4 tens make 49.
    - label: 45 + 17
      bin: '62'
      clue: 'Ones: 5 + 7 is more than 9. Make a ten!'
      why: '5 + 7 = 12: write 2, carry 1 ten. 40 + 10 + 10 = 60. Total 62. If you got 52, the carried ten was lost.'
    - label: 26 + 11
      bin: '37'
      clue: 'Ones: 6 + 1. Tens: 20 + 10.'
      why: '7 ones and 3 tens: 37.'
    - label: 53 + 27
      bin: '80'
      clue: 'Ones: 3 + 7 = 10. That''s a full ten!'
      why: '3 + 7 = 10 ones: 0 ones and carry 1 ten. 50 + 20 + 10 = 80. If you got 70, the carried ten was lost.'
    - label: 38 + 24
      bin: '62'
      clue: 'Ones: 8 + 4 is more than 9.'
      why: '8 + 4 = 12: carry the ten. 30 + 20 + 10 = 60, so 62.'
    - label: 41 + 8
      bin: '49'
      clue: 'Only ones to add: 1 + 8.'
      why: '41 + 8 = 49. Don''t add 8 to the tens: that would be 121.'
  lesson:
    - teach: 'To add two-digit numbers, add the ones, then add the tens. 23 + 14: ones 3 + 4 = 7, tens 2 + 1 = 3. Answer 37.'
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: tens
        - size: 1
          label: ones
        rows:
        - size: 1
          label: '23'
        - size: 1
          label: '+14'
        - size: 1
          label: sum
        cells:
        - - '2'
          - '3'
        - - '1'
          - '4'
        - - '3'
          - '7'
        alt: '23 + 14 in tens and ones: 3 tens and 7 ones make 37.'
      check:
        prompt: 31 + 25 = ?
        options:
        - '56'
        - '65'
        - '506'
        answer: '56'
        why: 1 + 5 = 6 ones, 3 + 2 = 5 tens.
    - teach: 'If the ones make 10 or more, make a new ten. 27 + 5: 7 + 5 = 12, that is 1 ten and 2 ones. So 20 + 10 + 2 = 32.'
      check:
        prompt: 18 + 4 = ?
        options:
        - '22'
        - '12'
        - '112'
        answer: '22'
        why: '8 + 4 = 12, one new ten: 10 + 10 + 2 = 22.'
    - teach: 'Adding tens is easy: 40 + 30 = 70. Count on in tens: 40, 50, 60, 70.'
      check:
        prompt: 20 + 50 = ?
        options:
        - '70'
        - '25'
        - '205'
        answer: '70'
        why: 2 tens + 5 tens = 7 tens.
  items:
  - prompt: 24 + 13 = ?
    answer: '37'
    check: 24 + 13
    difficulty: 1
    hints:
    - 'Ones: 4 + 3.'
    - 'Tens: 20 + 10.'
    solution: 24 + 13 = 37.
    mistakes:
      '73': c2_tens_ones
  - prompt: 30 + 20 = ?
    answer: '50'
    check: 30 + 20
    difficulty: 1
    hints:
    - 3 tens and 2 tens.
    - 5 tens.
    solution: 30 + 20 = 50.
    mistakes:
      '5': c2_tens_ones
  - prompt: Rani has 15 sweets and gets 12 more. How many?
    answer: '27'
    check: 15 + 12
    difficulty: 1
    hints:
    - 'Ones: 5 + 2.'
    - 'Tens: 10 + 10.'
    solution: 15 + 12 = 27.
    mistakes: {"3": "m3_add_places", "26": "m3_add_places"}
  - prompt: 28 + 5 = ?
    answer: '33'
    check: 28 + 5
    difficulty: 2
    hints:
    - '8 + 5 = 13: one new ten.'
    - 20 + 13.
    solution: 28 + 5 = 33.
    mistakes:
      '23': c2_tens_ones
      '213': c2_tens_ones
  - prompt: A gift costs 36 rupees and a card 18 rupees. Total?
    answer: '54'
    check: 36 + 18
    difficulty: 2
    hints:
    - 'Ones: 6 + 8 = 14, carry 1 ten.'
    - 'Tens: 30 + 10 + 10.'
    solution: 36 + 18 = 54.
    mistakes:
      '44': c2_tens_ones
      '414': c2_tens_ones
  - prompt: 45 + 10 = ?
    answer: '55'
    check: 45 + 10
    difficulty: 1
    hints:
    - Adding 10 adds one ten.
    - The ones stay the same.
    solution: 45 + 10 = 55.
    mistakes:
      '46': c2_tens_ones
  - prompt: 42 + 35 = ?
    answer: '77'
    check: 42+35
    difficulty: 1
    hints:
    - 'Ones: 2 + 5.'
    - 'Tens: 4 + 3.'
    solution: 'Step 1: 2 + 5 = 7, 4 + 3 = 7. Step 2: = 77.'
    mistakes:
      '7': c2m7_ones
      '717': c2m7_ones
  - prompt: 60 + 30 = ?
    answer: '90'
    check: 60+30
    difficulty: 1
    hints:
    - Count in tens from 60.
    - 70, 80, 90.
    solution: 'Step 1: 6 tens + 3 tens. Step 2: = 90.'
    mistakes:
      '63': c2m7_ones
      '36': c2m7_ones
  - prompt: 19 + 6 = ?
    answer: '25'
    check: 19+6
    difficulty: 2
    hints:
    - 9 + 6 makes more than 10.
    - Make a new ten.
    solution: 'Step 1: 9 + 6 = 15. Step 2: 10 + 15 = 25.'
    mistakes:
      '15': c2m7_ones
      '115': c2m7_ones
  - prompt: Rani buys a ribbon for 12 rupees and a card for 23 rupees. Total?
    answer: '35'
    check: 12+23
    difficulty: 1
    hints:
    - Put the prices together.
    - Ones, then tens.
    solution: 'Step 1: 2 + 3 = 5, 1 + 2 = 3. Step 2: = 35 rupees.'
    mistakes:
      '11': c2m7_back
      '53': c2m7_ones
  - prompt: 26 + 26 = ?
    answer: '52'
    check: 26+26
    difficulty: 2
    hints:
    - 6 + 6 = 12.
    - Make a new ten.
    solution: 'Step 1: 6 + 6 = 12, carry 1 ten. Step 2: 20 + 20 + 10 + 2 = 52.'
    mistakes:
      '42': c2m7_ones
      '412': c2m7_ones
  - prompt: A box has 30 chocolates. 15 more are added. How many now?
    answer: '45'
    check: 30+15
    difficulty: 1
    hints:
    - 30 has no ones.
    - 30 + 10 + 5.
    solution: 'Step 1: 30 + 15. Step 2: = 45.'
    mistakes:
      '15': c2m7_back
      '35': c2m7_ones
  - prompt: 37 + 10 = ?
    answer: '47'
    check: 37+10
    difficulty: 1
    hints:
    - Adding 10 adds 1 ten.
    - The ones stay the same.
    solution: 'Step 1: 3 tens + 1 ten = 4 tens. Step 2: 47.'
    mistakes:
      '38': c2m7_ones
      '137': c2m7_ones
  - prompt: Rani has 28 stickers. A friend gives 15. How many now?
    answer: '43'
    check: 28+15
    difficulty: 3
    hints:
    - 8 + 5 makes more than 10.
    - Make a new ten.
    solution: 'Step 1: 8 + 5 = 13. Step 2: 20 + 10 + 13 = 43.'
    mistakes:
      '33': c2m7_ones
      '313': c2m7_ones
  - prompt: Which two add to 50?
    options:
    - 25 and 25
    - 20 and 20
    - 40 and 20
    answer: 25 and 25
    difficulty: 3
    hints:
    - Add each pair.
    - Which pair makes exactly 50?
    solution: 'Step 1: 25 + 25 = 50; 20 + 20 = 40; 40 + 20 = 60. Step 2: 25 and 25.'
    mistakes:
      20 and 20: c2m7_ones
      40 and 20: c2m7_ones
- code: cbse2m.gift.sub
  title: Taking away two-digit numbers
  after:
  - cbse2m.gift.add
  notes: |
    Subtracting two-digit numbers: take away the ones, then the tens; with and without borrowing (breaking a ten).
    How many are left; how many more; checking by adding back.
  explanations:
    text: 'To take 12 from 38: ones first, 8 − 2 = 6; then tens, 30 − 10 = 20. Answer 26. If there are not enough ones, break a ten into 10 ones.'
    visual: 'Draw 38 as 3 bundles and 8 sticks. Cross out 1 bundle and 2 sticks. 2 bundles and 6 sticks are left: 26.'
    step_by_step: 'Step 1: Take away the ones. Step 2: If not enough ones, break a ten. Step 3: Take away the tens. Step 4: Check by adding back.'
    real_world: If Rani had 50 rupees and spent 20, Rani counts what is left.
  picture:
    kind: number_line
    from: 20
    to: 40
    step: 2
    points:
    - at: 38
      label: '38'
    - at: 26
      label: '26'
    alt: 'Taking 12 from 38 on a number line: jump back 10 to 28, then 2 more to 26.'
    jumps:
    - from: 38
      to: 28
      label: −10
    - from: 28
      to: 26
      label: −2
  activity:
    type: sort
    prompt: Take away. Ones first, then tens.
    bins:
    - '26'
    - '18'
    - '35'
    - '9'
    items:
    - label: 38 − 12
      bin: '26'
      clue: 'Ones: 8 − 2. Tens: 30 − 10.'
      why: '6 ones and 2 tens: 26.'
    - label: 42 − 24
      bin: '18'
      clue: 'Ones: 2 − 4? Not enough! Break a ten.'
      why: 'Break a ten: 12 − 4 = 8; tens 3 − 2 = 1. Answer 18. 22 would mean you did 4 − 2 instead.'
    - label: 47 − 12
      bin: '35'
      clue: 'Ones: 7 − 2. Tens: 40 − 10.'
      why: '5 ones and 3 tens: 35.'
    - label: 30 − 21
      bin: '9'
      clue: 'Ones: 0 − 1? Break a ten.'
      why: 10 − 1 = 9 ones; tens 2 − 2 = 0. Answer 9.
    - label: 50 − 32
      bin: '18'
      clue: 'Ones: 0 − 2? Break a ten.'
      why: 10 − 2 = 8; tens 4 − 3 = 1. 18.
    - label: 56 − 21
      bin: '35'
      clue: 'Ones: 6 − 1. Tens: 50 − 20.'
      why: '5 ones and 3 tens: 35.'
  lesson:
    - teach: 'To take away, take the ones, then the tens. 47 − 23: ones 7 − 3 = 4, tens 4 − 2 = 2. Answer 24.'
      check:
        prompt: 58 − 32 = ?
        options:
        - '26'
        - '90'
        - '36'
        answer: '26'
        why: 8 − 2 = 6 ones, 5 − 3 = 2 tens.
    - teach: 'If the top ones are too few, break a ten. 32 − 7: 2 − 7 cannot be done, so break 1 ten: 12 − 7 = 5, and 2 tens are left. Answer 25.'
      picture:
        kind: flow
        steps:
        - 32 − 7
        - '2 < 7: break a ten'
        - 12 − 7 = 5
        - 2 tens left
        - '25'
        alt: Steps for 32 − 7 by breaking a ten.
      check:
        prompt: 24 − 6 = ?
        options:
        - '18'
        - '22'
        - '20'
        answer: '18'
        why: '14 − 6 = 8, and 1 ten is left: 18.'
    - teach: Check by adding back. If 40 − 15 = 25, then 25 + 15 should be 40.
      check:
        prompt: If 30 − 12 = 18, what is 18 + 12?
        options:
        - '30'
        - '6'
        - '18'
        answer: '30'
        why: Adding back gives the start.
  items:
  - prompt: 38 − 12 = ?
    answer: '26'
    check: 38 - 12
    difficulty: 1
    hints:
    - 'Ones: 8 − 2.'
    - 'Tens: 30 − 10.'
    solution: 38 − 12 = 26.
    mistakes:
      '50': c2_count_once
  - prompt: 50 − 20 = ?
    answer: '30'
    check: 50 - 20
    difficulty: 1
    hints:
    - 5 tens take away 2 tens.
    - 3 tens.
    solution: 50 − 20 = 30.
    mistakes:
      '70': c2_count_once
  - prompt: Rani had 25 beads and gave away 4. How many are left?
    answer: '21'
    check: 25 - 4
    difficulty: 1
    hints:
    - Take away 4 ones.
    - 25 − 4.
    solution: 25 − 4 = 21.
    mistakes:
      '29': c2_count_once
  - prompt: 32 − 7 = ?
    answer: '25'
    check: 32 - 7
    difficulty: 2
    hints:
    - 'Not enough ones: break a ten.'
    - 12 − 7 = 5, and 2 tens left.
    solution: 32 − 7 = 25.
    mistakes:
      '35': c2_tens_ones
      '39': c2_count_once
  - prompt: Rani has 45 rupees. A ribbon costs 18. How much is left?
    answer: '27'
    check: 45 - 18
    difficulty: 2
    hints:
    - 'Break a ten: 15 − 8 = 7.'
    - 'Tens: 3 − 1 = 2.'
    solution: 45 − 18 = 27.
    mistakes:
      '33': c2_tens_ones
      '63': c2_count_once
  - prompt: 26 + 12 = 38. So 38 − 12 = ?
    options:
    - '26'
    - '50'
    - '12'
    - '38'
    answer: '26'
    difficulty: 2
    hints:
    - Adding and taking away undo each other.
    - Go back.
    solution: If 26 + 12 = 38, then 38 − 12 = 26.
    mistakes: {"50": "m2_undo"}
  - prompt: 69 − 25 = ?
    answer: '44'
    check: 69-25
    difficulty: 1
    hints:
    - 'Ones: 9 − 5.'
    - 'Tens: 6 − 2.'
    solution: 'Step 1: 9 − 5 = 4, 6 − 2 = 4. Step 2: = 44.'
    mistakes:
      '94': c2m7_back
      '34': c2m7_borrow
  - prompt: 80 − 30 = ?
    answer: '50'
    check: 80-30
    difficulty: 1
    hints:
    - Count back in tens.
    - 70, 60, 50.
    solution: 'Step 1: 8 tens − 3 tens. Step 2: = 50.'
    mistakes:
      '110': c2m7_back
      '53': c2m7_borrow
  - prompt: 41 − 5 = ?
    answer: '36'
    check: 41-5
    difficulty: 2
    hints:
    - 1 − 5 cannot be done.
    - Break a ten.
    solution: 'Step 1: 11 − 5 = 6. Step 2: 3 tens left: 36.'
    mistakes:
      '44': c2m7_borrow
      '46': c2m7_borrow
  - prompt: Rani had 30 rupees and bought a pen for 14. How much is left?
    answer: '16'
    check: 30-14
    difficulty: 2
    hints:
    - 0 − 4 needs a broken ten.
    - 10 − 4, then 2 − 1.
    solution: 'Step 1: 10 − 4 = 6. Step 2: 2 − 1 = 1 ten: 16.'
    mistakes:
      '26': c2m7_borrow
      '44': c2m7_back
  - prompt: There are 25 birds. 10 fly away. How many are left?
    answer: '15'
    check: 25-10
    difficulty: 1
    hints:
    - Take away 1 ten.
    - The ones stay.
    solution: 'Step 1: 2 tens − 1 ten. Step 2: 15.'
    mistakes:
      '35': c2m7_back
      '24': c2m7_borrow
  - prompt: Rani has 18 beads and Mina has 12. How many more beads does Rani have?
    answer: '6'
    check: 18-12
    difficulty: 2
    hints:
    - Bigger minus smaller.
    - 18 − 12.
    solution: 'Step 1: 18 − 12. Step 2: = 6 more.'
    mistakes:
      '30': c2m7_back
      '16': c2m7_borrow
  - prompt: 50 − 8 = ?
    answer: '42'
    check: 50-8
    difficulty: 2
    hints:
    - 0 − 8 needs a broken ten.
    - 10 − 8 = 2.
    solution: 'Step 1: 10 − 8 = 2. Step 2: 4 tens left: 42.'
    mistakes:
      '58': c2m7_borrow
      '48': c2m7_borrow
  - prompt: You worked out 35 − 17 = 18. Which sum checks it?
    options:
    - 18 + 17
    - 35 + 17
    - 18 + 35
    answer: 18 + 17
    difficulty: 2
    hints:
    - Add the answer to the number taken away.
    - You should get 35.
    solution: 'Step 1: 18 + 17 = 35. Step 2: It matches.'
    mistakes:
      35 + 17: c2m7_back
      18 + 35: c2m7_back
  - prompt: Rani had 60 beads. Rani used 25 for a necklace and 10 for a bracelet. How many beads are left?
    answer: '25'
    check: 60-25-10
    difficulty: 3
    hints:
    - Take away one amount, then the other.
    - 60 − 25 first.
    solution: 'Step 1: 60 − 25 = 35. Step 2: 35 − 10 = 25.'
    mistakes:
      '35': c2m7_back
      '95': c2m7_back
