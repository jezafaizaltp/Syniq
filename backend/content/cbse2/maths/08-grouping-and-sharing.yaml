# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 8
title: Grouping and Sharing
tips:
  c2m8_groups: Draw the groups as circles and put the same number in each. Then count all.
  c2m8_deal: Give one to each person, again and again, until none are left. Count one pile.
  c2m8_equal: Look at each group. Do they all have the same number?
concepts:
- code: cbse2m.group.groups
  title: Equal groups
  notes: |
    Making equal groups: 3 groups of 4 = 4 + 4 + 4 = 12. Repeated addition as the start of multiplication. Counting
    wheels, legs, eyes.
  explanations:
    text: 'Equal groups have the same number in each. 3 plates with 4 laddoos each: 4 + 4 + 4 = 12 laddoos. Adding the same number again and again is quick counting.'
    visual: 'Draw 3 plates, each with 4 laddoos. Count: 4, 8, 12.'
    step_by_step: 'Step 1: Count how many in one group. Step 2: Count the groups. Step 3: Add the same number that many times.'
    real_world: A cycle has 2 wheels; 4 cycles have 2 + 2 + 2 + 2 = 8 wheels.
  picture:
    kind: bars
    bars:
    - label: plate 1
      value: 4
    - label: plate 2
      value: 4
    - label: plate 3
      value: 4
    alt: 'Three plates with 4 laddoos each: 4 + 4 + 4 = 12.'
    unit: laddoos
  activity:
    type: number_line
    min: 0
    max: 30
    step: 1
    start: 0
    prompt: 'Equal groups: add the same number again and again.'
    goals:
    - prompt: 3 plates, 4 laddoos each
      target: 12
      mistakes:
      - when:
          v: 7
        say: 'That adds 3 and 4. Each plate has 4: 4 + 4 + 4.'
      - when:
          v: 8
        say: That's two plates. Add the third.
    - prompt: 5 bags, 2 apples each
      target: 10
      mistakes:
      - when:
          v: 7
        say: 'That adds 5 and 2. Count in twos: 2, 4, 6, 8, 10.'
    - prompt: 4 cars, 4 wheels each
      target: 16
      mistakes:
      - when:
          v: 8
        say: 'That adds 4 and 4 once. There are 4 cars: 4 + 4 + 4 + 4.'
      - when:
          v: 12
        say: That's 3 cars. Add one more 4.
  lesson:
    - teach: Equal groups have the same number in each group. 3 plates with 2 idlis on every plate are equal groups.
      picture:
        kind: compare
        columns:
        - title: Plate 1
          points:
          - 2 idlis
        - title: Plate 2
          points:
          - 2 idlis
        - title: Plate 3
          points:
          - 2 idlis
        alt: '3 plates with 2 idlis each: 6 idlis.'
      check:
        prompt: 3 plates with 2 idlis each. How many idlis?
        options:
        - '6'
        - '5'
        - '32'
        answer: '6'
        why: 2 + 2 + 2 = 6.
    - teach: 'To count equal groups, add the same number again: 4 groups of 3 = 3 + 3 + 3 + 3 = 12. Or skip count: 3, 6, 9, 12.'
      check:
        prompt: 2 + 2 + 2 + 2 = ?
        options:
        - '8'
        - '6'
        - '10'
        answer: '8'
        why: 'Skip count by 2 four times: 2, 4, 6, 8.'
    - teach: Groups are only equal if every group has the same number. A bag of 3 and a bag of 5 are not equal groups.
      check:
        prompt: Which are equal groups?
        options:
        - 4 and 4 and 4
        - 4 and 2 and 4
        - 1 and 4 and 3
        answer: 4 and 4 and 4
        why: Every group has 4.
  items:
  - prompt: 3 plates with 4 laddoos each. How many laddoos?
    answer: '12'
    check: 3*4
    difficulty: 1
    hints:
    - 4 + 4 + 4.
    - Count in fours.
    solution: 4 + 4 + 4 = 12.
    mistakes:
      '7': c2_count_once
  - prompt: 4 cycles. Each has 2 wheels. How many wheels?
    answer: '8'
    check: 4*2
    difficulty: 1
    hints:
    - 2 + 2 + 2 + 2.
    - Count in twos.
    solution: 2 + 2 + 2 + 2 = 8.
    mistakes:
      '6': c2_count_once
  - prompt: 5 + 5 + 5 = ?
    answer: '15'
    check: 3*5
    difficulty: 1
    hints:
    - Count in fives.
    - 5, 10, 15.
    solution: 5 + 5 + 5 = 15.
    mistakes: {"10": "m3_repeat_add", "555": "m3_repeat_add"}
  - prompt: 2 cows. Each cow has 4 legs. How many legs?
    answer: '8'
    check: 2*4
    difficulty: 2
    hints:
    - 4 + 4.
    - Count the legs of each cow.
    solution: 4 + 4 = 8.
    mistakes:
      '6': c2_count_once
  - prompt: How many groups of 2 are in 10?
    answer: '5'
    check: 10 // 2
    difficulty: 2
    hints:
    - 2, 4, 6, 8, 10.
    - Count the jumps.
    solution: 10 = 2 + 2 + 2 + 2 + 2, so 5 groups.
    mistakes:
      '2': c2_count_once
  - prompt: Which shows equal groups?
    options:
    - 3 and 3 and 3
    - 3 and 4 and 2
    - 1 and 5 and 3
    - 2 and 3 and 4
    answer: 3 and 3 and 3
    difficulty: 1
    hints:
    - Equal means the same.
    - Same in each group.
    solution: 3, 3 and 3 are equal groups.
    mistakes: {"3 and 4 and 2": "m3_equal_groups"}
  - prompt: 5 hands. Each hand has 5 fingers. How many fingers?
    answer: '25'
    check: 5*5
    difficulty: 2
    hints:
    - Skip count by 5.
    - 5, 10, 15, 20, 25.
    solution: 'Step 1: 5 groups of 5. Step 2: = 25.'
    mistakes:
      '10': c2m8_groups
      '20': c2m8_groups
  - prompt: 3 tricycles. Each has 3 wheels. How many wheels?
    answer: '9'
    check: 3*3
    difficulty: 1
    hints:
    - 3 wheels each.
    - 3, 6, 9.
    solution: 'Step 1: 3 + 3 + 3. Step 2: = 9.'
    mistakes:
      '6': c2m8_groups
      '12': c2m8_groups
  - prompt: 10 + 10 + 10 = ?
    answer: '30'
    check: 10*3
    difficulty: 1
    hints:
    - Count in tens.
    - 3 tens.
    solution: 'Step 1: 10, 20, 30. Step 2: = 30.'
    mistakes:
      '20': c2m8_groups
      '13': c2m8_groups
  - prompt: How many groups of 5 are in 15?
    answer: '3'
    check: 15/5
    difficulty: 2
    hints:
    - Count in 5s to 15.
    - 5, 10, 15.
    solution: 'Step 1: 5, 10, 15 is 3 jumps. Step 2: 3 groups.'
    mistakes:
      '5': c2m8_groups
      '10': c2m8_groups
  - prompt: 4 children. Each has 2 eyes. How many eyes?
    answer: '8'
    check: 4*2
    difficulty: 1
    hints:
    - 2 eyes each.
    - 2, 4, 6, 8.
    solution: 'Step 1: 2 + 2 + 2 + 2. Step 2: = 8.'
    mistakes:
      '6': c2m8_groups
      '4': c2m8_groups
  - prompt: Which are NOT equal groups?
    options:
    - 2 and 5 and 2
    - 3 and 3 and 3
    - 5 and 5
    answer: 2 and 5 and 2
    difficulty: 2
    hints:
    - Equal groups all have the same number.
    - Which set has a different one?
    solution: 'Step 1: 3, 3, 3 and 5, 5 are equal. Step 2: 2, 5, 2 is not.'
    mistakes:
      3 and 3 and 3: c2m8_equal
      5 and 5: c2m8_equal
  - prompt: 6 bags with 2 apples each. How many apples?
    answer: '12'
    check: 6*2
    difficulty: 2
    hints:
    - 2 in each bag.
    - Skip count by 2 six times.
    solution: 'Step 1: 2, 4, 6, 8, 10, 12. Step 2: = 12.'
    mistakes:
      '8': c2m8_groups
      '10': c2m8_groups
  - prompt: How many groups of 2 are in 14?
    answer: '7'
    check: 14/2
    difficulty: 3
    hints:
    - Count in 2s to 14.
    - How many jumps?
    solution: 'Step 1: 2, 4, 6, 8, 10, 12, 14. Step 2: 7 groups.'
    mistakes:
      '2': c2m8_groups
      '12': c2m8_groups
  - prompt: 3 spiders. Each has 8 legs. How many legs?
    answer: '24'
    check: 8*3
    difficulty: 3
    hints:
    - 8 + 8 + 8.
    - 8 + 8 = 16, then + 8.
    solution: 'Step 1: 8 + 8 = 16. Step 2: 16 + 8 = 24.'
    mistakes:
      '11': c2m8_groups
      '16': c2m8_groups
- code: cbse2m.group.share
  title: Sharing equally
  after:
  - cbse2m.group.groups
  notes: |
    Sharing equally: 12 bananas shared by 3 children gives 4 each. Dealing out one by one. Left-overs when sharing is
    not equal. Halves.
  explanations:
    text: 'Sharing equally means everyone gets the same. Share 12 bananas among 3 children: give one each again and again. Each child gets 4.'
    visual: Draw 3 children and 12 bananas, then draw lines giving each child one banana at a time until all are given.
    step_by_step: 'Step 1: Give one to each. Step 2: Keep going round. Step 3: Stop when none are left. Step 4: Count one share.'
    real_world: When friends share a packet of biscuits, each gets the same number.
  picture:
    kind: flow
    steps:
    - 12 bananas
    - Give 1 to each child
    - Go round again
    - Each gets 4
    alt: '12 bananas: give 1 to each of 3 children, go round again until none are left, and each gets 4.'
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Share equally. How many does each one get?
    goals:
    - prompt: 12 bananas for 3 children
      target: 4
      mistakes:
      - when:
          v: 9
        say: That takes 3 away once. Give one to each, again and again, until none are left.
      - when:
          v: 3
        say: That's how many children. How many bananas does each get?
    - prompt: 10 pencils for 2 friends
      target: 5
      mistakes:
      - when:
          v: 8
        say: 'That takes 2 away. Share: one for you, one for me, until all are gone.'
    - prompt: 8 sweets for 4 children
      target: 2
      mistakes:
      - when:
          v: 4
        say: That's the number of children. Each child gets how many sweets?
  lesson:
    - teach: Sharing equally means everyone gets the same. To share 8 sweets between 2 friends, give one to each, again and again. Each gets 4.
      picture:
        kind: compare
        columns:
        - title: Friend 1
          points:
          - 4 sweets
        - title: Friend 2
          points:
          - 4 sweets
        alt: '8 sweets shared equally: 4 each.'
      check:
        prompt: 6 sweets shared by 2 friends. How many each?
        options:
        - '3'
        - '4'
        - '6'
        answer: '3'
        why: Dealing one each in turn gives 3 to each.
    - teach: 'Sometimes things do not share equally. 5 apples for 2 children: each gets 2, and 1 is left over.'
      check:
        prompt: 9 pencils for 2 children equally. How many left over?
        options:
        - '1'
        - '0'
        - '2'
        answer: '1'
        why: Each gets 4 (8 used), 1 is left.
    - teach: Half means one of 2 equal parts. Half of 10 is 5, because 5 + 5 = 10.
      check:
        prompt: 'Half of 6 is:'
        options:
        - '3'
        - '2'
        - '12'
        answer: '3'
        why: 3 + 3 = 6.
  items:
  - prompt: Share 12 bananas among 3 children. How many each?
    answer: '4'
    check: 12 / 3
    difficulty: 1
    hints:
    - Give one each, then again.
    - 3, 6, 9, 12.
    solution: 12 shared by 3 is 4 each.
    mistakes:
      '9': c2_count_once
      '36': c2_count_once
  - prompt: Share 10 sweets between 2 friends. How many each?
    answer: '5'
    check: 10 / 2
    difficulty: 1
    hints:
    - Half of 10.
    - 5 + 5.
    solution: 10 shared by 2 is 5 each.
    mistakes:
      '8': c2_count_once
  - prompt: '6 pencils shared equally by 3 children. Each gets:'
    answer: '2'
    check: 6 / 3
    difficulty: 1
    hints:
    - Give one each, twice.
    - 2 + 2 + 2 = 6.
    solution: 6 shared by 3 is 2 each.
    mistakes:
      '3': c2_count_once
  - prompt: 'Half of 8 is:'
    answer: '4'
    check: 8 / 2
    difficulty: 2
    hints:
    - Share into 2 equal parts.
    - 4 + 4 = 8.
    solution: Half of 8 is 4.
    mistakes:
      '6': c2_count_once
      '16': c2_count_once
  - prompt: 7 apples shared by 2 children equally. How many left over?
    answer: '1'
    check: 7 % 2
    difficulty: 2
    hints:
    - Each gets 3.
    - 3 + 3 = 6.
    solution: Each gets 3 and 1 is left over.
    mistakes:
      '3': c2_count_once
  - prompt: 'Sharing equally means:'
    options:
    - everyone gets the same
    - one gets all
    - the biggest gets more
    - nobody gets any
    answer: everyone gets the same
    difficulty: 1
    hints:
    - Fair sharing.
    - Same for each.
    solution: Everyone gets the same.
    mistakes: {"one gets all": "m3_fair"}
  - prompt: Share 15 marbles among 3 children. How many each?
    answer: '5'
    check: 15/3
    difficulty: 2
    hints:
    - Give one to each in turn.
    - 3 × ? = 15.
    solution: 'Step 1: 5 + 5 + 5 = 15. Step 2: 5 each.'
    mistakes:
      '3': c2m8_deal
      '12': c2m8_deal
  - prompt: 'Half of 20 is:'
    answer: '10'
    check: 20/2
    difficulty: 1
    hints:
    - Two equal parts.
    - What + itself = 20?
    solution: 'Step 1: 10 + 10 = 20. Step 2: Half is 10.'
    mistakes:
      '5': c2m8_deal
      '40': c2m8_deal
  - prompt: 8 crayons shared by 4 children. How many each?
    answer: '2'
    check: 8/4
    difficulty: 1
    hints:
    - Deal them out one by one.
    - 4 × ? = 8.
    solution: 'Step 1: 2 + 2 + 2 + 2 = 8. Step 2: 2 each.'
    mistakes:
      '4': c2m8_deal
      '12': c2m8_deal
  - prompt: 11 laddoos for 2 children equally. How many left over?
    answer: '1'
    check: 11-10
    difficulty: 2
    hints:
    - How many does each get first?
    - 2 × 5 = 10.
    solution: 'Step 1: Each gets 5 (10 used). Step 2: 1 left over.'
    mistakes:
      '0': c2m8_deal
      '5': c2m8_deal
  - prompt: 'Is it fair? 10 grapes: one child gets 7, the other gets 3.'
    options:
    - no, they are not the same
    - yes, all grapes were given
    - yes, both got some
    answer: no, they are not the same
    difficulty: 1
    hints:
    - Fair means equal.
    - Are 7 and 3 the same?
    solution: 'Step 1: 7 and 3 are different. Step 2: Not fair.'
    mistakes:
      yes, all grapes were given: c2m8_equal
      yes, both got some: c2m8_equal
  - prompt: 'Half of 14 is:'
    answer: '7'
    check: 14/2
    difficulty: 2
    hints:
    - Two equal parts.
    - 7 + 7 = ?
    solution: 'Step 1: 7 + 7 = 14. Step 2: Half is 7.'
    mistakes:
      '6': c2m8_deal
      '28': c2m8_deal
  - prompt: 12 balloons shared by 4 children. How many each?
    answer: '3'
    check: 12/4
    difficulty: 2
    hints:
    - Give one to each in turn.
    - 4 × ? = 12.
    solution: 'Step 1: 3 + 3 + 3 + 3 = 12. Step 2: 3 each.'
    mistakes:
      '4': c2m8_deal
      '8': c2m8_deal
  - prompt: 'A roti is cut into 2 equal parts. Each part is:'
    options:
    - a half
    - a whole
    - three parts
    answer: a half
    difficulty: 1
    hints:
    - 2 equal parts.
    - One of two equal parts.
    solution: 'Step 1: 2 equal parts. Step 2: Each is a half.'
    mistakes:
      a whole: c2m8_equal
      three parts: c2m8_equal
  - prompt: 20 pencils are shared by 5 children. Then each child gives 1 pencil to the teacher. How many pencils does each child have now?
    answer: '3'
    check: 20/5-1
    difficulty: 3
    hints:
    - 'First share: 20 by 5.'
    - Then each gives away 1.
    solution: 'Step 1: 20 ÷ 5 = 4 each. Step 2: 4 − 1 = 3.'
    mistakes:
      '4': c2m8_deal
      '15': c2m8_deal
