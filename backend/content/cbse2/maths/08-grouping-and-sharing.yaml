# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 8
title: Grouping and Sharing
concepts:
- code: cbse2m.group.groups
  title: Equal groups
  notes: |
    Making equal groups: 3 groups of 4 = 4 + 4 + 4 = 12. Repeated addition as the start of multiplication. Counting
    wheels, legs, eyes.
  explanations:
    text: 'Equal groups have the same number in each. 3 plates with 4 laddoos each: 4 + 4 + 4 = 12 laddoos. Adding the same number again and again is quick counting.'
    visual: 'Draw 3 plates, each with 4 laddoos. Count: 4, 8, 12.'
    step_by_step: 'Step 1: Count how many in one group. Step 2: Count the groups. Step 3: Add the same number that many times.'
    real_world: A cycle has 2 wheels; 4 cycles have 2 + 2 + 2 + 2 = 8 wheels.
  picture:
    kind: bars
    bars:
    - label: plate 1
      value: 4
    - label: plate 2
      value: 4
    - label: plate 3
      value: 4
    alt: 'Three plates with 4 laddoos each: 4 + 4 + 4 = 12.'
    unit: laddoos
  activity:
    type: number_line
    min: 0
    max: 30
    step: 1
    start: 0
    prompt: 'Equal groups: add the same number again and again.'
    goals:
    - prompt: 3 plates, 4 laddoos each
      target: 12
      mistakes:
      - when:
          v: 7
        say: 'That adds 3 and 4. Each plate has 4: 4 + 4 + 4.'
      - when:
          v: 8
        say: That's two plates. Add the third.
    - prompt: 5 bags, 2 apples each
      target: 10
      mistakes:
      - when:
          v: 7
        say: 'That adds 5 and 2. Count in twos: 2, 4, 6, 8, 10.'
    - prompt: 4 cars, 4 wheels each
      target: 16
      mistakes:
      - when:
          v: 8
        say: 'That adds 4 and 4 once. There are 4 cars: 4 + 4 + 4 + 4.'
      - when:
          v: 12
        say: That's 3 cars. Add one more 4.
  items:
  - prompt: 3 plates with 4 laddoos each. How many laddoos?
    answer: '12'
    check: 3*4
    difficulty: 1
    hints:
    - 4 + 4 + 4.
    - Count in fours.
    solution: 4 + 4 + 4 = 12.
    mistakes:
      '7': c2_count_once
  - prompt: 4 cycles. Each has 2 wheels. How many wheels?
    answer: '8'
    check: 4*2
    difficulty: 1
    hints:
    - 2 + 2 + 2 + 2.
    - Count in twos.
    solution: 2 + 2 + 2 + 2 = 8.
    mistakes:
      '6': c2_count_once
  - prompt: 5 + 5 + 5 = ?
    answer: '15'
    check: 3*5
    difficulty: 1
    hints:
    - Count in fives.
    - 5, 10, 15.
    solution: 5 + 5 + 5 = 15.
  - prompt: 2 cows. Each cow has 4 legs. How many legs?
    answer: '8'
    check: 2*4
    difficulty: 2
    hints:
    - 4 + 4.
    - Count the legs of each cow.
    solution: 4 + 4 = 8.
    mistakes:
      '6': c2_count_once
  - prompt: How many groups of 2 are in 10?
    answer: '5'
    check: 10 // 2
    difficulty: 2
    hints:
    - 2, 4, 6, 8, 10.
    - Count the jumps.
    solution: 10 = 2 + 2 + 2 + 2 + 2, so 5 groups.
    mistakes:
      '2': c2_count_once
  - prompt: Which shows equal groups?
    options:
    - 3 and 3 and 3
    - 3 and 4 and 2
    - 1 and 5 and 3
    - 2 and 3 and 4
    answer: 3 and 3 and 3
    difficulty: 1
    hints:
    - Equal means the same.
    - Same in each group.
    solution: 3, 3 and 3 are equal groups.
- code: cbse2m.group.share
  title: Sharing equally
  after:
  - cbse2m.group.groups
  notes: |
    Sharing equally: 12 bananas shared by 3 children gives 4 each. Dealing out one by one. Left-overs when sharing is
    not equal. Halves.
  explanations:
    text: 'Sharing equally means everyone gets the same. Share 12 bananas among 3 children: give one each again and again. Each child gets 4.'
    visual: Draw 3 children and 12 bananas, then draw lines giving each child one banana at a time until all are given.
    step_by_step: 'Step 1: Give one to each. Step 2: Keep going round. Step 3: Stop when none are left. Step 4: Count one share.'
    real_world: When friends share a packet of biscuits, each gets the same number.
  picture:
    kind: flow
    steps:
    - 12 bananas
    - Give 1 to each child
    - Go round again
    - Each gets 4
    alt: '12 bananas: give 1 to each of 3 children, go round again until none are left, and each gets 4.'
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Share equally. How many does each one get?
    goals:
    - prompt: 12 bananas for 3 children
      target: 4
      mistakes:
      - when:
          v: 9
        say: That takes 3 away once. Give one to each, again and again, until none are left.
      - when:
          v: 3
        say: That's how many children. How many bananas does each get?
    - prompt: 10 pencils for 2 friends
      target: 5
      mistakes:
      - when:
          v: 8
        say: 'That takes 2 away. Share: one for you, one for me, until all are gone.'
    - prompt: 8 sweets for 4 children
      target: 2
      mistakes:
      - when:
          v: 4
        say: That's the number of children. Each child gets how many sweets?
  items:
  - prompt: Share 12 bananas among 3 children. How many each?
    answer: '4'
    check: 12 / 3
    difficulty: 1
    hints:
    - Give one each, then again.
    - 3, 6, 9, 12.
    solution: 12 shared by 3 is 4 each.
    mistakes:
      '9': c2_count_once
      '36': c2_count_once
  - prompt: Share 10 sweets between 2 friends. How many each?
    answer: '5'
    check: 10 / 2
    difficulty: 1
    hints:
    - Half of 10.
    - 5 + 5.
    solution: 10 shared by 2 is 5 each.
    mistakes:
      '8': c2_count_once
  - prompt: '6 pencils shared equally by 3 children. Each gets:'
    answer: '2'
    check: 6 / 3
    difficulty: 1
    hints:
    - Give one each, twice.
    - 2 + 2 + 2 = 6.
    solution: 6 shared by 3 is 2 each.
    mistakes:
      '3': c2_count_once
  - prompt: 'Half of 8 is:'
    answer: '4'
    check: 8 / 2
    difficulty: 2
    hints:
    - Share into 2 equal parts.
    - 4 + 4 = 8.
    solution: Half of 8 is 4.
    mistakes:
      '6': c2_count_once
      '16': c2_count_once
  - prompt: 7 apples shared by 2 children equally. How many left over?
    answer: '1'
    check: 7 % 2
    difficulty: 2
    hints:
    - Each gets 3.
    - 3 + 3 = 6.
    solution: Each gets 3 and 1 is left over.
    mistakes:
      '3': c2_count_once
  - prompt: 'Sharing equally means:'
    options:
    - everyone gets the same
    - one gets all
    - the biggest gets more
    - nobody gets any
    answer: everyone gets the same
    difficulty: 1
    hints:
    - Fair sharing.
    - Same for each.
    solution: Everyone gets the same.
