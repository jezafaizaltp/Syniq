# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 9
title: Which Season is it?
concepts:
- code: cbse2m.season.days
  title: Days, weeks and months
  notes: |
    7 days in a week (Sunday to Saturday); 12 months in a year (January to December); yesterday, today, tomorrow;
    reading a simple calendar.
  explanations:
    text: 'A week has 7 days: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday. A year has 12 months, from January to December.'
    visual: Draw a calendar page for one week with the 7 day names across the top.
    step_by_step: 'Step 1: Say the days in order. Step 2: Find today. Step 3: One back is yesterday, one forward is tomorrow.'
    real_world: Schools have holidays on Sundays and we mark birthdays on the calendar.
  picture:
    kind: flow
    steps:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    alt: 'The days of the week in order: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.'
  items:
  - prompt: How many days are in a week?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Sunday to Saturday.
    - Count them.
    solution: A week has 7 days.
    mistakes:
      '5': c2_count_once
      '6': c2_count_once
  - prompt: How many months are in a year?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - January to December.
    - Count them.
    solution: A year has 12 months.
    mistakes:
      '10': c2_count_once
  - prompt: 'Today is Monday. Tomorrow is:'
    options:
    - Tuesday
    - Sunday
    - Friday
    - Wednesday
    answer: Tuesday
    difficulty: 1
    hints:
    - One day forward.
    - Monday, ...
    solution: After Monday comes Tuesday.
  - prompt: 'Today is Friday. Yesterday was:'
    options:
    - Thursday
    - Saturday
    - Monday
    - Sunday
    answer: Thursday
    difficulty: 2
    hints:
    - One day back.
    - '..., Friday.'
    solution: Before Friday comes Thursday.
  - prompt: Which month comes after March?
    options:
    - April
    - February
    - May
    - June
    answer: April
    difficulty: 2
    hints:
    - January, February, March, ...
    - Next one.
    solution: April comes after March.
  - prompt: How many days are in 2 weeks?
    answer: '14'
    check: 2*7
    difficulty: 2
    hints:
    - 7 + 7.
    - Each week has 7.
    solution: 7 + 7 = 14.
    mistakes:
      '9': c2_count_once
- code: cbse2m.season.seasons
  title: Seasons and time of day
  after:
  - cbse2m.season.days
  notes: |
    Seasons: summer (hot), rainy (monsoon), winter (cold); clothes and foods for each. Morning, afternoon, evening,
    night; before and after.
  explanations:
    text: 'In summer it is hot, in the rainy season it rains a lot, and in winter it is cold. A day also changes: morning, afternoon, evening and night.'
    visual: 'Draw three boxes: a sun with a cotton shirt (summer), an umbrella with clouds (rainy), and a sweater (winter).'
    step_by_step: 'Step 1: Look at the weather. Step 2: Think of what people wear. Step 3: Name the season.'
    real_world: In Kerala the monsoon starts in June; in Delhi it is very cold in January.
  picture:
    kind: compare
    columns:
    - title: Summer
      points:
      - hot
      - cotton clothes
    - title: Rainy
      points:
      - wet
      - umbrella
    - title: Winter
      points:
      - cold
      - sweater
    alt: Summer is hot with cotton clothes, the rainy season is wet with umbrellas, and winter is cold with sweaters.
  items:
  - prompt: 'We use an umbrella in the:'
    options:
    - rainy season
    - winter only
    - night
    - never
    answer: rainy season
    difficulty: 1
    hints:
    - It keeps us dry.
    - Monsoon.
    solution: We use umbrellas in the rainy season.
  - prompt: 'We wear sweaters in:'
    options:
    - winter
    - summer
    - the rainy season
    - the afternoon heat
    answer: winter
    difficulty: 1
    hints:
    - It is cold.
    - Warm clothes.
    solution: We wear sweaters in winter.
  - prompt: Which do we enjoy most in summer?
    options:
    - ice-cream
    - a hot blanket
    - a woollen cap
    - a heater
    answer: ice-cream
    difficulty: 1
    hints:
    - It is hot.
    - Something cold.
    solution: Ice-cream cools us in summer.
  - prompt: 'We eat breakfast in the:'
    options:
    - morning
    - night
    - evening
    - midnight
    answer: morning
    difficulty: 1
    hints:
    - First meal of the day.
    - After waking.
    solution: Breakfast is in the morning.
  - prompt: Which comes first in a day?
    options:
    - morning
    - evening
    - night
    - afternoon
    answer: morning
    difficulty: 2
    hints:
    - The sun rises.
    - Start of the day.
    solution: Morning comes first.
  - prompt: 'How many seasons are named here: summer, rainy, winter?'
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Count the names.
    - One, two, three.
    solution: 3 seasons.
