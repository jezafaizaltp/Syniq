# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 9
title: Which Season is it?
tips:
  m2_breakfast: "'Break-fast' is the first meal after a night's sleep."
  m2_first_day: "The sun rises and the day starts."
  m2_summer: "Summer is hot. Which one cools you down?"
  m2_sweater: "Sweaters keep us warm. When is it cold?"
  m2_umbrella: "An umbrella keeps you dry. When does it pour?"
  c2m9_order: Say the days or months in order from the start, pointing at each one.
  c2m9_weather: 'Think how the weather feels then: hot, wet or cold. What would you need?'
  c2m9_time: 'Think of your own day: what do you do when you wake up, at lunch, and before bed?'

concepts:
- code: cbse2m.season.days
  title: Days, weeks and months
  notes: |
    7 days in a week (Sunday to Saturday); 12 months in a year (January to December); yesterday, today, tomorrow;
    reading a simple calendar.
  explanations:
    text: 'A week has 7 days: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday. A year has 12 months, from January to December.'
    visual: Draw a calendar page for one week with the 7 day names across the top.
    step_by_step: 'Step 1: Say the days in order. Step 2: Find today. Step 3: One back is yesterday, one forward is tomorrow.'
    real_world: Schools have holidays on Sundays and we mark birthdays on the calendar.
  picture:
    kind: flow
    steps:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    alt: 'The days of the week in order: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.'
  activity:
    type: order
    prompt: Put the months in order, from January.
    steps:
    - January
    - February
    - March
    - April
    - May
    - June
    reasons:
      February: February comes after January.
      March: March comes after February.
      April: April comes after March.
      May: May comes after April.
      June: June comes after May, in the middle of the year.
  lesson:
    - teach: 'A week has 7 days: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday. Then Sunday comes again.'
      picture:
        kind: flow
        steps:
        - Sun
        - Mon
        - Tue
        - Wed
        - Thu
        - Fri
        - Sat
        alt: The 7 days of the week in order.
      check:
        prompt: Which day comes after Wednesday?
        options:
        - Thursday
        - Tuesday
        - Friday
        answer: Thursday
        why: Wednesday, then Thursday.
      ways:
      - style: step_by_step
        teach: 'Sing the days of the week. Step 1: Start with Sunday. Step 2: Clap once for each day as you say it. Step 3: Stop at Saturday: you clapped 7 times. Step 4: Start again with Sunday.'
      - style: real_world
        teach: Many families have a special day in the week, like a Sunday outing or a Friday prayer. Remembering which day comes next helps you plan for it.
    - teach: Yesterday was the day before today. Tomorrow is the day after today. If today is Tuesday, yesterday was Monday and tomorrow is Wednesday.
      check:
        prompt: 'Today is Sunday. Tomorrow is:'
        options:
        - Monday
        - Saturday
        - Tuesday
        answer: Monday
        why: After Sunday comes Monday.
      ways:
      - style: visual
        teach: Yesterday, today and tomorrow when today is Thursday.
        picture:
          kind: flow
          steps:
          - 'Yesterday: Wednesday'
          - 'Today: Thursday'
          - 'Tomorrow: Friday'
          alt: If today is Thursday, yesterday was Wednesday and tomorrow is Friday.
      - style: real_world
        teach: If your birthday is tomorrow and today is Saturday, your birthday is on Sunday. People often say 'see you tomorrow' when school ends for the day.
    - teach: 'A year has 12 months: January, February, March, April, May, June, July, August, September, October, November, December.'
      check:
        prompt: Which is the first month of the year?
        options:
        - January
        - December
        - June
        answer: January
        why: The year starts with January.
      ways:
      - style: visual
        teach: The 12 months of the year, in four groups of three.
        picture:
          kind: compare
          columns:
          - title: Months 1 to 6
            points:
            - January
            - February
            - March
            - April
            - May
            - June
          - title: Months 7 to 12
            points:
            - July
            - August
            - September
            - October
            - November
            - December
          alt: The first six months are January, February, March, April, May and June. The last six are July, August, September, October, November and December.
      - style: real_world
        teach: India celebrates Independence Day in August and Republic Day in January. Knowing the months helps you know when these days come.
  items:
  - prompt: How many days are in a week?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Sunday to Saturday.
    - Count them.
    solution: A week has 7 days.
    mistakes:
      '5': c2_count_once
      '6': c2_count_once
  - prompt: How many months are in a year?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - January to December.
    - Count them.
    solution: A year has 12 months.
    mistakes:
      '10': c2_count_once
  - prompt: 'Today is Monday. Tomorrow is:'
    options:
    - Tuesday
    - Sunday
    - Friday
    - Wednesday
    answer: Tuesday
    difficulty: 1
    hints:
    - One day forward.
    - Monday, ...
    solution: After Monday comes Tuesday.
    mistakes: {"Sunday": "m1_tomorrow"}
  - prompt: 'Today is Friday. Yesterday was:'
    options:
    - Thursday
    - Saturday
    - Monday
    - Sunday
    answer: Thursday
    difficulty: 2
    hints:
    - One day back.
    - '..., Friday.'
    solution: Before Friday comes Thursday.
    mistakes: {"Saturday": "m1_yesterday"}
  - prompt: Which month comes after March?
    options:
    - April
    - February
    - May
    - June
    answer: April
    difficulty: 2
    hints:
    - January, February, March, ...
    - Next one.
    solution: April comes after March.
    mistakes: {"February": "m3_after_march"}
  - prompt: How many days are in 2 weeks?
    answer: '14'
    check: 2*7
    difficulty: 2
    hints:
    - 7 + 7.
    - Each week has 7.
    solution: 7 + 7 = 14.
    mistakes:
      '9': c2_count_once
  - prompt: Which day comes before Saturday?
    options:
    - Friday
    - Sunday
    - Thursday
    answer: Friday
    difficulty: 1
    hints:
    - Say the days in order.
    - Thursday, Friday, ...
    solution: 'Step 1: Friday, then Saturday. Step 2: Friday.'
    mistakes:
      Sunday: c2m9_order
      Thursday: c2m9_order
  - prompt: Which is the last month of the year?
    options:
    - December
    - January
    - November
    answer: December
    difficulty: 1
    hints:
    - The year ends with it.
    - After November.
    solution: 'Step 1: November, then the last one. Step 2: December.'
    mistakes:
      January: c2m9_order
      November: c2m9_order
  - prompt: 'Today is Thursday. Yesterday was:'
    options:
    - Wednesday
    - Friday
    - Tuesday
    answer: Wednesday
    difficulty: 1
    hints:
    - Yesterday is one day before.
    - Count back one day.
    solution: 'Step 1: One day before Thursday. Step 2: Wednesday.'
    mistakes:
      Friday: c2m9_order
      Tuesday: c2m9_order
  - prompt: How many days are in 3 weeks?
    answer: '21'
    check: 7*3
    difficulty: 2
    hints:
    - One week has 7 days.
    - 7 + 7 + 7.
    solution: 'Step 1: 7 + 7 + 7. Step 2: = 21.'
    mistakes:
      '10': c2m9_order
      '14': c2m9_order
  - prompt: Which month comes after June?
    options:
    - July
    - May
    - August
    answer: July
    difficulty: 1
    hints:
    - Say the months in order.
    - May, June, ...
    solution: 'Step 1: June, then July. Step 2: July.'
    mistakes:
      May: c2m9_order
      August: c2m9_order
  - prompt: Which days are the weekend (Saturday and ___)?
    options:
    - Sunday
    - Monday
    - Wednesday
    answer: Sunday
    difficulty: 2
    hints:
    - Many schools are closed on these days.
    - The day after Saturday.
    solution: 'Step 1: The weekend is the end of the week. Step 2: Saturday and Sunday.'
    mistakes:
      Monday: c2m9_order
      Wednesday: c2m9_order
  - prompt: Today is Monday. What day will it be in 2 days?
    options:
    - Wednesday
    - Tuesday
    - Thursday
    answer: Wednesday
    difficulty: 2
    hints:
    - Count on 2 days.
    - Tuesday is 1.
    solution: 'Step 1: Tuesday (1), Wednesday (2). Step 2: Wednesday.'
    mistakes:
      Tuesday: c2m9_order
      Thursday: c2m9_order
  - prompt: How many months are left in the year after October?
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - Say the months after October.
    - November, ...
    solution: 'Step 1: November and December. Step 2: 2 months.'
    mistakes:
      '3': c2m9_order
      '1': c2m9_order
  - prompt: A school week is Monday to Friday. How many days is that?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - Count Mon, Tue, Wed, Thu, Fri.
    - Use your fingers.
    solution: 'Step 1: Mon, Tue, Wed, Thu, Fri. Step 2: 5 days.'
    mistakes:
      '7': c2m9_order
      '4': c2m9_order
  - prompt: 'Case: A child''s grandparent says, ''I will visit you the day after tomorrow.'' Today is Tuesday. On which day will the grandparent come?'
    options:
    - Thursday
    - Wednesday
    - Monday
    answer: Thursday
    hints:
    - What is tomorrow if today is Tuesday?
    - What comes the day after that?
    solution: Today is Tuesday, so tomorrow is Wednesday. The day after tomorrow is Thursday.
    mistakes:
      Wednesday: c2m9_order
      Monday: c2m9_order
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your class is making a calendar. The month after August is missing. Which month should you write?'
    options:
    - September
    - July
    - October
    answer: September
    hints:
    - Say the months in order from July.
    - Which month comes right after August?
    solution: The months go July, August, September, October. The month right after August is September.
    mistakes:
      July: c2m9_order
      October: c2m9_order
    exam: competency
    difficulty: 2
- code: cbse2m.season.seasons
  title: Seasons and time of day
  after:
  - cbse2m.season.days
  notes: |
    Seasons: summer (hot), rainy (monsoon), winter (cold); clothes and foods for each. Morning, afternoon, evening,
    night; before and after.
  explanations:
    text: 'In summer it is hot, in the rainy season it rains a lot, and in winter it is cold. A day also changes: morning, afternoon, evening and night.'
    visual: 'Draw three boxes: a sun with a cotton shirt (summer), an umbrella with clouds (rainy), and a sweater (winter).'
    step_by_step: 'Step 1: Look at the weather. Step 2: Think of what people wear. Step 3: Name the season.'
    real_world: In Kerala the monsoon starts in June; in Delhi it is very cold in January.
  picture:
    kind: compare
    columns:
    - title: Summer
      points:
      - hot
      - cotton clothes
    - title: Rainy
      points:
      - wet
      - umbrella
    - title: Winter
      points:
      - cold
      - sweater
    alt: Summer is hot with cotton clothes, the rainy season is wet with umbrellas, and winter is cold with sweaters.
  activity:
    type: sort
    prompt: Which season?
    bins:
    - ☀️ Summer
    - 🌧️ Rainy
    - ❄️ Winter
    items:
    - label: We wear sweaters
      bin: ❄️ Winter
      clue: Is it hot or cold?
      why: Sweaters are for the cold time of year.
    - label: We carry umbrellas
      bin: 🌧️ Rainy
      clue: What falls from the sky a lot?
      why: Umbrellas are for the rain.
    - label: We drink cool lemonade and fan ourselves
      bin: ☀️ Summer
      clue: Is it hot?
      why: We cool down in the hot season.
    - label: Puddles and paper boats
      bin: 🌧️ Rainy
      clue: Where do puddles come from?
      why: Lots of rain makes puddles.
    - label: Foggy mornings, warm blankets
      bin: ❄️ Winter
      clue: Do you shiver?
      why: Fog and blankets come in the cold season.
    - label: Mangoes are ripe, school is closed for holidays
      bin: ☀️ Summer
      clue: Hot weather, long holidays.
      why: Mangoes and long holidays come in the hot season.
  lesson:
    - teach: 'In India we have seasons. Summer is hot: we wear cotton clothes and enjoy mangoes. The rainy season (monsoon) is wet: we carry umbrellas. Winter is cold: we wear sweaters.'
      picture:
        kind: compare
        columns:
        - title: Summer
          points:
          - hot
          - cotton clothes
        - title: Rainy
          points:
          - wet
          - umbrella
        - title: Winter
          points:
          - cold
          - sweater
        alt: Three seasons and what we use in each.
      check:
        prompt: 'We wear cotton clothes in:'
        options:
        - summer
        - winter
        - only at night
        answer: summer
        why: Cotton keeps us cool when it is hot.
      ways:
      - style: visual
        teach: Three seasons, and what we wear or carry in each one.
        picture:
          kind: compare
          columns:
          - title: Summer
            points:
            - Hot
            - Cotton clothes
            - Cap
          - title: Rainy
            points:
            - Wet
            - Umbrella
            - Raincoat
          - title: Winter
            points:
            - Cold
            - Sweater
            - Blanket
          alt: Summer is hot, so we wear cotton clothes and a cap. The rainy season is wet, so we carry an umbrella and a raincoat. Winter is cold, so we wear a sweater and use a blanket.
      - style: real_world
        teach: In summer, many shops sell cold drinks, watermelons and fans. In winter, the same shops sell sweaters, caps and blankets.
    - teach: 'A day has parts: morning (we wake, brush, eat breakfast), afternoon (lunch), evening (play), night (dinner and sleep).'
      check:
        prompt: 'We go to sleep at:'
        options:
        - night
        - morning
        - afternoon
        answer: night
        why: Night is when it is dark and we rest.
      ways:
      - style: visual
        teach: The parts of a day, in order, and what we do in each.
        picture:
          kind: flow
          steps:
          - 'Morning: wake up and eat breakfast'
          - 'Afternoon: eat lunch'
          - 'Evening: play'
          - 'Night: eat dinner and sleep'
          alt: In the morning we wake up and eat breakfast. In the afternoon we eat lunch. In the evening we play. At night we eat dinner and sleep.
      - style: step_by_step
        teach: 'Draw your day. Step 1: Draw a sun rising and yourself brushing your teeth: morning. Step 2: Draw your lunch box: afternoon. Step 3: Draw yourself playing: evening. Step 4: Draw the moon and your bed: night.'
    - teach: Before and after tell order. We brush our teeth before breakfast. We sleep after dinner.
      check:
        prompt: Which comes first?
        options:
        - wake up
        - go to school
        - eat lunch
        answer: wake up
        why: We must wake up before anything else.
      ways:
      - style: step_by_step
        teach: 'Put three things in order. Step 1: Read them: put on shoes, put on socks, go out. Step 2: Ask: which must happen first? Socks go on before shoes. Step 3: Then shoes. Step 4: Then you go out.'
      - style: visual
        teach: Getting ready for school, one thing after another, in the right order.
        picture:
          kind: flow
          steps:
          - Wake up
          - Brush your teeth
          - Have a bath
          - Put on your uniform
          - Eat breakfast
          - Walk to school
          alt: First wake up, then brush your teeth, have a bath, put on your uniform, eat breakfast and walk to school.
  items:
  - prompt: 'We use an umbrella in the:'
    options:
    - rainy season
    - winter only
    - night
    - never
    answer: rainy season
    difficulty: 1
    hints:
    - It keeps us dry.
    - Monsoon.
    solution: We use umbrellas in the rainy season.
    mistakes: {"winter only": "m2_umbrella"}
  - prompt: 'We wear sweaters in:'
    options:
    - winter
    - summer
    - the rainy season
    - the afternoon heat
    answer: winter
    difficulty: 1
    hints:
    - It is cold.
    - Warm clothes.
    solution: We wear sweaters in winter.
    mistakes: {"summer": "m2_sweater"}
  - prompt: Which do we enjoy most in summer?
    options:
    - ice-cream
    - a hot blanket
    - a woollen cap
    - a heater
    answer: ice-cream
    difficulty: 1
    hints:
    - It is hot.
    - Something cold.
    solution: Ice-cream cools us in summer.
    mistakes: {"a hot blanket": "m2_summer"}
  - prompt: 'We eat breakfast in the:'
    options:
    - morning
    - night
    - evening
    - midnight
    answer: morning
    difficulty: 1
    hints:
    - First meal of the day.
    - After waking.
    solution: Breakfast is in the morning.
    mistakes: {"night": "m2_breakfast"}
  - prompt: Which comes first in a day?
    options:
    - morning
    - evening
    - night
    - afternoon
    answer: morning
    difficulty: 2
    hints:
    - The sun rises.
    - Start of the day.
    solution: Morning comes first.
    mistakes: {"evening": "m2_first_day"}
  - prompt: 'How many seasons are named here: summer, rainy, winter?'
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Count the names.
    - One, two, three.
    solution: 3 seasons.
    mistakes: {"2": "m1_count_names", "4": "m1_count_names"}
  - prompt: In which season do we see lots of rain and puddles?
    options:
    - rainy season
    - winter
    - summer
    answer: rainy season
    difficulty: 1
    hints:
    - Umbrellas are needed.
    - Also called the monsoon.
    solution: 'Step 1: Rain falls a lot in the monsoon. Step 2: The rainy season.'
    mistakes:
      winter: c2m9_weather
      summer: c2m9_weather
  - prompt: Which do we need most in winter?
    options:
    - a warm blanket
    - a fan
    - an ice-cream
    answer: a warm blanket
    difficulty: 1
    hints:
    - Winter is cold.
    - What keeps you warm?
    solution: 'Step 1: Winter is cold. Step 2: A warm blanket helps.'
    mistakes:
      a fan: c2m9_weather
      an ice-cream: c2m9_weather
  - prompt: 'We eat lunch in the:'
    options:
    - afternoon
    - night
    - early morning
    answer: afternoon
    difficulty: 1
    hints:
    - Middle of the day.
    - After school morning lessons.
    solution: 'Step 1: Lunch is in the middle of the day. Step 2: Afternoon.'
    mistakes:
      night: c2m9_time
      early morning: c2m9_time
  - prompt: Which fruit do we get a lot in summer?
    options:
    - mango
    - snow
    - sweater
    answer: mango
    difficulty: 1
    hints:
    - Only one is a fruit.
    - Yellow and sweet.
    solution: 'Step 1: Snow and sweaters are not fruits. Step 2: Mangoes come in summer.'
    mistakes:
      snow: c2m9_weather
      sweater: c2m9_weather
  - prompt: What do we do after dinner?
    options:
    - go to sleep
    - eat breakfast
    - go to school
    answer: go to sleep
    difficulty: 1
    hints:
    - Dinner is at night.
    - What comes last in the day?
    solution: 'Step 1: Dinner is at night. Step 2: Then we sleep.'
    mistakes:
      eat breakfast: c2m9_time
      go to school: c2m9_time
  - prompt: Why do we carry an umbrella in the rainy season?
    options:
    - to stay dry
    - to stay hot
    - to see in the dark
    answer: to stay dry
    difficulty: 1
    hints:
    - What falls from the sky?
    - Umbrellas stop it.
    solution: 'Step 1: Rain falls. Step 2: An umbrella keeps us dry.'
    mistakes:
      to stay hot: c2m9_weather
      to see in the dark: c2m9_weather
  - prompt: 'Put in order: lunch, breakfast, dinner.'
    options:
    - breakfast, lunch, dinner
    - dinner, lunch, breakfast
    - lunch, breakfast, dinner
    answer: breakfast, lunch, dinner
    difficulty: 2
    hints:
    - Which meal is in the morning?
    - Which is at night?
    solution: 'Step 1: Breakfast in the morning, lunch in the afternoon. Step 2: Dinner at night.'
    mistakes:
      dinner, lunch, breakfast: c2m9_time
      lunch, breakfast, dinner: c2m9_time
  - prompt: In which season do we drink more water because it is very hot?
    options:
    - summer
    - winter
    - no season
    answer: summer
    difficulty: 2
    hints:
    - We sweat a lot.
    - The hottest season.
    solution: 'Step 1: Heat makes us sweat. Step 2: In summer we drink more water.'
    mistakes:
      winter: c2m9_weather
      no season: c2m9_weather
  - prompt: 'The sun rises in the:'
    options:
    - morning
    - night
    - evening
    answer: morning
    difficulty: 2
    hints:
    - It is when the day starts.
    - When we wake up.
    solution: 'Step 1: The day starts with sunrise. Step 2: Morning.'
    mistakes:
      night: c2m9_time
      evening: c2m9_time
  - prompt: 'Case: It is the rainy season. A child is getting ready for school and picks up a sweater and sunglasses but no umbrella. What should the child take instead?'
    options:
    - An umbrella or a raincoat
    - A warm blanket
    - A sun cap and cotton clothes
    answer: An umbrella or a raincoat
    hints:
    - What is the weather like in the rainy season?
    - What keeps you dry?
    solution: The rainy season is wet. An umbrella or a raincoat keeps the child dry on the way to school.
    mistakes:
      A warm blanket: c2m9_weather
      A sun cap and cotton clothes: c2m9_weather
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are telling a friend about your evening. Which order is right?'
    options:
    - Play, then eat dinner, then sleep
    - Sleep, then play, then eat dinner
    - Eat dinner, then sleep, then play
    answer: Play, then eat dinner, then sleep
    hints:
    - What do we do in the evening?
    - What do we do last at night?
    solution: We play in the evening, eat dinner at night, and sleep after dinner.
    mistakes:
      Sleep, then play, then eat dinner: c2m9_time
      Eat dinner, then sleep, then play: c2m9_time
    exam: competency
    difficulty: 2
