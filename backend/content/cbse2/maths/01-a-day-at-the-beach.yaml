# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 1
title: A Day at the Beach
tips:
  c2_count_once: Touch each thing as you count it, so you count every one once.
  c2_tens_ones: The left digit tells the tens, the right digit tells the ones.
  c2m1_one: Touch each thing once as you count. Say one number for each touch.
  c2m1_ten: Make bundles of 10 first. Count the bundles, then the loose ones.
  c2m1_next: Say the number out loud, then say the very next number (or the one before).
concepts:
- code: cbse2m.beach.count
  title: Counting things up to 99
  notes: |
    Counting shells, boats and children at the beach. Count one by one, or make groups of ten and count the tens, then
    the ones left over. Numbers up to 99; the number just before and just after.
  explanations:
    text: At the beach we can count shells, boats and kites. To count many things, make groups of ten. Count the tens, then the ones left over.
    visual: 'Draw 2 bundles of 10 shells and 4 loose shells. Count: 10, 20, 21, 22, 23, 24.'
    step_by_step: 'Step 1: Make groups of ten. Step 2: Count the tens: 10, 20, 30. Step 3: Count the ones left. Step 4: Say the number.'
    real_world: Fishermen count the fish they catch in groups so they don't lose count.
  picture:
    kind: number_line
    from: 0
    to: 30
    step: 5
    points:
    - at: 10
      label: 1 ten
    - at: 20
      label: 2 tens
    - at: 24
      label: '24'
    alt: 'Counting shells on a number line: 10, 20, then 4 more makes 24.'
    jumps:
    - from: 0
      to: 10
      label: '+10'
    - from: 10
      to: 20
      label: '+10'
    - from: 20
      to: 24
      label: '+4'
  activity:
    type: number_line
    min: 20
    max: 60
    step: 1
    start: 20
    prompt: Count in tens, then the loose ones.
    goals:
    - prompt: 4 strings of 10 shells, and 3 loose shells
      target: 43
      mistakes:
      - when:
          v: 34
        say: 'The strings are tens: 4 tens is 40, then 41, 42, 43.'
      - when:
          v: 40
        say: Don't forget the 3 loose shells.
    - prompt: 5 strings of 10 shells, and 2 loose shells
      target: 52
      mistakes:
      - when:
          v: 25
        say: 'The strings are tens: 5 tens is 50. Then 2 more.'
      - when:
          v: 50
        say: Add the 2 loose shells too.
    - prompt: 3 strings of 10, and 6 loose
      target: 36
      mistakes:
      - when:
          v: 30
        say: Count the 6 loose shells after 30.
      - when:
          v: 37
        say: 'Count the loose ones once each: 31, 32, 33, 34, 35, 36.'
  lesson:
    - teach: 'To count, touch each thing once and say one number for it. 7 shells: 1, 2, 3, 4, 5, 6, 7. The last number you say tells how many.'
      check:
        prompt: You count 1, 2, 3, 4, 5 crabs. How many crabs?
        options:
        - '5'
        - '1'
        - '6'
        answer: '5'
        why: The last number said tells how many.
      ways:
      - style: visual
        teach: 'Counting 6 crabs: one number for each crab, and the last number is how many.'
        picture:
          kind: number_line
          from: 0
          to: 8
          step: 1
          points:
          - at: 1
            label: 🦀
          - at: 2
            label: 🦀
          - at: 3
            label: 🦀
          - at: 4
            label: 🦀
          - at: 5
            label: 🦀
          - at: 6
            label: 🦀 last
          alt: 'Six crabs are counted one by one: 1, 2, 3, 4, 5, 6. The last number said is 6, so there are 6 crabs.'
      - style: real_world
        teach: When children pick up shells on the beach, they often drop each shell into a bucket and say a number out loud. Saying one number for each shell keeps the count right.
    - teach: 'When there are many things, make groups of 10. 3 groups of 10 and 4 more: 10, 20, 30, then 31, 32, 33, 34.'
      picture:
        kind: compare
        columns:
        - title: Groups of 10
          points:
          - '10'
          - '10'
          - '10'
        - title: Loose
          points:
          - '4'
        alt: Three groups of ten and four loose make 34.
      check:
        prompt: '2 groups of 10 and 3 more make:'
        options:
        - '23'
        - '13'
        - '32'
        answer: '23'
        why: 10, 20, then 21, 22, 23.
      ways:
      - style: step_by_step
        teach: 'Count 27 pebbles. Step 1: Make a pile of 10. Step 2: Make another pile of 10. Step 3: 7 pebbles are left. Step 4: Count: 10, 20, then 21, 22, 23, 24, 25, 26, 27.'
      - style: real_world
        teach: Fish sellers on the beach often sell small fish in heaps of 10. A buyer who wants 30 takes three heaps, without counting every fish one by one.
    - teach: The number just after is 1 more. The number just before is 1 less. After 29 comes 30. Before 30 comes 29.
      picture:
        kind: number_line
        from: 25
        to: 35
        points:
        - at: 29
          label: before
        - at: 30
          label: '30'
        - at: 31
          label: after
        alt: 29 comes just before 30, and 31 comes just after.
      check:
        prompt: What comes just after 49?
        options:
        - '50'
        - '48'
        - '40'
        answer: '50'
        why: 1 more than 49 is 50.
      ways:
      - style: step_by_step
        teach: 'Find the number just after 49. Step 1: Say 49. Step 2: Say the next number: 50. Step 3: The 9 ones became 10 ones, which is one more ten. So 4 tens became 5 tens.'
      - style: real_world
        teach: Beach huts have numbers in order. If your family is in hut 33, the hut on one side is 32 and the hut on the other side is 34.
  items:
  - prompt: Riya found 7 shells and then 3 more. How many shells now?
    answer: '10'
    check: 7 + 3
    difficulty: 1
    hints:
    - Count on from 7.
    - 8, 9, 10.
    solution: 7 + 3 = 10.
    mistakes:
      '9': c2_count_once
      '11': c2_count_once
  - prompt: What number comes just after 39?
    answer: '40'
    check: 39 + 1
    difficulty: 1
    hints:
    - Count one more.
    - 39, then ...
    solution: After 39 comes 40.
    mistakes:
      '310': c2_tens_ones
      '30': c2_tens_ones
  - prompt: What number comes just before 60?
    answer: '59'
    check: 60 - 1
    difficulty: 1
    hints:
    - Count one back.
    - 58, ..., 60.
    solution: Before 60 comes 59.
    mistakes: {"61": "m3_before", "58": "m3_before"}
  - prompt: '2 tens and 4 ones make:'
    answer: '24'
    check: 2*10 + 4
    difficulty: 1
    hints:
    - 20 and 4.
    - Write tens first.
    solution: 20 + 4 = 24.
    mistakes:
      '42': c2_tens_ones
      '6': c2_tens_ones
  - prompt: There are 5 boats. Each boat has 2 people. How many people?
    answer: '10'
    check: 5*2
    difficulty: 2
    hints:
    - Count by twos.
    - 2, 4, 6, 8, 10.
    solution: 2 + 2 + 2 + 2 + 2 = 10.
    mistakes:
      '7': c2_count_once
  - prompt: Which number is the biggest?
    options:
    - '81'
    - '18'
    - '71'
    - '80'
    answer: '81'
    difficulty: 2
    hints:
    - Look at the tens first.
    - 8 tens is more than 7 tens.
    solution: 81 has 8 tens and 1 one, the most.
    mistakes:
      '18': c2_tens_ones
  - prompt: 'Count the shells: 🐚 🐚 🐚 🐚 🐚 🐚 🐚 🐚. How many?'
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - Touch each shell once.
    - Say one number for each.
    solution: 'Step 1: Count 1 to 8. Step 2: 8 shells.'
    mistakes:
      '7': c2m1_one
      '9': c2m1_one
  - prompt: What comes just after 69?
    answer: '70'
    check: 69+1
    difficulty: 1
    hints:
    - Add 1.
    - 9 ones and 1 more make a new ten.
    solution: 'Step 1: 69 + 1. Step 2: = 70.'
    mistakes:
      '68': c2m1_next
      '610': c2m1_next
  - prompt: What comes just before 80?
    answer: '79'
    check: 80-1
    difficulty: 1
    hints:
    - Take 1 away.
    - One less than 80.
    solution: 'Step 1: 80 − 1. Step 2: = 79.'
    mistakes:
      '81': c2m1_next
      '70': c2m1_next
  - prompt: 4 groups of 10 shells and 6 loose shells. How many shells?
    answer: '46'
    check: 40+6
    difficulty: 2
    hints:
    - Count the groups in tens.
    - Then add the loose ones.
    solution: 'Step 1: 10, 20, 30, 40. Step 2: 40 + 6 = 46.'
    mistakes:
      '10': c2m1_ten
      '64': c2m1_ten
  - prompt: There are 9 children on the sand and 1 more comes. How many children now?
    answer: '10'
    check: 9+1
    difficulty: 1
    hints:
    - One more joins.
    - What comes after 9?
    solution: 'Step 1: 9 + 1. Step 2: = 10.'
    mistakes:
      '8': c2m1_next
      '9': c2m1_one
  - prompt: Which number is the smallest?
    options:
    - '19'
    - '91'
    - '29'
    answer: '19'
    difficulty: 2
    hints:
    - Look at the tens first.
    - Which has the fewest tens?
    solution: 'Step 1: Tens: 1, 9, 2. Step 2: 19 has the fewest tens, so it is smallest.'
    mistakes:
      '91': c2m1_ten
      '29': c2m1_ten
  - prompt: 3 boats. Each boat has 3 fishermen. How many fishermen?
    answer: '9'
    check: 3*3
    difficulty: 2
    hints:
    - 3 in each boat.
    - 3, 6, 9.
    solution: 'Step 1: 3 + 3 + 3. Step 2: = 9.'
    mistakes:
      '6': c2m1_one
      '3': c2m1_one
  - prompt: What number is between 57 and 59?
    answer: '58'
    check: '58'
    difficulty: 1
    hints:
    - Count 57, ..., 59.
    - What is in the middle?
    solution: 'Step 1: 57, 58, 59. Step 2: 58 is between.'
    mistakes:
      '56': c2m1_next
      '60': c2m1_next
  - prompt: Sam had 20 shells. A wave took 5. How many are left?
    answer: '15'
    check: 20-5
    difficulty: 3
    hints:
    - Some shells went away.
    - Count back 5 from 20.
    solution: 'Step 1: 20 − 5. Step 2: = 15 shells.'
    mistakes:
      '25': c2m1_next
      '5': c2m1_one
  - prompt: 'Case: Two children count the same boats on the beach. One gets 12, and the other gets 14. The second child is seen counting some boats twice. How many boats are there most likely?'
    options:
    - 12, because each boat must be counted only once
    - 14, because the bigger number is right
    - 26, because you add both counts
    answer: 12, because each boat must be counted only once
    hints:
    - What went wrong in the second count?
    - How should each thing be counted?
    solution: Counting a boat twice makes the count too big. Touching each boat once gives the right count, 12.
    mistakes:
      14, because the bigger number is right: c2m1_one
      26, because you add both counts: c2m1_one
    exam: case
    difficulty: 2
  - prompt: 'Situation: You have 3 bundles of 10 sticks and 8 loose sticks for a sandcastle fence. How many sticks do you have?'
    options:
    - '38'
    - '11'
    - '83'
    answer: '38'
    hints:
    - Count the bundles in tens first.
    - Then count on the loose sticks.
    solution: '3 bundles of 10 are 10, 20, 30. Then 8 more: 31 to 38. You have 38 sticks.'
    mistakes:
      '11': c2m1_ten
      '83': c2_tens_ones
    exam: competency
    difficulty: 2
- code: cbse2m.beach.tens
  title: Tens and ones
  after:
  - cbse2m.beach.count
  notes: |
    A two-digit number has tens and ones: 47 = 4 tens and 7 ones = 40 + 7. Bundles of 10 sticks and loose sticks.
    Reading and writing numbers up to 99 in figures; comparing two numbers by looking at tens first.
  explanations:
    text: 'A number like 47 has two parts: 4 tens and 7 ones. Think of 4 bundles of ten sticks and 7 loose sticks. 40 and 7 make 47.'
    visual: Draw 4 bundles of ten sticks and 7 single sticks, and write 47 under them.
    step_by_step: 'Step 1: Count the bundles of ten. Step 2: Count the loose ones. Step 3: Write tens on the left, ones on the right.'
    real_world: Ice-cream sticks at a shop are tied in bundles of ten to count them quickly.
  picture:
    kind: compare
    columns:
    - title: Tens
      points:
      - 4 bundles
      - '40'
    - title: Ones
      points:
      - 7 loose sticks
      - '7'
    alt: 47 is 4 bundles of ten, which is 40, and 7 loose sticks, which is 7.
  activity:
    type: sort
    prompt: Make the number. Tens come first.
    bins:
    - '47'
    - '74'
    - '16'
    - '61'
    items:
    - label: 4 tens and 7 ones
      bin: '47'
      clue: 4 tens is 40. Then the ones.
      why: 40 and 7 is 47. 74 would be 7 tens.
    - label: 7 tens and 4 ones
      bin: '74'
      clue: 7 tens is 70. Then the ones.
      why: 70 and 4 is 74. 47 would be only 4 tens.
    - label: 1 ten and 6 ones
      bin: '16'
      clue: 1 ten is 10.
      why: 10 and 6 is 16.
    - label: 6 tens and 1 one
      bin: '61'
      clue: 6 tens is 60.
      why: 60 and 1 is 61. 16 would be only 1 ten.
    - label: 40 + 7
      bin: '47'
      clue: Which is the tens part?
      why: '40 is 4 tens: 47.'
    - label: 70 + 4
      bin: '74'
      clue: Which is the tens part?
      why: '70 is 7 tens: 74.'
    - label: 10 + 6
      bin: '16'
      clue: Which is the tens part?
      why: '10 is 1 ten: 16.'
    - label: 60 + 1
      bin: '61'
      clue: Which is the tens part?
      why: '60 is 6 tens: 61.'
  lesson:
    - teach: A two-digit number has tens and ones. 35 means 3 tens and 5 ones. Think of 3 bundles of 10 sticks and 5 loose sticks.
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: tens
        - size: 1
          label: ones
        rows:
        - size: 1
          label: '35'
        cells:
        - - 3 → 30
          - 5 → 5
        alt: 35 split into 3 tens and 5 ones.
      check:
        prompt: How many tens are in 35?
        options:
        - '3'
        - '5'
        - '35'
        answer: '3'
        why: The left digit tells the tens.
      ways:
      - style: step_by_step
        teach: 'Show 53 with sticks. Step 1: Look at the left digit, 5: make 5 bundles of 10. Step 2: Look at the right digit, 3: put 3 loose sticks. Step 3: Count: 10, 20, 30, 40, 50, then 51, 52, 53.'
      - style: real_world
        teach: 'Eggs are often sold in trays of 10 in some shops. A shopkeeper with 2 full trays and 6 extra eggs has 26 eggs: 2 tens and 6 ones.'
    - teach: 'We can write a number as tens plus ones: 35 = 30 + 5. 62 = 60 + 2.'
      check:
        prompt: 40 + 7 = ?
        options:
        - '47'
        - '74'
        - '407'
        answer: '47'
        why: 4 tens and 7 ones make 47.
      ways:
      - style: visual
        teach: Writing the number 81 as its tens plus its ones.
        picture:
          kind: compare
          columns:
          - title: Tens
            points:
            - 8 tens
            - '80'
          - title: Ones
            points:
            - 1 one
            - '1'
          - title: Number
            points:
            - 80 + 1 = 81
          alt: 81 is 8 tens and 1 one, which is 80 + 1.
      - style: real_world
        teach: 'When you pay 43 rupees with 10-rupee notes and 1-rupee coins, you give 4 notes and 3 coins: 40 + 3.'
    - teach: To compare two numbers, look at the tens first. 52 is bigger than 48 because 5 tens is more than 4 tens. If tens are the same, look at the ones.
      check:
        prompt: Which is bigger, 63 or 36?
        options:
        - '63'
        - '36'
        - they are the same
        answer: '63'
        why: 6 tens is more than 3 tens.
      ways:
      - style: visual
        teach: 'Comparing 61 and 16: look at the tens first.'
        picture:
          kind: compare
          columns:
          - title: '61'
            points:
            - 6 tens
            - 1 one
          - title: '16'
            points:
            - 1 ten
            - 6 ones
          alt: 61 has 6 tens and 16 has only 1 ten. 6 tens is more, so 61 is bigger, even though 16 has more ones.
      - style: step_by_step
        teach: 'Compare 36 and 32. Step 1: Look at the tens: both have 3 tens. Step 2: They are the same, so look at the ones: 6 and 2. Step 3: 6 is more than 2, so 36 is bigger.'
  items:
  - prompt: How many tens are in 47?
    answer: '4'
    check: 47 // 10
    difficulty: 1
    hints:
    - The left digit.
    - 40 is 4 tens.
    solution: 47 has 4 tens.
    mistakes:
      '7': c2_tens_ones
  - prompt: How many ones are in 47?
    answer: '7'
    check: 47 % 10
    difficulty: 1
    hints:
    - The right digit.
    - 47 = 40 + 7.
    solution: 47 has 7 ones.
    mistakes:
      '4': c2_tens_ones
  - prompt: '6 tens and 0 ones make:'
    answer: '60'
    check: 6*10
    difficulty: 1
    hints:
    - 6 bundles of ten.
    - No loose sticks.
    solution: 6 tens = 60.
    mistakes:
      '6': c2_tens_ones
  - prompt: '3 tens and 9 ones make:'
    answer: '39'
    check: 30 + 9
    difficulty: 1
    hints:
    - 30 and 9.
    - Tens first.
    solution: 30 + 9 = 39.
    mistakes:
      '93': c2_tens_ones
      '12': c2_tens_ones
  - prompt: 50 + 8 = ?
    answer: '58'
    check: 50 + 8
    difficulty: 2
    hints:
    - 5 tens and 8 ones.
    - Write 5 then 8.
    solution: 50 + 8 = 58.
    mistakes:
      '85': c2_tens_ones
  - prompt: Which is the same as 72?
    options:
    - 7 tens and 2 ones
    - 2 tens and 7 ones
    - 72 tens
    - 7 ones and 2 ones
    answer: 7 tens and 2 ones
    difficulty: 2
    hints:
    - Left digit is the tens.
    - 70 + 2.
    solution: 72 = 7 tens and 2 ones.
    mistakes:
      2 tens and 7 ones: c2_tens_ones
  - prompt: How many ones are in 58?
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - The right digit tells the ones.
    - 58 = 50 + ?
    solution: 'Step 1: 58 = 5 tens and 8 ones. Step 2: 8 ones.'
    mistakes:
      '5': c2m1_ten
      '58': c2m1_ten
  - prompt: '7 tens and 3 ones make:'
    answer: '73'
    check: 70+3
    difficulty: 1
    hints:
    - 7 tens is 70.
    - Add 3.
    solution: 'Step 1: 70 + 3. Step 2: = 73.'
    mistakes:
      '37': c2m1_ten
      '10': c2m1_ten
  - prompt: 90 + 1 = ?
    answer: '91'
    check: 90+1
    difficulty: 1
    hints:
    - 9 tens and 1 one.
    - Write 9, then 1.
    solution: 'Step 1: 9 tens, 1 one. Step 2: = 91.'
    mistakes:
      '19': c2m1_ten
      '901': c2m1_ten
  - prompt: How many tens are in 80?
    answer: '8'
    check: 80/10
    difficulty: 2
    hints:
    - 'Count in tens: 10, 20, ...'
    - How many jumps to 80?
    solution: 'Step 1: 80 = 8 tens. Step 2: 8.'
    mistakes:
      '0': c2m1_ten
      '80': c2m1_ten
  - prompt: Which is bigger, 45 or 54?
    options:
    - '54'
    - '45'
    - they are the same
    answer: '54'
    difficulty: 2
    hints:
    - Look at the tens first.
    - 5 tens or 4 tens?
    solution: 'Step 1: 54 has 5 tens; 45 has 4 tens. Step 2: 54 is bigger.'
    mistakes:
      '45': c2m1_ten
      they are the same: c2m1_ten
  - prompt: Which is smaller, 27 or 29?
    options:
    - '27'
    - '29'
    - they are the same
    answer: '27'
    difficulty: 2
    hints:
    - Tens are the same.
    - Compare the ones.
    solution: 'Step 1: Both have 2 tens. Step 2: 7 ones < 9 ones, so 27 is smaller.'
    mistakes:
      '29': c2m1_ten
      they are the same: c2m1_ten
  - prompt: 5 bundles of 10 sticks and 0 loose sticks. How many sticks?
    answer: '50'
    check: 5*10
    difficulty: 1
    hints:
    - Count in tens.
    - 10, 20, 30, 40, 50.
    solution: 'Step 1: 5 tens. Step 2: = 50.'
    mistakes:
      '5': c2m1_ten
      '15': c2m1_ten
  - prompt: Write 'sixty-four' in numbers.
    answer: '64'
    check: '64'
    difficulty: 2
    hints:
    - Sixty = 6 tens.
    - Four = 4 ones.
    solution: 'Step 1: 60 + 4. Step 2: = 64.'
    mistakes:
      '46': c2m1_ten
      '604': c2m1_ten
  - prompt: Using the digits 3 and 8, what is the biggest number you can make?
    answer: '83'
    check: '83'
    difficulty: 3
    hints:
    - Put the bigger digit in the tens place.
    - Tens place is on the left.
    solution: 'Step 1: 8 goes in the tens place. Step 2: 83.'
    mistakes:
      '38': c2m1_ten
      '11': c2m1_ten
  - prompt: 'Case: At the beach shop, a packet of shells costs 29 rupees and a toy bucket costs 92 rupees. A child says, ''They cost the same, because they use the same digits.'' Is the child right?'
    options:
    - No, the bucket costs more, because 9 tens is more than 2 tens
    - Yes, they cost the same
    - No, the shells cost more
    answer: No, the bucket costs more, because 9 tens is more than 2 tens
    hints:
    - Which digit shows the tens in each price?
    - Compare the tens first.
    solution: 29 is 2 tens and 9 ones. 92 is 9 tens and 2 ones. 9 tens is more, so the bucket costs more.
    mistakes:
      Yes, they cost the same: c2_tens_ones
      No, the shells cost more: c2_tens_ones
    exam: case
    difficulty: 2
  - prompt: 'Situation: You have number cards 4 and 9. You must make the biggest number you can. What do you make?'
    options:
    - '94'
    - '49'
    - '13'
    answer: '94'
    hints:
    - 'Which place is worth more: tens or ones?'
    - Put the bigger digit in that place.
    solution: The tens place is worth more. Putting 9 in the tens place makes 94, which is bigger than 49.
    mistakes:
      '49': c2_tens_ones
      '13': c2_tens_ones
    exam: competency
    difficulty: 2
