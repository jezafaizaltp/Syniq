# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 1
title: A Day at the Beach
tips:
  c2_count_once: Touch each thing as you count it, so you count every one once.
  c2_tens_ones: The left digit tells the tens, the right digit tells the ones.
concepts:
- code: cbse2m.beach.count
  title: Counting things up to 99
  notes: |
    Counting shells, boats and children at the beach. Count one by one, or make groups of ten and count the tens, then
    the ones left over. Numbers up to 99; the number just before and just after.
  explanations:
    text: At the beach we can count shells, boats and kites. To count many things, make groups of ten. Count the tens, then the ones left over.
    visual: 'Draw 2 bundles of 10 shells and 4 loose shells. Count: 10, 20, 21, 22, 23, 24.'
    step_by_step: 'Step 1: Make groups of ten. Step 2: Count the tens: 10, 20, 30. Step 3: Count the ones left. Step 4: Say the number.'
    real_world: Fishermen count the fish they catch in groups so they don't lose count.
  picture:
    kind: number_line
    from: 0
    to: 30
    step: 5
    points:
    - at: 10
      label: 1 ten
    - at: 20
      label: 2 tens
    - at: 24
      label: '24'
    alt: 'Counting shells on a number line: 10, 20, then 4 more makes 24.'
    jumps:
    - from: 0
      to: 10
      label: '+10'
    - from: 10
      to: 20
      label: '+10'
    - from: 20
      to: 24
      label: '+4'
  activity:
    type: number_line
    min: 20
    max: 60
    step: 1
    start: 20
    prompt: Count in tens, then the loose ones.
    goals:
    - prompt: 4 strings of 10 shells, and 3 loose shells
      target: 43
      mistakes:
      - when:
          v: 34
        say: 'The strings are tens: 4 tens is 40, then 41, 42, 43.'
      - when:
          v: 40
        say: Don't forget the 3 loose shells.
    - prompt: 5 strings of 10 shells, and 2 loose shells
      target: 52
      mistakes:
      - when:
          v: 25
        say: 'The strings are tens: 5 tens is 50. Then 2 more.'
      - when:
          v: 50
        say: Add the 2 loose shells too.
    - prompt: 3 strings of 10, and 6 loose
      target: 36
      mistakes:
      - when:
          v: 30
        say: Count the 6 loose shells after 30.
      - when:
          v: 37
        say: 'Count the loose ones once each: 31, 32, 33, 34, 35, 36.'
  items:
  - prompt: Riya found 7 shells and then 3 more. How many shells now?
    answer: '10'
    check: 7 + 3
    difficulty: 1
    hints:
    - Count on from 7.
    - 8, 9, 10.
    solution: 7 + 3 = 10.
    mistakes:
      '9': c2_count_once
      '11': c2_count_once
  - prompt: What number comes just after 39?
    answer: '40'
    check: 39 + 1
    difficulty: 1
    hints:
    - Count one more.
    - 39, then ...
    solution: After 39 comes 40.
    mistakes:
      '310': c2_tens_ones
      '30': c2_tens_ones
  - prompt: What number comes just before 60?
    answer: '59'
    check: 60 - 1
    difficulty: 1
    hints:
    - Count one back.
    - 58, ..., 60.
    solution: Before 60 comes 59.
    mistakes: {"61": "m3_before", "58": "m3_before"}
  - prompt: '2 tens and 4 ones make:'
    answer: '24'
    check: 2*10 + 4
    difficulty: 1
    hints:
    - 20 and 4.
    - Write tens first.
    solution: 20 + 4 = 24.
    mistakes:
      '42': c2_tens_ones
      '6': c2_tens_ones
  - prompt: There are 5 boats. Each boat has 2 people. How many people?
    answer: '10'
    check: 5*2
    difficulty: 2
    hints:
    - Count by twos.
    - 2, 4, 6, 8, 10.
    solution: 2 + 2 + 2 + 2 + 2 = 10.
    mistakes:
      '7': c2_count_once
  - prompt: Which number is the biggest?
    options:
    - '81'
    - '18'
    - '71'
    - '80'
    answer: '81'
    difficulty: 2
    hints:
    - Look at the tens first.
    - 8 tens is more than 7 tens.
    solution: 81 has 8 tens and 1 one, the most.
    mistakes:
      '18': c2_tens_ones
- code: cbse2m.beach.tens
  title: Tens and ones
  after:
  - cbse2m.beach.count
  notes: |
    A two-digit number has tens and ones: 47 = 4 tens and 7 ones = 40 + 7. Bundles of 10 sticks and loose sticks.
    Reading and writing numbers up to 99 in figures; comparing two numbers by looking at tens first.
  explanations:
    text: 'A number like 47 has two parts: 4 tens and 7 ones. Think of 4 bundles of ten sticks and 7 loose sticks. 40 and 7 make 47.'
    visual: Draw 4 bundles of ten sticks and 7 single sticks, and write 47 under them.
    step_by_step: 'Step 1: Count the bundles of ten. Step 2: Count the loose ones. Step 3: Write tens on the left, ones on the right.'
    real_world: Ice-cream sticks at a shop are tied in bundles of ten to count them quickly.
  picture:
    kind: compare
    columns:
    - title: Tens
      points:
      - 4 bundles
      - '40'
    - title: Ones
      points:
      - 7 loose sticks
      - '7'
    alt: 47 is 4 bundles of ten, which is 40, and 7 loose sticks, which is 7.
  activity:
    type: sort
    prompt: Make the number. Tens come first.
    bins:
    - '47'
    - '74'
    - '16'
    - '61'
    items:
    - label: 4 tens and 7 ones
      bin: '47'
      clue: 4 tens is 40. Then the ones.
      why: 40 and 7 is 47. 74 would be 7 tens.
    - label: 7 tens and 4 ones
      bin: '74'
      clue: 7 tens is 70. Then the ones.
      why: 70 and 4 is 74. 47 would be only 4 tens.
    - label: 1 ten and 6 ones
      bin: '16'
      clue: 1 ten is 10.
      why: 10 and 6 is 16.
    - label: 6 tens and 1 one
      bin: '61'
      clue: 6 tens is 60.
      why: 60 and 1 is 61. 16 would be only 1 ten.
    - label: 40 + 7
      bin: '47'
      clue: Which is the tens part?
      why: '40 is 4 tens: 47.'
    - label: 70 + 4
      bin: '74'
      clue: Which is the tens part?
      why: '70 is 7 tens: 74.'
    - label: 10 + 6
      bin: '16'
      clue: Which is the tens part?
      why: '10 is 1 ten: 16.'
    - label: 60 + 1
      bin: '61'
      clue: Which is the tens part?
      why: '60 is 6 tens: 61.'
  items:
  - prompt: How many tens are in 47?
    answer: '4'
    check: 47 // 10
    difficulty: 1
    hints:
    - The left digit.
    - 40 is 4 tens.
    solution: 47 has 4 tens.
    mistakes:
      '7': c2_tens_ones
  - prompt: How many ones are in 47?
    answer: '7'
    check: 47 % 10
    difficulty: 1
    hints:
    - The right digit.
    - 47 = 40 + 7.
    solution: 47 has 7 ones.
    mistakes:
      '4': c2_tens_ones
  - prompt: '6 tens and 0 ones make:'
    answer: '60'
    check: 6*10
    difficulty: 1
    hints:
    - 6 bundles of ten.
    - No loose sticks.
    solution: 6 tens = 60.
    mistakes:
      '6': c2_tens_ones
  - prompt: '3 tens and 9 ones make:'
    answer: '39'
    check: 30 + 9
    difficulty: 1
    hints:
    - 30 and 9.
    - Tens first.
    solution: 30 + 9 = 39.
    mistakes:
      '93': c2_tens_ones
      '12': c2_tens_ones
  - prompt: 50 + 8 = ?
    answer: '58'
    check: 50 + 8
    difficulty: 2
    hints:
    - 5 tens and 8 ones.
    - Write 5 then 8.
    solution: 50 + 8 = 58.
    mistakes:
      '85': c2_tens_ones
  - prompt: Which is the same as 72?
    options:
    - 7 tens and 2 ones
    - 2 tens and 7 ones
    - 72 tens
    - 7 ones and 2 ones
    answer: 7 tens and 2 ones
    difficulty: 2
    hints:
    - Left digit is the tens.
    - 70 + 2.
    solution: 72 = 7 tens and 2 ones.
    mistakes:
      2 tens and 7 ones: c2_tens_ones
