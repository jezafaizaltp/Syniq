# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 3. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 3
title: Fun with Numbers
tips:
  m3_smaller_tens: "All start with 6 tens. Compare the ones."
  c2m3_jump: Find how much each number jumps by. Then make the same jump again.
  c2m3_back: When counting back, each step is one less.
  c2m3_tens: Look at the tens first. Only look at the ones if the tens are the same.

concepts:
- code: cbse2m.fun.skip
  title: Counting forward, backward and in skips
  notes: |
    Counting forward (1, 2, 3 ...) and backward (10, 9, 8 ...). Skip counting in 2s, 5s and 10s. Finding the missing
    number in a sequence.
  explanations:
    text: 'We can count forward: 1, 2, 3. We can count backward: 10, 9, 8. We can also skip: in twos (2, 4, 6), in fives (5, 10, 15) or in tens (10, 20, 30).'
    visual: 'Draw a number line from 0 to 20 and hop like a frog in twos: 2, 4, 6, 8 ... 20.'
    step_by_step: 'Step 1: Find the jump size. Step 2: Start at the first number. Step 3: Add the jump each time. Step 4: Check the pattern.'
    real_world: We count pairs of shoes in twos and fingers on hands in fives.
  picture:
    kind: number_line
    from: 0
    to: 20
    step: 2
    points:
    - at: 2
      label: '2'
    - at: 4
      label: '4'
    - at: 6
      label: '6'
    - at: 8
      label: '8'
    - at: 10
      label: '10'
    alt: 'A frog hops in twos on a number line: 2, 4, 6, 8, 10.'
    jumps:
    - from: 0
      to: 2
      label: '+2'
    - from: 2
      to: 4
      label: '+2'
    - from: 4
      to: 6
      label: '+2'
    - from: 6
      to: 8
      label: '+2'
    - from: 8
      to: 10
      label: '+2'
  activity:
    type: number_line
    min: 0
    max: 40
    step: 1
    start: 0
    prompt: Skip count. Find the next number.
    goals:
    - prompt: 2, 4, 6, 8, ...
      target: 10
      mistakes:
      - when:
          v: 9
        say: 'That counts in ones. Each jump is 2: 8, then 10.'
    - prompt: 5, 10, 15, 20, ...
      target: 25
      mistakes:
      - when:
          v: 21
        say: That counts in ones. Each jump is 5.
      - when:
          v: 30
        say: That jumped twice. One more jump of 5.
    - prompt: 'Backward: 20, 18, 16, ...'
      target: 14
      mistakes:
      - when:
          v: 18
        say: Backward means smaller. 16 take 2.
      - when:
          v: 15
        say: Each jump back is 2, not 1.
    - prompt: 10, 20, 30, ...
      target: 40
      mistakes:
      - when:
          v: 31
        say: Each jump is 10, not 1.
  lesson:
    - teach: 'Counting forward goes up by 1: 21, 22, 23. Counting backward goes down by 1: 23, 22, 21.'
      check:
        prompt: 'Count back: 15, 14, 13, __'
        options:
        - '12'
        - '14'
        - '16'
        answer: '12'
        why: Each step back is one less.
      ways:
      - style: visual
        teach: Counting forward and counting backward on a number line.
        picture:
          kind: number_line
          from: 30
          to: 36
          step: 1
          jumps:
          - from: 32
            to: 33
            label: '+1'
          - from: 33
            to: 34
            label: '+1'
          - from: 34
            to: 35
            label: '+1'
          alt: 'Counting forward from 32 goes 33, 34, 35: each jump is one more. Counting backward goes the other way: 35, 34, 33.'
      - style: real_world
        teach: 'Before a race starts, children often count backward: 3, 2, 1, go! Rockets also count backward before they fly.'
    - teach: 'Skip counting jumps by the same amount. By 2s: 2, 4, 6, 8. By 5s: 5, 10, 15, 20. By 10s: 10, 20, 30, 40.'
      picture:
        kind: number_line
        from: 0
        to: 20
        jumps:
        - from: 0
          to: 5
        - from: 5
          to: 10
        - from: 10
          to: 15
        - from: 15
          to: 20
        alt: 'Jumps of 5 on a number line: 5, 10, 15, 20.'
      check:
        prompt: 'Skip count by 10: 30, 40, __'
        options:
        - '50'
        - '41'
        - '45'
        answer: '50'
        why: Each jump adds 10.
      ways:
      - style: visual
        teach: Skip counting by 5s, starting at 40, on a number line.
        picture:
          kind: number_line
          from: 40
          to: 70
          step: 5
          jumps:
          - from: 40
            to: 45
            label: '+5'
          - from: 45
            to: 50
            label: '+5'
          - from: 50
            to: 55
            label: '+5'
          - from: 55
            to: 60
            label: '+5'
          - from: 60
            to: 65
            label: '+5'
          alt: Skip counting by 5s from 40 jumps to 45, 50, 55, 60 and 65 on the number line. Each jump is the same size.
      - style: real_world
        teach: Pairs of socks or shoes are easy to count in 2s. A shoe rack with 3 pairs has 2, 4, 6 shoes.
    - teach: To find a missing number, see how much each number changes, then do the same change.
      check:
        prompt: 4, 6, __, 10
        options:
        - '8'
        - '7'
        - '9'
        answer: '8'
        why: 'Each jump is 2: 6 + 2 = 8.'
      ways:
      - style: step_by_step
        teach: 'Find the missing number in 31, 33, __, 37. Step 1: Look at 31 and 33: the jump is 2. Step 2: Check 35 and 37 would also jump by 2. Step 3: 33 + 2 = 35. Step 4: The missing number is 35.'
      - style: visual
        teach: Finding the jump size, then using it to fill the gap.
        picture:
          kind: flow
          steps:
          - Look at two numbers next to each other
          - Find how much it jumps
          - Check the jump is the same each time
          - Make the same jump to fill the gap
          alt: Look at two numbers next to each other, find how much it jumps, check that the jump is the same each time, and make the same jump to fill the gap.
  items:
  - prompt: 2, 4, 6, 8, __ ?
    answer: '10'
    check: 8 + 2
    difficulty: 1
    hints:
    - Jump by 2.
    - 8 + 2.
    solution: 8 + 2 = 10.
    mistakes:
      '9': c2_count_once
  - prompt: 5, 10, 15, __ ?
    answer: '20'
    check: 15 + 5
    difficulty: 1
    hints:
    - Jump by 5.
    - 15 + 5.
    solution: 15 + 5 = 20.
    mistakes:
      '16': c2_count_once
  - prompt: 10, 20, 30, __ ?
    answer: '40'
    check: 30 + 10
    difficulty: 1
    hints:
    - Jump by 10.
    - 30 + 10.
    solution: 30 + 10 = 40.
    mistakes:
      '31': c2_count_once
  - prompt: 'Count back: 10, 9, 8, __ ?'
    answer: '7'
    check: 8 - 1
    difficulty: 1
    hints:
    - One less each time.
    - 8 − 1.
    solution: 8 − 1 = 7.
    mistakes:
      '9': c2_count_once
  - prompt: How many fingers on 3 hands? (count in fives)
    answer: '15'
    check: 3*5
    difficulty: 2
    hints:
    - 5, 10, ...
    - Three jumps of 5.
    solution: 5 + 5 + 5 = 15.
    mistakes:
      '8': c2_count_once
  - prompt: 20, 18, 16, __ ?
    answer: '14'
    check: 16 - 2
    difficulty: 2
    hints:
    - Going down by 2.
    - 16 − 2.
    solution: 16 − 2 = 14.
    mistakes:
      '18': c2_count_once
      '15': c2_count_once
  - prompt: 'Skip count by 2: 12, 14, 16, __'
    answer: '18'
    check: 16+2
    difficulty: 1
    hints:
    - Each step adds 2.
    - 16 + 2.
    solution: 'Step 1: Jumps of 2. Step 2: 16 + 2 = 18.'
    mistakes:
      '17': c2m3_jump
      '20': c2m3_jump
  - prompt: 'Skip count by 5: 20, 25, 30, __'
    answer: '35'
    check: 30+5
    difficulty: 1
    hints:
    - Each step adds 5.
    - 30 + 5.
    solution: 'Step 1: Jumps of 5. Step 2: 30 + 5 = 35.'
    mistakes:
      '31': c2m3_jump
      '40': c2m3_jump
  - prompt: 'Count back: 50, 49, 48, __'
    answer: '47'
    check: 48-1
    difficulty: 1
    hints:
    - Each step is 1 less.
    - 48 − 1.
    solution: 'Step 1: Back by 1. Step 2: 48 − 1 = 47.'
    mistakes:
      '49': c2m3_back
      '46': c2m3_back
  - prompt: 'Find the missing number: 30, __, 50, 60'
    answer: '40'
    check: 30+10
    difficulty: 1
    hints:
    - How much does it jump?
    - 50 to 60 is 10.
    solution: 'Step 1: Jumps of 10. Step 2: 30 + 10 = 40.'
    mistakes:
      '35': c2m3_jump
      '45': c2m3_jump
  - prompt: 'Count back by 10: 90, 80, 70, __'
    answer: '60'
    check: 70-10
    difficulty: 2
    hints:
    - Each step is 10 less.
    - 70 − 10.
    solution: 'Step 1: Back by 10. Step 2: 70 − 10 = 60.'
    mistakes:
      '69': c2m3_back
      '80': c2m3_back
  - prompt: How many legs do 4 hens have? (count in 2s)
    answer: '8'
    check: 2*4
    difficulty: 2
    hints:
    - Each hen has 2 legs.
    - 2, 4, 6, 8.
    solution: 'Step 1: Count in 2s four times. Step 2: 8 legs.'
    mistakes:
      '6': c2m3_jump
      '4': c2m3_jump
  - prompt: How many toes on 4 feet? (count in fives)
    answer: '20'
    check: 5*4
    difficulty: 2
    hints:
    - Each foot has 5 toes.
    - 5, 10, 15, 20.
    solution: 'Step 1: Count in 5s four times. Step 2: 20 toes.'
    mistakes:
      '9': c2m3_jump
      '15': c2m3_jump
  - prompt: 'Find the missing number: 25, 20, __, 10'
    answer: '15'
    check: 20-5
    difficulty: 2
    hints:
    - Is it going up or down?
    - By how much?
    solution: 'Step 1: Down by 5. Step 2: 20 − 5 = 15.'
    mistakes:
      '25': c2m3_back
      '18': c2m3_back
  - prompt: Riya has 6 coins of ₹5. How much money? (count in fives)
    answer: '30'
    check: 5*6
    difficulty: 3
    hints:
    - Count 5 for each coin.
    - 5, 10, 15, ... six times.
    solution: 'Step 1: 5, 10, 15, 20, 25, 30. Step 2: ₹30.'
    mistakes:
      '11': c2m3_jump
      '25': c2m3_jump
  - prompt: 'Case: Children are lining up chairs for a show. The chair numbers go 50, 52, 54, then a number is missing, then 58. A child writes 55 for the missing chair. Is that right?'
    options:
    - No, it should be 56, because the numbers jump by 2
    - Yes, 55 is right
    - No, it should be 60
    answer: No, it should be 56, because the numbers jump by 2
    hints:
    - How much does each number jump by?
    - Make the same jump from 54.
    solution: 50, 52, 54 jump by 2 each time. 54 + 2 = 56, and 56 + 2 = 58. The missing number is 56.
    mistakes:
      Yes, 55 is right: c2m3_jump
      No, it should be 60: c2m3_jump
    exam: case
    difficulty: 2
  - prompt: 'Situation: You have 7 coins of ₹10 in your piggy bank. How much money is that? Count in tens.'
    options:
    - ₹70
    - ₹17
    - ₹7
    answer: ₹70
    hints:
    - 'Count in tens: 10, 20, 30...'
    - Say one ten for each coin.
    solution: 'Counting in tens for 7 coins: 10, 20, 30, 40, 50, 60, 70. That is ₹70.'
    mistakes:
      ₹17: c2m3_jump
      ₹7: c2m3_jump
    exam: competency
    difficulty: 2
- code: cbse2m.fun.order
  title: Comparing and ordering numbers
  after:
  - cbse2m.fun.skip
  notes: |
    Bigger and smaller numbers, more and less. Comparing two-digit numbers: tens first, then ones. Arranging numbers
    from smallest to biggest. Numbers between two numbers.
  explanations:
    text: To see which number is bigger, look at the tens first. 52 is bigger than 25 because 5 tens is more than 2 tens. If the tens are the same, look at the ones.
    visual: Draw 52 as 5 bundles and 2 sticks, and 25 as 2 bundles and 5 sticks. The first pile is clearly bigger.
    step_by_step: 'Step 1: Compare the tens. Step 2: If the tens are the same, compare the ones. Step 3: Say which is bigger.'
    real_world: At a shop we compare prices to see which toy costs less.
  picture:
    kind: bars
    bars:
    - label: '25'
      value: 25
    - label: '52'
      value: 52
    alt: 52 is a much taller bar than 25, so 52 is bigger.
  activity:
    type: sort
    prompt: Which number is bigger? Look at the tens first.
    bins:
    - The first
    - The second
    items:
    - label: 52 or 25
      bin: The first
      clue: 5 tens or 2 tens?
      why: 52 has 5 tens. More tens means bigger.
    - label: 38 or 83
      bin: The second
      clue: Which has more tens?
      why: 83 has 8 tens.
    - label: 47 or 49
      bin: The second
      clue: Tens are the same. Look at the ones.
      why: 9 ones is more than 7.
    - label: 60 or 59
      bin: The first
      clue: Don't be fooled by the 9. Look at the tens.
      why: 60 has 6 tens; 59 only 5.
    - label: 91 or 19
      bin: The first
      clue: 9 tens or 1 ten?
      why: 91 is much bigger.
    - label: 70 or 71
      bin: The second
      clue: Same tens. Compare ones.
      why: 1 one is more than 0.
  lesson:
    - teach: To see which number is bigger, look at the tens first. 72 is bigger than 27 because 7 tens is more than 2 tens.
      check:
        prompt: Which is bigger, 81 or 18?
        options:
        - '81'
        - '18'
        - they are the same
        answer: '81'
        why: 8 tens is more than 1 ten.
      ways:
      - style: step_by_step
        teach: 'Compare 63 and 36. Step 1: Look at the tens digits: 6 and 3. Step 2: 6 tens is more than 3 tens. Step 3: So 63 is bigger. You did not even need to look at the ones.'
      - style: visual
        teach: Two numbers with the same digits, 52 and 25, drawn as bars so you can see which is bigger.
        picture:
          kind: bars
          bars:
          - label: 52 (5 tens)
            value: 52
          - label: 25 (2 tens)
            value: 25
          alt: A bar for 52, which has 5 tens, is about twice as long as a bar for 25, which has only 2 tens. So 52 is bigger.
    - teach: If the tens are the same, look at the ones. 45 and 48 both have 4 tens; 8 ones is more than 5 ones, so 48 is bigger.
      picture:
        kind: number_line
        from: 40
        to: 50
        points:
        - at: 45
          label: '45'
        - at: 48
          label: '48'
        alt: 48 is further right than 45, so it is bigger.
      check:
        prompt: Which is smaller, 33 or 36?
        options:
        - '33'
        - '36'
        - they are the same
        answer: '33'
        why: Same tens; 3 ones is less than 6 ones.
      ways:
      - style: visual
        teach: Comparing 73 and 77, which have the same tens.
        picture:
          kind: compare
          columns:
          - title: '73'
            points:
            - 7 tens
            - 3 ones
          - title: '77'
            points:
            - 7 tens
            - 7 ones
          alt: 73 and 77 both have 7 tens. 77 has 7 ones and 73 has 3 ones, so 77 is bigger.
      - style: real_world
        teach: 'Two shops sell the same pencil box, one for 46 rupees and one for 43. The tens are the same, so the ones decide: the box for 43 rupees is cheaper.'
    - teach: 'To put numbers in order, find the smallest first, then the next. Smallest first: 15, 28, 51.'
      check:
        prompt: 'Smallest first:'
        options:
        - 9, 19, 90
        - 90, 19, 9
        - 19, 9, 90
        answer: 9, 19, 90
        why: 9 < 19 < 90.
      ways:
      - style: visual
        teach: Putting three numbers in order, from smallest to biggest.
        picture:
          kind: number_line
          from: 10
          to: 70
          step: 10
          points:
          - at: 19
            label: '19'
          - at: 37
            label: '37'
          - at: 62
            label: '62'
          alt: On the number line, 19 is furthest left, then 37, then 62. So in order from smallest to biggest they are 19, 37, 62.
      - style: step_by_step
        teach: 'Order 47, 74 and 44 from smallest to biggest. Step 1: Look at the tens: 4, 7 and 4. Step 2: 74 is the biggest. Step 3: 47 and 44 both have 4 tens; compare the ones: 44 is smaller. Step 4: Write 44, 47, 74.'
  items:
  - prompt: 'Which is the biggest: 52, 25 or 22?'
    options:
    - '52'
    - '25'
    - '22'
    answer: '52'
    difficulty: 1
    hints:
    - 'Compare tens: 5 and 2.'
    - 5 tens is more.
    solution: 52 > 25.
    mistakes:
      '25': c2_tens_ones
  - prompt: 'Which is the smallest: 34, 43 or 44?'
    options:
    - '34'
    - '43'
    - '44'
    answer: '34'
    difficulty: 1
    hints:
    - Compare tens.
    - 3 tens is less than 4 tens.
    solution: 34 < 43.
    mistakes:
      '43': c2_tens_ones
  - prompt: Which number comes between 18 and 20?
    answer: '19'
    check: 18 + 1
    difficulty: 1
    hints:
    - Count 18, ..., 20.
    - One more than 18.
    solution: 18, 19, 20.
    mistakes: {"18": "m1_between", "20": "m1_between"}
  - prompt: 'Put in order, smallest first:'
    options:
    - 12, 21, 30
    - 30, 21, 12
    - 21, 12, 30
    - 12, 30, 21
    answer: 12, 21, 30
    difficulty: 2
    hints:
    - Find the smallest first.
    - 1 ten, 2 tens, 3 tens.
    solution: 12 < 21 < 30.
    mistakes: {"12, 30, 21": "m3_order"}
  - prompt: 'Which is the biggest: 67, 64 or 60?'
    options:
    - '67'
    - '64'
    - '60'
    answer: '67'
    difficulty: 2
    hints:
    - Tens are the same.
    - 'Compare the ones: 7 and 4.'
    solution: Both have 6 tens; 7 ones is more than 4, so 67 is bigger.
    mistakes: {"64": "m3_smaller_tens"}
  - prompt: What is the biggest two-digit number?
    answer: '99'
    check: '99'
    difficulty: 2
    hints:
    - The biggest digit is 9.
    - 9 tens and 9 ones.
    solution: 99 is the biggest two-digit number.
    mistakes:
      '100': c2_tens_ones
      '90': c2_tens_ones
  - prompt: 'Which is the biggest: 38, 83 or 33?'
    options:
    - '83'
    - '38'
    - '33'
    answer: '83'
    difficulty: 1
    hints:
    - Look at the tens.
    - Which has the most tens?
    solution: 'Step 1: Tens: 3, 8, 3. Step 2: 83 is the biggest.'
    mistakes:
      '38': c2m3_tens
      '33': c2m3_tens
  - prompt: 'Which is the smallest: 70, 17 or 71?'
    options:
    - '17'
    - '70'
    - '71'
    answer: '17'
    difficulty: 1
    hints:
    - Look at the tens.
    - Which has the fewest tens?
    solution: 'Step 1: Tens: 7, 1, 7. Step 2: 17 is the smallest.'
    mistakes:
      '70': c2m3_tens
      '71': c2m3_tens
  - prompt: Which number comes between 49 and 51?
    answer: '50'
    check: '50'
    difficulty: 1
    hints:
    - Count 49, ..., 51.
    - What is in the middle?
    solution: 'Step 1: 49, 50, 51. Step 2: 50.'
    mistakes:
      '48': c2m3_back
      '52': c2m3_back
  - prompt: 'Put in order, biggest first:'
    options:
    - 64, 46, 40
    - 40, 46, 64
    - 46, 64, 40
    answer: 64, 46, 40
    difficulty: 2
    hints:
    - Find the biggest first.
    - Then compare 46 and 40.
    solution: 'Step 1: 64 is biggest. Step 2: 46 > 40.'
    mistakes:
      40, 46, 64: c2m3_tens
      46, 64, 40: c2m3_tens
  - prompt: What is the smallest two-digit number?
    answer: '10'
    check: '10'
    difficulty: 2
    hints:
    - 9 has only one digit.
    - What comes after 9?
    solution: 'Step 1: 9 is one digit. Step 2: 10 is the smallest two-digit number.'
    mistakes:
      '11': c2m3_tens
      '1': c2m3_tens
  - prompt: Ali has 42 stickers and Meena has 24. Who has more?
    options:
    - Ali
    - Meena
    - both the same
    answer: Ali
    difficulty: 2
    hints:
    - Compare 42 and 24.
    - Tens first.
    solution: 'Step 1: 4 tens > 2 tens. Step 2: Ali has more.'
    mistakes:
      Meena: c2m3_tens
      both the same: c2m3_tens
  - prompt: Which is bigger, 59 or 61?
    options:
    - '61'
    - '59'
    - they are the same
    answer: '61'
    difficulty: 2
    hints:
    - Look at the tens, not the ones.
    - 6 tens or 5 tens?
    solution: 'Step 1: 61 has 6 tens; 59 has 5 tens. Step 2: 61 is bigger.'
    mistakes:
      '59': c2m3_tens
      they are the same: c2m3_tens
  - prompt: How many numbers are between 20 and 25?
    answer: '4'
    check: '4'
    difficulty: 3
    hints:
    - 'List them: 21, ...'
    - Do not count 20 or 25.
    solution: 'Step 1: 21, 22, 23, 24. Step 2: 4 numbers.'
    mistakes:
      '5': c2m3_back
      '6': c2m3_back
  - prompt: Using 5 and 2, what is the smallest number you can make?
    answer: '25'
    check: '25'
    difficulty: 3
    hints:
    - Put the smaller digit in the tens place.
    - Tens is on the left.
    solution: 'Step 1: 2 in tens, 5 in ones. Step 2: 25.'
    mistakes:
      '52': c2m3_tens
      '7': c2m3_tens
  - prompt: 'Case: Three children collected leaves. Asha has 29, Ben has 92 and Chitra has 22. The teacher wants them to stand in order from fewest leaves to most. What is the right order?'
    options:
    - Chitra, Asha, Ben
    - Ben, Asha, Chitra
    - Asha, Chitra, Ben
    answer: Chitra, Asha, Ben
    hints:
    - Who has the most tens?
    - For the two with the same tens, compare the ones.
    solution: 92 has 9 tens, so Ben has the most. 29 and 22 both have 2 tens; 22 is smaller. The order is Chitra (22), Asha (29), Ben (92).
    mistakes:
      Ben, Asha, Chitra: c2m3_tens
      Asha, Chitra, Ben: c2m3_tens
    exam: case
    difficulty: 2
  - prompt: 'Situation: You and a friend are playing a number game. You have 57 points and your friend has 75. Who has more points?'
    options:
    - Your friend, because 7 tens is more than 5 tens
    - You, because 7 ones is more than 5 ones
    - You both have the same
    answer: Your friend, because 7 tens is more than 5 tens
    hints:
    - Look at the tens digit in each number.
    - Which tens digit is bigger?
    solution: 57 has 5 tens and 75 has 7 tens. 7 tens is more, so your friend has more points.
    mistakes:
      You, because 7 ones is more than 5 ones: c2m3_tens
      You both have the same: c2m3_tens
    exam: competency
    difficulty: 2
