# CBSE Class 2 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 3. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse2-math
chapter: 3
title: Fun with Numbers
concepts:
- code: cbse2m.fun.skip
  title: Counting forward, backward and in skips
  notes: |
    Counting forward (1, 2, 3 ...) and backward (10, 9, 8 ...). Skip counting in 2s, 5s and 10s. Finding the missing
    number in a sequence.
  explanations:
    text: 'We can count forward: 1, 2, 3. We can count backward: 10, 9, 8. We can also skip: in twos (2, 4, 6), in fives (5, 10, 15) or in tens (10, 20, 30).'
    visual: 'Draw a number line from 0 to 20 and hop like a frog in twos: 2, 4, 6, 8 ... 20.'
    step_by_step: 'Step 1: Find the jump size. Step 2: Start at the first number. Step 3: Add the jump each time. Step 4: Check the pattern.'
    real_world: We count pairs of shoes in twos and fingers on hands in fives.
  picture:
    kind: number_line
    from: 0
    to: 20
    step: 2
    points:
    - at: 2
      label: '2'
    - at: 4
      label: '4'
    - at: 6
      label: '6'
    - at: 8
      label: '8'
    - at: 10
      label: '10'
    alt: 'A frog hops in twos on a number line: 2, 4, 6, 8, 10.'
    jumps:
    - from: 0
      to: 2
      label: '+2'
    - from: 2
      to: 4
      label: '+2'
    - from: 4
      to: 6
      label: '+2'
    - from: 6
      to: 8
      label: '+2'
    - from: 8
      to: 10
      label: '+2'
  items:
  - prompt: 2, 4, 6, 8, __ ?
    answer: '10'
    check: 8 + 2
    difficulty: 1
    hints:
    - Jump by 2.
    - 8 + 2.
    solution: 8 + 2 = 10.
    mistakes:
      '9': c2_count_once
  - prompt: 5, 10, 15, __ ?
    answer: '20'
    check: 15 + 5
    difficulty: 1
    hints:
    - Jump by 5.
    - 15 + 5.
    solution: 15 + 5 = 20.
    mistakes:
      '16': c2_count_once
  - prompt: 10, 20, 30, __ ?
    answer: '40'
    check: 30 + 10
    difficulty: 1
    hints:
    - Jump by 10.
    - 30 + 10.
    solution: 30 + 10 = 40.
    mistakes:
      '31': c2_count_once
  - prompt: 'Count back: 10, 9, 8, __ ?'
    answer: '7'
    check: 8 - 1
    difficulty: 1
    hints:
    - One less each time.
    - 8 − 1.
    solution: 8 − 1 = 7.
    mistakes:
      '9': c2_count_once
  - prompt: How many fingers on 3 hands? (count in fives)
    answer: '15'
    check: 3*5
    difficulty: 2
    hints:
    - 5, 10, ...
    - Three jumps of 5.
    solution: 5 + 5 + 5 = 15.
    mistakes:
      '8': c2_count_once
  - prompt: 20, 18, 16, __ ?
    answer: '14'
    check: 16 - 2
    difficulty: 2
    hints:
    - Going down by 2.
    - 16 − 2.
    solution: 16 − 2 = 14.
    mistakes:
      '18': c2_count_once
      '15': c2_count_once
- code: cbse2m.fun.order
  title: Comparing and ordering numbers
  after:
  - cbse2m.fun.skip
  notes: |
    Bigger and smaller numbers, more and less. Comparing two-digit numbers: tens first, then ones. Arranging numbers
    from smallest to biggest. Numbers between two numbers.
  explanations:
    text: To see which number is bigger, look at the tens first. 52 is bigger than 25 because 5 tens is more than 2 tens. If the tens are the same, look at the ones.
    visual: Draw 52 as 5 bundles and 2 sticks, and 25 as 2 bundles and 5 sticks. The first pile is clearly bigger.
    step_by_step: 'Step 1: Compare the tens. Step 2: If the tens are the same, compare the ones. Step 3: Say which is bigger.'
    real_world: At a shop we compare prices to see which toy costs less.
  picture:
    kind: bars
    bars:
    - label: '25'
      value: 25
    - label: '52'
      value: 52
    alt: 52 is a much taller bar than 25, so 52 is bigger.
  items:
  - prompt: 'Which is the biggest: 52, 25 or 22?'
    options:
    - '52'
    - '25'
    - '22'
    answer: '52'
    difficulty: 1
    hints:
    - 'Compare tens: 5 and 2.'
    - 5 tens is more.
    solution: 52 > 25.
    mistakes:
      '25': c2_tens_ones
  - prompt: 'Which is the smallest: 34, 43 or 44?'
    options:
    - '34'
    - '43'
    - '44'
    answer: '34'
    difficulty: 1
    hints:
    - Compare tens.
    - 3 tens is less than 4 tens.
    solution: 34 < 43.
    mistakes:
      '43': c2_tens_ones
  - prompt: Which number comes between 18 and 20?
    answer: '19'
    check: 18 + 1
    difficulty: 1
    hints:
    - Count 18, ..., 20.
    - One more than 18.
    solution: 18, 19, 20.
  - prompt: 'Put in order, smallest first:'
    options:
    - 12, 21, 30
    - 30, 21, 12
    - 21, 12, 30
    - 12, 30, 21
    answer: 12, 21, 30
    difficulty: 2
    hints:
    - Find the smallest first.
    - 1 ten, 2 tens, 3 tens.
    solution: 12 < 21 < 30.
  - prompt: 'Which is the biggest: 67, 64 or 60?'
    options:
    - '67'
    - '64'
    - '60'
    answer: '67'
    difficulty: 2
    hints:
    - Tens are the same.
    - 'Compare the ones: 7 and 4.'
    solution: Both have 6 tens; 7 ones is more than 4, so 67 is bigger.
  - prompt: What is the biggest two-digit number?
    answer: '99'
    check: '99'
    difficulty: 2
    hints:
    - The biggest digit is 9.
    - 9 tens and 9 ones.
    solution: 99 is the biggest two-digit number.
    mistakes:
      '100': c2_tens_ones
      '90': c2_tens_ones
