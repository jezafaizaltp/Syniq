# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 9. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 9
title: 'My Name (Unit 4: Life Around Us)'
concepts:
- code: cbse2e.u4.name
  title: 'My Name (Unit 4: Life Around Us)'
  notes: |
    A lesson about names: every person has a name, names have meanings, and our name is special. Exact details could
    not be confirmed and are kept general; questions focus on names, capital letters and introducing oneself.
  explanations:
    text: Everyone has a name, and every name is special. Many names have a meaning. We write a name with a capital letter at the start.
    visual: Write your name in big letters, with the first letter in a different colour, and draw something it means.
    step_by_step: 1. Read the lesson. 2. Say your name and its meaning. 3. Write it with a capital letter. 4. Introduce yourself.
    real_world: On the first day of school, children say 'My name is ...' to make new friends.
  picture:
    kind: flow
    steps:
    - Hello!
    - My name is Asha.
    - I am seven.
    - Nice to meet you!
    alt: 'Introducing yourself: Hello! My name is Asha. I am seven. Nice to meet you!'
  activity:
    type: sort
    prompt: 'My Name: capital letter or small?'
    bins:
    - Starts with a capital
    - Starts small
    items:
    - label: Riya
      bin: Starts with a capital
      clue: A person's name.
      why: Names begin with a capital letter.
    - label: apple
      bin: Starts small
      clue: A fruit, in the middle of a sentence.
      why: Common words start small.
    - label: Delhi
      bin: Starts with a capital
      clue: A place's name.
      why: Place names take a capital.
    - label: dog
      bin: Starts small
      clue: Any dog.
      why: dog is a common word.
    - label: Arjun
      bin: Starts with a capital
      clue: A name.
      why: Names take capitals.
  items:
  - prompt: 'A name starts with a:'
    options:
    - capital letter
    - small letter
    - number
    - full stop
    answer: capital letter
    difficulty: 1
    hints:
    - Big letter.
    - Like A, not a.
    solution: A name starts with a capital letter.
  - prompt: Which name is written correctly?
    options:
    - Ravi
    - ravi
    - rAvi
    - RaVi
    answer: Ravi
    difficulty: 1
    hints:
    - Capital first, then small.
    - R then avi.
    solution: '''Ravi'' is correct.'
  - prompt: How do we say our name to a new friend?
    options:
    - My name is Asha.
    - Name Asha is my.
    - Is my name Asha.
    - Asha name my.
    answer: My name is Asha.
    difficulty: 2
    hints:
    - Start with 'My name'.
    - Read aloud.
    solution: '''My name is Asha.'' is correct.'
  - prompt: '''Surya'' means:'
    options:
    - the sun
    - the moon
    - a flower
    - a river
    answer: the sun
    difficulty: 2
    hints:
    - It shines in the day.
    - Bright.
    solution: Surya means the sun.
  - prompt: 'Every person''s name is:'
    options:
    - special
    - funny
    - wrong
    - the same
    answer: special
    difficulty: 1
    hints:
    - Our own.
    - Belongs to us.
    solution: Every name is special.
  - prompt: Which is a naming word for a person?
    options:
    - Meera
    - jump
    - tall
    - blue
    answer: Meera
    difficulty: 1
    hints:
    - A name.
    - A girl's name.
    solution: Meera names a person.
    mistakes:
      jump: eng2_word
