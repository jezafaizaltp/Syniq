# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 9. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 9
title: 'My Name (Unit 4: Life Around Us)'
tips:
  e2_capital: "Names are special, so they begin with a big letter."
  e2_name_correct: "Only the first letter of a name is a capital. The rest are small."
  e2_name_special: "Names are different for each person, and each one matters."
  e2_surya: "Surya Namaskar is done facing the morning sky."
  e2_word_order: "Say each one aloud. Which sounds right?"
  c2e9_mean: Many names come from nature. Think of songs about the night sky.
  c2e9_cap: Names of people and places always start with a big letter.
  c2e9_intro: Imagine meeting a new friend. Which words would you say first?
  c2e9_respect: How do you feel when someone gets your name right?

concepts:
- code: cbse2e.u4.name
  title: 'My Name (Unit 4: Life Around Us)'
  notes: |
    A lesson about names: every person has a name, names have meanings, and our name is special. Exact details could
    not be confirmed and are kept general; questions focus on names, capital letters and introducing oneself.
  explanations:
    text: Everyone has a name, and every name is special. Many names have a meaning. We write a name with a capital letter at the start.
    visual: Write your name in big letters, with the first letter in a different colour, and draw something it means.
    step_by_step: 1. Read the lesson. 2. Say your name and its meaning. 3. Write it with a capital letter. 4. Introduce yourself.
    real_world: On the first day of school, children say 'My name is ...' to make new friends.
  picture:
    kind: flow
    steps:
    - Hello!
    - My name is Asha.
    - I am seven.
    - Nice to meet you!
    alt: 'Introducing yourself: Hello! My name is Asha. I am seven. Nice to meet you!'
  activity:
    type: sort
    prompt: 'My Name: capital letter or small?'
    bins:
    - Starts with a capital
    - Starts small
    items:
    - label: Riya
      bin: Starts with a capital
      clue: A person's name.
      why: Names begin with a capital letter.
    - label: apple
      bin: Starts small
      clue: A fruit, in the middle of a sentence.
      why: Common words start small.
    - label: Delhi
      bin: Starts with a capital
      clue: A place's name.
      why: Place names take a capital.
    - label: dog
      bin: Starts small
      clue: Any dog.
      why: dog is a common word.
    - label: Arjun
      bin: Starts with a capital
      clue: A name.
      why: Names take capitals.
  lesson:
    - teach: 'Every person has a name. Our name is special. Names often have meanings: Surya means the sun, Kamal means lotus, Asha means hope. Ask at home what your name means!'
      check:
        prompt: '''Kamal'' means:'
        options:
        - lotus
        - river
        - moon
        answer: lotus
        why: Kamal is a name meaning the lotus flower.
    - teach: 'A name begins with a capital letter: Ravi, Asha, Delhi, India. Names of people, towns and countries all start with a capital.'
      picture:
        kind: compare
        columns:
        - title: Right
          points:
          - Ravi
          - Asha
          - Kerala
        - title: Not right
          points:
          - ravi
          - asha
          - kerala
        alt: 'Names start with a capital letter: Ravi, not ravi.'
      check:
        prompt: Which place name is written correctly?
        options:
        - Kerala
        - kerala
        - kERALA
        answer: Kerala
        why: Place names start with one capital letter.
    - teach: 'We tell our name to a new friend: ''Hello! My name is Asha. What is your name?'' We say other people''s names correctly and kindly. Making fun of a name hurts.'
      check:
        prompt: How do we ask a new friend's name?
        options:
        - What is your name?
        - Where is your name?
        - Who name you?
        answer: What is your name?
        why: '''What is your name?'' is the right question.'
  items:
  - prompt: 'A name starts with a:'
    options:
    - capital letter
    - small letter
    - number
    - full stop
    answer: capital letter
    difficulty: 1
    hints:
    - Big letter.
    - Like A, not a.
    solution: A name starts with a capital letter.
    mistakes: {"small letter": "e2_capital"}
  - prompt: Which name is written correctly?
    options:
    - Ravi
    - ravi
    - rAvi
    - RaVi
    answer: Ravi
    difficulty: 1
    hints:
    - Capital first, then small.
    - R then avi.
    solution: '''Ravi'' is correct.'
    mistakes: {"ravi": "e2_name_correct"}
  - prompt: How do we say our name to a new friend?
    options:
    - My name is Asha.
    - Name Asha is my.
    - Is my name Asha.
    - Asha name my.
    answer: My name is Asha.
    difficulty: 2
    hints:
    - Start with 'My name'.
    - Read aloud.
    solution: '''My name is Asha.'' is correct.'
    mistakes: {"Name Asha is my.": "e2_word_order"}
  - prompt: '''Surya'' means:'
    options:
    - the sun
    - the moon
    - a flower
    - a river
    answer: the sun
    difficulty: 2
    hints:
    - It shines in the day.
    - Bright.
    solution: Surya means the sun.
    mistakes: {"the moon": "e2_surya"}
  - prompt: 'Every person''s name is:'
    options:
    - special
    - funny
    - wrong
    - the same
    answer: special
    difficulty: 1
    hints:
    - Our own.
    - Belongs to us.
    solution: Every name is special.
    mistakes: {"the same": "e2_name_special"}
  - prompt: Which is a naming word for a person?
    options:
    - Meera
    - jump
    - tall
    - blue
    answer: Meera
    difficulty: 1
    hints:
    - A name.
    - A girl's name.
    solution: Meera names a person.
    mistakes:
      jump: eng2_word
  - prompt: Which name starts with a capital letter?
    options:
    - Meena
    - meena
    - mEENA
    answer: Meena
    difficulty: 1
    hints:
    - Look at the very first letter.
    - It should be big; the rest small.
    solution: 'Step 1: Names begin with a capital. Step 2: Meena is correct.'
    mistakes:
      meena: c2e9_cap
      mEENA: c2e9_cap
  - prompt: 'Fill in: ''My ___ is Ravi.'''
    options:
    - name
    - names
    - named
    answer: name
    difficulty: 1
    hints:
    - You have one of these.
    - It is what people call you.
    solution: 'Step 1: We are telling who we are. Step 2: ''My name is Ravi.'''
    mistakes:
      names: c2e9_intro
      named: c2e9_intro
  - prompt: A new child joins class. What is kind?
    options:
    - learn the child's name and say it correctly
    - give the child a funny nickname
    - laugh at the name
    answer: learn the child's name and say it correctly
    difficulty: 1
    hints:
    - Names are special to each of us.
    - How would you want to be welcomed?
    solution: 'Step 1: Our name matters to us. Step 2: Learn it and say it right.'
    mistakes:
      give the child a funny nickname: c2e9_respect
      laugh at the name: c2e9_respect
  - prompt: '''Chandra'' means:'
    options:
    - the moon
    - the sun
    - a tree
    answer: the moon
    difficulty: 2
    hints:
    - Chanda Mama is a name for it in songs.
    - It shines at night.
    solution: 'Step 1: Chandra is a name used in stories about the night sky. Step 2: It means the moon.'
    mistakes:
      the sun: c2e9_mean
      a tree: c2e9_mean
  - prompt: Which sentence is written correctly?
    options:
    - My friend is Arjun.
    - my friend is arjun.
    - My friend is arjun
    answer: My friend is Arjun.
    difficulty: 2
    hints:
    - Check the first letter and the name.
    - Also check the end.
    solution: 'Step 1: Capital ''M'' and capital ''A'' for the name. Step 2: Full stop at the end.'
    mistakes:
      my friend is arjun.: c2e9_cap
      My friend is arjun: c2e9_cap
  - prompt: How many capital letters are in 'Asha lives in Delhi.'?
    options:
    - two
    - one
    - three
    answer: two
    difficulty: 2
    hints:
    - Find the big letters.
    - One person's name, one place name.
    solution: 'Step 1: ''A'' in Asha. Step 2: ''D'' in Delhi: 2 capitals.'
    mistakes:
      one: c2e9_cap
      three: c2e9_cap
  - prompt: 'Put the words in order: name / My / Tara / is'
    options:
    - My name is Tara.
    - Tara name My is.
    - Is my Tara name.
    answer: My name is Tara.
    difficulty: 2
    hints:
    - Start with the word that has a capital and is not a name.
    - Read it aloud. Does it make sense?
    solution: 'Step 1: Begin with ''My''. Step 2: My name is Tara.'
    mistakes:
      Tara name My is.: e2_word_order
      Is my Tara name.: e2_word_order
  - prompt: Which is a naming word for a place?
    options:
    - Mumbai
    - Rohan
    - run
    answer: Mumbai
    difficulty: 2
    hints:
    - One is a person, one is a doing word.
    - Which one is a city?
    solution: 'Step 1: Rohan is a person, run is a doing word. Step 2: Mumbai is a place.'
    mistakes:
      Rohan: c2e9_cap
      run: c2e9_cap
  - prompt: Pick the best way to say hello to a new friend.
    options:
    - Hello! My name is Sam. What is your name?
    - Go away.
    - Name?
    answer: Hello! My name is Sam. What is your name?
    difficulty: 3
    hints:
    - A good hello is polite and friendly.
    - Tell your name and ask theirs.
    solution: 'Step 1: Say hello and your name. Step 2: Then ask their name kindly.'
    mistakes:
      Go away.: c2e9_intro
      Name?: c2e9_intro
