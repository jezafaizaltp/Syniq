# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 5. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 5
title: 'Come Back Soon (Unit 3: Going Places)'
tips:
  c2e5_opp: "Arrive is what a guest does at the start of a visit. Think of the end."
  e2_miss: "When someone we love goes away, how does our heart feel?"
  e2_opposite_come: "Opposite means the other way. Come here, or ___ away."
  e2_please_verb: "After 'Please', use the plain word: please sit, please eat, please ..."
  e2_trip: "Which one moves on tracks and carries people far?"
  c2e5_feel: Think how you felt the last time someone you love went away or came home.
  c2e5_polite: Polite words make people feel respected. Which would a kind guest say?
  c2e5_travel: 'Ask: does it go on roads, rails, water or in the sky?'

concepts:
- code: cbse2e.u3.comeback
  title: 'Come Back Soon (Unit 3: Going Places)'
  notes: |
    A story about going to visit someone and saying goodbye with "come back soon": visits, travel and missing people
    we love. Exact story details could not be confirmed and are kept general; questions focus on reading, travel words,
    polite words and feelings.
  explanations:
    text: This lesson is about a visit and saying goodbye. When someone we love leaves, we say 'Come back soon!' because we will miss them.
    visual: Draw a family waving goodbye at a door, with a speech bubble 'Come back soon!'
    step_by_step: 1. Read the lesson. 2. Who goes where? 3. How do people feel? 4. What polite words do they use?
    real_world: When grandparents visit for the holidays, we are sad when they leave.
  picture:
    kind: flow
    steps:
    - Someone visits
    - Fun together
    - Time to go
    - Come back soon!
    alt: Someone visits, we have fun together, it is time to go, and we say come back soon.
  activity:
    type: sort
    prompt: 'Come Back Soon: hello words or goodbye words?'
    bins:
    - Hello
    - Goodbye
    items:
    - label: Welcome!
      bin: Hello
      clue: When someone arrives.
      why: We say welcome when people come.
    - label: Come back soon!
      bin: Goodbye
      clue: When someone leaves.
      why: We say this as they go.
    - label: Good to see you!
      bin: Hello
      clue: Meeting.
      why: Said when you meet.
    - label: Have a safe journey!
      bin: Goodbye
      clue: Before travelling.
      why: Said when someone leaves.
    - label: See you later!
      bin: Goodbye
      clue: Not now, but later.
      why: A way to say goodbye.
  lesson:
    - teach: When someone we love visits, we are happy. When they leave, we may feel sad and say 'Come back soon!' We miss people when they are far away.
      picture:
        kind: flow
        steps:
        - 'a visitor comes: happy'
        - we play and talk
        - 'the visitor leaves: sad'
        - '''Come back soon!'''
        alt: 'A visit: happy arrival, time together, sad goodbye, come back soon.'
      check:
        prompt: 'Grandma arrives at our home. We feel:'
        options:
        - happy
        - angry
        - sleepy
        answer: happy
        why: Seeing someone we love makes us happy.
      ways:
      - style: step_by_step
        teach: 'Saying goodbye to a visitor. Step 1: Walk with them to the door. Step 2: Thank them for coming. Step 3: Wave as they go. Step 4: Ask them to visit again.'
      - style: real_world
        teach: Many families make video calls to grandparents who live far away. Seeing their faces and hearing their voices makes them feel close again.
    - teach: 'We travel in many ways: by bus, car, train and auto-rickshaw on land, by boat and ship on water, and by aeroplane in the sky. A train is good for a long trip.'
      picture:
        kind: compare
        columns:
        - title: Land
          points:
          - bus
          - train
          - car
        - title: Water
          points:
          - boat
          - ship
        - title: Sky
          points:
          - aeroplane
        alt: Ways to travel on land, on water and in the sky.
      check:
        prompt: Which one travels on water?
        options:
        - a boat
        - a bus
        - a car
        answer: a boat
        why: Boats float and move on water.
      ways:
      - style: step_by_step
        teach: 'Choose how to travel. Step 1: Is the place just down the road? Walk or cycle. Step 2: Is it in another part of the town? Take a bus or an auto. Step 3: Is it in another country, very far away? An aeroplane is the quickest.'
      - style: real_world
        teach: Hill roads are steep and full of bends, so people there often travel in jeeps that can climb well. In a big city, many people ride the metro.
    - teach: 'Polite words: please, thank you, sorry, welcome, goodbye. A good host says ''Welcome!'' A good guest says ''Thank you for having me.'' At the end we say ''Goodbye, see you soon!'''
      check:
        prompt: What do we say when someone gives us a gift?
        options:
        - Thank you
        - Go away
        - Hurry up
        answer: Thank you
        why: Thank you shows we are grateful.
      ways:
      - style: visual
        teach: Times when we use polite words, with an example for each.
        picture:
          kind: compare
          columns:
          - title: You want something
            points:
            - Please may I have a pencil?
          - title: Someone helps you
            points:
            - Thank you for the gift.
          - title: You make a mistake
            points:
            - Sorry, I stepped on your foot.
          alt: 'When you want something, say please: Please may I have a pencil? When someone helps you, say thank you: Thank you for the gift. When you make a mistake, say sorry: Sorry, I stepped on your foot.'
      - style: real_world
        teach: When a shopkeeper hands you your change, saying 'thank you' makes them smile. Small polite words make ordinary moments kind.
  items:
  - prompt: '''Come back soon'' is said when someone is:'
    options:
    - leaving
    - arriving
    - sleeping
    - eating
    answer: leaving
    difficulty: 1
    hints:
    - Goodbye time.
    - Going away.
    solution: We say it when someone is leaving.
    mistakes:
      arriving: eng2_read_again
  - prompt: 'When someone leaves, we may feel:'
    options:
    - sad
    - angry
    - hungry
    - sleepy
    answer: sad
    difficulty: 1
    hints:
    - We will miss them.
    - A feeling.
    solution: We may feel sad.
    mistakes: {"hungry": "e2_miss"}
  - prompt: Which is a polite word?
    options:
    - please
    - go
    - 'no'
    - give
    answer: please
    difficulty: 1
    hints:
    - A kind word when asking.
    - Magic word.
    solution: Please is a polite word.
    mistakes: {"give": "e1_please"}
  - prompt: Which is the opposite of 'come'?
    options:
    - go
    - run
    - sit
    - eat
    answer: go
    difficulty: 2
    hints:
    - Leave.
    - Away.
    solution: Go is the opposite of come.
    mistakes: {"run": "e2_opposite_come"}
  - prompt: Which one can take us on a long trip?
    options:
    - train
    - chair
    - bed
    - table
    answer: train
    difficulty: 1
    hints:
    - It moves on tracks.
    - Travel.
    solution: A train takes us on long trips.
    mistakes: {"chair": "e2_trip"}
  - prompt: 'Choose the right word: Please ___ back soon.'
    options:
    - come
    - comes
    - coming
    - came is
    answer: come
    difficulty: 2
    hints:
    - Say it to a person.
    - Please come.
    solution: Please come back soon.
    mistakes: {"comes": "e2_please_verb"}
  - prompt: Which one flies in the sky?
    options:
    - an aeroplane
    - a train
    - a boat
    answer: an aeroplane
    difficulty: 1
    hints:
    - It has wings.
    - It lands at an airport.
    solution: 'Step 1: Trains run on rails, boats go on water. Step 2: An aeroplane flies in the sky.'
    mistakes:
      a train: c2e5_travel
      a boat: c2e5_travel
  - prompt: 'A guest comes to our home. We say:'
    options:
    - Welcome!
    - Goodbye!
    - Sorry!
    answer: Welcome!
    difficulty: 1
    hints:
    - The guest is just arriving.
    - We want them to feel at home.
    solution: 'Step 1: The guest is coming in. Step 2: We say ''Welcome!'''
    mistakes:
      Goodbye!: c2e5_polite
      Sorry!: c2e5_polite
  - prompt: 'When we leave a friend''s house, we say:'
    options:
    - Goodbye, see you soon!
    - Welcome!
    - Please!
    answer: Goodbye, see you soon!
    difficulty: 1
    hints:
    - We are going away.
    - What do we say at the end of a visit?
    solution: 'Step 1: We are leaving. Step 2: We say ''Goodbye, see you soon!'''
    mistakes:
      Welcome!: c2e5_polite
      Please!: c2e5_polite
  - prompt: Which one runs on rails?
    options:
    - a train
    - a bus
    - a ship
    answer: a train
    difficulty: 1
    hints:
    - Rails are long iron tracks.
    - It stops at a station.
    solution: 'Step 1: Buses use roads, ships use water. Step 2: A train runs on rails.'
    mistakes:
      a bus: c2e5_travel
      a ship: c2e5_travel
  - prompt: 'Your cousin lives far away. You have not met for a long time. You:'
    options:
    - "miss your cousin"
    - "forget your cousin"
    - "feel nothing"
    answer: miss your cousin
    difficulty: 1
    hints:
    - Think of someone you love who is far away.
    - You wish they were here.
    solution: 'Step 1: We love people even when they are far. Step 2: We miss them.'
    mistakes:
      "forget your cousin": e2_miss
      "feel nothing": e2_miss
  - prompt: Which is the opposite of 'arrive'?
    options:
    - leave
    - come
    - reach
    answer: leave
    difficulty: 2
    hints:
    - Arrive means come to a place.
    - What do we do at the end of a visit?
    solution: 'Step 1: Arrive means come. Step 2: The opposite is leave.'
    mistakes:
      come: c2e5_opp
      reach: c2e5_opp
  - prompt: 'Choose the polite way to ask: ___ pass the water.'
    options:
    - Please
    - Now
    - Give me
    answer: Please
    difficulty: 2
    hints:
    - It is a magic word.
    - Kind people use it when they ask.
    solution: 'Step 1: Asking needs a polite word. Step 2: ''Please pass the water.'''
    mistakes:
      Now: c2e5_polite
      Give me: c2e5_polite
  - prompt: Which pair travels on land?
    options:
    - bus and auto-rickshaw
    - boat and ship
    - aeroplane and helicopter
    answer: bus and auto-rickshaw
    difficulty: 2
    hints:
    - Land means roads.
    - Which two have wheels on the road?
    solution: 'Step 1: Boats and ships use water; aeroplanes fly. Step 2: Bus and auto-rickshaw go on roads.'
    mistakes:
      boat and ship: c2e5_travel
      aeroplane and helicopter: c2e5_travel
  - prompt: 'Put in order: (1) say goodbye (2) the guest arrives (3) play together. What comes last?'
    options:
    - say goodbye
    - the guest arrives
    - play together
    answer: say goodbye
    difficulty: 3
    hints:
    - What happens at the very end of a visit?
    - First arrive, then play, then ...
    solution: 'Step 1: The guest arrives, then we play. Step 2: Last, we say goodbye.'
    mistakes:
      the guest arrives: c2e5_feel
      play together: c2e5_feel
  - prompt: 'Case: Grandpa has come to stay for a week. On the last day, Grandpa packs a bag and walks to the door to leave. What could you say?'
    options:
    - "Thank you for coming. Please come back soon!"
    - "Welcome to our home! Please come inside!"
    - "Sorry! I did not mean to do that, sorry!"
    answer: Thank you for coming. Please come back soon!
    hints:
    - Is Grandpa arriving or going away?
    - What do we say to someone who is leaving and whom we want to see again?
    solution: Grandpa is leaving, so we thank Grandpa for coming and ask Grandpa to come back soon. 'Welcome' is said when a guest arrives.
    mistakes:
      "Welcome to our home! Please come inside!": c2e5_polite
      "Sorry! I did not mean to do that, sorry!": c2e5_polite
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your family is visiting a small island. There is no bridge to it and no airport on it. How will you get there?'
    options:
    - by boat
    - by bus
    - by auto-rickshaw
    answer: by boat
    hints:
    - What is all around an island?
    - Which of these can travel on water?
    solution: An island has water all around it. With no bridge and no airport, a boat is the way to get there.
    mistakes:
      by bus: c2e5_travel
      by auto-rickshaw: c2e5_travel
    exam: competency
    difficulty: 2
