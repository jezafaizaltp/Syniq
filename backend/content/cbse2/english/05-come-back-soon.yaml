# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 5. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 5
title: 'Come Back Soon (Unit 3: Going Places)'
concepts:
- code: cbse2e.u3.comeback
  title: 'Come Back Soon (Unit 3: Going Places)'
  notes: |
    A story about going to visit someone and saying goodbye with "come back soon": visits, travel and missing people
    we love. Exact story details could not be confirmed and are kept general; questions focus on reading, travel words,
    polite words and feelings.
  explanations:
    text: This lesson is about a visit and saying goodbye. When someone we love leaves, we say 'Come back soon!' because we will miss them.
    visual: Draw a family waving goodbye at a door, with a speech bubble 'Come back soon!'
    step_by_step: 1. Read the lesson. 2. Who goes where? 3. How do people feel? 4. What polite words do they use?
    real_world: When grandparents visit for the holidays, we are sad when they leave.
  picture:
    kind: flow
    steps:
    - Someone visits
    - Fun together
    - Time to go
    - Come back soon!
    alt: Someone visits, we have fun together, it is time to go, and we say come back soon.
  items:
  - prompt: '''Come back soon'' is said when someone is:'
    options:
    - leaving
    - arriving
    - sleeping
    - eating
    answer: leaving
    difficulty: 1
    hints:
    - Goodbye time.
    - Going away.
    solution: We say it when someone is leaving.
    mistakes:
      arriving: eng2_read_again
  - prompt: 'When someone leaves, we may feel:'
    options:
    - sad
    - angry
    - hungry
    - sleepy
    answer: sad
    difficulty: 1
    hints:
    - We will miss them.
    - A feeling.
    solution: We may feel sad.
  - prompt: Which is a polite word?
    options:
    - please
    - go
    - 'no'
    - give
    answer: please
    difficulty: 1
    hints:
    - A kind word when asking.
    - Magic word.
    solution: Please is a polite word.
  - prompt: Which is the opposite of 'come'?
    options:
    - go
    - run
    - sit
    - eat
    answer: go
    difficulty: 2
    hints:
    - Leave.
    - Away.
    solution: Go is the opposite of come.
  - prompt: Which one can take us on a long trip?
    options:
    - train
    - chair
    - bed
    - table
    answer: train
    difficulty: 1
    hints:
    - It moves on tracks.
    - Travel.
    solution: A train takes us on long trips.
  - prompt: 'Choose the right word: Please ___ back soon.'
    options:
    - come
    - comes
    - coming
    - came is
    answer: come
    difficulty: 2
    hints:
    - Say it to a person.
    - Please come.
    solution: Please come back soon.
