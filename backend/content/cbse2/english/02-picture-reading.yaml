# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 2. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 2
title: 'Picture Reading (Unit 1: Fun with Friends)'
concepts:
- code: cbse2e.u1.picture
  title: 'Picture Reading (Unit 1: Fun with Friends)'
  notes: |
    A picture page where children look carefully and talk about what they see: people, animals, things and what is
    happening. Questions practise looking, naming, counting and describing.
  explanations:
    text: Picture reading means looking carefully at a picture and telling what you see. Who is there? What are they doing? Where are they?
    visual: 'Draw a park with two children on a swing, a dog and a tree. Ask: who, what, where?'
    step_by_step: 1. Look at the whole picture. 2. Name the people and things. 3. Say what they are doing. 4. Say where it is.
    real_world: When you see a picture in a story book, you can guess the story before reading.
  picture:
    kind: flow
    steps:
    - Look
    - Name things
    - Say what is happening
    - Tell the story
    alt: Look at the picture, name the things, say what is happening, then tell the story.
  items:
  - prompt: 'In picture reading we first:'
    options:
    - look carefully
    - close the book
    - read fast
    - colour the picture
    answer: look carefully
    difficulty: 1
    hints:
    - Use your eyes.
    - See everything.
    solution: We first look carefully.
  - prompt: 'Children play on a swing in a:'
    options:
    - park
    - kitchen
    - bathroom
    - bus
    answer: park
    difficulty: 1
    hints:
    - Outside, with trees.
    - A play place.
    solution: Swings are in a park.
  - prompt: Which is an action word?
    options:
    - jump
    - tree
    - dog
    - red
    answer: jump
    difficulty: 1
    hints:
    - Something you do.
    - Can you do it?
    solution: Jump is an action word.
    mistakes:
      tree: eng2_word
  - prompt: '''The dog is ___ the tree.'' (the dog sits below it)'
    options:
    - under
    - 'on'
    - in
    - over
    answer: under
    difficulty: 2
    hints:
    - Below means ...
    - Shade of the tree.
    solution: The dog is under the tree.
  - prompt: Which question asks about a place?
    options:
    - Where is the cat?
    - Who is the girl?
    - What is it?
    - How many birds?
    answer: Where is the cat?
    difficulty: 2
    hints:
    - Place words.
    - Where.
    solution: '''Where'' asks about a place.'
  - prompt: Two children and one dog. How many in all?
    options:
    - three
    - two
    - one
    - four
    answer: three
    difficulty: 1
    hints:
    - Count them.
    - 2 and 1.
    solution: 2 + 1 = three.
