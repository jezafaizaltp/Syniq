# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 2. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 2
title: 'Picture Reading (Unit 1: Fun with Friends)'
tips:
  e2_count_all: "Count the children and the dog together."
  e2_park: "Swings are outdoors, where children play."
  e2_where: "'Who' asks about a person. Which question word asks about a place?"
  c2e2_look: Look at the whole picture first, then at each small part.
  c2e2_place: "Place words tell where something is. Picture the two things and how they sit."
  c2e2_q: 'Question words: who asks about a person, where about a place, what about a thing.'

concepts:
- code: cbse2e.u1.picture
  title: 'Picture Reading (Unit 1: Fun with Friends)'
  notes: |
    A picture page where children look carefully and talk about what they see: people, animals, things and what is
    happening. Questions practise looking, naming, counting and describing.
  explanations:
    text: Picture reading means looking carefully at a picture and telling what you see. Who is there? What are they doing? Where are they?
    visual: 'Draw a park with two children on a swing, a dog and a tree. Ask: who, what, where?'
    step_by_step: 1. Look at the whole picture. 2. Name the people and things. 3. Say what they are doing. 4. Say where it is.
    real_world: When you see a picture in a story book, you can guess the story before reading.
  picture:
    kind: flow
    steps:
    - Look
    - Name things
    - Say what is happening
    - Tell the story
    alt: Look at the picture, name the things, say what is happening, then tell the story.
  activity:
    type: sort
    prompt: 'Picture Reading: person, animal or thing?'
    bins:
    - Person
    - Animal
    - Thing
    items:
    - label: 👩‍🏫 Teacher
      bin: Person
      clue: A human.
      why: A teacher is a person.
    - label: 🐶 Dog
      bin: Animal
      clue: Barks.
      why: A dog is an animal.
    - label: ⚽ Ball
      bin: Thing
      clue: Not alive.
      why: A ball is a thing.
    - label: 👦 Boy
      bin: Person
      clue: A child.
      why: A boy is a person.
    - label: 🐄 Cow
      bin: Animal
      clue: Gives milk.
      why: A cow is an animal.
    - label: 🪁 Kite
      bin: Thing
      clue: Flies on a string.
      why: A kite is a thing.
  lesson:
    - teach: 'In picture reading we look carefully. First we look at the whole picture. Then we look at each part: Who is there? What are they doing? Where are they?'
      picture:
        kind: flow
        steps:
        - look at the whole picture
        - find the people and animals
        - what are they doing?
        - where are they?
        alt: 'Steps of picture reading: whole picture, who, doing what, where.'
      check:
        prompt: What do we do first when we read a picture?
        options:
        - look at the whole picture
        - close the book
        - count only the trees
        answer: look at the whole picture
        why: We see the whole picture first, then the small parts.
    - teach: 'Place words tell where things are: on, under, in, near, behind. The cat is on the wall. The ball is under the chair. The fish is in the pond.'
      picture:
        kind: compare
        columns:
        - title: 'on'
          points:
          - cat on the wall
        - title: under
          points:
          - ball under the chair
        - title: in
          points:
          - fish in the pond
        alt: Place words on, under and in with examples.
      check:
        prompt: The fish swims ___ the pond.
        options:
        - in
        - 'on'
        - under
        answer: in
        why: The fish is inside the water of the pond.
    - teach: 'We can ask questions about a picture. Who asks about a person: Who is on the swing? What asks about a thing: What is in the basket? Where asks about a place: Where is the dog?'
      check:
        prompt: Which question word asks about a person?
        options:
        - Who
        - Where
        - What
        answer: Who
        why: '''Who'' asks which person.'
  items:
  - prompt: 'In picture reading we first:'
    options:
    - look carefully
    - close the book
    - read fast
    - colour the picture
    answer: look carefully
    difficulty: 1
    hints:
    - Use your eyes.
    - See everything.
    solution: We first look carefully.
    mistakes: {"read fast": "e1_look"}
  - prompt: 'Children play on a swing in a:'
    options:
    - park
    - kitchen
    - bathroom
    - bus
    answer: park
    difficulty: 1
    hints:
    - Outside, with trees.
    - A play place.
    solution: Swings are in a park.
    mistakes: {"kitchen": "e2_park"}
  - prompt: Which is an action word?
    options:
    - jump
    - tree
    - dog
    - red
    answer: jump
    difficulty: 1
    hints:
    - Something you do.
    - Can you do it?
    solution: Jump is an action word.
    mistakes:
      tree: eng2_word
  - prompt: '''The dog is ___ the tree.'' (the dog sits below it)'
    options:
    - under
    - 'on'
    - in
    - over
    answer: under
    difficulty: 2
    hints:
    - Below means ...
    - Shade of the tree.
    solution: The dog is under the tree.
    mistakes: {"on": "e1_under"}
  - prompt: Which question asks about a place?
    options:
    - Where is the cat?
    - Who is the girl?
    - What is it?
    - How many birds?
    answer: Where is the cat?
    difficulty: 2
    hints:
    - Place words.
    - Where.
    solution: '''Where'' asks about a place.'
    mistakes: {"Who is the girl?": "e2_where"}
  - prompt: Two children and one dog. How many in all?
    options:
    - three
    - two
    - one
    - four
    answer: three
    difficulty: 1
    hints:
    - Count them.
    - 2 and 1.
    solution: 2 + 1 = three.
    mistakes: {"two": "e2_count_all"}
  - prompt: A picture shows a boy on a slide and a girl on a swing. How many children?
    options:
    - two
    - one
    - four
    answer: two
    difficulty: 1
    hints:
    - Point to each child.
    - One on the slide, one on the swing.
    solution: 'Step 1: One child on the slide. Step 2: One on the swing: 2 children.'
    mistakes:
      one: e2_count_all
      four: e2_count_all
  - prompt: The ball is below the chair. The ball is ___ the chair.
    options:
    - under
    - 'on'
    - in
    answer: under
    difficulty: 1
    hints:
    - Below means lower down.
    - Not on top.
    solution: 'Step 1: Below means lower. Step 2: The ball is under the chair.'
    mistakes:
      'on': c2e2_place
      in: c2e2_place
  - prompt: Which question asks about a thing?
    options:
    - What is in the basket?
    - Who is singing?
    - Where is the park?
    answer: What is in the basket?
    difficulty: 1
    hints:
    - A thing is not a person or a place.
    - Look at the first word of each question.
    solution: 'Step 1: Who is for a person, where is for a place. Step 2: What asks about a thing.'
    mistakes:
      Who is singing?: c2e2_q
      Where is the park?: c2e2_q
  - prompt: In a picture of a park, which would you NOT expect to see?
    options:
    - a ship
    - a swing
    - a tree
    answer: a ship
    difficulty: 1
    hints:
    - Think of what is in a park near your home.
    - Which one needs the sea?
    solution: 'Step 1: Parks have swings and trees. Step 2: A ship sails on the sea, not in a park.'
    mistakes:
      a swing: e2_park
      a tree: e2_park
  - prompt: A cat sits on top of the wall. The cat is ___ the wall.
    options:
    - 'on'
    - under
    - in
    answer: 'on'
    difficulty: 1
    hints:
    - On top means above it, touching it.
    - Not below.
    solution: 'Step 1: The cat is on top. Step 2: The cat is on the wall.'
    mistakes:
      under: c2e2_place
      in: c2e2_place
  - prompt: Which is a doing word for a child on a swing?
    options:
    - swinging
    - swing seat
    - green
    answer: swinging
    difficulty: 2
    hints:
    - A doing word tells what someone does.
    - What is the child doing?
    solution: 'Step 1: ''Green'' is a colour and ''swing seat'' is a thing. Step 2: ''Swinging'' is what the child does.'
    mistakes:
      swing seat: c2e2_look
      green: c2e2_look
  - prompt: A picture has 3 birds on a tree and 2 birds on the ground. How many birds?
    options:
    - five
    - three
    - two
    answer: five
    difficulty: 2
    hints:
    - Count the tree birds, then the ground birds.
    - 3 and 2 more.
    solution: 'Step 1: 3 on the tree. Step 2: 3 + 2 = 5 birds.'
    mistakes:
      three: e2_count_all
      two: e2_count_all
  - prompt: Which sentence tells about a picture of children flying kites?
    options:
    - The children are flying kites.
    - The children are sleeping.
    - The kites are eating.
    answer: The children are flying kites.
    difficulty: 2
    hints:
    - Say what you see in the picture.
    - What are the children doing?
    solution: 'Step 1: The picture shows kites in the sky. Step 2: The children are flying kites.'
    mistakes:
      The children are sleeping.: c2e2_look
      The kites are eating.: c2e2_look
  - prompt: A dog hides behind a tree. Which question has the answer 'behind the tree'?
    options:
    - Where is the dog?
    - Who is the dog?
    - What colour is the dog?
    answer: Where is the dog?
    difficulty: 3
    hints:
    - '''Behind the tree'' tells a place.'
    - Which question word asks about a place?
    solution: 'Step 1: ''Behind the tree'' is a place. Step 2: ''Where'' asks about a place.'
    mistakes:
      Who is the dog?: c2e2_q
      What colour is the dog?: c2e2_q
