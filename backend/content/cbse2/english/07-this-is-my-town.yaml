# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 7. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 7
title: 'This is My Town (Unit 3: Going Places)'
tips:
  e2_doctor: "Who checks us with a stethoscope?"
  e2_hospital: "A hospital has doctors and medicine. When do we need them?"
  e2_market: "Shops with fresh fruit and vegetables are in a ..."
  e2_police: "Who wears a uniform and stops thieves?"
  c2e7_place: Think what people go to this place to do.
  c2e7_job: Think where this person works and how they help.
  c2e7_sent: "Check three things: a capital letter at the start, a full stop at the end, words in an order that sounds right."

concepts:
- code: cbse2e.u3.town
  title: 'This is My Town (Unit 3: Going Places)'
  notes: |
    A lesson about a child's town and its places: market, hospital, post office, park, police station, bus stand.
    Questions focus on places and the people who work there.
  explanations:
    text: 'A town has many places: a market to buy things, a hospital for the sick, a post office for letters, a park to play and a police station to keep us safe.'
    visual: Draw a town map with a market, a hospital, a park and a post office.
    step_by_step: 1. Read the lesson. 2. Name the places. 3. Say what we do there. 4. Who works there?
    real_world: 'Every town has places that help people: a hospital, a school, a market.'
  picture:
    kind: compare
    columns:
    - title: Place
      points:
      - hospital
      - post office
      - park
    - title: We go there to
      points:
      - get well
      - send letters
      - play
    alt: We go to a hospital to get well, a post office to send letters, and a park to play.
  activity:
    type: sort
    prompt: 'This is My Town: where do you go?'
    bins:
    - Post office
    - Park
    - Police station
    - Bus stand
    items:
    - label: To send a letter
      bin: Post office
      clue: Stamps.
      why: Letters are posted at the post office.
    - label: To play on swings
      bin: Park
      clue: Green and open.
      why: Swings are in the park.
    - label: To report a lost bag
      bin: Police station
      clue: Ask for help.
      why: The police help find lost things.
    - label: To catch a bus
      bin: Bus stand
      clue: Wait for it.
      why: Buses stop at the bus stand.
  lesson:
    - teach: A town has many places. We buy things at the market, get well at the hospital, post letters at the post office, play in the park, catch a bus at the bus stand and learn at school.
      picture:
        kind: compare
        columns:
        - title: Place
          points:
          - market
          - hospital
          - post office
          - park
        - title: We go there to
          points:
          - buy things
          - get well
          - post letters
          - play
        alt: Town places and what we do there.
      check:
        prompt: Where do we go to play on swings?
        options:
        - the park
        - the post office
        - the hospital
        answer: the park
        why: Parks have swings, slides and open space.
    - teach: People in a town help us. Doctors and nurses look after the sick. The police keep us safe. Firefighters put out fires. Shopkeepers sell things. Teachers teach.
      check:
        prompt: Who puts out fires?
        options:
        - firefighters
        - tailors
        - farmers
        answer: firefighters
        why: Firefighters come with water to stop fires.
    - teach: 'Names of places are naming words: town, market, hospital, park. A sentence about a town: ''This is my town. It has a big market.'' We keep our town clean.'
      check:
        prompt: "Which word names a place in a town?"
        options:
        - market
        - run
        - happy
        answer: market
        why: Market names a place; run is a doing word, happy is a feeling.
  items:
  - prompt: 'We go to a hospital when we are:'
    options:
    - sick
    - hungry
    - sleepy
    - happy
    answer: sick
    difficulty: 1
    hints:
    - Doctors work there.
    - To get well.
    solution: We go to a hospital when we are sick.
    mistakes: {"hungry": "e2_hospital"}
  - prompt: Who works in a hospital?
    options:
    - a doctor
    - a farmer
    - a pilot
    - a tailor
    answer: a doctor
    difficulty: 1
    hints:
    - Helps sick people.
    - Stethoscope.
    solution: A doctor works in a hospital.
    mistakes: {"a farmer": "e2_doctor"}
  - prompt: 'We post letters at the:'
    options:
    - post office
    - park
    - bakery
    - temple
    answer: post office
    difficulty: 1
    hints:
    - Postman.
    - Letters and stamps.
    solution: We post letters at the post office.
    mistakes: {"bakery": "v4_post"}
  - prompt: Where do we buy fruits and vegetables?
    options:
    - market
    - police station
    - school
    - hospital
    answer: market
    difficulty: 1
    hints:
    - Shops and sellers.
    - Buying.
    solution: We buy them at the market.
    mistakes: {"police station": "e2_market"}
  - prompt: Which is a naming word for a place?
    options:
    - town
    - walk
    - pretty
    - slowly
    answer: town
    difficulty: 2
    hints:
    - You can live there.
    - A place name.
    solution: Town is a naming word for a place.
    mistakes:
      walk: eng2_word
  - prompt: Who keeps our town safe?
    options:
    - the police
    - the baker
    - the painter
    - the singer
    answer: the police
    difficulty: 2
    hints:
    - Police station.
    - They help when there is trouble.
    solution: The police keep the town safe.
    mistakes: {"the baker": "e2_police"}
  - prompt: Where do we catch a bus to another town?
    options:
    - the bus stand
    - the hospital
    - the library
    answer: the bus stand
    difficulty: 1
    hints:
    - Many buses wait in one place.
    - Its name has 'bus' in it.
    solution: 'Step 1: Buses start from one place. Step 2: That is the bus stand.'
    mistakes:
      the hospital: c2e7_place
      the library: c2e7_place
  - prompt: Who helps a doctor look after sick people?
    options:
    - a nurse
    - a driver
    - a painter
    answer: a nurse
    difficulty: 1
    hints:
    - This person works in a hospital.
    - Gives medicine and care.
    solution: 'Step 1: Hospitals need helpers. Step 2: A nurse cares for the sick.'
    mistakes:
      a driver: c2e7_job
      a painter: c2e7_job
  - prompt: Where can we read and borrow books?
    options:
    - the library
    - the market
    - the bus stand
    answer: the library
    difficulty: 1
    hints:
    - It is full of books.
    - We must be quiet there.
    solution: 'Step 1: Books are kept in one place. Step 2: That is the library.'
    mistakes:
      the market: c2e7_place
      the bus stand: c2e7_place
  - prompt: A house is on fire. Who do we call?
    options:
    - the fire brigade
    - the postman
    - the vegetable seller
    answer: the fire brigade
    difficulty: 1
    hints:
    - They come in a red truck with water.
    - Fire is their job.
    solution: 'Step 1: Fire needs water to stop. Step 2: The fire brigade puts it out.'
    mistakes:
      the postman: c2e7_job
      the vegetable seller: c2e7_job
  - prompt: Where do we keep money safe?
    options:
    - in a bank
    - in a park
    - in a pond
    answer: in a bank
    difficulty: 2
    hints:
    - It is a building with counters.
    - Grown-ups go there to save money.
    solution: 'Step 1: Money must be kept safe. Step 2: A bank keeps it safe.'
    mistakes:
      in a park: c2e7_place
      in a pond: c2e7_place
  - prompt: 'Our tooth hurts. We visit:'
    options:
    - a dentist
    - a baker
    - a carpenter
    answer: a dentist
    difficulty: 2
    hints:
    - This doctor looks only at teeth.
    - Not a cook or a wood worker.
    solution: 'Step 1: Teeth need a special doctor. Step 2: That is a dentist.'
    mistakes:
      a baker: c2e7_job
      a carpenter: c2e7_job
  - prompt: Which is the best way to keep our town clean?
    options:
    - put waste in a dustbin
    - throw wrappers on the road
    - burn plastic
    answer: put waste in a dustbin
    difficulty: 2
    hints:
    - Where should waste go?
    - Not on the road, not into the air.
    solution: 'Step 1: Litter and smoke make a town dirty. Step 2: Waste goes in the dustbin.'
    mistakes:
      throw wrappers on the road: c2e7_place
      burn plastic: c2e7_place
  - prompt: Choose the right sentence about a town.
    options:
    - This is my town.
    - this is my town
    - This my town is.
    answer: This is my town.
    difficulty: 2
    hints:
    - A sentence begins with a capital letter.
    - It ends with a full stop and the words are in order.
    solution: 'Step 1: Capital ''T'', full stop at the end. Step 2: Words in order: This is my town.'
    mistakes:
      this is my town: c2e7_sent
      This my town is.: c2e7_sent
  - prompt: A letter goes from the post office to Grandma's town. Who carries it to Grandma's door?
    options:
    - the postman
    - the police
    - the nurse
    answer: the postman
    difficulty: 3
    hints:
    - Letters go from the post office to homes.
    - This person has a bag of letters.
    solution: 'Step 1: Post offices sort letters. Step 2: The postman carries them to each home.'
    mistakes:
      the police: c2e7_job
      the nurse: c2e7_job
