# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 7. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 7
title: 'This is My Town (Unit 3: Going Places)'
concepts:
- code: cbse2e.u3.town
  title: 'This is My Town (Unit 3: Going Places)'
  notes: |
    A lesson about a child's town and its places: market, hospital, post office, park, police station, bus stand.
    Questions focus on places and the people who work there.
  explanations:
    text: 'A town has many places: a market to buy things, a hospital for the sick, a post office for letters, a park to play and a police station to keep us safe.'
    visual: Draw a town map with a market, a hospital, a park and a post office.
    step_by_step: 1. Read the lesson. 2. Name the places. 3. Say what we do there. 4. Who works there?
    real_world: 'Every town has places that help people: a hospital, a school, a market.'
  picture:
    kind: compare
    columns:
    - title: Place
      points:
      - hospital
      - post office
      - park
    - title: We go there to
      points:
      - get well
      - send letters
      - play
    alt: We go to a hospital to get well, a post office to send letters, and a park to play.
  items:
  - prompt: 'We go to a hospital when we are:'
    options:
    - sick
    - hungry
    - sleepy
    - happy
    answer: sick
    difficulty: 1
    hints:
    - Doctors work there.
    - To get well.
    solution: We go to a hospital when we are sick.
  - prompt: Who works in a hospital?
    options:
    - a doctor
    - a farmer
    - a pilot
    - a tailor
    answer: a doctor
    difficulty: 1
    hints:
    - Helps sick people.
    - Stethoscope.
    solution: A doctor works in a hospital.
  - prompt: 'We post letters at the:'
    options:
    - post office
    - park
    - bakery
    - temple
    answer: post office
    difficulty: 1
    hints:
    - Postman.
    - Letters and stamps.
    solution: We post letters at the post office.
  - prompt: Where do we buy fruits and vegetables?
    options:
    - market
    - police station
    - school
    - hospital
    answer: market
    difficulty: 1
    hints:
    - Shops and sellers.
    - Buying.
    solution: We buy them at the market.
  - prompt: Which is a naming word for a place?
    options:
    - town
    - walk
    - pretty
    - slowly
    answer: town
    difficulty: 2
    hints:
    - You can live there.
    - A place name.
    solution: Town is a naming word for a place.
    mistakes:
      walk: eng2_word
  - prompt: Who keeps our town safe?
    options:
    - the police
    - the baker
    - the painter
    - the singer
    answer: the police
    difficulty: 2
    hints:
    - Police station.
    - They help when there is trouble.
    solution: The police keep the town safe.
