# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 13. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 13
title: 'We Are All Indians (Unit 5: Harmony)'
concepts:
- code: cbse2e.u5.indians
  title: 'We Are All Indians (Unit 5: Harmony)'
  notes: |
    A lesson about India's many languages, festivals, foods and clothes, and how we are all Indians together. Exact
    details are not reproduced here; questions focus on unity in diversity, national symbols and respect.
  explanations:
    text: India has people who speak many languages, eat many foods and celebrate many festivals. We are different in many ways, but we are all Indians.
    visual: Draw children in different clothes holding hands around the Indian flag.
    step_by_step: 1. Read the lesson. 2. Name some languages and festivals. 3. What is the same for all of us? 4. How do we show respect?
    real_world: In one class, children may speak Malayalam, Hindi, Tamil or Bengali at home, and all learn together.
  picture:
    kind: compare
    columns:
    - title: Different
      points:
      - languages
      - foods
      - festivals
    - title: Same
      points:
      - one country
      - one flag
      - friends
    alt: We have different languages, foods and festivals, but one country, one flag, and we are friends.
  activity:
    type: sort
    prompt: 'We Are All Indians: festival, food or clothes?'
    bins:
    - Festival
    - Food
    - Clothes
    items:
    - label: Diwali
      bin: Festival
      clue: Lamps.
      why: Diwali is a festival.
    - label: Idli
      bin: Food
      clue: Eaten.
      why: Idli is food.
    - label: Sari
      bin: Clothes
      clue: Worn.
      why: A sari is clothing.
    - label: Eid
      bin: Festival
      clue: Celebrated.
      why: Eid is a festival.
    - label: Roti
      bin: Food
      clue: Bread.
      why: Roti is food.
    - label: Kurta
      bin: Clothes
      clue: Worn.
      why: A kurta is clothing.
  items:
  - prompt: 'Our country is:'
    options:
    - India
    - England
    - China
    - Japan
    answer: India
    difficulty: 1
    hints:
    - We are all ...
    - Indians.
    solution: Our country is India.
  - prompt: The Indian flag has how many colours in its stripes?
    options:
    - three
    - two
    - five
    - one
    answer: three
    difficulty: 1
    hints:
    - Saffron, white, green.
    - Count them.
    solution: 'Three: saffron, white and green.'
  - prompt: 'People in India speak:'
    options:
    - many languages
    - only one language
    - no language
    - only English
    answer: many languages
    difficulty: 1
    hints:
    - Hindi, Malayalam, Tamil ...
    - Lots.
    solution: People in India speak many languages.
    mistakes:
      only one language: eng2_read_again
  - prompt: 'We should treat people from other states:'
    options:
    - as friends
    - badly
    - with anger
    - as strangers to avoid
    answer: as friends
    difficulty: 1
    hints:
    - We are all Indians.
    - Kindness.
    solution: We treat them as friends.
  - prompt: Which is a festival?
    options:
    - Diwali
    - Monday
    - Mango
    - Cricket
    answer: Diwali
    difficulty: 2
    hints:
    - Lamps and sweets.
    - A celebration.
    solution: Diwali is a festival.
  - prompt: '''All'' means:'
    options:
    - every one
    - nobody
    - only one
    - half
    answer: every one
    difficulty: 2
    hints:
    - We are ALL Indians.
    - Everybody.
    solution: All means every one.
    mistakes:
      only one: eng2_word
