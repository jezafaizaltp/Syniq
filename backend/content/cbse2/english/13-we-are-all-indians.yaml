# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 13. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 13
title: 'We Are All Indians (Unit 5: Harmony)'
tips:
  e2_festival: "Monday is a day. Which one is a celebration with lamps?"
  e2_flag_stripes: "Saffron, white and green. Count the stripes."
  e2_india: "The poem is about our own country."
  e2_other_states: "We are all Indians. How should we treat each other?"
  c2e13_count: Count the stripe colours, then look at the middle of the flag too.
  c2e13_fest: Which ones do families celebrate with prayers, food and visits?
  c2e13_map: Look for them on a map of India.
  c2e13_unity: India has many languages and festivals. Do they make us one people or many enemies?
  c2e13_symbol: Think of what you see on Independence Day at school.
  c2e13_respect: How would you like children from another state to treat you?

concepts:
- code: cbse2e.u5.indians
  title: 'We Are All Indians (Unit 5: Harmony)'
  notes: |
    A lesson about India's many languages, festivals, foods and clothes, and how we are all Indians together. Exact
    details are not reproduced here; questions focus on unity in diversity, national symbols and respect.
  explanations:
    text: India has people who speak many languages, eat many foods and celebrate many festivals. We are different in many ways, but we are all Indians.
    visual: Draw children in different clothes holding hands around the Indian flag.
    step_by_step: 1. Read the lesson. 2. Name some languages and festivals. 3. What is the same for all of us? 4. How do we show respect?
    real_world: In one class, children may speak Malayalam, Hindi, Tamil or Bengali at home, and all learn together.
  picture:
    kind: compare
    columns:
    - title: Different
      points:
      - languages
      - foods
      - festivals
    - title: Same
      points:
      - one country
      - one flag
      - friends
    alt: We have different languages, foods and festivals, but one country, one flag, and we are friends.
  activity:
    type: sort
    prompt: 'We Are All Indians: festival, food or clothes?'
    bins:
    - Festival
    - Food
    - Clothes
    items:
    - label: Diwali
      bin: Festival
      clue: Lamps.
      why: Diwali is a festival.
    - label: Idli
      bin: Food
      clue: Eaten.
      why: Idli is food.
    - label: Sari
      bin: Clothes
      clue: Worn.
      why: A sari is clothing.
    - label: Eid
      bin: Festival
      clue: Celebrated.
      why: Eid is a festival.
    - label: Roti
      bin: Food
      clue: Bread.
      why: Roti is food.
    - label: Kurta
      bin: Clothes
      clue: Worn.
      why: A kurta is clothing.
  lesson:
    - teach: 'India is a big country with many states. People speak many languages: Hindi, Malayalam, Tamil, Bengali, Marathi, Punjabi and more. They eat different foods and wear different clothes.'
      picture:
        kind: compare
        columns:
        - title: Languages
          points:
          - Hindi
          - Malayalam
          - Tamil
          - Bengali
        - title: Foods
          points:
          - dosa
          - roti
          - rice and fish
          - dhokla
        alt: India has many languages and many foods.
      check:
        prompt: Which is a language spoken in India?
        options:
        - Malayalam
        - Diwali
        - dosa
        answer: Malayalam
        why: Malayalam is spoken in Kerala; Diwali is a festival and dosa is food.
      ways:
      - style: step_by_step
        teach: 'Learn to say hello in other languages. Step 1: In Hindi, say ''Namaste''. Step 2: In Malayalam, say ''Namaskaram''. Step 3: In Tamil, say ''Vanakkam''. Step 4: Ask a friend how to say it in their language.'
      - style: real_world
        teach: At a railway station in India, announcements are often made in Hindi, English and the language of that state, so that everyone can understand.
    - teach: 'We celebrate many festivals: Diwali, Eid, Christmas, Onam, Pongal, Guru Purab, Holi. Friends visit each other and share sweets. Different but together: this is unity in diversity.'
      check:
        prompt: 'Onam is a:'
        options:
        - festival
        - river
        - fruit
        answer: festival
        why: Onam is a harvest festival of Kerala.
      ways:
      - style: visual
        teach: Some festivals and the states where they are celebrated in a big way.
        picture:
          kind: compare
          columns:
          - title: Festival
            points:
            - Bihu
            - Baisakhi
            - Durga Puja
          - title: Celebrated big in
            points:
            - Assam
            - Punjab
            - West Bengal
          alt: Bihu is celebrated in a big way in Assam, Baisakhi in Punjab and Durga Puja in West Bengal.
      - style: real_world
        teach: In many neighbourhoods, families of every faith visit each other at festival time and share sweets and good wishes.
    - teach: 'We are all Indians. Our flag has three colours: saffron, white and green, with a blue wheel in the middle. Our national anthem is ''Jana Gana Mana''. We treat people from every state as friends.'
      picture:
        kind: flow
        steps:
        - saffron
        - white with a blue wheel
        - green
        alt: 'The Indian flag: saffron, white with a blue wheel, green.'
      check:
        prompt: What is in the middle of the Indian flag?
        options:
        - a blue wheel
        - a star
        - a moon
        answer: a blue wheel
        why: A blue wheel (the Ashoka Chakra) is on the white stripe.
      ways:
      - style: step_by_step
        teach: 'Stand for the national anthem. Step 1: When it starts, stop what you are doing. Step 2: Stand up straight. Step 3: Stay still and quiet. Step 4: Sing along if you know the words.'
      - style: real_world
        teach: On Independence Day, 15 August, schools across India raise the flag, and children sing the national anthem together.
  items:
  - prompt: 'Our country is:'
    options:
    - India
    - England
    - China
    - Japan
    answer: India
    difficulty: 1
    hints:
    - We are all ...
    - Indians.
    solution: Our country is India.
    mistakes: {"England": "e2_india"}
  - prompt: The Indian flag has how many colours in its stripes?
    options:
    - three
    - two
    - five
    - one
    answer: three
    difficulty: 1
    hints:
    - Saffron, white, green.
    - Count them.
    solution: 'Three: saffron, white and green.'
    mistakes: {"two": "e2_flag_stripes"}
  - prompt: 'People in India speak:'
    options:
    - many languages
    - only one language
    - no language
    - only English
    answer: many languages
    difficulty: 1
    hints:
    - Hindi, Malayalam, Tamil ...
    - Lots.
    solution: People in India speak many languages.
    mistakes:
      only one language: eng2_read_again
  - prompt: 'We should treat people from other states:'
    options:
    - as friends
    - badly
    - with anger
    - as strangers to avoid
    answer: as friends
    difficulty: 1
    hints:
    - We are all Indians.
    - Kindness.
    solution: We treat them as friends.
    mistakes: {"as strangers to avoid": "e2_other_states"}
  - prompt: Which is a festival?
    options:
    - Diwali
    - Monday
    - Mango
    - Cricket
    answer: Diwali
    difficulty: 2
    hints:
    - Lamps and sweets.
    - A celebration.
    solution: Diwali is a festival.
    mistakes: {"Monday": "e2_festival"}
  - prompt: '''All'' means:'
    options:
    - every one
    - nobody
    - only one
    - half
    answer: every one
    difficulty: 2
    hints:
    - We are ALL Indians.
    - Everybody.
    solution: All means every one.
    mistakes:
      only one: eng2_word
  - prompt: Which colour is at the top of the Indian flag?
    options:
    - saffron
    - green
    - blue
    answer: saffron
    difficulty: 1
    hints:
    - Picture the flag at school.
    - It is an orange-like colour.
    solution: 'Step 1: The flag has three stripes. Step 2: Saffron is on top.'
    mistakes:
      green: c2e13_symbol
      blue: c2e13_symbol
  - prompt: 'Our national anthem is:'
    options:
    - Jana Gana Mana
    - Twinkle Twinkle
    - Happy Birthday
    answer: Jana Gana Mana
    difficulty: 1
    hints:
    - We stand still when we sing it.
    - It is sung at school assembly.
    solution: 'Step 1: Every country has an anthem. Step 2: India''s is Jana Gana Mana.'
    mistakes:
      Twinkle Twinkle: c2e13_symbol
      Happy Birthday: c2e13_symbol
  - prompt: Which festival is celebrated in India?
    options:
    - Eid
    - Snow Day
    - Thanksgiving Ice Show
    answer: Eid
    difficulty: 1
    hints:
    - Friends share sweets and seviyan.
    - It comes after a month of fasting.
    solution: 'Step 1: Many festivals are celebrated in India. Step 2: Eid is one of them.'
    mistakes:
      Snow Day: c2e13_fest
      Thanksgiving Ice Show: c2e13_fest
  - prompt: Which food comes from south India?
    options:
    - dosa
    - pizza
    - noodles from a packet
    answer: dosa
    difficulty: 1
    hints:
    - It is a thin pancake from rice batter.
    - Often eaten with sambar.
    solution: 'Step 1: South Indian homes make many rice dishes. Step 2: Dosa is one.'
    mistakes:
      pizza: c2e13_unity
      noodles from a packet: c2e13_unity
  - prompt: 'A new classmate comes from Assam and speaks Assamese. We should:'
    options:
    - welcome them and learn a word from their language
    - laugh at how they speak
    - not play with them
    answer: welcome them and learn a word from their language
    difficulty: 1
    hints:
    - We are all Indians.
    - How would you feel in a new school?
    solution: 'Step 1: Every Indian language is ours too. Step 2: Welcome them and learn a word.'
    mistakes:
      laugh at how they speak: c2e13_respect
      not play with them: c2e13_respect
  - prompt: How many colours are in the flag's stripes AND its wheel?
    options:
    - four
    - three
    - two
    answer: four
    difficulty: 2
    hints:
    - Count the stripe colours first.
    - Then add the wheel's colour.
    solution: 'Step 1: saffron, white, green = 3. Step 2: The blue wheel makes 4.'
    mistakes:
      three: c2e13_count
      two: c2e13_count
  - prompt: Which two are both festivals?
    options:
    - Christmas and Pongal
    - Delhi and Mumbai
    - Tamil and Hindi
    answer: Christmas and Pongal
    difficulty: 2
    hints:
    - One pair is cities, one pair is languages.
    - Which pair do we celebrate?
    solution: 'Step 1: Delhi and Mumbai are cities; Tamil and Hindi are languages. Step 2: Christmas and Pongal are festivals.'
    mistakes:
      Delhi and Mumbai: c2e13_fest
      Tamil and Hindi: c2e13_fest
  - prompt: '''Unity in diversity'' means:'
    options:
    - different but together
    - all the same
    - always fighting
    answer: different but together
    difficulty: 2
    hints:
    - Diversity means many kinds.
    - Unity means being one.
    solution: 'Step 1: Diversity is many kinds. Step 2: Unity is together: different but together.'
    mistakes:
      all the same: c2e13_unity
      always fighting: c2e13_unity
  - prompt: 'Kerala, Punjab and Gujarat are:'
    options:
    - states of India
    - festivals
    - languages
    answer: states of India
    difficulty: 3
    hints:
    - They are places on the map of India.
    - Each has its own capital city.
    solution: 'Step 1: These are places on India''s map. Step 2: They are states of India.'
    mistakes:
      festivals: c2e13_map
      languages: c2e13_map
  - prompt: 'Case: A new classmate has moved from Punjab and does not speak Malayalam yet. Some children laugh at the way the classmate speaks. What should the class do?'
    options:
    - Make the classmate welcome and help with new words
    - Keep laughing
    - Play only with children who speak Malayalam
    answer: Make the classmate welcome and help with new words
    hints:
    - How would you feel in a new place where you did not know the language?
    - Which choice treats the classmate as a friend?
    solution: We are all Indians. Welcoming the classmate and helping with new words is how we treat people from every state.
    mistakes:
      Keep laughing: c2e13_respect
      Play only with children who speak Malayalam: c2e13_respect
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your class is making a poster called ''We Are All Indians''. Which picture fits it best?'
    options:
    - Children from different states holding hands around the flag
    - One child standing alone
    - A map of another country
    answer: Children from different states holding hands around the flag
    hints:
    - The poster is about many people being one.
    - Which picture shows different people together?
    solution: Children from different states shows diversity, and holding hands around the flag shows unity.
    mistakes:
      One child standing alone: c2e13_unity
      A map of another country: c2e13_unity
    exam: competency
    difficulty: 2
