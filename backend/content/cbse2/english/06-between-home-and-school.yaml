# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 6. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 6
title: 'Between Home and School (Unit 3: Going Places)'
concepts:
- code: cbse2e.u3.between
  title: 'Between Home and School (Unit 3: Going Places)'
  notes: |
    A lesson about the things we see on the way from home to school: shops, trees, people, vehicles. Exact details
    are not reproduced here; questions focus on places, people at work, road safety and direction words.
  explanations:
    text: 'On the way from home to school we see many things: shops, trees, buses, people going to work. Look around and stay safe on the road.'
    visual: Draw a path from a house to a school, with a shop, a tree and a zebra crossing on the way.
    step_by_step: 1. Read the lesson. 2. List what is seen on the way. 3. Who is working? 4. How do we cross the road safely?
    real_world: Children walk, cycle or take a bus or auto-rickshaw to school.
  picture:
    kind: flow
    steps:
    - Home
    - Shop
    - Tree
    - Zebra crossing
    - School
    alt: From home, past the shop and the tree, across the zebra crossing, to school.
  items:
  - prompt: 'We cross the road at the:'
    options:
    - zebra crossing
    - middle of the road
    - corner of a bus
    - back of a truck
    answer: zebra crossing
    difficulty: 1
    hints:
    - Black and white stripes.
    - Safe place.
    solution: We cross at the zebra crossing.
  - prompt: 'A red traffic light means:'
    options:
    - stop
    - go
    - run
    - jump
    answer: stop
    difficulty: 1
    hints:
    - Red is for danger.
    - Wait.
    solution: Red means stop.
  - prompt: Who sells vegetables?
    options:
    - a vegetable seller
    - a pilot
    - a doctor
    - a postman
    answer: a vegetable seller
    difficulty: 1
    hints:
    - At the market.
    - Fresh food.
    solution: A vegetable seller sells vegetables.
  - prompt: Which is a place?
    options:
    - school
    - run
    - happy
    - quickly
    answer: school
    difficulty: 2
    hints:
    - You can go there.
    - Naming word.
    solution: School is a place.
    mistakes:
      run: eng2_word
  - prompt: 'Before crossing a road we look:'
    options:
    - left and right
    - only up
    - only at our shoes
    - nowhere
    answer: left and right
    difficulty: 2
    hints:
    - Look both ways.
    - Cars come from both sides.
    solution: Look left and right.
  - prompt: Which takes many children to school together?
    options:
    - school bus
    - bicycle
    - skateboard
    - horse
    answer: school bus
    difficulty: 1
    hints:
    - Big yellow vehicle.
    - Many seats.
    solution: A school bus carries many children.
