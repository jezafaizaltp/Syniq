# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 6. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 6
title: 'Between Home and School (Unit 3: Going Places)'
tips:
  c2e6_light: "Red, yellow and green each tell drivers something different. Which colour starts them moving?"
  e2_look_both: "Cars come from both sides. Which ways should you look?"
  e2_red_light: "Green means go. What does red mean?"
  e2_school_bus: "Which one is big enough for many children?"
  e2_veg_seller: "The name of the person tells you what they sell."
  e2_zebra: "There are black and white stripes on the road where people cross."
  c2e6_safe: 'Ask: which choice keeps you away from moving vehicles?'
  c2e6_job: Think of where this person works and what they give us.
  c2e6_dir: Hold up your hands. Which side is which?
  c2e6_road: "Is it on the ground beside the road, or far up above it?"

concepts:
- code: cbse2e.u3.between
  title: 'Between Home and School (Unit 3: Going Places)'
  notes: |
    A lesson about the things we see on the way from home to school: shops, trees, people, vehicles. Exact details
    are not reproduced here; questions focus on places, people at work, road safety and direction words.
  explanations:
    text: 'On the way from home to school we see many things: shops, trees, buses, people going to work. Look around and stay safe on the road.'
    visual: Draw a path from a house to a school, with a shop, a tree and a zebra crossing on the way.
    step_by_step: 1. Read the lesson. 2. List what is seen on the way. 3. Who is working? 4. How do we cross the road safely?
    real_world: Children walk, cycle or take a bus or auto-rickshaw to school.
  picture:
    kind: flow
    steps:
    - Home
    - Shop
    - Tree
    - Zebra crossing
    - School
    alt: From home, past the shop and the tree, across the zebra crossing, to school.
  activity:
    type: sort
    prompt: 'Between Home and School: who works where?'
    bins:
    - Shop
    - Hospital
    - Road
    items:
    - label: Shopkeeper
      bin: Shop
      clue: Sells things.
      why: A shopkeeper works in a shop.
    - label: Doctor
      bin: Hospital
      clue: Helps sick people.
      why: Doctors work in hospitals.
    - label: Traffic police
      bin: Road
      clue: Waves to cars.
      why: Traffic police work on the road.
    - label: Nurse
      bin: Hospital
      clue: Cares for patients.
      why: Nurses work in hospitals.
    - label: Bus driver
      bin: Road
      clue: Drives people.
      why: A bus driver works on the road.
  lesson:
    - teach: 'On the way from home to school we see many things: houses, shops, trees, a temple, a mosque or a church, a bus stop, people walking and vehicles on the road.'
      picture:
        kind: flow
        steps:
        - home
        - shops and trees
        - zebra crossing
        - school
        alt: The way from home past shops and a crossing to school.
      check:
        prompt: Where do people wait for a bus?
        options:
        - at a bus stop
        - in a pond
        - on a roof
        answer: at a bus stop
        why: Buses stop at bus stops to pick people up.
      ways:
      - style: step_by_step
        teach: 'Draw your way to school. Step 1: Draw your home at the bottom of the page. Step 2: Draw your school at the top. Step 3: Draw the road between them. Step 4: Add the things you pass, like a tree, a well or a tea stall.'
      - style: real_world
        teach: Some children walk to school, some come on a cycle, and in places with rivers some come by boat. Each child sees different things on the way.
    - teach: 'People work along the road: the vegetable seller sells vegetables, the milkman brings milk, the postman brings letters, the traffic police guide vehicles.'
      check:
        prompt: Who brings letters to our home?
        options:
        - the postman
        - the cook
        - the barber
        answer: the postman
        why: The postman delivers letters and parcels.
      ways:
      - style: visual
        teach: Some people who work along the road, and what they do.
        picture:
          kind: compare
          columns:
          - title: Who
            points:
            - Fruit seller
            - Sweeper
            - Tailor
          - title: What they do
            points:
            - Sells fruits from a cart
            - Keeps the road clean
            - Stitches clothes in a small shop
          alt: A fruit seller sells fruits from a cart, a sweeper keeps the road clean, and a tailor stitches clothes in a small shop.
      - style: real_world
        teach: Early in the morning, a newspaper seller cycles from house to house and drops the paper over each gate before people wake up.
    - teach: 'Road safety: walk on the footpath. Cross at the zebra crossing. Look left, right and left again. Red light means stop, yellow means get ready, green means go.'
      picture:
        kind: compare
        columns:
        - title: Red
          points:
          - stop
        - title: Yellow
          points:
          - get ready
        - title: Green
          points:
          - go
        alt: 'Traffic lights: red stop, yellow get ready, green go.'
      check:
        prompt: 'A yellow traffic light means:'
        options:
        - get ready
        - go fast
        - sleep
        answer: get ready
        why: 'Yellow comes between red and green: get ready.'
      ways:
      - style: step_by_step
        teach: 'Crossing at a walking signal. Step 1: Stop at the edge of the road. Step 2: Wait for the green walking sign. Step 3: Look both ways once more. Step 4: Walk across. Do not run.'
      - style: real_world
        teach: Some schools have a crossing helper who holds up a STOP sign at the gate, so that traffic waits while children cross.
  items:
  - prompt: 'We cross the road at the:'
    options:
    - zebra crossing
    - middle of the road
    - corner of a bus
    - back of a truck
    answer: zebra crossing
    difficulty: 1
    hints:
    - Black and white stripes.
    - Safe place.
    solution: We cross at the zebra crossing.
    mistakes: {"middle of the road": "e2_zebra"}
  - prompt: 'A red traffic light means:'
    options:
    - stop
    - go
    - run
    - jump
    answer: stop
    difficulty: 1
    hints:
    - Red is for danger.
    - Wait.
    solution: Red means stop.
    mistakes: {"go": "e2_red_light"}
  - prompt: Who sells vegetables?
    options:
    - a vegetable seller
    - a pilot
    - a doctor
    - a postman
    answer: a vegetable seller
    difficulty: 1
    hints:
    - At the market.
    - Fresh food.
    solution: A vegetable seller sells vegetables.
    mistakes: {"a postman": "e2_veg_seller"}
  - prompt: Which is a place?
    options:
    - school
    - run
    - happy
    - quickly
    answer: school
    difficulty: 2
    hints:
    - You can go there.
    - Naming word.
    solution: School is a place.
    mistakes:
      run: eng2_word
  - prompt: 'Before crossing a road we look:'
    options:
    - left and right
    - only up
    - only at our shoes
    - nowhere
    answer: left and right
    difficulty: 2
    hints:
    - Look both ways.
    - Cars come from both sides.
    solution: Look left and right.
    mistakes: {"only up": "e2_look_both"}
  - prompt: Which takes many children to school together?
    options:
    - school bus
    - bicycle
    - skateboard
    - horse
    answer: school bus
    difficulty: 1
    hints:
    - Big yellow vehicle.
    - Many seats.
    solution: A school bus carries many children.
    mistakes: {"bicycle": "e2_school_bus"}
  - prompt: Where should we walk on a busy road?
    options:
    - on the footpath
    - in the middle of the road
    - between the buses
    answer: on the footpath
    difficulty: 1
    hints:
    - Cars use the road.
    - There is a raised path at the side.
    solution: 'Step 1: Vehicles use the road. Step 2: People walk on the footpath.'
    mistakes:
      in the middle of the road: c2e6_safe
      between the buses: c2e6_safe
  - prompt: 'A green traffic light means:'
    options:
    - go
    - stop
    - turn back
    answer: go
    difficulty: 1
    hints:
    - Red and green mean opposite things.
    - Vehicles start moving.
    solution: 'Step 1: Red is stop. Step 2: Green is go.'
    mistakes:
      stop: c2e6_light
      turn back: c2e6_light
  - prompt: Who brings milk to many homes in the morning?
    options:
    - the milkman
    - the tailor
    - the driver of the school bus
    answer: the milkman
    difficulty: 1
    hints:
    - Milk comes from cows.
    - This person's job has 'milk' in it.
    solution: 'Step 1: Milk is brought early. Step 2: The milkman brings it.'
    mistakes:
      the tailor: c2e6_job
      the driver of the school bus: c2e6_job
  - prompt: Who guides vehicles at a busy crossing?
    options:
    - the traffic police
    - the shopkeeper
    - the gardener
    answer: the traffic police
    difficulty: 1
    hints:
    - This person waves hands and blows a whistle.
    - They stand where roads meet.
    solution: 'Step 1: Busy crossings need order. Step 2: The traffic police guide vehicles.'
    mistakes:
      the shopkeeper: c2e6_job
      the gardener: c2e6_job
  - prompt: Which is a place we may pass on the way to school?
    options:
    - a shop
    - a cloud
    - a star
    answer: a shop
    difficulty: 1
    hints:
    - It is on the ground, by the road.
    - We can walk into it.
    solution: 'Step 1: Clouds and stars are in the sky. Step 2: A shop is on the road.'
    mistakes:
      a cloud: c2e6_road
      a star: c2e6_road
  - prompt: 'To cross the road, we look:'
    options:
    - left, right and left again
    - only up at the sky
    - only at our shoes
    answer: left, right and left again
    difficulty: 2
    hints:
    - Vehicles come from both sides.
    - Turn your head both ways.
    solution: 'Step 1: Traffic comes from both sides. Step 2: Look left, right and left again.'
    mistakes:
      only up at the sky: e2_look_both
      only at our shoes: e2_look_both
  - prompt: 'The white stripes on the road where we cross are called the:'
    options:
    - zebra crossing
    - speed bump
    - bus stop
    answer: zebra crossing
    difficulty: 2
    hints:
    - They look like the stripes of an animal.
    - That animal is black and white.
    solution: 'Step 1: The stripes look like a zebra''s. Step 2: It is the zebra crossing.'
    mistakes:
      speed bump: e2_zebra
      bus stop: e2_zebra
  - prompt: 'You get off the school bus. You should:'
    options:
    - wait on the footpath till the bus goes
    - run across in front of the bus
    - play behind the bus
    answer: wait on the footpath till the bus goes
    difficulty: 2
    hints:
    - Drivers cannot see small children near the bus.
    - Stay away from the bus while it moves.
    solution: 'Step 1: The driver may not see you near the bus. Step 2: Wait on the footpath till it leaves.'
    mistakes:
      run across in front of the bus: c2e6_safe
      play behind the bus: c2e6_safe
  - prompt: Arun's home is to the left of the school. The park is to the right. Which is on the right?
    options:
    - the park
    - Arun's home
    - the school
    answer: the park
    difficulty: 3
    hints:
    - Read the second sentence again.
    - Which place is to the right?
    solution: 'Step 1: The home is on the left. Step 2: The park is on the right.'
    mistakes:
      Arun's home: c2e6_dir
      the school: c2e6_dir
  - prompt: 'Case: Sam and a friend are walking home and reach a busy road. The zebra crossing is a little way ahead, and its light is red for the cars. What should they do?'
    options:
    - Walk to the zebra crossing and cross while the cars are stopped
    - Run across the road right here
    - Cross between the parked cars
    answer: Walk to the zebra crossing and cross while the cars are stopped
    hints:
    - Where on the road is it safe to cross?
    - When are the cars not moving?
    solution: The zebra crossing is the safe place to cross, and a red light means the cars must stop. Running across or stepping out between parked cars is dangerous.
    mistakes:
      Run across the road right here: c2e6_safe
      Cross between the parked cars: c2e6_safe
    exam: case
    difficulty: 2
  - prompt: 'Situation: On the way to school you find a letter on the road. It has an address written on it. Who could make sure it reaches the right home?'
    options:
    - the postman
    - the milkman
    - the vegetable seller
    answer: the postman
    hints:
    - Whose job is to carry letters?
    - Who takes things to the address written on them?
    solution: The postman carries letters to the address written on them, so the postman can take it to the right home.
    mistakes:
      the milkman: c2e6_job
      the vegetable seller: c2e6_job
    exam: competency
    difficulty: 2
