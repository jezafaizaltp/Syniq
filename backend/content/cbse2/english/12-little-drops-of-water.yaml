# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 12. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 12
title: 'Little Drops of Water (Unit 5: Harmony)'
tips:
  e2_kind_act: "Which one makes someone else happy?"
  e2_land: "Grains of sand join together to make the ground we stand on."
  e2_ocean: "Many drops of water together make something very big and wet."
  e2_opposite_little: "'Tiny' means the same as little. The opposite is large."
  c2e12_word: Think of a pleasant day. Is it a good feeling or a bad one?
  c2e12_opp: Mighty is about being very strong. Opposites are as far apart as they can be.
  c2e12_add: Think of a jar filled one drop at a time. What happens after many drops?
  c2e12_rhyme: Say both words aloud. Do the last sounds match?
  c2e12_kind: A kind act helps someone. Which choice helps?

concepts:
- code: cbse2e.u5.drops
  title: 'Little Drops of Water (Unit 5: Harmony)'
  notes: |
    The well-known poem "Little drops of water, little grains of sand, make the mighty ocean and the pleasant land."
    Small things added together make big things; small kind acts make the world better. Questions focus on the message,
    water, sand and rhyming words.
  explanations:
    text: This poem says that little drops of water make the big ocean, and little grains of sand make the land. Small things add up to big things, and small kind acts make the world happy.
    visual: Draw many small drops falling into a big blue ocean, and many grains of sand making a beach.
    step_by_step: 1. Read the poem aloud. 2. What do little drops make? 3. What do little grains of sand make? 4. What does it teach us?
    real_world: Saving a little water every day saves a lot in a year.
  picture:
    kind: flow
    steps:
    - Little drops
    - Many drops
    - A mighty ocean
    alt: Little drops of water join into many drops and make a mighty ocean.
  activity:
    type: sort
    prompt: 'Little Drops of Water: small things make…'
    bins:
    - The mighty ocean
    - The pleasant land
    items:
    - label: Little drops of water
      bin: The mighty ocean
      clue: What is the sea made of?
      why: Many drops make the ocean.
    - label: Little grains of sand
      bin: The pleasant land
      clue: What is the beach made of?
      why: Grains of sand make the land.
    - label: Millions of raindrops
      bin: The mighty ocean
      clue: Water again.
      why: Drops add up to the sea.
    - label: Tiny bits of soil
      bin: The pleasant land
      clue: Earth.
      why: Little bits make land.
  lesson:
    - teach: 'The poem says: Little drops of water, little grains of sand, make the mighty ocean and the pleasant land. Many tiny drops together make a huge ocean. Many tiny grains of sand make the land.'
      picture:
        kind: flow
        steps:
        - one drop
        - many drops
        - a mighty ocean
        alt: One drop, many drops, then a mighty ocean.
      check:
        prompt: 'Many little grains of sand make the:'
        options:
        - pleasant land
        - blue sky
        - tall tree
        answer: pleasant land
        why: Tiny grains of sand together make the land.
      ways:
      - style: step_by_step
        teach: 'Watch small things add up. Step 1: Put one bead on a string. Step 2: Add one more bead every day. Step 3: After a month, look: about 30 beads. Step 4: Tiny steps made a long string.'
      - style: real_world
        teach: A tall anthill is built by thousands of tiny ants, each one carrying a small bit of soil at a time.
    - teach: 'Mighty means very big and strong. Pleasant means nice. Little and big are opposites. Rhyming words in the poem: sand and land.'
      check:
        prompt: '''Mighty'' means:'
        options:
        - very big and strong
        - very small
        - very wet
        answer: very big and strong
        why: A mighty ocean is huge and powerful.
      ways:
      - style: visual
        teach: More pairs of opposites, like little and big.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - tall
            - heavy
            - wet
          - title: Opposite
            points:
            - short
            - light
            - dry
          alt: Tall and short, heavy and light, and wet and dry are opposites.
      - style: step_by_step
        teach: 'Find a word''s meaning from the poem. Step 1: Read the line: ''make the mighty ocean''. Step 2: Think: is the ocean small, or very big? Step 3: So ''mighty'' must be a word for very big and strong.'
    - teach: 'The message: small things add up to big things. Small kind acts, like sharing, saying thank you, or helping a friend, make the world a better place. Saving a little water each day saves a lot.'
      check:
        prompt: 'Closing a dripping tap every day saves:'
        options:
        - a lot of water over time
        - nothing at all
        - only one drop ever
        answer: a lot of water over time
        why: Little drops saved each day add up.
      ways:
      - style: visual
        teach: Small things that, together, make big things.
        picture:
          kind: compare
          columns:
          - title: One small thing
            points:
            - A drop of rain
            - A seed
            - A brick
          - title: Many together make
            points:
            - A river
            - A forest
            - A house
          alt: Many drops of rain make a river, many seeds grow into a forest, and many bricks make a house.
      - style: real_world
        teach: If each child in a class of 40 picks up just one wrapper, 40 wrappers are gone from the playground in one minute.
  items:
  - prompt: 'Little drops of water make the:'
    options:
    - mighty ocean
    - tall tree
    - hot sun
    - big house
    answer: mighty ocean
    difficulty: 1
    hints:
    - Lots of water.
    - The sea.
    solution: Little drops make the mighty ocean.
    mistakes: {"tall tree": "e2_ocean"}
  - prompt: 'Little grains of sand make the:'
    options:
    - pleasant land
    - blue sky
    - loud sound
    - round moon
    answer: pleasant land
    difficulty: 1
    hints:
    - We walk on it.
    - Ground.
    solution: Grains of sand make the land.
    mistakes: {"blue sky": "e2_land"}
  - prompt: 'The poem teaches that:'
    options:
    - small things add up to big things
    - small things do not matter
    - only big things matter
    - water is dry
    answer: small things add up to big things
    difficulty: 2
    hints:
    - Drops become an ocean.
    - Little by little.
    solution: Small things add up to big things.
    mistakes:
      small things do not matter: eng2_read_again
  - prompt: Which word rhymes with 'sand'?
    options:
    - land
    - sea
    - drop
    - water
    answer: land
    difficulty: 1
    hints:
    - End sound -and.
    - Say them aloud.
    solution: Sand and land rhyme.
    mistakes:
      sea: eng2_sound
  - prompt: Which is a small kind act?
    options:
    - helping a friend
    - breaking a toy
    - shouting
    - wasting water
    answer: helping a friend
    difficulty: 1
    hints:
    - It makes someone happy.
    - Kind.
    solution: Helping a friend is a kind act.
    mistakes: {"wasting water": "e2_kind_act"}
  - prompt: Which is the opposite of 'little'?
    options:
    - big
    - small
    - tiny
    - short
    answer: big
    difficulty: 2
    hints:
    - Not little.
    - Mighty.
    solution: Big is the opposite of little.
    mistakes: {"tiny": "e2_opposite_little"}
  - prompt: In the poem, what do little drops of water make?
    options:
    - the mighty ocean
    - the green hills
    - the hot sun
    answer: the mighty ocean
    difficulty: 1
    hints:
    - Lots of water in one place.
    - It is huge and salty.
    solution: 'Step 1: Drops of water join. Step 2: They make the mighty ocean.'
    mistakes:
      the green hills: e2_ocean
      the hot sun: c2e12_add
  - prompt: Which word rhymes with 'land'?
    options:
    - hand
    - lamp
    - ocean
    answer: hand
    difficulty: 1
    hints:
    - Land ends with 'and'.
    - Which word ends the same?
    solution: 'Step 1: Land ends with ''and''. Step 2: Hand ends with ''and'' too.'
    mistakes:
      lamp: c2e12_rhyme
      ocean: c2e12_rhyme
  - prompt: Which is a little thing?
    options:
    - a grain of sand
    - a mountain
    - an ocean
    answer: a grain of sand
    difficulty: 1
    hints:
    - Which one can sit on your fingertip?
    - The other two are huge.
    solution: 'Step 1: Mountains and oceans are huge. Step 2: A grain of sand is tiny.'
    mistakes:
      a mountain: e2_opposite_little
      an ocean: e2_opposite_little
  - prompt: '''Pleasant'' means:'
    options:
    - nice
    - angry
    - dirty
    answer: nice
    difficulty: 1
    hints:
    - A pleasant day is one you enjoy.
    - It is a good feeling word.
    solution: 'Step 1: Pleasant things make us feel good. Step 2: Pleasant means nice.'
    mistakes:
      angry: c2e12_word
      dirty: c2e12_word
  - prompt: Which of these is a kind act we can do every day?
    options:
    - sharing your crayons
    - pushing in the line
    - shouting at a friend
    answer: sharing your crayons
    difficulty: 1
    hints:
    - Kind acts make others feel good.
    - Which one helps someone?
    solution: 'Step 1: Pushing and shouting hurt others. Step 2: Sharing is a kind act.'
    mistakes:
      pushing in the line: c2e12_kind
      shouting at a friend: c2e12_kind
  - prompt: 'You put 1 coin in a box every day. After many days you have:'
    options:
    - many coins
    - no coins
    - only one coin
    answer: many coins
    difficulty: 2
    hints:
    - Little things add up.
    - Like drops making an ocean.
    solution: 'Step 1: One coin each day. Step 2: After many days, many coins.'
    mistakes:
      no coins: c2e12_add
      only one coin: c2e12_add
  - prompt: Which is the opposite of 'mighty'?
    options:
    - weak
    - strong
    - huge
    answer: weak
    difficulty: 2
    hints:
    - Mighty means very strong.
    - Opposite of strong is ...
    solution: 'Step 1: Mighty means very strong. Step 2: The opposite is weak.'
    mistakes:
      strong: c2e12_opp
      huge: c2e12_opp
  - prompt: Saying 'thank you' is small. Why does it matter?
    options:
    - "small kind words add up to make people happy"
    - "saying it costs a lot of money every time"
    - "saying it makes people feel sad and cross"
    answer: small kind words add up to make people happy
    difficulty: 2
    hints:
    - Remember the drops of water.
    - How do you feel when someone thanks you?
    solution: 'Step 1: One kind word is small. Step 2: Many kind words make everyone happier.'
    mistakes:
      "saying it costs a lot of money every time": c2e12_kind
      "saying it makes people feel sad and cross": c2e12_kind
  - prompt: Ravi saves 1 drop and Mira saves 1 drop. Together with 98 friends doing the same, how many drops?
    options:
    - '100'
    - '2'
    - '98'
    answer: '100'
    difficulty: 3
    hints:
    - Count Ravi and Mira too.
    - 98 friends and 2 more.
    solution: 'Step 1: 98 friends save 98 drops. Step 2: 98 + 2 = 100 drops.'
    mistakes:
      '2': c2e12_add
      '98': c2e12_add
  - prompt: 'Case: In a school, every child turns off the tap while brushing, saving a little water each day. After a month, the school''s water tank lasts much longer. Why?'
    options:
    - "Many small savings added up to a lot"
    - "The water tank itself grew bigger"
    - "It rained inside the closed tank"
    answer: Many small savings added up to a lot
    hints:
    - How much did each child save in one day?
    - What happens when many children do it every day?
    solution: Each child saved only a little, but many children over many days saved a lot, just like little drops make an ocean.
    mistakes:
      "The water tank itself grew bigger": c2e12_add
      "It rained inside the closed tank": c2e12_add
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your class wants to make the school a kinder place this week. Which plan is most like ''little drops of water''?'
    options:
    - Each child does one small kind act every day
    - Wait for one big event at the end of the year
    - Do nothing, because one child cannot help
    answer: Each child does one small kind act every day
    hints:
    - The poem is about tiny things done many times.
    - Which plan has many small acts?
    solution: Many small kind acts, done every day by everyone, add up to a big change, like drops making an ocean.
    mistakes:
      Wait for one big event at the end of the year: c2e12_kind
      Do nothing, because one child cannot help: c2e12_kind
    exam: competency
    difficulty: 2
