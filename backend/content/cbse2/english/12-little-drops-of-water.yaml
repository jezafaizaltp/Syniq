# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 12. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 12
title: 'Little Drops of Water (Unit 5: Harmony)'
tips:
  e2_kind_act: "Which one makes someone else happy?"
  e2_land: "Grains of sand join together to make the ground we stand on."
  e2_ocean: "Many drops of water together make something very big and wet."
  e2_opposite_little: "'Tiny' means the same as little. The opposite is large."

concepts:
- code: cbse2e.u5.drops
  title: 'Little Drops of Water (Unit 5: Harmony)'
  notes: |
    The well-known poem "Little drops of water, little grains of sand, make the mighty ocean and the pleasant land."
    Small things added together make big things; small kind acts make the world better. Questions focus on the message,
    water, sand and rhyming words.
  explanations:
    text: This poem says that little drops of water make the big ocean, and little grains of sand make the land. Small things add up to big things, and small kind acts make the world happy.
    visual: Draw many small drops falling into a big blue ocean, and many grains of sand making a beach.
    step_by_step: 1. Read the poem aloud. 2. What do little drops make? 3. What do little grains of sand make? 4. What does it teach us?
    real_world: Saving a little water every day saves a lot in a year.
  picture:
    kind: flow
    steps:
    - Little drops
    - Many drops
    - A mighty ocean
    alt: Little drops of water join into many drops and make a mighty ocean.
  activity:
    type: sort
    prompt: 'Little Drops of Water: small things make…'
    bins:
    - The mighty ocean
    - The pleasant land
    items:
    - label: Little drops of water
      bin: The mighty ocean
      clue: What is the sea made of?
      why: Many drops make the ocean.
    - label: Little grains of sand
      bin: The pleasant land
      clue: What is the beach made of?
      why: Grains of sand make the land.
    - label: Millions of raindrops
      bin: The mighty ocean
      clue: Water again.
      why: Drops add up to the sea.
    - label: Tiny bits of soil
      bin: The pleasant land
      clue: Earth.
      why: Little bits make land.
  items:
  - prompt: 'Little drops of water make the:'
    options:
    - mighty ocean
    - tall tree
    - hot sun
    - big house
    answer: mighty ocean
    difficulty: 1
    hints:
    - Lots of water.
    - The sea.
    solution: Little drops make the mighty ocean.
    mistakes: {"tall tree": "e2_ocean"}
  - prompt: 'Little grains of sand make the:'
    options:
    - pleasant land
    - blue sky
    - loud sound
    - round moon
    answer: pleasant land
    difficulty: 1
    hints:
    - We walk on it.
    - Ground.
    solution: Grains of sand make the land.
    mistakes: {"blue sky": "e2_land"}
  - prompt: 'The poem teaches that:'
    options:
    - small things add up to big things
    - small things do not matter
    - only big things matter
    - water is dry
    answer: small things add up to big things
    difficulty: 2
    hints:
    - Drops become an ocean.
    - Little by little.
    solution: Small things add up to big things.
    mistakes:
      small things do not matter: eng2_read_again
  - prompt: Which word rhymes with 'sand'?
    options:
    - land
    - sea
    - drop
    - water
    answer: land
    difficulty: 1
    hints:
    - End sound -and.
    - Say them aloud.
    solution: Sand and land rhyme.
    mistakes:
      sea: eng2_sound
  - prompt: Which is a small kind act?
    options:
    - helping a friend
    - breaking a toy
    - shouting
    - wasting water
    answer: helping a friend
    difficulty: 1
    hints:
    - It makes someone happy.
    - Kind.
    solution: Helping a friend is a kind act.
    mistakes: {"wasting water": "e2_kind_act"}
  - prompt: Which is the opposite of 'little'?
    options:
    - big
    - small
    - tiny
    - short
    answer: big
    difficulty: 2
    hints:
    - Not little.
    - Mighty.
    solution: Big is the opposite of little.
    mistakes: {"tiny": "e2_opposite_little"}
