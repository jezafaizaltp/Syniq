# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 11. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 11
title: 'The Smart Monkey (Unit 4: Life Around Us)'
concepts:
- code: cbse2e.u4.monkey
  title: 'The Smart Monkey (Unit 4: Life Around Us)'
  notes: |
    A story about a clever monkey who gets out of danger by thinking quickly, like the Panchatantra tale of the monkey
    and the crocodile. Exact story details are kept general; questions focus on thinking calmly in trouble, animals and
    their homes, and action words.
  explanations:
    text: This story is about a smart monkey. When it is in danger, it does not panic. It thinks quickly and finds a clever way out.
    visual: Draw a monkey on a tree beside a river, with a crocodile in the water looking up.
    step_by_step: 1. Read the story. 2. What was the danger? 3. How did the monkey think its way out? 4. What do we learn?
    real_world: When something goes wrong, stopping to think helps us find a way out.
  picture:
    kind: flow
    steps:
    - Monkey in danger
    - Stays calm
    - Thinks fast
    - Escapes safely
    alt: The monkey is in danger, stays calm, thinks fast and escapes safely.
  items:
  - prompt: 'The monkey in the story is:'
    options:
    - smart
    - lazy
    - sleepy
    - rude
    answer: smart
    difficulty: 1
    hints:
    - Look at the title.
    - Clever.
    solution: The monkey is smart.
  - prompt: 'When we are in trouble, we should:'
    options:
    - stay calm and think
    - cry and give up
    - shout at everyone
    - run without looking
    answer: stay calm and think
    difficulty: 1
    hints:
    - What did the monkey do?
    - Think first.
    solution: Stay calm and think, like the monkey.
    mistakes:
      cry and give up: eng2_read_again
  - prompt: 'Monkeys love to eat:'
    options:
    - bananas
    - stones
    - grass only
    - plastic
    answer: bananas
    difficulty: 1
    hints:
    - A yellow fruit.
    - Sweet.
    solution: Monkeys love bananas.
  - prompt: 'A crocodile lives in:'
    options:
    - water
    - a tree
    - a nest
    - the sky
    answer: water
    difficulty: 1
    hints:
    - It swims.
    - River.
    solution: A crocodile lives in water.
  - prompt: Which is an action word?
    options:
    - climb
    - monkey
    - tree
    - smart
    answer: climb
    difficulty: 2
    hints:
    - Something you do.
    - Monkeys do it on trees.
    solution: Climb is an action word.
    mistakes:
      monkey: eng2_word
  - prompt: Which is the opposite of 'smart'?
    options:
    - silly
    - clever
    - quick
    - bright
    answer: silly
    difficulty: 2
    hints:
    - Not smart.
    - Foolish.
    solution: Silly is the opposite of smart.
