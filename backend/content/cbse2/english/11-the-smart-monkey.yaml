# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 11. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 11
title: 'The Smart Monkey (Unit 4: Life Around Us)'
tips:
  e2_croc_home: "Crocodiles swim in rivers."
  e2_monkey_food: "A monkey's favourite fruit is long and yellow."
  e2_opposite_smart: "'Clever' means the same as smart. The opposite is foolish."
  e2_smart_monkey: "The title of the story tells you."
  c2e11_same: 'Same meaning: which word could take the place of smart in ''the smart monkey''?'
  c2e11_calm: 'When you are scared, what helps you find a way out: shouting or thinking?'
  c2e11_story: Go back to the story. What did the crocodile want, and what did the monkey say?
  c2e11_home: Think where this animal sleeps and finds food.

concepts:
- code: cbse2e.u4.monkey
  title: 'The Smart Monkey (Unit 4: Life Around Us)'
  notes: |
    A story about a clever monkey who gets out of danger by thinking quickly, like the Panchatantra tale of the monkey
    and the crocodile. Exact story details are kept general; questions focus on thinking calmly in trouble, animals and
    their homes, and action words.
  explanations:
    text: This story is about a smart monkey. When it is in danger, it does not panic. It thinks quickly and finds a clever way out.
    visual: Draw a monkey on a tree beside a river, with a crocodile in the water looking up.
    step_by_step: 1. Read the story. 2. What was the danger? 3. How did the monkey think its way out? 4. What do we learn?
    real_world: When something goes wrong, stopping to think helps us find a way out.
  picture:
    kind: flow
    steps:
    - Monkey in danger
    - Stays calm
    - Thinks fast
    - Escapes safely
    alt: The monkey is in danger, stays calm, thinks fast and escapes safely.
  activity:
    type: sort
    prompt: 'The Smart Monkey: where does each animal live?'
    bins:
    - Tree
    - River
    - Den
    items:
    - label: 🐒 Monkey
      bin: Tree
      clue: Swings on branches.
      why: Monkeys live in trees.
    - label: 🐊 Crocodile
      bin: River
      clue: Swims.
      why: Crocodiles live in rivers.
    - label: 🦁 Lion
      bin: Den
      clue: A cave home.
      why: Lions rest in dens.
    - label: 🦜 Parrot
      bin: Tree
      clue: Has a nest.
      why: Parrots live in trees.
  lesson:
    - teach: A monkey lives on a tree by a river and shares sweet fruit with a crocodile. One day the crocodile carries the monkey on its back into the river and says it wants the monkey's heart to eat.
      picture:
        kind: flow
        steps:
        - monkey and crocodile are friends
        - crocodile carries monkey into the river
        - crocodile wants the monkey's heart
        alt: The start of the story of the monkey and the crocodile.
      check:
        prompt: Where does the monkey live?
        options:
        - on a tree by a river
        - in the water
        - in a cave
        answer: on a tree by a river
        why: Monkeys live in trees, and this tree is by the river.
      ways:
      - style: step_by_step
        teach: 'Tell how the story begins. Step 1: Who is in it? A monkey and a crocodile. Step 2: Where are they? At a tree by a river. Step 3: What do they do? They meet and talk every day. Step 4: Then the trouble begins.'
      - style: real_world
        teach: Real crocodiles lie on river banks in the sun to warm their bodies, then slide back into the water to cool down.
    - teach: The monkey is scared but stays calm and thinks. It says, 'Oh! My heart is up in the tree. Take me back and I will get it.' The crocodile swims back. The monkey jumps up the tree and is safe.
      picture:
        kind: flow
        steps:
        - the monkey stays calm
        - says the heart is in the tree
        - crocodile swims back
        - monkey jumps to safety
        alt: How the monkey thinks of a clever way to get back to the tree.
      check:
        prompt: How did the monkey get back to safety?
        options:
        - by thinking of a clever plan
        - by crying loudly
        - by fighting
        answer: by thinking of a clever plan
        why: The monkey stayed calm and tricked the crocodile into swimming back.
      ways:
      - style: step_by_step
        teach: 'How the monkey thinks its way out. Step 1: See the danger. Step 2: Take a deep breath instead of crying out. Step 3: Think of an idea that gets you back to land. Step 4: Act on it at the right moment.'
      - style: real_world
        teach: If a dog barks at you on the road, standing still, staying quiet and then walking slowly away is safer than running and screaming.
    - teach: 'The lesson: in trouble, stay calm and think. Also, a true friend never tries to hurt us. Words to know: smart (clever), scared (afraid), safe (out of danger).'
      check:
        prompt: '''Scared'' means:'
        options:
        - afraid
        - happy
        - hungry
        answer: afraid
        why: Scared and afraid mean the same.
      ways:
      - style: visual
        teach: Words that mean almost the same thing as each other.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - happy
            - quick
            - huge
          - title: Means the same
            points:
            - glad
            - fast
            - very big
          alt: Happy means the same as glad, quick means fast, and huge means very big.
      - style: real_world
        teach: A true friend shares with you and stands by you. If anyone tries to lead you into danger, tell a grown-up you trust.
  items:
  - prompt: 'The monkey in the story is:'
    options:
    - smart
    - lazy
    - sleepy
    - rude
    answer: smart
    difficulty: 1
    hints:
    - Look at the title.
    - Clever.
    solution: The monkey is smart.
    mistakes: {"lazy": "e2_smart_monkey"}
  - prompt: 'When we are in trouble, we should:'
    options:
    - stay calm and think
    - cry and give up
    - shout at everyone
    - run without looking
    answer: stay calm and think
    difficulty: 1
    hints:
    - What did the monkey do?
    - Think first.
    solution: Stay calm and think, like the monkey.
    mistakes:
      cry and give up: eng2_read_again
  - prompt: 'Monkeys love to eat:'
    options:
    - bananas
    - stones
    - grass only
    - plastic
    answer: bananas
    difficulty: 1
    hints:
    - A yellow fruit.
    - Sweet.
    solution: Monkeys love bananas.
    mistakes: {"stones": "e2_monkey_food"}
  - prompt: 'A crocodile lives in:'
    options:
    - water
    - a tree
    - a nest
    - the sky
    answer: water
    difficulty: 1
    hints:
    - It swims.
    - River.
    solution: A crocodile lives in water.
    mistakes: {"a tree": "e2_croc_home"}
  - prompt: Which is an action word?
    options:
    - climb
    - monkey
    - tree
    - smart
    answer: climb
    difficulty: 2
    hints:
    - Something you do.
    - Monkeys do it on trees.
    solution: Climb is an action word.
    mistakes:
      monkey: eng2_word
  - prompt: Which is the opposite of 'smart'?
    options:
    - silly
    - clever
    - quick
    - bright
    answer: silly
    difficulty: 2
    hints:
    - Not smart.
    - Foolish.
    solution: Silly is the opposite of smart.
    mistakes: {"clever": "e2_opposite_smart"}
  - prompt: What did the monkey share with the crocodile?
    options:
    - sweet fruit
    - fish
    - bread
    answer: sweet fruit
    difficulty: 1
    hints:
    - The monkey lived on a tree.
    - What grows on trees?
    solution: 'Step 1: The tree had fruit. Step 2: The monkey shared sweet fruit.'
    mistakes:
      fish: c2e11_story
      bread: c2e11_story
  - prompt: Where did the crocodile take the monkey?
    options:
    - into the river
    - to a city
    - up a hill
    answer: into the river
    difficulty: 1
    hints:
    - A crocodile swims.
    - The monkey rode on its back.
    solution: 'Step 1: Crocodiles live in water. Step 2: It carried the monkey into the river.'
    mistakes:
      to a city: c2e11_story
      up a hill: c2e11_story
  - prompt: Where did the monkey say its heart was?
    options:
    - up in the tree
    - in the river
    - in the crocodile's home
    answer: up in the tree
    difficulty: 1
    hints:
    - The monkey wanted to go back.
    - Where did the monkey live?
    solution: 'Step 1: The monkey needed to get home. Step 2: It said the heart was up in the tree.'
    mistakes:
      in the river: c2e11_story
      in the crocodile's home: c2e11_story
  - prompt: Which animal lives in a tree?
    options:
    - monkey
    - crocodile
    - fish
    answer: monkey
    difficulty: 1
    hints:
    - Two of these live in water.
    - Which one climbs and swings?
    solution: 'Step 1: Crocodiles and fish live in water. Step 2: The monkey lives in a tree.'
    mistakes:
      crocodile: e2_croc_home
      fish: e2_croc_home
  - prompt: Which word means the same as 'smart'?
    options:
    - clever
    - silly
    - slow
    answer: clever
    difficulty: 1
    hints:
    - Smart means good at thinking.
    - The monkey thought of a plan.
    solution: 'Step 1: Smart people think well. Step 2: Clever means the same.'
    mistakes:
      silly: c2e11_same
      slow: c2e11_same
  - prompt: Was the crocodile a true friend?
    options:
    - no, it wanted to hurt the monkey
    - yes, a very kind one
    - yes, it shared fruit
    answer: no, it wanted to hurt the monkey
    difficulty: 2
    hints:
    - What did the crocodile want to eat?
    - A true friend never tries to hurt us.
    solution: 'Step 1: The crocodile wanted the monkey''s heart. Step 2: So it was not a true friend.'
    mistakes:
      yes, a very kind one: c2e11_story
      yes, it shared fruit: c2e11_story
  - prompt: Which is an action word from the story?
    options:
    - swim
    - river
    - sweet
    answer: swim
    difficulty: 2
    hints:
    - An action word is something we do.
    - River is a place; sweet is a taste.
    solution: 'Step 1: River names a place, sweet describes taste. Step 2: Swim is an action.'
    mistakes:
      river: c2e11_home
      sweet: c2e11_home
  - prompt: You get lost in a market. What is the smart thing to do?
    options:
    - stay calm and ask a shopkeeper or police for help
    - run around crying
    - go home with a stranger
    answer: stay calm and ask a shopkeeper or police for help
    difficulty: 2
    hints:
    - Remember the monkey.
    - Which choice uses thinking, not panic?
    solution: 'Step 1: Staying calm helps us think. Step 2: Ask a safe grown-up, like a shopkeeper or police.'
    mistakes:
      run around crying: c2e11_calm
      go home with a stranger: c2e11_calm
  - prompt: 'Put in order: (1) monkey jumps up the tree (2) crocodile asks for the heart (3) crocodile swims back. What is second?'
    options:
    - crocodile swims back
    - monkey jumps up the tree
    - crocodile asks for the heart
    answer: crocodile swims back
    difficulty: 3
    hints:
    - First the crocodile asks.
    - What must happen before the monkey can jump to the tree?
    solution: 'Step 1: Crocodile asks for the heart. Step 2: Crocodile swims back. Step 3: Monkey jumps up the tree.'
    mistakes:
      monkey jumps up the tree: c2e11_story
      crocodile asks for the heart: c2e11_story
  - prompt: 'Case: Asha and Lina are friends. Lina says, ''Come with me to the deep pond. Nobody will see us.'' Asha feels this is not safe. What should Asha do?'
    options:
    - Say no calmly and tell a grown-up
    - Go, because a friend asked
    - Run off and say nothing to anyone
    answer: Say no calmly and tell a grown-up
    hints:
    - Is the deep pond safe?
    - 'What helps most in trouble: thinking calmly, or rushing?'
    solution: Asha should stay calm, say no, and tell a grown-up who can keep both friends safe.
    mistakes:
      Go, because a friend asked: c2e11_calm
      Run off and say nothing to anyone: c2e11_calm
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing about the story. Which sentence uses a word that means the same as ''scared''?'
    options:
    - The monkey was afraid.
    - The monkey was happy.
    - The monkey was hungry.
    answer: The monkey was afraid.
    hints:
    - How did the monkey feel in the middle of the river?
    - Which word could take the place of 'scared'?
    solution: '''Afraid'' means the same as ''scared'', so ''The monkey was afraid.'' is right.'
    mistakes:
      The monkey was happy.: c2e11_same
      The monkey was hungry.: c2e11_same
    exam: competency
    difficulty: 2
