# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 8. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 8
title: 'A Show of Clouds (Unit 4: Life Around Us)'
tips:
  c2e8_sky: "Look up when it rains. What in the sky holds water?"
  e2_white_clouds: "Dark clouds come before rain. On a bright day, clouds look like cotton."
  c2e8_cloud: Look up at the sky in your mind. What happens to clouds as the wind blows?
  c2e8_desc: A describing word tells how something looks, feels or sounds.
  c2e8_rhyme: Say both words. Do the last sounds match?

concepts:
- code: cbse2e.u4.clouds
  title: 'A Show of Clouds (Unit 4: Life Around Us)'
  notes: |
    A poem about clouds in the sky that look like animals and things, and change shape as they move. Exact lines are
    not reproduced here; questions focus on clouds, rain, imagination and describing words.
  explanations:
    text: Clouds float in the sky and keep changing shape. One looks like an elephant, another like a ship. Dark clouds bring rain.
    visual: 'Draw three clouds: one shaped like an elephant, one like a fish and one dark rain cloud.'
    step_by_step: 1. Read the poem aloud. 2. What shapes did the clouds make? 3. What happens when clouds are dark? 4. Find describing words.
    real_world: On a windy day, lie on the grass and watch the cloud shapes change.
  picture:
    kind: flow
    steps:
    - White cloud
    - Changes shape
    - Turns dark
    - Rain falls
    alt: A white cloud changes shape, turns dark, and rain falls.
  activity:
    type: sort
    prompt: 'A Show of Clouds: describing clouds or rain?'
    bins:
    - Clouds
    - Rain
    items:
    - label: Fluffy and white
      bin: Clouds
      clue: Like cotton.
      why: Clouds look fluffy.
    - label: Pitter-patter
      bin: Rain
      clue: A sound.
      why: Rain falls pitter-patter.
    - label: Shaped like an elephant
      bin: Clouds
      clue: Imagination.
      why: We see shapes in clouds.
    - label: Puddles on the road
      bin: Rain
      clue: Water on the ground.
      why: Rain makes puddles.
    - label: Moving slowly across the sky
      bin: Clouds
      clue: Up high.
      why: Clouds drift across the sky.
  lesson:
    - teach: Clouds float in the sky. Wind pushes them, so they move and change shape. A cloud can look like an elephant, then a rabbit, then a boat. Watching clouds is like a show in the sky.
      picture:
        kind: flow
        steps:
        - a cloud like an elephant
        - the wind blows
        - now it looks like a rabbit
        alt: A cloud changes shape as the wind blows.
      check:
        prompt: What makes clouds move across the sky?
        options:
        - the wind
        - the trees
        - the birds
        answer: the wind
        why: Wind pushes clouds along.
      ways:
      - style: step_by_step
        teach: 'Go cloud-watching. Step 1: Sit in a safe, open place. Step 2: Pick one cloud. Step 3: Say what it looks like to you. Step 4: Wait a few minutes, then look at the same cloud again.'
      - style: real_world
        teach: On a windy day, clouds race quickly across the sky. On a still day, they hardly seem to move at all.
    - teach: White, fluffy clouds come on sunny days. Dark grey clouds are heavy with water. They bring rain, and sometimes thunder and lightning.
      picture:
        kind: compare
        columns:
        - title: White clouds
          points:
          - sunny day
          - light and fluffy
        - title: Dark clouds
          points:
          - rain is coming
          - heavy with water
        alt: White fluffy clouds on sunny days; dark clouds bring rain.
      check:
        prompt: 'Dark grey clouds in the sky mean:'
        options:
        - rain may come
        - it will snow sweets
        - the sun is very hot
        answer: rain may come
        why: Dark clouds are full of water drops.
      ways:
      - style: step_by_step
        teach: 'Read the sky. Step 1: Look up. Step 2: Are the clouds white and fluffy? The day will probably stay fine. Step 3: Are they dark grey and low? Take an umbrella. Step 4: Do you hear thunder? Go indoors.'
      - style: real_world
        teach: In June, farmers watch the sky for dark clouds, because the monsoon brings the water their crops need to grow.
    - teach: 'Describing words tell how things are: fluffy, soft, white, dark, big, round. ''A big, fluffy cloud.'' Poems about clouds use rhymes like sky/high/fly.'
      check:
        prompt: Which word describes how a cloud looks?
        options:
        - fluffy
        - float
        - sky
        answer: fluffy
        why: Fluffy tells what the cloud is like.
      ways:
      - style: visual
        teach: Describing words, each used with a naming word.
        picture:
          kind: compare
          columns:
          - title: Describing word
            points:
            - round
            - tiny
            - shiny
          - title: Example
            points:
            - a round ball
            - a tiny ant
            - a shiny coin
          alt: 'Round, tiny and shiny are describing words: a round ball, a tiny ant, a shiny coin.'
      - style: step_by_step
        teach: 'Add a describing word. Step 1: Start with a naming word: ''kite''. Step 2: Ask: how does it look? Red. Step 3: Put it before the naming word: ''a red kite''. Step 4: Add one more: ''a big red kite''.'
  items:
  - prompt: Where do we see clouds?
    options:
    - in the sky
    - under the ground
    - in a box
    - in the sea
    answer: in the sky
    difficulty: 1
    hints:
    - Look up.
    - Up high.
    solution: Clouds are in the sky.
    mistakes: {"in the sea": "e1_rainbow_sky"}
  - prompt: 'Dark clouds often bring:'
    options:
    - rain
    - snowmen
    - sunshine
    - flowers
    answer: rain
    difficulty: 1
    hints:
    - Grey and heavy.
    - Take an umbrella.
    solution: Dark clouds bring rain.
    mistakes: {"sunshine": "v4_dark_clouds"}
  - prompt: 'Clouds can look like animals because they:'
    options:
    - change shape
    - are alive
    - can talk
    - eat grass
    answer: change shape
    difficulty: 2
    hints:
    - They move and change.
    - Imagination.
    solution: Clouds change shape, so we imagine animals.
    mistakes:
      are alive: eng2_read_again
  - prompt: Which is a describing word?
    options:
    - fluffy
    - cloud
    - sky
    - float
    answer: fluffy
    difficulty: 2
    hints:
    - It tells how something is.
    - Soft like cotton.
    solution: Fluffy is a describing word.
    mistakes:
      cloud: eng2_word
  - prompt: Which word rhymes with 'sky'?
    options:
    - high
    - rain
    - cloud
    - blue
    answer: high
    difficulty: 1
    hints:
    - End sound -igh / -y.
    - Say them aloud.
    solution: Sky and high rhyme.
    mistakes:
      blue: eng2_sound
  - prompt: What colour are clouds on a sunny day?
    options:
    - white
    - black
    - green
    - purple
    answer: white
    difficulty: 1
    hints:
    - Like cotton.
    - Bright.
    solution: On a sunny day clouds are white.
    mistakes: {"black": "e2_white_clouds"}
  - prompt: Why does a cloud look like a different animal after some time?
    options:
    - it changes shape
    - it turns into a real animal
    - it falls down
    answer: it changes shape
    difficulty: 1
    hints:
    - Clouds are not solid.
    - The wind keeps pushing them.
    solution: 'Step 1: Wind moves the cloud. Step 2: Its shape changes, so it looks like something new.'
    mistakes:
      it turns into a real animal: c2e8_cloud
      it falls down: c2e8_cloud
  - prompt: Which word rhymes with 'high'?
    options:
    - fly
    - hat
    - cloud
    answer: fly
    difficulty: 1
    hints:
    - High ends with an 'eye' sound.
    - Which word ends the same way?
    solution: 'Step 1: High ends with the ''eye'' sound. Step 2: Fly ends with it too.'
    mistakes:
      hat: c2e8_rhyme
      cloud: c2e8_rhyme
  - prompt: 'We see clouds when we look:'
    options:
    - up
    - down
    - under the bed
    answer: up
    difficulty: 1
    hints:
    - Clouds are in the sky.
    - Where is the sky?
    solution: 'Step 1: Clouds are in the sky. Step 2: We look up to see them.'
    mistakes:
      down: c2e8_cloud
      under the bed: c2e8_cloud
  - prompt: Which is a describing word in 'a soft white cloud'?
    options:
    - soft
    - cloud
    - a
    answer: soft
    difficulty: 1
    hints:
    - Which word tells how it feels?
    - Cloud is the thing itself.
    solution: 'Step 1: Cloud is a naming word. Step 2: Soft (and white) describe it.'
    mistakes:
      cloud: c2e8_desc
      a: c2e8_desc
  - prompt: 'Rain falls from:'
    options:
    - clouds
    - trees
    - mountains
    answer: clouds
    difficulty: 1
    hints:
    - Rain comes down from the sky.
    - What in the sky holds water?
    solution: 'Step 1: Clouds hold water drops. Step 2: The drops fall as rain.'
    mistakes:
      trees: c2e8_sky
      mountains: c2e8_sky
  - prompt: 'Before a big rain, the sky often becomes:'
    options:
    - dark
    - bright pink
    - very clear
    answer: dark
    difficulty: 2
    hints:
    - Think of clouds full of water.
    - The light goes dim.
    solution: 'Step 1: Heavy rain clouds cover the sky. Step 2: The sky becomes dark.'
    mistakes:
      bright pink: c2e8_cloud
      very clear: c2e8_cloud
  - prompt: Which sentence is make-believe?
    options:
    - A cloud ate my lunch.
    - Clouds float in the sky.
    - Dark clouds bring rain.
    answer: A cloud ate my lunch.
    difficulty: 2
    hints:
    - Two of these really happen.
    - Can a cloud eat?
    solution: 'Step 1: Clouds float and bring rain: true. Step 2: A cloud cannot eat, so that is make-believe.'
    mistakes:
      Clouds float in the sky.: c2e8_cloud
      Dark clouds bring rain.: c2e8_cloud
  - prompt: Which is the opposite of 'dark'?
    options:
    - light
    - black
    - night
    answer: light
    difficulty: 2
    hints:
    - Think of day and night.
    - Switch on a lamp and the room becomes ...
    solution: 'Step 1: Dark means without light. Step 2: The opposite is light.'
    mistakes:
      black: c2e8_desc
      night: c2e8_desc
  - prompt: A cloud first looks like a boat, then like a fish. What happened in between?
    options:
    - "the wind changed its shape"
    - "a fisher caught it in a net"
    - "it went to sleep for a while"
    answer: the wind changed its shape
    difficulty: 3
    hints:
    - Clouds keep moving.
    - What pushes them?
    solution: 'Step 1: The wind pushes the cloud. Step 2: Its shape changed from a boat to a fish.'
    mistakes:
      "a fisher caught it in a net": c2e8_cloud
      "it went to sleep for a while": c2e8_cloud
  - prompt: 'Case: In the morning the sky is blue, with a few white clouds. By afternoon the clouds are dark grey and the wind is strong. What is most likely to happen soon?'
    options:
    - It will rain.
    - It will snow on the beach.
    - The sun will get hotter.
    answer: It will rain.
    hints:
    - What colour did the clouds turn?
    - What do dark grey clouds carry?
    solution: Dark grey clouds are heavy with water, so rain is likely to come soon.
    mistakes:
      It will snow on the beach.: c2e8_sky
      The sun will get hotter.: c2e8_sky
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing a poem. Line 1: ''I see a cloud as white as snow.'' Line 2: ''The wind will push it, off we ___.'' Which word fits and rhymes?'
    options:
    - go
    - run
    - stop
    answer: go
    hints:
    - Say 'snow' slowly. What is its end sound?
    - Which word ends with the same sound?
    solution: '''Snow'' and ''go'' end with the same sound, so they rhyme, and ''off we go'' makes sense.'
    mistakes:
      run: c2e8_rhyme
      stop: c2e8_rhyme
    exam: competency
    difficulty: 2
