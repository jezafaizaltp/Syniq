# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 8. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 8
title: 'A Show of Clouds (Unit 4: Life Around Us)'
concepts:
- code: cbse2e.u4.clouds
  title: 'A Show of Clouds (Unit 4: Life Around Us)'
  notes: |
    A poem about clouds in the sky that look like animals and things, and change shape as they move. Exact lines are
    not reproduced here; questions focus on clouds, rain, imagination and describing words.
  explanations:
    text: Clouds float in the sky and keep changing shape. One looks like an elephant, another like a ship. Dark clouds bring rain.
    visual: 'Draw three clouds: one shaped like an elephant, one like a fish and one dark rain cloud.'
    step_by_step: 1. Read the poem aloud. 2. What shapes did the clouds make? 3. What happens when clouds are dark? 4. Find describing words.
    real_world: On a windy day, lie on the grass and watch the cloud shapes change.
  picture:
    kind: flow
    steps:
    - White cloud
    - Changes shape
    - Turns dark
    - Rain falls
    alt: A white cloud changes shape, turns dark, and rain falls.
  items:
  - prompt: Where do we see clouds?
    options:
    - in the sky
    - under the ground
    - in a box
    - in the sea
    answer: in the sky
    difficulty: 1
    hints:
    - Look up.
    - Up high.
    solution: Clouds are in the sky.
  - prompt: 'Dark clouds often bring:'
    options:
    - rain
    - snowmen
    - sunshine
    - flowers
    answer: rain
    difficulty: 1
    hints:
    - Grey and heavy.
    - Take an umbrella.
    solution: Dark clouds bring rain.
  - prompt: 'Clouds can look like animals because they:'
    options:
    - change shape
    - are alive
    - can talk
    - eat grass
    answer: change shape
    difficulty: 2
    hints:
    - They move and change.
    - Imagination.
    solution: Clouds change shape, so we imagine animals.
    mistakes:
      are alive: eng2_read_again
  - prompt: Which is a describing word?
    options:
    - fluffy
    - cloud
    - sky
    - float
    answer: fluffy
    difficulty: 2
    hints:
    - It tells how something is.
    - Soft like cotton.
    solution: Fluffy is a describing word.
    mistakes:
      cloud: eng2_word
  - prompt: Which word rhymes with 'sky'?
    options:
    - high
    - rain
    - cloud
    - blue
    answer: high
    difficulty: 1
    hints:
    - End sound -igh / -y.
    - Say them aloud.
    solution: Sky and high rhyme.
    mistakes:
      blue: eng2_sound
  - prompt: What colour are clouds on a sunny day?
    options:
    - white
    - black
    - green
    - purple
    answer: white
    difficulty: 1
    hints:
    - Like cotton.
    - Bright.
    solution: On a sunny day clouds are white.
