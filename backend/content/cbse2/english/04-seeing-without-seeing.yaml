# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 4. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 4
title: 'Seeing without Seeing (Unit 2: Welcome to My World)'
tips:
  c2e4_count: "Count only the senses named in the question."
  e2_braille: "Braille is raised dots that you feel."
  e2_hear: "Which part of your head do you cover when it's too loud?"
  e2_include: "Everyone likes to play. How can we make sure our friend can join in?"
  e2_senses: "See, hear, smell, taste, touch. Count them."
  e2_smell: "Which part of your face sniffs a flower?"
  c2e4_sense: Point to the body part you would use. Which one does this job?
  c2e4_kind: 'Think: how would you like a friend to treat you?'

concepts:
- code: cbse2e.u2.seeing
  title: 'Seeing without Seeing (Unit 2: Welcome to My World)'
  notes: |
    A story about a child who cannot see with the eyes but knows the world through touch, smell, sound and taste.
    Exact story details are not reproduced here; questions focus on the five senses, respect and including everyone.
  explanations:
    text: This story is about a child who cannot see with the eyes, but knows the world through touch, smell, sound and taste. We all have five senses, and each one helps us know things.
    visual: 'Draw five boxes: eye, ear, nose, tongue and hand, and one thing each one tells us.'
    step_by_step: 1. Read the story. 2. How does the child know things? 3. Name the senses. 4. How can we help and include everyone?
    real_world: Some people read with their fingers using Braille, a writing made of raised dots.
  picture:
    kind: compare
    columns:
    - title: Sense
      points:
      - hear
      - smell
      - touch
    - title: Body part
      points:
      - ears
      - nose
      - hands, skin
    alt: We hear with our ears, smell with our nose, and touch with our hands and skin.
  activity:
    type: sort
    prompt: 'Seeing without Seeing: which sense?'
    bins:
    - Touch
    - Smell
    - Hearing
    - Taste
    items:
    - label: A soft cat's fur
      bin: Touch
      clue: With your hands.
      why: Soft fur is felt by touch.
    - label: Flowers in the garden
      bin: Smell
      clue: With your nose.
      why: Flowers are known by their smell.
    - label: A bird singing
      bin: Hearing
      clue: With your ears.
      why: Songs are heard.
    - label: Sweet mango
      bin: Taste
      clue: With your tongue.
      why: Sweetness is tasted.
    - label: Rain on the roof
      bin: Hearing
      clue: Pitter-patter.
      why: The sound of rain is heard.
  lesson:
    - teach: We have five senses. We see with our eyes, hear with our ears, smell with our nose, taste with our tongue and touch with our skin and fingers.
      picture:
        kind: flow
        steps:
        - 'eyes: see'
        - 'ears: hear'
        - 'nose: smell'
        - 'tongue: taste'
        - 'skin: touch'
        alt: The five senses and the body part for each.
      check:
        prompt: 'We taste food with our:'
        options:
        - tongue
        - ears
        - eyes
        answer: tongue
        why: The tongue tells us sweet, salty, sour or bitter.
    - teach: A child who cannot see with the eyes still knows the world. The child hears a bus coming, smells flowers, feels the shape of a cup and tastes a mango. The other senses help a lot.
      check:
        prompt: Without seeing, how can we know a bell is ringing?
        options:
        - by hearing it
        - by tasting it
        - by smelling it
        answer: by hearing it
        why: A ringing bell makes a sound, and ears hear sounds.
    - teach: People who cannot see can read with their fingers. Braille is writing made of small raised dots. Everyone can learn, play and have fun. We include everyone and help when they ask.
      check:
        prompt: 'Braille is made of small raised:'
        options:
        - dots
        - pictures
        - colours
        answer: dots
        why: Fingers feel the raised dots to read.
  items:
  - prompt: 'We smell with our:'
    options:
    - nose
    - ears
    - eyes
    - feet
    answer: nose
    difficulty: 1
    hints:
    - Flowers and food.
    - On our face.
    solution: We smell with our nose.
    mistakes: {"ears": "e2_smell"}
  - prompt: 'We hear with our:'
    options:
    - ears
    - nose
    - hands
    - tongue
    answer: ears
    difficulty: 1
    hints:
    - Music and voices.
    - On both sides of the head.
    solution: We hear with our ears.
    mistakes: {"nose": "e2_hear"}
  - prompt: How can we know a mango without seeing it?
    options:
    - by its smell and taste
    - we cannot
    - by its colour
    - by its picture
    answer: by its smell and taste
    difficulty: 2
    hints:
    - Use other senses.
    - Nose and tongue.
    solution: We can smell and taste a mango.
    mistakes:
      we cannot: eng2_read_again
  - prompt: How many senses do we have?
    options:
    - five
    - two
    - ten
    - one
    answer: five
    difficulty: 1
    hints:
    - See, hear, smell, taste, touch.
    - Count them.
    solution: We have five senses.
    mistakes: {"two": "e2_senses"}
  - prompt: 'Braille is read with the:'
    options:
    - fingers
    - ears
    - nose
    - tongue
    answer: fingers
    difficulty: 2
    hints:
    - Raised dots.
    - Touch.
    solution: Braille is read by touching dots with the fingers.
    mistakes: {"ears": "e2_braille"}
  - prompt: 'A friend who cannot see wants to play. We should:'
    options:
    - play together and help
    - leave them out
    - laugh at them
    - run away
    answer: play together and help
    difficulty: 1
    hints:
    - Be kind.
    - Everyone belongs.
    solution: We play together and help.
    mistakes: {"leave them out": "e2_include"}
  - prompt: 'We see with our:'
    options:
    - eyes
    - nose
    - hands
    answer: eyes
    difficulty: 1
    hints:
    - Close them and everything goes dark.
    - They are on your face, above your nose.
    solution: 'Step 1: Seeing needs light to come in. Step 2: Our eyes let us see.'
    mistakes:
      nose: c2e4_sense
      hands: c2e4_sense
  - prompt: How can you tell a ball is round with your eyes shut?
    options:
    - by touching it
    - by smelling it
    - by tasting it
    answer: by touching it
    difficulty: 1
    hints:
    - Shape can be felt.
    - Use your hands.
    solution: 'Step 1: Our fingers feel shapes. Step 2: Touch tells us the ball is round.'
    mistakes:
      by smelling it: c2e4_sense
      by tasting it: c2e4_sense
  - prompt: Which sense tells you a flower is sweet-smelling?
    options:
    - smell
    - hearing
    - sight
    answer: smell
    difficulty: 1
    hints:
    - Which part of your face goes near a flower?
    - Sniff!
    solution: 'Step 1: The nose takes in the scent. Step 2: That is the sense of smell.'
    mistakes:
      hearing: e2_smell
      sight: e2_smell
  - prompt: A dog barks behind you. Which sense tells you it is there?
    options:
    - hearing
    - taste
    - touch
    answer: hearing
    difficulty: 1
    hints:
    - A bark is a sound.
    - Which part of you takes in sounds?
    solution: 'Step 1: Barking is a sound. Step 2: Our ears hear it.'
    mistakes:
      taste: e2_hear
      touch: e2_hear
  - prompt: Which tastes sour?
    options:
    - lemon
    - sugar
    - water
    answer: lemon
    difficulty: 2
    hints:
    - Sour makes your face scrunch up.
    - Think of a small yellow fruit.
    solution: 'Step 1: Sugar is sweet, water has no taste. Step 2: A lemon is sour.'
    mistakes:
      sugar: c2e4_sense
      water: c2e4_sense
  - prompt: A classmate who cannot see is new in class. What is kind?
    options:
    - say your name and offer to show the way
    - move their bag and hide it
    - leave them alone at play time
    answer: say your name and offer to show the way
    difficulty: 2
    hints:
    - How would they know who is talking?
    - Being friendly means including.
    solution: 'Step 1: Telling your name helps them know you. Step 2: Offering to help makes them welcome.'
    mistakes:
      move their bag and hide it: c2e4_kind
      leave them alone at play time: c2e4_kind
  - prompt: Which two senses help you know an orange without looking?
    options:
    - smell and taste
    - sight and hearing
    - only hearing
    answer: smell and taste
    difficulty: 2
    hints:
    - An orange is not noisy.
    - Think of peeling and eating it.
    solution: 'Step 1: An orange has a strong smell. Step 2: It also has its own taste.'
    mistakes:
      sight and hearing: c2e4_sense
      only hearing: c2e4_sense
  - prompt: 'People who use Braille read with their:'
    options:
    - fingertips
    - ears
    - nose
    answer: fingertips
    difficulty: 2
    hints:
    - Braille dots stand up from the paper.
    - What can feel small bumps?
    solution: 'Step 1: Braille has raised dots. Step 2: Fingertips feel them to read.'
    mistakes:
      ears: e2_braille
      nose: e2_braille
  - prompt: A cake is smelled, touched and tasted. How many senses is that?
    options:
    - three
    - two
    - five
    answer: three
    difficulty: 3
    hints:
    - Count each sense named.
    - Smell, touch, taste.
    solution: 'Step 1: smell, touch, taste. Step 2: That is 3 senses.'
    mistakes:
      two: c2e4_count
      five: c2e4_count
