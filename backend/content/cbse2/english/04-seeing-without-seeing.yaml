# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 4. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 4
title: 'Seeing without Seeing (Unit 2: Welcome to My World)'
tips:
  e2_braille: "Braille is raised dots that you feel."
  e2_hear: "Which part of your head do you cover when it's too loud?"
  e2_include: "Everyone likes to play. How can we make sure our friend can join in?"
  e2_senses: "See, hear, smell, taste, touch. Count them."
  e2_smell: "Which part of your face sniffs a flower?"

concepts:
- code: cbse2e.u2.seeing
  title: 'Seeing without Seeing (Unit 2: Welcome to My World)'
  notes: |
    A story about a child who cannot see with the eyes but knows the world through touch, smell, sound and taste.
    Exact story details are not reproduced here; questions focus on the five senses, respect and including everyone.
  explanations:
    text: This story is about a child who cannot see with the eyes, but knows the world through touch, smell, sound and taste. We all have five senses, and each one helps us know things.
    visual: 'Draw five boxes: eye, ear, nose, tongue and hand, and one thing each one tells us.'
    step_by_step: 1. Read the story. 2. How does the child know things? 3. Name the senses. 4. How can we help and include everyone?
    real_world: Some people read with their fingers using Braille, a writing made of raised dots.
  picture:
    kind: compare
    columns:
    - title: Sense
      points:
      - hear
      - smell
      - touch
    - title: Body part
      points:
      - ears
      - nose
      - hands, skin
    alt: We hear with our ears, smell with our nose, and touch with our hands and skin.
  activity:
    type: sort
    prompt: 'Seeing without Seeing: which sense?'
    bins:
    - Touch
    - Smell
    - Hearing
    - Taste
    items:
    - label: A soft cat's fur
      bin: Touch
      clue: With your hands.
      why: Soft fur is felt by touch.
    - label: Flowers in the garden
      bin: Smell
      clue: With your nose.
      why: Flowers are known by their smell.
    - label: A bird singing
      bin: Hearing
      clue: With your ears.
      why: Songs are heard.
    - label: Sweet mango
      bin: Taste
      clue: With your tongue.
      why: Sweetness is tasted.
    - label: Rain on the roof
      bin: Hearing
      clue: Pitter-patter.
      why: The sound of rain is heard.
  items:
  - prompt: 'We smell with our:'
    options:
    - nose
    - ears
    - eyes
    - feet
    answer: nose
    difficulty: 1
    hints:
    - Flowers and food.
    - On our face.
    solution: We smell with our nose.
    mistakes: {"ears": "e2_smell"}
  - prompt: 'We hear with our:'
    options:
    - ears
    - nose
    - hands
    - tongue
    answer: ears
    difficulty: 1
    hints:
    - Music and voices.
    - On both sides of the head.
    solution: We hear with our ears.
    mistakes: {"nose": "e2_hear"}
  - prompt: How can we know a mango without seeing it?
    options:
    - by its smell and taste
    - we cannot
    - by its colour
    - by its picture
    answer: by its smell and taste
    difficulty: 2
    hints:
    - Use other senses.
    - Nose and tongue.
    solution: We can smell and taste a mango.
    mistakes:
      we cannot: eng2_read_again
  - prompt: How many senses do we have?
    options:
    - five
    - two
    - ten
    - one
    answer: five
    difficulty: 1
    hints:
    - See, hear, smell, taste, touch.
    - Count them.
    solution: We have five senses.
    mistakes: {"two": "e2_senses"}
  - prompt: 'Braille is read with the:'
    options:
    - fingers
    - ears
    - nose
    - tongue
    answer: fingers
    difficulty: 2
    hints:
    - Raised dots.
    - Touch.
    solution: Braille is read by touching dots with the fingers.
    mistakes: {"ears": "e2_braille"}
  - prompt: 'A friend who cannot see wants to play. We should:'
    options:
    - play together and help
    - leave them out
    - laugh at them
    - run away
    answer: play together and help
    difficulty: 1
    hints:
    - Be kind.
    - Everyone belongs.
    solution: We play together and help.
    mistakes: {"leave them out": "e2_include"}
