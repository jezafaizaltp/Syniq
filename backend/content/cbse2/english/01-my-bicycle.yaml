# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 1. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 1
title: 'My Bicycle (Unit 1: Fun with Friends)'
tips:
  c2e1_bellact: "What do you do to a bell to make it sound?"
  c2e1_count: "Count the wheels on one bicycle, then on the other."
  eng2_read_again: Look at the lesson again. The answer is there.
  eng2_word: Say the word in a little sentence. Does it make sense?
  eng2_sound: Say both words aloud slowly. Listen to the end sound.
  e2_bell: "Which part do you press to warn people?"
  e2_i_verb: "With 'I', we don't add -s: I play, I eat, I ..."
  e2_ride_safe: "Riding needs you to watch the road and hold on."
  c2e1_part: Picture a bicycle in your mind. Which part does this job?
  c2e1_rhyme: Say both words aloud. Do the last sounds match?
  c2e1_safe: 'Ask: which choice keeps the rider and others from getting hurt?'
concepts:
- code: cbse2e.u1.bicycle
  title: 'My Bicycle (Unit 1: Fun with Friends)'
  notes: |
    A poem about a child's bicycle and the fun of riding it: the bell, the wheels, riding with friends. Exact lines are
    not reproduced here; questions focus on parts of a bicycle, safe riding, rhyming words and naming words.
  explanations:
    text: This poem is about a child who loves riding a bicycle. The bell goes ring-ring, the wheels go round and round, and riding with friends is fun.
    visual: 'Draw a bicycle and label: bell, wheels, seat, handle.'
    step_by_step: 1. Read the poem aloud. 2. Find the parts of the bicycle. 3. Find words that rhyme. 4. Talk about riding safely.
    real_world: Many children ride bicycles to school or in the park in the evening.
  picture:
    kind: compare
    columns:
    - title: Part
      points:
      - bell
      - wheels
      - seat
    - title: What it does
      points:
      - rings to warn
      - go round
      - you sit on it
    alt: The bell rings to warn people, the wheels go round, and you sit on the seat.
  activity:
    type: sort
    prompt: 'My Bicycle: part of a bicycle or not?'
    bins:
    - Part of a bicycle
    - Not a part
    items:
    - label: 🔔 Bell
      bin: Part of a bicycle
      clue: Goes 'tring tring'.
      why: The bell is on the handle.
    - label: ⭕ Wheels
      bin: Part of a bicycle
      clue: It has two.
      why: A bicycle has two wheels.
    - label: 🪟 Window
      bin: Not a part
      clue: Is it on a bicycle?
      why: A bicycle has no windows.
    - label: Pedals
      bin: Part of a bicycle
      clue: Your feet push them.
      why: Pedals make it move.
    - label: 🚪 Door
      bin: Not a part
      clue: Cars have these.
      why: Bicycles have no doors.
  lesson:
    - teach: A bicycle has parts. Two wheels roll on the road. We hold the handle to steer. We push the pedals with our feet. We ring the bell so people know we are coming. We sit on the seat.
      picture:
        kind: flow
        steps:
        - sit on the seat
        - hold the handle
        - push the pedals
        - ring the bell
        alt: 'Riding a bicycle: sit, hold the handle, push the pedals, ring the bell.'
      check:
        prompt: Which part of a bicycle do our feet push?
        options:
        - the pedals
        - the bell
        - the handle
        answer: the pedals
        why: Our feet push the pedals round and the wheels turn.
      ways:
      - style: step_by_step
        teach: 'Check your bicycle before a ride. Step 1: Press the tyres: are they hard? Step 2: Ring the bell: does it work? Step 3: Squeeze the brakes: do they stop the wheels? Step 4: Now you are ready to go.'
      - style: real_world
        teach: A tricycle for small children has three wheels, so it does not fall over. A scooter has an engine, so the rider does not need to push any pedals.
    - teach: 'Poems use rhyming words. Rhyming words end with the same sound: bike, like, hike. Ring, sing, king. Wheel, feel, meal.'
      check:
        prompt: Which word rhymes with 'ring'?
        options:
        - sing
        - road
        - bell
        answer: sing
        why: Ring and sing both end with 'ing'.
      ways:
      - style: visual
        teach: Some short words, and the words that rhyme with each of them.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - cake
            - boat
            - hen
          - title: Rhymes with it
            points:
            - lake, make
            - coat, goat
            - pen, ten
          alt: Cake rhymes with lake and make. Boat rhymes with coat and goat. Hen rhymes with pen and ten.
      - style: step_by_step
        teach: 'Find a rhyme for ''seat''. Step 1: Say ''seat'' slowly. Step 2: Listen to the end sound: ''-eat''. Step 3: Try words with that end: feet, meet, heat. Step 4: Say each one next to ''seat'' to check.'
    - teach: We ride safely. We ride slowly near people, ring the bell before a turn, look both ways, and wear a helmet. Riding with friends is fun when everyone is safe.
      check:
        prompt: What do we wear on our head when we ride?
        options:
        - a helmet
        - a cap made of paper
        - nothing
        answer: a helmet
        why: A helmet keeps the head safe if we fall.
      ways:
      - style: visual
        teach: Safe and unsafe ways to ride a bicycle on the road.
        picture:
          kind: compare
          columns:
          - title: Safe
            points:
            - Wear a helmet
            - Ride slowly near people
            - Look both ways at a road
          - title: Not safe
            points:
            - Ride in the dark with no light
            - Carry a friend on the handle
            - Race on a busy road
          alt: Wearing a helmet, riding slowly near people and looking both ways at a road are safe. Riding in the dark with no light, carrying a friend on the handle and racing on a busy road are not safe.
      - style: real_world
        teach: Some cities paint special cycle lanes on the road. Riders often wear bright clothes, so that drivers can see them from far away.
  items:
  - prompt: How many wheels does a bicycle have?
    options:
    - two
    - three
    - four
    - one
    answer: two
    difficulty: 1
    hints:
    - Bi means two.
    - Front and back.
    solution: A bicycle has two wheels.
    mistakes:
      four: eng2_read_again
  - prompt: What goes 'ring-ring' on a bicycle?
    options:
    - the bell
    - the seat
    - the wheel
    - the chain
    answer: the bell
    difficulty: 1
    hints:
    - It makes a sound.
    - To warn people.
    solution: The bell goes ring-ring.
    mistakes: {"the wheel": "e2_bell"}
  - prompt: Which word rhymes with 'bike'?
    options:
    - like
    - bell
    - road
    - ride
    answer: like
    difficulty: 2
    hints:
    - 'Same end sound: -ike.'
    - Say them aloud.
    solution: Bike and like rhyme.
    mistakes:
      ride: eng2_sound
  - prompt: 'When we ride a bicycle, we should:'
    options:
    - ride carefully
    - close our eyes
    - ride on the wrong side
    - let go of the handle
    answer: ride carefully
    difficulty: 1
    hints:
    - Stay safe.
    - Look at the road.
    solution: We should ride carefully.
    mistakes: {"close our eyes": "e2_ride_safe"}
  - prompt: Which is a naming word?
    options:
    - bicycle
    - ride
    - fast
    - happy
    answer: bicycle
    difficulty: 2
    hints:
    - It is a thing.
    - You can touch it.
    solution: Bicycle is a naming word.
    mistakes:
      ride: eng2_word
  - prompt: 'Choose the right word: I ___ my bicycle.'
    options:
    - ride
    - rides
    - riding
    - rode is
    answer: ride
    difficulty: 2
    hints:
    - With 'I' we say ...
    - I ride.
    solution: I ride my bicycle.
    mistakes: {"rides": "e2_i_verb"}
  - prompt: 'We steer a bicycle with the:'
    options:
    - handle
    - bell
    - seat
    answer: handle
    difficulty: 1
    hints:
    - Your hands hold this part.
    - Turn it left or right to turn.
    solution: 'Step 1: Hands hold the front part. Step 2: The handle turns the bicycle.'
    mistakes:
      bell: c2e1_part
      seat: c2e1_part
  - prompt: Where do we sit on a bicycle?
    options:
    - on the seat
    - on the wheel
    - on the bell
    answer: on the seat
    difficulty: 1
    hints:
    - It is soft and on top.
    - It is between the handle and the back wheel.
    solution: 'Step 1: We need a place to sit. Step 2: That is the seat.'
    mistakes:
      on the wheel: c2e1_part
      on the bell: c2e1_part
  - prompt: Which word rhymes with 'wheel'?
    options:
    - feel
    - wall
    - road
    answer: feel
    difficulty: 1
    hints:
    - Say 'wheel' slowly. Listen to the end.
    - Which word ends with 'eel'?
    solution: 'Step 1: Wheel ends with ''eel''. Step 2: Feel ends with ''eel'' too.'
    mistakes:
      wall: c2e1_rhyme
      road: c2e1_rhyme
  - prompt: 'Before turning a corner on a bicycle, we should:'
    options:
    - "ring the bell and go slowly"
    - "go as fast as we can"
    - "close our eyes and turn"
    answer: ring the bell and go slowly
    difficulty: 1
    hints:
    - Someone may be walking round the corner.
    - How can they know you are coming?
    solution: 'Step 1: People may be near the corner. Step 2: Ring the bell and slow down.'
    mistakes:
      "go as fast as we can": c2e1_safe
      "close our eyes and turn": c2e1_safe
  - prompt: Which is a naming word in 'The red bicycle has a bell'?
    options:
    - bell
    - red
    - has
    answer: bell
    difficulty: 2
    hints:
    - A naming word names a thing.
    - Which word can you touch?
    solution: 'Step 1: ''Red'' tells colour, ''has'' is a doing word. Step 2: ''Bell'' names a thing.'
    mistakes:
      red: eng2_word
      has: eng2_word
  - prompt: A bicycle has 2 wheels. How many wheels do 2 bicycles have?
    options:
    - four
    - two
    - three
    answer: four
    difficulty: 2
    hints:
    - Count the wheels of one, then the other.
    - 2 and 2.
    solution: 'Step 1: Each bicycle has 2. Step 2: 2 + 2 = 4 wheels.'
    mistakes:
      two: c2e1_count
      three: c2e1_count
  - prompt: 'Choose the right word: Riya ___ the bell. Ring-ring!'
    options:
    - rings
    - sleeps
    - eats
    answer: rings
    difficulty: 2
    hints:
    - What do we do with a bell?
    - The sound is ring-ring.
    solution: 'Step 1: A bell makes a sound when we press it. Step 2: Riya rings the bell.'
    mistakes:
      sleeps: c2e1_bellact
      eats: c2e1_bellact
  - prompt: Which is NOT safe on a bicycle?
    options:
    - riding with no hands
    - wearing a helmet
    - riding slowly near people
    answer: riding with no hands
    difficulty: 2
    hints:
    - Two of these keep you safe.
    - Which one could make you fall?
    solution: 'Step 1: A helmet and riding slowly are safe. Step 2: Riding with no hands can make us fall.'
    mistakes:
      wearing a helmet: c2e1_safe
      riding slowly near people: c2e1_safe
  - prompt: 'Put in order: (1) push the pedals (2) sit on the seat (3) the wheels turn. What comes first?'
    options:
    - sit on the seat
    - push the pedals
    - the wheels turn
    answer: sit on the seat
    difficulty: 3
    hints:
    - What do you do before you can ride?
    - You cannot pedal standing beside the bike.
    solution: 'Step 1: First we sit. Step 2: Then we push the pedals and the wheels turn.'
    mistakes:
      push the pedals: c2e1_part
      the wheels turn: c2e1_part
  - prompt: 'Case: Arun wants to ride a bicycle to the shop in the evening, when it is getting dark. The bell is broken and there is no light. What should Arun do first?'
    options:
    - Get the bell and light fixed before riding
    - Ride fast to get there before dark
    - Ride anyway without the bell
    answer: Get the bell and light fixed before riding
    hints:
    - How will people know a rider is coming?
    - How will drivers see a rider in the dark?
    solution: The bell tells people a rider is coming, and a light helps others see the rider in the dark. They should be fixed before the ride.
    mistakes:
      Ride fast to get there before dark: c2e1_safe
      Ride anyway without the bell: c2e1_safe
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing a poem about your bicycle. The first line ends with the word ''ride''. Which word could end the next line so the two lines rhyme?'
    options:
    - side
    - bell
    - road
    answer: side
    hints:
    - Say 'ride' slowly. What is its end sound?
    - Which word ends with that same sound?
    solution: '''Ride'' and ''side'' both end with the sound ''-ide'', so they rhyme.'
    mistakes:
      bell: c2e1_rhyme
      road: c2e1_rhyme
    exam: competency
    difficulty: 2
