# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 1. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 1
title: 'My Bicycle (Unit 1: Fun with Friends)'
tips:
  eng2_read_again: Look at the lesson again. The answer is there.
  eng2_word: Say the word in a little sentence. Does it make sense?
  eng2_sound: Say both words aloud slowly. Listen to the end sound.
concepts:
- code: cbse2e.u1.bicycle
  title: 'My Bicycle (Unit 1: Fun with Friends)'
  notes: |
    A poem about a child's bicycle and the fun of riding it: the bell, the wheels, riding with friends. Exact lines are
    not reproduced here; questions focus on parts of a bicycle, safe riding, rhyming words and naming words.
  explanations:
    text: This poem is about a child who loves riding a bicycle. The bell goes ring-ring, the wheels go round and round, and riding with friends is fun.
    visual: 'Draw a bicycle and label: bell, wheels, seat, handle.'
    step_by_step: 1. Read the poem aloud. 2. Find the parts of the bicycle. 3. Find words that rhyme. 4. Talk about riding safely.
    real_world: Many children ride bicycles to school or in the park in the evening.
  picture:
    kind: compare
    columns:
    - title: Part
      points:
      - bell
      - wheels
      - seat
    - title: What it does
      points:
      - rings to warn
      - go round
      - you sit on it
    alt: The bell rings to warn people, the wheels go round, and you sit on the seat.
  items:
  - prompt: How many wheels does a bicycle have?
    options:
    - two
    - three
    - four
    - one
    answer: two
    difficulty: 1
    hints:
    - Bi means two.
    - Front and back.
    solution: A bicycle has two wheels.
    mistakes:
      four: eng2_read_again
  - prompt: What goes 'ring-ring' on a bicycle?
    options:
    - the bell
    - the seat
    - the wheel
    - the chain
    answer: the bell
    difficulty: 1
    hints:
    - It makes a sound.
    - To warn people.
    solution: The bell goes ring-ring.
  - prompt: Which word rhymes with 'bike'?
    options:
    - like
    - bell
    - road
    - ride
    answer: like
    difficulty: 2
    hints:
    - 'Same end sound: -ike.'
    - Say them aloud.
    solution: Bike and like rhyme.
    mistakes:
      ride: eng2_sound
  - prompt: 'When we ride a bicycle, we should:'
    options:
    - ride carefully
    - close our eyes
    - ride on the wrong side
    - let go of the handle
    answer: ride carefully
    difficulty: 1
    hints:
    - Stay safe.
    - Look at the road.
    solution: We should ride carefully.
  - prompt: Which is a naming word?
    options:
    - bicycle
    - ride
    - fast
    - happy
    answer: bicycle
    difficulty: 2
    hints:
    - It is a thing.
    - You can touch it.
    solution: Bicycle is a naming word.
    mistakes:
      ride: eng2_word
  - prompt: 'Choose the right word: I ___ my bicycle.'
    options:
    - ride
    - rides
    - riding
    - rode is
    answer: ride
    difficulty: 2
    hints:
    - With 'I' we say ...
    - I ride.
    solution: I ride my bicycle.
