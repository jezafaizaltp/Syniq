concepts:
- code: cbse2e.u4.crow
  title: 'The Crow (Unit 4: Life Around Us)'
  notes: |
    A poem or lesson about the crow: a common black bird that caws, is clever and keeps surroundings clean by eating
    scraps. Exact lines are not reproduced here; questions focus on birds, their sounds and describing words.
  explanations:
    text: The crow is a black bird we see every day. It says 'caw-caw'. Crows are clever and they eat leftover food, which helps keep places clean.
    visual: Draw a black crow on a branch with a speech bubble 'caw-caw'.
    step_by_step: 1. Read the lesson aloud. 2. What does the crow look like? 3. What sound does it make? 4. What does it eat?
    real_world: Crows sit on wires and walls in towns and villages all over India.
  picture:
    kind: compare
    columns:
    - title: Bird
      points:
      - crow
      - parrot
      - peacock
    - title: Colour
      points:
      - black
      - green
      - blue and green
    alt: The crow is black, the parrot is green and the peacock is blue and green.
  activity:
    type: sort
    prompt: 'The Crow: which bird sound?'
    bins:
    - Caw
    - Coo
    - Quack
    - Cock-a-doodle-doo
    items:
    - label: Crow
      bin: Caw
      clue: Black and clever.
      why: Crows say caw caw.
    - label: Pigeon
      bin: Coo
      clue: Grey bird.
      why: Pigeons coo.
    - label: Duck
      bin: Quack
      clue: Swims.
      why: Ducks quack.
    - label: Rooster
      bin: Cock-a-doodle-doo
      clue: Wakes you up.
      why: Roosters crow in the morning.
  items:
  - prompt: What colour is a crow?
    options:
    - black
    - white
    - pink
    - yellow
    answer: black
    difficulty: 1
    hints:
    - Dark.
    - Like the night.
    solution: A crow is black.
    mistakes: {"white": "e2_crow_colour"}
  - prompt: 'A crow says:'
    options:
    - caw-caw
    - moo
    - meow
    - quack
    answer: caw-caw
    difficulty: 1
    hints:
    - Bird sound.
    - Loud.
    solution: A crow says caw-caw.
    mistakes: {"quack": "e2_crow_sound"}
  - prompt: 'A crow has two:'
    options:
    - wings
    - tails
    - trunks
    - horns
    answer: wings
    difficulty: 1
    hints:
    - It flies.
    - Birds have them.
    solution: A crow has two wings.
    mistakes: {"tails": "e2_wings"}
  - prompt: Which bird can talk back like us?
    options:
    - parrot
    - crow
    - sparrow
    - hen
    answer: parrot
    difficulty: 2
    hints:
    - A green bird.
    - It copies words.
    solution: A parrot can copy words.
    mistakes: {"crow": "e2_parrot"}
  - prompt: Which is a describing word for a crow?
    options:
    - clever
    - fly
    - branch
    - eat
    answer: clever
    difficulty: 2
    hints:
    - Tells how the crow is.
    - Smart.
    solution: Clever describes the crow.
    mistakes:
      fly: eng2_word
  - prompt: 'A bird lives in a:'
    options:
    - nest
    - kennel
    - stable
    - den
    answer: nest
    difficulty: 1
    hints:
    - Made of twigs.
    - In a tree.
    solution: A bird lives in a nest.
    mistakes: {"kennel": "e2_nest"}
