# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 10. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 10
title: 'The Crow (Unit 4: Life Around Us)'
tips:
  e2_crow_colour: "A crow is the colour of the night sky."
  e2_crow_sound: "Quack is a duck. Say the crow's call out loud: it sounds harsh."
  e2_nest: "A kennel is a dog's house. A bird's home is made of twigs."
  e2_parrot: "Which bird is famous for copying the words it hears?"
  e2_wings: "Birds fly with these."
  c2e10_many: "One, or more than one? Then look at how the word ends."
  c2e10_bird: Think of a bird you see near your home. What does it have and do?
  c2e10_sound: Each animal has its own sound. Make the sound in your head.
  c2e10_desc: A describing word tells what something is like.

concepts:
- code: cbse2e.u4.crow
  title: 'The Crow (Unit 4: Life Around Us)'
  notes: |
    A poem or lesson about the crow: a common black bird that caws, is clever and keeps surroundings clean by eating
    scraps. Exact lines are not reproduced here; questions focus on birds, their sounds and describing words.
  explanations:
    text: The crow is a black bird we see every day. It says 'caw-caw'. Crows are clever and they eat leftover food, which helps keep places clean.
    visual: Draw a black crow on a branch with a speech bubble 'caw-caw'.
    step_by_step: 1. Read the lesson aloud. 2. What does the crow look like? 3. What sound does it make? 4. What does it eat?
    real_world: Crows sit on wires and walls in towns and villages all over India.
  picture:
    kind: compare
    columns:
    - title: Bird
      points:
      - crow
      - parrot
      - peacock
    - title: Colour
      points:
      - black
      - green
      - blue and green
    alt: The crow is black, the parrot is green and the peacock is blue and green.
  activity:
    type: sort
    prompt: 'The Crow: which bird sound?'
    bins:
    - Caw
    - Coo
    - Quack
    - Cock-a-doodle-doo
    items:
    - label: Crow
      bin: Caw
      clue: Black and clever.
      why: Crows say caw caw.
    - label: Pigeon
      bin: Coo
      clue: Grey bird.
      why: Pigeons coo.
    - label: Duck
      bin: Quack
      clue: Swims.
      why: Ducks quack.
    - label: Rooster
      bin: Cock-a-doodle-doo
      clue: Wakes you up.
      why: Roosters crow in the morning.
  lesson:
    - teach: The crow is a common bird. It is black, has two wings, two legs and a strong beak. It says 'caw-caw'. Crows live near people and build nests in trees.
      check:
        prompt: Where does a crow build its nest?
        options:
        - in a tree
        - in a pond
        - under the ground
        answer: in a tree
        why: Crows make nests of sticks high in trees.
      ways:
      - style: visual
        teach: 'A crow and a sparrow side by side: two birds we often see near homes.'
        picture:
          kind: compare
          columns:
          - title: Crow
            points:
            - Black and grey feathers
            - Quite big
            - Loud call
          - title: Sparrow
            points:
            - Brown feathers
            - Small
            - Soft chirp
          alt: A crow has black and grey feathers, is quite big and has a loud call. A sparrow has brown feathers, is small and has a soft chirp.
      - style: real_world
        teach: In the early morning you often hear crows calling from rooftops and electric wires, even before the other birds start.
    - teach: Crows are clever. A crow can find food, remember places and work together. Crows eat leftover food and scraps, which helps keep places clean.
      check:
        prompt: 'Crows help keep places clean by:'
        options:
        - eating food scraps
        - sweeping the floor
        - washing clothes
        answer: eating food scraps
        why: They eat leftover food that people throw.
      ways:
      - style: visual
        teach: An old story of a thirsty crow that thinks of a clever plan.
        picture:
          kind: flow
          steps:
          - A crow finds a pot with a little water at the bottom
          - Its beak cannot reach the water
          - It drops pebbles into the pot, one by one
          - The water rises to the top
          - The crow drinks
          alt: A thirsty crow finds a pot with a little water. Its beak cannot reach it, so it drops pebbles in one by one until the water rises, and then it drinks.
      - style: real_world
        teach: Crows have been seen dropping hard nuts onto a road, waiting for cars to crack them, and then picking out the soft part.
    - teach: 'Birds make different sounds: crow caw-caw, cuckoo coo-coo, duck quack-quack, hen cluck-cluck, parrot can copy words. Describing words for a crow: black, clever, noisy.'
      picture:
        kind: compare
        columns:
        - title: Bird
          points:
          - crow
          - duck
          - hen
        - title: Sound
          points:
          - caw-caw
          - quack-quack
          - cluck-cluck
        alt: Birds and their sounds.
      check:
        prompt: 'A duck says:'
        options:
        - quack-quack
        - caw-caw
        - moo
        answer: quack-quack
        why: Quack-quack is the duck's sound.
      ways:
      - style: step_by_step
        teach: 'Guess a bird by its sound. Step 1: Stand outside and close your eyes. Step 2: Listen for a bird call. Step 3: Say the sound you hear, like ''tweet-tweet''. Step 4: Open your eyes, look up, and check which bird made it.'
      - style: real_world
        teach: In many villages, a rooster calls 'cock-a-doodle-doo' at sunrise, and some people wake up to it as if it were an alarm clock.
  items:
  - prompt: What colour is a crow?
    options:
    - black
    - white
    - pink
    - yellow
    answer: black
    difficulty: 1
    hints:
    - Dark.
    - Like the night.
    solution: A crow is black.
    mistakes: {"white": "e2_crow_colour"}
  - prompt: 'A crow says:'
    options:
    - caw-caw
    - moo
    - meow
    - quack
    answer: caw-caw
    difficulty: 1
    hints:
    - Bird sound.
    - Loud.
    solution: A crow says caw-caw.
    mistakes: {"quack": "e2_crow_sound"}
  - prompt: 'A crow has two:'
    options:
    - wings
    - tails
    - trunks
    - horns
    answer: wings
    difficulty: 1
    hints:
    - It flies.
    - Birds have them.
    solution: A crow has two wings.
    mistakes: {"tails": "e2_wings"}
  - prompt: Which bird can talk back like us?
    options:
    - parrot
    - crow
    - sparrow
    - hen
    answer: parrot
    difficulty: 2
    hints:
    - A green bird.
    - It copies words.
    solution: A parrot can copy words.
    mistakes: {"crow": "e2_parrot"}
  - prompt: Which is a describing word for a crow?
    options:
    - clever
    - fly
    - branch
    - eat
    answer: clever
    difficulty: 2
    hints:
    - Tells how the crow is.
    - Smart.
    solution: Clever describes the crow.
    mistakes:
      fly: eng2_word
  - prompt: 'A bird lives in a:'
    options:
    - nest
    - kennel
    - stable
    - den
    answer: nest
    difficulty: 1
    hints:
    - Made of twigs.
    - In a tree.
    solution: A bird lives in a nest.
    mistakes: {"kennel": "e2_nest"}
  - prompt: A crow uses its ___ to fly.
    options:
    - wings
    - beak
    - tail feathers only
    answer: wings
    difficulty: 1
    hints:
    - They flap up and down.
    - A bird has two of them.
    solution: 'Step 1: Birds flap to fly. Step 2: They use their wings.'
    mistakes:
      beak: e2_wings
      tail feathers only: e2_wings
  - prompt: 'A crow picks up food with its:'
    options:
    - beak
    - wings
    - tail
    answer: beak
    difficulty: 1
    hints:
    - It is the hard, pointed mouth of a bird.
    - It is at the front of the head.
    solution: 'Step 1: Birds have no hands. Step 2: They pick food with their beak.'
    mistakes:
      wings: c2e10_bird
      tail: c2e10_bird
  - prompt: 'A cuckoo sings:'
    options:
    - coo-coo
    - quack-quack
    - moo-moo
    answer: coo-coo
    difficulty: 1
    hints:
    - The bird's name sounds like its song.
    - Say 'cuckoo' slowly.
    solution: 'Step 1: The name ''cuckoo'' copies its call. Step 2: It sings coo-coo.'
    mistakes:
      quack-quack: c2e10_sound
      moo-moo: c2e10_sound
  - prompt: How many legs does a crow have?
    options:
    - two
    - four
    - six
    answer: two
    difficulty: 1
    hints:
    - All birds have the same number of legs.
    - Like a hen.
    solution: 'Step 1: Birds stand on legs, not four paws. Step 2: A crow has 2 legs.'
    mistakes:
      four: c2e10_bird
      six: c2e10_bird
  - prompt: Which word describes a crow?
    options:
    - noisy
    - fly
    - nest
    answer: noisy
    difficulty: 1
    hints:
    - Which word tells what the crow is like?
    - '''Fly'' is a doing word.'
    solution: 'Step 1: Nest is a thing, fly is a doing word. Step 2: Noisy tells what the crow is like.'
    mistakes:
      fly: c2e10_desc
      nest: c2e10_desc
  - prompt: Which is NOT a bird?
    options:
    - cat
    - crow
    - sparrow
    answer: cat
    difficulty: 2
    hints:
    - Birds have feathers and wings.
    - Which one has fur and says meow?
    solution: 'Step 1: Crow and sparrow have feathers and wings. Step 2: A cat is not a bird.'
    mistakes:
      crow: c2e10_bird
      sparrow: c2e10_bird
  - prompt: 'Crows build nests with:'
    options:
    - sticks and twigs
    - bricks and cement
    - plastic toys
    answer: sticks and twigs
    difficulty: 2
    hints:
    - Birds use what they find in trees.
    - Small dry pieces of branches.
    solution: 'Step 1: Birds use what they can carry. Step 2: Crows use sticks and twigs.'
    mistakes:
      bricks and cement: c2e10_bird
      plastic toys: c2e10_bird
  - prompt: Which shows that crows are clever?
    options:
    - "they remember where food is"
    - "they have shiny black feathers"
    - "they have two legs and two wings"
    answer: they remember where food is
    difficulty: 2
    hints:
    - Clever means good at thinking.
    - Colour and legs are not about thinking.
    solution: 'Step 1: Clever is about the mind. Step 2: Remembering where food is shows thinking.'
    mistakes:
      "they have shiny black feathers": c2e10_desc
      "they have two legs and two wings": c2e10_desc
  - prompt: 'Fill in: Two crows sit on the wall. The ___ are black.'
    options:
    - crows
    - crow
    - crowes
    answer: crows
    difficulty: 3
    hints:
    - There are two of them.
    - For more than one, add -s.
    solution: 'Step 1: Two means more than one. Step 2: Crow + s = crows.'
    mistakes:
      crow: c2e10_many
      crowes: c2e10_many
  - prompt: 'Case: On a hot day, Gopi puts out a bowl of water and some rice. Soon a black bird with a strong beak comes, calling loudly, ''Caw! Caw!'' Which bird is it?'
    options:
    - a crow
    - a parrot
    - a duck
    answer: a crow
    hints:
    - What colour is the bird?
    - Which bird makes a 'caw' sound?
    solution: The bird is black and calls 'caw-caw', so it is a crow. A parrot is green and a duck says 'quack'.
    mistakes:
      a parrot: c2e10_sound
      a duck: c2e10_sound
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing about a parrot for a class display. Which describing word fits a parrot?'
    options:
    - green
    - wooden
    - square
    answer: green
    hints:
    - Picture a parrot in your mind.
    - Which word tells what it looks like?
    solution: A parrot has green feathers, so 'green' describes it well. Parrots are not wooden or square.
    mistakes:
      wooden: c2e10_desc
      square: c2e10_desc
    exam: competency
    difficulty: 2
