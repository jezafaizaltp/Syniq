# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 3. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 3
title: 'It is Fun (Unit 2: Welcome to My World)'
tips:
  e2_fun_good: "Which one is fun and also makes your body strong?"
  e2_opposite_happy: "'Glad' means the same as happy. The opposite is how you feel when you cry."
  e2_we_verb: "With 'we', we don't add -s: we eat, we run, we ..."

concepts:
- code: cbse2e.u2.fun
  title: 'It is Fun (Unit 2: Welcome to My World)'
  notes: |
    A poem about the simple things that are fun to do: playing, running, singing, and enjoying the world around us.
    Exact lines are not reproduced here; questions focus on action words, rhyming words and things children enjoy.
  explanations:
    text: 'This poem is about the fun things we can do every day: running, jumping, singing and playing with friends.'
    visual: Draw yourself doing your favourite fun thing, and write one action word under it.
    step_by_step: 1. Read the poem aloud. 2. Find the action words. 3. Find words that rhyme. 4. Say what is fun for you.
    real_world: Playing in the rain or flying a kite is fun for many children.
  picture:
    kind: compare
    columns:
    - title: Action
      points:
      - run
      - sing
      - jump
    - title: Where
      points:
      - in the park
      - at home
      - in the yard
    alt: We can run in the park, sing at home and jump in the yard.
  activity:
    type: sort
    prompt: 'It is Fun: does it rhyme with ''fun''?'
    bins:
    - Rhymes with fun
    - Doesn't rhyme
    items:
    - label: sun
      bin: Rhymes with fun
      clue: Say them together.
      why: 'fun – sun: same ending sound.'
    - label: run
      bin: Rhymes with fun
      clue: Ends in -un.
      why: fun – run.
    - label: fan
      bin: Doesn't rhyme
      clue: Listen to the middle sound.
      why: fan has 'a', not 'u'.
    - label: bun
      bin: Rhymes with fun
      clue: Ends in -un.
      why: fun – bun.
    - label: fog
      bin: Doesn't rhyme
      clue: Listen to the end sound.
      why: fog ends in -og, not -un.
  items:
  - prompt: Which is an action word?
    options:
    - sing
    - ball
    - sun
    - house
    answer: sing
    difficulty: 1
    hints:
    - Something you do.
    - With your voice.
    solution: Sing is an action word.
    mistakes:
      ball: eng2_word
  - prompt: Which word rhymes with 'fun'?
    options:
    - run
    - fan
    - far
    - top
    answer: run
    difficulty: 1
    hints:
    - End sound -un.
    - Say them aloud.
    solution: Fun and run rhyme.
    mistakes:
      fan: eng2_sound
  - prompt: Which word rhymes with 'play'?
    options:
    - day
    - pen
    - cup
    - bird
    answer: day
    difficulty: 2
    hints:
    - End sound -ay.
    - Say them aloud.
    solution: Play and day rhyme.
    mistakes:
      pen: eng2_sound
  - prompt: Which is the opposite of 'happy'?
    options:
    - sad
    - glad
    - big
    - fast
    answer: sad
    difficulty: 1
    hints:
    - Not happy.
    - Crying.
    solution: Sad is the opposite of happy.
    mistakes: {"glad": "e2_opposite_happy"}
  - prompt: 'Choose the right word: We ___ in the park.'
    options:
    - play
    - plays
    - playing
    - played is
    answer: play
    difficulty: 2
    hints:
    - With 'we' say ...
    - We play.
    solution: We play in the park.
    mistakes: {"plays": "e2_we_verb"}
  - prompt: Which thing is fun AND good for us?
    options:
    - playing outside
    - eating too many sweets
    - staying awake all night
    - fighting
    answer: playing outside
    difficulty: 1
    hints:
    - Good for the body.
    - Fresh air.
    solution: Playing outside is fun and healthy.
    mistakes: {"eating too many sweets": "e2_fun_good"}
