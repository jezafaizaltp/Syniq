# CBSE Class 2 English (NCERT Mridang, 2024-25), chapter 3. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse2-eng
chapter: 3
title: 'It is Fun (Unit 2: Welcome to My World)'
tips:
  c2e3_song: "What do people do with a song?"
  e2_fun_good: "Which one is fun and also makes your body strong?"
  e2_opposite_happy: "'Glad' means the same as happy. The opposite is how you feel when you cry."
  e2_we_verb: "With 'we', we don't add -s: we eat, we run, we ..."
  c2e3_act: A doing word is something you can act out. Can you do it?
  c2e3_rhyme: Say the two words one after the other. Do the ends sound the same?
  c2e3_opp: "Opposites are as far apart as they can be, like hot and cold."

concepts:
- code: cbse2e.u2.fun
  title: 'It is Fun (Unit 2: Welcome to My World)'
  notes: |
    A poem about the simple things that are fun to do: playing, running, singing, and enjoying the world around us.
    Exact lines are not reproduced here; questions focus on action words, rhyming words and things children enjoy.
  explanations:
    text: 'This poem is about the fun things we can do every day: running, jumping, singing and playing with friends.'
    visual: Draw yourself doing your favourite fun thing, and write one action word under it.
    step_by_step: 1. Read the poem aloud. 2. Find the action words. 3. Find words that rhyme. 4. Say what is fun for you.
    real_world: Playing in the rain or flying a kite is fun for many children.
  picture:
    kind: compare
    columns:
    - title: Action
      points:
      - run
      - sing
      - jump
    - title: Where
      points:
      - in the park
      - at home
      - in the yard
    alt: We can run in the park, sing at home and jump in the yard.
  activity:
    type: sort
    prompt: 'It is Fun: does it rhyme with ''fun''?'
    bins:
    - Rhymes with fun
    - Doesn't rhyme
    items:
    - label: sun
      bin: Rhymes with fun
      clue: Say them together.
      why: 'fun – sun: same ending sound.'
    - label: run
      bin: Rhymes with fun
      clue: Ends in -un.
      why: fun – run.
    - label: fan
      bin: Doesn't rhyme
      clue: Listen to the middle sound.
      why: fan has 'a', not 'u'.
    - label: bun
      bin: Rhymes with fun
      clue: Ends in -un.
      why: fun – bun.
    - label: fog
      bin: Doesn't rhyme
      clue: Listen to the end sound.
      why: fog ends in -og, not -un.
  lesson:
    - teach: 'Doing words (action words) tell what we do: run, jump, sing, dance, swim, play. You can act out a doing word. ''I run'' and ''We sing'' have doing words.'
      picture:
        kind: compare
        columns:
        - title: Doing words
          points:
          - run
          - jump
          - sing
        - title: Naming words
          points:
          - ball
          - park
          - kite
        alt: Doing words run, jump, sing next to naming words ball, park, kite.
      check:
        prompt: Which one can you act out?
        options:
        - dance
        - chair
        - blue
        answer: dance
        why: Dance is a doing word, so we can do it.
      ways:
      - style: step_by_step
        teach: 'Play ''act it out''. Step 1: A friend whispers a doing word to you, like ''clap''. Step 2: Act it out without speaking. Step 3: The others guess the word. Step 4: Swap turns.'
      - style: real_world
        teach: On sports day, the teacher calls out doing words like 'run', 'hop', 'skip' and 'march', and everyone knows just what to do.
    - teach: 'Rhyming words end with the same sound: fun, run, sun. Play, day, say. Jump, bump. Poems use rhymes so they are fun to say aloud.'
      check:
        prompt: Which word rhymes with 'sun'?
        options:
        - run
        - sky
        - hot
        answer: run
        why: Sun and run both end with 'un'.
      ways:
      - style: visual
        teach: More words and the words that rhyme with them.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - ball
            - star
            - tree
          - title: Rhymes with it
            points:
            - tall, wall
            - car, jar
            - bee, see
          alt: Ball rhymes with tall and wall. Star rhymes with car and jar. Tree rhymes with bee and see.
      - style: step_by_step
        teach: 'Make a rhyme chain. Step 1: Start with ''hop''. Step 2: Change the first sound to make ''top''. Step 3: Change it again: ''mop''. Step 4: And again: ''stop''. All of them end with ''-op''.'
    - teach: 'Opposites mean very different things: happy and sad, big and small, fast and slow, up and down. Having fun makes us happy.'
      check:
        prompt: What is the opposite of 'fast'?
        options:
        - slow
        - quick
        - run
        answer: slow
        why: Fast and slow are as different as can be.
      ways:
      - style: visual
        teach: Pairs of words that mean opposite things to each other.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - hot
            - full
            - open
            - old
          - title: Its opposite
            points:
            - cold
            - empty
            - shut
            - new
          alt: Hot and cold, full and empty, open and shut, and old and new are opposites.
      - style: real_world
        teach: 'A light switch shows opposites: it can be on or off. A tap can be open or shut, and a glass can be full or empty.'
  items:
  - prompt: Which is an action word?
    options:
    - sing
    - ball
    - sun
    - house
    answer: sing
    difficulty: 1
    hints:
    - Something you do.
    - With your voice.
    solution: Sing is an action word.
    mistakes:
      ball: eng2_word
  - prompt: Which word rhymes with 'fun'?
    options:
    - run
    - fan
    - far
    - top
    answer: run
    difficulty: 1
    hints:
    - End sound -un.
    - Say them aloud.
    solution: Fun and run rhyme.
    mistakes:
      fan: eng2_sound
  - prompt: Which word rhymes with 'play'?
    options:
    - day
    - pen
    - cup
    - bird
    answer: day
    difficulty: 2
    hints:
    - End sound -ay.
    - Say them aloud.
    solution: Play and day rhyme.
    mistakes:
      pen: eng2_sound
  - prompt: Which is the opposite of 'happy'?
    options:
    - sad
    - glad
    - big
    - fast
    answer: sad
    difficulty: 1
    hints:
    - Not happy.
    - Crying.
    solution: Sad is the opposite of happy.
    mistakes: {"glad": "e2_opposite_happy"}
  - prompt: 'Choose the right word: We ___ in the park.'
    options:
    - play
    - plays
    - playing
    - played is
    answer: play
    difficulty: 2
    hints:
    - With 'we' say ...
    - "With 'we' the word has no s and no ing."
    solution: We play in the park.
    mistakes: {"plays": "e2_we_verb"}
  - prompt: Which thing is fun AND good for us?
    options:
    - playing outside
    - eating too many sweets
    - staying awake all night
    - fighting
    answer: playing outside
    difficulty: 1
    hints:
    - Good for the body.
    - Fresh air.
    solution: Playing outside is fun and healthy.
    mistakes: {"eating too many sweets": "e2_fun_good"}
  - prompt: Which is a doing word?
    options:
    - jump
    - tree
    - red
    answer: jump
    difficulty: 1
    hints:
    - Try to act out each word.
    - Which can your legs do?
    solution: 'Step 1: Tree is a thing, red is a colour. Step 2: Jump is something we do.'
    mistakes:
      tree: c2e3_act
      red: c2e3_act
  - prompt: Which word rhymes with 'jump'?
    options:
    - bump
    - jam
    - run
    answer: bump
    difficulty: 1
    hints:
    - Listen to the end of 'jump'.
    - Which word ends with 'ump'?
    solution: 'Step 1: Jump ends with ''ump''. Step 2: Bump ends with ''ump'' too.'
    mistakes:
      jam: c2e3_rhyme
      run: c2e3_rhyme
  - prompt: What is the opposite of 'up'?
    options:
    - down
    - 'on'
    - top
    answer: down
    difficulty: 1
    hints:
    - A ball goes up, then comes ...
    - Think of a slide.
    solution: 'Step 1: Up is high. Step 2: The opposite is down.'
    mistakes:
      'on': c2e3_opp
      top: c2e3_opp
  - prompt: 'Choose the right word: The children ___ a song.'
    options:
    - sing
    - eat
    - sleep
    answer: sing
    difficulty: 1
    hints:
    - What do we do with a song?
    - We use our voice.
    solution: 'Step 1: A song is for our voice. Step 2: The children sing a song.'
    mistakes:
      eat: c2e3_song
      sleep: c2e3_song
  - prompt: Which word rhymes with 'day'?
    options:
    - say
    - dog
    - night
    answer: say
    difficulty: 1
    hints:
    - Day ends with 'ay'.
    - Which word sounds like it at the end?
    solution: 'Step 1: Day ends in ''ay''. Step 2: Say ends in ''ay'' too.'
    mistakes:
      dog: c2e3_rhyme
      night: c2e3_rhyme
  - prompt: What is the opposite of 'big'?
    options:
    - small
    - tall
    - fat
    answer: small
    difficulty: 2
    hints:
    - An elephant is big. An ant is ...
    - Think of a tiny thing.
    solution: 'Step 1: Big means large. Step 2: The opposite is small.'
    mistakes:
      tall: c2e3_opp
      fat: c2e3_opp
  - prompt: How many doing words are in 'We run, jump and play'?
    options:
    - three
    - one
    - four
    answer: three
    difficulty: 2
    hints:
    - Find each word you can act out.
    - Skip 'we' and 'and'.
    solution: 'Step 1: run, jump, play are doing words. Step 2: That is 3.'
    mistakes:
      one: c2e3_act
      four: c2e3_act
  - prompt: Which makes us happy and keeps us fit?
    options:
    - "running and playing"
    - "sitting with a phone"
    - "eating sweets all day"
    answer: running and playing
    difficulty: 2
    hints:
    - Which one moves your body?
    - Fit means strong and healthy.
    solution: 'Step 1: Running and playing move the body. Step 2: They are fun and keep us fit.'
    mistakes:
      "sitting with a phone": e2_fun_good
      "eating sweets all day": e2_fun_good
  - prompt: Which line has two rhyming words?
    options:
    - Run in the sun.
    - Jump on the bed.
    - Sing in the park.
    answer: Run in the sun.
    difficulty: 3
    hints:
    - Look for two words with the same ending.
    - Check the first and last word of each line.
    solution: 'Step 1: Run and sun both end with ''un''. Step 2: The other lines have no rhyming pair.'
    mistakes:
      Jump on the bed.: c2e3_rhyme
      Sing in the park.: c2e3_rhyme
  - prompt: 'Case: At playtime, Tara sits alone and looks sad. Two friends ask Tara to join their game of tag. Soon Tara is laughing and running. How does Tara feel now?'
    options:
    - happy
    - sad
    - angry
    answer: happy
    hints:
    - What is Tara doing at the end?
    - Laughing shows which feeling?
    solution: Tara is laughing and playing with friends, so Tara feels happy now. Happy is the opposite of how Tara felt before.
    mistakes:
      sad: c2e3_opp
      angry: c2e3_opp
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your class is making a list of doing words for sports day. Which word belongs on the list?'
    options:
    - throw
    - chair
    - green
    answer: throw
    hints:
    - A doing word is something you can act out.
    - Try acting out each word. Which one can you do?
    solution: You can act out 'throw', so it is a doing word. A chair is a thing and green is a colour.
    mistakes:
      chair: c2e3_act
      green: c2e3_act
    exam: competency
    difficulty: 2
