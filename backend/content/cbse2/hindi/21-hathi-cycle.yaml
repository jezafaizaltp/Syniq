subject: cbse2-hin
chapter: 21
title: हाथी साइकिल चला रहा था
tips:
  h2_hathi: "चिड़ियाघर में सबसे भारी जानवर याद करो: उसके पैर खंभों जैसे होते हैं।"
  h2_pahiye: "तीन पहिये रिक्शा या छोटे बच्चे की तिपहिया के होते हैं। साइकिल चलाते समय नीचे आगे-पीछे गिनो।"
  h2_soond: "पूँछ पीछे होती है, सींग गाय के होते हैं। हाथी पानी किस लंबे हिस्से से खींचता है?"

concepts:
- code: cbse2h.21.hathi
  title: हाथी साइकिल चला रहा था
  notes: |
    एक मज़ेदार, कल्पना वाली कविता जिसमें हाथी साइकिल चला रहा है। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।) अभ्यास: कल्पना और सच में फ़र्क, जानवर, तुकांत शब्द।
  explanations:
    text: यह मज़ेदार कविता है जिसमें हाथी साइकिल चला रहा है! सच में हाथी साइकिल नहीं चलाता, यह कल्पना है। कल्पना से कविता मज़ेदार बनती है।
    visual: 'चित्र बनाओ: एक बड़ा हाथी छोटी-सी साइकिल पर, सूँड़ से घंटी बजाते हुए।'
    step_by_step: 1. कविता लय से पढ़ो। 2. हाथी क्या कर रहा था? 3. क्या सच में ऐसा होता है? 4. तुकांत शब्द खोजो।
    real_world: कार्टून में जानवर बोलते और गाड़ी चलाते दिखते हैं; यह कल्पना है।
  picture:
    kind: compare
    columns:
    - title: सच
      points:
      - हाथी जंगल में रहता
      - हाथी केले खाता
    - title: कल्पना
      points:
      - हाथी साइकिल चलाता
      - हाथी गाना गाता
    alt: सच में हाथी जंगल में रहता और केले खाता है; कल्पना में वह साइकिल चलाता और गाना गाता है।
  items:
  - prompt: कविता में हाथी क्या कर रहा था?
    options:
    - साइकिल चला रहा था
    - सो रहा था
    - नहा रहा था
    - पढ़ रहा था
    answer: साइकिल चला रहा था
    difficulty: 1
    hints:
    - कविता का नाम।
    - दो पहिये।
    solution: हाथी साइकिल चला रहा था।
    mistakes:
      सो रहा था: hin2_read_again
  - prompt: क्या सच में हाथी साइकिल चलाता है?
    options:
    - नहीं, यह कल्पना है
    - हाँ, रोज़
    - हाँ, स्कूल जाता है
    - हाँ, दौड़ में
    answer: नहीं, यह कल्पना है
    difficulty: 2
    hints:
    - सोचो, हाथी कितना भारी है।
    - मज़ेदार कविता।
    solution: नहीं, यह कल्पना है।
    mistakes: {"हाँ, रोज़": "h1_kalpana", "हाँ, स्कूल जाता है": "h1_kalpana", "हाँ, दौड़ में": "h1_kalpana"}
  - prompt: हाथी की लंबी नाक को क्या कहते हैं?
    options:
    - सूँड़
    - पूँछ
    - सींग
    - पंख
    answer: सूँड़
    difficulty: 1
    hints:
    - पानी पीता है इससे।
    - स से शुरू।
    solution: हाथी की नाक सूँड़ कहलाती है।
    mistakes: {"पूँछ": "h2_soond", "सींग": "h2_soond", "पंख": "h2_soond"}
  - prompt: साइकिल में कितने पहिये होते हैं?
    options:
    - दो
    - तीन
    - चार
    - एक
    answer: दो
    difficulty: 1
    hints:
    - आगे एक, पीछे एक।
    - गिनो।
    solution: साइकिल में दो पहिये होते हैं।
    mistakes: {"तीन": "h2_pahiye", "चार": "h2_pahiye", "एक": "h2_pahiye"}
  - prompt: हाथी कैसा जानवर है?
    options:
    - बहुत बड़ा
    - बहुत छोटा
    - उड़ने वाला
    - पानी में रहने वाला ही
    answer: बहुत बड़ा
    difficulty: 1
    hints:
    - भारी-भरकम।
    - सबसे बड़ा ज़मीनी जीव।
    solution: हाथी बहुत बड़ा जानवर है।
    mistakes: {"बहुत छोटा": "h2_hathi", "उड़ने वाला": "h2_hathi", "पानी में रहने वाला ही": "h2_hathi"}
  - prompt: '''चला रहा था'' बताता है कि काम कब हुआ?'
    options:
    - पहले (बीते समय में)
    - कल आगे
    - अभी नहीं होगा
    - कभी नहीं
    answer: पहले (बीते समय में)
    difficulty: 2
    hints:
    - '''था'' देखो।'
    - बीता हुआ।
    solution: '''था'' बीते समय को बताता है।'
    mistakes:
      कल आगे: hin2_word
