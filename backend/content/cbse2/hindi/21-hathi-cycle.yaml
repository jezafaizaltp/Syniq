subject: cbse2-hin
chapter: 21
title: हाथी साइकिल चला रहा था
tips:
  h2_hathi: "चिड़ियाघर में सबसे भारी जानवर याद करो: उसके पैर खंभों जैसे होते हैं।"
  h2_pahiye: "तीन पहिये रिक्शा या छोटे बच्चे की तिपहिया के होते हैं। साइकिल चलाते समय नीचे आगे-पीछे गिनो।"
  h2_soond: "पूँछ पीछे होती है, सींग गाय के होते हैं। हाथी पानी किस लंबे हिस्से से खींचता है?"
  c2h21_ginti: पहले एक साइकिल के पहिये गिनो, फिर दूसरी के।
  c2h21_sach: सोचो, क्या यह रोज़ की ज़िंदगी में सच में होता है?
  c2h21_hathi: 'हाथी को मन में देखो: उसके शरीर के हिस्से और उसका आकार।'
  c2h21_tuk: दोनों शब्द बोलो। क्या अंत की आवाज़ एक जैसी है?

concepts:
- code: cbse2h.21.hathi
  title: हाथी साइकिल चला रहा था
  notes: |
    एक मज़ेदार, कल्पना वाली कविता जिसमें हाथी साइकिल चला रहा है। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।) अभ्यास: कल्पना और सच में फ़र्क, जानवर, तुकांत शब्द।
  explanations:
    text: यह मज़ेदार कविता है जिसमें हाथी साइकिल चला रहा है! सच में हाथी साइकिल नहीं चलाता, यह कल्पना है। कल्पना से कविता मज़ेदार बनती है।
    visual: 'चित्र बनाओ: एक बड़ा हाथी छोटी-सी साइकिल पर, सूँड़ से घंटी बजाते हुए।'
    step_by_step: 1. कविता लय से पढ़ो। 2. हाथी क्या कर रहा था? 3. क्या सच में ऐसा होता है? 4. तुकांत शब्द खोजो।
    real_world: कार्टून में जानवर बोलते और गाड़ी चलाते दिखते हैं; यह कल्पना है।
  picture:
    kind: compare
    columns:
    - title: सच
      points:
      - हाथी जंगल में रहता
      - हाथी केले खाता
    - title: कल्पना
      points:
      - हाथी साइकिल चलाता
      - हाथी गाना गाता
    alt: सच में हाथी जंगल में रहता और केले खाता है; कल्पना में वह साइकिल चलाता और गाना गाता है।
  activity:
    type: sort
    prompt: कौन-सी बात सच में होती है, कौन-सी बस कविता की कल्पना?
    bins:
    - सच में
    - कल्पना
    items:
    - label: 🐘 हाथी सूँड़ से पानी पीता है
      bin: सच में
      clue: चिड़ियाघर में देखा है?
      why: यह सच है।
    - label: 🚲 बच्चा साइकिल चलाता है
      bin: सच में
      clue: तुमने चलाई है?
      why: सच है।
    - label: 🐘🚲 हाथी साइकिल चलाता है
      bin: कल्पना
      clue: हाथी साइकिल पर बैठ सकता है?
      why: यह मज़ेदार कल्पना है।
    - label: 🐒 बंदर गाड़ी चलाता है
      bin: कल्पना
      clue: बंदर के पास लाइसेंस?
      why: कल्पना।
  lesson:
    - teach: '''हाथी साइकिल चला रहा था'' एक मज़ेदार कविता है। सच में हाथी साइकिल नहीं चलाता। कवि ने कल्पना से हँसी वाली बात बनाई है। कल्पना और सच में फ़र्क पहचानो।'
      picture:
        kind: compare
        columns:
        - title: सच
          points:
          - हाथी सूँड़ से पानी पीता है
          - हाथी पेड़ की डालें खाता है
        - title: कल्पना
          points:
          - हाथी साइकिल चलाता है
          - हाथी गाना गाता है
        alt: हाथी के बारे में सच और कल्पना की बातें।
      check:
        prompt: इनमें से कौन-सी बात कल्पना है?
        options:
        - हाथी साइकिल चला रहा है
        - हाथी पत्ते खा रहा है
        - हाथी नहा रहा है
        answer: हाथी साइकिल चला रहा है
        why: हाथी सच में साइकिल नहीं चला सकता।
    - teach: हाथी सबसे बड़ा ज़मीनी जानवर है। उसकी लंबी नाक को सूँड़ कहते हैं; बड़े कान पंखे जैसे; दो लंबे दाँत; पैर खंभों जैसे। वह सूँड़ से पानी पीता और नहाता है।
      check:
        prompt: हाथी के कान कैसे होते हैं?
        options:
        - बड़े, पंखे जैसे
        - छोटे और नुकीले
        - बिलकुल नहीं होते
        answer: बड़े, पंखे जैसे
        why: हाथी के बड़े कान पंखे की तरह हिलते हैं।
    - teach: '''चला रहा था'' बताता है कि काम पहले (बीते समय में) हो रहा था। ''चला रहा है'' = अभी, ''चलाएगा'' = आगे। तुक वाले शब्द: हाथी-साथी, गाड़ी-साड़ी।'
      check:
        prompt: '''हाथी'' से तुक मिलाने वाला शब्द कौन-सा है?'
        options:
        - साथी
        - घोड़ा
        - पहिया
        answer: साथी
        why: हाथी और साथी दोनों 'आथी' पर खत्म होते हैं।
  items:
  - prompt: कविता में हाथी क्या कर रहा था?
    options:
    - साइकिल चला रहा था
    - सो रहा था
    - नहा रहा था
    - पढ़ रहा था
    answer: साइकिल चला रहा था
    difficulty: 1
    hints:
    - कविता का नाम।
    - दो पहिये।
    solution: हाथी साइकिल चला रहा था।
    mistakes:
      सो रहा था: hin2_read_again
  - prompt: क्या सच में हाथी साइकिल चलाता है?
    options:
    - नहीं, यह कल्पना है
    - हाँ, रोज़
    - हाँ, स्कूल जाता है
    - हाँ, दौड़ में
    answer: नहीं, यह कल्पना है
    difficulty: 2
    hints:
    - सोचो, हाथी कितना भारी है।
    - मज़ेदार कविता।
    solution: नहीं, यह कल्पना है।
    mistakes: {"हाँ, रोज़": "h1_kalpana", "हाँ, स्कूल जाता है": "h1_kalpana", "हाँ, दौड़ में": "h1_kalpana"}
  - prompt: हाथी की लंबी नाक को क्या कहते हैं?
    options:
    - सूँड़
    - पूँछ
    - सींग
    - पंख
    answer: सूँड़
    difficulty: 1
    hints:
    - पानी पीता है इससे।
    - स से शुरू।
    solution: हाथी की नाक सूँड़ कहलाती है।
    mistakes: {"पूँछ": "h2_soond", "सींग": "h2_soond", "पंख": "h2_soond"}
  - prompt: साइकिल में कितने पहिये होते हैं?
    options:
    - दो
    - तीन
    - चार
    - एक
    answer: दो
    difficulty: 1
    hints:
    - आगे एक, पीछे एक।
    - गिनो।
    solution: साइकिल में दो पहिये होते हैं।
    mistakes: {"तीन": "h2_pahiye", "चार": "h2_pahiye", "एक": "h2_pahiye"}
  - prompt: हाथी कैसा जानवर है?
    options:
    - बहुत बड़ा
    - बहुत छोटा
    - उड़ने वाला
    - पानी में रहने वाला ही
    answer: बहुत बड़ा
    difficulty: 1
    hints:
    - भारी-भरकम।
    - सबसे बड़ा ज़मीनी जीव।
    solution: हाथी बहुत बड़ा जानवर है।
    mistakes: {"बहुत छोटा": "h2_hathi", "उड़ने वाला": "h2_hathi", "पानी में रहने वाला ही": "h2_hathi"}
  - prompt: '''चला रहा था'' बताता है कि काम कब हुआ?'
    options:
    - पहले (बीते समय में)
    - कल आगे
    - अभी नहीं होगा
    - कभी नहीं
    answer: पहले (बीते समय में)
    difficulty: 2
    hints:
    - '''था'' देखो।'
    - बीता हुआ।
    solution: '''था'' बीते समय को बताता है।'
    mistakes:
      कल आगे: hin2_word
  - prompt: हाथी पानी किससे पीता है?
    options:
    - सूँड़ से
    - कान से
    - पूँछ से
    answer: सूँड़ से
    difficulty: 1
    hints:
    - हाथी की लंबी नाक।
    - यह पानी खींचकर मुँह में डालती है।
    solution: 'चरण 1: हाथी की लंबी नाक सूँड़ है। चरण 2: वह उससे पानी खींचता है।'
    mistakes:
      कान से: c2h21_hathi
      पूँछ से: c2h21_hathi
  - prompt: कौन-सी बात सच है?
    options:
    - हाथी बहुत भारी होता है
    - हाथी उड़ता है
    - हाथी चींटी से छोटा है
    answer: हाथी बहुत भारी होता है
    difficulty: 1
    hints:
    - दो बातें कभी नहीं होतीं।
    - चिड़ियाघर का सबसे बड़ा जानवर।
    solution: 'चरण 1: हाथी उड़ता नहीं और चींटी से बड़ा है। चरण 2: हाथी भारी होता है: सच।'
    mistakes:
      हाथी उड़ता है: c2h21_sach
      हाथी चींटी से छोटा है: c2h21_sach
  - prompt: साइकिल के पैडल को किससे चलाते हैं?
    options:
    - पैरों से
    - हाथों से
    - सिर से
    answer: पैरों से
    difficulty: 1
    hints:
    - हाथ हैंडल पकड़ते हैं।
    - नीचे घूमने वाले हिस्से पर क्या रखते हैं?
    solution: 'चरण 1: हाथ हैंडल पर। चरण 2: पैर पैडल घुमाते हैं।'
    mistakes:
      हाथों से: c2h21_sach
      सिर से: c2h21_sach
  - prompt: '''गाड़ी'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - साड़ी
    - गाय
    - पेड़
    answer: साड़ी
    difficulty: 1
    hints:
    - गाड़ी 'आड़ी' पर खत्म होती है।
    - अंत की आवाज़ सुनो।
    solution: 'चरण 1: गाड़ी ''आड़ी'' पर। चरण 2: साड़ी भी।'
    mistakes:
      गाय: c2h21_tuk
      पेड़: c2h21_tuk
  - prompt: '''वह कल खेल रहा था'' में काम कब हुआ?'
    options:
    - पहले (बीते समय में)
    - अभी
    - आगे आने वाले समय में
    answer: पहले (बीते समय में)
    difficulty: 2
    hints:
    - '''कल'' और ''था'' देखो।'
    - '''था'' बीती बात बताता है।'
    solution: 'चरण 1: ''था'' बीता समय बताता है। चरण 2: काम पहले हुआ।'
    mistakes:
      अभी: c2h21_sach
      आगे आने वाले समय में: c2h21_sach
  - prompt: हाथी क्या खाता है?
    options:
    - पत्ते, घास और फल
    - मछली
    - पत्थर
    answer: पत्ते, घास और फल
    difficulty: 1
    hints:
    - हाथी पेड़ की डालें तोड़ता है।
    - वह माँस नहीं खाता।
    solution: 'चरण 1: हाथी शाकाहारी है। चरण 2: वह पत्ते, घास और फल खाता है।'
    mistakes:
      मछली: c2h21_hathi
      पत्थर: c2h21_hathi
  - prompt: '''चलाएगा'' बताता है कि काम कब होगा?'
    options:
    - आगे (आने वाले समय में)
    - पहले
    - कभी नहीं
    answer: आगे (आने वाले समय में)
    difficulty: 2
    hints:
    - '''गा'' वाले शब्द आने वाली बात बताते हैं।'
    - 'जैसे: कल मैं जाऊँगा।'
    solution: 'चरण 1: ''चलाएगा'' में ''गा'' है। चरण 2: काम आगे होगा।'
    mistakes:
      पहले: c2h21_sach
      कभी नहीं: c2h21_sach
  - prompt: कविता में हाथी को साइकिल पर दिखाने से क्या होता है?
    options:
    - पढ़ने वाले हँसते हैं और मज़ा आता है
    - सब डर जाते हैं
    - सब सो जाते हैं
    answer: पढ़ने वाले हँसते हैं और मज़ा आता है
    difficulty: 2
    hints:
    - इतना बड़ा जानवर छोटी साइकिल पर!
    - यह मज़ेदार कविता है।
    solution: 'चरण 1: यह अनोखी, अनहोनी बात है। चरण 2: इससे हँसी आती है।'
    mistakes:
      सब डर जाते हैं: c2h21_sach
      सब सो जाते हैं: c2h21_sach
  - prompt: दो साइकिलों में कुल कितने पहिये?
    options:
    - चार
    - दो
    - तीन
    answer: चार
    difficulty: 3
    hints:
    - एक साइकिल के दो पहिये।
    - दो और दो।
    solution: 'चरण 1: हर साइकिल के 2 पहिये। चरण 2: 2 + 2 = 4।'
    mistakes:
      दो: c2h21_ginti
      तीन: c2h21_ginti
