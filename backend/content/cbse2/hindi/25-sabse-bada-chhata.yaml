subject: cbse2-hin
chapter: 25
title: सबसे बड़ा छाता
tips:
  h2_panchhi_baarish: "बारिश में पंछी भीगना नहीं चाहते। ऊपर पत्तों की छत कहाँ मिलती है?"

concepts:
- code: cbse2h.25.sabse
  title: सबसे बड़ा छाता
  notes: |
    सबसे बड़े छाते के बारे में पाठ/कहानी: बारिश या धूप में बड़ा छाता सबको बचाता है (जैसे पेड़ या आसमान को बड़ा छाता मानना)। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह पाठ सबसे बड़े छाते के बारे में है। छाता हमें बारिश और धूप से बचाता है। एक बड़ा छाता बहुत सारे लोगों को साथ में बचा सकता है, जैसे घना पेड़।
    visual: 'चित्र बनाओ: एक बहुत बड़ा छाता जिसके नीचे कई बच्चे और जानवर बारिश से बचे खड़े हैं।'
    step_by_step: 1. पाठ पढ़ो। 2. छाता किससे बचाता है? 3. सबसे बड़ा छाता किसे कहा गया? 4. बाँटने से क्या होता है?
    real_world: बारिश में पेड़ के नीचे पशु-पक्षी इकट्ठे होकर बचते हैं।
  picture:
    kind: flow
    steps:
    - बारिश आई
    - छाता खोला
    - दोस्तों को बुलाया
    - सब बचे
    alt: बारिश आई, छाता खोला, दोस्तों को बुलाया और सब बच गए।
  activity:
    type: sort
    prompt: कौन-सा 'छाता' बनकर बचाता है?
    bins:
    - छाते जैसा बचाता है
    - नहीं बचाता
    items:
    - label: ☂️ छाता
      bin: छाते जैसा बचाता है
      clue: बारिश में क्या खोलते हैं?
      why: छाता बचाता है।
    - label: 🌳 बड़ा पेड़
      bin: छाते जैसा बचाता है
      clue: धूप में छाँव कौन देता है?
      why: पेड़ बड़ा छाता है।
    - label: 🏠 छत
      bin: छाते जैसा बचाता है
      clue: घर में बारिश से कौन बचाता है?
      why: छत छाता है।
    - label: 🎈 गुब्बारा
      bin: नहीं बचाता
      clue: क्या गुब्बारा बारिश रोकेगा?
      why: गुब्बारा नहीं बचाता।
  items:
  - prompt: छाता हमें किससे बचाता है?
    options:
    - बारिश और धूप से
    - खाने से
    - किताबों से
    - हवा में उड़ने से
    answer: बारिश और धूप से
    difficulty: 1
    hints:
    - मौसम।
    - सिर के ऊपर।
    solution: छाता बारिश और धूप से बचाता है।
    mistakes: {"खाने से": "h1_baarish_bachav", "किताबों से": "h1_baarish_bachav", "हवा में उड़ने से": "h1_baarish_bachav"}
  - prompt: बड़ा छाता हो तो हम क्या कर सकते हैं?
    options:
    - दोस्तों के साथ बाँट सकते हैं
    - अकेले ही रखें
    - फेंक दें
    - छिपा दें
    answer: दोस्तों के साथ बाँट सकते हैं
    difficulty: 1
    hints:
    - सबको जगह।
    - बाँटना।
    solution: बड़ा छाता दोस्तों के साथ बाँट सकते हैं।
    mistakes: {"अकेले ही रखें": "h1_baant", "फेंक दें": "h1_baant", "छिपा दें": "h1_baant"}
  - prompt: बारिश में पंछी कहाँ छिपते हैं?
    options:
    - पेड़ के नीचे
    - सड़क पर
    - पानी में
    - आसमान में
    answer: पेड़ के नीचे
    difficulty: 2
    hints:
    - पेड़ भी छाते जैसा।
    - पत्ते ऊपर।
    solution: पंछी पेड़ के नीचे छिपते हैं।
    mistakes: {"सड़क पर": "h2_panchhi_baarish", "पानी में": "h2_panchhi_baarish", "आसमान में": "h2_panchhi_baarish"}
  - prompt: '''सबसे बड़ा छाता'' कैसा होता है?'
    options:
    - बाकी सब छातों से बड़ा
    - बाकी सब छातों से छोटा
    - बाकी छातों के बराबर
    - थोड़ा-सा छोटा
    answer: बाकी सब छातों से बड़ा
    difficulty: 2
    hints:
    - बड़ा, और बड़ा, ...
    - सबसे ऊपर।
    solution: सबसे बड़ा यानी बाकी सब से बड़ा।
    mistakes:
      बाकी सब छातों से छोटा: hin2_word
  - prompt: '''छाता'' का बहुवचन क्या है?'
    options:
    - छाते
    - छाताओं
    - छाताएँ
    - छाती
    answer: छाते
    difficulty: 2
    hints:
    - एक छाता, दो ...
    - आ बदलकर ए।
    solution: छाता → छाते।
    mistakes: {"छाताओं": "h2_bahuvachan", "छाताएँ": "h2_bahuvachan", "छाती": "h2_bahuvachan"}
  - prompt: बड़ा का उलटा क्या है?
    options:
    - छोटा
    - लंबा
    - मोटा
    - भारी
    answer: छोटा
    difficulty: 1
    hints:
    - सबसे बड़ा vs ...
    - नन्हा।
    solution: बड़ा का उलटा छोटा है।
    mistakes: {"लंबा": "h1_ulta", "मोटा": "h1_ulta", "भारी": "h1_ulta"}
