subject: cbse2-hin
chapter: 25
title: सबसे बड़ा छाता
tips:
  h2_panchhi_baarish: "बारिश में पंछी भीगना नहीं चाहते। ऊपर पत्तों की छत कहाँ मिलती है?"
  c2h25_vachan: एक चीज़ है या बहुत सारी? 'घोड़ा' से 'घोड़े' कैसे बना, वैसे सोचो।
  c2h25_bachav: 'बारिश या तेज़ धूप में बाहर खड़े होकर सोचो: ऊपर क्या चाहिए?'
  c2h25_tulna: तीनों को साथ रखकर देखो। कौन सबसे ज़्यादा या सबसे कम है?
  c2h25_baant: सोचो, तुम भीग रहे हो और दोस्त के पास बड़ा छाता है। तुम क्या चाहोगे?

concepts:
- code: cbse2h.25.sabse
  title: सबसे बड़ा छाता
  notes: |
    सबसे बड़े छाते के बारे में पाठ/कहानी: बारिश या धूप में बड़ा छाता सबको बचाता है (जैसे पेड़ या आसमान को बड़ा छाता मानना)। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह पाठ सबसे बड़े छाते के बारे में है। छाता हमें बारिश और धूप से बचाता है। एक बड़ा छाता बहुत सारे लोगों को साथ में बचा सकता है, जैसे घना पेड़।
    visual: 'चित्र बनाओ: एक बहुत बड़ा छाता जिसके नीचे कई बच्चे और जानवर बारिश से बचे खड़े हैं।'
    step_by_step: 1. पाठ पढ़ो। 2. छाता किससे बचाता है? 3. सबसे बड़ा छाता किसे कहा गया? 4. बाँटने से क्या होता है?
    real_world: बारिश में पेड़ के नीचे पशु-पक्षी इकट्ठे होकर बचते हैं।
  picture:
    kind: flow
    steps:
    - बारिश आई
    - छाता खोला
    - दोस्तों को बुलाया
    - सब बचे
    alt: बारिश आई, छाता खोला, दोस्तों को बुलाया और सब बच गए।
  activity:
    type: sort
    prompt: कौन-सा 'छाता' बनकर बचाता है?
    bins:
    - छाते जैसा बचाता है
    - नहीं बचाता
    items:
    - label: ☂️ छाता
      bin: छाते जैसा बचाता है
      clue: बारिश में क्या खोलते हैं?
      why: छाता बचाता है।
    - label: 🌳 बड़ा पेड़
      bin: छाते जैसा बचाता है
      clue: धूप में छाँव कौन देता है?
      why: पेड़ बड़ा छाता है।
    - label: 🏠 छत
      bin: छाते जैसा बचाता है
      clue: घर में बारिश से कौन बचाता है?
      why: छत छाता है।
    - label: 🎈 गुब्बारा
      bin: नहीं बचाता
      clue: क्या गुब्बारा बारिश रोकेगा?
      why: गुब्बारा नहीं बचाता।
  lesson:
    - teach: छाता हमें बारिश और तेज़ धूप से बचाता है। बड़ा छाता हो तो उसके नीचे कई लोग आ सकते हैं। हम दोस्तों के साथ छाता बाँटते हैं ताकि कोई न भीगे।
      check:
        prompt: बड़ा छाता हो और दोस्त भीग रहा हो, तो क्या करें?
        options:
        - दोस्त को छाते के नीचे बुला लें
        - जल्दी से अकेले चले जाएँ
        - छाता बंद कर दें
        answer: दोस्त को छाते के नीचे बुला लें
        why: बाँटने से दोनों बच जाते हैं।
      ways:
      - style: visual
        teach: बारिश में और तेज़ धूप में छाता हमारे किन कामों में आता है।
        picture:
          kind: compare
          columns:
          - title: बारिश में
            points:
            - भीगने से बचाता है
            - बस्ता और किताबें सूखी रखता है
          - title: तेज़ धूप में
            points:
            - आँखों को तेज़ चमक से बचाता है
            - ठंडी छाया देता है
          alt: बारिश में छाता भीगने से बचाता है और बस्ता-किताबें सूखी रखता है। तेज़ धूप में वह आँखों को चमक से बचाता है और ठंडी छाया देता है।
      - style: real_world
        teach: बारिश में बस-स्टॉप पर कई बार अनजान लोग भी एक-दूसरे को अपने छाते के नीचे जगह दे देते हैं।
    - teach: 'प्रकृति के भी ''छाते'' हैं: घना पेड़ पंछियों और राहगीरों को छाया देता है; बारिश में पंछी पेड़ों के पत्तों के नीचे छिपते हैं। मशरूम (कुकुरमुत्ता) भी छोटे छाते जैसा दिखता है।'
      check:
        prompt: गर्मी में राहगीर छाया के लिए कहाँ रुकते हैं?
        options:
        - घने पेड़ के नीचे
        - धूप वाली सड़क पर
        - खुले मैदान में
        answer: घने पेड़ के नीचे
        why: घने पत्ते धूप रोककर ठंडी छाया देते हैं।
      ways:
      - style: visual
        teach: प्रकृति के कुछ 'छाते', और वे किसे बचाते हैं।
        picture:
          kind: compare
          columns:
          - title: प्रकृति का छाता
            points:
            - आम का घना पेड़
            - केले का बड़ा पत्ता
            - चट्टान की ओट
          - title: किसे बचाता है
            points:
            - राहगीर और पंछी
            - छोटे कीड़े और मेंढक
            - पहाड़ी बकरियाँ
          alt: आम का घना पेड़ राहगीरों और पंछियों को, केले का बड़ा पत्ता छोटे कीड़ों और मेंढकों को, और चट्टान की ओट पहाड़ी बकरियों को बचाती है।
      - style: real_world
        teach: गाँवों में अचानक बारिश होने पर बच्चे कभी-कभी केले या कमल का बड़ा पत्ता सिर पर रखकर घर की ओर भागते हैं।
    - teach: 'तुलना के शब्द: बड़ा, उससे बड़ा, सबसे बड़ा। छोटा, उससे छोटा, सबसे छोटा। ''सबसे बड़ा'' मतलब बाकी सब से बड़ा। एक छाता, बहुत से छाते।'
      picture:
        kind: flow
        steps:
        - छोटा छाता
        - बड़ा छाता
        - सबसे बड़ा छाता
        alt: छोटा, बड़ा और सबसे बड़ा छाता।
      check:
        prompt: 'हाथी, बिल्ली, चूहा: सबसे छोटा कौन है?'
        options:
        - चूहा
        - बिल्ली
        - हाथी
        answer: चूहा
        why: चूहा तीनों में सबसे छोटा है।
      ways:
      - style: step_by_step
        teach: 'तीन चीज़ों की तुलना करो। पहला: तीन पेंसिलें लो। दूसरा: उन्हें मेज़ पर साथ-साथ खड़ा करो। तीसरा: सबसे ऊँची वाली को ''सबसे लंबी'' कहो। चौथा: सबसे नीची वाली को ''सबसे छोटी'' कहो।'
      - style: real_world
        teach: दुकानदार कपड़े और जूते छोटे, बड़े और सबसे बड़े नाप में रखते हैं, ताकि हर किसी को अपना सही नाप मिल सके।
  items:
  - prompt: छाता हमें किससे बचाता है?
    options:
    - बारिश और धूप से
    - खाने से
    - किताबों से
    - हवा में उड़ने से
    answer: बारिश और धूप से
    difficulty: 1
    hints:
    - मौसम।
    - सिर के ऊपर।
    solution: छाता बारिश और धूप से बचाता है।
    mistakes: {"खाने से": "h1_baarish_bachav", "किताबों से": "h1_baarish_bachav", "हवा में उड़ने से": "h1_baarish_bachav"}
  - prompt: बड़ा छाता हो तो हम क्या कर सकते हैं?
    options:
    - "दोस्तों के साथ बाँट सकते हैं"
    - "उसे अकेले ही अपने पास रखें"
    - "उसे उठाकर कहीं फेंक दें"
    - "उसे सबसे छिपाकर रख दें"
    answer: दोस्तों के साथ बाँट सकते हैं
    difficulty: 1
    hints:
    - सबको जगह।
    - बाँटना।
    solution: बड़ा छाता दोस्तों के साथ बाँट सकते हैं।
    mistakes: {"उसे अकेले ही अपने पास रखें": "h1_baant", "उसे उठाकर कहीं फेंक दें": "h1_baant", "उसे सबसे छिपाकर रख दें": "h1_baant"}
  - prompt: बारिश में पंछी कहाँ छिपते हैं?
    options:
    - पेड़ के नीचे
    - सड़क पर
    - पानी में
    - आसमान में
    answer: पेड़ के नीचे
    difficulty: 2
    hints:
    - पेड़ भी छाते जैसा।
    - पत्ते ऊपर।
    solution: पंछी पेड़ के नीचे छिपते हैं।
    mistakes: {"सड़क पर": "h2_panchhi_baarish", "पानी में": "h2_panchhi_baarish", "आसमान में": "h2_panchhi_baarish"}
  - prompt: '''सबसे बड़ा छाता'' कैसा होता है?'
    options:
    - बाकी सब छातों से बड़ा
    - बाकी सब छातों से छोटा
    - बाकी छातों के बराबर
    - थोड़ा-सा छोटा
    answer: बाकी सब छातों से बड़ा
    difficulty: 2
    hints:
    - बड़ा, और बड़ा, ...
    - सबसे ऊपर।
    solution: सबसे बड़ा यानी बाकी सब से बड़ा।
    mistakes:
      बाकी सब छातों से छोटा: hin2_word
  - prompt: '''छाता'' का बहुवचन क्या है?'
    options:
    - छाते
    - छाताओं
    - छाताएँ
    - छाती
    answer: छाते
    difficulty: 2
    hints:
    - एक छाता, दो ...
    - आ बदलकर ए।
    solution: छाता → छाते।
    mistakes: {"छाताओं": "h2_bahuvachan", "छाताएँ": "h2_bahuvachan", "छाती": "h2_bahuvachan"}
  - prompt: बड़ा का उलटा क्या है?
    options:
    - छोटा
    - लंबा
    - मोटा
    - भारी
    answer: छोटा
    difficulty: 1
    hints:
    - सबसे बड़ा vs ...
    - नन्हा।
    solution: बड़ा का उलटा छोटा है।
    mistakes: {"लंबा": "h1_ulta", "मोटा": "h1_ulta", "भारी": "h1_ulta"}
  - prompt: धूप में छाता हमें किससे बचाता है?
    options:
    - तेज़ गर्मी से
    - ठंडी हवा से
    - अँधेरे से
    answer: तेज़ गर्मी से
    difficulty: 1
    hints:
    - धूप में सिर पर क्या लगता है?
    - छाते के नीचे छाया होती है।
    solution: 'चरण 1: धूप तेज़ और गरम है। चरण 2: छाता छाया देकर गर्मी से बचाता है।'
    mistakes:
      ठंडी हवा से: c2h25_bachav
      अँधेरे से: c2h25_bachav
  - prompt: 'पेड़, घर, पहाड़: सबसे बड़ा कौन है?'
    options:
    - पहाड़
    - पेड़
    - घर
    answer: पहाड़
    difficulty: 1
    hints:
    - कौन बादलों तक ऊँचा जाता है?
    - घर और पेड़ उसके सामने छोटे।
    solution: 'चरण 1: पेड़ और घर ऊँचे हैं। चरण 2: पहाड़ सबसे बड़ा है।'
    mistakes:
      पेड़: c2h25_tulna
      घर: c2h25_tulna
  - prompt: कौन-सा पौधा छोटे छाते जैसा दिखता है?
    options:
    - कुकुरमुत्ता (मशरूम)
    - गन्ना
    - बाँस
    answer: कुकुरमुत्ता (मशरूम)
    difficulty: 2
    hints:
    - इसकी गोल टोपी और नीचे डंडी होती है।
    - बारिश में ज़मीन पर उगता है।
    solution: 'चरण 1: छाते की गोल छत और डंडी होती है। चरण 2: कुकुरमुत्ता भी ऐसा ही दिखता है।'
    mistakes:
      गन्ना: c2h25_tulna
      बाँस: c2h25_tulna
  - prompt: 'सही वाक्य चुनो: ''दुकान में बहुत से ___ हैं।'''
    options:
    - छाते
    - छाता
    - छातियाँ
    answer: छाते
    difficulty: 1
    hints:
    - '''तारा'' से ''तारे'' बनता है।'
    - आ को ए में बदलो।
    solution: 'चरण 1: छाता के अंत में आ। चरण 2: बहुवचन छाते।'
    mistakes:
      छाता: c2h25_vachan
      छातियाँ: c2h25_vachan
  - prompt: बारिश में एक छाता और दो बच्चे। अच्छा क्या है?
    options:
    - "दोनों पास-पास छाते के नीचे चलें"
    - "एक बच्चा भीगे, दूसरा न भीगे"
    - "छाता किसी को भी न मिले"
    answer: दोनों पास-पास छाते के नीचे चलें
    difficulty: 1
    hints:
    - बाँटने से दोनों बचेंगे।
    - पास-पास चलो।
    solution: 'चरण 1: एक छाता, दो बच्चे। चरण 2: पास-पास चलकर दोनों बचें।'
    mistakes:
      "एक बच्चा भीगे, दूसरा न भीगे": c2h25_baant
      "छाता किसी को भी न मिले": c2h25_baant
  - prompt: बारिश में गाय-बकरियाँ भीगने से बचने कहाँ जाती हैं?
    options:
    - "छप्पर या घने पेड़ के नीचे"
    - "खुले मैदान के ठीक बीच में"
    - "गहरे तालाब के पानी के अंदर"
    answer: छप्पर या घने पेड़ के नीचे
    difficulty: 2
    hints:
    - जानवर भी भीगना नहीं चाहते।
    - ऊपर छत जैसी कोई चीज़ चाहिए।
    solution: 'चरण 1: जानवरों के पास छाता नहीं। चरण 2: छप्पर या घना पेड़ उनके लिए छाते जैसा है।'
    mistakes:
      "खुले मैदान के ठीक बीच में": c2h25_bachav
      "गहरे तालाब के पानी के अंदर": c2h25_bachav
  - prompt: लाल छाता 1 बच्चे को, नीला 2 को, पीला 4 बच्चों को ढक सकता है। सबसे बड़ा कौन-सा है?
    options:
    - पीला
    - लाल
    - नीला
    answer: पीला
    difficulty: 2
    hints:
