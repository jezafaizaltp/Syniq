subject: cbse2-hin
chapter: 17
title: बरसात और मेंढक
tips:
  h2_mendhak: "मेंढक तालाब में तैरता भी है और किनारे पर फुदकता भी है। 'सिर्फ़' वाले उत्तर ध्यान से जाँचो।"
  h2_naav: "बहते पानी पर बच्चे कौन-सी चीज़ तैराते हैं? उसे एक पन्ना मोड़कर बनाया जा सकता है।"

concepts:
- code: cbse2h.17.barsaat
  title: बरसात और मेंढक
  notes: |
    बरसात और मेंढक पर कविता: बादल गरजते हैं, बारिश होती है, मेंढक टर्र-टर्र करते हैं, बच्चे कागज़ की नाव चलाते हैं। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: बरसात में बादल गरजते हैं और पानी बरसता है। तालाब भर जाते हैं और मेंढक खुश होकर टर्र-टर्र करते हैं। बच्चे कागज़ की नाव चलाते हैं।
    visual: 'चित्र बनाओ: बारिश, एक मेंढक पत्ते पर और पानी में कागज़ की नाव।'
    step_by_step: 1. कविता लय से पढ़ो। 2. बरसात में क्या-क्या होता है? 3. मेंढक क्या करता है? 4. तुकांत शब्द खोजो।
    real_world: केरल में जून से बरसात का मौसम शुरू होता है।
  picture:
    kind: flow
    steps:
    - बादल आए
    - बारिश हुई
    - तालाब भरा
    - मेंढक टर्राए
    alt: बादल आए, बारिश हुई, तालाब भरा और मेंढक टर्राए।
  activity:
    type: sort
    prompt: बरसात में क्या-क्या होता है?
    bins:
    - बरसात में होता है
    - बरसात में नहीं
    items:
    - label: 🐸 मेंढक टर्र-टर्र
      bin: बरसात में होता है
      clue: बारिश में कौन बोलता है?
      why: मेंढक बरसात में।
    - label: ⛵ कागज़ की नाव
      bin: बरसात में होता है
      clue: पानी भरी गली में?
      why: बच्चे नाव चलाते हैं।
    - label: ⚡ बादल गरजते हैं
      bin: बरसात में होता है
      clue: बारिश से पहले आवाज़?
      why: बादल गरजते हैं।
    - label: ⛄ बर्फ़ का पुतला
      bin: बरसात में नहीं
      clue: बर्फ़ कब गिरती है?
      why: यह सर्दी की बात है।
  items:
  - prompt: बरसात में मेंढक क्या करते हैं?
    options:
    - टर्र-टर्र
    - म्याऊँ-म्याऊँ
    - कुहू-कुहू
    - भौं-भौं
    answer: टर्र-टर्र
    difficulty: 1
    hints:
    - मेंढक की आवाज़।
    - ट से।
    solution: मेंढक टर्र-टर्र करते हैं।
    mistakes: {"म्याऊँ-म्याऊँ": "h1_awaaz", "कुहू-कुहू": "h1_awaaz", "भौं-भौं": "h1_awaaz"}
  - prompt: बारिश में हम क्या ले जाते हैं?
    options:
    - छाता
    - पतंग
    - धूप का चश्मा
    - स्वेटर ही
    answer: छाता
    difficulty: 1
    hints:
    - भीगने से बचाता है।
    - खुलता-बंद होता है।
    solution: बारिश में छाता ले जाते हैं।
    mistakes: {"पतंग": "h1_baarish_bachav", "धूप का चश्मा": "h1_baarish_bachav", "स्वेटर ही": "h1_baarish_bachav"}
  - prompt: बच्चे बारिश के पानी में क्या चलाते हैं?
    options:
    - कागज़ की नाव
    - रेलगाड़ी
    - हवाई जहाज़
    - साइकिल
    answer: कागज़ की नाव
    difficulty: 1
    hints:
    - पानी पर तैरती है।
    - कागज़ से बनती है।
    solution: बच्चे कागज़ की नाव चलाते हैं।
    mistakes: {"रेलगाड़ी": "h2_naav", "हवाई जहाज़": "h2_naav", "साइकिल": "h2_naav"}
  - prompt: मेंढक कहाँ-कहाँ रहता है?
    options:
    - पानी और ज़मीन दोनों पर
    - सिर्फ़ पेड़ पर
    - सिर्फ़ आसमान में
    - सिर्फ़ रेगिस्तान में
    answer: पानी और ज़मीन दोनों पर
    difficulty: 2
    hints:
    - तैरता भी, फुदकता भी।
    - तालाब का किनारा।
    solution: मेंढक पानी और ज़मीन दोनों पर रहता है।
    mistakes: {"सिर्फ़ पेड़ पर": "h2_mendhak", "सिर्फ़ आसमान में": "h2_mendhak", "सिर्फ़ रेगिस्तान में": "h2_mendhak"}
  - prompt: '''बरसात'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - रात
    - मेंढक
    - नाव
    - पानी
    answer: रात
    difficulty: 2
    hints:
    - आखिरी आवाज़ -आत।
    - बोलकर देखो।
    solution: बरसात और रात की तुक मिलती है।
    mistakes:
      नाव: hin2_sound
  - prompt: बादल गरजने को और क्या कहते हैं?
    options:
    - गड़गड़ाहट
    - चहचहाहट
    - भिनभिनाहट
    - फुसफुसाहट
    answer: गड़गड़ाहट
    difficulty: 2
    hints:
    - ज़ोर की आवाज़।
    - गड़-गड़।
    solution: बादल की गड़गड़ाहट।
    mistakes:
      चहचहाहट: hin2_word
