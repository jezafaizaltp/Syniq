subject: cbse2-hin
chapter: 17
title: बरसात और मेंढक
tips:
  h2_mendhak: "मेंढक तालाब में तैरता भी है और किनारे पर फुदकता भी है। 'सिर्फ़' वाले उत्तर ध्यान से जाँचो।"
  h2_naav: "बहते पानी पर बच्चे कौन-सी चीज़ तैराते हैं? उसे एक पन्ना मोड़कर बनाया जा सकता है।"
  c2h17_baarish: 'बरसात के दिन को याद करो: क्या दिखता है, क्या सुनाई देता है?'
  c2h17_tuk: दोनों शब्द बोलो। क्या अंत की आवाज़ एक जैसी है?
  c2h17_mendhak: 'मेंढक को याद करो: वह कहाँ रहता है, कैसे चलता है?'

concepts:
- code: cbse2h.17.barsaat
  title: बरसात और मेंढक
  notes: |
    बरसात और मेंढक पर कविता: बादल गरजते हैं, बारिश होती है, मेंढक टर्र-टर्र करते हैं, बच्चे कागज़ की नाव चलाते हैं। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: बरसात में बादल गरजते हैं और पानी बरसता है। तालाब भर जाते हैं और मेंढक खुश होकर टर्र-टर्र करते हैं। बच्चे कागज़ की नाव चलाते हैं।
    visual: 'चित्र बनाओ: बारिश, एक मेंढक पत्ते पर और पानी में कागज़ की नाव।'
    step_by_step: 1. कविता लय से पढ़ो। 2. बरसात में क्या-क्या होता है? 3. मेंढक क्या करता है? 4. तुकांत शब्द खोजो।
    real_world: केरल में जून से बरसात का मौसम शुरू होता है।
  picture:
    kind: flow
    steps:
    - बादल आए
    - बारिश हुई
    - तालाब भरा
    - मेंढक टर्राए
    alt: बादल आए, बारिश हुई, तालाब भरा और मेंढक टर्राए।
  activity:
    type: sort
    prompt: बरसात में क्या-क्या होता है?
    bins:
    - बरसात में होता है
    - बरसात में नहीं
    items:
    - label: 🐸 मेंढक टर्र-टर्र
      bin: बरसात में होता है
      clue: बारिश में कौन बोलता है?
      why: मेंढक बरसात में।
    - label: ⛵ कागज़ की नाव
      bin: बरसात में होता है
      clue: पानी भरी गली में?
      why: बच्चे नाव चलाते हैं।
    - label: ⚡ बादल गरजते हैं
      bin: बरसात में होता है
      clue: बारिश से पहले आवाज़?
      why: बादल गरजते हैं।
    - label: ⛄ बर्फ़ का पुतला
      bin: बरसात में नहीं
      clue: बर्फ़ कब गिरती है?
      why: यह सर्दी की बात है।
  lesson:
    - teach: बरसात में काले बादल छा जाते हैं, बादल गरजते हैं, बिजली चमकती है और झमाझम बारिश होती है। गड्ढों में पानी भर जाता है और बच्चे कागज़ की नाव चलाते हैं।
      picture:
        kind: flow
        steps:
        - काले बादल
        - गड़गड़ाहट और बिजली
        - झमाझम बारिश
        - कागज़ की नाव
        alt: 'बरसात का दिन: बादल, गरज, बारिश, नाव।'
      check:
        prompt: बारिश से पहले आसमान में क्या छा जाते हैं?
        options:
        - काले बादल
        - तारे
        - पतंगें
        answer: काले बादल
        why: पानी से भरे काले बादल बारिश लाते हैं।
      ways:
      - style: step_by_step
        teach: 'बारिश नापो। पहला: एक सीधा गिलास खुली जगह पर रखो। दूसरा: बारिश होने दो। तीसरा: बारिश रुकने पर देखो, गिलास में कितना पानी भरा। चौथा: अगले दिन फिर देखो और दोनों दिन मिलाओ।'
      - style: real_world
        teach: केरल में जून में मानसून आते ही कई दिनों तक लगातार बारिश होती है, और नदियाँ, कुएँ और तालाब भर जाते हैं।
    - teach: बरसात में मेंढक टर्र-टर्र करते हैं। मेंढक पानी में भी रहता है और ज़मीन पर भी। वह कूदकर चलता है और लंबी जीभ से कीड़े पकड़ता है।
      check:
        prompt: मेंढक कैसे चलता है?
        options:
        - कूदकर
        - उड़कर
        - रेंगकर
        answer: कूदकर
        why: मेंढक की पिछली टाँगें लंबी और ताकतवर होती हैं।
      ways:
      - style: visual
        teach: पानी में दिए अंडे से छोटा मेंढक बनने तक का पूरा सफ़र।
        picture:
          kind: flow
          steps:
          - मेंढकी पानी में ढेर सारे अंडे देती है
          - अंडों से छोटे टैडपोल निकलते हैं
          - टैडपोल की पूँछ होती है, वे मछली की तरह तैरते हैं
          - धीरे-धीरे पैर निकलते हैं और पूँछ छोटी होती जाती है
          - छोटा मेंढक पानी से निकलकर ज़मीन पर कूदता है
          alt: मेंढकी पानी में अंडे देती है। अंडों से पूँछ वाले टैडपोल निकलते हैं और तैरते हैं। फिर पैर निकलते हैं, पूँछ छोटी होती है, और छोटा मेंढक ज़मीन पर कूदने लगता है।
      - style: real_world
        teach: खेतों में मेंढक फसल खाने वाले बहुत से कीड़े खा जाते हैं, इसलिए उन्हें किसानों का दोस्त माना जाता है।
    - teach: 'बारिश के शब्द: टप-टप, झमाझम, रिमझिम। तुक वाले शब्द: बरसात-रात-बात, पानी-नानी-रानी। बारिश में छाता या रेनकोट लेते हैं।'
      check:
        prompt: हल्की-हल्की बारिश को क्या कहते हैं?
        options:
        - रिमझिम
        - झमाझम
        - गड़गड़
        answer: रिमझिम
        why: रिमझिम हल्की, धीमी बारिश है; झमाझम तेज़।
      ways:
      - style: visual
        teach: बरसात के मौसम से जुड़े कुछ शब्द, और उनसे तुक मिलाने वाले शब्द।
        picture:
          kind: compare
          columns:
          - title: शब्द
            points:
            - बादल
            - छाता
            - मोर
          - title: तुक वाला शब्द
            points:
            - काजल
            - आता
            - शोर
          alt: बादल और काजल, छाता और आता, मोर और शोर की आख़िरी आवाज़ मिलती है, इसलिए इनमें तुक है।
      - style: step_by_step
        teach: 'बारिश के लिए ठीक शब्द चुनो। पहला: बाहर की बारिश ध्यान से सुनो। दूसरा: धीमी और हल्की हो, तो ''रिमझिम''। तीसरा: बूँदें एक-एक करके गिरें, तो ''टप-टप''। चौथा: अपना वाक्य लिखो: ''आज रिमझिम बारिश हुई।'''
  items:
  - prompt: बरसात में मेंढक क्या करते हैं?
    options:
    - टर्र-टर्र
    - म्याऊँ-म्याऊँ
    - कुहू-कुहू
    - भौं-भौं
    answer: टर्र-टर्र
    difficulty: 1
    hints:
    - मेंढक की आवाज़।
    - ट से।
    solution: मेंढक टर्र-टर्र करते हैं।
    mistakes: {"म्याऊँ-म्याऊँ": "h1_awaaz", "कुहू-कुहू": "h1_awaaz", "भौं-भौं": "h1_awaaz"}
  - prompt: बारिश में हम क्या ले जाते हैं?
    options:
    - छाता
    - पतंग
    - धूप का चश्मा
    - स्वेटर ही
    answer: छाता
    difficulty: 1
    hints:
    - भीगने से बचाता है।
    - खुलता-बंद होता है।
    solution: बारिश में छाता ले जाते हैं।
    mistakes: {"पतंग": "h1_baarish_bachav", "धूप का चश्मा": "h1_baarish_bachav", "स्वेटर ही": "h1_baarish_bachav"}
  - prompt: बच्चे बारिश के पानी में क्या चलाते हैं?
    options:
    - कागज़ की नाव
    - रेलगाड़ी
    - हवाई जहाज़
    - साइकिल
    answer: कागज़ की नाव
    difficulty: 1
    hints:
    - पानी पर तैरती है।
    - कागज़ से बनती है।
    solution: बच्चे कागज़ की नाव चलाते हैं।
    mistakes: {"रेलगाड़ी": "h2_naav", "हवाई जहाज़": "h2_naav", "साइकिल": "h2_naav"}
  - prompt: मेंढक कहाँ-कहाँ रहता है?
    options:
    - पानी और ज़मीन दोनों पर
    - सिर्फ़ पेड़ पर
    - सिर्फ़ आसमान में
    - सिर्फ़ रेगिस्तान में
    answer: पानी और ज़मीन दोनों पर
    difficulty: 2
    hints:
    - तैरता भी, फुदकता भी।
    - तालाब का किनारा।
    solution: मेंढक पानी और ज़मीन दोनों पर रहता है।
    mistakes: {"सिर्फ़ पेड़ पर": "h2_mendhak", "सिर्फ़ आसमान में": "h2_mendhak", "सिर्फ़ रेगिस्तान में": "h2_mendhak"}
  - prompt: '''बरसात'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - रात
    - मेंढक
    - नाव
    - पानी
    answer: रात
    difficulty: 2
    hints:
    - आखिरी आवाज़ -आत।
    - बोलकर देखो।
    solution: बरसात और रात की तुक मिलती है।
    mistakes:
      नाव: hin2_sound
  - prompt: बादल गरजने को और क्या कहते हैं?
    options:
    - गड़गड़ाहट
    - चहचहाहट
    - भिनभिनाहट
    - फुसफुसाहट
    answer: गड़गड़ाहट
    difficulty: 2
    hints:
    - ज़ोर की आवाज़।
    - गड़-गड़।
    solution: बादल की गड़गड़ाहट।
    mistakes:
      चहचहाहट: hin2_word
  - prompt: मेंढक किस आवाज़ में बोलता है?
    options:
    - टर्र-टर्र
    - कुहू-कुहू
    - काँव-काँव
    answer: टर्र-टर्र
    difficulty: 1
    hints:
    - बरसात की रात में तालाब के पास सुनो।
    - कुहू-कुहू कोयल की आवाज़ है।
    solution: 'चरण 1: बरसात में मेंढक बोलते हैं। चरण 2: टर्र-टर्र।'
    mistakes:
      कुहू-कुहू: c2h17_mendhak
      काँव-काँव: c2h17_mendhak
  - prompt: '''पानी'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - नानी
    - पेड़
    - घर
    answer: नानी
    difficulty: 1
    hints:
    - पानी के अंत में 'आनी' है।
    - अंत की आवाज़ सुनो।
    solution: 'चरण 1: पानी ''आनी'' पर खत्म। चरण 2: नानी भी।'
    mistakes:
      पेड़: c2h17_tuk
      घर: c2h17_tuk
  - prompt: बारिश में भीगने से बचने के लिए क्या पहनते हैं?
    options:
    - रेनकोट
    - स्वेटर
    - चप्पल हाथ में
    answer: रेनकोट
    difficulty: 1
    hints:
    - नाम में 'रेन' है, जिसका अर्थ बारिश।
    - पानी इस पर से फिसल जाता है।
    solution: 'चरण 1: बारिश का पानी कपड़ों को भिगोता है। चरण 2: रेनकोट बचाता है।'
    mistakes:
      स्वेटर: c2h17_baarish
      चप्पल हाथ में: c2h17_baarish
  - prompt: बिजली चमकते समय कहाँ रहना सुरक्षित है?
    options:
    - घर के अंदर
    - खुले मैदान में
    - अकेले पेड़ के नीचे
    answer: घर के अंदर
    difficulty: 1
    hints:
    - खुली जगह पर बिजली गिर सकती है।
    - छत वाली पक्की जगह।
    solution: 'चरण 1: बिजली ऊँची, खुली जगहों पर गिरती है। चरण 2: घर के अंदर रहो।'
    mistakes:
      खुले मैदान में: c2h17_baarish
      अकेले पेड़ के नीचे: c2h17_baarish
  - prompt: तेज़ और ज़ोरदार बारिश को क्या कहते हैं?
    options:
    - झमाझम
    - रिमझिम
    - टिक-टिक
    answer: झमाझम
    difficulty: 2
    hints:
    - रिमझिम हल्की बारिश है।
    - बहुत सारा पानी एक साथ।
    solution: 'चरण 1: रिमझिम हल्की। चरण 2: झमाझम तेज़ बारिश।'
    mistakes:
      रिमझिम: c2h17_baarish
      टिक-टिक: c2h17_baarish
  - prompt: मेंढक कीड़े कैसे पकड़ता है?
    options:
    - लंबी चिपचिपी जीभ से
    - पंजों से
    - चोंच से
    answer: लंबी चिपचिपी जीभ से
    difficulty: 2
    hints:
    - मेंढक की चोंच नहीं होती।
    - मुँह से कुछ बाहर निकलता है।
    solution: 'चरण 1: मेंढक जीभ बाहर फेंकता है। चरण 2: कीड़ा चिपककर पकड़ में आ जाता है।'
    mistakes:
      पंजों से: c2h17_mendhak
      चोंच से: c2h17_mendhak
  - prompt: '''बात'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - बरसात
    - बादल
    - बिजली
    answer: बरसात
    difficulty: 2
    hints:
    - बात 'आत' पर खत्म होता है।
    - तीनों 'ब' से शुरू हैं; अंत देखो।
    solution: 'चरण 1: बात ''आत'' पर। चरण 2: बरसात भी ''आत'' पर।'
    mistakes:
      बादल: c2h17_tuk
      बिजली: c2h17_tuk
  - prompt: कागज़ की नाव पानी में क्यों चलती है?
    options:
    - हल्की होने से तैरती है
    - उसमें मोटर है
    - हवा में उड़ती है
    answer: हल्की होने से तैरती है
    difficulty: 2
    hints:
    - कागज़ बहुत हल्का है।
    - पत्ता भी पानी पर ऐसे ही रहता है।
    solution: 'चरण 1: कागज़ हल्का है। चरण 2: हल्की चीज़ें पानी पर तैरती हैं।'
    mistakes:
      उसमें मोटर है: c2h17_baarish
      हवा में उड़ती है: c2h17_baarish
  - prompt: बरसात में मेंढक ज़्यादा क्यों दिखते हैं?
    options:
    - पानी भरे गड्ढे और कीड़े बढ़ जाते हैं
    - उन्हें ठंड लगती है
    - वे स्कूल जाते हैं
