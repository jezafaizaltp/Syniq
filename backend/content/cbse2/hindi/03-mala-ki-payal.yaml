subject: cbse2-hin
chapter: 3
title: माला की चाँदी की पायल
tips:
  h2_gehne: "हर गहने की अपनी जगह है: चूड़ी कलाई में, माला गले में। इस गहने को पहनने की जगह सोचो।"
  h2_khoya: "रोने या दूसरों को दोष देने से चीज़ नहीं मिलती। कौन-सा तरीका चीज़ वापस दिला सकता है?"
  h2_matra: "शब्द धीरे बोलो: 'चाँ' और 'दी'। हर अक्षर के साथ लगा निशान देखो।"

concepts:
- code: cbse2h.03.mala
  title: माला की चाँदी की पायल
  notes: |
    माला और उसकी चाँदी की पायल के बारे में कहानी: पायल की छम-छम, किसी प्यारी चीज़ का खोना और ढूँढना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कहानी माला और उसकी चाँदी की पायल के बारे में है। पायल पैरों में पहनी जाती है और चलने पर छम-छम बजती है। प्यारी चीज़ खो जाए तो हम उसे ध्यान से ढूँढते हैं।
    visual: 'चित्र बनाओ: माला के पैरों में चमकती पायल और पास में लिखा ''छम-छम''।'
    step_by_step: 1. कहानी पढ़ो। 2. माला के पास क्या था? 3. पायल कैसी आवाज़ करती है? 4. खोई चीज़ कैसे ढूँढते हैं?
    real_world: शादी-त्योहारों में लड़कियाँ और औरतें पायल पहनती हैं।
  picture:
    kind: flow
    steps:
    - पायल पहनी
    - छम-छम बजी
    - पायल खोई
    - ध्यान से ढूँढा
    alt: माला ने पायल पहनी, वह छम-छम बजी, पायल खो गई, और ध्यान से ढूँढा गया।
  activity:
    type: order
    prompt: कोई प्यारी चीज़ खो जाए तो? क्रम से लगाओ।
    steps:
    - 😟 चीज़ खो जाती है
    - 🤔 याद करते हैं, आख़िरी बार कहाँ थी
    - 🔍 वहाँ ढूँढ़ते हैं
    - 😊 चीज़ मिल जाती है
    reasons:
      🤔 याद करते हैं, आख़िरी बार कहाँ थी: खोने के बाद ही याद करते हैं।
      🔍 वहाँ ढूँढ़ते हैं: याद आई जगह पर ढूँढ़ते हैं।
      😊 चीज़ मिल जाती है: ढूँढ़ने पर मिलती है।
  items:
  - prompt: पायल कहाँ पहनी जाती है?
    options:
    - पैरों में
    - हाथों में
    - कानों में
    - गले में
    answer: पैरों में
    difficulty: 1
    hints:
    - चलने पर बजती है।
    - नीचे।
    solution: पायल पैरों में पहनी जाती है।
    mistakes: {"हाथों में": "h2_gehne", "कानों में": "h2_gehne", "गले में": "h2_gehne"}
  - prompt: पायल कैसी आवाज़ करती है?
    options:
    - छम-छम
    - भौं-भौं
    - म्याऊँ
    - टर्र-टर्र
    answer: छम-छम
    difficulty: 1
    hints:
    - घुँघरू की आवाज़।
    - मीठी आवाज़।
    solution: पायल छम-छम करती है।
    mistakes: {"भौं-भौं": "h1_awaaz", "म्याऊँ": "h1_awaaz", "टर्र-टर्र": "h1_awaaz"}
  - prompt: माला की पायल किस चीज़ की है?
    options:
    - चाँदी
    - लकड़ी
    - कागज़
    - प्लास्टिक
    answer: चाँदी
    difficulty: 1
    hints:
    - पाठ का नाम देखो।
    - चमकदार धातु।
    solution: माला की पायल चाँदी की है।
    mistakes:
      लकड़ी: hin2_read_again
  - prompt: कोई चीज़ खो जाए तो क्या करना चाहिए?
    options:
    - शांत रहकर ढूँढना
    - रोते रहना
    - किसी पर इल्ज़ाम लगाना
    - भूल जाना
    answer: शांत रहकर ढूँढना
    difficulty: 2
    hints:
    - घबराओ मत।
    - ध्यान से देखो।
    solution: शांत रहकर ध्यान से ढूँढना चाहिए।
    mistakes: {"रोते रहना": "h2_khoya", "किसी पर इल्ज़ाम लगाना": "h2_khoya", "भूल जाना": "h2_khoya"}
  - prompt: कान में क्या पहनते हैं?
    options:
    - बाली
    - पायल
    - चूड़ी
    - मोज़े
    answer: बाली
    difficulty: 2
    hints:
    - कान का गहना।
    - ब से शुरू।
    solution: कान में बाली पहनते हैं।
    mistakes: {"पायल": "h2_gehne", "चूड़ी": "h2_gehne", "मोज़े": "h2_gehne"}
  - prompt: '''चाँदी'' शब्द में कौन-सी मात्रा है?'
    options:
    - आ और ई
    - उ
    - ए
    - ओ
    answer: आ और ई
    difficulty: 2
    hints:
    - चा + दी।
    - दोनों अक्षर देखो।
    solution: चाँ में आ की मात्रा और दी में ई की मात्रा है।
    mistakes: {"उ": "h2_matra", "ए": "h2_matra", "ओ": "h2_matra"}
