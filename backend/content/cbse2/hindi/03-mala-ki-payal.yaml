subject: cbse2-hin
chapter: 3
title: माला की चाँदी की पायल
tips:
  h2_gehne: "हर गहने की अपनी जगह है: चूड़ी कलाई में, माला गले में। इस गहने को पहनने की जगह सोचो।"
  h2_khoya: "रोने या दूसरों को दोष देने से चीज़ नहीं मिलती। कौन-सा तरीका चीज़ वापस दिला सकता है?"
  h2_matra: "शब्द धीरे बोलो: 'चाँ' और 'दी'। हर अक्षर के साथ लगा निशान देखो।"
  c2h3_akshar: शब्द को धीरे-धीरे बोलो और हर अक्षर पर एक ताली बजाओ।
  c2h3_gehna: 'शरीर के उस हिस्से को छूकर सोचो: वहाँ कौन-सा गहना पहनते हैं?'
  c2h3_dhundh: 'किसी चीज़ के खोने पर सोचो: कौन-सा तरीका उसे वापस दिलाएगा?'
  c2h3_dhvani: आवाज़ को मन में सुनो। कौन-सा शब्द वैसी ही आवाज़ करता है?

concepts:
- code: cbse2h.03.mala
  title: माला की चाँदी की पायल
  notes: |
    माला और उसकी चाँदी की पायल के बारे में कहानी: पायल की छम-छम, किसी प्यारी चीज़ का खोना और ढूँढना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कहानी माला और उसकी चाँदी की पायल के बारे में है। पायल पैरों में पहनी जाती है और चलने पर छम-छम बजती है। प्यारी चीज़ खो जाए तो हम उसे ध्यान से ढूँढते हैं।
    visual: 'चित्र बनाओ: माला के पैरों में चमकती पायल और पास में लिखा ''छम-छम''।'
    step_by_step: 1. कहानी पढ़ो। 2. माला के पास क्या था? 3. पायल कैसी आवाज़ करती है? 4. खोई चीज़ कैसे ढूँढते हैं?
    real_world: शादी-त्योहारों में लड़कियाँ और औरतें पायल पहनती हैं।
  picture:
    kind: flow
    steps:
    - पायल पहनी
    - छम-छम बजी
    - पायल खोई
    - ध्यान से ढूँढा
    alt: माला ने पायल पहनी, वह छम-छम बजी, पायल खो गई, और ध्यान से ढूँढा गया।
  activity:
    type: order
    prompt: कोई प्यारी चीज़ खो जाए तो? क्रम से लगाओ।
    steps:
    - 😟 चीज़ खो जाती है
    - 🤔 याद करते हैं, आख़िरी बार कहाँ थी
    - 🔍 वहाँ ढूँढ़ते हैं
    - 😊 चीज़ मिल जाती है
    reasons:
      🤔 याद करते हैं, आख़िरी बार कहाँ थी: खोने के बाद ही याद करते हैं।
      🔍 वहाँ ढूँढ़ते हैं: याद आई जगह पर ढूँढ़ते हैं।
      😊 चीज़ मिल जाती है: ढूँढ़ने पर मिलती है।
  lesson:
    - teach: 'माला की चाँदी की पायल चलने पर छम-छम बजती है। गहने अलग-अलग जगह पहनते हैं: पैरों में पायल, कानों में बाली, हाथ में चूड़ी, उँगली में अँगूठी, गले में माला या हार।'
      picture:
        kind: compare
        columns:
        - title: गहना
          points:
          - पायल
          - बाली
          - चूड़ी
          - अँगूठी
        - title: कहाँ
          points:
          - पैर
          - कान
          - हाथ
          - उँगली
        alt: गहने और उन्हें पहनने की जगह।
      check:
        prompt: अँगूठी कहाँ पहनते हैं?
        options:
        - उँगली में
        - कान में
        - पैर में
        answer: उँगली में
        why: अँगूठी गोल छल्ला है जो उँगली में आता है।
      ways:
      - style: step_by_step
        teach: 'गहनों का खेल खेलो। पहला: एक दोस्त शरीर का कोई हिस्सा छुए, जैसे नाक। दूसरा: तुम उस जगह का गहना बताओ: नथ। तीसरा: अब तुम कोई हिस्सा छुओ और दोस्त बताए। चौथा: बारी-बारी से खेलते रहो।'
      - style: real_world
        teach: 'शादी और त्योहार पर कई लोग नए कपड़ों के साथ गहने भी पहनते हैं: कहीं सोने के, कहीं मोतियों के, तो कहीं रंगीन काँच के।'
    - teach: कोई प्यारी चीज़ खो जाए तो घबराते नहीं। शांत होकर सोचते हैं कि आखिरी बार कहाँ देखी थी। फिर वहीं ढूँढते हैं और बड़ों से मदद माँगते हैं।
      picture:
        kind: flow
        steps:
        - शांत रहो
        - 'सोचो: आखिरी बार कहाँ थी?'
        - वहाँ ढूँढो
        - बड़ों से मदद लो
        alt: खोई चीज़ ढूँढने के चरण।
      check:
        prompt: खोई चीज़ ढूँढने से पहले क्या सोचते हैं?
        options:
        - आखिरी बार कहाँ देखी थी
        - आज कौन-सा दिन है
        - खाने में क्या है
        answer: आखिरी बार कहाँ देखी थी
        why: वहीं से ढूँढना शुरू करने पर चीज़ जल्दी मिलती है।
      ways:
      - style: step_by_step
        teach: 'चीज़ें खोने से बचाओ। पहला: हर चीज़ के लिए एक तय जगह बनाओ। दूसरा: काम के बाद उसे वहीं रखो। तीसरा: अपने बस्ते और डिब्बे पर नाम लिखो। चौथा: रात को अगले दिन का सामान एक जगह रख दो।'
      - style: real_world
        teach: रेलवे स्टेशन पर 'खोया-पाया' दफ़्तर होता है। वहाँ लोगों की छूटी हुई चीज़ें सँभालकर रखी जाती हैं, ताकि वे वापस मिल सकें।
    - teach: 'आवाज़ वाले शब्द: पायल छम-छम, घंटी टन-टन, बारिश टप-टप, घड़ी टिक-टिक। ''चाँदी'' में ''चाँ'' पर आ की मात्रा और ''दी'' पर ई की मात्रा है।'
      check:
        prompt: घड़ी कैसी आवाज़ करती है?
        options:
        - टिक-टिक
        - छम-छम
        - म्याऊँ
        answer: टिक-टिक
        why: घड़ी की सुई चलने पर टिक-टिक होती है।
      ways:
      - style: visual
        teach: कुछ और चीज़ें, और उनकी आवाज़ बताने वाले शब्द।
        picture:
          kind: compare
          columns:
          - title: चीज़
            points:
            - ढोल
            - सूखे पत्ते
            - दरवाज़े पर दस्तक
          - title: आवाज़
            points:
            - ढम-ढम
            - चर-चर
            - खट-खट
          alt: ढोल ढम-ढम बजता है, सूखे पत्ते चर-चर करते हैं, और दरवाज़े पर दस्तक खट-खट करती है।
      - style: step_by_step
        teach: 'मात्रा पहचानो। पहला: शब्द ''मीठा'' लो। दूसरा: पहला अक्षर ''मी'' देखो: इसमें ई (ी) की मात्रा है। तीसरा: दूसरा अक्षर ''ठा'' देखो: इसमें आ (ा) की मात्रा है। चौथा: हर अक्षर में अलग से मात्रा ढूँढो।'
  items:
  - prompt: पायल कहाँ पहनी जाती है?
    options:
    - पैरों में
    - हाथों में
    - कानों में
    - गले में
    answer: पैरों में
    difficulty: 1
    hints:
    - चलने पर बजती है।
    - नीचे।
    solution: पायल पैरों में पहनी जाती है।
    mistakes: {"हाथों में": "h2_gehne", "कानों में": "h2_gehne", "गले में": "h2_gehne"}
  - prompt: पायल कैसी आवाज़ करती है?
    options:
    - छम-छम
    - भौं-भौं
    - म्याऊँ
    - टर्र-टर्र
    answer: छम-छम
    difficulty: 1
    hints:
    - घुँघरू की आवाज़।
    - मीठी आवाज़।
    solution: पायल छम-छम करती है।
    mistakes: {"भौं-भौं": "h1_awaaz", "म्याऊँ": "h1_awaaz", "टर्र-टर्र": "h1_awaaz"}
  - prompt: माला की पायल किस चीज़ की है?
    options:
    - चाँदी
    - लकड़ी
    - कागज़
    - प्लास्टिक
    answer: चाँदी
    difficulty: 1
    hints:
    - पाठ का नाम देखो।
    - चमकदार धातु।
    solution: माला की पायल चाँदी की है।
    mistakes:
      लकड़ी: hin2_read_again
  - prompt: कोई चीज़ खो जाए तो क्या करना चाहिए?
    options:
    - शांत रहकर ढूँढना
    - रोते रहना
    - किसी पर इल्ज़ाम लगाना
    - भूल जाना
    answer: शांत रहकर ढूँढना
    difficulty: 2
    hints:
    - घबराओ मत।
    - ध्यान से देखो।
    solution: शांत रहकर ध्यान से ढूँढना चाहिए।
    mistakes: {"रोते रहना": "h2_khoya", "किसी पर इल्ज़ाम लगाना": "h2_khoya", "भूल जाना": "h2_khoya"}
  - prompt: कान में क्या पहनते हैं?
    options:
    - बाली
    - पायल
    - चूड़ी
    - मोज़े
    answer: बाली
    difficulty: 2
    hints:
    - कान का गहना।
    - ब से शुरू।
    solution: कान में बाली पहनते हैं।
    mistakes: {"पायल": "h2_gehne", "चूड़ी": "h2_gehne", "मोज़े": "h2_gehne"}
  - prompt: '''चाँदी'' शब्द में कौन-सी मात्रा है?'
    options:
    - आ और ई
    - उ
    - ए
    - ओ
    answer: आ और ई
    difficulty: 2
    hints:
    - चा + दी।
    - दोनों अक्षर देखो।
    solution: चाँ में आ की मात्रा और दी में ई की मात्रा है।
    mistakes: {"उ": "h2_matra", "ए": "h2_matra", "ओ": "h2_matra"}
  - prompt: चूड़ियाँ कहाँ पहनते हैं?
    options:
    - कलाई में
    - कान में
    - पैरों में
    answer: कलाई में
    difficulty: 1
    hints:
    - हाथ हिलाओ तो खन-खन बजती हैं।
    - हाथ और बाँह के बीच का हिस्सा।
    solution: 'चरण 1: चूड़ियाँ गोल होती हैं। चरण 2: उन्हें कलाई में पहनते हैं।'
    mistakes:
      कान में: c2h3_gehna
      पैरों में: c2h3_gehna
  - prompt: बारिश की बूँदें कैसी आवाज़ करती हैं?
    options:
    - टप-टप
    - टिक-टिक
    - भौं-भौं
    answer: टप-टप
    difficulty: 1
    hints:
    - छत पर गिरती बूँदें सुनो।
    - भौं-भौं तो कुत्ता करता है।
    solution: 'चरण 1: बूँदें एक-एक कर गिरती हैं। चरण 2: टप-टप आवाज़ होती है।'
    mistakes:
      टिक-टिक: c2h3_dhvani
      भौं-भौं: c2h3_dhvani
  - prompt: गले में कौन-सा गहना पहनते हैं?
    options:
    - हार
    - पायल
    - अँगूठी
    answer: हार
    difficulty: 1
    hints:
    - यह लंबा होता है और गर्दन के चारों ओर आता है।
    - पायल पैर में आती है।
    solution: 'चरण 1: गले के चारों ओर लंबा गहना चाहिए। चरण 2: वह हार है।'
    mistakes:
      पायल: c2h3_gehna
      अँगूठी: c2h3_gehna
  - prompt: स्कूल में तुम्हारी पेंसिल खो गई। सबसे अच्छा क्या है?
    options:
    - शांत रहकर बस्ते और मेज़ में देखना, फिर शिक्षक को बताना
    - ज़ोर-ज़ोर से रोना
    - दोस्त की पेंसिल चुपके से ले लेना
    answer: शांत रहकर बस्ते और मेज़ में देखना, फिर शिक्षक को बताना
    difficulty: 1
    hints:
    - घबराने से चीज़ नहीं मिलती।
    - दूसरे की चीज़ लेना ठीक नहीं।
    solution: 'चरण 1: शांत होकर पास की जगहें देखो। चरण 2: न मिले तो शिक्षक को बताओ।'
    mistakes:
      ज़ोर-ज़ोर से रोना: c2h3_dhundh
      दोस्त की पेंसिल चुपके से ले लेना: c2h3_dhundh
  - prompt: मंदिर की घंटी कैसी बजती है?
    options:
    - टन-टन
    - छम-छम
    - टप-टप
    answer: टन-टन
    difficulty: 1
    hints:
    - धातु की बड़ी घंटी।
    - छम-छम पायल की आवाज़ है।
    solution: 'चरण 1: घंटी धातु की होती है। चरण 2: वह टन-टन बजती है।'
    mistakes:
      छम-छम: c2h3_dhvani
      टप-टप: c2h3_dhvani
  - prompt: '''पायल'' शब्द में कितने अक्षर हैं?'
    options:
    - तीन
    - दो
    - चार
    answer: तीन
    difficulty: 2
    hints:
    - 'धीरे बोलो: पा ... ।'
    - हर अक्षर पर ताली बजाओ।
    solution: 'चरण 1: पा + य + ल। चरण 2: तीन अक्षर।'
    mistakes:
      दो: c2h3_akshar
      चार: c2h3_akshar
  - prompt: चाँदी किस रंग की होती है?
    options:
    - सफ़ेद-चमकीली
    - लाल
    - हरी
    answer: सफ़ेद-चमकीली
    difficulty: 2
    hints:
    - चाँदी की पायल या सिक्का याद करो।
    - सोना पीला होता है, यह नहीं।
    solution: 'चरण 1: चाँदी एक धातु है। चरण 2: उसका रंग सफ़ेद-चमकीला होता है।'
    mistakes:
      लाल: c2h3_gehna
      हरी: c2h3_gehna
  - prompt: किस शब्द में ई (ी) की मात्रा है?
    options:
    - बाली
    - पायल
    - हार
    answer: बाली
    difficulty: 2
    hints:
    - हर शब्द का आखिरी अक्षर देखो।
    - ी की मात्रा अक्षर के दाईं ओर लंबी खड़ी लकीर है।
    solution: 'चरण 1: पायल और हार में ई की मात्रा नहीं। चरण 2: बाली में ''ली'' पर ई की मात्रा है।'
    mistakes:
      पायल: h2_matra
      हार: h2_matra
  - prompt: 'खोई पायल ढूँढने के चरण क्रम में लगाओ: (1) वहाँ ढूँढो (2) शांत रहो (3) सोचो आखिरी बार कहाँ थी। पहला चरण कौन-सा है?'
    options:
    - शांत रहो
    - वहाँ ढूँढो
    - सोचो आखिरी बार कहाँ थी
