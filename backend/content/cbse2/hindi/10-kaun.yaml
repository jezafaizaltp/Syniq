  - prompt: 'स्थिति (केस): कक्षा में पहेली पूछी गई: ''मैं पीला हूँ, लंबा हूँ, छीलकर खाया जाता हूँ; बंदर मुझे बहुत पसंद करता है।'' उत्तर क्या है?'
