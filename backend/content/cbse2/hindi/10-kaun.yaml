subject: cbse2-hin
chapter: 10
title: कौन
concepts:
- code: cbse2h.10.kaun
  title: कौन
  notes: |
    'कौन' पर पहेलियों वाली कविता: कौन गाता है, कौन उड़ता है, कौन रोशनी देता है। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: 'इस कविता में ''कौन?'' पूछकर पहेलियाँ बुझाई गई हैं: कौन आसमान में चमकता है? कौन मीठा गाता है? सोचकर उत्तर दो।'
    visual: 'चित्र बनाओ: एक सवालिया निशान और उसके चारों ओर सूरज, कोयल और मछली।'
    step_by_step: 1. कविता पढ़ो। 2. हर 'कौन' वाला सवाल ढूँढो। 3. सोचकर उत्तर दो। 4. अपनी पहेली बनाओ।
    real_world: 'बच्चे खेल में पहेलियाँ पूछते हैं: ''हरी थी मन भरी थी...'''
  picture:
    kind: compare
    columns:
    - title: कौन?
      points:
      - रोशनी देता
      - मीठा गाती
      - पानी में तैरती
    - title: उत्तर
      points:
      - सूरज
      - कोयल
      - मछली
    alt: रोशनी सूरज देता है, मीठा कोयल गाती है, और पानी में मछली तैरती है।
  items:
  - prompt: कौन दिन में रोशनी देता है?
    options:
    - सूरज
    - चाँद
    - तारा
    - बादल
    answer: सूरज
    difficulty: 1
    hints:
    - दिन में चमकता।
    - गरम।
    solution: सूरज रोशनी देता है।
  - prompt: कौन मीठा गाती है?
    options:
    - कोयल
    - कौआ
    - गाय
    - बिल्ली
    answer: कोयल
    difficulty: 1
    hints:
    - कुहू-कुहू।
    - काली चिड़िया।
    solution: कोयल मीठा गाती है।
  - prompt: कौन पानी में रहती है?
    options:
    - मछली
    - चिड़िया
    - बकरी
    - गिलहरी
    answer: मछली
    difficulty: 1
    hints:
    - तैरती है।
    - तालाब।
    solution: मछली पानी में रहती है।
  - prompt: '''कौन'' से हम क्या पूछते हैं?'
    options:
    - किसी व्यक्ति या जीव के बारे में
    - समय के बारे में
    - गिनती के बारे में
    - जगह के बारे में
    answer: किसी व्यक्ति या जीव के बारे में
    difficulty: 2
    hints:
    - '''वह कौन है?'''
    - किसी का नाम जानना।
    solution: '''कौन'' किसी व्यक्ति या जीव के बारे में पूछता है।'
    mistakes:
      जगह के बारे में: hin2_word
  - prompt: जगह पूछने के लिए कौन-सा शब्द है?
    options:
    - कहाँ
    - कौन
    - कब
    - कितना
    answer: कहाँ
    difficulty: 2
    hints:
    - '''तुम ___ रहते हो?'''
    - जगह।
    solution: जगह के लिए 'कहाँ' पूछते हैं।
  - prompt: रात में कौन चमकता है?
    options:
    - चाँद
    - सूरज
    - इंद्रधनुष
    - बादल
    answer: चाँद
    difficulty: 1
    hints:
    - अँधेरे में।
    - चंदा मामा।
    solution: रात में चाँद चमकता है।
