    - मछली
    - बत्तख
    answer: मेंढक
    difficulty: 3
    hints:
    - मछली ज़मीन पर नहीं रहती।
    - टर्र-टर्र किसकी आवाज़ है?
    solution: 'चरण 1: पानी और ज़मीन दोनों पर, हरा रंग। चरण 2: टर्र-टर्र: मेंढक।'
    mistakes:
