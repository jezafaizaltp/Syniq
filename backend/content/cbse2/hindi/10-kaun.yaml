    solution: 'चरण 1: कब समय, कहाँ जगह पूछता है। चरण 2: ''कौन'' व्यक्ति पूछता है।'
    mistakes:
      बस कब आएगी?: c2h10_prashn
      गेंद कहाँ है?: c2h10_prashn
  - prompt: 'पहेली: ''पानी में भी, ज़मीन पर भी; हरा है, टर्र-टर्र बोले।'' कौन?'
