subject: cbse2-hin
chapter: 10
title: कौन
tips:
  h2_din_roshni: "चाँद-तारे रात में चमकते हैं। सुबह आसमान में कौन आता है जिससे उजाला होता है?"
  h2_koyal: "कौआ काँव-काँव करता है। 'कुहू-कुहू' कौन गाता है?"
  h2_paani_jeev: "कौन-सा जीव पानी से बाहर निकाल दो तो जी नहीं पाता?"
  h2_prashn: "'कौन' व्यक्ति पूछता है, 'कब' समय, 'कितना' गिनती। 'तुम ___ रहते हो?' में कौन-सा बैठेगा?"
  c2h10_jeev: उस जीव को मन में देखो। वह कहाँ रहता है, क्या करता है?
  c2h10_prashn: 'प्रश्न-शब्द देखो: व्यक्ति, जगह, समय या चीज़ में से किसके बारे में पूछ रहा है?'
  c2h10_paheli: पहेली के हर इशारे को एक-एक करके मिलाओ।

concepts:
- code: cbse2h.10.kaun
  title: कौन
  notes: |
    'कौन' पर पहेलियों वाली कविता: कौन गाता है, कौन उड़ता है, कौन रोशनी देता है। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: 'इस कविता में ''कौन?'' पूछकर पहेलियाँ बुझाई गई हैं: कौन आसमान में चमकता है? कौन मीठा गाता है? सोचकर उत्तर दो।'
    visual: 'चित्र बनाओ: एक सवालिया निशान और उसके चारों ओर सूरज, कोयल और मछली।'
    step_by_step: 1. कविता पढ़ो। 2. हर 'कौन' वाला सवाल ढूँढो। 3. सोचकर उत्तर दो। 4. अपनी पहेली बनाओ।
    real_world: 'बच्चे खेल में पहेलियाँ पूछते हैं: ''हरी थी मन भरी थी...'''
  picture:
    kind: compare
    columns:
    - title: कौन?
      points:
      - रोशनी देता
      - मीठा गाती
      - पानी में तैरती
    - title: उत्तर
      points:
      - सूरज
      - कोयल
      - मछली
    alt: रोशनी सूरज देता है, मीठा कोयल गाती है, और पानी में मछली तैरती है।
  activity:
    type: sort
    prompt: 'पहेली: कौन क्या करता है?'
    bins:
    - गाता है
    - उड़ता है
    - रोशनी देता है
    items:
    - label: 🐦 कोयल
      bin: गाता है
      clue: कुहू-कुहू कौन?
      why: कोयल गाती है।
    - label: 🦋 तितली
      bin: उड़ता है
      clue: फूल-फूल पर कौन जाती है?
      why: तितली उड़ती है।
    - label: ✈️ हवाई जहाज़
      bin: उड़ता है
      clue: आसमान में कौन?
      why: जहाज़ उड़ता है।
    - label: ☀️ सूरज
      bin: रोशनी देता है
      clue: दिन में उजाला?
      why: सूरज रोशनी देता है।
    - label: 🪔 दीया
      bin: रोशनी देता है
      clue: रात में घर में?
      why: दीया रोशनी देता है।
  lesson:
    - teach: '''कौन'' कविता पहेलियों जैसी है: कौन दिन में रोशनी देता है? सूरज। कौन रात में चमकता है? चाँद। कौन मीठा गाती है? कोयल। कौन पानी में रहती है? मछली।'
      check:
        prompt: रात में आसमान में टिमटिमाते छोटे-छोटे कौन हैं?
        options:
        - तारे
        - बादल
        - पक्षी
        answer: तारे
        why: रात में तारे टिमटिमाते हैं।
      ways:
      - style: visual
        teach: कुछ और 'कौन' वाले प्रश्न, और हर एक का सही उत्तर।
        picture:
          kind: compare
          columns:
          - title: प्रश्न
            points:
            - कौन दूध देती है?
            - कौन जाला बुनती है?
            - कौन सूँड़ हिलाता है?
          - title: उत्तर
            points:
            - गाय
            - मकड़ी
            - हाथी
          alt: गाय दूध देती है, मकड़ी जाला बुनती है, और हाथी सूँड़ हिलाता है।
      - style: real_world
        teach: रात को सोने से पहले कई दादी-नानी बच्चों से पहेलियाँ पूछती हैं, और बच्चे सोच-सोचकर उत्तर ढूँढते हैं।
    - teach: 'प्रश्न पूछने वाले शब्द: कौन (व्यक्ति या जीव), क्या (चीज़), कहाँ (जगह), कब (समय), कैसे (तरीका), कितने (गिनती)।'
      picture:
        kind: compare
        columns:
        - title: शब्द
          points:
          - कौन
          - कहाँ
          - कब
          - कितने
        - title: किसके बारे में
          points:
          - व्यक्ति या जीव
          - जगह
          - समय
          - गिनती
        alt: प्रश्न-शब्द और वे किसके बारे में पूछते हैं।
      check:
        prompt: समय पूछने के लिए कौन-सा शब्द है?
        options:
        - कब
        - कहाँ
        - कौन
        answer: कब
        why: '''कब'' समय के बारे में पूछता है: तुम कब उठे?'
      ways:
      - style: step_by_step
        teach: 'सही प्रश्न-शब्द चुनो। पहला: सोचो, तुम्हें क्या जानना है। दूसरा: किसी व्यक्ति के बारे में? तो ''कौन''। तीसरा: समय के बारे में? तो ''कब''। चौथा: तरीके के बारे में? तो ''कैसे''।'
      - style: real_world
        teach: 'डॉक्टर मरीज़ से पूछते हैं: दर्द कहाँ है? कब से है? चोट कैसे लगी? हर प्रश्न से एक अलग बात पता चलती है।'
    - teach: 'पहेली में इशारे होते हैं। हर इशारा जोड़ो: ''पानी में रहती, तैरती है, पंख जैसे पर हैं'' = मछली। ''काला है, काँव-काँव करता है'' = कौआ।'
      check:
        prompt: '''हरा है, बोलना सीख लेता है, लाल चोंच है।'' कौन?'
        options:
        - तोता
        - कौआ
        - मोर
        answer: तोता
        why: 'हरा रंग, लाल चोंच और बोलना: तोता।'
      ways:
      - style: visual
        teach: एक पहेली को उसके इशारों से कदम-कदम करके सुलझाना।
        picture:
          kind: flow
          steps:
          - 'पहला इशारा पढ़ो: ''मेरी गर्दन बहुत लंबी है'''
          - सोचो, किसकी गर्दन लंबी होती है
          - 'दूसरा इशारा पढ़ो: ''मैं पेड़ों के ऊँचे पत्ते खाता हूँ'''
          - दोनों इशारे मिलाओ
          - 'उत्तर: जिराफ़'
          alt: 'पहला इशारा: लंबी गर्दन। दूसरा इशारा: पेड़ों के ऊँचे पत्ते खाता है। दोनों इशारे मिलाने पर उत्तर है जिराफ़।'
      - style: real_world
        teach: खज़ाना-खोज खेल में हर पर्ची पर एक इशारा होता है। सारे इशारे जोड़ने पर ही खज़ाना मिलता है।
  items:
  - prompt: कौन दिन में रोशनी देता है?
    options:
    - सूरज
    - चाँद
    - तारा
    - बादल
    answer: सूरज
    difficulty: 1
    hints:
    - दिन में चमकता।
    - गरम।
    solution: सूरज रोशनी देता है।
    mistakes: {"चाँद": "h2_din_roshni", "तारा": "h2_din_roshni", "बादल": "h2_din_roshni"}
  - prompt: कौन मीठा गाती है?
    options:
    - कोयल
    - कौआ
    - गाय
    - बिल्ली
    answer: कोयल
    difficulty: 1
    hints:
    - कुहू-कुहू।
    - काली चिड़िया।
    solution: कोयल मीठा गाती है।
    mistakes: {"कौआ": "h2_koyal", "गाय": "h2_koyal", "बिल्ली": "h2_koyal"}
  - prompt: कौन पानी में रहती है?
    options:
    - मछली
    - चिड़िया
    - बकरी
    - गिलहरी
    answer: मछली
    difficulty: 1
    hints:
    - तैरती है।
    - तालाब।
    solution: मछली पानी में रहती है।
    mistakes: {"चिड़िया": "h2_paani_jeev", "बकरी": "h2_paani_jeev", "गिलहरी": "h2_paani_jeev"}
  - prompt: '''कौन'' से हम क्या पूछते हैं?'
    options:
    - किसी व्यक्ति या जीव के बारे में
    - समय के बारे में
    - गिनती के बारे में
    - जगह के बारे में
    answer: किसी व्यक्ति या जीव के बारे में
    difficulty: 2
    hints:
    - '''वह कौन है?'''
    - किसी का नाम जानना।
    solution: '''कौन'' किसी व्यक्ति या जीव के बारे में पूछता है।'
    mistakes:
      जगह के बारे में: hin2_word
  - prompt: जगह पूछने के लिए कौन-सा शब्द है?
    options:
    - कहाँ
    - कौन
    - कब
    - कितना
    answer: कहाँ
    difficulty: 2
    hints:
    - '''तुम ___ रहते हो?'''
    - जगह।
    solution: जगह के लिए 'कहाँ' पूछते हैं।
    mistakes: {"कौन": "h2_prashn", "कब": "h2_prashn", "कितना": "h2_prashn"}
  - prompt: रात में कौन चमकता है?
    options:
    - चाँद
    - सूरज
    - इंद्रधनुष
    - बादल
    answer: चाँद
    difficulty: 1
    hints:
    - अँधेरे में।
    - चंदा मामा।
    solution: रात में चाँद चमकता है।
    mistakes: {"सूरज": "h1_raat_aasmaan", "इंद्रधनुष": "h1_raat_aasmaan", "बादल": "h1_raat_aasmaan"}
  - prompt: मुर्गा सुबह-सुबह क्या करता है?
    options:
    - कुकड़ूँ-कूँ बोलकर जगाता है
    - रात को चमकता है
    - पानी में तैरता है
    answer: कुकड़ूँ-कूँ बोलकर जगाता है
    difficulty: 1
    hints:
    - सुबह होते ही इसकी आवाज़ आती है।
    - यह खेत या आँगन में रहता है।
    solution: 'चरण 1: मुर्गा सुबह जल्दी उठता है। चरण 2: कुकड़ूँ-कूँ बोलकर जगाता है।'
    mistakes:
      रात को चमकता है: c2h10_jeev
      पानी में तैरता है: c2h10_jeev
  - prompt: 'जगह पूछनी है: ''तुम्हारा घर ___ है?'''
    options:
    - कहाँ
    - कब
    - कौन
    answer: कहाँ
    difficulty: 1
    hints:
    - घर एक जगह है।
    - '''कब'' समय के लिए है।'
    solution: 'चरण 1: घर जगह है। चरण 2: जगह के लिए ''कहाँ''।'
    mistakes:
      कब: c2h10_prashn
      कौन: c2h10_prashn
  - prompt: '''कौन'' कविता में फूलों पर कौन मँडराती है और रस पीती है?'
    options:
    - तितली
    - मछली
    - बिल्ली
    answer: तितली
    difficulty: 1
    hints:
    - इसके रंग-बिरंगे पंख होते हैं।
    - यह फूल से फूल उड़ती है।
    solution: 'चरण 1: फूलों पर उड़ने वाला कीट। चरण 2: तितली रस पीती है।'
    mistakes:
      मछली: c2h10_jeev
      बिल्ली: c2h10_jeev
  - prompt: 'गिनती पूछनी है: ''तुम्हारे पास ___ पेंसिलें हैं?'''
    options:
    - कितनी
