    - 'जैसे: तीन पेंसिलें।'
    solution: 'चरण 1: जवाब में गिनती चाहिए। चरण 2: ''कितनी'' लगाओ।'
    mistakes:
      कहाँ: c2h10_prashn
      कौन: c2h10_prashn
  - prompt: 'पहेली: ''काला है, काँव-काँव करता है।'' कौन?'
    options:
    - कौआ
    - कोयल
    - तोता
    answer: कौआ
    difficulty: 1
    hints:
    - काँव-काँव की आवाज़ सुनो।
    - कोयल कुहू-कुहू करती है।
    solution: 'चरण 1: काला रंग और काँव-काँव। चरण 2: कौआ।'
    mistakes:
      कोयल: c2h10_paheli
      तोता: c2h10_paheli
  - prompt: '''तुम ___ उठे?'' जवाब है: ''सुबह सात बजे।'''
    options:
    - कब
    - कहाँ
    - कैसे
    answer: कब
    difficulty: 2
    hints:
    - जवाब में समय है।
    - समय पूछने वाला शब्द।
    solution: 'चरण 1: ''सुबह सात बजे'' समय है। चरण 2: समय के लिए ''कब''।'
    mistakes:
      कहाँ: c2h10_prashn
      कैसे: c2h10_prashn
  - prompt: 'पहेली: ''चार पैर, लंबी पूँछ, म्याऊँ बोले।'' कौन?'
