title: चंदा मामा
tips:
  h2_chanda_shabd: "कविता का नाम 'चंदा मामा' है। सबका पहला अक्षर 'च' है, पर आसमान में कौन है?"

concepts:
- code: cbse2h.23.chanda
  title: चंदा मामा
  notes: |
    चंदा मामा पर कविता: रात में चमकता चाँद, तारे, चाँद का घटना-बढ़ना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: रात में आसमान में चाँद चमकता है। बच्चे प्यार से उसे चंदा मामा कहते हैं। चाँद कभी पूरा गोल, कभी आधा और कभी पतला दिखता है।
    visual: 'चित्र बनाओ: रात का आसमान, गोल चाँद और आसपास तारे।'
    step_by_step: 1. कविता लय से पढ़ो। 2. चंदा मामा कब दिखते हैं? 3. उनके साथ कौन चमकते हैं? 4. तुकांत शब्द खोजो।
    real_world: पूर्णिमा की रात चाँद पूरा गोल और बहुत चमकीला होता है।
  picture:
    kind: flow
    steps:
    - पतला चाँद
    - आधा चाँद
    - पूरा गोल चाँद
    alt: चाँद पतला दिखता है, फिर आधा, फिर पूरा गोल।
  items:
  - prompt: चंदा मामा कब दिखते हैं?
    options:
    - रात में
    - दोपहर में धूप में
    - कभी नहीं
    - सिर्फ़ बारिश में
    answer: रात में
    difficulty: 1
    hints:
    - अँधेरे में चमकते हैं।
    - सोने के समय।
    solution: चंदा मामा रात में दिखते हैं।
    mistakes: {"दोपहर में धूप में": "h1_raat_aasmaan", "कभी नहीं": "h1_raat_aasmaan", "सिर्फ़ बारिश में": "h1_raat_aasmaan"}
  - prompt: रात में चाँद के साथ और क्या चमकता है?
    options:
    - तारे
    - सूरज
    - इंद्रधनुष
    - बादल
    answer: तारे
    difficulty: 1
    hints:
    - टिम-टिम।
    - बहुत सारे।
    solution: रात में तारे भी चमकते हैं।
    mistakes: {"सूरज": "h1_raat_aasmaan", "इंद्रधनुष": "h1_raat_aasmaan", "बादल": "h1_raat_aasmaan"}
  - prompt: बच्चे चाँद को प्यार से क्या कहते हैं?
    options:
    - चंदा मामा
    - सूरज दादा
    - बादल भैया
    - तारा दीदी
    answer: चंदा मामा
    difficulty: 1
    hints:
    - पाठ का नाम।
    - मामा।
    solution: बच्चे चाँद को चंदा मामा कहते हैं।
    mistakes: {"सूरज दादा": "h1_chanda", "बादल भैया": "h1_chanda", "तारा दीदी": "h1_chanda"}
  - prompt: पूरा गोल चाँद किस रात दिखता है?
    options:
    - पूर्णिमा
    - अमावस
    - रविवार
    - हर रात
    answer: पूर्णिमा
    difficulty: 2
    hints:
    - पूर्ण यानी पूरा।
    - पू से शुरू।
    solution: पूर्णिमा को पूरा चाँद दिखता है।
    mistakes:
      अमावस: hin2_word
  - prompt: '''चंदा'' शब्द किसके लिए है?'
    options:
    - चाँद
    - चाय
    - चम्मच
    - चिड़िया
    answer: चाँद
    difficulty: 2
    hints:
    - आसमान में।
    - मामा।
    solution: चंदा यानी चाँद।
    mistakes: {"चाय": "h2_chanda_shabd", "चम्मच": "h2_chanda_shabd", "चिड़िया": "h2_chanda_shabd"}
  - prompt: '''मामा'' में कौन-सा अक्षर दो बार आया है?'
    options:
    - म
    - च
    - त
    - न
    answer: म
    difficulty: 2
    hints:
    - मा + मा।
    - पहली आवाज़ सुनो।
    solution: मामा में 'म' दो बार आया है।
    mistakes:
      न: hin2_sound
