subject: cbse2-hin
chapter: 23
title: चंदा मामा
tips:
  h2_chanda_shabd: "कविता का नाम 'चंदा मामा' है। सबका पहला अक्षर 'च' है, पर आसमान में कौन है?"
  c2h23_chaand: रात का आसमान याद करो। चाँद कब, कैसा दिखता है?
  c2h23_tuk: दोनों शब्द बोलो। क्या अंत की आवाज़ एक जैसी है?
  c2h23_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। अर्थ ठीक बैठता है?

concepts:
- code: cbse2h.23.chanda
  title: चंदा मामा
  notes: |
    चंदा मामा पर कविता: रात में चमकता चाँद, तारे, चाँद का घटना-बढ़ना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: रात में आसमान में चाँद चमकता है। बच्चे प्यार से उसे चंदा मामा कहते हैं। चाँद कभी पूरा गोल, कभी आधा और कभी पतला दिखता है।
    visual: 'चित्र बनाओ: रात का आसमान, गोल चाँद और आसपास तारे।'
    step_by_step: 1. कविता लय से पढ़ो। 2. चंदा मामा कब दिखते हैं? 3. उनके साथ कौन चमकते हैं? 4. तुकांत शब्द खोजो।
    real_world: पूर्णिमा की रात चाँद पूरा गोल और बहुत चमकीला होता है।
  picture:
    kind: flow
    steps:
    - पतला चाँद
    - आधा चाँद
    - पूरा गोल चाँद
    alt: चाँद पतला दिखता है, फिर आधा, फिर पूरा गोल।
  activity:
    type: order
    prompt: चंदा मामा रोज़ बदलते हैं। पतली लकीर से पूरे चाँद तक क्रम से लगाओ।
    steps:
    - 🌑 चाँद नहीं दिखता
    - 🌒 पतली लकीर
    - 🌓 आधा चाँद
    - 🌕 पूरा गोल चाँद
    reasons:
      🌒 पतली लकीर: दिखना पतली लकीर से शुरू होता है।
      🌓 आधा चाँद: लकीर बढ़कर आधा चाँद।
      🌕 पूरा गोल चाँद: आधे से बढ़कर पूरा।
  lesson:
    - teach: बच्चे चाँद को प्यार से 'चंदा मामा' कहते हैं। चाँद रात में चमकता है और उसके साथ तारे टिमटिमाते हैं। चाँद की अपनी रोशनी नहीं होती; वह सूरज की रोशनी से चमकता है।
      check:
        prompt: चाँद किसकी रोशनी से चमकता है?
        options:
        - सूरज की
        - बिजली के बल्ब की
        - तारों की
        answer: सूरज की
        why: सूरज की रोशनी चाँद पर पड़कर हम तक आती है।
    - teach: चाँद रोज़ थोड़ा बदला हुआ दिखता है। पूरा गोल चाँद पूर्णिमा को दिखता है। जिस रात चाँद बिलकुल नहीं दिखता, उसे अमावस्या कहते हैं। बीच में चाँद आधा या पतली कटोरी जैसा दिखता है।
      picture:
        kind: flow
        steps:
        - 'अमावस्या: चाँद नहीं'
        - पतला चाँद
        - आधा चाँद
        - 'पूर्णिमा: पूरा गोल'
        alt: चाँद का धीरे-धीरे बढ़कर पूरा गोल होना।
      check:
        prompt: जिस रात चाँद बिलकुल नहीं दिखता, उसे क्या कहते हैं?
        options:
        - अमावस्या
        - पूर्णिमा
        - दोपहर
        answer: अमावस्या
        why: अमावस्या की रात आसमान में चाँद नहीं दिखता।
    - teach: 'चाँद के दूसरे नाम: चंदा, चंद्रमा, शशि। कविता के तुक वाले शब्द: मामा-जामा, चंदा-फंदा, तारे-सारे-प्यारे।'
      check:
        prompt: '''चंद्रमा'' किसका नाम है?'
        options:
        - चाँद का
        - सूरज का
        - पेड़ का
        answer: चाँद का
        why: 'चंद्रमा, चंदा, शशि: सब चाँद के नाम हैं।'
  items:
  - prompt: चंदा मामा कब दिखते हैं?
    options:
    - रात में
    - दोपहर में धूप में
    - कभी नहीं
    - सिर्फ़ बारिश में
    answer: रात में
    difficulty: 1
    hints:
    - अँधेरे में चमकते हैं।
    - सोने के समय।
    solution: चंदा मामा रात में दिखते हैं।
    mistakes: {"दोपहर में धूप में": "h1_raat_aasmaan", "कभी नहीं": "h1_raat_aasmaan", "सिर्फ़ बारिश में": "h1_raat_aasmaan"}
  - prompt: रात में चाँद के साथ और क्या चमकता है?
    options:
    - तारे
    - सूरज
    - इंद्रधनुष
    - बादल
    answer: तारे
    difficulty: 1
    hints:
    - टिम-टिम।
    - बहुत सारे।
    solution: रात में तारे भी चमकते हैं।
    mistakes: {"सूरज": "h1_raat_aasmaan", "इंद्रधनुष": "h1_raat_aasmaan", "बादल": "h1_raat_aasmaan"}
  - prompt: बच्चे चाँद को प्यार से क्या कहते हैं?
    options:
    - चंदा मामा
    - सूरज दादा
    - बादल भैया
    - तारा दीदी
    answer: चंदा मामा
    difficulty: 1
    hints:
    - पाठ का नाम।
    - मामा।
    solution: बच्चे चाँद को चंदा मामा कहते हैं।
    mistakes: {"सूरज दादा": "h1_chanda", "बादल भैया": "h1_chanda", "तारा दीदी": "h1_chanda"}
  - prompt: पूरा गोल चाँद किस रात दिखता है?
    options:
    - पूर्णिमा
    - अमावस
    - रविवार
    - हर रात
    answer: पूर्णिमा
    difficulty: 2
    hints:
    - पूर्ण यानी पूरा।
    - पू से शुरू।
    solution: पूर्णिमा को पूरा चाँद दिखता है।
    mistakes:
      अमावस: hin2_word
  - prompt: '''चंदा'' शब्द किसके लिए है?'
    options:
    - चाँद
    - चाय
    - चम्मच
    - चिड़िया
    answer: चाँद
    difficulty: 2
    hints:
    - आसमान में।
    - मामा।
    solution: चंदा यानी चाँद।
    mistakes: {"चाय": "h2_chanda_shabd", "चम्मच": "h2_chanda_shabd", "चिड़िया": "h2_chanda_shabd"}
  - prompt: '''मामा'' में कौन-सा अक्षर दो बार आया है?'
    options:
    - म
    - च
    - त
    - न
    answer: म
    difficulty: 2
    hints:
    - मा + मा।
    - पहली आवाज़ सुनो।
    solution: मामा में 'म' दो बार आया है।
    mistakes:
      न: hin2_sound
  - prompt: '''तारे'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - प्यारे
    - चाँद
    - रात
    answer: प्यारे
    difficulty: 1
    hints:
    - तारे 'आरे' पर खत्म होता है।
    - अंत की आवाज़ सुनो।
    solution: 'चरण 1: तारे ''आरे'' पर। चरण 2: प्यारे भी।'
    mistakes:
      चाँद: c2h23_tuk
      रात: c2h23_tuk
  - prompt: पूर्णिमा को चाँद कैसा दिखता है?
    options:
    - पूरा गोल
    - बिलकुल नहीं
    - आधा
    answer: पूरा गोल
    difficulty: 1
    hints:
    - '''पूर्ण'' का अर्थ है पूरा।'
    - रोटी जैसा।
    solution: 'चरण 1: पूर्णिमा = पूरा चाँद। चरण 2: वह पूरा गोल दिखता है।'
    mistakes:
      बिलकुल नहीं: c2h23_chaand
      आधा: c2h23_chaand
  - prompt: दिन में आसमान में क्या चमकता है?
    options:
    - सूरज
    - तारे
    - जुगनू
    answer: सूरज
    difficulty: 1
    hints:
    - दिन में उजाला किससे होता है?
    - तारे रात में दिखते हैं।
    solution: 'चरण 1: दिन का उजाला सूरज से है। चरण 2: दिन में सूरज चमकता है।'
    mistakes:
      तारे: c2h23_chaand
      जुगनू: c2h23_chaand
  - prompt: '''मामा'' किसके भाई होते हैं?'
    options:
    - माँ के
    - पिता के
    - दादी के
    answer: माँ के
    difficulty: 1
    hints:
    - पिता के भाई चाचा होते हैं।
    - '''मामा'' और ''माँ'' दोनों ''म'' से।'
    solution: 'चरण 1: पिता के भाई चाचा। चरण 2: माँ के भाई मामा।'
    mistakes:
      पिता के: c2h23_shabd
      दादी के: c2h23_shabd
  - prompt: '''शशि'' का अर्थ क्या है?'
    options:
    - चाँद
    - फूल
    - नदी
    answer: चाँद
    difficulty: 2
    hints:
    - यह इस पाठ से जुड़ा नाम है।
    - रात में आसमान में दिखता है।
    solution: 'चरण 1: शशि चाँद का दूसरा नाम है। चरण 2: अर्थ चाँद।'
    mistakes:
      फूल: c2h23_shabd
      नदी: c2h23_shabd
  - prompt: रात में तारे कैसे दिखते हैं?
    options:
    - टिमटिमाते हुए
    - बहुत बड़े और गरम
    - ज़मीन पर
    answer: टिमटिमाते हुए
    difficulty: 1
    hints:
    - '''ट्विंकल ट्विंकल लिटिल स्टार'' याद करो।'
    - जलते-बुझते से दिखते हैं।
    solution: 'चरण 1: तारे बहुत दूर हैं। चरण 2: वे टिमटिमाते दिखते हैं।'
    mistakes:
      बहुत बड़े और गरम: c2h23_chaand
      ज़मीन पर: c2h23_chaand
  - prompt: चाँद को 'मामा' क्यों कहते हैं?
    options:
    - प्यार से, अपनेपन के लिए
    - क्योंकि चाँद सच में रिश्तेदार है
    - क्योंकि चाँद बोलता है
    answer: प्यार से, अपनेपन के लिए
    difficulty: 2
    hints:
    - क्या चाँद सच में किसी का भाई है?
    - बच्चे प्यार वाला नाम देते हैं।
    solution: 'चरण 1: चाँद सच में रिश्तेदार नहीं। चरण 2: प्यार से ''मामा'' कहते हैं।'
    mistakes:
      क्योंकि चाँद सच में रिश्तेदार है: c2h23_chaand
      क्योंकि चाँद बोलता है: c2h23_chaand
  - prompt: '''तारा'' का बहुवचन क्या है?'
    options:
    - तारे
    - तारों
    - तारा
    answer: तारे
    difficulty: 2
    hints:
    - '''घोड़ा'' से ''घोड़े'' बनता है।'
    - आ को ए में बदलो।
    solution: 'चरण 1: तारा के अंत में आ। चरण 2: बहुवचन तारे।'
    mistakes:
      तारों: c2h23_shabd
      तारा: c2h23_shabd
  - prompt: आज पूर्णिमा है। लगभग पंद्रह दिन बाद कौन-सी रात आएगी?
    options:
    - अमावस्या
    - फिर पूर्णिमा
    - दोपहर
    answer: अमावस्या
    difficulty: 3
    hints:
    - पूरा चाँद धीरे-धीरे घटता है।
    - घटते-घटते चाँद कब बिलकुल नहीं दिखेगा?
    solution: 'चरण 1: पूर्णिमा के बाद चाँद घटता है। चरण 2: लगभग पंद्रह दिन बाद अमावस्या आती है।'
    mistakes:
      फिर पूर्णिमा: c2h23_chaand
      दोपहर: c2h23_chaand
