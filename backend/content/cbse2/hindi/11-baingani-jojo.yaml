subject: cbse2-hin
chapter: 11
title: बैंगनी जोजो
tips:
  h2_baingani: "'बैंगनी' शब्द से आखिरी 'ई' हटाकर देखो: कौन-सी सब्ज़ी बचती है?"
  h2_rang_mel: "दो रंग मिलाने से तीसरा बनता है। बैंगन के रंग में एक आग जैसा गरम और एक आसमान जैसा ठंडा रंग छिपा है।"
  h2_tamatar: "पका टमाटर काटो तो उसका रस कैसा दिखता है? वैसा ही रंग जैसा ट्रैफ़िक की 'रुको' बत्ती का।"
  c2h11_rang: आँखें बंद करके वह चीज़ मन में देखो। कौन-सा रंग दिखता है?
  c2h11_alag: सोचो, तुम सबसे अलग दिखो तो दूसरों से क्या चाहोगे?
  c2h11_mel: दोनों रंगों को मन में मिलाकर देखो।

concepts:
- code: cbse2h.11.baingani
  title: बैंगनी जोजो
  notes: |
    जोजो नाम के बैंगनी रंग वाले पात्र के बारे में कहानी: अलग दिखना, अपने जैसा होना ठीक है। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कहानी जोजो की है जो बैंगनी रंग का है। सब अलग-अलग होते हैं, और अलग होना अच्छी बात है। हमें हर किसी को अपनाना चाहिए।
    visual: 'चित्र बनाओ: बैंगनी रंग का जोजो, अपने दोस्तों के साथ खेलते हुए।'
    step_by_step: 1. कहानी पढ़ो। 2. जोजो कैसा है? 3. वह सबसे अलग क्यों है? 4. हम सब अलग होकर भी दोस्त कैसे हैं?
    real_world: 'कक्षा में हर बच्चा अलग है: कोई लंबा, कोई छोटा, सब मिलकर पढ़ते हैं।'
  picture:
    kind: compare
    columns:
    - title: सब्ज़ी
      points:
      - बैंगन
      - टमाटर
      - मटर
    - title: रंग
      points:
      - बैंगनी
      - लाल
      - हरा
    alt: बैंगन बैंगनी, टमाटर लाल और मटर हरी होती है।
  activity:
    type: sort
    prompt: कोई अलग दिखे तो हम क्या करें?
    bins:
    - ठीक
    - ठीक नहीं
    items:
    - label: 🤝 उसे साथ खेलने बुलाना
      bin: ठीक
      clue: अलग होना बुरा है?
      why: सबको साथ लो।
    - label: 😊 कहना, तुम जैसे हो अच्छे हो
      bin: ठीक
      clue: अपने जैसा होना ठीक?
      why: हर कोई अपने जैसा अच्छा।
    - label: 😆 रंग पर हँसना
      bin: ठीक नहीं
      clue: उसे कैसा लगेगा?
      why: किसी पर हँसना ठीक नहीं।
    - label: 🙅 उसे अकेला छोड़ना
      bin: ठीक नहीं
      clue: क्या यह दोस्ती है?
      why: अलग दिखने पर छोड़ना ठीक नहीं।
  lesson:
    - teach: '''बैंगनी जोजो'' कहानी में जोजो का रंग बैंगनी है, बाकी सब से अलग। बैंगनी रंग का नाम बैंगन सब्ज़ी से आया है। जामुन और कुछ फूल भी बैंगनी होते हैं।'
      check:
        prompt: बैंगनी रंग का नाम किस सब्ज़ी से बना है?
        options:
        - बैंगन
        - भिंडी
        - आलू
        answer: बैंगन
        why: बैंगन का रंग गहरा बैंगनी होता है।
      ways:
      - style: visual
        teach: रोज़ दिखने वाली कुछ चीज़ें, और हर एक का रंग।
        picture:
          kind: compare
          columns:
          - title: चीज़
            points:
            - हल्दी
            - कोयला
            - दूध
          - title: रंग
            points:
            - पीला
            - काला
            - सफ़ेद
          alt: हल्दी पीली होती है, कोयला काला, और दूध सफ़ेद।
      - style: real_world
        teach: बाज़ार में बैंगनी पत्तागोभी और बैंगनी प्याज़ भी मिलते हैं, जो सलाद को रंग-बिरंगा बना देते हैं।
    - teach: 'हर कोई अलग होता है: कोई लंबा, कोई छोटा, कोई अलग भाषा बोलता है, कोई अलग तरह से सीखता है। अलग होना ठीक है। हम सबसे दोस्ती करते हैं और किसी को अकेला नहीं छोड़ते।'
      picture:
        kind: compare
        columns:
        - title: ठीक
          points:
          - साथ खेलने बुलाना
          - नाम से प्यार से बुलाना
        - title: ठीक नहीं
          points:
          - अलग होने पर चिढ़ाना
          - अकेला छोड़ना
        alt: अलग दिखने वाले के साथ क्या ठीक है और क्या नहीं।
      check:
        prompt: नया बच्चा अलग भाषा बोलता है। हम क्या करें?
        options:
        - साथ खेलने बुलाएँ
        - उस पर हँसें
        - दूर रहें
        answer: साथ खेलने बुलाएँ
        why: अलग होना ठीक है; दोस्ती सबसे हो सकती है।
      ways:
      - style: step_by_step
        teach: 'नए बच्चे को खेल में शामिल करो। पहला: देखो, कौन अकेला खड़ा है। दूसरा: पास जाकर नमस्ते करो। तीसरा: पूछो, ''हमारे साथ खेलोगे?'' चौथा: खेल के नियम प्यार से समझाओ।'
      - style: real_world
        teach: एक ही कक्षा में कोई चश्मा पहनता है, कोई तेज़ दौड़ता है, कोई सुंदर चित्र बनाता है। हर किसी की अपनी खूबी होती है।
    - teach: 'रंग मिलाकर बैंगनी बनता है: लाल + नीला = बैंगनी। रंगों के नाम: लाल, पीला, नीला, हरा, नारंगी, बैंगनी, गुलाबी, भूरा।'
      check:
        prompt: बैंगनी बनाने के लिए नीले में कौन-सा रंग मिलाएँ?
        options:
        - लाल
        - पीला
        - सफ़ेद
        answer: लाल
        why: लाल + नीला = बैंगनी।
      ways:
      - style: visual
        teach: दो रंग आपस में मिलाने से बनने वाले कुछ और रंग।
        picture:
          kind: compare
          columns:
          - title: मिलाओ
            points:
            - हरा + लाल
            - पीला + सफ़ेद
          - title: बनता है
            points:
            - भूरा
            - हल्का पीला
          alt: हरा और लाल मिलाने से भूरा रंग बनता है, और पीला और सफ़ेद मिलाने से हल्का पीला।
      - style: real_world
        teach: दीवार रंगने वाले पेंटर बड़े डिब्बे में दो-तीन रंग मिलाकर ठीक वैसा रंग बनाते हैं जैसा घर वाले चाहते हैं।
  items:
  - prompt: जोजो किस रंग का है?
    options:
    - बैंगनी
    - हरा
    - पीला
    - सफ़ेद
    answer: बैंगनी
    difficulty: 1
    hints:
    - पाठ का नाम।
    - बैंगन जैसा।
    solution: जोजो बैंगनी है।
    mistakes:
      हरा: hin2_read_again
  - prompt: बैंगनी रंग किस सब्ज़ी के नाम से बना है?
    options:
    - बैंगन
    - भिंडी
    - आलू
    - गोभी
    answer: बैंगन
    difficulty: 2
    hints:
    - बैंग-...
    - भर्ता बनता है।
    solution: बैंगनी रंग बैंगन से।
    mistakes: {"भिंडी": "h2_baingani", "आलू": "h2_baingani", "गोभी": "h2_baingani"}
  - prompt: 'जो सबसे अलग हो, उसके साथ हमें:'
    options:
    - दोस्ती करनी चाहिए
    - हँसना चाहिए
    - दूर रहना चाहिए
    - चिढ़ाना चाहिए
    answer: दोस्ती करनी चाहिए
    difficulty: 1
    hints:
    - सब अच्छे हैं।
    - अपनाओ।
    solution: उसके साथ दोस्ती करनी चाहिए।
    mistakes: {"हँसना चाहिए": "h1_akela", "दूर रहना चाहिए": "h1_akela", "चिढ़ाना चाहिए": "h1_akela"}
  - prompt: टमाटर किस रंग का होता है?
    options:
    - लाल
    - नीला
    - बैंगनी
    - काला
    answer: लाल
    difficulty: 1
    hints:
    - पका टमाटर।
    - चटनी।
    solution: टमाटर लाल होता है।
    mistakes: {"नीला": "h2_tamatar", "बैंगनी": "h2_tamatar", "काला": "h2_tamatar"}
  - prompt: '''अलग'' का उलटा क्या है?'
    options:
    - एक जैसा
    - बड़ा
    - सुंदर
    - नया
    answer: एक जैसा
    difficulty: 2
    hints:
    - अलग नहीं।
    - समान।
    solution: अलग का उलटा एक जैसा है।
    mistakes:
      सुंदर: hin2_word
  - prompt: बैंगनी रंग बनाने के लिए कौन-से रंग मिलाते हैं?
    options:
    - लाल और नीला
    - पीला और हरा
    - सफ़ेद और पीला
    - काला और हरा
    answer: लाल और नीला
    difficulty: 2
    hints:
    - एक गरम, एक ठंडा रंग।
    - लाल + ...।
    solution: लाल और नीला मिलाकर बैंगनी बनता है।
    mistakes: {"पीला और हरा": "h2_rang_mel", "सफ़ेद और पीला": "h2_rang_mel", "काला और हरा": "h2_rang_mel"}
  - prompt: जामुन किस रंग का होता है?
    options:
    - गहरा बैंगनी
    - पीला
    - हरा
    answer: गहरा बैंगनी
    difficulty: 1
    hints:
    - खाने के बाद जीभ का रंग याद करो।
    - बैंगन जैसा गहरा रंग।
    solution: 'चरण 1: जामुन खाने पर जीभ रंग जाती है। चरण 2: उसका रंग गहरा बैंगनी है।'
    mistakes:
      पीला: c2h11_rang
      हरा: c2h11_rang
  - prompt: केला पकने पर किस रंग का होता है?
    options:
    - पीला
    - बैंगनी
    - नीला
    answer: पीला
    difficulty: 1
    hints:
    - कच्चा केला हरा होता है।
    - पकने पर सूरजमुखी जैसा रंग।
    solution: 'चरण 1: कच्चा केला हरा। चरण 2: पका केला पीला।'
    mistakes:
      बैंगनी: c2h11_rang
      नीला: c2h11_rang
  - prompt: कोई बच्चा व्हीलचेयर पर है। खेल में हम क्या करें?
    options:
    - ऐसा खेल चुनें जिसमें वह भी खेल सके
    - उसे खेल से बाहर रखें
    - उसे देखते रहें
    answer: ऐसा खेल चुनें जिसमें वह भी खेल सके
    difficulty: 1
    hints:
    - सबको खेलने का मन करता है।
    - किसी को अकेला न छोड़ें।
    solution: 'चरण 1: हर बच्चा खेलना चाहता है। चरण 2: ऐसा खेल चुनो जिसमें सब खेल सकें।'
    mistakes:
      उसे खेल से बाहर रखें: c2h11_alag
      उसे देखते रहें: c2h11_alag
  - prompt: लाल और सफ़ेद मिलाने से कौन-सा रंग बनता है?
    options:
    - गुलाबी
    - हरा
    - काला
    answer: गुलाबी
    difficulty: 2
    hints:
    - लाल हल्का हो जाता है।
    - गुलाब के फूल जैसा।
    solution: 'चरण 1: सफ़ेद लाल को हल्का करता है। चरण 2: हल्का लाल = गुलाबी।'
    mistakes:
      हरा: c2h11_mel
      काला: c2h11_mel
  - prompt: '''अलग होना ठीक है'' का क्या मतलब है?'
    options:
    - हर कोई अपने जैसा होकर भी अच्छा है
    - सबको एक जैसा होना चाहिए
    - अलग वाले से दूर रहो
    answer: हर कोई अपने जैसा होकर भी अच्छा है
    difficulty: 1
    hints:
    - जोजो का रंग अलग था।
    - क्या इससे जोजो बुरा हो गया?
    solution: 'चरण 1: सब अलग-अलग हैं। चरण 2: अपने जैसा होना भी अच्छा है।'
    mistakes:
      सबको एक जैसा होना चाहिए: c2h11_alag
      अलग वाले से दूर रहो: c2h11_alag
  - prompt: मिट्टी किस रंग की होती है?
    options:
    - भूरी
    - नीली
    - गुलाबी
    answer: भूरी
    difficulty: 2
    hints:
    - बगीचे की ज़मीन देखो।
    - चॉकलेट जैसा रंग।
    solution: 'चरण 1: खेत-बगीचे की मिट्टी देखो। चरण 2: उसका रंग भूरा।'
    mistakes:
      नीली: c2h11_rang
      गुलाबी: c2h11_rang
  - prompt: कौन-सा शब्द रंग का नाम नहीं है?
    options:
    - बैंगन
    - बैंगनी
    - गुलाबी
    answer: बैंगन
    difficulty: 2
    hints:
    - एक शब्द सब्ज़ी है।
    - रंग वाले शब्दों के अंत में 'ई' है।
    solution: 'चरण 1: बैंगनी और गुलाबी रंग हैं। चरण 2: बैंगन सब्ज़ी है।'
    mistakes:
      बैंगनी: c2h11_rang
      गुलाबी: c2h11_rang
  - prompt: '''अलग'' का अर्थ क्या है?'
    options:
    - जो बाकी से भिन्न हो
    - जो बहुत बड़ा हो
    - जो खो गया हो
    answer: जो बाकी से भिन्न हो
    difficulty: 2
    hints:
    - सब हरे हों और एक बैंगनी, तो बैंगनी ...
    - भिन्न का अर्थ भी यही है।
    solution: 'चरण 1: अलग मतलब बाकी जैसा नहीं। चरण 2: जो बाकी से भिन्न हो।'
    mistakes:
      जो बहुत बड़ा हो: c2h11_alag
      जो खो गया हो: c2h11_alag
  - prompt: बैंगनी रंग चाहिए, पर लाल नहीं है; नीला और गुलाबी हैं। क्या करें?
    options:
    - नीले में गुलाबी मिलाएँ
    - सिर्फ़ नीला लगाएँ
    - पीला मिलाएँ
    answer: नीले में गुलाबी मिलाएँ
    difficulty: 3
    hints:
    - गुलाबी में लाल छिपा है।
    - बैंगनी = लाल + नीला।
    solution: 'चरण 1: गुलाबी हल्का लाल है। चरण 2: नीला + गुलाबी से हल्का बैंगनी बनता है।'
    mistakes:
      सिर्फ़ नीला लगाएँ: c2h11_mel
      पीला मिलाएँ: c2h11_mel
  - prompt: 'स्थिति (केस): कक्षा में एक नया बच्चा आया है जो अभी सिर्फ़ तमिल बोलता है। कुछ बच्चे उसे खेल में नहीं ले रहे। क्या करना चाहिए?'
    options:
    - उसे खेल में बुलाना और इशारों से नियम समझाना
    - उसे अकेला बैठा रहने देना
    - कहना कि पहले हिंदी सीखकर आए
    answer: उसे खेल में बुलाना और इशारों से नियम समझाना
