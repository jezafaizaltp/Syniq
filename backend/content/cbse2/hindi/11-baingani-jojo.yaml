subject: cbse2-hin
chapter: 11
title: बैंगनी जोजो
tips:
  h2_baingani: "'बैंगनी' शब्द से आखिरी 'ई' हटाकर देखो: कौन-सी सब्ज़ी बचती है?"
  h2_rang_mel: "दो रंग मिलाने से तीसरा बनता है। बैंगन के रंग में एक आग जैसा गरम और एक आसमान जैसा ठंडा रंग छिपा है।"
  h2_tamatar: "पका टमाटर काटो तो उसका रस कैसा दिखता है? वैसा ही रंग जैसा ट्रैफ़िक की 'रुको' बत्ती का।"

concepts:
- code: cbse2h.11.baingani
  title: बैंगनी जोजो
  notes: |
    जोजो नाम के बैंगनी रंग वाले पात्र के बारे में कहानी: अलग दिखना, अपने जैसा होना ठीक है। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कहानी जोजो की है जो बैंगनी रंग का है। सब अलग-अलग होते हैं, और अलग होना अच्छी बात है। हमें हर किसी को अपनाना चाहिए।
    visual: 'चित्र बनाओ: बैंगनी रंग का जोजो, अपने दोस्तों के साथ खेलते हुए।'
    step_by_step: 1. कहानी पढ़ो। 2. जोजो कैसा है? 3. वह सबसे अलग क्यों है? 4. हम सब अलग होकर भी दोस्त कैसे हैं?
    real_world: 'कक्षा में हर बच्चा अलग है: कोई लंबा, कोई छोटा, सब मिलकर पढ़ते हैं।'
  picture:
    kind: compare
    columns:
    - title: सब्ज़ी
      points:
      - बैंगन
      - टमाटर
      - मटर
    - title: रंग
      points:
      - बैंगनी
      - लाल
      - हरा
    alt: बैंगन बैंगनी, टमाटर लाल और मटर हरी होती है।
  activity:
    type: sort
    prompt: कोई अलग दिखे तो हम क्या करें?
    bins:
    - ठीक
    - ठीक नहीं
    items:
    - label: 🤝 उसे साथ खेलने बुलाना
      bin: ठीक
      clue: अलग होना बुरा है?
      why: सबको साथ लो।
    - label: 😊 कहना, तुम जैसे हो अच्छे हो
      bin: ठीक
      clue: अपने जैसा होना ठीक?
      why: हर कोई अपने जैसा अच्छा।
    - label: 😆 रंग पर हँसना
      bin: ठीक नहीं
      clue: उसे कैसा लगेगा?
      why: किसी पर हँसना ठीक नहीं।
    - label: 🙅 उसे अकेला छोड़ना
      bin: ठीक नहीं
      clue: क्या यह दोस्ती है?
      why: अलग दिखने पर छोड़ना ठीक नहीं।
  items:
  - prompt: जोजो किस रंग का है?
    options:
    - बैंगनी
    - हरा
    - पीला
    - सफ़ेद
    answer: बैंगनी
    difficulty: 1
    hints:
    - पाठ का नाम।
    - बैंगन जैसा।
    solution: जोजो बैंगनी है।
    mistakes:
      हरा: hin2_read_again
  - prompt: बैंगनी रंग किस सब्ज़ी के नाम से बना है?
    options:
    - बैंगन
    - भिंडी
    - आलू
    - गोभी
    answer: बैंगन
    difficulty: 2
    hints:
    - बैंग-...
    - भर्ता बनता है।
    solution: बैंगनी रंग बैंगन से।
    mistakes: {"भिंडी": "h2_baingani", "आलू": "h2_baingani", "गोभी": "h2_baingani"}
  - prompt: 'जो सबसे अलग हो, उसके साथ हमें:'
    options:
    - दोस्ती करनी चाहिए
    - हँसना चाहिए
    - दूर रहना चाहिए
    - चिढ़ाना चाहिए
    answer: दोस्ती करनी चाहिए
    difficulty: 1
    hints:
    - सब अच्छे हैं।
    - अपनाओ।
    solution: उसके साथ दोस्ती करनी चाहिए।
    mistakes: {"हँसना चाहिए": "h1_akela", "दूर रहना चाहिए": "h1_akela", "चिढ़ाना चाहिए": "h1_akela"}
  - prompt: टमाटर किस रंग का होता है?
    options:
    - लाल
    - नीला
    - बैंगनी
    - काला
    answer: लाल
    difficulty: 1
    hints:
    - पका टमाटर।
    - चटनी।
    solution: टमाटर लाल होता है।
    mistakes: {"नीला": "h2_tamatar", "बैंगनी": "h2_tamatar", "काला": "h2_tamatar"}
  - prompt: '''अलग'' का उलटा क्या है?'
    options:
    - एक जैसा
    - बड़ा
    - सुंदर
    - नया
    answer: एक जैसा
    difficulty: 2
    hints:
    - अलग नहीं।
    - समान।
    solution: अलग का उलटा एक जैसा है।
    mistakes:
      सुंदर: hin2_word
  - prompt: बैंगनी रंग बनाने के लिए कौन-से रंग मिलाते हैं?
    options:
    - लाल और नीला
    - पीला और हरा
    - सफ़ेद और पीला
    - काला और हरा
    answer: लाल और नीला
    difficulty: 2
    hints:
    - एक गरम, एक ठंडा रंग।
    - लाल + ...।
    solution: लाल और नीला मिलाकर बैंगनी बनता है।
    mistakes: {"पीला और हरा": "h2_rang_mel", "सफ़ेद और पीला": "h2_rang_mel", "काला और हरा": "h2_rang_mel"}
