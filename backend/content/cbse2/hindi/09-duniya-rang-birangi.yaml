subject: cbse2-hin
chapter: 9
title: दुनिया रंग-बिरंगी
tips:
  h2_tyohar: "राखी पर भाई की कलाई पर धागा बँधता है, ईद पर सेवइयाँ बनती हैं, ओणम पर फूलों की रंगोली। किस त्योहार पर पिचकारी चलती है?"
  h2_aasmaan: "बादल न हों तो दिन में ऊपर देखो। समुद्र के पानी जैसा कौन-सा रंग दिखता है?"
  h2_indradhanush: "इंद्रधनुष के रंग एक-एक करके गिनो: बैंगनी, जामुनी, नीला... लाल तक।"
  h2_patta: "खिड़की से किसी पेड़ को देखो। उसके पत्ते घास जैसे किस रंग के हैं?"
  h2_rang_naam: "सभी शब्द 'प' से शुरू होते हैं। इनमें से कौन-सा शब्द किसी चीज़ का नहीं, रंग का नाम है?"

concepts:
- code: cbse2h.09.duniya
  title: दुनिया रंग-बिरंगी
  notes: |
    रंगों भरी दुनिया पर कविता: फूल, तितली, आसमान, इंद्रधनुष के रंग। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: 'यह कविता बताती है कि हमारी दुनिया रंगों से भरी है: लाल फूल, नीला आसमान, हरे पेड़, पीला सूरज और सात रंगों वाला इंद्रधनुष।'
    visual: 'चित्र बनाओ: हरे पेड़, लाल फूल, नीला आसमान और इंद्रधनुष।'
    step_by_step: 1. कविता पढ़ो। 2. रंगों के नाम खोजो। 3. हर रंग की एक चीज़ बताओ। 4. तुकांत शब्द खोजो।
    real_world: होली पर लोग एक-दूसरे को रंग लगाते हैं।
  picture:
    kind: compare
    columns:
    - title: रंग
      points:
      - हरा
      - नीला
      - पीला
    - title: चीज़
      points:
      - पत्ते
      - आसमान
      - सूरजमुखी
    alt: पत्ते हरे हैं, आसमान नीला है और सूरजमुखी पीला है।
  items:
  - prompt: पत्तों का रंग कैसा होता है?
    options:
    - हरा
    - नीला
    - काला
    - गुलाबी
    answer: हरा
    difficulty: 1
    hints:
    - पेड़ देखो।
    - घास जैसा।
    solution: पत्ते हरे होते हैं।
    mistakes: {"नीला": "h2_patta", "काला": "h2_patta", "गुलाबी": "h2_patta"}
  - prompt: साफ़ दिन में आसमान कैसा दिखता है?
    options:
    - नीला
    - लाल
    - भूरा
    - हरा
    answer: नीला
    difficulty: 1
    hints:
    - ऊपर देखो।
    - समुद्र जैसा।
    solution: आसमान नीला दिखता है।
    mistakes: {"लाल": "h2_aasmaan", "भूरा": "h2_aasmaan", "हरा": "h2_aasmaan"}
  - prompt: इंद्रधनुष में कितने रंग होते हैं?
    options:
    - सात
    - दो
    - दस
    - एक
    answer: सात
    difficulty: 2
    hints:
    - बैं-नी-आ-ह-पी-ना-ला।
    - गिनो।
    solution: इंद्रधनुष में सात रंग होते हैं।
    mistakes: {"दो": "h2_indradhanush", "दस": "h2_indradhanush", "एक": "h2_indradhanush"}
  - prompt: '''रंग-बिरंगी'' का मतलब है:'
    options:
    - कई रंगों वाली
    - बिना रंग की
    - काली
    - टूटी हुई
    answer: कई रंगों वाली
    difficulty: 2
    hints:
    - बहुत सारे रंग।
    - तितली जैसी।
    solution: रंग-बिरंगी यानी कई रंगों वाली।
    mistakes:
      बिना रंग की: hin2_word
  - prompt: कौन-सा शब्द रंग का नाम है?
    options:
    - पीला
    - पेड़
    - पानी
    - पतंग
    answer: पीला
    difficulty: 1
    hints:
    - सूरज जैसा।
    - रंग।
    solution: पीला एक रंग है।
    mistakes: {"पेड़": "h2_rang_naam", "पानी": "h2_rang_naam", "पतंग": "h2_rang_naam"}
  - prompt: रंगों का त्योहार कौन-सा है?
    options:
    - होली
    - राखी
    - ईद
    - ओणम
    answer: होली
    difficulty: 1
    hints:
    - गुलाल।
    - पिचकारी।
    solution: होली रंगों का त्योहार है।
    mistakes: {"राखी": "h2_tyohar", "ईद": "h2_tyohar", "ओणम": "h2_tyohar"}
