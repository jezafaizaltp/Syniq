# CBSE Class 2 Hindi (NCERT Sarangi, 2024-25), chapter 9. Format: content/README.md.
# Chapter names and order from the Delhi Directorate of Education Class II Hindi plan 2026-27; story details not checked against the book, kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse2-hin
chapter: 9
title: दुनिया रंग-बिरंगी
tips:
  h2_tyohar: "राखी पर भाई की कलाई पर धागा बँधता है, ईद पर सेवइयाँ बनती हैं, ओणम पर फूलों की रंगोली। किस त्योहार पर पिचकारी चलती है?"
  h2_aasmaan: "बादल न हों तो दिन में ऊपर देखो। समुद्र के पानी जैसा कौन-सा रंग दिखता है?"
  h2_indradhanush: "इंद्रधनुष के रंग एक-एक करके गिनो: बैंगनी, जामुनी, नीला... लाल तक।"
  h2_patta: "खिड़की से किसी पेड़ को देखो। उसके पत्ते घास जैसे किस रंग के हैं?"
  h2_rang_naam: "सभी शब्द 'प' से शुरू होते हैं। इनमें से कौन-सा शब्द किसी चीज़ का नहीं, रंग का नाम है?"
  c2h9_kram: इंद्रधनुष के रंग बैंगनी से शुरू करके एक-एक कर गिनो। आखिर में कौन आता है?
  c2h9_rang: आँखें बंद करके वह चीज़ मन में देखो। कौन-सा रंग दिखता है?
  c2h9_mel: रंग मिलाने पर नया रंग बनता है। दोनों रंगों को मन में मिलाकर देखो।
  c2h9_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। अर्थ ठीक बैठता है?

concepts:
- code: cbse2h.09.duniya
  title: दुनिया रंग-बिरंगी
  notes: |
    रंगों भरी दुनिया पर कविता: फूल, तितली, आसमान, इंद्रधनुष के रंग। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: 'यह कविता बताती है कि हमारी दुनिया रंगों से भरी है: लाल फूल, नीला आसमान, हरे पेड़, पीला सूरज और सात रंगों वाला इंद्रधनुष।'
    visual: 'चित्र बनाओ: हरे पेड़, लाल फूल, नीला आसमान और इंद्रधनुष।'
    step_by_step: 1. कविता पढ़ो। 2. रंगों के नाम खोजो। 3. हर रंग की एक चीज़ बताओ। 4. तुकांत शब्द खोजो।
    real_world: होली पर लोग एक-दूसरे को रंग लगाते हैं।
  picture:
    kind: compare
    columns:
    - title: रंग
      points:
      - हरा
      - नीला
      - पीला
    - title: चीज़
      points:
      - पत्ते
      - आसमान
      - सूरजमुखी
    alt: पत्ते हरे हैं, आसमान नीला है और सूरजमुखी पीला है।
  activity:
    type: sort
    prompt: किसका रंग क्या है?
    bins:
    - हरा
    - नीला
    - लाल
    - पीला
    items:
    - label: 🌿 पत्ता
      bin: हरा
      clue: पत्ते का रंग?
      why: पत्ता हरा।
    - label: 🌊 आसमान
      bin: नीला
      clue: दिन का आसमान?
      why: आसमान नीला।
    - label: 🍅 टमाटर
      bin: लाल
      clue: पका टमाटर?
      why: टमाटर लाल।
    - label: 🌻 सूरजमुखी
      bin: पीला
      clue: सूरजमुखी का रंग?
      why: पीला।
    - label: 🦜 तोता
      bin: हरा
      clue: तोते के पंख?
      why: तोता हरा।
  lesson:
    - teach: 'हमारी दुनिया रंग-बिरंगी है: हरे पत्ते, नीला आसमान, पीला सूरजमुखी, लाल टमाटर, सफ़ेद बादल, काली रात। ''रंग-बिरंगी'' मतलब कई रंगों वाली।'
      picture:
        kind: compare
        columns:
        - title: चीज़
          points:
          - पत्ता
          - आसमान
          - टमाटर
          - बादल
        - title: रंग
          points:
          - हरा
          - नीला
          - लाल
          - सफ़ेद
        alt: चीज़ें और उनके रंग।
      check:
        prompt: सूरजमुखी का फूल किस रंग का होता है?
        options:
        - पीला
        - नीला
        - काला
        answer: पीला
        why: सूरजमुखी की पंखुड़ियाँ पीली होती हैं।
    - teach: 'इंद्रधनुष बारिश के बाद धूप निकलने पर दिखता है। उसमें सात रंग होते हैं: बैंगनी, जामुनी, नीला, हरा, पीला, नारंगी, लाल।'
      picture:
        kind: flow
        steps:
        - बैंगनी
        - जामुनी
        - नीला
        - हरा
        - पीला
        - नारंगी
        - लाल
        alt: इंद्रधनुष के सात रंग।
      check:
        prompt: इंद्रधनुष कब दिखता है?
        options:
        - बारिश के बाद धूप में
        - आधी रात को
        - बंद कमरे में
        answer: बारिश के बाद धूप में
        why: धूप पानी की बूँदों से गुज़रकर सात रंग बनाती है।
    - teach: 'रंग मिलाने से नए रंग बनते हैं: नीला + पीला = हरा, लाल + पीला = नारंगी, लाल + नीला = बैंगनी। होली रंगों का त्योहार है।'
      check:
        prompt: लाल और पीला मिलाने से कौन-सा रंग बनता है?
        options:
        - नारंगी
        - हरा
        - काला
        answer: नारंगी
        why: लाल और पीला मिलकर संतरे जैसा नारंगी बनाते हैं।
  items:
  - prompt: पत्तों का रंग कैसा होता है?
    options:
    - हरा
    - नीला
    - काला
    - गुलाबी
    answer: हरा
    difficulty: 1
    hints:
    - पेड़ देखो।
    - घास जैसा।
    solution: पत्ते हरे होते हैं।
    mistakes: {"नीला": "h2_patta", "काला": "h2_patta", "गुलाबी": "h2_patta"}
  - prompt: साफ़ दिन में आसमान कैसा दिखता है?
    options:
    - नीला
    - लाल
    - भूरा
    - हरा
    answer: नीला
    difficulty: 1
    hints:
    - ऊपर देखो।
    - समुद्र जैसा।
    solution: आसमान नीला दिखता है।
    mistakes: {"लाल": "h2_aasmaan", "भूरा": "h2_aasmaan", "हरा": "h2_aasmaan"}
  - prompt: इंद्रधनुष में कितने रंग होते हैं?
    options:
    - सात
    - दो
    - दस
    - एक
    answer: सात
    difficulty: 2
    hints:
    - बैं-नी-आ-ह-पी-ना-ला।
    - गिनो।
    solution: इंद्रधनुष में सात रंग होते हैं।
    mistakes: {"दो": "h2_indradhanush", "दस": "h2_indradhanush", "एक": "h2_indradhanush"}
  - prompt: '''रंग-बिरंगी'' का मतलब है:'
    options:
    - कई रंगों वाली
    - बिना रंग की
    - काली
    - टूटी हुई
    answer: कई रंगों वाली
    difficulty: 2
    hints:
    - बहुत सारे रंग।
    - तितली जैसी।
    solution: रंग-बिरंगी यानी कई रंगों वाली।
    mistakes:
      बिना रंग की: hin2_word
  - prompt: कौन-सा शब्द रंग का नाम है?
    options:
    - पीला
    - पेड़
    - पानी
    - पतंग
    answer: पीला
    difficulty: 1
    hints:
    - सूरज जैसा।
    - रंग।
    solution: पीला एक रंग है।
    mistakes: {"पेड़": "h2_rang_naam", "पानी": "h2_rang_naam", "पतंग": "h2_rang_naam"}
  - prompt: रंगों का त्योहार कौन-सा है?
    options:
    - होली
    - राखी
    - ईद
    - ओणम
    answer: होली
    difficulty: 1
    hints:
    - गुलाल।
    - पिचकारी।
    solution: होली रंगों का त्योहार है।
    mistakes: {"राखी": "h2_tyohar", "ईद": "h2_tyohar", "ओणम": "h2_tyohar"}
  - prompt: नीला और पीला मिलाने से कौन-सा रंग बनता है?
    options:
    - हरा
    - लाल
    - सफ़ेद
    answer: हरा
    difficulty: 1
    hints:
    - यह पत्तों का रंग है।
    - घास भी इसी रंग की है।
    solution: 'चरण 1: नीला + पीला। चरण 2: = हरा।'
    mistakes:
      लाल: c2h9_mel
      सफ़ेद: c2h9_mel
  - prompt: बादल प्रायः किस रंग के होते हैं?
    options:
    - सफ़ेद
    - हरे
    - नारंगी
    answer: सफ़ेद
    difficulty: 1
    hints:
    - रुई जैसे दिखते हैं।
    - दूध का रंग।
    solution: 'चरण 1: साफ़ दिन के बादल रुई जैसे। चरण 2: उनका रंग सफ़ेद।'
    mistakes:
      हरे: c2h9_rang
      नारंगी: c2h9_rang
  - prompt: संतरा किस रंग का होता है?
    options:
    - नारंगी
    - नीला
    - काला
    answer: नारंगी
    difficulty: 1
    hints:
    - संतरे का दूसरा नाम ही रंग है।
    - लाल और पीले के बीच का रंग।
    solution: 'चरण 1: संतरे को नारंगी भी कहते हैं। चरण 2: उसका रंग नारंगी है।'
    mistakes:
      नीला: c2h9_rang
      काला: c2h9_rang
  - prompt: रात का आसमान कैसा दिखता है?
    options:
    - काला
    - पीला
    - हरा
    answer: काला
    difficulty: 1
    hints:
    - सूरज छिप जाता है।
    - अँधेरा होता है।
    solution: 'चरण 1: रात में सूरज नहीं। चरण 2: आसमान काला दिखता है।'
    mistakes:
      पीला: h2_aasmaan
      हरा: h2_aasmaan
  - prompt: लाल और नीला मिलाने से कौन-सा रंग बनता है?
    options:
    - बैंगनी
    - पीला
    - सफ़ेद
    answer: बैंगनी
    difficulty: 2
    hints:
    - एक सब्ज़ी के नाम जैसा रंग।
    - जामुन जैसा गहरा रंग।
    solution: 'चरण 1: लाल + नीला। चरण 2: = बैंगनी।'
    mistakes:
      पीला: c2h9_mel
      सफ़ेद: c2h9_mel
  - prompt: इंद्रधनुष का आखिरी (बाहर वाला) रंग कौन-सा है?
    options:
    - लाल
    - हरा
    - नीला
    answer: लाल
    difficulty: 2
    hints:
    - बैंगनी से शुरू होकर गिनो।
    - नारंगी के बाद।
    solution: 'चरण 1: बैंगनी, जामुनी, नीला, हरा, पीला, नारंगी ... चरण 2: आखिरी लाल।'
    mistakes:
      हरा: c2h9_kram
      नीला: c2h9_kram
  - prompt: '''रंग-बिरंगा'' कौन-सा है?'
    options:
    - तितली के पंख
    - काला कोयला
    - सफ़ेद दूध
    answer: तितली के पंख
    difficulty: 2
    hints:
    - रंग-बिरंगा मतलब कई रंग।
    - किसमें एक ही रंग नहीं?
    solution: 'चरण 1: कोयला और दूध एक रंग के। चरण 2: तितली के पंख कई रंग के।'
    mistakes:
      काला कोयला: c2h9_shabd
      सफ़ेद दूध: c2h9_shabd
  - prompt: किस शब्द में ई (ी) की मात्रा है?
    options:
    - पीला
    - लाल
    - हरा
    answer: पीला
    difficulty: 2
    hints:
    - पहले अक्षर पर ध्यान दो।
    - ी की मात्रा अक्षर के बाद लंबी खड़ी लकीर है।
    solution: 'चरण 1: लाल, हरा में ई नहीं। चरण 2: ''पी'' में ई की मात्रा।'
    mistakes:
      लाल: c2h9_shabd
      हरा: c2h9_shabd
  - prompt: हरा रंग बनाना है पर तुम्हारे पास सिर्फ़ पीला है। और कौन-सा रंग चाहिए?
    options:
    - नीला
    - लाल
    - सफ़ेद
    answer: नीला
    difficulty: 3
    hints:
    - हरा किन दो रंगों से बनता है?
    - पीला तो है, दूसरा कौन?
    solution: 'चरण 1: हरा = नीला + पीला। चरण 2: पीला है, तो नीला चाहिए।'
    mistakes:
      लाल: c2h9_mel
      सफ़ेद: c2h9_mel
