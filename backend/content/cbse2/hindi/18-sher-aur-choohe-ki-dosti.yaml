subject: cbse2-hin
chapter: 18
title: शेर और चूहे की दोस्ती
tips:
  h2_chooha: "चूहे के पास कैंची नहीं होती। वह रोटी और कपड़े किससे काट देता है?"
  h2_sher_jaal: "शिकारी जानवर पकड़ने के लिए रस्सियों से बुनी कौन-सी चीज़ बिछाते हैं?"
  h2_sher_raja: "शेर कहाँ रहता है? वहीं के सब जानवर उससे डरते हैं।"
  h2_sher_seekh: "बड़ा शेर जाल से खुद नहीं निकल पाया। अंत में उसे किसने बचाया?"
  c2h18_katha: 'कहानी फिर से याद करो: पहले क्या हुआ, फिर क्या हुआ?'
  c2h18_seekh: सोचो, कहानी में छोटे जीव ने बड़े के लिए क्या किया?
  c2h18_ulta: उलटा शब्द बिलकुल दूसरी तरफ़ का होता है, जैसे दिन-रात।

concepts:
- code: cbse2h.18.sher
  title: शेर और चूहे की दोस्ती
  notes: |
    शेर और चूहे की प्रसिद्ध कहानी: शेर ने चूहे को छोड़ा; बाद में शिकारी के जाल में फँसे शेर को चूहे ने जाल कुतरकर बचाया। छोटा भी बड़ी मदद कर सकता है। (पाठ की ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।)
  explanations:
    text: शेर ने एक छोटे चूहे को छोड़ दिया। बाद में शेर शिकारी के जाल में फँस गया, तब चूहे ने जाल कुतरकर उसे बचाया। छोटा भी बड़ी मदद कर सकता है।
    visual: 'चित्र बनाओ: जाल में फँसा शेर और जाल कुतरता छोटा चूहा।'
    step_by_step: 1. कहानी पढ़ो। 2. शेर ने चूहे के साथ क्या किया? 3. शेर कैसे फँसा? 4. चूहे ने कैसे मदद की?
    real_world: कक्षा का सबसे छोटा बच्चा भी किसी बड़े काम में मदद कर सकता है।
  picture:
    kind: flow
    steps:
    - शेर ने चूहा छोड़ा
    - शेर जाल में फँसा
    - चूहे ने जाल कुतरा
    - दोनों दोस्त बने
    alt: शेर ने चूहा छोड़ा, शेर जाल में फँसा, चूहे ने जाल कुतरा और दोनों दोस्त बन गए।
  activity:
    type: order
    prompt: शेर और चूहे की कहानी क्रम से लगाओ।
    steps:
    - 🐭 चूहा सोते शेर पर उछलता है
    - 🦁 शेर चूहे को छोड़ देता है
    - 🕸️ शेर शिकारी के जाल में फँसता है
    - 🐭 चूहा जाल कुतरकर बचाता है
    reasons:
      🦁 शेर चूहे को छोड़ देता है: छोड़ने के लिए पहले चूहा पकड़ा जाना चाहिए।
      🕸️ शेर शिकारी के जाल में फँसता है: यह बाद में, किसी और दिन हुआ।
      🐭 चूहा जाल कुतरकर बचाता है: जाल में फँसने पर ही बचाने की ज़रूरत पड़ी।
  lesson:
    - teach: एक दिन शेर सो रहा था। एक छोटा चूहा उसके ऊपर उछल-कूद करने लगा। शेर जाग गया और चूहे को पकड़ लिया। चूहे ने कहा, 'मुझे छोड़ दो, कभी मैं भी तुम्हारे काम आऊँगा।' शेर हँसा और उसे छोड़ दिया।
      picture:
        kind: flow
        steps:
        - शेर सो रहा था
        - चूहा ऊपर कूदा
        - शेर ने पकड़ा
        - शेर ने छोड़ दिया
        alt: 'कहानी की शुरुआत: शेर ने चूहे को छोड़ दिया।'
      check:
        prompt: चूहे के पकड़े जाने पर शेर ने क्या किया?
        options:
        - उसे छोड़ दिया
        - उसे खा लिया
        - उसे पिंजरे में रखा
        answer: उसे छोड़ दिया
        why: शेर हँसा और चूहे को जाने दिया।
    - teach: कुछ दिन बाद शेर शिकारी के जाल में फँस गया। वह दहाड़ा। चूहे ने आवाज़ सुनी, दौड़कर आया और अपने तेज़ दाँतों से जाल कुतर दिया। शेर आज़ाद हो गया।
      picture:
        kind: flow
        steps:
        - शेर जाल में फँसा
        - शेर दहाड़ा
        - चूहा दौड़कर आया
        - 'जाल कुतरा: शेर आज़ाद'
        alt: चूहे ने जाल कुतरकर शेर को बचाया।
      check:
        prompt: चूहे को कैसे पता चला कि शेर मुसीबत में है?
        options:
        - शेर की दहाड़ सुनकर
        - चिट्ठी पढ़कर
        - फ़ोन से
        answer: शेर की दहाड़ सुनकर
        why: फँसे शेर की दहाड़ जंगल में गूँजी और चूहे ने सुनी।
    - teach: 'सीख: कोई छोटा हो तो भी बड़ी मदद कर सकता है। किसी को छोटा समझकर मज़ाक नहीं उड़ाना। भलाई का बदला भलाई से मिलता है। शेर को जंगल का राजा कहते हैं।'
      check:
        prompt: कहानी की सीख क्या है?
        options:
        - छोटा भी बड़ी मदद कर सकता है
        - बड़े हमेशा जीतते हैं
        - किसी की मदद मत करो
        answer: छोटा भी बड़ी मदद कर सकता है
        why: छोटे चूहे ने बड़े शेर को बचाया।
  items:
  - prompt: शेर किसमें फँस गया?
    options:
    - जाल में
    - पेड़ में
    - नदी में
    - गुफा में
    answer: जाल में
    difficulty: 1
    hints:
    - शिकारी ने बिछाया।
    - रस्सियों का।
    solution: शेर जाल में फँस गया।
    mistakes: {"पेड़ में": "h2_sher_jaal", "नदी में": "h2_sher_jaal", "गुफा में": "h2_sher_jaal"}
  - prompt: शेर को किसने बचाया?
    options:
    - चूहे ने
    - हाथी ने
    - बंदर ने
    - शिकारी ने
    answer: चूहे ने
    difficulty: 1
    hints:
    - छोटा जीव।
    - कहानी का नाम।
    solution: चूहे ने शेर को बचाया।
    mistakes:
      हाथी ने: hin2_read_again
  - prompt: चूहे ने जाल कैसे काटा?
    options:
    - दाँतों से कुतरकर
    - कैंची से
    - आग से
    - पैर से
    answer: दाँतों से कुतरकर
    difficulty: 2
    hints:
    - चूहे के तेज़ दाँत।
    - कुतरना।
    solution: चूहे ने दाँतों से जाल कुतरा।
    mistakes: {"कैंची से": "h2_chooha", "आग से": "h2_chooha", "पैर से": "h2_chooha"}
  - prompt: कहानी से क्या सीख मिलती है?
    options:
    - छोटा भी बड़ी मदद कर सकता है
    - छोटे किसी काम के नहीं
    - शेर से डरो
    - दोस्ती मत करो
    answer: छोटा भी बड़ी मदद कर सकता है
    difficulty: 1
    hints:
    - चूहा छोटा था।
    - फिर भी बचाया।
    solution: छोटा भी बड़ी मदद कर सकता है।
    mistakes: {"छोटे किसी काम के नहीं": "h2_sher_seekh", "शेर से डरो": "h2_sher_seekh", "दोस्ती मत करो": "h2_sher_seekh"}
  - prompt: शेर को क्या कहते हैं?
    options:
    - जंगल का राजा
    - पानी का राजा
    - आसमान का राजा
    - घर का राजा
    answer: जंगल का राजा
    difficulty: 2
    hints:
    - जंगल में रहता है।
    - दहाड़ता है।
    solution: शेर जंगल का राजा कहलाता है।
    mistakes: {"पानी का राजा": "h2_sher_raja", "आसमान का राजा": "h2_sher_raja", "घर का राजा": "h2_sher_raja"}
  - prompt: '''छोटा'' का उलटा क्या है?'
    options:
    - बड़ा
    - मोटा
    - लंबा ही
    - नया
    answer: बड़ा
    difficulty: 1
    hints:
    - शेर और चूहा।
    - विशाल।
    solution: छोटा का उलटा बड़ा है।
    mistakes: {"मोटा": "h1_ulta", "लंबा ही": "h1_ulta", "नया": "h1_ulta"}
  - prompt: शेर कैसी आवाज़ करता है?
    options:
    - दहाड़
    - म्याऊँ
    - चूँ-चूँ
    answer: दहाड़
    difficulty: 1
    hints:
    - जंगल में गूँजने वाली ज़ोरदार आवाज़।
    - चूँ-चूँ तो चूहा करता है।
    solution: 'चरण 1: शेर की आवाज़ बहुत ज़ोरदार है। चरण 2: उसे दहाड़ कहते हैं।'
    mistakes:
      म्याऊँ: c2h18_katha
      चूँ-चूँ: c2h18_katha
  - prompt: कहानी की शुरुआत में शेर क्या कर रहा था?
    options:
