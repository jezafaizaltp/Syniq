    - शिकार कर रहा था
    - नहा रहा था
    answer: सो रहा था
    difficulty: 1
    hints:
    - चूहा उसके ऊपर कूद सका।
    - शेर बाद में जागा।
    solution: 'चरण 1: चूहे के कूदने से शेर जागा। चरण 2: तो वह पहले सो रहा था।'
    mistakes:
      शिकार कर रहा था: c2h18_katha
      नहा रहा था: c2h18_katha
  - prompt: जाल किसने बिछाया था?
    options:
    - शिकारी ने
    - चूहे ने
    - हाथी ने
    answer: शिकारी ने
    difficulty: 1
    hints:
    - जानवर पकड़ने वाला व्यक्ति।
    - चूहा तो बचाने आया था।
    solution: 'चरण 1: जानवर पकड़ने के लिए जाल बिछाते हैं। चरण 2: शिकारी ने बिछाया।'
    mistakes:
      चूहे ने: c2h18_katha
      हाथी ने: c2h18_katha
  - prompt: '''आज़ाद'' का अर्थ क्या है?'
    options:
    - छूटा हुआ, बंधन से मुक्त
    - फँसा हुआ
    - सोया हुआ
    answer: छूटा हुआ, बंधन से मुक्त
    difficulty: 1
    hints:
    - जाल कटने के बाद शेर कैसा हो गया?
    - अब कोई बंधन नहीं।
    solution: 'चरण 1: जाल कटा तो शेर छूट गया। चरण 2: आज़ाद = बंधन से मुक्त।'
    mistakes:
      फँसा हुआ: c2h18_ulta
      सोया हुआ: c2h18_ulta
  - prompt: '''कमज़ोर'' का उलटा क्या है?'
    options:
    - ताकतवर
    - छोटा
    - डरपोक
    answer: ताकतवर
    difficulty: 1
    hints:
    - शेर कैसा है?
    - जिसमें बहुत ताकत हो।
    solution: 'चरण 1: कमज़ोर में ताकत कम। चरण 2: उलटा ताकतवर।'
    mistakes:
      छोटा: c2h18_ulta
      डरपोक: c2h18_ulta
  - prompt: कक्षा का सबसे छोटा बच्चा पहेली का जवाब जानता है। हम क्या करें?
    options:
    - ध्यान से उसकी बात सुनें
    - छोटा है कहकर अनसुना करें
    - हँसें
    answer: ध्यान से उसकी बात सुनें
    difficulty: 2
    hints:
    - कहानी में छोटे चूहे ने क्या किया?
    - छोटा भी बहुत कुछ जानता है।
    solution: 'चरण 1: छोटा भी काम की बात जानता है। चरण 2: ध्यान से सुनो।'
    mistakes:
      छोटा है कहकर अनसुना करें: c2h18_seekh
      हँसें: c2h18_seekh
  - prompt: शेर ने चूहे को छोड़ा, फिर चूहे ने शेर को बचाया। इससे क्या पता चलता है?
    options:
    - भलाई का बदला भलाई से मिलता है
    - शेर डरपोक था
    - चूहा शेर से बड़ा था
