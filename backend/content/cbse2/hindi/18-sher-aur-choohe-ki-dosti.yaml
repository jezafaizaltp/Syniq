    difficulty: 2
    hints:
    - पहले किसने किसके साथ अच्छा किया?
    - फिर बदले में क्या मिला?
    solution: 'चरण 1: शेर ने चूहे पर दया की। चरण 2: चूहे ने बदले में शेर की जान बचाई।'
    mistakes:
      शेर डरपोक था: c2h18_seekh
      चूहा शेर से बड़ा था: c2h18_seekh
  - prompt: '''कुतरना'' का मतलब क्या है?'
    options:
    - दाँतों से थोड़ा-थोड़ा काटना
    - पानी में डुबोना
    - ज़ोर से चिल्लाना
    answer: दाँतों से थोड़ा-थोड़ा काटना
    difficulty: 2
    hints:
    - चूहे ने जाल के साथ क्या किया?
    - चूहे के दाँत बहुत तेज़ होते हैं।
    solution: 'चरण 1: चूहे ने दाँतों से जाल काटा। चरण 2: कुतरना = दाँतों से थोड़ा-थोड़ा काटना।'
    mistakes:
      पानी में डुबोना: c2h18_katha
      ज़ोर से चिल्लाना: c2h18_katha
  - prompt: 'क्रम से लगाओ: (1) चूहे ने जाल कुतरा (2) शेर ने चूहे को छोड़ा (3) शेर जाल में फँसा। दूसरी घटना कौन-सी है?'
    options:
    - शेर जाल में फँसा
    - चूहे ने जाल कुतरा
    - शेर ने चूहे को छोड़ा
    answer: शेर जाल में फँसा
    difficulty: 3
    hints:
    - सबसे पहले शेर और चूहे की पहली मुलाकात।
    - जाल कुतरने से पहले शेर का फँसना ज़रूरी है।
    solution: 'चरण 1: पहले शेर ने चूहे को छोड़ा। चरण 2: फिर शेर जाल में फँसा। चरण 3: अंत में चूहे ने जाल कुतरा।'
    mistakes:
      चूहे ने जाल कुतरा: c2h18_katha
      शेर ने चूहे को छोड़ा: c2h18_katha
