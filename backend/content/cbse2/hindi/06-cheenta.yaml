subject: cbse2-hin
chapter: 6
title: चींटा
tips:
  h2_cheenti_chal: "चींटियों को ज़मीन पर ध्यान से देखो: वे एक के पीछे एक कैसे चलती हैं?"
  h2_cheenti_meetha: "रसोई में कौन-सी चीज़ खुली छोड़ दो तो चींटियों की कतार उस तक पहुँच जाती है?"
  h2_cheenti_seekh: "चींटी अपने से भारी दाना उठाकर भी थकती नहीं। इससे कौन-सी अच्छी आदत सीखते हैं?"
  h2_keet_pair: "कीड़ों के पैर तीन जोड़ी होते हैं। एक जोड़ी में दो पैर, तो तीन जोड़ी में कितने?"
  c2h6_vachan: '''नदी'' से ''नदियाँ'' कैसे बना? वैसे ही सोचो।'
  c2h6_cheenti: ज़मीन पर चलती चींटियों को याद करो। वे क्या करती दिखती हैं?
  c2h6_ulta: उलटा शब्द बिलकुल दूसरी तरफ़ का होता है, जैसे दिन-रात।
  c2h6_ginti: गिनती उँगलियों पर करो। पहले एक का, फिर बाकी का।

concepts:
- code: cbse2h.06.cheenta
  title: चींटा
  notes: |
    चींटे (बड़ी चींटी) पर कविता/कहानी: छोटा पर मेहनती, कतार में चलना, खाना जमा करना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: चींटा बड़ी चींटी को कहते हैं। वह छोटा होकर भी बहुत मेहनती है। चींटे-चींटियाँ कतार में चलते हैं और मिलकर खाना जमा करते हैं।
    visual: 'चित्र बनाओ: कतार में चलते चींटे, एक के ऊपर चीनी का दाना।'
    step_by_step: 1. पाठ पढ़ो। 2. चींटा कैसा है? 3. वह क्या करता है? 4. हम उससे क्या सीखें?
    real_world: मीठा ज़मीन पर गिर जाए तो थोड़ी देर में चींटियाँ आ जाती हैं।
  picture:
    kind: flow
    steps:
    - दाना दिखा
    - साथियों को बताया
    - मिलकर उठाया
    - बिल में ले गए
    alt: दाना दिखा, साथियों को बताया, मिलकर उठाया और बिल में ले गए।
  activity:
    type: sort
    prompt: चींटे के बारे में कौन-सी बात सही है?
    bins:
    - सही
    - सही नहीं
    items:
    - label: 🐜 कतार में चलता है
      bin: सही
      clue: चींटे एक के पीछे एक?
      why: कतार में चलते हैं।
    - label: 🍬 खाना जमा करता है
      bin: सही
      clue: बारिश के लिए क्या रखते हैं?
      why: खाना जमा करते हैं।
    - label: 💪 मेहनती है
      bin: सही
      clue: छोटा पर कैसा?
      why: मेहनती।
    - label: 🐘 बहुत बड़ा है
      bin: सही नहीं
      clue: चींटा हाथी जितना?
      why: चींटा छोटा है।
  lesson:
    - teach: चींटा बड़ी चींटी को कहते हैं। चींटियाँ छोटी होती हैं पर बहुत मेहनती। वे अपने से भारी दाना उठा लेती हैं और कतार में एक के पीछे एक चलती हैं।
      picture:
        kind: flow
        steps:
        - दाना मिला
        - कतार में चलीं
        - बिल तक ले गईं
        - सर्दी के लिए जमा किया
        alt: चींटियाँ दाना ढूँढकर बिल में जमा करती हैं।
      check:
        prompt: चींटियाँ दाना कहाँ ले जाती हैं?
        options:
        - अपने बिल में
        - पेड़ की चोटी पर
        - नदी में
        answer: अपने बिल में
        why: चींटियाँ खाना बिल में जमा करती हैं।
      ways:
      - style: step_by_step
        teach: 'चींटियों को ध्यान से देखो। पहला: किसी बड़े के साथ बगीचे में बैठो। दूसरा: ज़मीन पर चींटियों का रास्ता ढूँढो। तीसरा: देखो, वे क्या उठाकर ले जा रही हैं। चौथा: उन्हें छेड़ो मत, बस देखते रहो।'
      - style: real_world
        teach: बारिश से पहले चींटियाँ अक्सर अपने अंडे और दाने लेकर किसी ऊँची, सूखी जगह की ओर जाती दिखती हैं।
    - teach: 'चींटियाँ मिल-जुलकर काम करती हैं। एक चींटी को खाना मिले तो बाकी को भी बताती है। इससे सीख मिलती है: मेहनत करो और मिलकर काम करो।'
      check:
        prompt: चींटियों से हमें कौन-सी सीख मिलती है?
        options:
        - मिलकर मेहनत करना
        - दिन भर सोना
        - अकेले सब खा लेना
        answer: मिलकर मेहनत करना
        why: चींटियाँ साथ मिलकर लगातार काम करती हैं।
      ways:
      - style: visual
        teach: एक चींटी को खाना मिलने पर बाकी चींटियों तक ख़बर कैसे पहुँचती है।
        picture:
          kind: flow
          steps:
          - एक चींटी को खाना मिलता है
          - वह रास्ते पर गंध छोड़ती हुई घर लौटती है
          - दूसरी चींटियाँ उस गंध के पीछे चलती हैं
          - सब मिलकर खाना घर ले जाती हैं
          alt: एक चींटी को खाना मिलता है। वह रास्ते पर गंध छोड़ती हुई लौटती है, दूसरी चींटियाँ गंध के पीछे आती हैं, और सब मिलकर खाना घर ले जाती हैं।
      - style: real_world
        teach: गाँव में छत डालने के दिन कई पड़ोसी मिलकर काम करते हैं, तो इतना बड़ा काम भी एक ही दिन में पूरा हो जाता है।
    - teach: चींटी एक कीड़ा है। कीड़ों के छह पैर होते हैं। चींटियों को मीठा बहुत पसंद है। बड़ा-छोटा, भारी-हल्का, मेहनती-आलसी जैसे उलटे शब्द याद रखो।
      check:
        prompt: '''मेहनती'' का उलटा क्या है?'
        options:
        - आलसी
        - छोटा
        - मीठा
        answer: आलसी
        why: जो मेहनत न करे, उसे आलसी कहते हैं।
      ways:
      - style: visual
        teach: कुछ और रोज़ के शब्द, और उनके उलटे अर्थ वाले शब्द।
        picture:
          kind: compare
          columns:
          - title: शब्द
            points:
            - गर्म
            - मीठा
            - सुबह
          - title: उलटा
            points:
            - ठंडा
            - कड़वा
            - शाम
          alt: गर्म का उलटा ठंडा, मीठा का उलटा कड़वा, और सुबह का उलटा शाम है।
      - style: step_by_step
        teach: 'कीड़ा पहचानो। पहला: जीव के पैर गिनो। दूसरा: छह पैर हैं? तो वह कीड़ा है। तीसरा: आठ पैर हैं? तो वह मकड़ी जैसा जीव है, कीड़ा नहीं। चौथा: तितली और मक्खी के पैर भी गिनकर देखो।'
  items:
  - prompt: चींटियाँ कैसे चलती हैं?
    options:
    - कतार में
    - उड़कर
    - तैरकर
    - उछलकर
    answer: कतार में
    difficulty: 1
    hints:
    - एक के पीछे एक।
    - लाइन।
    solution: चींटियाँ कतार में चलती हैं।
    mistakes: {"उड़कर": "h2_cheenti_chal", "तैरकर": "h2_cheenti_chal", "उछलकर": "h2_cheenti_chal"}
  - prompt: चींटे से हमें क्या सीख मिलती है?
    options:
    - मेहनत करना
    - आलस करना
    - झगड़ना
    - सोते रहना
    answer: मेहनत करना
    difficulty: 1
    hints:
    - दिन भर काम।
    - परिश्रम।
    solution: चींटा मेहनत करना सिखाता है।
    mistakes: {"आलस करना": "h2_cheenti_seekh", "झगड़ना": "h2_cheenti_seekh", "सोते रहना": "h2_cheenti_seekh"}
  - prompt: चींटियों को क्या पसंद है?
    options:
    - मीठा
    - पत्थर
    - पानी में डूबना
    - धुआँ
    answer: मीठा
    difficulty: 1
    hints:
    - चीनी गिराकर देखो।
    - शक्कर।
    solution: चींटियों को मीठा पसंद है।
    mistakes: {"पत्थर": "h2_cheenti_meetha", "पानी में डूबना": "h2_cheenti_meetha", "धुआँ": "h2_cheenti_meetha"}
  - prompt: चींटी के कितने पैर होते हैं?
    options:
