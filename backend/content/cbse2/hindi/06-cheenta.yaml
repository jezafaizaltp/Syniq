    difficulty: 2
    hints:
    - एक चींटी के छह पैर।
    - छह और छह।
    solution: 'चरण 1: एक चींटी के 6 पैर। चरण 2: 6 + 6 = 12 पैर।'
    mistakes:
      छह: c2h6_ginti
      आठ: c2h6_ginti
  - prompt: कक्षा की सफ़ाई में चींटियों जैसा कैसे काम करें?
