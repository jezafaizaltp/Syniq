    - आलसी और सुस्त एक जैसे हैं।
    solution: 'चरण 1: चींटी लगातार काम करती है। चरण 2: वह मेहनती है।'
    mistakes:
      आलसी: h2_cheenti_seekh
      सुस्त: h2_cheenti_seekh
  - prompt: चींटियाँ सर्दी से पहले क्या करती हैं?
    options:
