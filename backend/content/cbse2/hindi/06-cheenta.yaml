    - घूमने जाती हैं
    - गाना गाती हैं
    answer: खाना जमा करती हैं
    difficulty: 2
    hints:
    - सर्दी में खाना ढूँढना कठिन है।
    - वे पहले से तैयारी करती हैं।
    solution: 'चरण 1: सर्दी में बाहर खाना कम मिलता है। चरण 2: इसलिए चींटियाँ पहले से जमा करती हैं।'
    mistakes:
      घूमने जाती हैं: c2h6_cheenti
      गाना गाती हैं: c2h6_cheenti
  - prompt: दो चींटियों के कुल कितने पैर होंगे?
