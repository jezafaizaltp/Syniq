subject: cbse2-hin
chapter: 6
title: चींटा
tips:
  h2_cheenti_chal: "चींटियों को ज़मीन पर ध्यान से देखो: वे एक के पीछे एक कैसे चलती हैं?"
  h2_cheenti_meetha: "रसोई में कौन-सी चीज़ खुली छोड़ दो तो चींटियों की कतार उस तक पहुँच जाती है?"
  h2_cheenti_seekh: "चींटी अपने से भारी दाना उठाकर भी थकती नहीं। इससे कौन-सी अच्छी आदत सीखते हैं?"
  h2_keet_pair: "कीड़ों के पैर तीन जोड़ी होते हैं। एक जोड़ी में दो पैर, तो तीन जोड़ी में कितने?"

concepts:
- code: cbse2h.06.cheenta
  title: चींटा
  notes: |
    चींटे (बड़ी चींटी) पर कविता/कहानी: छोटा पर मेहनती, कतार में चलना, खाना जमा करना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: चींटा बड़ी चींटी को कहते हैं। वह छोटा होकर भी बहुत मेहनती है। चींटे-चींटियाँ कतार में चलते हैं और मिलकर खाना जमा करते हैं।
    visual: 'चित्र बनाओ: कतार में चलते चींटे, एक के ऊपर चीनी का दाना।'
    step_by_step: 1. पाठ पढ़ो। 2. चींटा कैसा है? 3. वह क्या करता है? 4. हम उससे क्या सीखें?
    real_world: मीठा ज़मीन पर गिर जाए तो थोड़ी देर में चींटियाँ आ जाती हैं।
  picture:
    kind: flow
    steps:
    - दाना दिखा
    - साथियों को बताया
    - मिलकर उठाया
    - बिल में ले गए
    alt: दाना दिखा, साथियों को बताया, मिलकर उठाया और बिल में ले गए।
  activity:
    type: sort
    prompt: चींटे के बारे में कौन-सी बात सही है?
    bins:
    - सही
    - सही नहीं
    items:
    - label: 🐜 कतार में चलता है
      bin: सही
      clue: चींटे एक के पीछे एक?
      why: कतार में चलते हैं।
    - label: 🍬 खाना जमा करता है
      bin: सही
      clue: बारिश के लिए क्या रखते हैं?
      why: खाना जमा करते हैं।
    - label: 💪 मेहनती है
      bin: सही
      clue: छोटा पर कैसा?
      why: मेहनती।
    - label: 🐘 बहुत बड़ा है
      bin: सही नहीं
      clue: चींटा हाथी जितना?
      why: चींटा छोटा है।
  items:
  - prompt: चींटियाँ कैसे चलती हैं?
    options:
    - कतार में
    - उड़कर
    - तैरकर
    - उछलकर
    answer: कतार में
    difficulty: 1
    hints:
    - एक के पीछे एक।
    - लाइन।
    solution: चींटियाँ कतार में चलती हैं।
    mistakes: {"उड़कर": "h2_cheenti_chal", "तैरकर": "h2_cheenti_chal", "उछलकर": "h2_cheenti_chal"}
  - prompt: चींटे से हमें क्या सीख मिलती है?
    options:
    - मेहनत करना
    - आलस करना
    - झगड़ना
    - सोते रहना
    answer: मेहनत करना
    difficulty: 1
    hints:
    - दिन भर काम।
    - परिश्रम।
    solution: चींटा मेहनत करना सिखाता है।
    mistakes: {"आलस करना": "h2_cheenti_seekh", "झगड़ना": "h2_cheenti_seekh", "सोते रहना": "h2_cheenti_seekh"}
  - prompt: चींटियों को क्या पसंद है?
    options:
    - मीठा
    - पत्थर
    - पानी में डूबना
    - धुआँ
    answer: मीठा
    difficulty: 1
    hints:
    - चीनी गिराकर देखो।
    - शक्कर।
    solution: चींटियों को मीठा पसंद है।
    mistakes: {"पत्थर": "h2_cheenti_meetha", "पानी में डूबना": "h2_cheenti_meetha", "धुआँ": "h2_cheenti_meetha"}
  - prompt: चींटी के कितने पैर होते हैं?
    options:
