    answer: छह
    difficulty: 2
    hints:
    - कीड़ों के छह पैर।
    - तीन जोड़ी।
    solution: चींटी के छह पैर होते हैं।
    mistakes: {"चार": "h2_keet_pair", "दो": "h2_keet_pair", "आठ": "h2_keet_pair"}
  - prompt: चींटियाँ कहाँ रहती हैं?
    options:
    - बिल में
    - घोंसले में
    - पानी में
    - बादल में
    answer: बिल में
    difficulty: 2
    hints:
    - ज़मीन के अंदर।
    - छोटा छेद।
    solution: चींटियाँ बिल में रहती हैं।
    mistakes:
      घोंसले में: hin2_read_again
  - prompt: बड़ा चींटा, छोटी ___ ?
    options:
    - चींटी
    - चीता
    - चाँटा
    - छींटा
    answer: चींटी
    difficulty: 2
    hints:
    - बड़ा चींटा, छोटी ...
    - ई से खत्म।
    solution: चींटा, चींटी।
    mistakes:
      चीता: hin2_word
  - prompt: चींटियाँ किस तरह चलती हैं?
    options:
