    mistakes:
      बड़ा: c2h6_ulta
      मोटा: c2h6_ulta
  - prompt: रसोई में चीनी खुली छोड़ दो तो कौन आ जाता है?
    options:
    - चींटियाँ
    - मछलियाँ
    - तोते
    answer: चींटियाँ
    difficulty: 1
    hints:
    - इन्हें मीठा बहुत पसंद है।
    - छोटे-छोटे जीव कतार में आते हैं।
    solution: 'चरण 1: चीनी मीठी है। चरण 2: मीठे की ओर चींटियाँ आती हैं।'
    mistakes:
      मछलियाँ: h2_cheenti_meetha
      तोते: h2_cheenti_meetha
  - prompt: चींटी को कौन-सा शब्द ठीक बताता है?
    options:
