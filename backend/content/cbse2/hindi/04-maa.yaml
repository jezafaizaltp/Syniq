subject: cbse2-hin
chapter: 4
title: माँ
tips:
  h2_chot: "जब तुम्हें चोट लगती है, माँ पहले घाव का क्या करती हैं ताकि दर्द कम हो?"
  h2_dhanyavad: "धन्यवाद दिल से कहा जाता है। ऐसा क्या करें कि माँ को तुम्हारा प्यार महसूस हो?"
  h2_maa: "याद करो, माँ तुम्हें सुलाते, खिलाते और गले लगाते समय क्या दिखाती हैं।"
  c2h4_madad: सोचो, कौन-सा काम माँ का काम हल्का करेगा?
  c2h4_tuk: दोनों शब्द बोलो। क्या अंत की आवाज़ एक जैसी है?
  c2h4_arth: हर विकल्प को वाक्य में रखकर पढ़ो। अर्थ ठीक बैठता है?

concepts:
- code: cbse2h.04.maa
  title: माँ
  notes: |
    माँ पर एक कविता: माँ का प्यार, देखभाल, हमारे लिए खाना बनाना, चोट लगने पर सहलाना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कविता माँ के बारे में है। माँ हमें प्यार करती हैं, हमारा ध्यान रखती हैं और हमें अच्छी बातें सिखाती हैं।
    visual: 'चित्र बनाओ: माँ बच्चे का हाथ पकड़कर चल रही हैं।'
    step_by_step: 1. कविता लय से पढ़ो। 2. माँ हमारे लिए क्या-क्या करती हैं? 3. हम माँ की मदद कैसे कर सकते हैं? 4. तुकांत शब्द खोजो।
    real_world: माँ के जन्मदिन पर बच्चे अपने हाथ से कार्ड बनाकर देते हैं।
  picture:
    kind: compare
    columns:
    - title: माँ करती हैं
      points:
      - खाना बनाना
      - प्यार करना
    - title: हम कर सकते हैं
      points:
      - थाली लगाना
      - कहना मानना
    alt: माँ खाना बनाती और प्यार करती हैं; हम थाली लगाकर और कहना मानकर मदद कर सकते हैं।
  activity:
    type: sort
    prompt: माँ क्या-क्या करती हैं, और हम माँ के लिए क्या कर सकते हैं?
    bins:
    - माँ करती हैं
    - हम कर सकते हैं
    items:
    - label: 🍲 खाना बनाना
      bin: माँ करती हैं
      clue: प्यार से खाना कौन बनाता है?
      why: माँ की देखभाल।
    - label: 🩹 चोट सहलाना
      bin: माँ करती हैं
      clue: चोट लगे तो कौन सँभालता है?
      why: माँ का प्यार।
    - label: 🧹 कामों में मदद
      bin: हम कर सकते हैं
      clue: माँ थकी हों तो हम?
      why: हम मदद कर सकते हैं।
    - label: 🤗 गले लगाना
      bin: हम कर सकते हैं
      clue: प्यार कैसे दिखाएँ?
      why: हम प्यार दिखा सकते हैं।
  lesson:
    - teach: माँ हमसे बहुत प्यार करती हैं। वे खाना बनाती हैं, कपड़े सँभालती हैं, बीमार होने पर देखभाल करती हैं और चोट लगने पर दवा लगाती हैं।
      check:
        prompt: बुखार होने पर माँ क्या करती हैं?
        options:
        - देखभाल करती हैं
        - डाँटती हैं
        - बाहर भेजती हैं
        answer: देखभाल करती हैं
        why: माँ आराम, दवा और प्यार से देखभाल करती हैं।
      ways:
      - style: visual
        teach: जब हमें ज़रूरत होती है, तब माँ क्या करती हैं।
        picture:
          kind: compare
          columns:
          - title: जब हम
            points:
            - भूखे होते हैं
            - बीमार होते हैं
            - डर जाते हैं
          - title: माँ
            points:
            - खाना देती हैं
            - देखभाल करती हैं
            - गले लगाती हैं
          alt: जब हम भूखे होते हैं तो माँ खाना देती हैं, बीमार होते हैं तो देखभाल करती हैं, और डर जाते हैं तो गले लगाती हैं।
      - style: real_world
        teach: रात को बच्चे को बुखार हो, तो माँ-पिता कई बार जागकर देखते हैं कि बच्चा ठीक से सो रहा है या नहीं।
    - teach: 'हम भी माँ की मदद कर सकते हैं: अपना बिस्तर ठीक करना, खिलौने जगह पर रखना, थाली उठाना, पौधों को पानी देना। ''धन्यवाद माँ'' कहना और गले लगाना भी अच्छा है।'
      picture:
        kind: flow
        steps:
        - बिस्तर ठीक करो
        - खिलौने जगह पर रखो
        - थाली उठाओ
        - धन्यवाद कहो
        alt: माँ की मदद के छोटे-छोटे काम।
      check:
        prompt: खाना खाने के बाद हम माँ की मदद कैसे करें?
        options:
        - अपनी थाली उठाकर रखें
        - थाली मेज़ पर छोड़ दें
        - थाली ज़मीन पर रख दें
        answer: अपनी थाली उठाकर रखें
        why: अपना काम खुद करने से माँ का काम हल्का होता है।
      ways:
      - style: step_by_step
        teach: 'माँ के लिए धन्यवाद-कार्ड बनाओ। पहला: एक कागज़ बीच से मोड़ो। दूसरा: बाहर एक फूल बनाओ। तीसरा: अंदर एक बात लिखो जो तुम्हें माँ की सबसे अच्छी लगती है। चौथा: कार्ड देकर मुस्कुराओ।'
      - style: real_world
        teach: कई घरों में खाने के बाद बच्चे अपनी थाली खुद रसोई तक ले जाते हैं। इससे बड़ों का काम थोड़ा हल्का हो जाता है।
    - teach: 'माँ के दूसरे नाम: माता, मम्मी, अम्मा, जननी। कविता में तुक वाले शब्द: माँ-कहाँ-यहाँ, प्यार-दुलार।'
      check:
        prompt: '''प्यार'' से तुक मिलाने वाला शब्द कौन-सा है?'
        options:
        - दुलार
        - माँ
        - खाना
        answer: दुलार
        why: प्यार और दुलार दोनों 'आर' पर खत्म होते हैं।
      ways:
      - style: visual
        teach: कुछ और शब्द, और उनसे तुक मिलाने वाले शब्द।
        picture:
          kind: compare
          columns:
          - title: शब्द
            points:
            - नाव
            - रात
            - आम
          - title: तुक वाला शब्द
            points:
            - गाँव
            - बात
            - काम
          alt: नाव और गाँव, रात और बात, आम और काम की आख़िरी आवाज़ मिलती है, इसलिए इनमें तुक है।
      - style: step_by_step
        teach: 'एक जैसे अर्थ वाले शब्द ढूँढो। पहला: एक शब्द लो: ''पानी''। दूसरा: सोचो, इसे और क्या कहते हैं: जल। तीसरा: वाक्य में रखकर देखो: ''मुझे जल चाहिए।'' चौथा: अर्थ वही रहा, तो दोनों का अर्थ एक है।'
  items:
  - prompt: माँ हमसे क्या करती हैं?
    options:
    - प्यार
    - गुस्सा ही गुस्सा
    - बात नहीं
    - डरती हैं
    answer: प्यार
    difficulty: 1
    hints:
    - कविता का भाव।
    - देखभाल।
    solution: माँ हमसे प्यार करती हैं।
    mistakes: {"गुस्सा ही गुस्सा": "h2_maa", "बात नहीं": "h2_maa", "डरती हैं": "h2_maa"}
  - prompt: हम माँ की मदद कैसे कर सकते हैं?
    options:
    - अपना सामान खुद रखकर
    - कमरा गंदा करके
    - खाना फेंककर
    - रोकर
    answer: अपना सामान खुद रखकर
    difficulty: 1
    hints:
    - छोटे काम।
    - अपना काम खुद।
    solution: अपना सामान खुद रखकर हम मदद कर सकते हैं।
    mistakes: {"कमरा गंदा करके": "h1_ghar_kaam", "खाना फेंककर": "h1_ghar_kaam", "रोकर": "h1_ghar_kaam"}
  - prompt: '''माँ'' का दूसरा शब्द क्या है?'
    options:
    - माता
    - मामा
    - मासी
    - मीठा
    answer: माता
    difficulty: 2
    hints:
    - म से शुरू।
    - माँ = ...
    solution: माँ को माता भी कहते हैं।
    mistakes:
      मामा: hin2_word
  - prompt: चोट लगने पर माँ क्या करती हैं?
    options:
    - दवा लगाती हैं
    - हँसती हैं
    - चली जाती हैं
    - डाँटती ही हैं
    answer: दवा लगाती हैं
    difficulty: 1
    hints:
    - ध्यान रखती हैं।
    - दर्द कम करती हैं।
    solution: माँ दवा लगाती हैं।
    mistakes: {"हँसती हैं": "h2_chot", "चली जाती हैं": "h2_chot", "डाँटती ही हैं": "h2_chot"}
  - prompt: '''माँ'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - कहाँ
    - घर
    - पेड़
    - बस
    answer: कहाँ
    difficulty: 2
    hints:
    - आखिरी आवाज़ -आँ।
    - बोलकर देखो।
    solution: माँ और कहाँ की तुक मिलती है।
    mistakes:
      घर: hin2_sound
  - prompt: माँ को धन्यवाद कैसे कहें?
    options:
    - प्यार से गले लगाकर
    - मुँह फेरकर
    - चिल्लाकर
    - चुप रहकर
    answer: प्यार से गले लगाकर
    difficulty: 1
    hints:
    - प्यार दिखाओ।
    - मीठे शब्द।
    solution: प्यार से गले लगाकर धन्यवाद कह सकते हैं।
    mistakes: {"मुँह फेरकर": "h2_dhanyavad", "चिल्लाकर": "h2_dhanyavad", "चुप रहकर": "h2_dhanyavad"}
  - prompt: '''माँ'' का एक और नाम कौन-सा है?'
    options:
    - जननी
    - बहन
    - चाची
    answer: जननी
    difficulty: 1
    hints:
    - जो हमें जन्म देती हैं।
    - बहन और चाची अलग रिश्ते हैं।
    solution: 'चरण 1: माँ हमें जन्म देती हैं। चरण 2: इसलिए माँ को जननी भी कहते हैं।'
    mistakes:
      बहन: c2h4_arth
      चाची: c2h4_arth
  - prompt: '''यहाँ'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - वहाँ
    - यह
    - घर
    answer: वहाँ
    difficulty: 1
    hints:
    - '''यहाँ'' के अंत में ''हाँ'' है।'
    - अंत की आवाज़ सुनो।
    solution: 'चरण 1: यहाँ ''हाँ'' पर खत्म होता है। चरण 2: वहाँ भी।'
    mistakes:
      यह: c2h4_tuk
      घर: c2h4_tuk
  - prompt: सुबह उठकर माँ की मदद के लिए क्या कर सकते हैं?
    options:
    - अपना बिस्तर ठीक करना
    - देर तक सोते रहना
    - कपड़े फ़र्श पर फेंकना
    answer: अपना बिस्तर ठीक करना
    difficulty: 1
    hints:
    - सुबह का एक छोटा काम।
    - जिस पर तुम सोए थे।
    solution: 'चरण 1: अपना काम खुद करो। चरण 2: बिस्तर ठीक करना मदद है।'
    mistakes:
      देर तक सोते रहना: c2h4_madad
      कपड़े फ़र्श पर फेंकना: c2h4_madad
  - prompt: माँ ने खाना बनाया। हम क्या कहें?
    options:
    - "धन्यवाद माँ, बहुत स्वादिष्ट है!"
    - "मुझे यह नहीं खाना, हटाओ इसे!"
    - "जल्दी दो! और जल्दी दो!"
    answer: धन्यवाद माँ, बहुत स्वादिष्ट है!
    difficulty: 1
    hints:
    - मेहनत की तारीफ़ करो।
    - कौन-सा वाक्य प्यार भरा है?
    solution: 'चरण 1: माँ ने मेहनत की। चरण 2: धन्यवाद कहना प्यार दिखाता है।'
    mistakes:
      "मुझे यह नहीं खाना, हटाओ इसे!": h2_dhanyavad
      "जल्दी दो! और जल्दी दो!": h2_dhanyavad
  - prompt: माँ थकी हुई हैं। हम क्या करें?
    options:
    - "पानी लाकर दें और शांति से खेलें"
    - "घर में ज़ोर-ज़ोर से शोर करें"
    - "उनसे तुरंत नया खिलौना माँगें"
    answer: पानी लाकर दें और शांति से खेलें
    difficulty: 1
    hints:
    - थके व्यक्ति को आराम चाहिए।
    - कौन-सा काम आराम देगा?
    solution: 'चरण 1: माँ को आराम चाहिए। चरण 2: पानी दो और शांत रहो।'
    mistakes:
      "घर में ज़ोर-ज़ोर से शोर करें": c2h4_madad
      "उनसे तुरंत नया खिलौना माँगें": c2h4_madad
  - prompt: '''दुलार'' का अर्थ क्या है?'
    options:
    - लाड़-प्यार
    - गुस्सा
    - खेल
    answer: लाड़-प्यार
    difficulty: 2
    hints:
    - माँ बच्चे को गोद में लेकर सहलाती हैं।
    - यह अच्छी भावना है।
    solution: 'चरण 1: दुलार में सहलाना और लाड़ होता है। चरण 2: अर्थ है लाड़-प्यार।'
    mistakes:
      गुस्सा: c2h4_arth
      खेल: c2h4_arth
  - prompt: किस शब्द पर चंद्रबिंदु (ँ) है?
    options:
    - माँ
    - मामा
    - माला
    answer: माँ
    difficulty: 2
    hints:
    - चंद्रबिंदु आधा चाँद और बिंदी जैसा दिखता है।
    - नाक से बोली जाने वाली आवाज़।
    solution: 'चरण 1: मामा और माला पर कोई ँ नहीं। चरण 2: ''माँ'' पर चंद्रबिंदु है।'
    mistakes:
      मामा: c2h4_tuk
      माला: c2h4_tuk
  - prompt: चोट लगने पर माँ घाव पर क्या लगाती हैं?
    options:
    - दवा
    - मिट्टी
    - स्याही
    answer: दवा
    difficulty: 2
    hints:
    - यह घाव ठीक करती है।
    - डॉक्टर भी यही देते हैं।
    solution: 'चरण 1: घाव को साफ़ और ठीक करना है। चरण 2: माँ दवा लगाती हैं।'
    mistakes:
      मिट्टी: h2_chot
      स्याही: h2_chot
  - prompt: कौन-सा वाक्य ठीक है?
    options:
    - माँ खाना बनाती हैं।
    - माँ खाना बनाता है।
    - माँ खाना बनाते हो।
    answer: माँ खाना बनाती हैं।
    difficulty: 3
    hints:
    - माँ के लिए आदर से 'हैं' लगाते हैं।
    - '''बनाता'' किसी पुरुष के लिए आता है।'
    solution: 'चरण 1: माँ के लिए ''बनाती''। चरण 2: आदर के लिए ''हैं'': माँ खाना बनाती हैं।'
    mistakes:
      माँ खाना बनाता है।: c2h4_arth
