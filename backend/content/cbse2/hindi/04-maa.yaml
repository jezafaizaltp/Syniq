subject: cbse2-hin
chapter: 4
title: माँ
tips:
  h2_chot: "जब तुम्हें चोट लगती है, माँ पहले घाव का क्या करती हैं ताकि दर्द कम हो?"
  h2_dhanyavad: "धन्यवाद दिल से कहा जाता है। ऐसा क्या करें कि माँ को तुम्हारा प्यार महसूस हो?"
  h2_maa: "याद करो, माँ तुम्हें सुलाते, खिलाते और गले लगाते समय क्या दिखाती हैं।"

concepts:
- code: cbse2h.04.maa
  title: माँ
  notes: |
    माँ पर एक कविता: माँ का प्यार, देखभाल, हमारे लिए खाना बनाना, चोट लगने पर सहलाना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कविता माँ के बारे में है। माँ हमें प्यार करती हैं, हमारा ध्यान रखती हैं और हमें अच्छी बातें सिखाती हैं।
    visual: 'चित्र बनाओ: माँ बच्चे का हाथ पकड़कर चल रही हैं।'
    step_by_step: 1. कविता लय से पढ़ो। 2. माँ हमारे लिए क्या-क्या करती हैं? 3. हम माँ की मदद कैसे कर सकते हैं? 4. तुकांत शब्द खोजो।
    real_world: माँ के जन्मदिन पर बच्चे अपने हाथ से कार्ड बनाकर देते हैं।
  picture:
    kind: compare
    columns:
    - title: माँ करती हैं
      points:
      - खाना बनाना
      - प्यार करना
    - title: हम कर सकते हैं
      points:
      - थाली लगाना
      - कहना मानना
    alt: माँ खाना बनाती और प्यार करती हैं; हम थाली लगाकर और कहना मानकर मदद कर सकते हैं।
  items:
  - prompt: माँ हमसे क्या करती हैं?
    options:
    - प्यार
    - गुस्सा ही गुस्सा
    - बात नहीं
    - डरती हैं
    answer: प्यार
    difficulty: 1
    hints:
    - कविता का भाव।
    - देखभाल।
    solution: माँ हमसे प्यार करती हैं।
    mistakes: {"गुस्सा ही गुस्सा": "h2_maa", "बात नहीं": "h2_maa", "डरती हैं": "h2_maa"}
  - prompt: हम माँ की मदद कैसे कर सकते हैं?
    options:
    - अपना सामान खुद रखकर
    - कमरा गंदा करके
    - खाना फेंककर
    - रोकर
    answer: अपना सामान खुद रखकर
    difficulty: 1
    hints:
    - छोटे काम।
    - अपना काम खुद।
    solution: अपना सामान खुद रखकर हम मदद कर सकते हैं।
    mistakes: {"कमरा गंदा करके": "h1_ghar_kaam", "खाना फेंककर": "h1_ghar_kaam", "रोकर": "h1_ghar_kaam"}
  - prompt: '''माँ'' का दूसरा शब्द क्या है?'
    options:
    - माता
    - मामा
    - मासी
    - मीठा
    answer: माता
    difficulty: 2
    hints:
    - म से शुरू।
    - माँ = ...
    solution: माँ को माता भी कहते हैं।
    mistakes:
      मामा: hin2_word
  - prompt: चोट लगने पर माँ क्या करती हैं?
    options:
    - दवा लगाती हैं
    - हँसती हैं
    - चली जाती हैं
    - डाँटती ही हैं
    answer: दवा लगाती हैं
    difficulty: 1
    hints:
    - ध्यान रखती हैं।
    - दर्द कम करती हैं।
    solution: माँ दवा लगाती हैं।
    mistakes: {"हँसती हैं": "h2_chot", "चली जाती हैं": "h2_chot", "डाँटती ही हैं": "h2_chot"}
  - prompt: '''माँ'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - कहाँ
    - घर
    - पेड़
    - बस
    answer: कहाँ
    difficulty: 2
    hints:
    - आखिरी आवाज़ -आँ।
    - बोलकर देखो।
    solution: माँ और कहाँ की तुक मिलती है।
    mistakes:
      घर: hin2_sound
  - prompt: माँ को धन्यवाद कैसे कहें?
    options:
    - प्यार से गले लगाकर
    - मुँह फेरकर
    - चिल्लाकर
    - चुप रहकर
    answer: प्यार से गले लगाकर
    difficulty: 1
    hints:
    - प्यार दिखाओ।
    - मीठे शब्द।
    solution: प्यार से गले लगाकर धन्यवाद कह सकते हैं।
    mistakes: {"मुँह फेरकर": "h2_dhanyavad", "चिल्लाकर": "h2_dhanyavad", "चुप रहकर": "h2_dhanyavad"}
