# CBSE Class 2 Hindi (NCERT Sarangi, 2024-25), chapter 5. Format: content/README.md.
# Chapter names and order from the Delhi Directorate of Education Class II Hindi plan 2026-27; story details not checked against the book, kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse2-hin
chapter: 5
title: थाथू और मैं
concepts:
- code: cbse2h.05.thathu
  title: थाथू और मैं
  notes: |
    एक बच्चे और उसके थाथू (दक्षिण भारत में दादा/नाना को थाथा/थाथू कहते हैं) के साथ बिताए समय के बारे में पाठ: साथ घूमना, खेलना, बातें करना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह पाठ एक बच्चे और उसके थाथू के बारे में है। दक्षिण भारत में कई घरों में दादा को थाथा या थाथू कहते हैं। बच्चा और थाथू साथ में घूमते, खेलते और बातें करते हैं।
    visual: 'चित्र बनाओ: थाथू और बच्चा साथ-साथ बगीचे में टहल रहे हैं।'
    step_by_step: 1. पाठ पढ़ो। 2. थाथू कौन हैं? 3. दोनों साथ में क्या करते हैं? 4. तुम अपने दादा-नाना को क्या कहते हो?
    real_world: 'भारत में एक ही रिश्ते के कई नाम हैं: दादा, आजोबा, थाथा, अप्पूप्पन।'
  picture:
    kind: compare
    columns:
    - title: भाषा
      points:
      - हिंदी
      - तमिल
      - मलयालम
    - title: दादा के लिए
      points:
      - दादा
      - थाथा
      - अप्पूप्पन
    alt: दादा को हिंदी में दादा, तमिल में थाथा और मलयालम में अप्पूप्पन कहते हैं।
  items:
  - prompt: थाथू किसे कहा गया है?
    options:
    - दादा को
    - दोस्त को
    - कुत्ते को
    - पेड़ को
    answer: दादा को
    difficulty: 1
    hints:
    - घर के बड़े।
    - दक्षिण भारत का शब्द।
    solution: थाथू यानी दादा।
    mistakes:
      दोस्त को: hin2_read_again
  - prompt: दादा किसके पिता होते हैं?
    options:
    - पिता के
    - भाई के
    - दोस्त के
    - मामा के
    answer: पिता के
    difficulty: 2
    hints:
    - पापा के पापा।
    - पिता की ओर।
    solution: दादा पिता के पिता होते हैं।
  - prompt: बड़ों के साथ समय बिताने से क्या मिलता है?
    options:
    - प्यार और सीख
    - डाँट ही डाँट
    - कुछ नहीं
    - चोट
    answer: प्यार और सीख
    difficulty: 1
    hints:
    - वे बहुत कुछ जानते हैं।
    - कहानियाँ।
    solution: बड़ों से प्यार और सीख मिलती है।
  - prompt: '''मैं'' शब्द किसके लिए आता है?'
    options:
    - अपने लिए
    - दूसरों के लिए
    - जानवर के लिए
    - चीज़ के लिए
    answer: अपने लिए
    difficulty: 2
    hints:
    - '''मैं खेलता हूँ।'''
    - बोलने वाला खुद।
    solution: '''मैं'' अपने लिए बोलते हैं।'
    mistakes:
      दूसरों के लिए: hin2_word
  - prompt: दादा जी के साथ टहलने कहाँ जा सकते हैं?
    options:
    - बगीचे में
    - नदी के बीच में
    - छत की मुंडेर पर
    - सड़क के बीच में
    answer: बगीचे में
    difficulty: 1
    hints:
    - सुरक्षित जगह।
    - पेड़-पौधे।
    solution: बगीचे में टहलने जा सकते हैं।
  - prompt: दादा-दादी से कैसे बोलते हैं?
    options:
    - आप कहकर
    - तू कहकर
    - चिल्लाकर
    - मुँह बनाकर
    answer: आप कहकर
    difficulty: 2
    hints:
    - आदर का शब्द।
    - बड़ों के लिए।
    solution: बड़ों को 'आप' कहते हैं।
