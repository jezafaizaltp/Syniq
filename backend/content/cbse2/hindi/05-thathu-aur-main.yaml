subject: cbse2-hin
chapter: 5
title: थाथू और मैं
tips:
  h2_bade_samay: "सोचो, दादा-दादी के पास बैठकर तुमने कौन-सी नई बातें और कहानियाँ सीखीं।"
  c2h5_shabd: 'वाक्य का आखिरी शब्द देखो: एक व्यक्ति की बात है या बहुत लोगों की?'
  c2h5_rishta: 'परिवार का पेड़ बनाकर सोचो: कौन किसके माता-पिता हैं?'
  c2h5_aadar: सोचो, बड़ों को कैसा लगेगा? कौन-सा तरीका उन्हें अच्छा लगेगा?
  c2h5_bhasha: भारत में एक ही रिश्ते के अलग-अलग भाषाओं में अलग नाम होते हैं।

concepts:
- code: cbse2h.05.thathu
  title: थाथू और मैं
  notes: |
    एक बच्चे और उसके थाथू (दक्षिण भारत में दादा/नाना को थाथा/थाथू कहते हैं) के साथ बिताए समय के बारे में पाठ: साथ घूमना, खेलना, बातें करना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह पाठ एक बच्चे और उसके थाथू के बारे में है। दक्षिण भारत में कई घरों में दादा को थाथा या थाथू कहते हैं। बच्चा और थाथू साथ में घूमते, खेलते और बातें करते हैं।
    visual: 'चित्र बनाओ: थाथू और बच्चा साथ-साथ बगीचे में टहल रहे हैं।'
    step_by_step: 1. पाठ पढ़ो। 2. थाथू कौन हैं? 3. दोनों साथ में क्या करते हैं? 4. तुम अपने दादा-नाना को क्या कहते हो?
    real_world: 'भारत में एक ही रिश्ते के कई नाम हैं: दादा, आजोबा, थाथा, अप्पूप्पन।'
  picture:
    kind: compare
    columns:
    - title: भाषा
      points:
      - हिंदी
      - तमिल
      - मलयालम
    - title: दादा के लिए
      points:
      - दादा
      - थाथा
      - अप्पूप्पन
    alt: दादा को हिंदी में दादा, तमिल में थाथा और मलयालम में अप्पूप्पन कहते हैं।
  activity:
    type: sort
    prompt: किसे क्या कहते हैं?
    bins:
    - पापा के पापा
    - माँ के पापा
    items:
    - label: दादा
      bin: पापा के पापा
      clue: दादा किसके पापा?
      why: दादा = पापा के पापा।
    - label: नाना
      bin: माँ के पापा
      clue: नानी के घर कौन?
      why: नाना = माँ के पापा।
    - label: दादी के पति
      bin: पापा के पापा
      clue: दादी के साथ कौन रहते हैं?
      why: दादा।
    - label: नानी के पति
      bin: माँ के पापा
      clue: नानी के साथ कौन?
      why: नाना।
  lesson:
    - teach: 'दक्षिण भारत की कई भाषाओं में दादा या नाना को थाथा या थाथू कहते हैं। एक ही रिश्ते के अलग-अलग नाम: दादी को आजी (मराठी), अम्मम्मा (मलयालम में नानी), बाबा (कहीं-कहीं दादा)।'
      check:
        prompt: '''थाथू'' किस रिश्ते का नाम है?'
        options:
        - दादा या नाना
        - भाई
        - मौसी
        answer: दादा या नाना
        why: दक्षिण भारत में दादा-नाना को थाथा/थाथू कहते हैं।
      ways:
      - style: visual
        teach: माँ और पिता को तीन भाषाओं में क्या कहते हैं।
        picture:
          kind: compare
          columns:
          - title: हिंदी
            points:
            - माँ
            - पिता
          - title: तमिल
            points:
            - अम्मा
            - अप्पा
          - title: मराठी
            points:
            - आई
            - बाबा
          alt: हिंदी में माँ और पिता, तमिल में अम्मा और अप्पा, और मराठी में आई और बाबा कहते हैं।
      - style: real_world
        teach: जब अलग-अलग राज्यों के बच्चे एक कक्षा में पढ़ते हैं, तो वे एक-दूसरे से अपने घर के रिश्तों के नाम सीख सकते हैं।
    - teach: थाथू के साथ बच्चा बगीचे में टहलता है, कहानियाँ सुनता है, पेड़-पौधों के नाम सीखता है। बड़ों के साथ समय बिताने से प्यार भी मिलता है और सीख भी।
      picture:
        kind: compare
        columns:
        - title: थाथू देते हैं
          points:
          - कहानियाँ
          - सीख
          - प्यार
        - title: हम देते हैं
          points:
          - साथ
          - मदद
          - आदर
        alt: बड़ों और बच्चों का एक-दूसरे को देना।
      check:
        prompt: बड़ों के साथ समय बिताने से हमें क्या मिलता है?
        options:
        - प्यार और नई बातें
        - सिर्फ़ डाँट
        - कुछ नहीं
        answer: प्यार और नई बातें
        why: बड़ों के पास बहुत अनुभव और प्यार होता है।
      ways:
      - style: step_by_step
        teach: 'दादा-दादी से एक कहानी पूछो। पहला: उनके पास आराम से बैठो। दूसरा: पूछो, ''जब आप छोटे थे, तब क्या खेलते थे?'' तीसरा: ध्यान से सुनो। चौथा: अगले दिन वह बात किसी दोस्त को सुनाओ।'
      - style: real_world
        teach: कई बड़े लोग बताते हैं कि उनके बचपन में बच्चे गिल्ली-डंडा और कंचे खेलते थे। ऐसी बातें सुनकर पुराने समय का पता चलता है।
    - teach: '''मैं'' शब्द अपने लिए बोलते हैं: मैं पढ़ता/पढ़ती हूँ। ''हम'' बहुत लोगों के लिए: हम खेलते हैं। बड़ों के लिए ''आप'': आप कहाँ जा रहे हैं?'
      check:
        prompt: बहुत सारे बच्चे अपने लिए कौन-सा शब्द बोलेंगे?
        options:
        - हम
        - मैं
        - वह
        answer: हम
        why: '''हम'' एक से ज़्यादा लोगों के लिए आता है।'
      ways:
      - style: visual
        teach: 'मैं, हम और आप: कौन-सा शब्द किसके लिए आता है।'
        picture:
          kind: compare
          columns:
          - title: 'मैं: अपने लिए'
            points:
            - मैं खुश हूँ।
            - मैं यहाँ हूँ।
          - title: 'हम: बहुत लोग'
            points:
            - हम दोस्त हैं।
            - हम कक्षा में हैं।
          - title: 'आप: बड़ों के लिए'
            points:
            - आप कैसे हैं?
            - आप बैठिए।
          alt: 'अपने लिए ''मैं'': मैं खुश हूँ। बहुत लोगों के लिए ''हम'': हम दोस्त हैं। बड़ों के लिए ''आप'': आप कैसे हैं?'
      - style: step_by_step
        teach: 'सही शब्द चुनो। पहला: वाक्य पढ़ो: ''नानी जी, ___ चाय लेंगी?'' दूसरा: पूछो, बात किससे हो रही है? एक बड़े से। तीसरा: बड़ों के लिए ''आप'' बोलते हैं। चौथा: ''नानी जी, आप चाय लेंगी?'''
  items:
  - prompt: थाथू किसे कहा गया है?
    options:
    - दादा को
    - दोस्त को
    - कुत्ते को
    - पेड़ को
    answer: दादा को
    difficulty: 1
    hints:
    - घर के बड़े।
    - दक्षिण भारत का शब्द।
    solution: थाथू यानी दादा।
    mistakes:
      दोस्त को: hin2_read_again
  - prompt: दादा किसके पिता होते हैं?
    options:
    - पिता के
    - भाई के
    - दोस्त के
    - मामा के
    answer: पिता के
    difficulty: 2
    hints:
    - पापा के पापा।
    - पिता की ओर।
    solution: दादा पिता के पिता होते हैं।
    mistakes: {"भाई के": "h1_rishta", "दोस्त के": "h1_rishta", "मामा के": "h1_rishta"}
  - prompt: बड़ों के साथ समय बिताने से क्या मिलता है?
    options:
    - प्यार और सीख
    - डाँट ही डाँट
    - कुछ नहीं
    - चोट
    answer: प्यार और सीख
    difficulty: 1
    hints:
    - वे बहुत कुछ जानते हैं।
    - कहानियाँ।
    solution: बड़ों से प्यार और सीख मिलती है।
    mistakes: {"डाँट ही डाँट": "h2_bade_samay", "कुछ नहीं": "h2_bade_samay", "चोट": "h2_bade_samay"}
  - prompt: '''मैं'' शब्द किसके लिए आता है?'
    options:
    - अपने लिए
    - दूसरों के लिए
    - जानवर के लिए
    - चीज़ के लिए
    answer: अपने लिए
    difficulty: 2
    hints:
    - '''मैं खेलता हूँ।'''
    - बोलने वाला खुद।
    solution: '''मैं'' अपने लिए बोलते हैं।'
    mistakes:
      दूसरों के लिए: hin2_word
  - prompt: दादा जी के साथ टहलने कहाँ जा सकते हैं?
    options:
    - बगीचे में
    - नदी के बीच में
    - छत की मुंडेर पर
    - सड़क के बीच में
    answer: बगीचे में
    difficulty: 1
    hints:
    - सुरक्षित जगह।
    - पेड़-पौधे।
    solution: बगीचे में टहलने जा सकते हैं।
    mistakes: {"नदी के बीच में": "h1_suraksha", "छत की मुंडेर पर": "h1_suraksha", "सड़क के बीच में": "h1_suraksha"}
  - prompt: दादा-दादी से कैसे बोलते हैं?
    options:
    - आप कहकर
    - तू कहकर
    - चिल्लाकर
    - मुँह बनाकर
    answer: आप कहकर
    difficulty: 2
    hints:
    - आदर का शब्द।
    - बड़ों के लिए।
    solution: बड़ों को 'आप' कहते हैं।
    mistakes: {"तू कहकर": "h1_aadar", "चिल्लाकर": "h1_aadar", "मुँह बनाकर": "h1_aadar"}
  - prompt: नाना किसके पिता होते हैं?
    options:
    - माँ के
    - पिता के
    - भाई के
    answer: माँ के
    difficulty: 1
    hints:
    - नाना-नानी किस ओर के होते हैं?
    - दादा पिता की ओर के हैं।
    solution: 'चरण 1: नाना-नानी माँ की ओर के हैं। चरण 2: नाना माँ के पिता हैं।'
    mistakes:
      पिता के: c2h5_rishta
      भाई के: c2h5_rishta
  - prompt: थाथू के साथ बगीचे में टहलते हुए क्या सीख सकते हैं?
    options:
    - पेड़-पौधों के नाम
    - गाड़ी चलाना
    - खाना बनाना
    answer: पेड़-पौधों के नाम
    difficulty: 1
    hints:
    - बगीचे में क्या-क्या होता है?
    - फूल, पत्ते, पेड़।
    solution: 'चरण 1: बगीचे में पौधे हैं। चरण 2: उनके नाम सीख सकते हैं।'
    mistakes:
      गाड़ी चलाना: c2h5_aadar
      खाना बनाना: c2h5_aadar
  - prompt: दादा जी धीरे चलते हैं। साथ टहलते समय हम क्या करें?
    options:
    - उनके साथ धीरे-धीरे चलें
    - आगे भाग जाएँ
    - उन्हें जल्दी चलने को कहें
    answer: उनके साथ धीरे-धीरे चलें
    difficulty: 1
    hints:
    - साथ टहलना मतलब साथ रहना।
    - उन्हें अकेला न छोड़ें।
    solution: 'चरण 1: दादा जी को जल्दी चलने में मुश्किल है। चरण 2: हम उनके साथ धीरे चलें।'
    mistakes:
      आगे भाग जाएँ: c2h5_aadar
      उन्हें जल्दी चलने को कहें: c2h5_aadar
  - prompt: 'खाली जगह भरो: ___ स्कूल जाता हूँ।'
    options:
    - मैं
    - हम
    - वे
    answer: मैं
    difficulty: 1
    hints:
    - '''हूँ'' एक व्यक्ति, अपने लिए आता है।'
    - '''हम'' के साथ ''हैं'' आता है।'
    solution: 'चरण 1: ''हूँ'' अपने लिए है। चरण 2: मैं स्कूल जाता हूँ।'
    mistakes:
      हम: c2h5_shabd
      वे: c2h5_shabd
  - prompt: मलयालम में नानी को क्या कहते हैं?
    options:
    - अम्मम्मा
    - थाथू
    - चाचा
    answer: अम्मम्मा
    difficulty: 2
    hints:
    - केरल में यह शब्द सुनाई देता है।
    - थाथू तो दादा-नाना के लिए है।
    solution: 'चरण 1: मलयालम केरल की भाषा है। चरण 2: वहाँ नानी को अम्मम्मा कहते हैं।'
    mistakes:
      थाथू: c2h5_bhasha
      चाचा: c2h5_bhasha
  - prompt: 'खाली जगह भरो: ___ सब मिलकर खेलते हैं।'
    options:
    - हम
    - मैं
    - तुम अकेले
    answer: हम
    difficulty: 2
    hints:
    - '''सब मिलकर'' मतलब बहुत लोग।'
    - बहुत लोगों के लिए कौन-सा शब्द?
    solution: 'चरण 1: सब मिलकर = कई लोग। चरण 2: हम सब मिलकर खेलते हैं।'
    mistakes:
      मैं: c2h5_shabd
      तुम अकेले: c2h5_shabd
  - prompt: दादा जी से पूछना है कि वे कहाँ जा रहे हैं। कैसे पूछें?
    options:
    - आप कहाँ जा रहे हैं?
    - तू कहाँ जा रहा है?
    - कहाँ जाना?
    answer: आप कहाँ जा रहे हैं?
    difficulty: 2
    hints:
    - बड़ों के लिए आदर वाला शब्द।
    - '''तू'' बड़ों से नहीं कहते।'
    solution: 'चरण 1: बड़ों को ''आप'' कहते हैं। चरण 2: आप कहाँ जा रहे हैं?'
    mistakes:
      तू कहाँ जा रहा है?: c2h5_aadar
      कहाँ जाना?: c2h5_aadar
  - prompt: दादा जी की आँखें कमज़ोर हैं। अख़बार पढ़ने में मदद कैसे करें?
    options:
    - उनका चश्मा लाकर दें
    - अख़बार छिपा दें
    - बत्ती बंद कर दें
    answer: उनका चश्मा लाकर दें
    difficulty: 2
    hints:
    - कमज़ोर आँखों के लिए क्या पहनते हैं?
    - जिससे अक्षर साफ़ दिखें।
    solution: 'चरण 1: कमज़ोर आँखों को चश्मा चाहिए। चरण 2: चश्मा लाकर दो।'
    mistakes:
      अख़बार छिपा दें: c2h5_aadar
      बत्ती बंद कर दें: c2h5_aadar
  - prompt: पिता के पिता 'दादा' हैं। तो पिता की माँ कौन हैं?
    options:
    - दादी
    - नानी
    - मौसी
    answer: दादी
