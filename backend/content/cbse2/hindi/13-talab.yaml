subject: cbse2-hin
chapter: 13
title: तालाब
tips:
  h2_battakh: "बत्तख के पैर झिल्ली वाले होते हैं, नाव के चप्पू जैसे। पानी में वे किस काम आते हैं?"
  h2_kamal: "गुलाब और गेंदा क्यारी की मिट्टी में खिलते हैं। कौन-सा फूल पानी के ऊपर बड़े पत्तों के बीच खिलता है?"

concepts:
- code: cbse2h.13.talab
  title: तालाब
  notes: |
    तालाब पर पाठ/कविता: तालाब में रहने वाले जीव (मछली, मेंढक, बत्तख, कमल), पानी को साफ़ रखना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: तालाब में पानी भरा रहता है। उसमें मछली, मेंढक और बत्तख रहते हैं और कमल खिलता है। हमें तालाब साफ़ रखना चाहिए।
    visual: 'चित्र बनाओ: एक तालाब जिसमें कमल, मछली, मेंढक और तैरती बत्तख हो।'
    step_by_step: 1. पाठ पढ़ो। 2. तालाब में कौन-कौन रहता है? 3. कौन-सा फूल खिलता है? 4. तालाब साफ़ कैसे रखें?
    real_world: गाँवों में तालाब से जानवर पानी पीते हैं।
  picture:
    kind: compare
    columns:
    - title: तालाब में
      points:
      - मछली
      - मेंढक
      - कमल
    - title: क्या करता है
      points:
      - तैरती है
      - टर्र-टर्र करता है
      - खिलता है
    alt: तालाब में मछली तैरती है, मेंढक टर्र-टर्र करता है और कमल खिलता है।
  items:
  - prompt: तालाब में कौन रहती है?
    options:
    - मछली
    - गाय
    - बकरी
    - चिड़िया
    answer: मछली
    difficulty: 1
    hints:
    - पानी में।
    - तैरती है।
    solution: तालाब में मछली रहती है।
    mistakes: {"गाय": "h2_paani_jeev", "बकरी": "h2_paani_jeev", "चिड़िया": "h2_paani_jeev"}
  - prompt: तालाब में कौन-सा फूल खिलता है?
    options:
    - कमल
    - गुलाब
    - गेंदा
    - सूरजमुखी
    answer: कमल
    difficulty: 1
    hints:
    - पानी पर तैरता फूल।
    - गुलाबी।
    solution: तालाब में कमल खिलता है।
    mistakes: {"गुलाब": "h2_kamal", "गेंदा": "h2_kamal", "सूरजमुखी": "h2_kamal"}
  - prompt: 'तालाब में कचरा डालना:'
    options:
    - गलत है
    - ठीक है
    - मज़ेदार है
    - ज़रूरी है
    answer: गलत है
    difficulty: 1
    hints:
    - पानी गंदा होगा।
    - जीव बीमार होंगे।
    solution: तालाब में कचरा डालना गलत है।
    mistakes: {"ठीक है": "h1_kooda", "मज़ेदार है": "h1_kooda", "ज़रूरी है": "h1_kooda"}
  - prompt: पानी में बत्तख कैसे चलती है?
    options:
    - तैरकर
    - उड़कर ही
    - दौड़कर
    - रेंगकर
    answer: तैरकर
    difficulty: 2
    hints:
    - पानी पर।
    - पंजों से।
    solution: बत्तख पानी में तैरती है।
    mistakes: {"उड़कर ही": "h2_battakh", "दौड़कर": "h2_battakh", "रेंगकर": "h2_battakh"}
  - prompt: '''तालाब'' का दूसरा शब्द क्या है?'
    options:
    - ताल
    - पहाड़
    - जंगल
    - रेगिस्तान
    answer: ताल
    difficulty: 2
    hints:
    - छोटा शब्द।
    - त से शुरू।
    solution: तालाब को ताल भी कहते हैं।
    mistakes:
      पहाड़: hin2_word
  - prompt: मेंढक कैसी आवाज़ करता है?
    options:
    - टर्र-टर्र
    - म्याऊँ
    - भौं-भौं
    - कुहू-कुहू
    answer: टर्र-टर्र
    difficulty: 1
    hints:
    - बारिश में सुनाई देती है।
    - ट से।
    solution: मेंढक टर्र-टर्र करता है।
    mistakes: {"म्याऊँ": "h1_awaaz", "भौं-भौं": "h1_awaaz", "कुहू-कुहू": "h1_awaaz"}
