subject: cbse2-hin
chapter: 13
title: तालाब
tips:
  c2h13_naam: "गाँव में बारिश का पानी जहाँ भर जाता है, उस जगह को सोचो।"
  h2_battakh: "बत्तख के पैर झिल्ली वाले होते हैं, नाव के चप्पू जैसे। पानी में वे किस काम आते हैं?"
  h2_kamal: "गुलाब और गेंदा क्यारी की मिट्टी में खिलते हैं। कौन-सा फूल पानी के ऊपर बड़े पत्तों के बीच खिलता है?"
  c2h13_ginti: पहली गिनती से आगे उँगलियों पर गिनते जाओ।
  c2h13_shabd: शब्द को दो टुकड़ों में तोड़ो और हर टुकड़े का अर्थ सोचो।
  c2h13_jeev: 'तालाब के किनारे खड़े होकर सोचो: पानी में और पास में कौन-कौन है?'
  c2h13_saaf: सोचो, गंदे पानी में मछलियों और मेंढकों का क्या होगा?
  c2h13_dhvani: उस जीव की आवाज़ मन में सुनो।

concepts:
- code: cbse2h.13.talab
  title: तालाब
  notes: |
    तालाब पर पाठ/कविता: तालाब में रहने वाले जीव (मछली, मेंढक, बत्तख, कमल), पानी को साफ़ रखना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: तालाब में पानी भरा रहता है। उसमें मछली, मेंढक और बत्तख रहते हैं और कमल खिलता है। हमें तालाब साफ़ रखना चाहिए।
    visual: 'चित्र बनाओ: एक तालाब जिसमें कमल, मछली, मेंढक और तैरती बत्तख हो।'
    step_by_step: 1. पाठ पढ़ो। 2. तालाब में कौन-कौन रहता है? 3. कौन-सा फूल खिलता है? 4. तालाब साफ़ कैसे रखें?
    real_world: गाँवों में तालाब से जानवर पानी पीते हैं।
  picture:
    kind: compare
    columns:
    - title: तालाब में
      points:
      - मछली
      - मेंढक
      - कमल
    - title: क्या करता है
      points:
      - तैरती है
      - टर्र-टर्र करता है
      - खिलता है
    alt: तालाब में मछली तैरती है, मेंढक टर्र-टर्र करता है और कमल खिलता है।
  activity:
    type: sort
    prompt: कौन तालाब में रहता है?
    bins:
    - तालाब में
    - तालाब में नहीं
    items:
    - label: 🐟 मछली
      bin: तालाब में
      clue: पानी में तैरती?
      why: मछली तालाब में।
    - label: 🐸 मेंढक
      bin: तालाब में
      clue: टर्र-टर्र कहाँ से?
      why: मेंढक तालाब में।
    - label: 🦆 बत्तख
      bin: तालाब में
      clue: पानी पर तैरती?
      why: बत्तख तालाब में।
    - label: 🪷 कमल
      bin: तालाब में
      clue: पानी में कौन-सा फूल?
      why: कमल तालाब में खिलता है।
    - label: 🐪 ऊँट
      bin: तालाब में नहीं
      clue: ऊँट कहाँ रहता है?
      why: ऊँट रेगिस्तान में।
  lesson:
    - teach: तालाब पानी से भरी छोटी जगह है। उसमें मछलियाँ तैरती हैं, मेंढक टर्र-टर्र करते हैं, बत्तखें तैरती हैं और कमल का फूल खिलता है। किनारे पर बगुला खड़ा रहता है।
      picture:
        kind: compare
        columns:
        - title: पानी में
          points:
          - मछली
          - कमल
          - बत्तख
        - title: किनारे पर
          points:
          - बगुला
          - मेंढक
          - पेड़
        alt: तालाब के पानी में और किनारे पर रहने वाले।
      check:
        prompt: तालाब के किनारे एक टाँग पर कौन खड़ा रहता है?
        options:
        - बगुला
        - मछली
        - बिल्ली
        answer: बगुला
        why: सफ़ेद बगुला किनारे पर मछली पकड़ने के लिए खड़ा रहता है।
      ways:
      - style: step_by_step
        teach: 'तालाब का चित्र बनाओ। पहला: एक बड़ा नीला घेरा बनाओ। दूसरा: पानी में तैरती मछलियाँ बनाओ। तीसरा: एक बड़े पत्ते पर मेंढक बैठाओ। चौथा: किनारे पर घास और पेड़ बनाओ।'
      - style: real_world
        teach: गर्मियों में गाँव के तालाब पर गाय-भैंसें पानी पीने और ठंडे पानी में नहाने आती हैं।
    - teach: तालाब का पानी जीवों का घर है। उसमें कचरा, प्लास्टिक या साबुन डालने से पानी गंदा होता है और जीव बीमार हो जाते हैं। हम तालाब को साफ़ रखते हैं।
      check:
        prompt: तालाब में प्लास्टिक की थैली फेंकने से क्या होगा?
        options:
        - पानी गंदा होगा और जीवों को नुकसान
        - पानी और साफ़ होगा
        - मछलियाँ खुश होंगी
        answer: पानी गंदा होगा और जीवों को नुकसान
        why: प्लास्टिक गलता नहीं और जीव उसे खाकर बीमार हो जाते हैं।
      ways:
      - style: visual
        teach: तालाब के लिए अच्छे काम और बुरे काम, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: तालाब के लिए अच्छा
            points:
            - किनारे पेड़ लगाना
            - पानी में कुछ न फेंकना
            - सफ़ाई में हाथ बँटाना
          - title: तालाब के लिए बुरा
            points:
            - प्लास्टिक फेंकना
            - पानी में गाड़ी धोना
            - बचा हुआ सामान डालना
          alt: किनारे पेड़ लगाना, पानी में कुछ न फेंकना और सफ़ाई में हाथ बँटाना तालाब के लिए अच्छा है। प्लास्टिक फेंकना, पानी में गाड़ी धोना और बचा सामान डालना बुरा है।
      - style: real_world
        teach: कई गाँवों में लोग मिलकर साल में एक बार तालाब से कीचड़ और कचरा निकालते हैं, ताकि बरसात का पानी साफ़ जमा हो सके।
    - teach: 'तालाब के दूसरे नाम: ताल, पोखर, सरोवर। कमल को पंकज और जलज भी कहते हैं, क्योंकि वह पानी (जल) और कीचड़ (पंक) में उगता है।'
      check:
        prompt: '''सरोवर'' का अर्थ क्या है?'
        options:
        - तालाब
        - पहाड़
        - जंगल
        answer: तालाब
        why: 'सरोवर, ताल, पोखर: सब तालाब के नाम हैं।'
      ways:
      - style: visual
        teach: पानी से जुड़े कुछ और शब्द, और उनके जैसा अर्थ रखने वाले शब्द।
        picture:
          kind: compare
          columns:
          - title: शब्द
            points:
            - पानी
            - बादल
            - नदी
          - title: वही अर्थ
            points:
            - जल, नीर
            - मेघ
            - सरिता
          alt: पानी को जल या नीर, बादल को मेघ, और नदी को सरिता भी कहते हैं।
      - style: step_by_step
        teach: 'शब्द तोड़कर अर्थ समझो। पहला: शब्द लो: ''जलचर''। दूसरा: उसके दो टुकड़े करो: जल + चर। तीसरा: जल = पानी, चर = चलने वाला। चौथा: तो जलचर = पानी में रहने वाला जीव।'
  items:
  - prompt: तालाब में कौन रहती है?
    options:
    - मछली
    - गाय
    - बकरी
    - चिड़िया
    answer: मछली
    difficulty: 1
    hints:
    - पानी में।
    - तैरती है।
    solution: तालाब में मछली रहती है।
    mistakes: {"गाय": "h2_paani_jeev", "बकरी": "h2_paani_jeev", "चिड़िया": "h2_paani_jeev"}
  - prompt: तालाब में कौन-सा फूल खिलता है?
    options:
    - कमल
    - गुलाब
    - गेंदा
    - सूरजमुखी
    answer: कमल
    difficulty: 1
    hints:
    - पानी पर तैरता फूल।
    - गुलाबी।
    solution: तालाब में कमल खिलता है।
    mistakes: {"गुलाब": "h2_kamal", "गेंदा": "h2_kamal", "सूरजमुखी": "h2_kamal"}
  - prompt: 'तालाब में कचरा डालना:'
    options:
    - गलत है
    - ठीक है
    - मज़ेदार है
    - ज़रूरी है
    answer: गलत है
    difficulty: 1
    hints:
    - पानी गंदा होगा।
    - जीव बीमार होंगे।
    solution: तालाब में कचरा डालना गलत है।
    mistakes: {"ठीक है": "h1_kooda", "मज़ेदार है": "h1_kooda", "ज़रूरी है": "h1_kooda"}
  - prompt: पानी में बत्तख कैसे चलती है?
    options:
    - तैरकर
    - उड़कर ही
    - दौड़कर
    - रेंगकर
    answer: तैरकर
    difficulty: 2
    hints:
    - पानी पर।
    - पंजों से।
    solution: बत्तख पानी में तैरती है।
    mistakes: {"उड़कर ही": "h2_battakh", "दौड़कर": "h2_battakh", "रेंगकर": "h2_battakh"}
  - prompt: '''तालाब'' का दूसरा शब्द क्या है?'
    options:
    - ताल
    - पहाड़
    - जंगल
    - रेगिस्तान
    answer: ताल
    difficulty: 2
    hints:
    - छोटा शब्द।
    - त से शुरू।
    solution: तालाब को ताल भी कहते हैं।
    mistakes:
      पहाड़: hin2_word
  - prompt: मेंढक कैसी आवाज़ करता है?
    options:
    - टर्र-टर्र
    - म्याऊँ
    - भौं-भौं
    - कुहू-कुहू
    answer: टर्र-टर्र
    difficulty: 1
    hints:
    - बारिश में सुनाई देती है।
    - ट से।
    solution: मेंढक टर्र-टर्र करता है।
    mistakes: {"म्याऊँ": "h1_awaaz", "भौं-भौं": "h1_awaaz", "कुहू-कुहू": "h1_awaaz"}
  - prompt: बत्तख कैसी आवाज़ करती है?
    options:
    - क्वैक-क्वैक
    - म्याऊँ
    - भौं-भौं
    answer: क्वैक-क्वैक
    difficulty: 1
    hints:
    - तालाब में तैरती बत्तख की आवाज़ सुनो।
    - म्याऊँ बिल्ली करती है।
    solution: 'चरण 1: बत्तख पानी का पक्षी है। चरण 2: वह क्वैक-क्वैक करती है।'
    mistakes:
      म्याऊँ: c2h13_dhvani
      भौं-भौं: c2h13_dhvani
  - prompt: कमल का फूल कहाँ उगता है?
    options:
    - पानी में
    - रेगिस्तान में
    - छत पर
    answer: पानी में
    difficulty: 1
    hints:
    - इसे जलज भी कहते हैं।
    - जल मतलब पानी।
    solution: 'चरण 1: कमल तालाब में खिलता है। चरण 2: वह पानी में उगता है।'
    mistakes:
      रेगिस्तान में: h2_kamal
      छत पर: h2_kamal
  - prompt: तालाब के पास पिकनिक के बाद क्या करें?
    options:
    - कचरा थैली में भरकर कूड़ेदान में डालें
    - कचरा तालाब में फेंकें
    - कचरा वहीं छोड़ दें
    answer: कचरा थैली में भरकर कूड़ेदान में डालें
    difficulty: 1
    hints:
    - तालाब जीवों का घर है।
    - कचरा सही जगह जाए।
    solution: 'चरण 1: कचरा तालाब को गंदा करेगा। चरण 2: कूड़ेदान में डालो।'
    mistakes:
      कचरा तालाब में फेंकें: c2h13_saaf
      कचरा वहीं छोड़ दें: c2h13_saaf
  - prompt: मछली पानी में कैसे चलती है?
    options:
    - तैरकर
    - उड़कर
    - रेंगकर
    answer: तैरकर
    difficulty: 1
    hints:
    - उसके पंख जैसे पर होते हैं।
    - पानी में हम भी यही करते हैं।
    solution: 'चरण 1: मछली पानी में रहती है। चरण 2: वह तैरती है।'
    mistakes:
      उड़कर: c2h13_jeev
      रेंगकर: c2h13_jeev
  - prompt: '''पोखर'' किसका दूसरा नाम है?'
    options:
    - तालाब
    - पेड़
    - बादल
    answer: तालाब
    difficulty: 2
    hints:
    - गाँव में पानी भरी छोटी जगह।
    - बारिश में भर जाता है।
    solution: 'चरण 1: पोखर में पानी भरा होता है। चरण 2: पोखर = तालाब।'
    mistakes:
      पेड़: c2h13_naam
      बादल: c2h13_naam
  - prompt: तालाब में कपड़े साबुन से धोना ठीक क्यों नहीं?
    options:
    - साबुन से पानी गंदा होता है और जीवों को नुकसान होता है
    - साबुन बहुत महँगा है
    - कपड़े गीले हो जाते हैं
    answer: साबुन से पानी गंदा होता है और जीवों को नुकसान होता है
    difficulty: 2
    hints:
    - तालाब किसका घर है?
    - साबुन का झाग पानी में मिलता है।
    solution: 'चरण 1: साबुन पानी में घुल जाता है। चरण 2: पानी गंदा होता है और मछलियाँ-मेंढक बीमार होते हैं।'
    mistakes:
      साबुन बहुत महँगा है: c2h13_saaf
      कपड़े गीले हो जाते हैं: c2h13_saaf
  - prompt: तालाब में 4 बत्तखें थीं, 3 और आ गईं। अब कितनी?
    options:
    - सात
    - चार
    - छह
    answer: सात
    difficulty: 2
    hints:
    - चार से आगे तीन और गिनो।
    - पाँच, छह, ...?
    solution: 'चरण 1: 4 बत्तखें। चरण 2: 4 + 3 = 7।'
    mistakes:
      चार: c2h13_ginti
      छह: c2h13_ginti
  - prompt: कमल को 'पंकज' क्यों कहते हैं?
    options:
    - क्योंकि वह कीचड़ (पंक) में उगता है
    - क्योंकि वह पेड़ पर लगता है
    - क्योंकि वह पीला है
    answer: क्योंकि वह कीचड़ (पंक) में उगता है
    difficulty: 3
    hints:
    - '''पंक'' का अर्थ याद करो।'
    - तालाब की तली में क्या होता है?
    solution: 'चरण 1: पंक मतलब कीचड़। चरण 2: कीचड़ में जन्मा = पंकज।'
    mistakes:
      क्योंकि वह पेड़ पर लगता है: c2h13_shabd
      क्योंकि वह पीला है: c2h13_shabd
  - prompt: तालाब के किनारे बगुला चुपचाप क्यों खड़ा रहता है?
