# CBSE Class 2 Hindi (NCERT Sarangi, 2024-25), chapter 12. Format: content/README.md.
# Chapter names and order from the Delhi Directorate of Education Class II Hindi plan 2026-27; story details not checked against the book, kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse2-hin
chapter: 12
title: तोसिया का सपना
concepts:
- code: cbse2h.12.tosiya
  title: तोसिया का सपना
  notes: |
    तोसिया नाम की बच्ची के सपने के बारे में कहानी: सपने में अनोखी चीज़ें देखना, कल्पना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कहानी तोसिया के सपने की है। सपने में हम अनोखी और मज़ेदार चीज़ें देखते हैं। कल्पना करना अच्छी बात है।
    visual: 'चित्र बनाओ: सोती हुई तोसिया और ऊपर बादल में उसका सपना।'
    step_by_step: 1. कहानी पढ़ो। 2. तोसिया ने सपने में क्या देखा? 3. सपना कब आता है? 4. तुमने कौन-सा सपना देखा?
    real_world: कई बच्चे सपना देखते हैं कि वे उड़ रहे हैं।
  picture:
    kind: flow
    steps:
    - रात हुई
    - तोसिया सोई
    - सपना आया
    - सुबह जागी
    alt: रात हुई, तोसिया सोई, उसे सपना आया और सुबह वह जागी।
  items:
  - prompt: सपना कब आता है?
    options:
    - सोते समय
    - खाते समय
    - नहाते समय
    - दौड़ते समय
    answer: सोते समय
    difficulty: 1
    hints:
    - आँखें बंद।
    - रात को।
    solution: सपना सोते समय आता है।
  - prompt: कहानी किसके सपने के बारे में है?
    options:
    - तोसिया
    - नीमा
    - माला
    - जोजो
    answer: तोसिया
    difficulty: 1
    hints:
    - पाठ का नाम देखो।
    - त से शुरू।
    solution: कहानी तोसिया के सपने की है।
    mistakes:
      नीमा: hin2_read_again
  - prompt: सोने से पहले क्या करना अच्छा है?
    options:
    - दाँत साफ़ करना
    - टीवी देखते रहना
    - बहुत मीठा खाना
    - दौड़ लगाना
    answer: दाँत साफ़ करना
    difficulty: 1
    hints:
    - अच्छी आदत।
    - ब्रश।
    solution: सोने से पहले दाँत साफ़ करना अच्छा है।
  - prompt: '''सपना'' का बहुवचन क्या है?'
    options:
    - सपने
    - सपनी
    - सपनाएँ
    - सपनेओं
    answer: सपने
    difficulty: 2
    hints:
    - एक सपना, दो ...
    - आ बदलकर ए।
    solution: सपना → सपने।
  - prompt: '''रात'' का उलटा क्या है?'
    options:
    - दिन
    - शाम
    - चाँद
    - नींद
    answer: दिन
    difficulty: 1
    hints:
    - सूरज वाला समय।
    - उजाला।
    solution: रात का उलटा दिन है।
  - prompt: '''कल्पना'' का अर्थ है:'
    options:
    - मन में सोचकर चित्र बनाना
    - सो जाना
    - भूल जाना
    - चिल्लाना
    answer: मन में सोचकर चित्र बनाना
    difficulty: 2
    hints:
    - जो सामने नहीं, उसे सोचना।
    - सपने जैसा।
    solution: कल्पना यानी मन में सोचकर चित्र बनाना।
    mistakes:
      भूल जाना: hin2_word
