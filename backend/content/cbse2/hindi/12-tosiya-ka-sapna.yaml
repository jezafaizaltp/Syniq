# CBSE Class 2 Hindi (NCERT Sarangi, 2024-25), chapter 12. Format: content/README.md.
# Chapter names and order from the Delhi Directorate of Education Class II Hindi plan 2026-27; story details not checked against the book, kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse2-hin
chapter: 12
title: तोसिया का सपना
tips:
  h2_bahuvachan: "एक से ज़्यादा के लिए शब्द का आखिरी हिस्सा बदलता है, जैसे 'कपड़ा' से 'कपड़े'।"
  h2_raat_aadat: "रात भर मुँह में खाना रह जाए तो दाँतों का क्या होगा? सोने से पहले कौन-सी अच्छी आदत?"
  h2_sapna: "सपने आँखें बंद होने पर दिखते हैं। दिन के किस समय तुम्हारी आँखें देर तक बंद रहती हैं?"
  c2h12_akshar: शब्द को धीरे से बोलो और पहली आवाज़ सुनो।
  c2h12_sapna: सोचो, सपने कब दिखते हैं और क्या वे सच में होते हैं?
  c2h12_aadat: सोचो, कौन-सी आदत शरीर को अगले दिन ताज़ा रखेगी?
  c2h12_vachan: एक चीज़ है या बहुत सारी? शब्द का अंत बदलकर देखो।

concepts:
- code: cbse2h.12.tosiya
  title: तोसिया का सपना
  notes: |
    तोसिया नाम की बच्ची के सपने के बारे में कहानी: सपने में अनोखी चीज़ें देखना, कल्पना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कहानी तोसिया के सपने की है। सपने में हम अनोखी और मज़ेदार चीज़ें देखते हैं। कल्पना करना अच्छी बात है।
    visual: 'चित्र बनाओ: सोती हुई तोसिया और ऊपर बादल में उसका सपना।'
    step_by_step: 1. कहानी पढ़ो। 2. तोसिया ने सपने में क्या देखा? 3. सपना कब आता है? 4. तुमने कौन-सा सपना देखा?
    real_world: कई बच्चे सपना देखते हैं कि वे उड़ रहे हैं।
  picture:
    kind: flow
    steps:
    - रात हुई
    - तोसिया सोई
    - सपना आया
    - सुबह जागी
    alt: रात हुई, तोसिया सोई, उसे सपना आया और सुबह वह जागी।
  activity:
    type: sort
    prompt: सपने में दिख सकता है, पर क्या सच में होता है?
    bins:
    - सच में होता है
    - बस सपने में
    items:
    - label: 🐱 बिल्ली दूध पीती है
      bin: सच में होता है
      clue: घर में देखा है?
      why: यह सच है।
    - label: 🌧️ बादल बरसते हैं
      bin: सच में होता है
      clue: बारिश सच में होती है?
      why: सच।
    - label: 🐟 मछली पेड़ पर चढ़ती है
      bin: बस सपने में
      clue: मछली कहाँ रहती है?
      why: यह कल्पना है।
    - label: 🏠 घर उड़ जाता है
      bin: बस सपने में
      clue: घर उड़ सकता है?
      why: सपने वाली बात।
  lesson:
    - teach: '''तोसिया का सपना'' कहानी सोते समय दिखे एक अनोखे सपने के बारे में है। सपने में हम ऐसी चीज़ें देख सकते हैं जो सच में नहीं होतीं: उड़ता हाथी, बोलती मछली, चॉकलेट का पहाड़।'
      check:
        prompt: इनमें से कौन-सी बात सपने जैसी (सच में न होने वाली) है?
        options:
        - हाथी आसमान में उड़ रहा है
        - बिल्ली दूध पी रही है
        - बच्चे स्कूल जा रहे हैं
        answer: हाथी आसमान में उड़ रहा है
        why: हाथी सच में उड़ नहीं सकता; ऐसा सपने या कल्पना में होता है।
      ways:
      - style: visual
        teach: जो बातें सच में हो सकती हैं, और जो सिर्फ़ सपने या कल्पना में।
        picture:
          kind: compare
          columns:
          - title: सच में हो सकता है
            points:
            - बिल्ली दूध पीती है
            - बच्चे पार्क में खेलते हैं
          - title: सिर्फ़ सपने में
            points:
            - पेड़ गाना गाता है
            - बादल पर घर बना है
          alt: बिल्ली का दूध पीना और बच्चों का पार्क में खेलना सच में हो सकता है। पेड़ का गाना गाना और बादल पर घर होना सिर्फ़ सपने में होता है।
      - style: real_world
        teach: सुबह उठकर कई लोग घर में अपना सपना सुनाते हैं, और कभी-कभी सब उस अनोखे सपने पर खूब हँसते हैं।
    - teach: कल्पना मतलब मन में सोचकर चित्र बनाना। कल्पना से हम कहानी, चित्र और नई चीज़ें बनाते हैं। सपने भी हमारी कल्पना जैसे होते हैं।
      check:
        prompt: आँखें बंद करके परियों का देश सोचना क्या है?
        options:
        - कल्पना
        - गिनती
        - खेल का नियम
        answer: कल्पना
        why: मन में चित्र बनाना कल्पना है।
      ways:
      - style: visual
        teach: कल्पना से एक नया चित्र और छोटी कहानी बनाना।
        picture:
          kind: flow
          steps:
          - आँखें बंद करो
          - मन में एक अनोखी जगह सोचो, जैसे समुद्र के नीचे शहर
          - सोचो, वहाँ कौन रहता है
          - उसका चित्र बनाओ
          - चित्र के बारे में दो पंक्तियाँ लिखो
          alt: आँखें बंद करके मन में एक अनोखी जगह सोचो, जैसे समुद्र के नीचे शहर। सोचो वहाँ कौन रहता है, फिर उसका चित्र बनाओ और दो पंक्तियाँ लिखो।
      - style: real_world
        teach: कार्टून फ़िल्में बनाने वाले लोग पहले कल्पना करते हैं, फिर कागज़ या कंप्यूटर पर हज़ारों चित्र बनाते हैं।
    - teach: 'अच्छी नींद के लिए: रात को समय पर सोना, सोने से पहले दाँत साफ़ करना, फ़ोन-टीवी बंद करना। एक-वचन और बहुवचन: सपना-सपने, तारा-तारे, कहानी-कहानियाँ।'
      picture:
        kind: flow
        steps:
        - खाना खाओ
        - दाँत साफ़ करो
        - फ़ोन-टीवी बंद
        - समय पर सो जाओ
        alt: सोने से पहले की अच्छी आदतें।
      check:
        prompt: '''तारा'' का बहुवचन क्या है?'
        options:
        - तारे
        - तारा
        - तारों
        answer: तारे
        why: 'आ से खत्म होने वाले शब्द: तारा से तारे।'
      ways:
      - style: step_by_step
        teach: 'सोने से पहले की तैयारी। पहला: कल के लिए अपना बस्ता तैयार करो। दूसरा: हाथ-मुँह धोओ। तीसरा: कमरे की बत्ती धीमी करो। चौथा: कोई कहानी सुनकर आँखें बंद करो।'
      - style: real_world
        teach: दुकान पर हम कहते हैं 'एक केला दीजिए', पर 'छह केले दीजिए'। गिनती बदलते ही शब्द का अंत भी बदल जाता है।
  items:
  - prompt: सपना कब आता है?
    options:
    - सोते समय
    - खाते समय
    - नहाते समय
    - दौड़ते समय
    answer: सोते समय
    difficulty: 1
    hints:
    - आँखें बंद।
    - रात को।
    solution: सपना सोते समय आता है।
    mistakes: {"खाते समय": "h2_sapna", "नहाते समय": "h2_sapna", "दौड़ते समय": "h2_sapna"}
  - prompt: कहानी किसके सपने के बारे में है?
    options:
    - तोसिया
    - नीमा
    - माला
    - जोजो
    answer: तोसिया
    difficulty: 1
    hints:
    - पाठ का नाम देखो।
    - त से शुरू।
    solution: कहानी तोसिया के सपने की है।
    mistakes:
      नीमा: hin2_read_again
  - prompt: सोने से पहले क्या करना अच्छा है?
    options:
    - दाँत साफ़ करना
    - टीवी देखते रहना
    - बहुत मीठा खाना
    - दौड़ लगाना
    answer: दाँत साफ़ करना
    difficulty: 1
    hints:
    - अच्छी आदत।
    - ब्रश।
    solution: सोने से पहले दाँत साफ़ करना अच्छा है।
    mistakes: {"टीवी देखते रहना": "h2_raat_aadat", "बहुत मीठा खाना": "h2_raat_aadat", "दौड़ लगाना": "h2_raat_aadat"}
  - prompt: '''सपना'' का बहुवचन क्या है?'
    options:
    - सपने
    - सपनी
    - सपनाएँ
    - सपनेओं
    answer: सपने
    difficulty: 2
    hints:
    - एक सपना, दो ...
    - आ बदलकर ए।
    solution: सपना → सपने।
    mistakes: {"सपनी": "h2_bahuvachan", "सपनाएँ": "h2_bahuvachan", "सपनेओं": "h2_bahuvachan"}
  - prompt: '''रात'' का उलटा क्या है?'
    options:
    - दिन
    - शाम
    - चाँद
    - नींद
    answer: दिन
    difficulty: 1
    hints:
    - सूरज वाला समय।
    - उजाला।
    solution: रात का उलटा दिन है।
    mistakes: {"शाम": "h1_ulta", "चाँद": "h1_ulta", "नींद": "h1_ulta"}
  - prompt: '''कल्पना'' का अर्थ है:'
    options:
    - मन में सोचकर चित्र बनाना
    - सो जाना
    - भूल जाना
    - चिल्लाना
    answer: मन में सोचकर चित्र बनाना
    difficulty: 2
    hints:
    - जो सामने नहीं, उसे सोचना।
    - सपने जैसा।
    solution: कल्पना यानी मन में सोचकर चित्र बनाना।
    mistakes:
      भूल जाना: hin2_word
  - prompt: सपने हम कब देखते हैं?
    options:
    - सोते समय
    - खाना खाते समय
    - दौड़ते समय
    answer: सोते समय
    difficulty: 1
    hints:
    - आँखें बंद हों और शरीर आराम कर रहा हो।
    - रात को बिस्तर पर।
    solution: 'चरण 1: सपने नींद में आते हैं। चरण 2: सोते समय।'
    mistakes:
      खाना खाते समय: c2h12_sapna
      दौड़ते समय: c2h12_sapna
  - prompt: सोने से पहले कौन-सी आदत अच्छी है?
    options:
    - देर रात तक फ़ोन देखना
    - समय पर सोना
    - मिठाई खाकर सीधे सो जाना
    answer: समय पर सोना
    difficulty: 1
    hints:
    - अगली सुबह ताज़ा उठना है।
    - देर तक जागने से थकान रहती है।
    solution: 'चरण 1: शरीर को पूरी नींद चाहिए। चरण 2: समय पर सोना अच्छा है।'
    mistakes:
      देर रात तक फ़ोन देखना: c2h12_aadat
      मिठाई खाकर सीधे सो जाना: c2h12_aadat
  - prompt: '''कहानी'' का बहुवचन क्या है?'
    options:
    - कहानियाँ
    - कहानीयों
    - कहाने
    answer: कहानियाँ
    difficulty: 1
    hints:
    - '''नदी'' से ''नदियाँ'' बनता है।'
    - ई वाले शब्दों के अंत में 'इयाँ'।
    solution: 'चरण 1: कहानी के अंत में ई। चरण 2: बहुवचन: कहानियाँ।'
    mistakes:
      कहानीयों: c2h12_vachan
      कहाने: c2h12_vachan
  - prompt: '''सपना'' किस अक्षर से शुरू होता है?'
    options:
    - स
    - प
    - न
    answer: स
    difficulty: 1
    hints:
    - धीरे से बोलो और पहली आवाज़ सुनो।
    - '''सब'' भी इसी से शुरू होता है।'
    solution: 'चरण 1: स-प-ना। चरण 2: पहला अक्षर स।'
    mistakes:
      प: c2h12_akshar
      न: c2h12_akshar
  - prompt: '''दिन'' का उलटा क्या है?'
    options:
    - रात
    - सुबह
    - धूप
    answer: रात
    difficulty: 1
    hints:
    - दिन में सूरज, ... में चाँद।
    - जब हम सोते हैं।
    solution: 'चरण 1: दिन में उजाला। चरण 2: उलटा रात।'
    mistakes:
      सुबह: c2h12_sapna
      धूप: c2h12_sapna
  - prompt: कौन-सी बात सच में हो सकती है?
    options:
    - चिड़िया पेड़ पर बैठी है
    - पेड़ गाना गा रहा है
    - चाँद पर लड्डू उगते हैं
    answer: चिड़िया पेड़ पर बैठी है
    difficulty: 2
    hints:
    - दो बातें सिर्फ़ सपने या कल्पना में होती हैं।
    - रोज़ क्या दिखता है?
    solution: 'चरण 1: पेड़ गाते नहीं, चाँद पर लड्डू नहीं उगते। चरण 2: चिड़िया पेड़ पर बैठती है: सच।'
    mistakes:
      पेड़ गाना गा रहा है: c2h12_sapna
      चाँद पर लड्डू उगते हैं: c2h12_sapna
  - prompt: '''सपना'' का अर्थ क्या है?'
    options:
    - नींद में दिखने वाली बातें
    - दिन का खाना
    - स्कूल का बस्ता
    answer: नींद में दिखने वाली बातें
    difficulty: 2
    hints:
    - तोसिया ने यह कब देखा?
    - आँखें बंद, पर मन में चित्र।
    solution: 'चरण 1: सोते समय मन में चित्र आते हैं। चरण 2: वही सपना है।'
    mistakes:
      दिन का खाना: c2h12_sapna
      स्कूल का बस्ता: c2h12_sapna
  - prompt: '''घोड़ा'' का बहुवचन क्या है?'
    options:
    - घोड़े
    - घोड़ा
    - घोड़ियाँ
    answer: घोड़े
    difficulty: 2
    hints:
    - '''तारा'' से ''तारे'' बनता है।'
    - आ को ए में बदलो।
    solution: 'चरण 1: घोड़ा के अंत में आ। चरण 2: बहुवचन: घोड़े।'
    mistakes:
      घोड़ा: c2h12_vachan
      घोड़ियाँ: c2h12_vachan
  - prompt: तुमने सपने में उड़ने वाली साइकिल देखी। सुबह इससे क्या कर सकते हो?
    options:
    - उसका चित्र बनाकर कहानी लिखना
    - सच में छत से उड़ने की कोशिश
    - किसी को न बताना और डरना
    answer: उसका चित्र बनाकर कहानी लिखना
    difficulty: 3
    hints:
    - सपना कल्पना है, सच नहीं।
    - कल्पना से हम क्या-क्या बनाते हैं?
    solution: 'चरण 1: उड़ती साइकिल सच में नहीं होती। चरण 2: उसका चित्र और कहानी बनाना कल्पना का अच्छा उपयोग है।'
    mistakes:
      सच में छत से उड़ने की कोशिश: c2h12_sapna
      किसी को न बताना और डरना: c2h12_sapna
  - prompt: 'स्थिति (केस): एक बच्चा रोज़ रात देर तक फ़ोन पर वीडियो देखता है। सुबह स्कूल में उसे नींद आती है और पढ़ाई में मन नहीं लगता। क्या बदलना चाहिए?'
