subject: cbse2-hin
chapter: 16
title: मूली
tips:
  h2_mooli: "मूली दूध जैसी दिखती है, ऊपर हरे पत्ते होते हैं।"
  c2h16_akshar: शब्द को धीरे से बोलो और पहली आवाज़ सुनो।
  c2h16_mil: एक व्यक्ति से भारी काम न हो तो क्या करते हैं?
  c2h16_sabzi: 'सब्ज़ी को खेत में सोचो: वह ज़मीन के ऊपर लटकती है या अंदर छिपी रहती है?'
  c2h16_kram: कहानी में कौन पहले आया, कौन बाद में? एक-एक करके गिनो।

concepts:
- code: cbse2h.16.mooli
  title: मूली
  notes: |
    मूली पर मज़ेदार कहानी (जैसे लोक-कथा जिसमें एक बड़ी मूली उखाड़ने के लिए एक-एक कर कई लोग जुड़ते हैं)। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कहानी एक बड़ी मूली की है। एक अकेला उसे नहीं उखाड़ पाता, तो एक-एक करके कई लोग जुड़ते हैं और सब मिलकर खींचते हैं। मिलकर काम आसान हो जाता है।
    visual: 'चित्र बनाओ: एक बड़ी मूली और उसे कतार में खींचते कई लोग।'
    step_by_step: 1. कहानी पढ़ो। 2. मूली कहाँ थी? 3. कौन-कौन मदद को आया? 4. क्या सीख मिली?
    real_world: भारी चीज़ उठाने में दोस्त मिलकर मदद करते हैं।
  picture:
    kind: flow
    steps:
    - एक खींचे
    - दो खींचें
    - सब खींचें
    - मूली निकली
    alt: एक ने खींचा, फिर दो ने, फिर सबने मिलकर खींचा और मूली निकल आई।
  activity:
    type: order
    prompt: बड़ी मूली उखाड़ने के लिए एक-एक करके लोग जुड़ते हैं। क्रम से लगाओ।
    steps:
    - 👴 एक आदमी खींचता है
    - 👵 दो लोग खींचते हैं
    - 👧 तीन लोग खींचते हैं
    - 🥕 सब मिलकर मूली उखाड़ लेते हैं
    reasons:
      👵 दो लोग खींचते हैं: अकेले से न निकली, तब दूसरा जुड़ा।
      👧 तीन लोग खींचते हैं: दो से भी न निकली, तब तीसरा।
      🥕 सब मिलकर मूली उखाड़ लेते हैं: मिलकर ही काम बना।
  lesson:
    - teach: '''मूली'' एक मज़ेदार लोक-कथा जैसी कहानी है। खेत में एक बहुत बड़ी मूली उगी। एक व्यक्ति से नहीं उखड़ी, तो दूसरा आया, फिर तीसरा... सबने मिलकर खींचा तो मूली उखड़ गई।'
      picture:
        kind: flow
        steps:
        - 'एक ने खींचा: नहीं उखड़ी'
        - 'दूसरा जुड़ा: नहीं उखड़ी'
        - और लोग जुड़े
        - 'सबने मिलकर: उखड़ गई!'
        alt: एक-एक कर लोग जुड़े और मिलकर मूली उखाड़ी।
      check:
        prompt: मूली आखिर में कैसे उखड़ी?
        options:
        - सबने मिलकर खींचा
        - बारिश से
        - अपने आप
        answer: सबने मिलकर खींचा
        why: अकेले से नहीं हुआ, सबकी ताकत मिलकर काम हुआ।
      ways:
      - style: step_by_step
        teach: 'कहानी अपने शब्दों में सुनाओ। पहला: कहाँ? एक खेत में। दूसरा: क्या हुआ? एक बहुत बड़ी मूली उगी। तीसरा: मुश्किल क्या थी? अकेले से वह नहीं निकली। चौथा: फिर? एक-एक करके और लोग मदद को आए।'
      - style: real_world
        teach: गाँव में बड़ी नाव को नदी में उतारना हो, तो कई लोग एक साथ 'हइया हो!' बोलकर धक्का लगाते हैं।
    - teach: मूली, गाजर, शलजम, चुकंदर ज़मीन के अंदर उगते हैं; ये जड़ वाली सब्ज़ियाँ हैं। टमाटर, बैंगन, भिंडी पौधे पर ऊपर लगते हैं।
      picture:
        kind: compare
        columns:
        - title: ज़मीन के अंदर
          points:
          - मूली
          - गाजर
          - चुकंदर
        - title: पौधे पर ऊपर
          points:
          - टमाटर
          - बैंगन
          - भिंडी
        alt: ज़मीन के अंदर और पौधे पर उगने वाली सब्ज़ियाँ।
      check:
        prompt: इनमें से कौन ज़मीन के अंदर उगता है?
        options:
        - चुकंदर
        - टमाटर
        - भिंडी
        answer: चुकंदर
        why: चुकंदर जड़ वाली सब्ज़ी है।
      ways:
      - style: step_by_step
        teach: 'सब्ज़ी कहाँ उगी, पहचानो। पहला: देखो, क्या सब्ज़ी पर मिट्टी लगी है? दूसरा: तो शायद वह ज़मीन के अंदर उगी। तीसरा: उसके पत्ते ऊपर निकले थे? चौथा: ऐसी सब्ज़ी जड़ वाली सब्ज़ी कहलाती है।'
      - style: real_world
        teach: आलू भी ज़मीन के अंदर बढ़ता है। फसल तैयार होने पर किसान उसे फावड़े से खोदकर निकालते हैं।
    - teach: 'कहानी के शब्द: खींचना, उखाड़ना, ज़ोर लगाना। खींचना का उलटा धकेलना। सीख: मिलकर काम करने से कठिन काम भी आसान होता है।'
      check:
        prompt: '''उखाड़ना'' का मतलब क्या है?'
        options:
        - ज़मीन से बाहर निकालना
        - ज़मीन में गाड़ना
        - पानी देना
        answer: ज़मीन से बाहर निकालना
        why: मूली उखाड़ी यानी ज़मीन से बाहर निकाली।
      ways:
      - style: visual
        teach: काम बताने वाले कुछ शब्द, और उनके उलटे शब्द।
        picture:
          kind: compare
          columns:
          - title: शब्द
            points:
            - उठाना
            - भरना
            - जोड़ना
          - title: उलटा
            points:
            - रखना
            - खाली करना
            - तोड़ना
          alt: उठाना का उलटा रखना, भरना का उलटा खाली करना, और जोड़ना का उलटा तोड़ना है।
      - style: real_world
        teach: जब घर में भारी अलमारी खिसकानी होती है, तो परिवार के कई लोग मिलकर एक साथ ज़ोर लगाते हैं।
  items:
  - prompt: मूली किस रंग की होती है?
    options:
    - सफ़ेद
    - नीली
    - काली
    - बैंगनी ही
    answer: सफ़ेद
    difficulty: 1
    hints:
    - "मूली को याद करो या काटकर देखो: वह किस रंग की दिखती है?"
    - ऊपर हरी पत्तियाँ।
    solution: मूली सफ़ेद होती है।
    mistakes: {"नीली": "h2_mooli", "काली": "h2_mooli", "बैंगनी ही": "h2_mooli"}
  - prompt: मूली कहाँ उगती है?
    options:
    - मिट्टी के अंदर
    - पेड़ की डाल पर
    - पानी के ऊपर
    - हवा में
    answer: मिट्टी के अंदर
    difficulty: 2
    hints:
    - उखाड़नी पड़ती है।
    - जड़।
    solution: मूली मिट्टी के अंदर उगती है।
    mistakes: {"पेड़ की डाल पर": "h1_mitti_andar", "पानी के ऊपर": "h1_mitti_andar", "हवा में": "h1_mitti_andar"}
  - prompt: कहानी से क्या सीख मिलती है?
    options:
    - मिलकर काम आसान होता है
    - अकेले रहना अच्छा है
    - मूली मत खाओ
    - हार मान लो
    answer: मिलकर काम आसान होता है
    difficulty: 1
    hints:
    - सबने मिलकर खींचा।
    - एकता।
    solution: मिलकर काम आसान होता है।
    mistakes:
      अकेले रहना अच्छा है: hin2_read_again
  - prompt: मूली क्या है?
    options:
    - सब्ज़ी
    - फल
    - मिठाई
    - खिलौना
    answer: सब्ज़ी
    difficulty: 1
    hints:
    - पराठे में भरते हैं।
    - खेत में उगती है।
    solution: मूली एक सब्ज़ी है।
    mistakes: {"फल": "h1_sabzi", "मिठाई": "h1_sabzi", "खिलौना": "h1_sabzi"}
  - prompt: '''खींचना'' का उलटा क्या है?'
    options:
    - धकेलना
    - खाना
    - देखना
    - गाना
    answer: धकेलना
    difficulty: 2
    hints:
    - अपनी ओर नहीं।
    - दूर करना।
    solution: खींचना का उलटा धकेलना है।
    mistakes:
      खाना: hin2_word
  - prompt: और कौन-सी सब्ज़ी मिट्टी के अंदर उगती है?
    options:
    - गाजर
    - आम
    - केला
    - सेब
    answer: गाजर
    difficulty: 2
    hints:
    - लाल-नारंगी।
    - हलवा।
    solution: गाजर भी मिट्टी के अंदर उगती है।
    mistakes: {"आम": "h1_mitti_andar", "केला": "h1_mitti_andar", "सेब": "h1_mitti_andar"}
  - prompt: गाजर कहाँ उगती है?
    options:
    - ज़मीन के अंदर
    - पेड़ की डाल पर
    - पानी के ऊपर
    answer: ज़मीन के अंदर
    difficulty: 1
    hints:
    - ऊपर सिर्फ़ हरी पत्तियाँ दिखती हैं।
    - मूली की तरह।
    solution: 'चरण 1: गाजर जड़ वाली सब्ज़ी है। चरण 2: वह ज़मीन के अंदर उगती है।'
    mistakes:
      पेड़ की डाल पर: c2h16_sabzi
      पानी के ऊपर: c2h16_sabzi
  - prompt: भारी मेज़ हिलानी है। मूली की कहानी से क्या सीखते हैं?
    options:
    - दोस्तों के साथ मिलकर हिलाओ
    - अकेले ज़ोर लगाते रहो
    - रोने लगो
    answer: दोस्तों के साथ मिलकर हिलाओ
    difficulty: 1
    hints:
    - मूली कैसे उखड़ी थी?
    - कई हाथ, आसान काम।
    solution: 'चरण 1: अकेले भारी काम कठिन है। चरण 2: मिलकर करो।'
    mistakes:
      अकेले ज़ोर लगाते रहो: c2h16_mil
      रोने लगो: c2h16_mil
  - prompt: मूली का स्वाद कैसा होता है?
    options:
    - थोड़ा तीखा
    - बहुत मीठा
    - खट्टा
    answer: थोड़ा तीखा
    difficulty: 2
    hints:
    - कच्ची मूली खाने पर जीभ पर हल्की चुभन।
    - मिठाई जैसा नहीं।
    solution: 'चरण 1: कच्ची मूली में हल्की चुभन होती है। चरण 2: स्वाद थोड़ा तीखा।'
    mistakes:
      बहुत मीठा: c2h16_sabzi
      खट्टा: c2h16_sabzi
  - prompt: कौन-सी सब्ज़ी पौधे पर ऊपर लगती है?
    options:
    - भिंडी
    - मूली
    - गाजर
    answer: भिंडी
    difficulty: 1
    hints:
    - मूली और गाजर मिट्टी में छिपी रहती हैं।
    - हरी, लंबी, पौधे से तोड़ते हैं।
    solution: 'चरण 1: मूली-गाजर ज़मीन के अंदर। चरण 2: भिंडी पौधे पर ऊपर।'
    mistakes:
      मूली: c2h16_sabzi
      गाजर: c2h16_sabzi
  - prompt: पहले 1 व्यक्ति, फिर 2 और जुड़े, फिर 2 और। कुल कितने?
    options:
    - पाँच
    - तीन
    - चार
    answer: पाँच
    difficulty: 2
    hints:
    - एक से शुरू करो।
    - 1, फिर 2 और, फिर 2 और।
    solution: 'चरण 1: 1 + 2 = 3। चरण 2: 3 + 2 = 5 लोग।'
    mistakes:
      तीन: c2h16_kram
      चार: c2h16_kram
  - prompt: मूली को अपनी ओर खींचा। 'खींचना' के उलटे काम का शब्द कौन-सा है?
    options:
    - धकेलना
    - खाना
    - उठाना
    answer: धकेलना
    difficulty: 1
    hints:
    - खींचते समय चीज़ अपनी ओर आती है।
    - उलटे में चीज़ दूर जाती है।
    solution: 'चरण 1: खींचना = अपनी ओर। चरण 2: उलटा धकेलना = दूर।'
    mistakes:
      खाना: c2h16_mil
      उठाना: c2h16_mil
  - prompt: '''मूली'' किस अक्षर से शुरू होती है?'
    options:
    - म
    - ल
    - न
    answer: म
    difficulty: 1
    hints:
    - 'धीरे से बोलो: मू...'
    - '''माँ'' भी इसी से शुरू होता है।'
    solution: 'चरण 1: मू-ली। चरण 2: पहला अक्षर म।'
    mistakes:
      ल: c2h16_akshar
      न: c2h16_akshar
  - prompt: कहानी में सबसे आखिर में क्या हुआ?
    options:
    - मूली उखड़ गई
    - पहला व्यक्ति आया
    - मूली बोई गई
    answer: मूली उखड़ गई
    difficulty: 2
    hints:
    - सबने मिलकर खींचा, फिर?
    - कहानी का अंत।
    solution: 'चरण 1: एक-एक कर लोग जुड़े। चरण 2: अंत में मूली उखड़ गई।'
    mistakes:
      पहला व्यक्ति आया: c2h16_kram
      मूली बोई गई: c2h16_kram
  - prompt: कक्षा में बड़ा चार्ट बनाना है। मूली की कहानी जैसा सबसे अच्छा तरीका कौन-सा है?
    options:
    - "हर कोई एक हिस्सा बनाए, फिर जोड़ें"
    - "एक ही बच्चा अकेले पूरा चार्ट बनाए"
    - "कोई भी बच्चा चार्ट न बनाए"
    answer: हर कोई एक हिस्सा बनाए, फिर जोड़ें
    difficulty: 3
    hints:
    - मूली अकेले नहीं उखड़ी थी।
    - काम बाँटो।
    solution: 'चरण 1: बड़ा काम बाँट लो। चरण 2: सब मिलकर करें तो जल्दी और अच्छा बनता है।'
    mistakes:
      "एक ही बच्चा अकेले पूरा चार्ट बनाए": c2h16_mil
      "कोई भी बच्चा चार्ट न बनाए": c2h16_mil
  - prompt: 'स्थिति (केस): कक्षा को आधे घंटे में पूरा कमरा सजाना है, पर एक ही बच्चा सारा काम कर रहा है और थक गया है। मूली की कहानी से सीखकर क्या करना चाहिए?'
    options:
