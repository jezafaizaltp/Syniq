subject: cbse2-hin
chapter: 16
title: मूली
tips:
  h2_mooli: "मूली दूध जैसी दिखती है, ऊपर हरे पत्ते होते हैं।"

concepts:
- code: cbse2h.16.mooli
  title: मूली
  notes: |
    मूली पर मज़ेदार कहानी (जैसे लोक-कथा जिसमें एक बड़ी मूली उखाड़ने के लिए एक-एक कर कई लोग जुड़ते हैं)। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कहानी एक बड़ी मूली की है। एक अकेला उसे नहीं उखाड़ पाता, तो एक-एक करके कई लोग जुड़ते हैं और सब मिलकर खींचते हैं। मिलकर काम आसान हो जाता है।
    visual: 'चित्र बनाओ: एक बड़ी मूली और उसे कतार में खींचते कई लोग।'
    step_by_step: 1. कहानी पढ़ो। 2. मूली कहाँ थी? 3. कौन-कौन मदद को आया? 4. क्या सीख मिली?
    real_world: भारी चीज़ उठाने में दोस्त मिलकर मदद करते हैं।
  picture:
    kind: flow
    steps:
    - एक खींचे
    - दो खींचें
    - सब खींचें
    - मूली निकली
    alt: एक ने खींचा, फिर दो ने, फिर सबने मिलकर खींचा और मूली निकल आई।
  activity:
    type: order
    prompt: बड़ी मूली उखाड़ने के लिए एक-एक करके लोग जुड़ते हैं। क्रम से लगाओ।
    steps:
    - 👴 एक आदमी खींचता है
    - 👵 दो लोग खींचते हैं
    - 👧 तीन लोग खींचते हैं
    - 🥕 सब मिलकर मूली उखाड़ लेते हैं
    reasons:
      👵 दो लोग खींचते हैं: अकेले से न निकली, तब दूसरा जुड़ा।
      👧 तीन लोग खींचते हैं: दो से भी न निकली, तब तीसरा।
      🥕 सब मिलकर मूली उखाड़ लेते हैं: मिलकर ही काम बना।
  items:
  - prompt: मूली किस रंग की होती है?
    options:
    - सफ़ेद
    - नीली
    - काली
    - बैंगनी ही
    answer: सफ़ेद
    difficulty: 1
    hints:
    - लंबी और सफ़ेद।
    - ऊपर हरी पत्तियाँ।
    solution: मूली सफ़ेद होती है।
    mistakes: {"नीली": "h2_mooli", "काली": "h2_mooli", "बैंगनी ही": "h2_mooli"}
  - prompt: मूली कहाँ उगती है?
    options:
    - मिट्टी के अंदर
    - पेड़ की डाल पर
    - पानी के ऊपर
    - हवा में
    answer: मिट्टी के अंदर
    difficulty: 2
    hints:
    - उखाड़नी पड़ती है।
    - जड़।
    solution: मूली मिट्टी के अंदर उगती है।
    mistakes: {"पेड़ की डाल पर": "h1_mitti_andar", "पानी के ऊपर": "h1_mitti_andar", "हवा में": "h1_mitti_andar"}
  - prompt: कहानी से क्या सीख मिलती है?
    options:
    - मिलकर काम आसान होता है
    - अकेले रहना अच्छा है
    - मूली मत खाओ
    - हार मान लो
    answer: मिलकर काम आसान होता है
    difficulty: 1
    hints:
    - सबने मिलकर खींचा।
    - एकता।
    solution: मिलकर काम आसान होता है।
    mistakes:
      अकेले रहना अच्छा है: hin2_read_again
  - prompt: मूली क्या है?
    options:
    - सब्ज़ी
    - फल
    - मिठाई
    - खिलौना
    answer: सब्ज़ी
    difficulty: 1
    hints:
    - पराठे में भरते हैं।
    - खेत में उगती है।
    solution: मूली एक सब्ज़ी है।
    mistakes: {"फल": "h1_sabzi", "मिठाई": "h1_sabzi", "खिलौना": "h1_sabzi"}
  - prompt: '''खींचना'' का उलटा क्या है?'
    options:
    - धकेलना
    - खाना
    - देखना
    - गाना
    answer: धकेलना
    difficulty: 2
    hints:
    - अपनी ओर नहीं।
    - दूर करना।
    solution: खींचना का उलटा धकेलना है।
    mistakes:
      खाना: hin2_word
  - prompt: और कौन-सी सब्ज़ी मिट्टी के अंदर उगती है?
    options:
    - गाजर
    - आम
    - केला
    - सेब
    answer: गाजर
    difficulty: 2
    hints:
    - लाल-नारंगी।
    - हलवा।
    solution: गाजर भी मिट्टी के अंदर उगती है।
    mistakes: {"आम": "h1_mitti_andar", "केला": "h1_mitti_andar", "सेब": "h1_mitti_andar"}
