# CBSE Class 2 Hindi (NCERT Sarangi, 2024-25), chapter 1. Format: content/README.md.
# Chapter names and order from the Delhi Directorate of Education Class II Hindi plan 2026-27; story details not checked against the book, kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse2-hin
chapter: 1
title: नीमा की दादी
tips:
  hin2_read_again: पाठ को फिर से देखो। उत्तर वहीं है।
  hin2_word: शब्द को एक छोटे वाक्य में बोलकर देखो।
  hin2_sound: दोनों शब्द धीरे-धीरे बोलो। आखिरी आवाज़ सुनो।
  h2_akshar: "शब्द को धीरे बोलो और ताली बजाओ: हर टुकड़े पर एक ताली। मात्रा अलग अक्षर नहीं गिनी जाती।"
  c2h1_rishta: 'परिवार का पेड़ बनाकर सोचो: कौन किसका बेटा या बेटी है?'
  c2h1_aadar: सोचो, बड़ों को कैसा लगेगा? कौन-सा तरीका उन्हें अच्छा लगेगा?
  c2h1_akshar: शब्द को धीरे-धीरे बोलो और हर अक्षर पर एक ताली बजाओ।
concepts:
- code: cbse2h.01.neema
  title: नीमा की दादी
  notes: |
    नीमा और उसकी दादी के प्यार भरे रिश्ते के बारे में पाठ। घर के बड़ों का आदर, उनसे कहानियाँ सुनना, साथ समय बिताना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह पाठ नीमा और उसकी दादी के बारे में है। दादी नीमा से बहुत प्यार करती हैं। घर के बड़े हमें कहानियाँ सुनाते हैं और हमारा ध्यान रखते हैं।
    visual: 'चित्र बनाओ: दादी कुर्सी पर बैठी हैं और नीमा उनकी गोद में कहानी सुन रही है।'
    step_by_step: 1. पाठ पढ़ो। 2. नीमा कौन है? 3. दादी क्या करती हैं? 4. तुम अपने दादा-दादी के लिए क्या करते हो?
    real_world: छुट्टियों में बच्चे दादा-दादी के पास जाते हैं और उनसे कहानियाँ सुनते हैं।
  picture:
    kind: compare
    columns:
    - title: रिश्ता
      points:
      - दादी
      - नानी
      - दादा
    - title: कौन
      points:
      - पिता की माँ
      - माँ की माँ
      - पिता के पिता
    alt: दादी पिता की माँ हैं, नानी माँ की माँ हैं, और दादा पिता के पिता हैं।
  activity:
    type: sort
    prompt: दादी के साथ अच्छा समय कैसे बिताएँ?
    bins:
    - अच्छी बात
    - अच्छी नहीं
    items:
    - label: 📖 दादी से कहानी सुनना
      bin: अच्छी बात
      clue: साथ बैठना अच्छा?
      why: साथ समय बिताना।
    - label: 🙏 बड़ों का आदर
      bin: अच्छी बात
      clue: दादी से कैसे बात करें?
      why: आदर से।
    - label: 🫖 दादी की मदद
      bin: अच्छी बात
      clue: दादी थक जाएँ तो?
      why: मदद करना।
    - label: 📱 बात अनसुनी करना
      bin: अच्छी नहीं
      clue: दादी बुलाएँ तो?
      why: बड़ों की बात सुनो।
  lesson:
    - teach: परिवार में कई रिश्ते होते हैं। पिता की माँ दादी और पिता के पिता दादा होते हैं। माँ की माँ नानी और माँ के पिता नाना होते हैं।
      picture:
        kind: compare
        columns:
        - title: पिता की ओर से
          points:
          - दादा
          - दादी
        - title: माँ की ओर से
          points:
          - नाना
          - नानी
        alt: पिता के माता-पिता दादा-दादी, माँ के माता-पिता नाना-नानी।
      check:
        prompt: माँ के पिता को क्या कहते हैं?
        options:
        - नाना
        - दादा
        - चाचा
        answer: नाना
        why: माँ के माता-पिता नाना-नानी होते हैं।
      ways:
      - style: step_by_step
        teach: 'परिवार का पेड़ बनाओ। पहला: बीच में अपना नाम लिखो। दूसरा: उसके ऊपर माता-पिता के नाम लिखो। तीसरा: पिता के ऊपर उनके माता-पिता के नाम लिखो। चौथा: माँ के ऊपर उनके माता-पिता के नाम लिखो।'
      - style: real_world
        teach: 'छुट्टियों में कई बच्चे गाँव जाते हैं, जहाँ बड़े परिवार के बहुत से लोग एक साथ मिलते हैं: बुआ, मौसी, मामा और उनके बच्चे।'
    - teach: 'दादी-नानी के पास बहुत सारी कहानियाँ और अनुभव होते हैं। उनके साथ बैठना, बातें करना और उनकी मदद करना बहुत अच्छा लगता है। हम बड़ों से आदर से बात करते हैं: ''जी'', ''आप''।'
      check:
        prompt: दादी से बात करते समय हम क्या कहते हैं?
        options:
        - आप
        - तू
        - अरे
        answer: आप
        why: '''आप'' कहना आदर दिखाता है।'
      ways:
      - style: visual
        teach: बड़ों से आदर से बोलना और बिना आदर के बोलना, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: आदर से
            points:
            - नमस्ते जी!
            - आप बैठिए।
            - कृपया मदद कीजिए।
          - title: बिना आदर के
            points:
            - ए, सुनो!
            - तू बैठ।
            - मेरा काम कर दो।
          alt: '''नमस्ते जी'', ''आप बैठिए'' और ''कृपया मदद कीजिए'' आदर से बोलना है। ''ए, सुनो'', ''तू बैठ'' और ''मेरा काम कर दो'' में आदर नहीं है।'
      - style: real_world
        teach: जब कोई बड़ा कमरे में आता है, तो कई बच्चे उठकर नमस्ते करते हैं और उन्हें बैठने की जगह देते हैं।
    - teach: शब्द अक्षरों से बनते हैं। 'दादी' = दा + दी (दो अक्षर)। 'नानी' = ना + नी। 'कहानी' = क + हा + नी (तीन अक्षर)।
      check:
        prompt: '''कहानी'' शब्द में कितने अक्षर हैं?'
        options:
        - तीन
        - दो
        - पाँच
        answer: तीन
        why: क + हा + नी = तीन अक्षर।
      ways:
      - style: visual
        teach: परिवार के कुछ और शब्द, और हर एक में कितने अक्षर हैं।
        picture:
          kind: compare
          columns:
          - title: दो अक्षर
            points:
            - मामा (मा + मा)
            - बुआ (बु + आ)
          - title: तीन अक्षर
            points:
            - कमल (क + म + ल)
            - बकरी (ब + क + री)
          alt: मामा और बुआ में दो-दो अक्षर हैं। कमल और बकरी में तीन-तीन अक्षर हैं।
      - style: step_by_step
        teach: 'अक्षर गिनो। पहला: शब्द ''मौसी'' लो। दूसरा: उसे धीरे-धीरे बोलो: मौ... सी। तीसरा: हर हिस्से पर एक ताली बजाओ। चौथा: दो ताली बजीं, यानी दो अक्षर।'
  items:
  - prompt: दादी किसकी माँ होती हैं?
    options:
    - पिता की
    - बहन की
    - दोस्त की
    - टीचर की
    answer: पिता की
    difficulty: 2
    hints:
    - "नाना-नानी माँ की ओर से होते हैं। तो दादा-दादी किसकी ओर से?"
    - पापा की माँ।
    solution: दादी पिता की माँ होती हैं।
    mistakes: {"बहन की": "h1_rishta", "दोस्त की": "h1_rishta", "टीचर की": "h1_rishta"}
  - prompt: बड़ों से हमें कैसे बात करनी चाहिए?
    options:
    - आदर से
    - चिल्लाकर
    - गुस्से से
    - बिल्कुल नहीं
    answer: आदर से
    difficulty: 1
    hints:
    - वे हमसे बड़े हैं।
    - प्यार और सम्मान।
    solution: बड़ों से आदर से बात करनी चाहिए।
    mistakes: {"चिल्लाकर": "h1_aadar", "गुस्से से": "h1_aadar", "बिल्कुल नहीं": "h1_aadar"}
  - prompt: दादी अक्सर बच्चों को क्या सुनाती हैं?
    options:
    - कहानियाँ
    - शोर
    - गाड़ी का हॉर्न
    - खबरें ही खबरें
    answer: कहानियाँ
    difficulty: 1
    hints:
    - रात को सोने से पहले।
    - राजा-रानी की...
    solution: दादी कहानियाँ सुनाती हैं।
    mistakes: {"शोर": "h1_kahani", "गाड़ी का हॉर्न": "h1_kahani", "खबरें ही खबरें": "h1_kahani"}
  - prompt: '''दादी'' शब्द में कितने अक्षर हैं?'
    options:
    - दो
    - तीन
    - एक
    - चार
    answer: दो
    difficulty: 2
    hints:
    - दा + दी।
    - गिनो।
    solution: 'दा-दी: दो अक्षर।'
    mistakes: {"तीन": "h2_akshar", "एक": "h2_akshar", "चार": "h2_akshar"}
  - prompt: नीमा अपनी दादी से क्या करती है?
    options:
    - प्यार
    - झगड़ा
    - शिकायत
    - मज़ाक उड़ाना
    answer: प्यार
    difficulty: 1
    hints:
    - पाठ का भाव।
    - अच्छा रिश्ता।
    solution: नीमा दादी से प्यार करती है।
    mistakes:
      झगड़ा: hin2_read_again
  - prompt: माँ की माँ को क्या कहते हैं?
    options:
    - नानी
    - दादी
    - चाची
    - बुआ
    answer: नानी
    difficulty: 2
    hints:
    - माँ की ओर से।
    - न से शुरू।
    solution: माँ की माँ नानी होती हैं।
    mistakes: {"दादी": "h1_rishta", "चाची": "h1_rishta", "बुआ": "h1_rishta"}
  - prompt: पिता के पिता को क्या कहते हैं?
    options:
    - दादा
    - नाना
    - मामा
    answer: दादा
    difficulty: 1
    hints:
    - पिता की ओर के रिश्ते सोचो।
    - दादी के साथ कौन रहते हैं?
    solution: 'चरण 1: पिता की ओर के बड़े दादा-दादी हैं। चरण 2: पिता के पिता दादा हैं।'
    mistakes:
      नाना: c2h1_rishta
      मामा: c2h1_rishta
  - prompt: दादी को चश्मा ढूँढने में परेशानी हो रही है। हम क्या करें?
    options:
    - चश्मा ढूँढकर दें
    - हँसें
    - खेलने चले जाएँ
    answer: चश्मा ढूँढकर दें
    difficulty: 1
    hints:
    - बड़ों की मदद करना अच्छा है।
    - तुम्हें मदद चाहिए हो तो कैसा लगे?
    solution: 'चरण 1: दादी को मदद चाहिए। चरण 2: हम चश्मा ढूँढकर देते हैं।'
    mistakes:
      हँसें: c2h1_aadar
      खेलने चले जाएँ: c2h1_aadar
  - prompt: '''नानी'' शब्द में कितने अक्षर हैं?'
    options:
    - दो
    - एक
    - चार
    answer: दो
    difficulty: 1
    hints:
    - ना ... फिर?
    - हर अक्षर पर ताली बजाओ।
    solution: 'चरण 1: ना + नी। चरण 2: दो अक्षर।'
    mistakes:
      एक: c2h1_akshar
      चार: c2h1_akshar
  - prompt: माँ की माँ और पिता की माँ में से 'दादी' कौन हैं?
    options:
    - पिता की माँ
    - माँ की माँ
    - दोनों
    answer: पिता की माँ
    difficulty: 1
    hints:
    - दादा-दादी किस ओर के होते हैं?
    - माँ की माँ नानी हैं।
    solution: 'चरण 1: माँ की माँ नानी हैं। चरण 2: पिता की माँ दादी हैं।'
    mistakes:
      माँ की माँ: c2h1_rishta
      दोनों: c2h1_rishta
  - prompt: दादी से कोई चीज़ माँगनी हो तो कैसे कहें?
    options:
    - दादी जी, कृपया पानी दीजिए।
    - पानी दो!
    - ए, पानी।
    answer: दादी जी, कृपया पानी दीजिए।
    difficulty: 1
    hints:
    - आदर के शब्द ढूँढो।
    - '''जी'' और ''कृपया'' किसमें हैं?'
    solution: 'चरण 1: बड़ों से ''जी'' और ''कृपया'' कहते हैं। चरण 2: ''दादी जी, कृपया पानी दीजिए।'''
    mistakes:
      पानी दो!: c2h1_aadar
      ए, पानी।: c2h1_aadar
  - prompt: पिता के भाई को क्या कहते हैं?
    options:
    - चाचा
    - मामा
    - नाना
    answer: चाचा
    difficulty: 2
    hints:
    - पिता की ओर का रिश्ता है।
    - माँ के भाई मामा होते हैं।
    solution: 'चरण 1: माँ के भाई मामा हैं। चरण 2: पिता के भाई चाचा हैं।'
    mistakes:
      मामा: c2h1_rishta
      नाना: c2h1_rishta
  - prompt: '''दादा'' और ''दादी'' में क्या अलग है?'
    options:
    - अंत की मात्रा
    - पहला अक्षर
    - कुछ नहीं
    answer: अंत की मात्रा
    difficulty: 2
    hints:
    - दोनों को लिखकर देखो।
    - 'आखिरी अक्षर ध्यान से देखो: दा और दी।'
    solution: 'चरण 1: दोनों ''दा'' से शुरू होते हैं। चरण 2: अंत में ''दा'' (आ) और ''दी'' (ई) अलग हैं।'
    mistakes:
      पहला अक्षर: c2h1_akshar
      कुछ नहीं: c2h1_akshar
  - prompt: छुट्टी में नानी के घर जाने पर कौन-सा काम अच्छा है?
    options:
    - नानी के साथ बैठकर कहानी सुनना
    - पूरा दिन फ़ोन पर रहना
    - नानी की बात न सुनना
    answer: नानी के साथ बैठकर कहानी सुनना
    difficulty: 2
    hints:
    - नानी के साथ समय बिताना।
    - नानी के पास क्या खज़ाना होता है?
    solution: 'चरण 1: नानी के पास कहानियाँ और प्यार है। चरण 2: साथ बैठकर सुनना अच्छा है।'
    mistakes:
      पूरा दिन फ़ोन पर रहना: c2h1_aadar
      नानी की बात न सुनना: c2h1_aadar
  - prompt: दादा जी किसके पिता हैं?
    options:
    - पिता जी के
    - माँ के
    - मामा के
    answer: पिता जी के
    difficulty: 3
    hints:
    - दादा-दादी किस ओर के होते हैं?
    - माँ के पिता नाना हैं।
    solution: 'चरण 1: दादा पिता की ओर के हैं। चरण 2: वे पिता जी के पिता हैं।'
    mistakes:
      माँ के: c2h1_rishta
      मामा के: c2h1_rishta
  - prompt: 'स्थिति (केस): छुट्टी में नानी के घर गए हैं। नानी के घुटनों में दर्द है, और उन्हें रसोई से पानी चाहिए। सबसे अच्छा क्या करना चाहिए?'
    options:
    - खुद पानी लाकर नानी को आदर से देना
