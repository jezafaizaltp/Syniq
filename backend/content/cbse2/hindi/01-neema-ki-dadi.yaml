subject: cbse2-hin
chapter: 1
title: नीमा की दादी
tips:
  hin2_read_again: पाठ को फिर से देखो। उत्तर वहीं है।
  hin2_word: शब्द को एक छोटे वाक्य में बोलकर देखो।
  hin2_sound: दोनों शब्द धीरे-धीरे बोलो। आखिरी आवाज़ सुनो।
  h2_akshar: "शब्द को धीरे बोलो और ताली बजाओ: हर टुकड़े पर एक ताली। मात्रा अलग अक्षर नहीं गिनी जाती।"
concepts:
- code: cbse2h.01.neema
  title: नीमा की दादी
  notes: |
    नीमा और उसकी दादी के प्यार भरे रिश्ते के बारे में पाठ। घर के बड़ों का आदर, उनसे कहानियाँ सुनना, साथ समय बिताना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह पाठ नीमा और उसकी दादी के बारे में है। दादी नीमा से बहुत प्यार करती हैं। घर के बड़े हमें कहानियाँ सुनाते हैं और हमारा ध्यान रखते हैं।
    visual: 'चित्र बनाओ: दादी कुर्सी पर बैठी हैं और नीमा उनकी गोद में कहानी सुन रही है।'
    step_by_step: 1. पाठ पढ़ो। 2. नीमा कौन है? 3. दादी क्या करती हैं? 4. तुम अपने दादा-दादी के लिए क्या करते हो?
    real_world: छुट्टियों में बच्चे दादा-दादी के पास जाते हैं और उनसे कहानियाँ सुनते हैं।
  picture:
    kind: compare
    columns:
    - title: रिश्ता
      points:
      - दादी
      - नानी
      - दादा
    - title: कौन
      points:
      - पिता की माँ
      - माँ की माँ
      - पिता के पिता
    alt: दादी पिता की माँ हैं, नानी माँ की माँ हैं, और दादा पिता के पिता हैं।
  activity:
    type: sort
    prompt: दादी के साथ अच्छा समय कैसे बिताएँ?
    bins:
    - अच्छी बात
    - अच्छी नहीं
    items:
    - label: 📖 दादी से कहानी सुनना
      bin: अच्छी बात
      clue: साथ बैठना अच्छा?
      why: साथ समय बिताना।
    - label: 🙏 बड़ों का आदर
      bin: अच्छी बात
      clue: दादी से कैसे बात करें?
      why: आदर से।
    - label: 🫖 दादी की मदद
      bin: अच्छी बात
      clue: दादी थक जाएँ तो?
      why: मदद करना।
    - label: 📱 बात अनसुनी करना
      bin: अच्छी नहीं
      clue: दादी बुलाएँ तो?
      why: बड़ों की बात सुनो।
  items:
  - prompt: दादी किसकी माँ होती हैं?
    options:
    - पिता की
    - बहन की
    - दोस्त की
    - टीचर की
    answer: पिता की
    difficulty: 2
    hints:
    - "नाना-नानी माँ की ओर से होते हैं। तो दादा-दादी किसकी ओर से?"
    - पापा की माँ।
    solution: दादी पिता की माँ होती हैं।
    mistakes: {"बहन की": "h1_rishta", "दोस्त की": "h1_rishta", "टीचर की": "h1_rishta"}
  - prompt: बड़ों से हमें कैसे बात करनी चाहिए?
    options:
    - आदर से
    - चिल्लाकर
    - गुस्से से
    - बिल्कुल नहीं
    answer: आदर से
    difficulty: 1
    hints:
    - वे हमसे बड़े हैं।
    - प्यार और सम्मान।
    solution: बड़ों से आदर से बात करनी चाहिए।
    mistakes: {"चिल्लाकर": "h1_aadar", "गुस्से से": "h1_aadar", "बिल्कुल नहीं": "h1_aadar"}
  - prompt: दादी अक्सर बच्चों को क्या सुनाती हैं?
    options:
    - कहानियाँ
    - शोर
    - गाड़ी का हॉर्न
    - खबरें ही खबरें
    answer: कहानियाँ
    difficulty: 1
    hints:
    - रात को सोने से पहले।
    - राजा-रानी की...
    solution: दादी कहानियाँ सुनाती हैं।
    mistakes: {"शोर": "h1_kahani", "गाड़ी का हॉर्न": "h1_kahani", "खबरें ही खबरें": "h1_kahani"}
  - prompt: '''दादी'' शब्द में कितने अक्षर हैं?'
    options:
    - दो
    - तीन
    - एक
    - चार
    answer: दो
    difficulty: 2
    hints:
    - दा + दी।
    - गिनो।
    solution: 'दा-दी: दो अक्षर।'
    mistakes: {"तीन": "h2_akshar", "एक": "h2_akshar", "चार": "h2_akshar"}
  - prompt: नीमा अपनी दादी से क्या करती है?
    options:
    - प्यार
    - झगड़ा
    - शिकायत
    - मज़ाक उड़ाना
    answer: प्यार
    difficulty: 1
    hints:
    - पाठ का भाव।
    - अच्छा रिश्ता।
    solution: नीमा दादी से प्यार करती है।
    mistakes:
      झगड़ा: hin2_read_again
  - prompt: माँ की माँ को क्या कहते हैं?
    options:
    - नानी
    - दादी
    - चाची
    - बुआ
    answer: नानी
    difficulty: 2
    hints:
    - माँ की ओर से।
    - न से शुरू।
    solution: माँ की माँ नानी होती हैं।
    mistakes: {"दादी": "h1_rishta", "चाची": "h1_rishta", "बुआ": "h1_rishta"}
