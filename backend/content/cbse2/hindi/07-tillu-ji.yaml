# CBSE Class 2 Hindi (NCERT Sarangi, 2024-25), chapter 7. Format: content/README.md.
# Chapter names and order from the Delhi Directorate of Education Class II Hindi plan 2026-27; story details not checked against the book, kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse2-hin
chapter: 7
title: टिल्लू जी
tips:
  h2_mazedar: "कोई चुटकुला सुनकर तुम्हारे चेहरे पर क्या आता है?"
  c2h7_aadar: सोचो, बड़ों को कौन-सा शब्द सुनकर अच्छा लगेगा?
  c2h7_ulta: उलटा शब्द बिलकुल दूसरी तरफ़ का होता है, जैसे दिन-रात।
  c2h7_akshar: शब्द को धीरे से बोलो और पहली आवाज़ सुनो।

concepts:
- code: cbse2h.07.tillu
  title: टिल्लू जी
  notes: |
    टिल्लू जी नाम के पात्र के बारे में मज़ेदार पाठ। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।) अभ्यास: पढ़ना, नाम के साथ 'जी' लगाना, हँसी-मज़ाक, शब्द।
  explanations:
    text: यह मज़ेदार पाठ टिल्लू जी के बारे में है। नाम के साथ 'जी' लगाने से आदर दिखता है। पाठ ध्यान से पढ़ो और सोचो कि टिल्लू जी क्या-क्या करते हैं।
    visual: 'चित्र बनाओ: जैसे तुम टिल्लू जी को सोचते हो, और उनके पास एक बोलता बुलबुला।'
    step_by_step: 1. पाठ पढ़ो। 2. टिल्लू जी कौन हैं? 3. पाठ में क्या मज़ेदार हुआ? 4. नए शब्द लिखो।
    real_world: हम शिक्षक या बड़ों के नाम के साथ 'जी' लगाते हैं, जैसे 'शर्मा जी'।
  picture:
    kind: flow
    steps:
    - पाठ पढ़ो
    - पात्र पहचानो
    - क्या हुआ?
    - क्या सीखा?
    alt: पाठ पढ़ो, पात्र पहचानो, सोचो क्या हुआ, और बताओ क्या सीखा।
  activity:
    type: sort
    prompt: आदर से नाम लेते समय 'जी' लगाते हैं। कौन-सा तरीक़ा आदर वाला है?
    bins:
    - आदर से
    - आदर नहीं
    items:
    - label: टिल्लू जी, नमस्ते
      bin: आदर से
      clue: '''जी'' लगाया?'
      why: '''जी'' से आदर।'
    - label: दादी जी, बैठिए
      bin: आदर से
      clue: '''बैठिए'' कैसा शब्द है?'
      why: आदर वाले शब्द।
    - label: ए! इधर आ
      bin: आदर नहीं
      clue: क्या इसमें आदर है?
      why: यह रूखा बोलना है।
    - label: मास्टर जी, धन्यवाद
      bin: आदर से
      clue: '''जी'' और ''धन्यवाद''?'
      why: आदर से बोलना।
  lesson:
    - teach: '''टिल्लू जी'' एक मज़ेदार पाठ है। नाम के साथ ''जी'' लगाने से आदर दिखता है: टिल्लू जी, दादी जी, गुरु जी। बड़ों की बात का जवाब ''जी हाँ'' या ''जी नहीं'' से देते हैं।'
      check:
        prompt: शिक्षक के बुलाने पर हम क्या कहते हैं?
        options:
        - जी, आया/आई
        - क्या है?
        - रुको!
        answer: जी, आया/आई
        why: '''जी'' लगाकर जवाब देना आदर दिखाता है।'
    - teach: मज़ेदार बात पर हम हँसते हैं। हँसी-मज़ाक अच्छा है, पर किसी का मज़ाक उड़ाकर उसे दुखी करना ठीक नहीं। हम साथ हँसते हैं, किसी पर नहीं।
      picture:
        kind: compare
        columns:
        - title: ठीक
          points:
          - मज़ेदार कहानी पर साथ हँसना
        - title: ठीक नहीं
          points:
          - किसी के गिरने पर हँसना
          - किसी के नाम का मज़ाक
        alt: साथ हँसना ठीक है, किसी पर हँसना नहीं।
      check:
        prompt: दोस्त गिर गया। हम क्या करें?
        options:
        - उठने में मदद करें
        - ज़ोर से हँसें
        - सबको बुलाकर दिखाएँ
        answer: उठने में मदद करें
        why: किसी को चोट लगे तो मदद करते हैं, हँसते नहीं।
    - teach: 'उलटे शब्द: हँसना-रोना, ऊपर-नीचे, आगे-पीछे, अंदर-बाहर, मोटा-पतला। ''टिल्लू'' ट से शुरू होता है; ''ल्लू'' में आधा ल है।'
      check:
        prompt: '''अंदर'' का उलटा क्या है?'
        options:
        - बाहर
        - ऊपर
        - आगे
        answer: बाहर
        why: अंदर और बाहर उलटे हैं।
  items:
  - prompt: नाम के साथ 'जी' लगाने से क्या दिखता है?
    options:
    - आदर
    - गुस्सा
    - डर
    - भूख
    answer: आदर
    difficulty: 1
    hints:
    - बड़ों के लिए।
    - सम्मान।
    solution: '''जी'' लगाने से आदर दिखता है।'
    mistakes: {"गुस्सा": "h1_aadar", "डर": "h1_aadar", "भूख": "h1_aadar"}
  - prompt: पाठ में मुख्य पात्र कौन है?
    options:
    - टिल्लू जी
    - राजा जी
    - मोर
    - चंदा मामा
    answer: टिल्लू जी
    difficulty: 1
    hints:
    - पाठ का नाम देखो।
    - ट से शुरू।
    solution: मुख्य पात्र टिल्लू जी हैं।
    mistakes:
      राजा जी: hin2_read_again
  - prompt: मज़ेदार बात पर हम क्या करते हैं?
    options:
    - हँसते हैं
    - रोते हैं
    - सो जाते हैं
    - भाग जाते हैं
    answer: हँसते हैं
    difficulty: 1
    hints:
    - खुशी।
    - हा-हा।
    solution: मज़ेदार बात पर हम हँसते हैं।
    mistakes: {"रोते हैं": "h2_mazedar", "सो जाते हैं": "h2_mazedar", "भाग जाते हैं": "h2_mazedar"}
  - prompt: '''टिल्लू'' शब्द किस अक्षर से शुरू होता है?'
    options:
    - ट
    - त
    - ल
    - द
    answer: ट
    difficulty: 2
    hints:
    - पहली आवाज़ सुनो।
    - टमाटर वाला।
    solution: टिल्लू 'ट' से शुरू होता है।
    mistakes:
      त: hin2_sound
  - prompt: 'बड़ों से बात करते समय हम कहते हैं:'
    options:
    - जी हाँ
    - हाँ रे
    - चुप
    - हट
    answer: जी हाँ
    difficulty: 2
    hints:
    - आदर वाला शब्द।
    - '''जी'' लगाओ।'
    solution: '''जी हाँ'' आदर से कहते हैं।'
    mistakes: {"हाँ रे": "h1_aadar", "चुप": "h1_aadar", "हट": "h1_aadar"}
  - prompt: '''हँसना'' का उलटा क्या है?'
    options:
    - रोना
    - गाना
    - खेलना
    - खाना
    answer: रोना
    difficulty: 1
    hints:
    - आँसू।
    - दुखी होना।
    solution: हँसना का उलटा रोना है।
    mistakes: {"गाना": "h1_ulta", "खेलना": "h1_ulta", "खाना": "h1_ulta"}
  - prompt: '''ऊपर'' का उलटा क्या है?'
    options:
    - नीचे
    - आगे
    - अंदर
    answer: नीचे
    difficulty: 1
    hints:
    - आसमान ऊपर है, ज़मीन ...?
    - पेड़ से फल किधर गिरता है?
    solution: 'चरण 1: ऊपर आसमान की ओर। चरण 2: उलटा नीचे।'
    mistakes:
      आगे: c2h7_ulta
      अंदर: c2h7_ulta
  - prompt: '''आगे'' का उलटा क्या है?'
    options:
    - पीछे
    - ऊपर
    - बाहर
    answer: पीछे
    difficulty: 1
    hints:
    - लाइन में तुम्हारे आगे कोई, और ...?
    - मुड़कर देखो।
    solution: 'चरण 1: आगे सामने की ओर। चरण 2: उलटा पीछे।'
    mistakes:
      ऊपर: c2h7_ulta
      बाहर: c2h7_ulta
  - prompt: किस नाम के साथ आदर से 'जी' लगा है?
    options:
    - गुरु जी
    - गुरु
    - अरे गुरु
    answer: गुरु जी
    difficulty: 1
    hints:
    - '''जी'' शब्द किसके साथ है?'
    - आदर वाला नाम ढूँढो।
    solution: 'चरण 1: ''जी'' आदर दिखाता है। चरण 2: ''गुरु जी'' में जी लगा है।'
    mistakes:
      गुरु: c2h7_aadar
      अरे गुरु: c2h7_aadar
  - prompt: '''मोटा'' का उलटा क्या है?'
    options:
    - पतला
    - लंबा
    - भारी
    answer: पतला
    difficulty: 1
    hints:
    - हाथी मोटा, धागा ...?
    - भारी तो मोटे जैसा ही है।
    solution: 'चरण 1: मोटा मतलब चौड़ा-भारी। चरण 2: उलटा पतला।'
    mistakes:
      लंबा: c2h7_ulta
      भारी: c2h7_ulta
  - prompt: '''टमाटर'' किस अक्षर से शुरू होता है?'
    options:
    - ट
    - म
    - र
    answer: ट
    difficulty: 1
    hints:
    - पहली आवाज़ सुनो।
    - '''टिल्लू'' भी इसी से शुरू होता है।'
    solution: 'चरण 1: ट-मा-टर। चरण 2: पहला अक्षर ट।'
    mistakes:
      म: c2h7_akshar
      र: c2h7_akshar
  - prompt: कक्षा में कोई बच्चा गलत पढ़ गया। हम क्या करें?
    options:
    - हँसे बिना धीरे से मदद करें
    - ज़ोर से हँसें
    - उसका नाम बिगाड़ें
    answer: हँसे बिना धीरे से मदद करें
    difficulty: 2
    hints:
    - गलती सबसे होती है।
    - तुम्हारी गलती पर कोई हँसे तो कैसा लगे?
    solution: 'चरण 1: गलती पर हँसना दुख देता है। चरण 2: धीरे से मदद करो।'
    mistakes:
      ज़ोर से हँसें: c2h7_aadar
      उसका नाम बिगाड़ें: c2h7_aadar
  - prompt: किस शब्द में आधा अक्षर (संयुक्त अक्षर) है?
    options:
    - टिल्लू
    - टमाटर
    - कमल
    answer: टिल्लू
    difficulty: 2
    hints:
    - किस शब्द में दो एक जैसे अक्षर जुड़े हैं?
    - ल के नीचे ल।
    solution: 'चरण 1: टमाटर और कमल में सब पूरे अक्षर। चरण 2: ''टिल्लू'' में ''ल्ल'' में आधा ल है।'
    mistakes:
      टमाटर: c2h7_akshar
      कमल: c2h7_akshar
  - prompt: दादी पूछती हैं, 'खाना खाया?' आदर से 'हाँ' कैसे कहें?
    options:
    - जी हाँ, दादी जी।
    - हाँ, खा लिया!
    - हम्म।
    answer: जी हाँ, दादी जी।
    difficulty: 2
    hints:
    - '''जी'' कहाँ लगा है?'
    - बड़ों को जवाब आदर से।
    solution: 'चरण 1: बड़ों को ''जी'' लगाकर जवाब देते हैं। चरण 2: ''जी हाँ, दादी जी।'''
    mistakes:
      हाँ, खा लिया!: c2h7_aadar
      हम्म।: c2h7_aadar
  - prompt: '''हँसना'' से बना कौन-सा शब्द मज़ेदार चीज़ बताता है?'
    options:
    - हँसी
    - रोना
    - सोना
    answer: हँसी
    difficulty: 3
    hints:
    - जो शब्द 'हँस' से शुरू हो।
    - रोना उलटा है।
    solution: 'चरण 1: हँसना से हँसी बनता है। चरण 2: हँसी मज़ेदार बात पर आती है।'
    mistakes:
      रोना: c2h7_ulta
      सोना: c2h7_ulta
