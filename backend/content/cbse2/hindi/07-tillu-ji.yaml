# CBSE Class 2 Hindi (NCERT Sarangi, 2024-25), chapter 7. Format: content/README.md.
# Chapter names and order from the Delhi Directorate of Education Class II Hindi plan 2026-27; story details not checked against the book, kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse2-hin
chapter: 7
title: टिल्लू जी
concepts:
- code: cbse2h.07.tillu
  title: टिल्लू जी
  notes: |
    टिल्लू जी नाम के पात्र के बारे में मज़ेदार पाठ। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।) अभ्यास: पढ़ना, नाम के साथ 'जी' लगाना, हँसी-मज़ाक, शब्द।
  explanations:
    text: यह मज़ेदार पाठ टिल्लू जी के बारे में है। नाम के साथ 'जी' लगाने से आदर दिखता है। पाठ ध्यान से पढ़ो और सोचो कि टिल्लू जी क्या-क्या करते हैं।
    visual: 'चित्र बनाओ: जैसे तुम टिल्लू जी को सोचते हो, और उनके पास एक बोलता बुलबुला।'
    step_by_step: 1. पाठ पढ़ो। 2. टिल्लू जी कौन हैं? 3. पाठ में क्या मज़ेदार हुआ? 4. नए शब्द लिखो।
    real_world: हम शिक्षक या बड़ों के नाम के साथ 'जी' लगाते हैं, जैसे 'शर्मा जी'।
  picture:
    kind: flow
    steps:
    - पाठ पढ़ो
    - पात्र पहचानो
    - क्या हुआ?
    - क्या सीखा?
    alt: पाठ पढ़ो, पात्र पहचानो, सोचो क्या हुआ, और बताओ क्या सीखा।
  items:
  - prompt: नाम के साथ 'जी' लगाने से क्या दिखता है?
    options:
    - आदर
    - गुस्सा
    - डर
    - भूख
    answer: आदर
    difficulty: 1
    hints:
    - बड़ों के लिए।
    - सम्मान।
    solution: '''जी'' लगाने से आदर दिखता है।'
  - prompt: पाठ में मुख्य पात्र कौन है?
    options:
    - टिल्लू जी
    - राजा जी
    - मोर
    - चंदा मामा
    answer: टिल्लू जी
    difficulty: 1
    hints:
    - पाठ का नाम देखो।
    - ट से शुरू।
    solution: मुख्य पात्र टिल्लू जी हैं।
    mistakes:
      राजा जी: hin2_read_again
  - prompt: मज़ेदार बात पर हम क्या करते हैं?
    options:
    - हँसते हैं
    - रोते हैं
    - सो जाते हैं
    - भाग जाते हैं
    answer: हँसते हैं
    difficulty: 1
    hints:
    - खुशी।
    - हा-हा।
    solution: मज़ेदार बात पर हम हँसते हैं।
  - prompt: '''टिल्लू'' शब्द किस अक्षर से शुरू होता है?'
    options:
    - ट
    - त
    - ल
    - द
    answer: ट
    difficulty: 2
    hints:
    - पहली आवाज़ सुनो।
    - टमाटर वाला।
    solution: टिल्लू 'ट' से शुरू होता है।
    mistakes:
      त: hin2_sound
  - prompt: 'बड़ों से बात करते समय हम कहते हैं:'
    options:
    - जी हाँ
    - हाँ रे
    - चुप
    - हट
    answer: जी हाँ
    difficulty: 2
    hints:
    - आदर वाला शब्द।
    - '''जी'' लगाओ।'
    solution: '''जी हाँ'' आदर से कहते हैं।'
  - prompt: '''हँसना'' का उलटा क्या है?'
    options:
    - रोना
    - गाना
    - खेलना
    - खाना
    answer: रोना
    difficulty: 1
    hints:
    - आँसू।
    - दुखी होना।
    solution: हँसना का उलटा रोना है।
