# CBSE Class 2 Hindi (NCERT Sarangi, 2024-25), chapter 14. Format: content/README.md.
# Chapter names and order from the Delhi Directorate of Education Class II Hindi plan 2026-27; story details not checked against the book, kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse2-hin
chapter: 14
title: बीज
concepts:
- code: cbse2h.14.beej
  title: बीज
  notes: |
    बीज से पौधा बनने पर पाठ: बीज बोना, पानी, धूप, अंकुर, पौधा। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: बीज को मिट्टी में बोते हैं। पानी और धूप मिलने पर उसमें से अंकुर निकलता है, फिर वह पौधा और फिर पेड़ बनता है।
    visual: 'चित्र बनाओ: चार खाने: बीज, अंकुर, छोटा पौधा, बड़ा पेड़।'
    step_by_step: 1. पाठ पढ़ो। 2. बीज को क्या-क्या चाहिए? 3. पहले क्या निकलता है? 4. क्रम से बताओ।
    real_world: बच्चे एक गिलास में राजमा का बीज रखकर उसे अंकुरित होते देख सकते हैं।
  picture:
    kind: flow
    steps:
    - बीज
    - अंकुर
    - पौधा
    - पेड़
    alt: बीज से अंकुर, अंकुर से पौधा और पौधे से पेड़ बनता है।
  items:
  - prompt: बीज को उगने के लिए क्या चाहिए?
    options:
    - पानी और धूप
    - प्लास्टिक
    - अँधेरा डिब्बा
    - शोर
    answer: पानी और धूप
    difficulty: 1
    hints:
    - पौधों का खाना।
    - बारिश और सूरज।
    solution: बीज को पानी और धूप चाहिए।
  - prompt: बीज से पहले क्या निकलता है?
    options:
    - अंकुर
    - फल
    - फूल
    - तना मोटा
    answer: अंकुर
    difficulty: 1
    hints:
    - छोटा हरा भाग।
    - सबसे पहले।
    solution: बीज से पहले अंकुर निकलता है।
  - prompt: बीज कहाँ बोते हैं?
    options:
    - मिट्टी में
    - पत्थर पर
    - थाली में
    - बैग में
    answer: मिट्टी में
    difficulty: 1
    hints:
    - ज़मीन।
    - बगीचा।
    solution: बीज मिट्टी में बोते हैं।
  - prompt: सही क्रम क्या है?
    options:
    - बीज, अंकुर, पौधा
    - पौधा, बीज, अंकुर
    - अंकुर, बीज, पौधा
    - पौधा, अंकुर, बीज
    answer: बीज, अंकुर, पौधा
    difficulty: 2
    hints:
    - पहले बीज।
    - फिर छोटा हरा भाग।
    solution: बीज → अंकुर → पौधा।
  - prompt: आम के अंदर क्या होता है जिससे नया पेड़ बन सकता है?
    options:
    - गुठली (बीज)
    - छिलका
    - रस
    - पत्ता
    answer: गुठली (बीज)
    difficulty: 2
    hints:
    - बीच का कड़ा भाग।
    - बोने वाला।
    solution: आम की गुठली बीज है।
  - prompt: '''बोना'' का अर्थ है:'
    options:
    - बीज मिट्टी में डालना
    - बोलना
    - रोना
    - सोना
    answer: बीज मिट्टी में डालना
    difficulty: 2
    hints:
    - किसान खेत में ...
    - बीज के साथ।
    solution: बोना यानी बीज मिट्टी में डालना।
    mistakes:
      बोलना: hin2_word
