subject: cbse2-hin
chapter: 14
title: बीज
tips:
  h2_beej_jaroorat: "पौधे को किसान रोज़ क्या देता है, और खेत में ऊपर से क्या मिलता है?"
  h2_beej_kram: "फल-फूल तो बड़े पौधे पर आते हैं। भीगे बीज से सबसे पहले निकलने वाली छोटी-सी हरी नोक को क्या कहते हैं?"
  h2_guthli: "आम खाकर जो बड़ा, सख़्त हिस्सा बचता है, उसे मिट्टी में दबाओ तो क्या होगा?"
  c2h14_zaroorat: सोचो, गमले के पौधे को रोज़ क्या देते हैं ताकि वह न मुरझाए?
  c2h14_kram: "पहले सबसे छोटी चीज़, फिर धीरे-धीरे बड़ी। उगने का रास्ता शुरू से सोचो।"
  c2h14_beej: फल काटकर अंदर देखो। नया पौधा किस हिस्से से उगेगा?
  pqc2h14_bona: सोचो, नया पौधा उगाने के लिए बीज को कहाँ होना चाहिए और उसे क्या मिलना चाहिए?

concepts:
- code: cbse2h.14.beej
  title: बीज
  notes: |
    बीज से पौधा बनने पर पाठ: बीज बोना, पानी, धूप, अंकुर, पौधा। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: बीज को मिट्टी में बोते हैं। पानी और धूप मिलने पर उसमें से अंकुर निकलता है, फिर वह पौधा और फिर पेड़ बनता है।
    visual: 'चित्र बनाओ: चार खाने: बीज, अंकुर, छोटा पौधा, बड़ा पेड़।'
    step_by_step: 1. पाठ पढ़ो। 2. बीज को क्या-क्या चाहिए? 3. पहले क्या निकलता है? 4. क्रम से बताओ।
    real_world: बच्चे एक गिलास में राजमा का बीज रखकर उसे अंकुरित होते देख सकते हैं।
  picture:
    kind: flow
    steps:
    - बीज
    - अंकुर
    - पौधा
    - पेड़
    alt: बीज से अंकुर, अंकुर से पौधा और पौधे से पेड़ बनता है।
  activity:
    type: order
    prompt: बीज से पौधा कैसे बनता है? क्रम से लगाओ।
    steps:
    - 🌰 बीज बोना
    - 💧 पानी देना
    - 🌱 अंकुर निकलना
    - 🪴 पौधा बड़ा होना
    reasons:
      💧 पानी देना: बोने के बाद पानी।
      🌱 अंकुर निकलना: पानी और धूप पाकर बीज फूटता है।
      🪴 पौधा बड़ा होना: अंकुर बढ़कर पौधा बनता है।
  lesson:
    - teach: बीज से नया पौधा बनता है। बीज को मिट्टी में बोते हैं। उसे पानी, धूप और हवा चाहिए। कुछ दिनों में बीज से छोटा अंकुर निकलता है, फिर पौधा बनता है, और बड़ा होकर पेड़।
      picture:
        kind: flow
        steps:
        - बीज
        - अंकुर
        - छोटा पौधा
        - बड़ा पेड़
        alt: बीज से अंकुर, पौधा और पेड़ बनने का क्रम।
      check:
        prompt: बीज से सबसे पहले क्या निकलता है?
        options:
        - अंकुर
        - फल
        - फूल
        answer: अंकुर
        why: बीज फूटकर पहले छोटा अंकुर बनता है।
      ways:
      - style: step_by_step
        teach: 'बीज को उगते देखो। पहला: गीली रूई पर कुछ मूँग के दाने रखो। दूसरा: उसे कटोरी में रखकर धूप वाली खिड़की पर रखो। तीसरा: रोज़ थोड़ा पानी छिड़को। चौथा: दो-तीन दिन बाद ध्यान से देखो, क्या बदला।'
      - style: real_world
        teach: किसान अगले साल बोने के लिए अपनी फसल के सबसे अच्छे बीज चुनकर सूखी जगह पर सँभालकर रखते हैं।
    - teach: 'बीज कई तरह के होते हैं: आम की गुठली, सेब के छोटे बीज, मटर के दाने, राजमा, सूरजमुखी के बीज। कुछ बीज हम खाते भी हैं, जैसे दालें और मूँगफली।'
      check:
        prompt: इनमें से कौन-सा बीज हम खाते हैं?
        options:
        - मूँगफली
        - पत्थर
        - रेत
        answer: मूँगफली
        why: मूँगफली एक बीज है जिसे हम खाते हैं।
      ways:
      - style: visual
        teach: कुछ और फल, और उनके अंदर मिलने वाले बीज कैसे दिखते हैं।
        picture:
          kind: compare
          columns:
          - title: फल
            points:
            - तरबूज़
            - पपीता
            - नींबू
          - title: उसके बीज
            points:
            - काले, चपटे बीज
            - छोटे, काले, गोल बीज
            - छोटे, सफ़ेद बीज
          alt: तरबूज़ में काले चपटे बीज, पपीते में छोटे काले गोल बीज, और नींबू में छोटे सफ़ेद बीज होते हैं।
      - style: real_world
        teach: 'रसोई के मसालों में भी बीज होते हैं: जीरा, राई, धनिया और सौंफ़ सब पौधों के बीज हैं।'
    - teach: 'बीज बोना मतलब बीज को मिट्टी में डालना। अपना पौधा उगाओ: गमले में मिट्टी भरो, बीज बोओ, रोज़ थोड़ा पानी दो, धूप में रखो और रोज़ देखो।'
      check:
        prompt: गमले के बीज को रोज़ कितना पानी देना ठीक है?
        options:
        - थोड़ा-थोड़ा
        - बिलकुल नहीं
        - गमला भरकर डुबो देना
        answer: थोड़ा-थोड़ा
        why: ज़्यादा पानी से बीज सड़ता है; बिना पानी के सूखता है।
      ways:
      - style: visual
        teach: घर पर गमले में अपना पौधा उगाने के आसान कदम।
        picture:
          kind: flow
          steps:
          - गमले में मिट्टी भरो
          - उँगली से एक छोटा गड्ढा बनाओ
          - बीज डालकर ऊपर से मिट्टी ढको
          - थोड़ा पानी दो
          - गमला धूप में रखो
          alt: गमले में मिट्टी भरो, उँगली से छोटा गड्ढा बनाओ, बीज डालकर मिट्टी से ढको, थोड़ा पानी दो और गमला धूप में रखो।
      - style: real_world
        teach: स्कूल के बगीचे में बच्चे बारी-बारी से पौधों को पानी देते हैं, ताकि छुट्टी के दिन भी कोई पौधा प्यासा न रहे।
  items:
  - prompt: बीज को उगने के लिए क्या चाहिए?
    options:
    - पानी और धूप
    - प्लास्टिक
    - अँधेरा डिब्बा
    - शोर
    answer: पानी और धूप
    difficulty: 1
    hints:
    - पौधों का खाना।
    - बारिश और सूरज।
    solution: बीज को पानी और धूप चाहिए।
    mistakes: {"प्लास्टिक": "h2_beej_jaroorat", "अँधेरा डिब्बा": "h2_beej_jaroorat", "शोर": "h2_beej_jaroorat"}
  - prompt: बीज से पहले क्या निकलता है?
    options:
    - अंकुर
    - फल
    - फूल
    - तना मोटा
    answer: अंकुर
    difficulty: 1
    hints:
    - छोटा हरा भाग।
    - सबसे पहले।
    solution: बीज से पहले अंकुर निकलता है।
    mistakes: {"फल": "h2_beej_kram", "फूल": "h2_beej_kram", "तना मोटा": "h2_beej_kram"}
  - prompt: बीज कहाँ बोते हैं?
    options:
    - मिट्टी में
    - पत्थर पर
    - थाली में
    - बैग में
    answer: मिट्टी में
    difficulty: 1
    hints:
    - ज़मीन।
    - बगीचा।
    solution: बीज मिट्टी में बोते हैं।
    mistakes: {"पत्थर पर": "h1_anaj_ugna", "थाली में": "h1_anaj_ugna", "बैग में": "h1_anaj_ugna"}
  - prompt: सही क्रम क्या है?
    options:
    - बीज, अंकुर, पौधा
    - पौधा, बीज, अंकुर
    - अंकुर, बीज, पौधा
    - पौधा, अंकुर, बीज
    answer: बीज, अंकुर, पौधा
    difficulty: 2
    hints:
    - पहले बीज।
    - फिर छोटा हरा भाग।
    solution: बीज → अंकुर → पौधा।
    mistakes: {"पौधा, बीज, अंकुर": "h2_beej_kram", "अंकुर, बीज, पौधा": "h2_beej_kram", "पौधा, अंकुर, बीज": "h2_beej_kram"}
  - prompt: आम के अंदर क्या होता है जिससे नया पेड़ बन सकता है?
    options:
    - गुठली (बीज)
    - छिलका
    - रस
    - पत्ता
    answer: गुठली (बीज)
    difficulty: 2
    hints:
    - बीच का कड़ा भाग।
    - बोने वाला।
    solution: आम की गुठली बीज है।
    mistakes: {"छिलका": "h2_guthli", "रस": "h2_guthli", "पत्ता": "h2_guthli"}
  - prompt: '''बोना'' का अर्थ है:'
    options:
    - बीज मिट्टी में डालना
    - बोलना
    - रोना
    - सोना
    answer: बीज मिट्टी में डालना
    difficulty: 2
    hints:
    - किसान खेत में ...
    - बीज के साथ।
    solution: बोना यानी बीज मिट्टी में डालना।
    mistakes:
      बोलना: hin2_word
  - prompt: पौधे को बढ़ने के लिए किसकी ज़रूरत नहीं?
    options:
    - टीवी
    - पानी
    - धूप
    answer: टीवी
    difficulty: 1
    hints:
    - दो चीज़ें प्रकृति से आती हैं।
    - एक चीज़ घर में मनोरंजन के लिए है।
    solution: 'चरण 1: पौधे को पानी और धूप चाहिए। चरण 2: टीवी की ज़रूरत नहीं।'
    mistakes:
      पानी: c2h14_zaroorat
      धूप: c2h14_zaroorat
  - prompt: बीज को कहाँ बोते हैं?
    options:
    - मिट्टी में
    - पानी की बोतल में
    - थाली में
    answer: मिट्टी में
    difficulty: 1
    hints:
    - खेत और गमले में क्या भरा होता है?
    - जड़ें इसी में फैलती हैं।
    solution: 'चरण 1: जड़ों को पकड़ने के लिए जगह चाहिए। चरण 2: बीज मिट्टी में बोते हैं।'
    mistakes:
      पानी की बोतल में: c2h14_zaroorat
      थाली में: c2h14_zaroorat
  - prompt: आम के बीज को क्या कहते हैं?
    options:
    - गुठली
    - छिलका
    - पत्ता
    answer: गुठली
    difficulty: 1
    hints:
    - आम खाने के बाद बीच में बचने वाली सख़्त चीज़।
    - छिलका ऊपर की परत है।
    solution: 'चरण 1: आम के बीच एक बड़ा बीज होता है। चरण 2: उसे गुठली कहते हैं।'
    mistakes:
      छिलका: c2h14_beej
      पत्ता: c2h14_beej
  - prompt: पौधे के बाद बड़ा होकर क्या बनता है?
    options:
    - पेड़
    - बीज
    - अंकुर
    answer: पेड़
    difficulty: 1
    hints:
    - पौधा बढ़ता ही जाता है।
    - आम का बड़ा, ऊँचा ...?
    solution: 'चरण 1: बीज, अंकुर, पौधा। चरण 2: फिर पेड़।'
    mistakes:
      बीज: c2h14_kram
      अंकुर: c2h14_kram
  - prompt: पौधे का कौन-सा हिस्सा मिट्टी के अंदर रहता है?
    options:
    - जड़
    - फूल
    - पत्ता
    answer: जड़
    difficulty: 1
    hints:
    - यह पानी खींचता है।
    - पौधा उखाड़ो तो नीचे दिखता है।
    solution: 'चरण 1: फूल-पत्ते ऊपर हैं। चरण 2: जड़ मिट्टी के अंदर।'
    mistakes:
      फूल: c2h14_beej
      पत्ता: c2h14_beej
  - prompt: बीज को धूप से दूर, अँधेरी अलमारी में रख दें तो क्या होगा?
    options:
    - ठीक से पौधा नहीं बनेगा
    - जल्दी पेड़ बन जाएगा
    - फल लग जाएँगे
    answer: ठीक से पौधा नहीं बनेगा
    difficulty: 2
    hints:
    - पौधे को किसकी ज़रूरत है?
    - अलमारी में क्या नहीं पहुँचता?
    solution: 'चरण 1: पौधे को धूप चाहिए। चरण 2: अँधेरे में वह ठीक से नहीं बढ़ता।'
    mistakes:
      जल्दी पेड़ बन जाएगा: c2h14_zaroorat
      फल लग जाएँगे: c2h14_zaroorat
  - prompt: '''बीज'' का बहुवचन वाक्य में ठीक रूप चुनो: ''मेरे पास पाँच ___ हैं।'''
    options:
    - बीज
    - बीजा
    - बीजें
    answer: बीज
    difficulty: 2
    hints:
    - कुछ शब्द बहुवचन में भी वैसे ही रहते हैं।
    - 'जैसे: पाँच घर, पाँच पेड़।'
    solution: 'चरण 1: ''बीज'' बहुवचन में नहीं बदलता। चरण 2: ''पाँच बीज हैं।'''
    mistakes:
      बीजा: c2h14_beej
      बीजें: c2h14_beej
  - prompt: मटर की फली खोलो तो अंदर क्या मिलता है?
    options:
    - हरे दाने (बीज)
    - पत्थर
    - पानी
    answer: हरे दाने (बीज)
    difficulty: 2
    hints:
    - जिन्हें सब्ज़ी में डालते हैं।
    - गोल और हरे।
    solution: 'चरण 1: फली मटर का फल है। चरण 2: अंदर हरे दाने हैं, जो बीज हैं।'
    mistakes:
      पत्थर: c2h14_beej
      पानी: c2h14_beej
  - prompt: 'क्रम ठीक करो: (1) पौधा (2) बीज बोना (3) अंकुर। बीच में क्या आएगा?'
    options:
    - अंकुर
    - पौधा
    - बीज बोना
    answer: अंकुर
    difficulty: 3
    hints:
    - सबसे पहले बीज बोते हैं।
    - पौधा सबसे बाद में।
    solution: 'चरण 1: बीज बोना, फिर अंकुर, फिर पौधा। चरण 2: बीच में अंकुर।'
    mistakes:
