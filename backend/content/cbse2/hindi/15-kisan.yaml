subject: cbse2-hin
chapter: 15
title: किसान
tips:
  h2_hal: "मिट्टी को खोदकर नरम करने के लिए बैल किस औज़ार को खींचते हैं?"
  h2_khana_fenkna: "किसान ने महीनों मेहनत करके अनाज उगाया। उसे फेंकने से उसकी मेहनत का क्या होता है?"
  h2_kheti_kram: "जो चीज़ अभी उगी ही नहीं, उसे काट या बेच नहीं सकते। खेती शुरू कहाँ से होती है?"
  h2_kisan: "किसान हल चलाता है और फसल उगाता है। यह काम कहाँ होता है?"
  h2_kisan_de: "हमारी रोटी और चावल कहाँ से आते हैं? उन्हें उगाता कौन है?"

concepts:
- code: cbse2h.15.kisan
  title: किसान
  notes: |
    किसान पर पाठ/कविता: किसान खेत जोतता, बीज बोता, पानी देता, फसल काटता है; हमें अनाज देता है। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: किसान खेत में मेहनत करता है। वह खेत जोतता है, बीज बोता है, पानी देता है और फसल काटता है। उसी से हमें गेहूँ, चावल और सब्ज़ियाँ मिलती हैं।
    visual: 'चित्र बनाओ: खेत में हल चलाता किसान, साथ में बैल और हरी फसल।'
    step_by_step: 1. पाठ पढ़ो। 2. किसान क्या-क्या करता है? 3. हमें उससे क्या मिलता है? 4. किसान का धन्यवाद कैसे करें?
    real_world: केरल में धान, पंजाब में गेहूँ उगाया जाता है।
  picture:
    kind: flow
    steps:
    - खेत जोतना
    - बीज बोना
    - पानी देना
    - फसल काटना
    alt: किसान खेत जोतता है, बीज बोता है, पानी देता है और फसल काटता है।
