subject: cbse2-hin
chapter: 15
title: किसान
tips:
  h2_hal: "मिट्टी को खोदकर नरम करने के लिए बैल किस औज़ार को खींचते हैं?"
  h2_khana_fenkna: "किसान ने महीनों मेहनत करके अनाज उगाया। उसे फेंकने से उसकी मेहनत का क्या होता है?"
  h2_kheti_kram: "जो चीज़ अभी उगी ही नहीं, उसे काट या बेच नहीं सकते। खेती शुरू कहाँ से होती है?"
  h2_kisan: "किसान हल चलाता है और फसल उगाता है। यह काम कहाँ होता है?"
  h2_kisan_de: "हमारी रोटी और चावल कहाँ से आते हैं? उन्हें उगाता कौन है?"
  c2h15_kheti: खेत में साल भर क्या-क्या होता है? पहले कौन-सा काम, फिर कौन-सा?
  c2h15_den: 'थाली का खाना पीछे की ओर सोचो: रसोई से पहले वह कहाँ था?'
  c2h15_aadar: सोचो, जिसने मेहनत से अनाज उगाया, उसे कैसा लगेगा?

concepts:
- code: cbse2h.15.kisan
  title: किसान
  notes: |
    किसान पर पाठ/कविता: किसान खेत जोतता, बीज बोता, पानी देता, फसल काटता है; हमें अनाज देता है। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: किसान खेत में मेहनत करता है। वह खेत जोतता है, बीज बोता है, पानी देता है और फसल काटता है। उसी से हमें गेहूँ, चावल और सब्ज़ियाँ मिलती हैं।
    visual: 'चित्र बनाओ: खेत में हल चलाता किसान, साथ में बैल और हरी फसल।'
    step_by_step: 1. पाठ पढ़ो। 2. किसान क्या-क्या करता है? 3. हमें उससे क्या मिलता है? 4. किसान का धन्यवाद कैसे करें?
    real_world: केरल में धान, पंजाब में गेहूँ उगाया जाता है।
  picture:
    kind: flow
    steps:
    - खेत जोतना
    - बीज बोना
    - पानी देना
    - फसल काटना
    alt: किसान खेत जोतता है, बीज बोता है, पानी देता है और फसल काटता है।
  activity:
    type: order
    prompt: किसान का काम क्रम से लगाओ।
    steps:
    - 🚜 खेत जोतना
    - 🌰 बीज बोना
    - 💧 पानी देना
    - 🌾 फसल काटना
    reasons:
      🌰 बीज बोना: बोने से पहले खेत जोतते हैं।
      💧 पानी देना: बीज बोने के बाद पानी।
      🌾 फसल काटना: फसल पकने पर अंत में कटती है।
  lesson:
    - teach: किसान खेत में काम करते हैं। पहले हल या ट्रैक्टर से खेत जोतते हैं, फिर बीज बोते हैं, पानी (सिंचाई) देते हैं, और फसल पकने पर काटते हैं।
      picture:
        kind: flow
        steps:
        - खेत जोतना
        - बीज बोना
        - पानी देना
        - फसल काटना
        alt: खेती के काम का क्रम।
      check:
        prompt: खेत में बीज बोने से पहले क्या करते हैं?
        options:
        - खेत जोतते हैं
        - फसल काटते हैं
        - अनाज बेचते हैं
        answer: खेत जोतते हैं
        why: जुती नरम मिट्टी में बीज आसानी से उगते हैं।
      ways:
      - style: step_by_step
        teach: 'किसान का एक दिन। पहला: सूरज निकलने से पहले उठना। दूसरा: पशुओं को चारा और पानी देना। तीसरा: दिन भर खेत में काम करना। चौथा: शाम को औज़ार साफ़ करके रखना।'
      - style: real_world
        teach: आजकल कई किसान ट्रैक्टर और पानी के पंप चलाते हैं, और मोबाइल पर मौसम की जानकारी देखकर काम तय करते हैं।
    - teach: किसानों की मेहनत से हमें अनाज (गेहूँ, चावल), दालें, सब्ज़ियाँ और फल मिलते हैं। हमारी रोटी का गेहूँ किसी किसान के खेत में उगा।
      check:
        prompt: रोटी किस अनाज के आटे से बनती है?
        options:
        - गेहूँ
        - चीनी
        - नमक
        answer: गेहूँ
        why: गेहूँ पीसकर आटा बनता है, उससे रोटी।
      ways:
      - style: visual
        teach: खेतों में उगने वाली कुछ और फसलें, और उनसे हमें क्या मिलता है।
        picture:
          kind: compare
          columns:
          - title: फसल
            points:
            - सरसों
            - मूँगफली
            - चाय
          - title: हमें मिलता है
            points:
            - खाना पकाने का तेल
            - तेल और भुने दाने
            - सुबह की चाय की पत्ती
          alt: सरसों से खाना पकाने का तेल, मूँगफली से तेल और भुने दाने, और चाय के पौधे से चाय की पत्ती मिलती है।
      - style: real_world
        teach: पंजाब में बहुत गेहूँ उगता है, और केरल में नारियल और मसाले। अलग-अलग जगह की मिट्टी और मौसम में अलग फसलें होती हैं।
    - teach: मेहनत मतलब खूब काम करना। किसान धूप-बारिश में मेहनत करते हैं, इसलिए खाना फेंकना ठीक नहीं। उतना ही लो जितना खा सको।
      check:
        prompt: थाली में खाना लेते समय क्या ठीक है?
        options:
        - उतना ही लेना जितना खा सकें
        - बहुत सारा लेकर छोड़ देना
        - आधा फेंक देना
        answer: उतना ही लेना जितना खा सकें
        why: इससे खाना बर्बाद नहीं होता और किसान की मेहनत का आदर होता है।
      ways:
      - style: visual
        teach: खाना बचाने वाली आदतें और खाना बर्बाद करने वाली आदतें।
        picture:
          kind: compare
          columns:
          - title: खाना बचाना
            points:
            - बचा खाना ढककर रखना
            - अगले दिन उससे नया पकवान बनाना
          - title: खाना बर्बाद करना
            points:
            - खाना कूड़े में फेंकना
            - आधा खाकर थाली छोड़ देना
          alt: बचा खाना ढककर रखना और अगले दिन उससे नया पकवान बनाना खाना बचाता है। खाना कूड़े में फेंकना और आधा खाकर थाली छोड़ना उसे बर्बाद करता है।
      - style: real_world
        teach: एक रोटी के गेहूँ के लिए किसान महीनों तक खेत को पानी देता है, घास-फूस निकालता है और फसल की रखवाली करता है।
  items:
  - prompt: किसान कहाँ काम करता है?
    options:
    - खेत में
    - दफ़्तर में
    - जहाज़ में
    - दुकान में
    answer: खेत में
    difficulty: 1
    hints:
    - फसल उगाता है।
    - गाँव।
    solution: किसान खेत में काम करता है।
    mistakes: {"दफ़्तर में": "h2_kisan", "जहाज़ में": "h2_kisan", "दुकान में": "h2_kisan"}
  - prompt: किसान से हमें क्या मिलता है?
    options:
    - अनाज
    - खिलौने
    - कपड़े सिले हुए
    - किताबें
    answer: अनाज
    difficulty: 1
    hints:
    - गेहूँ, चावल।
    - खाना।
    solution: किसान से अनाज मिलता है।
    mistakes: {"खिलौने": "h2_kisan_de", "कपड़े सिले हुए": "h2_kisan_de", "किताबें": "h2_kisan_de"}
  - prompt: खेत जोतने के लिए क्या चलाते हैं?
    options:
    - हल
    - पंखा
    - रेडियो
    - छाता
    answer: हल
    difficulty: 2
    hints:
    - बैल खींचते हैं।
    - मिट्टी पलटता है।
    solution: खेत जोतने के लिए हल चलाते हैं।
    mistakes: {"पंखा": "h2_hal", "रेडियो": "h2_hal", "छाता": "h2_hal"}
  - prompt: पहले क्या होता है?
    options:
    - बीज बोना
    - फसल काटना
    - रोटी खाना
    - बाज़ार में बेचना
    answer: बीज बोना
    difficulty: 2
    hints:
    - पहले बोते हैं।
    - फिर उगता है।
    solution: पहले बीज बोते हैं।
    mistakes: {"फसल काटना": "h2_kheti_kram", "रोटी खाना": "h2_kheti_kram", "बाज़ार में बेचना": "h2_kheti_kram"}
  - prompt: 'खाना फेंकना:'
    options:
    - ठीक नहीं
    - अच्छी बात
    - ज़रूरी
    - मज़ेदार
    answer: ठीक नहीं
    difficulty: 1
    hints:
    - किसान की मेहनत।
    - अनाज कीमती है।
    solution: खाना फेंकना ठीक नहीं।
    mistakes: {"अच्छी बात": "h2_khana_fenkna", "ज़रूरी": "h2_khana_fenkna", "मज़ेदार": "h2_khana_fenkna"}
  - prompt: '''मेहनत'' का अर्थ है:'
    options:
    - खूब काम करना
    - आराम करना
    - खेलना
    - सोना
    answer: खूब काम करना
    difficulty: 2
    hints:
    - किसान दिन भर...
    - परिश्रम।
    solution: मेहनत यानी खूब काम करना।
    mistakes:
      आराम करना: hin2_word
  - prompt: चावल किस फसल से मिलता है?
    options:
    - धान
    - गन्ना
    - कपास
    answer: धान
    difficulty: 1
    hints:
    - यह पानी भरे खेतों में उगता है।
    - केरल और बंगाल में खूब उगता है।
    solution: 'चरण 1: धान की बालियों में दाने होते हैं। चरण 2: छिलका हटाकर चावल मिलता है।'
    mistakes:
      गन्ना: c2h15_den
      कपास: c2h15_den
  - prompt: खेतों को पानी देने को क्या कहते हैं?
    options:
    - सिंचाई
    - कटाई
    - जुताई
    answer: सिंचाई
    difficulty: 1
    hints:
    - '''सींचना'' मतलब पानी देना।'
    - कटाई तो फसल काटना है।
    solution: 'चरण 1: सींचना = पानी देना। चरण 2: खेत को पानी देना सिंचाई है।'
    mistakes:
      कटाई: c2h15_kheti
      जुताई: c2h15_kheti
  - prompt: चीनी किस फसल से बनती है?
    options:
    - गन्ना
    - गेहूँ
    - आलू
    answer: गन्ना
    difficulty: 1
    hints:
    - यह लंबा, मीठा डंडा है।
    - इसका रस भी पीते हैं।
    solution: 'चरण 1: गन्ने का रस मीठा होता है। चरण 2: उससे चीनी और गुड़ बनते हैं।'
    mistakes:
      गेहूँ: c2h15_den
      आलू: c2h15_den
  - prompt: फसल पकने पर किसान क्या करते हैं?
    options:
    - फसल काटते हैं
    - नए बीज बोते हैं
    - खेत छोड़ देते हैं
    answer: फसल काटते हैं
    difficulty: 1
    hints:
    - पकी फसल तैयार है।
    - इसे कटाई कहते हैं।
    solution: 'चरण 1: पकी फसल तैयार है। चरण 2: किसान उसे काटते हैं।'
    mistakes:
      नए बीज बोते हैं: c2h15_kheti
      खेत छोड़ देते हैं: c2h15_kheti
  - prompt: खेत जोतने के लिए पहले बैलों के साथ क्या चलाते थे?
    options:
    - हल
    - साइकिल
    - नाव
    answer: हल
    difficulty: 1
    hints:
    - यह मिट्टी को खोदकर नरम करता है।
    - बैल इसे खींचते हैं।
    solution: 'चरण 1: जोतने से मिट्टी नरम होती है। चरण 2: बैल हल खींचते थे।'
    mistakes:
      साइकिल: c2h15_kheti
      नाव: c2h15_kheti
  - prompt: स्कूल के खाने में बचा खाना फेंकने से अच्छा क्या है?
    options:
    - पहले से कम लेना
    - रोज़ फेंक देना
    - दोस्त की थाली में डालना
    answer: पहले से कम लेना
    difficulty: 2
    hints:
    - खाना बर्बाद न हो।
    - भूख हो तो बाद में और ले सकते हो।
    solution: 'चरण 1: खाना किसान की मेहनत है। चरण 2: कम लो, ज़रूरत हो तो फिर लो।'
    mistakes:
      रोज़ फेंक देना: c2h15_aadar
      दोस्त की थाली में डालना: c2h15_aadar
  - prompt: हमारे कपड़ों की रुई किस फसल से आती है?
    options:
    - कपास
    - धान
    - गेहूँ
    answer: कपास
    difficulty: 2
    hints:
    - इसके पौधे पर सफ़ेद, मुलायम गोले लगते हैं।
    - धान और गेहूँ तो खाने के लिए हैं।
    solution: 'चरण 1: कपास के पौधे पर रुई के गोले लगते हैं। चरण 2: उससे धागा और कपड़ा बनता है।'
    mistakes:
      धान: c2h15_den
      गेहूँ: c2h15_den
  - prompt: '''मेहनती'' किसे कहते हैं?'
    options:
    - जो खूब काम करे
    - जो सारा दिन सोए
    - जो काम से भागे
    answer: जो खूब काम करे
    difficulty: 2
    hints:
    - '''मेहनत'' से बना शब्द।'
    - किसान दिन भर खेत में।
    solution: 'चरण 1: मेहनत = खूब काम। चरण 2: मेहनती = जो खूब काम करे।'
    mistakes:
      जो सारा दिन सोए: c2h15_aadar
      जो काम से भागे: c2h15_aadar
  - prompt: खेत से थाली तक रोटी का सही क्रम क्या है?
    options:
    - गेहूँ उगा, आटा पिसा, रोटी बनी
    - रोटी बनी, गेहूँ उगा, आटा पिसा
    - आटा पिसा, गेहूँ उगा, रोटी बनी
    answer: गेहूँ उगा, आटा पिसा, रोटी बनी
    difficulty: 3
    hints:
    - सबसे पहले खेत में क्या होता है?
    - आटा किससे बनता है?
    solution: 'चरण 1: खेत में गेहूँ उगता है। चरण 2: पीसकर आटा, फिर रोटी।'
    mistakes:
      रोटी बनी, गेहूँ उगा, आटा पिसा: c2h15_kheti
      आटा पिसा, गेहूँ उगा, रोटी बनी: c2h15_kheti
  - prompt: 'स्थिति (केस): इस साल बारिश बहुत कम हुई। किसान के खेत सूखने लगे और फसल मुरझाने लगी। किसान को क्या करना चाहिए?'
    options:
