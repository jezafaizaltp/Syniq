subject: cbse2-hin
chapter: 22
title: चार दिशाएँ
tips:
  h2_disha_suraj: "सुबह जिधर आसमान लाल होता है, वही दिशा सूरज उगने की है। शाम को वह उलटी ओर डूबता है।"
  h2_disha_ulta: "दिशाएँ जोड़ियों में आमने-सामने होती हैं: पूरब के सामने पश्चिम। उत्तर के सामने कौन?"
  h2_naksha: "नक्शे के कोने में तीर का निशान देखो, उस पर एक अक्षर लिखा होता है।"

concepts:
- code: cbse2h.22.char
  title: चार दिशाएँ
  notes: |
    चार दिशाओं पर पाठ: पूरब, पश्चिम, उत्तर, दक्षिण; सूरज पूरब में उगता है और पश्चिम में डूबता है। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: 'दिशाएँ चार हैं: पूरब, पश्चिम, उत्तर और दक्षिण। सूरज पूरब में उगता है और पश्चिम में डूबता है। सुबह सूरज की ओर मुँह करो तो सामने पूरब है।'
    visual: 'चित्र बनाओ: बीच में एक बच्चा, सामने उगता सूरज (पूरब), पीछे पश्चिम, बाएँ उत्तर, दाएँ दक्षिण।'
    step_by_step: 1. पाठ पढ़ो। 2. चारों दिशाओं के नाम बताओ। 3. सूरज कहाँ उगता है? 4. सूरज कहाँ डूबता है?
    real_world: नक्शे में ऊपर की ओर उत्तर दिशा होती है।
  picture:
    kind: compare
    columns:
    - title: सुबह
      points:
      - सूरज उगता है
      - पूरब
    - title: शाम
      points:
      - सूरज डूबता है
      - पश्चिम
    alt: सुबह सूरज पूरब में उगता है और शाम को पश्चिम में डूबता है।
  items:
  - prompt: दिशाएँ कितनी हैं?
    options:
    - चार
    - दो
    - तीन
    - पाँच
    answer: चार
    difficulty: 1
    hints:
    - पाठ का नाम।
    - पू, प, उ, द।
    solution: दिशाएँ चार हैं।
    mistakes:
      दो: hin2_read_again
  - prompt: सूरज किस दिशा में उगता है?
    options:
    - पूरब
    - पश्चिम
    - उत्तर
    - दक्षिण
    answer: पूरब
    difficulty: 1
    hints:
    - सुबह।
    - प से शुरू, पू।
    solution: सूरज पूरब में उगता है।
    mistakes: {"पश्चिम": "h2_disha_suraj", "उत्तर": "h2_disha_suraj", "दक्षिण": "h2_disha_suraj"}
  - prompt: सूरज किस दिशा में डूबता है?
    options:
    - पश्चिम
    - पूरब
    - उत्तर
    - दक्षिण
    answer: पश्चिम
    difficulty: 1
    hints:
    - शाम को।
    - पूरब का उलटा।
    solution: सूरज पश्चिम में डूबता है।
    mistakes: {"पूरब": "h2_disha_suraj", "उत्तर": "h2_disha_suraj", "दक्षिण": "h2_disha_suraj"}
  - prompt: '''उत्तर'' का उलटा क्या है?'
    options:
    - दक्षिण
    - पूरब
    - पश्चिम
    - ऊपर
    answer: दक्षिण
    difficulty: 2
    hints:
    - उत्तर के सामने।
    - द से शुरू।
    solution: उत्तर का उलटा दक्षिण है।
    mistakes: {"पूरब": "h2_disha_ulta", "पश्चिम": "h2_disha_ulta", "ऊपर": "h2_disha_ulta"}
  - prompt: नक्शे में ऊपर की ओर कौन-सी दिशा होती है?
    options:
    - उत्तर
    - दक्षिण
    - पश्चिम
    - पूरब
    answer: उत्तर
    difficulty: 2
    hints:
    - हिमालय भारत के ऊपर।
    - उ से शुरू।
    solution: नक्शे में ऊपर उत्तर होता है।
    mistakes: {"दक्षिण": "h2_naksha", "पश्चिम": "h2_naksha", "पूरब": "h2_naksha"}
  - prompt: '''पूरब'' का दूसरा नाम क्या है?'
    options:
    - पूर्व
    - पूरा
    - पूछ
    - पुल
    answer: पूर्व
    difficulty: 2
    hints:
    - एक जैसा शब्द।
    - पू से।
    solution: पूरब को पूर्व भी कहते हैं।
