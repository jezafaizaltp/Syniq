subject: cbse2-hin
chapter: 26
title: बादल
tips:
  h2_baarish_fasal: "खेतों के पौधों को पानी कहाँ से मिलता है? किसान आसमान की ओर क्यों देखता है?"
  h2_badal: "ऊपर देखो: रुई जैसे सफ़ेद टुकड़े कहाँ तैरते हैं?"
  h2_badal_rui: "पत्थर, कोयला, लोहा भारी और सख़्त हैं। बादल हल्के और नरम दिखते हैं, जैसे तकिये के अंदर भरी चीज़।"
  h2_bijli: "गरज के साथ आसमान में टेढ़ी-मेढ़ी चमक दिखती है। उसका नाम घर की रोशनी वाली चीज़ जैसा है।"

concepts:
- code: cbse2h.26.badal
  title: बादल
  notes: |
    बादल पर कविता: आसमान में तैरते बादल, बादल गरजना, बारिश लाना, अलग-अलग आकार। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: बादल आसमान में तैरते हैं। सफ़ेद बादल रुई जैसे दिखते हैं और काले बादल बारिश लाते हैं। बादल गरजते हैं और बिजली चमकती है।
    visual: 'चित्र बनाओ: रुई जैसे सफ़ेद बादल और एक काला बादल जिससे बूँदें गिर रही हैं।'
    step_by_step: 1. कविता लय से पढ़ो। 2. बादल कहाँ रहते हैं? 3. काले बादल क्या लाते हैं? 4. तुकांत शब्द खोजो।
    real_world: किसान काले बादल देखकर खुश होते हैं क्योंकि बारिश फसल के लिए ज़रूरी है।
  picture:
    kind: flow
    steps:
    - सफ़ेद बादल
    - काले बादल
    - गरजना
    - बारिश
    alt: सफ़ेद बादल काले होते हैं, गरजते हैं और बारिश होती है।
  items:
  - prompt: बादल कहाँ होते हैं?
    options:
    - आसमान में
    - ज़मीन के अंदर
    - पानी के नीचे
    - घर के अंदर
    answer: आसमान में
    difficulty: 1
    hints:
    - ऊपर देखो।
    - तैरते हैं।
    solution: बादल आसमान में होते हैं।
    mistakes: {"ज़मीन के अंदर": "h2_badal", "पानी के नीचे": "h2_badal", "घर के अंदर": "h2_badal"}
  - prompt: काले बादल क्या लाते हैं?
    options:
    - बारिश
    - धूप
    - बर्फ़ की मिठाई
    - गर्मी
    answer: बारिश
    difficulty: 1
    hints:
    - छाता निकालो।
    - पानी।
    solution: काले बादल बारिश लाते हैं।
    mistakes:
      धूप: hin2_read_again
  - prompt: सफ़ेद बादल किसके जैसे दिखते हैं?
    options:
    - रुई
    - पत्थर
    - कोयला
    - लोहा
    answer: रुई
    difficulty: 1
    hints:
    - मुलायम।
    - सफ़ेद और फूला।
    solution: सफ़ेद बादल रुई जैसे दिखते हैं।
    mistakes: {"पत्थर": "h2_badal_rui", "कोयला": "h2_badal_rui", "लोहा": "h2_badal_rui"}
  - prompt: बादल गरजने के साथ आसमान में क्या चमकती है?
    options:
    - बिजली
    - चाँदनी
    - दीया
    - टॉर्च
    answer: बिजली
    difficulty: 2
    hints:
    - तेज़ रोशनी।
    - बारिश के मौसम में।
    solution: बिजली चमकती है।
    mistakes: {"चाँदनी": "h2_bijli", "दीया": "h2_bijli", "टॉर्च": "h2_bijli"}
  - prompt: '''बादल'' का दूसरा शब्द क्या है?'
    options:
    - मेघ
    - मेज़
    - मेला
    - मोर
    answer: मेघ
    difficulty: 2
    hints:
    - म से शुरू।
    - मेघ-मल्हार।
    solution: बादल को मेघ भी कहते हैं।
    mistakes:
      मेज़: hin2_word
  - prompt: बारिश किसके लिए ज़रूरी है?
    options:
    - फसल के लिए
    - टीवी के लिए
    - मोबाइल के लिए
    - किसी के लिए नहीं
    answer: फसल के लिए
    difficulty: 2
    hints:
    - किसान खुश होते हैं।
    - खेत।
    solution: बारिश फसल के लिए ज़रूरी है।
    mistakes: {"टीवी के लिए": "h2_baarish_fasal", "मोबाइल के लिए": "h2_baarish_fasal", "किसी के लिए नहीं": "h2_baarish_fasal"}
