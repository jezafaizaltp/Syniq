subject: cbse2-hin
chapter: 26
title: बादल
tips:
  h2_baarish_fasal: "खेतों के पौधों को पानी कहाँ से मिलता है? किसान आसमान की ओर क्यों देखता है?"
  h2_badal: "ऊपर देखो: रुई जैसे सफ़ेद टुकड़े कहाँ तैरते हैं?"
  h2_badal_rui: "पत्थर, कोयला, लोहा भारी और सख़्त हैं। बादल हल्के और नरम दिखते हैं, जैसे तकिये के अंदर भरी चीज़।"
  h2_bijli: "गरज के साथ आसमान में टेढ़ी-मेढ़ी चमक दिखती है। उसका नाम घर की रोशनी वाली चीज़ जैसा है।"
  c2h26_badal: 'आसमान में बादलों को देखो: वे कैसे दिखते हैं, क्या करते हैं?'
  c2h26_baarish: "काले बादलों वाला दिन याद करो: पहले क्या होता है, फिर क्या?"
  c2h26_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। अर्थ ठीक बैठता है?

concepts:
- code: cbse2h.26.badal
  title: बादल
  notes: |
    बादल पर कविता: आसमान में तैरते बादल, बादल गरजना, बारिश लाना, अलग-अलग आकार। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: बादल आसमान में तैरते हैं। सफ़ेद बादल रुई जैसे दिखते हैं और काले बादल बारिश लाते हैं। बादल गरजते हैं और बिजली चमकती है।
    visual: 'चित्र बनाओ: रुई जैसे सफ़ेद बादल और एक काला बादल जिससे बूँदें गिर रही हैं।'
    step_by_step: 1. कविता लय से पढ़ो। 2. बादल कहाँ रहते हैं? 3. काले बादल क्या लाते हैं? 4. तुकांत शब्द खोजो।
    real_world: किसान काले बादल देखकर खुश होते हैं क्योंकि बारिश फसल के लिए ज़रूरी है।
  picture:
    kind: flow
    steps:
    - सफ़ेद बादल
    - काले बादल
    - गरजना
    - बारिश
    alt: सफ़ेद बादल काले होते हैं, गरजते हैं और बारिश होती है।
  activity:
    type: order
    prompt: बादल से बारिश तक, क्रम से लगाओ।
    steps:
    - ☁️ सफ़ेद बादल तैरते हैं
    - 🌥️ बादल काले-घने होते हैं
    - ⚡ बादल गरजते हैं
    - 🌧️ बारिश होती है
    reasons:
      🌥️ बादल काले-घने होते हैं: पानी भरने पर बादल काले होते हैं।
      ⚡ बादल गरजते हैं: घने बादल गरजते हैं।
      🌧️ बारिश होती है: गरजने के बाद बरसते हैं।
  lesson:
    - teach: 'बादल आसमान में तैरते हैं। सफ़ेद बादल रुई जैसे हल्के दिखते हैं। हवा उन्हें इधर-उधर ले जाती है और उनका आकार बदलता रहता है: कभी हाथी, कभी घोड़ा।'
      check:
        prompt: बादलों को आसमान में कौन चलाता है?
        options:
        - हवा
        - पक्षी
        - पेड़
        answer: हवा
        why: हवा बादलों को धकेलकर आगे ले जाती है।
      ways:
      - style: visual
        teach: आसमान में दिखने वाले हल्के बादल और भारी बादल, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: हल्के बादल
            points:
            - सफ़ेद और फूले हुए
            - धूप वाले दिन दिखते हैं
          - title: भारी बादल
            points:
            - काले-स्लेटी, नीचे झुके हुए
            - आँधी-तूफ़ान से पहले दिखते हैं
          alt: हल्के बादल सफ़ेद और फूले हुए होते हैं और धूप वाले दिन दिखते हैं। भारी बादल काले-स्लेटी और नीचे झुके होते हैं और आँधी-तूफ़ान से पहले दिखते हैं।
      - style: real_world
        teach: हवाई जहाज़ की खिड़की से नीचे देखो, तो बादल नीचे बिछे सफ़ेद पहाड़ों जैसे दिखते हैं।
    - teach: बादल पानी की नन्हीं बूँदों से बनते हैं। जब बादल पानी से भारी हो जाते हैं, तो काले दिखते हैं और बरसते हैं। बादल गरजते हैं और बिजली चमकती है।
      picture:
        kind: flow
        steps:
        - सफ़ेद हल्के बादल
        - पानी से भरकर काले
        - गरज और बिजली
        - बारिश
        alt: बादल पानी से भरकर काले होते हैं और बरसते हैं।
      check:
        prompt: काले बादल किससे भरे होते हैं?
        options:
        - पानी से
        - धुएँ से
        - रेत से
        answer: पानी से
        why: बादल पानी की बूँदों से बनते हैं; भारी होने पर काले दिखते हैं।
      ways:
      - style: step_by_step
        teach: 'बादल जैसी बूँदें बनते देखो। पहला: किसी बड़े के साथ बर्तन में पानी गर्म करो। दूसरा: भाप ऊपर उठती देखो। तीसरा: भाप के ऊपर एक ठंडी थाली पकड़ो। चौथा: देखो, थाली के नीचे पानी की नन्ही बूँदें बन जाती हैं।'
      - style: real_world
        teach: पहाड़ों पर कई बार बादल इतने नीचे आ जाते हैं कि सड़क पर चलते लोग उनके बीच से होकर गुज़रते हैं।
    - teach: बारिश से खेतों को पानी मिलता है, नदियाँ-तालाब भरते हैं और पेड़-पौधे हरे होते हैं। बादल को मेघ भी कहते हैं। 'बादल' का बहुवचन भी 'बादल' ही है।
      check:
        prompt: किसान बादलों का इंतज़ार क्यों करते हैं?
        options:
        - बारिश से फसल को पानी मिलता है
        - बादल फल देते हैं
        - बादल से छाया के लिए
        answer: बारिश से फसल को पानी मिलता है
        why: फसल को उगने के लिए पानी चाहिए।
      ways:
      - style: visual
        teach: 'पानी का सफ़र: समुद्र से बादल, और बादल से फिर धरती तक।'
        picture:
          kind: flow
          steps:
          - सूरज की गर्मी से नदी और समुद्र का पानी भाप बनता है
          - भाप ऊपर उठकर बादल बनाती है
          - बादल भारी होकर बरसते हैं
          - बारिश का पानी नदियों में बहकर फिर समुद्र तक जाता है
          alt: सूरज की गर्मी से पानी भाप बनता है, भाप ऊपर उठकर बादल बनाती है, बादल भारी होकर बरसते हैं, और बारिश का पानी नदियों से होकर फिर समुद्र तक जाता है।
      - style: real_world
        teach: जिस साल अच्छी बारिश होती है, उस साल कुएँ भरे रहते हैं और गर्मियों में भी पानी की कमी नहीं होती।
  items:
  - prompt: बादल कहाँ होते हैं?
    options:
    - आसमान में
    - ज़मीन के अंदर
    - पानी के नीचे
    - घर के अंदर
    answer: आसमान में
    difficulty: 1
    hints:
    - ऊपर देखो।
    - तैरते हैं।
    solution: बादल आसमान में होते हैं।
    mistakes: {"ज़मीन के अंदर": "h2_badal", "पानी के नीचे": "h2_badal", "घर के अंदर": "h2_badal"}
  - prompt: काले बादल क्या लाते हैं?
    options:
    - बारिश
    - धूप
    - बर्फ़ की मिठाई
    - गर्मी
    answer: बारिश
    difficulty: 1
    hints:
    - छाता निकालो।
    - पानी।
    solution: काले बादल बारिश लाते हैं।
    mistakes:
      धूप: hin2_read_again
  - prompt: सफ़ेद बादल किसके जैसे दिखते हैं?
    options:
    - रुई
    - पत्थर
    - कोयला
    - लोहा
    answer: रुई
    difficulty: 1
    hints:
    - मुलायम।
    - सफ़ेद और फूला।
    solution: सफ़ेद बादल रुई जैसे दिखते हैं।
    mistakes: {"पत्थर": "h2_badal_rui", "कोयला": "h2_badal_rui", "लोहा": "h2_badal_rui"}
  - prompt: बादल गरजने के साथ आसमान में क्या चमकती है?
    options:
    - बिजली
    - चाँदनी
    - दीया
    - टॉर्च
    answer: बिजली
    difficulty: 2
    hints:
    - तेज़ रोशनी।
    - बारिश के मौसम में।
    solution: बिजली चमकती है।
    mistakes: {"चाँदनी": "h2_bijli", "दीया": "h2_bijli", "टॉर्च": "h2_bijli"}
  - prompt: '''बादल'' का दूसरा शब्द क्या है?'
    options:
    - मेघ
    - मेज़
    - मेला
    - मोर
    answer: मेघ
    difficulty: 2
    hints:
    - म से शुरू।
    - मेघ-मल्हार।
    solution: बादल को मेघ भी कहते हैं।
    mistakes:
      मेज़: hin2_word
  - prompt: बारिश किसके लिए ज़रूरी है?
    options:
    - फसल के लिए
    - टीवी के लिए
    - मोबाइल के लिए
    - किसी के लिए नहीं
    answer: फसल के लिए
    difficulty: 2
    hints:
    - किसान खुश होते हैं।
    - खेत।
    solution: बारिश फसल के लिए ज़रूरी है।
    mistakes: {"टीवी के लिए": "h2_baarish_fasal", "मोबाइल के लिए": "h2_baarish_fasal", "किसी के लिए नहीं": "h2_baarish_fasal"}
  - prompt: '''मेघ'' का अर्थ क्या है?'
    options:
    - बादल
    - पहाड़
    - पेड़
    answer: बादल
    difficulty: 1
    hints:
    - यह आसमान में रहता है।
    - इस पाठ का नाम सोचो।
    solution: 'चरण 1: मेघ आसमान में तैरता है। चरण 2: मेघ = बादल।'
    mistakes:
      पहाड़: c2h26_shabd
      पेड़: c2h26_shabd
  - prompt: बादल गरजने के बाद अक्सर क्या होता है?
    options:
    - बारिश
    - बर्फ़ की मिठाई
    - भूकंप
    answer: बारिश
    difficulty: 1
    hints:
    - काले बादल, गड़गड़ाहट, फिर ...?
    - छाता निकालो!
    solution: 'चरण 1: गरजते बादल पानी से भरे हैं। चरण 2: फिर बारिश होती है।'
    mistakes:
      बर्फ़ की मिठाई: c2h26_baarish
      भूकंप: c2h26_baarish
  - prompt: बादल का आकार क्यों बदलता रहता है?
    options:
    - "हवा उसे धकेलती और बिखेरती है"
    - "बादल थककर सो जाता है"
    - "बादल को बहुत भूख लगती है"
    answer: हवा उसे धकेलती और बिखेरती है
    difficulty: 2
    hints:
    - बादल ठोस नहीं है।
    - आसमान में कौन चलता रहता है?
    solution: 'चरण 1: बादल हल्का, नरम है। चरण 2: हवा उसे धकेलकर आकार बदल देती है।'
    mistakes:
      "बादल थककर सो जाता है": c2h26_badal
      "बादल को बहुत भूख लगती है": c2h26_badal
  - prompt: बिजली चमकते समय क्या करना सुरक्षित है?
    options:
    - घर के अंदर रहना
    - पेड़ के नीचे खड़े होना
    - छत पर पतंग उड़ाना
    answer: घर के अंदर रहना
    difficulty: 1
    hints:
    - बिजली ऊँची और खुली जगहों पर गिरती है।
    - पक्की छत के नीचे।
    solution: 'चरण 1: ऊँची, खुली जगह खतरनाक है। चरण 2: घर के अंदर रहो।'
    mistakes:
      पेड़ के नीचे खड़े होना: c2h26_baarish
      छत पर पतंग उड़ाना: c2h26_baarish
  - prompt: बारिश से क्या भर जाता है?
    options:
    - नदियाँ और तालाब
    - बस्ते
    - अलमारी
    answer: नदियाँ और तालाब
    difficulty: 1
    hints:
    - बारिश का पानी कहाँ जमा होता है?
    - पानी वाली जगहें।
    solution: 'चरण 1: बारिश का पानी बहकर जमा होता है। चरण 2: नदियाँ और तालाब भरते हैं।'
    mistakes:
      बस्ते: c2h26_baarish
      अलमारी: c2h26_baarish
  - prompt: 'सही वाक्य चुनो: ''आसमान में बहुत से ___ हैं।'''
    options:
    - बादल
    - बादलें
    - बादलियाँ
    answer: बादल
    difficulty: 2
    hints:
    - कुछ शब्द बहुवचन में नहीं बदलते।
    - 'जैसे: बहुत से पेड़, बहुत से घर।'
    solution: 'चरण 1: ''बादल'' बहुवचन में वैसा ही रहता है। चरण 2: ''बहुत से बादल हैं।'''
    mistakes:
      बादलें: c2h26_shabd
      बादलियाँ: c2h26_shabd
  - prompt: बादल किससे बनते हैं?
    options:
    - पानी की नन्हीं बूँदों से
    - रुई से
    - धुएँ से
    answer: पानी की नन्हीं बूँदों से
    difficulty: 2
    hints:
    - बादल बरसते हैं तो क्या गिरता है?
    - वे रुई जैसे दिखते हैं, पर रुई नहीं हैं।
    solution: 'चरण 1: बादल बरसकर पानी देते हैं। चरण 2: वे पानी की नन्हीं बूँदों से बने हैं।'
    mistakes:
      रुई से: c2h26_badal
      धुएँ से: c2h26_badal
  - prompt: '''गरजना'' का अर्थ क्या है?'
    options:
    - ज़ोर की आवाज़ करना
    - धीरे से चलना
    - चुप रहना
    answer: ज़ोर की आवाज़ करना
    difficulty: 2
    hints:
    - बादल गड़-गड़ करते हैं।
    - शेर भी ऐसा करता है।
    solution: 'चरण 1: बादल गड़गड़ की आवाज़ करते हैं। चरण 2: गरजना = ज़ोर की आवाज़ करना।'
    mistakes:
      धीरे से चलना: c2h26_shabd
      चुप रहना: c2h26_shabd
  - prompt: कई दिन बारिश न हो, तो खेतों का क्या होगा?
    options:
    - फसल सूखने लगेगी
    - फसल और हरी हो जाएगी
    - खेत में नदी बहेगी
    answer: फसल सूखने लगेगी
    difficulty: 3
    hints:
