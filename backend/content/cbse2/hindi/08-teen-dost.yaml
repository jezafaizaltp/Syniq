subject: cbse2-hin
chapter: 8
title: तीन दोस्त
tips:
  c2h8_dost: सोचो, तुम मुश्किल में हो तो दोस्त से क्या चाहोगे?
  c2h8_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। अर्थ ठीक बैठता है?
  c2h8_ginti: उँगलियों पर गिनो, किसी को छोड़ो मत।
concepts:
- code: cbse2h.08.teen
  title: तीन दोस्त
  notes: |
    तीन दोस्तों की कहानी: मिलकर रहना, एक-दूसरे की मदद करना, बाँटना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कहानी तीन दोस्तों की है। सच्चे दोस्त मिलकर रहते हैं, मुश्किल में मदद करते हैं और चीज़ें बाँटते हैं।
    visual: 'चित्र बनाओ: तीन दोस्त हाथ पकड़े खड़े हैं और एक-दूसरे की मदद कर रहे हैं।'
    step_by_step: 1. कहानी पढ़ो। 2. तीनों दोस्त कौन हैं? 3. उन्होंने एक-दूसरे की मदद कैसे की? 4. दोस्ती से क्या सीखा?
    real_world: जब दोस्त का पेंसिल खो जाए तो हम अपनी पेंसिल बाँट सकते हैं।
  picture:
    kind: flow
    steps:
    - मुश्किल आई
    - दोस्तों ने सोचा
    - मिलकर मदद की
    - सब खुश
    alt: मुश्किल आई, दोस्तों ने सोचा, मिलकर मदद की और सब खुश हो गए।
  activity:
    type: sort
    prompt: तीन दोस्तों जैसा व्यवहार कौन-सा है?
    bins:
    - दोस्ती वाला
    - दोस्ती वाला नहीं
    items:
    - label: 🤝 मुश्किल में मदद
      bin: दोस्ती वाला
      clue: दोस्त फँस जाए तो?
      why: मदद करना।
    - label: 🍪 बाँटकर खाना
      bin: दोस्ती वाला
      clue: एक बिस्किट, तीन दोस्त?
      why: बाँटना।
    - label: 🎲 मिलकर खेलना
      bin: दोस्ती वाला
      clue: साथ खेलें?
      why: मिलकर रहना।
    - label: 😏 अकेले सब रख लेना
      bin: दोस्ती वाला नहीं
      clue: क्या इससे दोस्त खुश?
      why: यह स्वार्थ है।
  lesson:
    - teach: '''तीन दोस्त'' कहानी में तीन दोस्त मिलकर रहते हैं। वे साथ खेलते हैं, खाना बाँटते हैं और मुश्किल में एक-दूसरे की मदद करते हैं।'
      picture:
        kind: flow
        steps:
        - साथ खेलना
        - खाना बाँटना
        - मुश्किल में मदद
        alt: 'दोस्ती के तीन काम: साथ खेलना, बाँटना, मदद।'
      check:
        prompt: अच्छे दोस्त खाने के समय क्या करते हैं?
        options:
        - खाना बाँटते हैं
        - छीन लेते हैं
        - छिपा लेते हैं
        answer: खाना बाँटते हैं
        why: बाँटने से दोस्ती बढ़ती है।
      ways:
      - style: step_by_step
        teach: 'आज दोस्त के लिए एक अच्छा काम करो। पहला: सोचो, आज दोस्त को किस चीज़ की ज़रूरत है। दूसरा: पूछो, ''क्या मैं मदद करूँ?'' तीसरा: मदद करो। चौथा: बदले में कुछ मत माँगो।'
      - style: real_world
        teach: कोई बच्चा बीमार होकर कुछ दिन स्कूल न आए, तो उसके दोस्त उसके लिए कक्षा का काम लिखकर रख लेते हैं।
    - teach: मिलकर काम करने से भारी काम भी आसान हो जाता है। एक दोस्त अकेले भारी डिब्बा नहीं उठा सकता, पर तीन मिलकर उठा लेते हैं।
      check:
        prompt: भारी डिब्बा उठाना है। सबसे आसान तरीका क्या है?
        options:
        - दोस्तों के साथ मिलकर उठाना
        - अकेले खींचना
        - छोड़ देना
        answer: दोस्तों के साथ मिलकर उठाना
        why: कई हाथ मिलकर भार बाँट लेते हैं।
      ways:
      - style: visual
        teach: अकेले काम करना और मिलकर काम करना, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: अकेले
            points:
            - भारी चटाई उठाना मुश्किल
            - पूरा कमरा साफ़ करने में बहुत देर
            - बड़ी पहेली अधूरी रह जाती है
          - title: मिलकर
            points:
            - दो लोग आसानी से उठा लेते हैं
            - कुछ ही मिनट में कमरा साफ़
            - सब मिलकर जल्दी पूरी कर लेते हैं
          alt: अकेले भारी चटाई उठाना मुश्किल है, कमरा साफ़ करने में देर लगती है और बड़ी पहेली अधूरी रह जाती है। मिलकर ये सब काम आसानी से और जल्दी हो जाते हैं।
      - style: real_world
        teach: रस्साकशी के खेल में एक टीम के सब बच्चे मिलकर रस्सी खींचते हैं। अकेला बच्चा पूरी टीम से कभी नहीं जीत सकता।
    - teach: '''दोस्त'' के दूसरे शब्द: मित्र, साथी, सखा। ''दोस्त'' से ''दोस्ती'' बनता है। दोस्ती का उलटा दुश्मनी है।'
      check:
        prompt: '''साथी'' का अर्थ क्या है?'
        options:
        - दोस्त
        - दुश्मन
        - पड़ोसी का घर
        answer: दोस्त
        why: साथ रहने वाला साथी, यानी दोस्त।
      ways:
      - style: visual
        teach: कुछ और शब्द, और उनके जैसा अर्थ रखने वाले शब्द।
        picture:
          kind: compare
          columns:
          - title: शब्द
            points:
            - सूरज
            - पेड़
            - आँख
          - title: वही अर्थ
            points:
            - सूर्य
            - वृक्ष
            - नयन
          alt: सूरज को सूर्य, पेड़ को वृक्ष, और आँख को नयन भी कहते हैं।
      - style: step_by_step
        teach: 'एक शब्द से नया शब्द बनाओ। पहला: शब्द लो: ''अच्छा''। दूसरा: उसके अंत में ''ई'' की आवाज़ जोड़ो। तीसरा: बना ''अच्छाई''। चौथा: ऐसे ही ''बुरा'' से ''बुराई'' बनाकर देखो।'
  items:
  - prompt: कहानी में कितने दोस्त हैं?
    options:
    - तीन
    - दो
    - चार
    - एक
    answer: तीन
    difficulty: 1
    hints:
    - पाठ का नाम देखो।
    - 3।
    solution: कहानी में तीन दोस्त हैं।
    mistakes:
      दो: hin2_read_again
  - prompt: सच्चा दोस्त मुश्किल में क्या करता है?
    options:
    - मदद करता है
    - भाग जाता है
    - हँसता है
    - छिप जाता है
    answer: मदद करता है
    difficulty: 1
    hints:
    - दोस्ती का मतलब।
    - साथ देना।
    solution: सच्चा दोस्त मदद करता है।
    mistakes: {"भाग जाता है": "h1_saathi", "हँसता है": "h1_saathi", "छिप जाता है": "h1_saathi"}
  - prompt: मिलकर काम करने से काम कैसा होता है?
    options:
    - आसान
    - मुश्किल
    - बंद
    - गंदा
    answer: आसान
    difficulty: 1
    hints:
    - कई हाथ।
    - जल्दी होता है।
    solution: मिलकर काम आसान होता है।
    mistakes: {"मुश्किल": "h1_saath", "बंद": "h1_saath", "गंदा": "h1_saath"}
  - prompt: '''दोस्त'' का दूसरा शब्द क्या है?'
    options:
    - मित्र
    - शत्रु
    - मास्टर
    - मेहमान
    answer: मित्र
    difficulty: 2
    hints:
    - म से शुरू।
    - साथी।
    solution: दोस्त को मित्र भी कहते हैं।
    mistakes:
      शत्रु: hin2_word
  - prompt: '''दोस्ती'' का उलटा क्या है?'
    options:
    - दुश्मनी
    - मित्रता
    - प्यार
    - मदद
    answer: दुश्मनी
    difficulty: 2
    hints:
    - दोस्त नहीं।
    - झगड़े वाला रिश्ता।
    solution: दोस्ती का उलटा दुश्मनी है।
    mistakes: {"मित्रता": "h1_ulta", "प्यार": "h1_ulta", "मदद": "h1_ulta"}
  - prompt: 'दोस्त के पास टिफ़िन न हो तो हम:'
    options:
    - अपना खाना बाँटें
    - उसे चिढ़ाएँ
    - अकेले खाएँ
    - उसे भगा दें
    answer: अपना खाना बाँटें
    difficulty: 1
    hints:
    - बाँटना अच्छा है।
    - दोस्ती।
    solution: हम अपना खाना बाँट सकते हैं।
    mistakes: {"उसे चिढ़ाएँ": "h1_baant", "अकेले खाएँ": "h1_baant", "उसे भगा दें": "h1_baant"}
  - prompt: '''मित्र'' का अर्थ क्या है?'
    options:
    - दोस्त
    - शिक्षक
    - भाई
    answer: दोस्त
    difficulty: 1
    hints:
    - जिसके साथ खेलते हैं।
    - इस पाठ का नाम देखो।
    solution: 'चरण 1: मित्र साथ खेलने-रहने वाला होता है। चरण 2: मित्र = दोस्त।'
    mistakes:
      शिक्षक: c2h8_shabd
      भाई: c2h8_shabd
  - prompt: दोस्त की पेंसिल टूट गई। हम क्या करें?
    options:
    - अपनी एक पेंसिल दे दें
    - हँसें
    - शिक्षक से शिकायत करें
    answer: अपनी एक पेंसिल दे दें
    difficulty: 1
    hints:
    - दोस्त को अभी लिखना है।
    - बाँटना दोस्ती है।
    solution: 'चरण 1: दोस्त के पास पेंसिल नहीं। चरण 2: हम अपनी पेंसिल दें।'
    mistakes:
      हँसें: c2h8_dost
      शिक्षक से शिकायत करें: c2h8_dost
  - prompt: तीन दोस्त और दो नए दोस्त आ गए। अब कितने दोस्त?
    options:
    - पाँच
    - तीन
    - चार
    answer: पाँच
    difficulty: 1
    hints:
    - तीन से आगे दो और गिनो।
    - चार, फिर ...?
    solution: 'चरण 1: 3 दोस्त। चरण 2: 3 + 2 = 5 दोस्त।'
    mistakes:
      तीन: c2h8_ginti
      चार: c2h8_ginti
  - prompt: दोस्त खेल में गिरकर रो रहा है। क्या करें?
    options:
    - उठाकर पूछें कि चोट तो नहीं लगी
    - खेलते रहें
    - उसे चिढ़ाएँ
    answer: उठाकर पूछें कि चोट तो नहीं लगी
    difficulty: 1
    hints:
    - दोस्त को अभी मदद चाहिए।
    - तुम गिरो तो क्या चाहोगे?
    solution: 'चरण 1: दोस्त को चोट लगी हो सकती है। चरण 2: उठाओ और पूछो।'
    mistakes:
      खेलते रहें: c2h8_dost
      उसे चिढ़ाएँ: c2h8_dost
  - prompt: '''दोस्त'' से कौन-सा शब्द बनता है?'
    options:
    - दोस्ती
    - दस्तक
    - दौड़
    answer: दोस्ती
    difficulty: 1
    hints:
    - अंत में 'ई' जोड़ो।
    - दो दोस्तों का रिश्ता।
    solution: 'चरण 1: दोस्त + ई। चरण 2: दोस्ती।'
    mistakes:
      दस्तक: c2h8_shabd
      दौड़: c2h8_shabd
  - prompt: दो दोस्तों में झगड़ा हो गया। अच्छा तरीका क्या है?
    options:
    - बात करके 'माफ़ करना' कहें
    - हमेशा के लिए बात बंद करें
    - मारपीट करें
    answer: बात करके 'माफ़ करना' कहें
    difficulty: 2
    hints:
    - झगड़ा बातचीत से सुलझता है।
    - दोस्ती बचानी है।
    solution: 'चरण 1: झगड़े से दोनों दुखी होते हैं। चरण 2: बात करो और माफ़ी माँगो।'
    mistakes:
      हमेशा के लिए बात बंद करें: c2h8_dost
      मारपीट करें: c2h8_dost
  - prompt: तीन दोस्तों के पास 6 लड्डू हैं। सब बराबर बाँटें तो हर एक को कितने?
    options:
    - दो
    - तीन
    - छह
    answer: दो
    difficulty: 2
    hints:
    - 'एक-एक करके बाँटो: पहला, दूसरा, तीसरा, फिर दोबारा।'
    - 6 लड्डू, 3 दोस्त।
    solution: 'चरण 1: पहले चक्कर में सबको 1-1 (3 गए)। चरण 2: दूसरे चक्कर में 1-1 और: हर एक को 2।'
    mistakes:
      तीन: c2h8_ginti
      छह: c2h8_ginti
  - prompt: '''सखा'' किसका दूसरा नाम है?'
    options:
    - दोस्त
    - पेड़
    - घर
    answer: दोस्त
    difficulty: 2
    hints:
    - कृष्ण और सुदामा की कहानी याद करो।
    - साथ रहने और खेलने वाला।
    solution: 'चरण 1: सखा साथ देने वाला होता है। चरण 2: सखा = दोस्त।'
    mistakes:
      पेड़: c2h8_shabd
      घर: c2h8_shabd
  - prompt: एक दोस्त लंबा है, एक तेज़ दौड़ता है, एक गाना गाता है। मिलकर रहने से क्या होता है?
    options:
    - सब एक-दूसरे की कमी पूरी करते हैं
    - सब एक जैसे बन जाते हैं
    - कोई काम नहीं होता
    answer: सब एक-दूसरे की कमी पूरी करते हैं
    difficulty: 3
    hints:
    - हर दोस्त कुछ अलग अच्छा करता है।
    - ऊँचा फल कौन तोड़ेगा? दौड़कर कौन बुलाएगा?
    solution: 'चरण 1: हर दोस्त की अपनी खूबी है। चरण 2: मिलकर वे हर काम कर लेते हैं।'
    mistakes:
      सब एक जैसे बन जाते हैं: c2h8_dost
      कोई काम नहीं होता: c2h8_dost
  - prompt: 'स्थिति (केस): खेल के समय दो दोस्त एक ही झूले के लिए झगड़ने लगे। तीसरा दोस्त बीच में आया। सबसे अच्छा सुझाव क्या है?'
    options:
    - बारी-बारी से झूलना
    - जो ज़्यादा ज़ोर से चिल्लाए, वही झूले
    - झूला छोड़कर घर चले जाना
    answer: बारी-बारी से झूलना
    hints:
    - झगड़ा क्यों हो रहा है?
    - कौन-सा तरीका दोनों दोस्तों के लिए ठीक है?
    solution: बारी-बारी से झूलने पर दोनों को मौका मिलता है और दोस्ती बनी रहती है।
    mistakes:
