# CBSE Class 2 Hindi (NCERT Sarangi, 2024-25), chapter 8. Format: content/README.md.
# Chapter names and order from the Delhi Directorate of Education Class II Hindi plan 2026-27; story details not checked against the book, kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse2-hin
chapter: 8
title: तीन दोस्त
concepts:
- code: cbse2h.08.teen
  title: तीन दोस्त
  notes: |
    तीन दोस्तों की कहानी: मिलकर रहना, एक-दूसरे की मदद करना, बाँटना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कहानी तीन दोस्तों की है। सच्चे दोस्त मिलकर रहते हैं, मुश्किल में मदद करते हैं और चीज़ें बाँटते हैं।
    visual: 'चित्र बनाओ: तीन दोस्त हाथ पकड़े खड़े हैं और एक-दूसरे की मदद कर रहे हैं।'
    step_by_step: 1. कहानी पढ़ो। 2. तीनों दोस्त कौन हैं? 3. उन्होंने एक-दूसरे की मदद कैसे की? 4. दोस्ती से क्या सीखा?
    real_world: जब दोस्त का पेंसिल खो जाए तो हम अपनी पेंसिल बाँट सकते हैं।
  picture:
    kind: flow
    steps:
    - मुश्किल आई
    - दोस्तों ने सोचा
    - मिलकर मदद की
    - सब खुश
    alt: मुश्किल आई, दोस्तों ने सोचा, मिलकर मदद की और सब खुश हो गए।
  items:
  - prompt: कहानी में कितने दोस्त हैं?
    options:
    - तीन
    - दो
    - चार
    - एक
    answer: तीन
    difficulty: 1
    hints:
    - पाठ का नाम देखो।
    - 3।
    solution: कहानी में तीन दोस्त हैं।
    mistakes:
      दो: hin2_read_again
  - prompt: सच्चा दोस्त मुश्किल में क्या करता है?
    options:
    - मदद करता है
    - भाग जाता है
    - हँसता है
    - छिप जाता है
    answer: मदद करता है
    difficulty: 1
    hints:
    - दोस्ती का मतलब।
    - साथ देना।
    solution: सच्चा दोस्त मदद करता है।
    mistakes: {"भाग जाता है": "h1_saathi", "हँसता है": "h1_saathi", "छिप जाता है": "h1_saathi"}
  - prompt: मिलकर काम करने से काम कैसा होता है?
    options:
    - आसान
    - मुश्किल
    - बंद
    - गंदा
    answer: आसान
    difficulty: 1
    hints:
    - कई हाथ।
    - जल्दी होता है।
    solution: मिलकर काम आसान होता है।
    mistakes: {"मुश्किल": "h1_saath", "बंद": "h1_saath", "गंदा": "h1_saath"}
  - prompt: '''दोस्त'' का दूसरा शब्द क्या है?'
    options:
    - मित्र
    - शत्रु
    - मास्टर
    - मेहमान
    answer: मित्र
    difficulty: 2
    hints:
    - म से शुरू।
    - साथी।
    solution: दोस्त को मित्र भी कहते हैं।
    mistakes:
      शत्रु: hin2_word
  - prompt: '''दोस्ती'' का उलटा क्या है?'
    options:
    - दुश्मनी
    - मित्रता
    - प्यार
    - मदद
    answer: दुश्मनी
    difficulty: 2
    hints:
    - दोस्त नहीं।
    - झगड़े वाला रिश्ता।
    solution: दोस्ती का उलटा दुश्मनी है।
    mistakes: {"मित्रता": "h1_ulta", "प्यार": "h1_ulta", "मदद": "h1_ulta"}
  - prompt: 'दोस्त के पास टिफ़िन न हो तो हम:'
    options:
    - अपना खाना बाँटें
    - उसे चिढ़ाएँ
    - अकेले खाएँ
    - उसे भगा दें
    answer: अपना खाना बाँटें
    difficulty: 1
    hints:
    - बाँटना अच्छा है।
    - दोस्ती।
    solution: हम अपना खाना बाँट सकते हैं।
    mistakes: {"उसे चिढ़ाएँ": "h1_baant", "अकेले खाएँ": "h1_baant", "उसे भगा दें": "h1_baant"}
