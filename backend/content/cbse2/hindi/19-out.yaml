# CBSE Class 2 Hindi (NCERT Sarangi, 2024-25), chapter 19. Format: content/README.md.
# Chapter names and order from the Delhi Directorate of Education Class II Hindi plan 2026-27; story details not checked against the book, kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse2-hin
chapter: 19
title: आउट
concepts:
- code: cbse2h.19.out
  title: आउट
  notes: |
    खेल पर पाठ, शीर्षक 'आउट': खेल में आउट होना, हार-जीत, खेल भावना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: खेल में कभी हम आउट होते हैं, कभी जीतते हैं। अच्छा खिलाड़ी आउट होने पर रोता या झगड़ता नहीं, बल्कि अगली बार और अच्छा खेलता है।
    visual: 'चित्र बनाओ: बच्चे गली में क्रिकेट खेल रहे हैं, गेंद विकेट को लगी है।'
    step_by_step: 1. पाठ पढ़ो। 2. कौन-सा खेल हुआ? 3. कौन आउट हुआ? 4. आउट होने पर कैसे बर्ताव करना चाहिए?
    real_world: क्रिकेट में गेंद विकेट को लगे तो बल्लेबाज़ आउट होता है।
  picture:
    kind: flow
    steps:
    - खेल शुरू
    - कोई आउट हुआ
    - हाथ मिलाया
    - फिर से खेले
    alt: खेल शुरू हुआ, कोई आउट हुआ, हाथ मिलाया और फिर से खेले।
  items:
  - prompt: आउट होने पर हमें क्या करना चाहिए?
    options:
    - मुस्कुराकर अगली बारी का इंतज़ार
    - झगड़ा करना
    - बल्ला फेंक देना
    - रोते रहना
    answer: मुस्कुराकर अगली बारी का इंतज़ार
    difficulty: 1
    hints:
    - खेल भावना।
    - अच्छा खिलाड़ी।
    solution: मुस्कुराकर अगली बारी का इंतज़ार करना चाहिए।
  - prompt: क्रिकेट में किस चीज़ से गेंद मारते हैं?
    options:
    - बल्ले से
    - हाथ से
    - सिर से
    - जाल से
    answer: बल्ले से
    difficulty: 1
    hints:
    - लकड़ी का।
    - ब से शुरू।
    solution: बल्ले से गेंद मारते हैं।
  - prompt: खेल खेलने से क्या होता है?
    options:
    - शरीर मज़बूत होता है
    - बीमारी आती है
    - नींद नहीं आती
    - कुछ नहीं
    answer: शरीर मज़बूत होता है
    difficulty: 1
    hints:
    - दौड़-भाग।
    - सेहत।
    solution: खेलने से शरीर मज़बूत होता है।
  - prompt: '''जीत'' का उलटा क्या है?'
    options:
    - हार
    - खेल
    - गेंद
    - दौड़
    answer: हार
    difficulty: 1
    hints:
    - जो जीते नहीं।
    - ह से शुरू।
    solution: जीत का उलटा हार है।
  - prompt: '''आउट'' शब्द किस भाषा से आया है?'
    options:
    - अंग्रेज़ी
    - मलयालम
    - तमिल
    - बांग्ला
    answer: अंग्रेज़ी
    difficulty: 2
    hints:
    - Out।
    - खेल का शब्द।
    solution: '''आउट'' अंग्रेज़ी शब्द है।'
    mistakes:
      मलयालम: hin2_word
  - prompt: 'खेल में नियम मानना:'
    options:
    - ज़रूरी है
    - बेकार है
    - गलत है
    - मज़ाक है
    answer: ज़रूरी है
    difficulty: 2
    hints:
    - सबके लिए बराबर।
    - ईमानदारी।
    solution: खेल में नियम मानना ज़रूरी है।
