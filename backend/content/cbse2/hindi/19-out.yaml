subject: cbse2-hin
chapter: 19
title: आउट
tips:
  h2_cricket: "क्रिकेट में गेंद मारने वाले खिलाड़ी के हाथ में लकड़ी का कौन-सा सामान होता है?"
  h2_khel_bhavna: "खेल में हार-जीत होती रहती है। अगली बारी में अच्छा खेलने के लिए अभी कैसा रहना ठीक है?"
  h2_khel_labh: "खेलने के बाद भूख और नींद अच्छी आती है, और दौड़ने से हाथ-पैर...?"
  h2_niyam: "अगर हर कोई अपने नियम बनाए तो खेल का क्या होगा?"
  c2h19_bhavna: सोचो, खेल में सब खुश रहें, इसके लिए कैसा बर्ताव ठीक है?
  c2h19_khel: 'उस खेल को मैदान में होते हुए सोचो: कौन क्या पकड़ता या चलाता है?'
  c2h19_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। अर्थ ठीक बैठता है?

concepts:
- code: cbse2h.19.out
  title: आउट
  notes: |
    खेल पर पाठ, शीर्षक 'आउट': खेल में आउट होना, हार-जीत, खेल भावना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: खेल में कभी हम आउट होते हैं, कभी जीतते हैं। अच्छा खिलाड़ी आउट होने पर रोता या झगड़ता नहीं, बल्कि अगली बार और अच्छा खेलता है।
    visual: 'चित्र बनाओ: बच्चे गली में क्रिकेट खेल रहे हैं, गेंद विकेट को लगी है।'
    step_by_step: 1. पाठ पढ़ो। 2. कौन-सा खेल हुआ? 3. कौन आउट हुआ? 4. आउट होने पर कैसे बर्ताव करना चाहिए?
    real_world: क्रिकेट में गेंद विकेट को लगे तो बल्लेबाज़ आउट होता है।
  picture:
    kind: flow
    steps:
    - खेल शुरू
    - कोई आउट हुआ
    - हाथ मिलाया
    - फिर से खेले
    alt: खेल शुरू हुआ, कोई आउट हुआ, हाथ मिलाया और फिर से खेले।
  activity:
    type: sort
    prompt: खेल भावना वाला व्यवहार कौन-सा है?
    bins:
    - खेल भावना
    - खेल भावना नहीं
    items:
    - label: 🙂 आउट होकर बाहर आना
      bin: खेल भावना
      clue: नियम मानना?
      why: नियम मानना खेल भावना है।
    - label: 👏 जीतने वाले को ताली
      bin: खेल भावना
      clue: दूसरी टीम जीते तो?
      why: जीत का सम्मान।
    - label: 😠 आउट होकर भी न जाना
      bin: खेल भावना नहीं
      clue: क्या यह नियम मानना है?
      why: नियम तोड़ना।
    - label: 🏏 हारकर बल्ला फेंकना
      bin: खेल भावना नहीं
      clue: हार पर ग़ुस्सा?
      why: हार-जीत खेल का हिस्सा।
  lesson:
    - teach: खेल में कभी हम आउट होते हैं, कभी जीतते हैं, कभी हारते हैं। आउट होने पर गुस्सा नहीं करते। मुस्कुराकर बाहर आते हैं और अगली बारी का इंतज़ार करते हैं। इसे खेल भावना कहते हैं।
      check:
        prompt: दोस्त की टीम जीत गई। अच्छी खेल भावना क्या है?
        options:
        - उन्हें बधाई देना
        - गेंद लेकर घर चले जाना
        - उन्हें चिढ़ाना
        answer: उन्हें बधाई देना
        why: हार में भी जीतने वाले को बधाई देना खेल भावना है।
      ways:
      - style: visual
        teach: अच्छी खेल भावना और बुरी खेल भावना, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: अच्छी खेल भावना
            points:
            - हारने पर भी हाथ मिलाना
            - दूसरी टीम की तारीफ़ करना
          - title: बुरी खेल भावना
            points:
            - आउट होने पर बल्ला फेंकना
            - जीतकर दूसरों को चिढ़ाना
          alt: हारने पर भी हाथ मिलाना और दूसरी टीम की तारीफ़ करना अच्छी खेल भावना है। आउट होने पर बल्ला फेंकना और जीतकर चिढ़ाना बुरी खेल भावना है।
      - style: real_world
        teach: बड़े मैचों के बाद दोनों टीमों के खिलाड़ी एक-दूसरे से हाथ मिलाते हैं, चाहे कोई भी टीम जीती हो।
    - teach: हर खेल के नियम होते हैं। नियम मानने से खेल ठीक और मज़ेदार होता है। बारी-बारी से खेलना, धोखा न देना और सबको मौका देना ज़रूरी है।
      check:
        prompt: खेल में नियम क्यों ज़रूरी हैं?
        options:
        - ताकि सब ठीक से और बराबर खेलें
        - ताकि खेल बोरिंग हो
        - ताकि झगड़ा हो
        answer: ताकि सब ठीक से और बराबर खेलें
        why: नियम सबके लिए एक जैसे होते हैं, इसलिए खेल ठीक चलता है।
      ways:
      - style: visual
        teach: दोस्तों के साथ कोई खेल ठीक से शुरू करने के कदम।
        picture:
          kind: flow
          steps:
          - सब मिलकर नियम तय करो
          - टीमें बराबर बाँटो
          - सिक्का उछालकर तय करो कि पहले कौन खेलेगा
          - खेलो और नियम मानो
          - खेल के बाद सामान वापस रखो
          alt: सब मिलकर नियम तय करो, टीमें बराबर बाँटो, सिक्का उछालकर पहली बारी तय करो, नियम मानकर खेलो, और बाद में सामान वापस रखो।
      - style: real_world
        teach: स्कूल की खेल प्रतियोगिता में एक रेफ़री होता है, जो देखता है कि सब खिलाड़ी नियम मानें।
    - teach: 'खेल: क्रिकेट (बल्ला-गेंद), फ़ुटबॉल (पैर से गेंद), कबड्डी, खो-खो, बैडमिंटन (रैकेट-चिड़िया)। खेलने से शरीर मज़बूत होता है। ''आउट'' अंग्रेज़ी शब्द है जो हिंदी में भी बोलते हैं।'
      picture:
        kind: compare
        columns:
        - title: खेल
          points:
          - क्रिकेट
          - फ़ुटबॉल
          - बैडमिंटन
        - title: सामान
          points:
          - बल्ला और गेंद
          - गेंद (पैर से)
          - रैकेट और चिड़िया
        alt: खेल और उनका सामान।
      check:
        prompt: फ़ुटबॉल में गेंद को किससे मारते हैं?
        options:
        - पैर से
        - बल्ले से
        - रैकेट से
        answer: पैर से
        why: फ़ुटबॉल पैर से खेला जाता है।
      ways:
      - style: step_by_step
        teach: 'खेल और उसका सामान मिलाओ। पहला: खेल का नाम सोचो: टेबल टेनिस। दूसरा: क्या चाहिए? छोटा बल्ला और हल्की गेंद। तीसरा: अगला खेल सोचो: हॉकी। चौथा: उसमें मुड़ी हुई स्टिक और गेंद चाहिए।'
      - style: real_world
        teach: कबड्डी भारत का पुराना खेल है, जिसे गाँव-शहर हर जगह बिना किसी महँगे सामान के खेला जाता है।
  items:
