subject: cbse2-hin
chapter: 19
title: आउट
tips:
  h2_cricket: "क्रिकेट में गेंद मारने वाले खिलाड़ी के हाथ में लकड़ी का कौन-सा सामान होता है?"
  h2_khel_bhavna: "खेल में हार-जीत होती रहती है। अगली बारी में अच्छा खेलने के लिए अभी कैसा रहना ठीक है?"
  h2_khel_labh: "खेलने के बाद भूख और नींद अच्छी आती है, और दौड़ने से हाथ-पैर...?"
  h2_niyam: "अगर हर कोई अपने नियम बनाए तो खेल का क्या होगा?"

concepts:
- code: cbse2h.19.out
  title: आउट
  notes: |
    खेल पर पाठ, शीर्षक 'आउट': खेल में आउट होना, हार-जीत, खेल भावना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: खेल में कभी हम आउट होते हैं, कभी जीतते हैं। अच्छा खिलाड़ी आउट होने पर रोता या झगड़ता नहीं, बल्कि अगली बार और अच्छा खेलता है।
    visual: 'चित्र बनाओ: बच्चे गली में क्रिकेट खेल रहे हैं, गेंद विकेट को लगी है।'
    step_by_step: 1. पाठ पढ़ो। 2. कौन-सा खेल हुआ? 3. कौन आउट हुआ? 4. आउट होने पर कैसे बर्ताव करना चाहिए?
    real_world: क्रिकेट में गेंद विकेट को लगे तो बल्लेबाज़ आउट होता है।
  picture:
    kind: flow
    steps:
    - खेल शुरू
    - कोई आउट हुआ
    - हाथ मिलाया
    - फिर से खेले
    alt: खेल शुरू हुआ, कोई आउट हुआ, हाथ मिलाया और फिर से खेले।
  activity:
    type: sort
    prompt: खेल भावना वाला व्यवहार कौन-सा है?
    bins:
    - खेल भावना
    - खेल भावना नहीं
    items:
    - label: 🙂 आउट होकर बाहर आना
      bin: खेल भावना
      clue: नियम मानना?
      why: नियम मानना खेल भावना है।
    - label: 👏 जीतने वाले को ताली
