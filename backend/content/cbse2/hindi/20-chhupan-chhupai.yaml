subject: cbse2-hin
chapter: 20
title: छुपन-छुपाई
tips:
  h2_chhupan: "बाकी बच्चों को छिपने का समय चाहिए। ढूँढने वाला तब तक न देखे, इसके लिए वह क्या करता है?"
  h2_khel_naam: "कबड्डी और खो-खो में दौड़कर छूते हैं, शतरंज बोर्ड पर खेलते हैं। किसमें 'छिपना' छिपा है?"

concepts:
- code: cbse2h.20.chhupan
  title: छुपन-छुपाई
  notes: |
    छुपन-छुपाई (लुका-छिपी) खेल पर कविता/पाठ: गिनती गिनना, छिपना, ढूँढना, सुरक्षित जगह छिपना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: छुपन-छुपाई में एक बच्चा आँखें बंद करके गिनती गिनता है और बाकी छिप जाते हैं। फिर वह सबको ढूँढता है। सुरक्षित जगह पर ही छिपना चाहिए।
    visual: 'चित्र बनाओ: एक बच्चा पेड़ पर आँखें ढककर गिन रहा है, बाकी परदे और झाड़ी के पीछे छिपे हैं।'
    step_by_step: 1. पाठ पढ़ो। 2. खेल कैसे खेलते हैं? 3. कौन ढूँढता है? 4. कहाँ नहीं छिपना चाहिए?
    real_world: इस खेल को कई जगह 'लुका-छिपी' या 'आइस-पाइस' भी कहते हैं।
  picture:
    kind: flow
    steps:
    - आँखें बंद
    - गिनती 1 से 10
    - सब छिपे
    - ढूँढना शुरू
    alt: आँखें बंद, एक से दस तक गिनती, सब छिपे, और ढूँढना शुरू।
  items:
  - prompt: छुपन-छुपाई में ढूँढने वाला पहले क्या करता है?
    options:
    - आँखें बंद करके गिनता है
    - सो जाता है
    - घर चला जाता है
    - खाना खाता है
    answer: आँखें बंद करके गिनता है
    difficulty: 1
    hints:
    - बाकी को छिपने का समय।
    - 1, 2, 3...
    solution: वह आँखें बंद करके गिनता है।
    mistakes: {"सो जाता है": "h2_chhupan", "घर चला जाता है": "h2_chhupan", "खाना खाता है": "h2_chhupan"}
  - prompt: कहाँ छिपना ठीक नहीं है?
    options:
    - बंद अलमारी या डिब्बे में
    - परदे के पीछे
    - पेड़ के पीछे
    - दरवाज़े के पीछे
    answer: बंद अलमारी या डिब्बे में
    difficulty: 2
    hints:
    - साँस लेने में दिक्कत।
    - बंद होकर फँस सकते हैं।
    solution: बंद अलमारी या डिब्बे में छिपना खतरनाक है।
    mistakes: {"परदे के पीछे": "h1_suraksha", "पेड़ के पीछे": "h1_suraksha", "दरवाज़े के पीछे": "h1_suraksha"}
  - prompt: इस खेल का दूसरा नाम क्या है?
    options:
    - लुका-छिपी
    - कबड्डी
    - खो-खो
    - शतरंज
    answer: लुका-छिपी
    difficulty: 1
    hints:
    - छिपना वाला खेल।
    - ल से शुरू।
    solution: छुपन-छुपाई को लुका-छिपी भी कहते हैं।
    mistakes: {"कबड्डी": "h2_khel_naam", "खो-खो": "h2_khel_naam", "शतरंज": "h2_khel_naam"}
  - prompt: '''छिपना'' का उलटा क्या है?'
    options:
    - दिखना
    - सोना
    - खेलना
    - गिनना
    answer: दिखना
    difficulty: 2
    hints:
    - सामने आना।
    - नज़र आना।
    solution: छिपना का उलटा दिखना है।
    mistakes:
      खेलना: hin2_word
  - prompt: पाँच के बाद कौन-सी गिनती आती है?
    options:
    - छह
    - चार
    - आठ
    - तीन
    answer: छह
    difficulty: 1
    hints:
    - एक, दो, तीन, चार, पाँच ...
    - एक आगे।
    solution: पाँच के बाद छह आती है।
    mistakes: {"चार": "h1_ginti", "आठ": "h1_ginti", "तीन": "h1_ginti"}
  - prompt: खेल में बारी-बारी से ढूँढना क्यों अच्छा है?
    options:
    - सबको मौका मिलता है
    - खेल खत्म हो जाता है
    - कोई नहीं खेलता
    - झगड़ा होता है
    answer: सबको मौका मिलता है
    difficulty: 1
    hints:
    - बराबरी।
    - सबकी बारी।
    solution: बारी-बारी से सबको मौका मिलता है।
    mistakes: {"खेल खत्म हो जाता है": "h1_baari", "कोई नहीं खेलता": "h1_baari", "झगड़ा होता है": "h1_baari"}
