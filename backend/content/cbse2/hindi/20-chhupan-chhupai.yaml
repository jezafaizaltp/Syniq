subject: cbse2-hin
chapter: 20
title: छुपन-छुपाई
tips:
  h2_chhupan: "बाकी बच्चों को छिपने का समय चाहिए। ढूँढने वाला तब तक न देखे, इसके लिए वह क्या करता है?"
  h2_khel_naam: "कबड्डी और खो-खो में दौड़कर छूते हैं, शतरंज बोर्ड पर खेलते हैं। किसमें 'छिपना' छिपा है?"
  c2h20_suraksha: सोचो, कहाँ छिपने से साँस लेने या बाहर निकलने में मुश्किल हो सकती है?
  c2h20_ginti: उँगलियों पर आगे गिनते जाओ।
  c2h20_khel: 'खेल को खेलते हुए सोचो: ढूँढने वाला क्या करता है, छिपने वाले क्या?'

concepts:
- code: cbse2h.20.chhupan
  title: छुपन-छुपाई
  notes: |
    छुपन-छुपाई (लुका-छिपी) खेल पर कविता/पाठ: गिनती गिनना, छिपना, ढूँढना, सुरक्षित जगह छिपना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: छुपन-छुपाई में एक बच्चा आँखें बंद करके गिनती गिनता है और बाकी छिप जाते हैं। फिर वह सबको ढूँढता है। सुरक्षित जगह पर ही छिपना चाहिए।
    visual: 'चित्र बनाओ: एक बच्चा पेड़ पर आँखें ढककर गिन रहा है, बाकी परदे और झाड़ी के पीछे छिपे हैं।'
    step_by_step: 1. पाठ पढ़ो। 2. खेल कैसे खेलते हैं? 3. कौन ढूँढता है? 4. कहाँ नहीं छिपना चाहिए?
    real_world: इस खेल को कई जगह 'लुका-छिपी' या 'आइस-पाइस' भी कहते हैं।
  picture:
    kind: flow
    steps:
    - आँखें बंद
    - गिनती 1 से 10
    - सब छिपे
    - ढूँढना शुरू
    alt: आँखें बंद, एक से दस तक गिनती, सब छिपे, और ढूँढना शुरू।
  activity:
    type: order
    prompt: छुपन-छुपाई कैसे खेलते हैं? क्रम से लगाओ।
    steps:
    - 🙈 एक बच्चा आँखें बंद कर गिनती गिनता है
    - 🏃 बाकी सब छिपते हैं
    - 🔍 गिनती पूरी, ढूँढ़ना शुरू
    - 🙋 जो मिल जाए, उसकी बारी
    reasons:
      🏃 बाकी सब छिपते हैं: गिनती के समय ही बाकी छिपते हैं।
      🔍 गिनती पूरी, ढूँढ़ना शुरू: सब छिप जाएँ, तब ढूँढ़ते हैं।
      🙋 जो मिल जाए, उसकी बारी: ढूँढ़ने के बाद नई बारी।
  lesson:
    - teach: छुपन-छुपाई (लुका-छिपी) में एक बच्चा ढूँढता है। वह आँखें बंद करके गिनती गिनता है, जैसे एक से बीस तक। बाकी बच्चे छिप जाते हैं। फिर ढूँढने वाला सबको ढूँढता है।
      picture:
        kind: flow
        steps:
        - आँखें बंद, गिनती
        - बाकी छिपते हैं
        - '''तैयार? ढूँढना शुरू!'''
        - सबको ढूँढना
        alt: छुपन-छुपाई खेल के चरण।
      check:
        prompt: ढूँढने वाला आँखें बंद करके क्या करता है?
        options:
        - गिनती गिनता है
        - गाना गाता है
        - सो जाता है
        answer: गिनती गिनता है
        why: गिनती से बाकी बच्चों को छिपने का समय मिलता है।
      ways:
      - style: step_by_step
        teach: 'तय करो कि कौन ढूँढेगा। पहला: सब गोल घेरे में खड़े हो जाओ। दूसरा: एक बच्चा कविता बोलते हुए हर एक पर बारी-बारी उँगली रखे। तीसरा: कविता जिस पर ख़त्म हो, वह घेरे से बाहर। चौथा: आख़िर में जो बचे, वह ढूँढने वाला बने।'
      - style: real_world
        teach: दुनिया भर में बच्चे यह खेल खेलते हैं। अंग्रेज़ी में इसे 'हाइड एंड सीक' कहते हैं।
    - teach: 'सुरक्षित जगह छिपना ज़रूरी है: परदे के पीछे, पेड़ के पीछे, दरवाज़े की ओट में। बंद अलमारी, संदूक, गाड़ी या पानी की टंकी में कभी नहीं छिपते, वहाँ साँस रुक सकती है।'
      picture:
        kind: compare
        columns:
        - title: ठीक जगह
          points:
          - परदे के पीछे
          - पेड़ के पीछे
        - title: खतरनाक जगह
          points:
          - बंद अलमारी या संदूक
          - खड़ी गाड़ी के अंदर
        alt: छिपने की सुरक्षित और खतरनाक जगहें।
      check:
        prompt: इनमें से कहाँ छिपना सुरक्षित है?
        options:
        - पेड़ के पीछे
        - बंद संदूक में
        - खड़ी गाड़ी के अंदर
        answer: पेड़ के पीछे
        why: पेड़ के पीछे खुली हवा है और आसानी से बाहर आ सकते हैं।
      ways:
      - style: step_by_step
        teach: 'छिपने की सुरक्षित जगह चुनो। पहला: क्या वहाँ से आसानी से बाहर निकल सकते हैं? दूसरा: क्या वहाँ हवा आती है? तीसरा: दोनों का उत्तर ''हाँ'' हो, तभी वहाँ छिपो। चौथा: किसी बड़े को बता दो कि खेल चल रहा है।'
      - style: real_world
        teach: खेल शुरू होने से पहले बड़े अक्सर कुछ जगहें मना कर देते हैं, जैसे छत की मुँडेर, सड़क और खड़ी गाड़ियाँ, ताकि किसी को चोट न लगे।
    - teach: 'उलटे शब्द: छिपना-दिखना, ढूँढना-खोना, आगे-पीछे, अंदर-बाहर। खेल में बारी-बारी से ढूँढने वाला बनते हैं, ताकि सबको मौका मिले।'
      check:
        prompt: '''अंदर'' का उलटा क्या है?'
        options:
        - बाहर
        - ऊपर
        - पास
        answer: बाहर
        why: अंदर और बाहर उलटे हैं।
      ways:
      - style: visual
        teach: खेल से जुड़े कुछ और शब्द, और उनके उलटे शब्द।
        picture:
          kind: compare
          columns:
          - title: शब्द
            points:
            - पास
            - जल्दी
            - शुरू
          - title: उलटा
            points:
            - दूर
            - देर
            - ख़त्म
          alt: पास का उलटा दूर, जल्दी का उलटा देर, और शुरू का उलटा ख़त्म है।
      - style: real_world
        teach: जब हर बार कोई नया बच्चा ढूँढने वाला बनता है, तो किसी को यह नहीं लगता कि उसके साथ ही बार-बार ऐसा होता है।
  items:
  - prompt: छुपन-छुपाई में ढूँढने वाला पहले क्या करता है?
    options:
    - आँखें बंद करके गिनता है
    - सो जाता है
    - घर चला जाता है
    - खाना खाता है
    answer: आँखें बंद करके गिनता है
    difficulty: 1
    hints:
    - बाकी को छिपने का समय।
    - 1, 2, 3...
    solution: वह आँखें बंद करके गिनता है।
    mistakes: {"सो जाता है": "h2_chhupan", "घर चला जाता है": "h2_chhupan", "खाना खाता है": "h2_chhupan"}
  - prompt: कहाँ छिपना ठीक नहीं है?
    options:
    - बंद अलमारी या डिब्बे में
    - परदे के पीछे
    - पेड़ के पीछे
    - दरवाज़े के पीछे
    answer: बंद अलमारी या डिब्बे में
    difficulty: 2
    hints:
    - साँस लेने में दिक्कत।
    - बंद होकर फँस सकते हैं।
    solution: बंद अलमारी या डिब्बे में छिपना खतरनाक है।
    mistakes: {"परदे के पीछे": "h1_suraksha", "पेड़ के पीछे": "h1_suraksha", "दरवाज़े के पीछे": "h1_suraksha"}
  - prompt: इस खेल का दूसरा नाम क्या है?
    options:
    - लुका-छिपी
    - कबड्डी
    - खो-खो
    - शतरंज
    answer: लुका-छिपी
    difficulty: 1
    hints:
    - छिपना वाला खेल।
    - ल से शुरू।
    solution: छुपन-छुपाई को लुका-छिपी भी कहते हैं।
    mistakes: {"कबड्डी": "h2_khel_naam", "खो-खो": "h2_khel_naam", "शतरंज": "h2_khel_naam"}
  - prompt: '''छिपना'' का उलटा क्या है?'
    options:
    - दिखना
    - सोना
    - खेलना
    - गिनना
    answer: दिखना
    difficulty: 2
    hints:
    - सामने आना।
    - नज़र आना।
    solution: छिपना का उलटा दिखना है।
    mistakes:
      खेलना: hin2_word
  - prompt: पाँच के बाद कौन-सी गिनती आती है?
    options:
    - छह
    - चार
    - आठ
    - तीन
    answer: छह
    difficulty: 1
    hints:
    - एक, दो, तीन, चार, पाँच ...
    - एक आगे।
    solution: पाँच के बाद छह आती है।
    mistakes: {"चार": "h1_ginti", "आठ": "h1_ginti", "तीन": "h1_ginti"}
  - prompt: खेल में बारी-बारी से ढूँढना क्यों अच्छा है?
    options:
    - सबको मौका मिलता है
    - खेल खत्म हो जाता है
    - कोई नहीं खेलता
    - झगड़ा होता है
    answer: सबको मौका मिलता है
    difficulty: 1
    hints:
    - बराबरी।
    - सबकी बारी।
    solution: बारी-बारी से सबको मौका मिलता है।
    mistakes: {"खेल खत्म हो जाता है": "h1_baari", "कोई नहीं खेलता": "h1_baari", "झगड़ा होता है": "h1_baari"}
  - prompt: दस के बाद कौन-सी गिनती आती है?
    options:
    - ग्यारह
    - नौ
    - बारह
    answer: ग्यारह
    difficulty: 1
    hints:
    - नौ, दस, ...?
    - दस से एक ज़्यादा।
    solution: 'चरण 1: दस से एक आगे गिनो। चरण 2: ग्यारह।'
    mistakes:
      नौ: c2h20_ginti
      बारह: c2h20_ginti
  - prompt: खेल में कहाँ छिपना खतरनाक है?
    options:
    - बंद अलमारी में
    - परदे के पीछे
    - दरवाज़े की ओट में
    answer: बंद अलमारी में
    difficulty: 1
    hints:
    - कहाँ हवा कम है और दरवाज़ा अंदर से न खुले?
    - दो जगहें खुली हैं।
    solution: 'चरण 1: बंद अलमारी में हवा कम है। चरण 2: वहाँ छिपना खतरनाक है।'
    mistakes:
      परदे के पीछे: c2h20_suraksha
      दरवाज़े की ओट में: c2h20_suraksha
  - prompt: छिपने वाले को पहले कौन ढूँढता है?
    options:
    - जिसकी बारी हो
    - कोई नहीं
    - छिपने वाला खुद
    answer: जिसकी बारी हो
    difficulty: 1
    hints:
    - एक बच्चा गिनती गिनता है।
    - बारी-बारी से सब बनते हैं।
    solution: 'चरण 1: एक बच्चे की बारी होती है। चरण 2: वही ढूँढता है।'
    mistakes:
      कोई नहीं: c2h20_khel
      छिपने वाला खुद: c2h20_khel
  - prompt: '''ढूँढना'' का उलटा क्या है?'
    options:
    - खोना
    - छिपना
    - गिनना
    answer: खोना
    difficulty: 2
    hints:
    - चीज़ ढूँढने से मिलती है।
    - पहले चीज़ ... जाती है, फिर ढूँढते हैं।
    solution: 'चरण 1: ढूँढना = पाना। चरण 2: उलटा खोना।'
    mistakes:
      छिपना: c2h20_khel
      गिनना: c2h20_khel
  - prompt: पंद्रह से बीस तक गिनो। बीच में कौन-सी गिनती नहीं आएगी?
    options:
    - पच्चीस
    - सत्रह
    - उन्नीस
    answer: पच्चीस
    difficulty: 2
    hints:
    - पंद्रह, सोलह, सत्रह ...
    - बीस से आगे कौन है?
    solution: 'चरण 1: 15, 16, 17, 18, 19, 20। चरण 2: पच्चीस (25) बीस से आगे है।'
    mistakes:
      सत्रह: c2h20_ginti
      उन्नीस: c2h20_ginti
  - prompt: खेल में छोटी बहन छिपना नहीं जानती। क्या करें?
    options:
    - उसे साथ लेकर छिपना सिखाएँ
    - उसे खेल से निकाल दें
    - उसे सबसे पहले पकड़कर चिढ़ाएँ
    answer: उसे साथ लेकर छिपना सिखाएँ
    difficulty: 2
    hints:
    - छोटे भी खेलना चाहते हैं।
    - सिखाना दोस्ती है।
    solution: 'चरण 1: छोटे बच्चे सीख रहे हैं। चरण 2: साथ लेकर सिखाओ।'
    mistakes:
      उसे खेल से निकाल दें: c2h20_khel
      उसे सबसे पहले पकड़कर चिढ़ाएँ: c2h20_khel
  - prompt: '''छिपना'' से बना शब्द कौन-सा है?'
    options:
    - छिपकर
    - छतरी
    - चिड़िया
    answer: छिपकर
    difficulty: 2
    hints:
    - शुरू का हिस्सा 'छिप' होना चाहिए।
    - '''छत'' और ''चिड़'' अलग हैं।'
    solution: 'चरण 1: छिप + कर। चरण 2: छिपकर।'
    mistakes:
      छतरी: c2h20_khel
      चिड़िया: c2h20_khel
  - prompt: छिपते-छिपते बहुत देर हो गई और कोई नहीं ढूँढ पाया। क्या करें?
    options:
    - खुद बाहर आकर बता दें
    - घंटों छिपे रहें
    - चुपचाप घर चले जाएँ
    answer: खुद बाहर आकर बता दें
    difficulty: 3
    hints:
    - दोस्त और बड़े चिंता करेंगे।
    - बिना बताए जाना ठीक नहीं।
    solution: 'चरण 1: ज़्यादा देर छिपने से सब परेशान होंगे। चरण 2: बाहर आकर बता दो।'
    mistakes:
      घंटों छिपे रहें: c2h20_suraksha
      चुपचाप घर चले जाएँ: c2h20_suraksha
  - prompt: छह बच्चे छिपे थे; दो पकड़े गए। कितने अभी भी छिपे हैं?
    options:
    - चार
    - दो
    - छह
    answer: चार
    difficulty: 3
    hints:
