# CBSE Class 2 Hindi (NCERT Sarangi, 2024-25), chapter 24. Format: content/README.md.
# Chapter names and order from the Delhi Directorate of Education Class II Hindi plan 2026-27; story details not checked against the book, kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse2-hin
chapter: 24
title: गिरे ताल में
concepts:
- code: cbse2h.24.gire
  title: गिरे ताल में
  notes: |
    एक मज़ेदार कविता जिसमें चंदा मामा ताल (तालाब) में गिर गए लगते हैं: पानी में चाँद की परछाईं। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह मज़ेदार कविता है जिसमें लगता है कि चंदा मामा तालाब में गिर गए! असल में पानी में चाँद की परछाईं दिखती है। चाँद तो आसमान में ही रहता है।
    visual: 'चित्र बनाओ: ऊपर आसमान में चाँद और नीचे तालाब के पानी में उसकी परछाईं।'
    step_by_step: 1. कविता पढ़ो। 2. कौन ताल में गिरा लगता है? 3. असल में पानी में क्या दिखता है? 4. तुकांत शब्द खोजो।
    real_world: शांत पानी में आईने जैसी अपनी परछाईं दिखती है।
  picture:
    kind: compare
    columns:
    - title: आसमान में
      points:
      - असली चाँद
    - title: पानी में
      points:
      - चाँद की परछाईं
    alt: आसमान में असली चाँद होता है और पानी में उसकी परछाईं दिखती है।
  items:
  - prompt: '''ताल'' का अर्थ क्या है?'
    options:
    - तालाब
    - ताला
    - ताली
    - थाली
    answer: तालाब
    difficulty: 1
    hints:
    - पानी भरी जगह।
    - ताल = तालाब।
    solution: ताल यानी तालाब।
    mistakes:
      ताली: hin2_word
  - prompt: कविता में कौन ताल में गिरा लगता है?
    options:
    - चंदा मामा
    - सूरज
    - बंदर
    - मेंढक
    answer: चंदा मामा
    difficulty: 1
    hints:
    - रात में चमकने वाला।
    - मामा।
    solution: चंदा मामा ताल में गिरे लगते हैं।
    mistakes:
      मेंढक: hin2_read_again
  - prompt: पानी में चाँद क्यों दिखता है?
    options:
    - उसकी परछाईं के कारण
    - चाँद सच में गिर गया
    - पानी चमकता है अपने आप
    - मछली ने पकड़ा
    answer: उसकी परछाईं के कारण
    difficulty: 2
    hints:
    - आईने जैसा पानी।
    - चाँद तो ऊपर है।
    solution: पानी में चाँद की परछाईं दिखती है।
  - prompt: शांत पानी किसकी तरह काम करता है?
    options:
    - आईने
    - पंखे
    - दरवाज़े
    - घड़ी
    answer: आईने
    difficulty: 2
    hints:
    - अपना चेहरा दिखता है।
    - शीशा।
    solution: शांत पानी आईने की तरह है।
  - prompt: असली चाँद कहाँ है?
    options:
    - आसमान में
    - तालाब के तले में
    - पेड़ पर
    - घर में
    answer: आसमान में
    difficulty: 1
    hints:
    - ऊपर देखो।
    - रात का आसमान।
    solution: असली चाँद आसमान में है।
  - prompt: '''गिरना'' का उलटा क्या है?'
    options:
    - उठना
    - बैठना
    - सोना
    - रोना
    answer: उठना
    difficulty: 1
    hints:
    - नीचे का उलटा ऊपर।
    - खड़ा होना।
    solution: गिरना का उलटा उठना है।
