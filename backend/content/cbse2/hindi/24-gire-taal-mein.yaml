subject: cbse2-hin
chapter: 24
title: गिरे ताल में
tips:
  h2_parchhai: "शांत पानी में झाँको तो तुम्हें अपना चेहरा दिखता है। क्या तुम पानी में गिर गए?"
  c2h24_parchhai: शांत पानी में झाँको तो अपना चेहरा दिखता है। क्या तुम सच में पानी में हो?
  c2h24_ulta: उलटा शब्द बिलकुल दूसरी तरफ़ का होता है, जैसे दिन-रात।
  c2h24_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। अर्थ ठीक बैठता है?

concepts:
- code: cbse2h.24.gire
  title: गिरे ताल में
  notes: |
    एक मज़ेदार कविता जिसमें चंदा मामा ताल (तालाब) में गिर गए लगते हैं: पानी में चाँद की परछाईं। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह मज़ेदार कविता है जिसमें लगता है कि चंदा मामा तालाब में गिर गए! असल में पानी में चाँद की परछाईं दिखती है। चाँद तो आसमान में ही रहता है।
    visual: 'चित्र बनाओ: ऊपर आसमान में चाँद और नीचे तालाब के पानी में उसकी परछाईं।'
    step_by_step: 1. कविता पढ़ो। 2. कौन ताल में गिरा लगता है? 3. असल में पानी में क्या दिखता है? 4. तुकांत शब्द खोजो।
    real_world: शांत पानी में आईने जैसी अपनी परछाईं दिखती है।
  picture:
    kind: compare
    columns:
    - title: आसमान में
      points:
      - असली चाँद
    - title: पानी में
      points:
      - चाँद की परछाईं
    alt: आसमान में असली चाँद होता है और पानी में उसकी परछाईं दिखती है।
  activity:
    type: sort
    prompt: पानी में क्या सच में है, और क्या बस परछाईं?
    bins:
    - सच में पानी में
    - बस परछाईं
    items:
    - label: 🐟 मछली
      bin: सच में पानी में
      clue: मछली पानी में रहती है?
      why: मछली सच में पानी में।
    - label: 🪷 कमल
      bin: सच में पानी में
      clue: कमल ताल में उगता है?
      why: सच में।
    - label: 🌕 ताल में चंदा मामा
      bin: बस परछाईं
      clue: चाँद तो आसमान में है न?
      why: पानी में चाँद की परछाईं है।
    - label: 🌳 पानी में उलटा पेड़
      bin: बस परछाईं
      clue: पेड़ किनारे पर है?
      why: पेड़ की परछाईं।
  lesson:
    - teach: '''गिरे ताल में'' कविता में लगता है कि चंदा मामा ताल (तालाब) में गिर गए। पर असली चाँद आसमान में ही है। पानी में उसकी परछाईं (प्रतिबिंब) दिखती है।'
      picture:
        kind: compare
        columns:
        - title: असली
          points:
          - चाँद आसमान में
        - title: परछाईं
          points:
          - चाँद पानी में दिखता है
        alt: असली चाँद आसमान में, उसकी परछाईं तालाब के पानी में।
      check:
        prompt: तालाब में दिखने वाला चाँद असल में कहाँ है?
        options:
        - आसमान में
        - तालाब के अंदर
        - मछली के पेट में
        answer: आसमान में
        why: पानी में सिर्फ़ उसकी परछाईं दिखती है।
      ways:
      - style: step_by_step
        teach: 'आईने का जादू देखो। पहला: कागज़ पर अपना नाम लिखो। दूसरा: उसे आईने के सामने रखो। तीसरा: देखो, आईने में अक्षर उलटे दिखते हैं। चौथा: इसीलिए एम्बुलेंस पर नाम उलटा लिखा होता है, ताकि आगे की गाड़ी के शीशे में सीधा पढ़ा जाए।'
      - style: real_world
        teach: 'किसी शांत झील की तस्वीर में पहाड़ दो बार दिखते हैं: एक बार ऊपर, और एक बार नीचे पानी में।'
    - teach: शांत पानी आईने (दर्पण) की तरह काम करता है। उसमें पेड़, बादल, चाँद और हमारा चेहरा दिखता है। पत्थर फेंको तो पानी हिलता है और परछाईं टूट-टूटकर काँपती है।
      check:
        prompt: तालाब में पत्थर फेंकने पर चाँद की परछाईं का क्या होगा?
        options:
        - हिलकर टूटी-टूटी दिखेगी
        - आसमान में उड़ जाएगी
        - पत्थर बन जाएगी
        answer: हिलकर टूटी-टूटी दिखेगी
        why: हिलते पानी में परछाईं काँपती है।
      ways:
      - style: visual
        teach: शांत पानी और हिलते पानी में परछाईं कैसी दिखती है।
        picture:
          kind: compare
          columns:
          - title: शांत पानी
            points:
            - परछाईं साफ़ दिखती है
            - चीज़ें पहचान में आती हैं
          - title: हिलता पानी
            points:
            - परछाईं टूट-टूट जाती है
            - सब कुछ काँपता दिखता है
          alt: शांत पानी में परछाईं साफ़ दिखती है और चीज़ें पहचान में आती हैं। हिलते पानी में परछाईं टूट जाती है और सब कुछ काँपता दिखता है।
      - style: real_world
        teach: हवा वाले दिन तालाब में छोटी-छोटी लहरें उठती हैं, तब किनारे के पेड़ों की परछाईं धुँधली हो जाती है।
    - teach: 'शब्द: ताल = तालाब, परछाईं = प्रतिबिंब, आईना = दर्पण। उलटे शब्द: गिरना-उठना, ऊपर-नीचे, शांत-हलचल।'
      check:
        prompt: '''आईना'' का दूसरा नाम क्या है?'
        options:
        - दर्पण
        - दरवाज़ा
        - दीपक
        answer: दर्पण
        why: आईना और दर्पण एक ही चीज़ हैं, जिसमें चेहरा दिखता है।
      ways:
      - style: visual
        teach: पानी से जुड़े कुछ और शब्द, और उनके उलटे शब्द।
        picture:
          kind: compare
          columns:
          - title: शब्द
            points:
            - डूबना
            - भीगना
            - गहरा
          - title: उलटा
            points:
            - तैरना
            - सूखना
            - उथला
          alt: डूबना का उलटा तैरना, भीगना का उलटा सूखना, और गहरा का उलटा उथला है।
      - style: step_by_step
        teach: 'वाक्य से शब्द का अर्थ समझो। पहला: वाक्य पढ़ो: ''प्यासे पंछी ने नीर पिया।'' दूसरा: सोचो, प्यासा पंछी क्या पीता है? तीसरा: पानी। चौथा: तो ''नीर'' का अर्थ है पानी।'
  items:
  - prompt: '''ताल'' का अर्थ क्या है?'
    options:
    - तालाब
    - ताला
    - ताली
    - थाली
    answer: तालाब
    difficulty: 1
    hints:
    - पानी भरी जगह।
    - ताल = तालाब।
    solution: ताल यानी तालाब।
    mistakes:
      ताली: hin2_word
  - prompt: कविता में कौन ताल में गिरा लगता है?
    options:
    - चंदा मामा
    - सूरज
    - बंदर
    - मेंढक
    answer: चंदा मामा
    difficulty: 1
    hints:
    - रात में चमकने वाला।
    - मामा।
    solution: चंदा मामा ताल में गिरे लगते हैं।
    mistakes:
      मेंढक: hin2_read_again
  - prompt: पानी में चाँद क्यों दिखता है?
    options:
    - उसकी परछाईं के कारण
    - चाँद सच में गिर गया
    - पानी चमकता है अपने आप
    - मछली ने पकड़ा
    answer: उसकी परछाईं के कारण
    difficulty: 2
    hints:
    - आईने जैसा पानी।
    - चाँद तो ऊपर है।
    solution: पानी में चाँद की परछाईं दिखती है।
    mistakes: {"चाँद सच में गिर गया": "h2_parchhai", "पानी चमकता है अपने आप": "h2_parchhai", "मछली ने पकड़ा": "h2_parchhai"}
  - prompt: शांत पानी किसकी तरह काम करता है?
    options:
    - आईने
    - पंखे
    - दरवाज़े
    - घड़ी
    answer: आईने
    difficulty: 2
    hints:
    - अपना चेहरा दिखता है।
    - शीशा।
    solution: शांत पानी आईने की तरह है।
    mistakes: {"पंखे": "h2_parchhai", "दरवाज़े": "h2_parchhai", "घड़ी": "h2_parchhai"}
  - prompt: असली चाँद कहाँ है?
    options:
    - आसमान में
    - तालाब के तले में
    - पेड़ पर
    - घर में
    answer: आसमान में
    difficulty: 1
    hints:
    - ऊपर देखो।
    - रात का आसमान।
    solution: असली चाँद आसमान में है।
    mistakes: {"तालाब के तले में": "h2_parchhai", "पेड़ पर": "h2_parchhai", "घर में": "h2_parchhai"}
  - prompt: '''गिरना'' का उलटा क्या है?'
    options:
    - उठना
    - बैठना
    - सोना
    - रोना
    answer: उठना
    difficulty: 1
    hints:
    - नीचे का उलटा ऊपर।
    - खड़ा होना।
    solution: गिरना का उलटा उठना है।
    mistakes: {"बैठना": "h1_ulta", "सोना": "h1_ulta", "रोना": "h1_ulta"}
  - prompt: घर में आईना न हो, तो चेहरा किसमें देख सकते हैं?
    options:
    - बाल्टी के शांत पानी में
    - सूखी मिट्टी में
    - लकड़ी के डिब्बे में
    answer: बाल्टी के शांत पानी में
    difficulty: 1
    hints:
    - किसमें परछाईं बनती है?
    - मिट्टी और लकड़ी चमकती नहीं।
    solution: 'चरण 1: शांत पानी आईने जैसा है। चरण 2: उसमें चेहरा दिखता है।'
    mistakes:
      सूखी मिट्टी में: c2h24_parchhai
      लकड़ी के डिब्बे में: c2h24_parchhai
  - prompt: '''ऊपर'' का उलटा क्या है?'
    options:
    - नीचे
    - आगे
    - अंदर
    answer: नीचे
    difficulty: 1
    hints:
    - चाँद ऊपर आसमान में, परछाईं ... पानी में।
    - ज़मीन की ओर।
    solution: 'चरण 1: ऊपर = आसमान की ओर। चरण 2: उलटा नीचे।'
    mistakes:
      आगे: c2h24_ulta
      अंदर: c2h24_ulta
  - prompt: '''प्रतिबिंब'' का अर्थ क्या है?'
    options:
    - परछाईं
    - पत्थर
    - पहाड़
    answer: परछाईं
    difficulty: 2
    hints:
    - पानी या आईने में जो दिखता है।
    - चाँद पानी में ऐसे ही दिखा।
    solution: 'चरण 1: आईने या पानी में बनी छवि प्रतिबिंब है। चरण 2: उसे परछाईं भी कहते हैं।'
    mistakes:
      पत्थर: c2h24_shabd
      पहाड़: c2h24_shabd
  - prompt: पानी में किनारे के पेड़ कैसे दिखते हैं?
    options:
    - उलटे
    - सीधे खड़े
    - दिखते ही नहीं
    answer: उलटे
    difficulty: 2
    hints:
    - परछाईं में ऊपर वाला हिस्सा नीचे दिखता है।
    - पेड़ की चोटी पानी में नीचे की ओर।
    solution: 'चरण 1: पानी आईने जैसा है। चरण 2: पेड़ की परछाईं उलटी दिखती है।'
    mistakes:
      सीधे खड़े: c2h24_parchhai
      दिखते ही नहीं: c2h24_parchhai
  - prompt: अगर बादल चाँद को ढक लें, तो तालाब में चाँद दिखेगा?
    options:
    - नहीं
    - हाँ, और ज़्यादा चमकेगा
    - हाँ, दो चाँद दिखेंगे
    answer: नहीं
    difficulty: 2
    hints:
    - परछाईं असली चीज़ से बनती है।
    - असली चाँद छिप गया तो?
    solution: 'चरण 1: परछाईं असली चाँद से बनती है। चरण 2: चाँद छिपा तो परछाईं भी नहीं।'
    mistakes:
      हाँ, और ज़्यादा चमकेगा: c2h24_parchhai
      हाँ, दो चाँद दिखेंगे: c2h24_parchhai
  - prompt: '''गिरना'' से बना शब्द कौन-सा है?'
    options:
    - गिरे
    - गिनती
    - गीत
    answer: गिरे
    difficulty: 1
    hints:
    - कविता के नाम में यह शब्द है।
    - शुरू में 'गिर' होना चाहिए।
    solution: 'चरण 1: गिर + ए। चरण 2: गिरे।'
    mistakes:
      गिनती: c2h24_shabd
      गीत: c2h24_shabd
  - prompt: '''शांत'' का उलटा क्या है?'
    options:
    - हलचल वाला
    - चुप
    - धीमा
    answer: हलचल वाला
    difficulty: 2
    hints:
    - चुप और शांत एक जैसे हैं।
    - पत्थर फेंकने के बाद पानी कैसा होता है?
    solution: 'चरण 1: शांत = बिना हिले। चरण 2: उलटा हलचल वाला।'
    mistakes:
      चुप: c2h24_ulta
      धीमा: c2h24_ulta
  - prompt: बाल्टी के पानी में भी चाँद दिख सकता है?
    options:
    - "हाँ, अगर पानी शांत हो और चाँद ऊपर हो"
    - "नहीं, बाल्टी के पानी में कभी नहीं"
    - "हाँ, पर सिर्फ़ दिन में धूप होने पर"
    answer: हाँ, अगर पानी शांत हो और चाँद ऊपर हो
    difficulty: 3
    hints:
    - शांत पानी कहीं भी आईना बन जाता है।
    - दिन में चाँद की परछाईं मुश्किल है।
    solution: 'चरण 1: कोई भी शांत पानी आईने जैसा है। चरण 2: रात में ऊपर चाँद हो तो बाल्टी में भी दिखेगा।'
    mistakes:
      "नहीं, बाल्टी के पानी में कभी नहीं": c2h24_parchhai
      "हाँ, पर सिर्फ़ दिन में धूप होने पर": c2h24_parchhai
  - prompt: कविता में चाँद ताल में 'गिरा' क्यों लगता है?
    options:
    - "पानी में उसकी परछाईं दिखती है"
    - "चाँद सच में आसमान से गिर गया"
    - "किसी ने चाँद को ताल में फेंका"
    answer: पानी में उसकी परछाईं दिखती है
    difficulty: 2
