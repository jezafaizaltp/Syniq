subject: cbse2-hin
chapter: 2
title: घर
tips:
  h2_ghar_bachav: "सोचो, बाहर तेज़ गरमी हो या बादल बरस रहे हों, तो तुम भागकर कहाँ जाते हो और क्यों?"
  h2_ghar_hisse: "छत ऊपर, फ़र्श नीचे, दीवारें चारों ओर। अंदर आने के लिए क्या खोलते हो?"
  h2_jeev_ghar: "हर जीव के घर का अपना नाम है: चूहे का बिल, शेर की माँद। सोचो, यह जीव अपना घर कहाँ और किससे बनाता है।"
  h2_saaf: "सोचो, किस घर में रहकर तुम बीमार नहीं पड़ते और खुश रहते हो?"
  c2h2_jeev: उस जीव को याद करो। वह कहाँ सोता है, कहाँ बच्चे रखता है?
  c2h2_bhag: 'अपने घर में घूमकर सोचो: यह काम किस हिस्से में होता है?'
  c2h2_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। अर्थ ठीक बैठता है?

concepts:
- code: cbse2h.02.ghar
  title: घर
  notes: |
    घर पर एक पाठ/कविता: घर में परिवार रहता है, घर हमें धूप-बारिश से बचाता है, अलग-अलग तरह के घर। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: घर वह जगह है जहाँ हमारा परिवार रहता है। घर हमें धूप, बारिश और ठंड से बचाता है। घर कई तरह के होते हैं।
    visual: 'चित्र बनाओ: एक घर जिसमें छत, दरवाज़ा और खिड़की हो, और बाहर एक पेड़।'
    step_by_step: 1. पाठ पढ़ो। 2. घर में कौन-कौन रहता है? 3. घर हमें किससे बचाता है? 4. घर के हिस्सों के नाम बताओ।
    real_world: पहाड़ों पर घर की छत ढलवाँ होती है ताकि बर्फ़ और बारिश फिसल जाए।
  picture:
    kind: compare
    columns:
    - title: जीव
      points:
      - चिड़िया
      - मधुमक्खी
      - हम
    - title: घर
      points:
      - घोंसला
      - छत्ता
      - मकान
    alt: चिड़िया का घर घोंसला, मधुमक्खी का छत्ता और हमारा घर मकान है।
  activity:
    type: sort
    prompt: घर किससे बचाता है, और किसका घर कौन-सा?
    bins:
    - घर हमें बचाता है
    - जीवों के घर
    items:
    - label: 🌧️ बारिश से
      bin: घर हमें बचाता है
      clue: बारिश में हम कहाँ जाते हैं?
      why: घर बारिश से बचाता है।
    - label: ☀️ तेज़ धूप से
      bin: घर हमें बचाता है
      clue: गर्मी में छाँव कहाँ?
      why: घर धूप से बचाता है।
    - label: 🪺 चिड़िया का घोंसला
      bin: जीवों के घर
      clue: चिड़िया कहाँ रहती है?
      why: घोंसला चिड़िया का घर।
    - label: 🦁 शेर की मांद
      bin: जीवों के घर
      clue: शेर कहाँ रहता है?
      why: मांद शेर का घर।
  lesson:
    - teach: 'घर में परिवार साथ रहता है। घर हमें धूप, बारिश, ठंड और आँधी से बचाता है। घर कई तरह के होते हैं: पक्का घर, कच्चा घर, झोपड़ी, फ़्लैट, नाव-घर।'
      check:
        prompt: घर हमें ठंड की रात में क्या देता है?
        options:
        - गरमाहट और सुरक्षा
        - बर्फ़
        - तेज़ हवा
        answer: गरमाहट और सुरक्षा
        why: घर की दीवारें और छत ठंडी हवा रोकती हैं।
    - teach: 'घर के हिस्से: रसोई में खाना बनता है, सोने के कमरे में सोते हैं, स्नानघर में नहाते हैं, आँगन में खेलते हैं। ऊपर छत, आने-जाने के लिए दरवाज़ा, हवा-रोशनी के लिए खिड़की।'
      picture:
        kind: compare
        columns:
        - title: हिस्सा
          points:
          - रसोई
          - स्नानघर
          - खिड़की
        - title: काम
          points:
          - खाना बनाना
          - नहाना
          - हवा और रोशनी
        alt: घर के हिस्से और उनके काम।
      check:
        prompt: खाना घर के किस हिस्से में बनता है?
        options:
        - रसोई
        - स्नानघर
        - छत
        answer: रसोई
        why: रसोई में चूल्हा और बर्तन होते हैं।
    - teach: 'जीवों के भी घर होते हैं: चिड़िया का घोंसला, शेर की माँद, चूहे का बिल, मधुमक्खी का छत्ता, घोड़े का अस्तबल, गाय की गौशाला।'
      check:
        prompt: शेर का घर क्या कहलाता है?
        options:
        - माँद
        - घोंसला
        - छत्ता
        answer: माँद
        why: शेर गुफ़ा जैसी माँद में रहता है।
  items:
  - prompt: घर हमें किससे बचाता है?
    options:
    - धूप और बारिश से
    - खाने से
    - दोस्तों से
    - किताबों से
    answer: धूप और बारिश से
    difficulty: 1
    hints:
    - छत ऊपर होती है।
    - मौसम।
    solution: घर धूप और बारिश से बचाता है।
    mistakes: {"खाने से": "h2_ghar_bachav", "दोस्तों से": "h2_ghar_bachav", "किताबों से": "h2_ghar_bachav"}
  - prompt: चिड़िया का घर क्या कहलाता है?
    options:
    - घोंसला
    - बिल
    - माँद
    - छत्ता
    answer: घोंसला
    difficulty: 1
    hints:
    - तिनकों से बना।
    - पेड़ पर।
    solution: चिड़िया का घर घोंसला है।
    mistakes: {"बिल": "h2_jeev_ghar", "माँद": "h2_jeev_ghar", "छत्ता": "h2_jeev_ghar"}
  - prompt: घर में अंदर आने के लिए क्या होता है?
    options:
    - दरवाज़ा
    - छत
    - दीवार
    - फ़र्श
    answer: दरवाज़ा
    difficulty: 1
    hints:
    - खुलता-बंद होता है।
    - द से शुरू।
    solution: हम दरवाज़े से घर में आते हैं।
    mistakes: {"छत": "h2_ghar_hisse", "दीवार": "h2_ghar_hisse", "फ़र्श": "h2_ghar_hisse"}
  - prompt: '''घर'' का दूसरा शब्द क्या है?'
    options:
    - मकान
    - पेड़
    - नदी
    - सड़क
    answer: मकान
    difficulty: 2
    hints:
    - जिसमें हम रहते हैं।
    - म से शुरू।
    solution: घर को मकान भी कहते हैं।
    mistakes:
      पेड़: hin2_word
  - prompt: मधुमक्खी का घर क्या है?
    options:
    - छत्ता
    - घोंसला
    - बिल
    - तालाब
    answer: छत्ता
    difficulty: 2
    hints:
    - शहद वहीं बनता है।
    - पेड़ से लटका।
    solution: मधुमक्खी का घर छत्ता है।
    mistakes: {"घोंसला": "h2_jeev_ghar", "बिल": "h2_jeev_ghar", "तालाब": "h2_jeev_ghar"}
  - prompt: घर को कैसा रखना चाहिए?
    options:
    - साफ़
    - गंदा
    - टूटा
    - अँधेरा
    answer: साफ़
    difficulty: 1
    hints:
    - सफ़ाई अच्छी आदत है।
    - सुंदर घर।
    solution: घर को साफ़ रखना चाहिए।
    mistakes: {"गंदा": "h2_saaf", "टूटा": "h2_saaf", "अँधेरा": "h2_saaf"}
  - prompt: चूहे का घर क्या कहलाता है?
    options:
    - बिल
    - घोंसला
    - अस्तबल
    answer: बिल
    difficulty: 1
    hints:
    - चूहा ज़मीन में छेद बनाता है।
    - चींटी का घर भी ऐसा ही होता है।
    solution: 'चरण 1: चूहा ज़मीन खोदता है। चरण 2: उसका घर बिल है।'
    mistakes:
      घोंसला: c2h2_jeev
      अस्तबल: c2h2_jeev
  - prompt: हम कहाँ नहाते हैं?
    options:
    - स्नानघर में
    - रसोई में
    - छत पर
    answer: स्नानघर में
    difficulty: 1
    hints:
    - जहाँ बाल्टी और नल होता है।
    - नाम में 'स्नान' है।
    solution: 'चरण 1: स्नान मतलब नहाना। चरण 2: स्नानघर में नहाते हैं।'
    mistakes:
      रसोई में: c2h2_bhag
      छत पर: c2h2_bhag
  - prompt: घर में हवा और रोशनी किससे आती है?
    options:
    - खिड़की से
    - दीवार से
    - पलंग से
    answer: खिड़की से
    difficulty: 1
    hints:
    - इसे खोलो तो धूप अंदर आती है।
    - यह दीवार में होती है, पर खुलती है।
    solution: 'चरण 1: दीवार बंद होती है। चरण 2: खिड़की खोलने पर हवा-रोशनी आती है।'
    mistakes:
      दीवार से: c2h2_bhag
      पलंग से: c2h2_bhag
  - prompt: घोड़ा कहाँ रहता है?
    options:
    - अस्तबल में
    - बिल में
    - घोंसले में
    answer: अस्तबल में
    difficulty: 1
    hints:
    - घोड़ा बड़ा जानवर है।
    - बिल और घोंसला छोटे जीवों के घर हैं।
    solution: 'चरण 1: घोड़े को बड़ा कमरा चाहिए। चरण 2: वह अस्तबल में रहता है।'
    mistakes:
      बिल में: c2h2_jeev
      घोंसले में: c2h2_jeev
  - prompt: बारिश का पानी घर के अंदर आने से क्या रोकता है?
    options:
    - छत
    - आँगन
    - खिड़की खुली रखना
    answer: छत
    difficulty: 1
    hints:
    - यह घर के सबसे ऊपर होती है।
    - बारिश ऊपर से गिरती है।
    solution: 'चरण 1: बारिश ऊपर से आती है। चरण 2: छत उसे रोकती है।'
    mistakes:
      आँगन: c2h2_bhag
      खिड़की खुली रखना: c2h2_bhag
  - prompt: गाय कहाँ रहती है?
    options:
    - गौशाला में
    - माँद में
    - छत्ते में
    answer: गौशाला में
    difficulty: 2
    hints:
    - नाम में 'गौ' है, जिसका अर्थ गाय है।
    - माँद शेर की होती है।
    solution: 'चरण 1: गौ मतलब गाय। चरण 2: गाय गौशाला में रहती है।'
    mistakes:
      माँद में: c2h2_jeev
      छत्ते में: c2h2_jeev
  - prompt: घर को साफ़ रखने के लिए हम क्या कर सकते हैं?
    options:
    - खिलौने खेलकर जगह पर रखें
    - कचरा फ़र्श पर फेंकें
    - जूते बिस्तर पर रखें
    answer: खिलौने खेलकर जगह पर रखें
    difficulty: 2
    hints:
    - साफ़ घर में हर चीज़ अपनी जगह होती है।
    - किससे घर गंदा होता है?
    solution: 'चरण 1: बिखरी चीज़ें घर गंदा करती हैं। चरण 2: खिलौने जगह पर रखो।'
    mistakes:
      कचरा फ़र्श पर फेंकें: h2_saaf
      जूते बिस्तर पर रखें: h2_saaf
  - prompt: '''मकान'' का अर्थ क्या है?'
    options:
    - घर
    - पेड़
    - सड़क
    answer: घर
    difficulty: 2
    hints:
    - जहाँ लोग रहते हैं।
    - इस पाठ का नाम सोचो।
    solution: 'चरण 1: मकान में लोग रहते हैं। चरण 2: मकान का अर्थ घर है।'
    mistakes:
      पेड़: c2h2_shabd
      सड़क: c2h2_shabd
  - prompt: कौन-सा जोड़ा ठीक है?
    options:
    - मधुमक्खी - छत्ता
    - चिड़िया - बिल
    - शेर - घोंसला
    answer: मधुमक्खी - छत्ता
    difficulty: 3
    hints:
    - हर जीव को उसके घर से मिलाओ।
    - चिड़िया पेड़ पर तिनकों का घर बनाती है।
    solution: 'चरण 1: चिड़िया का घोंसला, शेर की माँद। चरण 2: मधुमक्खी का छत्ता: ठीक जोड़ा।'
    mistakes:
      चिड़िया - बिल: c2h2_jeev
      शेर - घोंसला: c2h2_jeev
