subject: cbse2-hin
chapter: 2
title: घर
tips:
  h2_ghar_bachav: "सोचो, बाहर तेज़ गरमी हो या बादल बरस रहे हों, तो तुम भागकर कहाँ जाते हो और क्यों?"
  h2_ghar_hisse: "छत ऊपर, फ़र्श नीचे, दीवारें चारों ओर। अंदर आने के लिए क्या खोलते हो?"
  h2_jeev_ghar: "हर जीव के घर का अपना नाम है: चूहे का बिल, शेर की माँद। सोचो, यह जीव अपना घर कहाँ और किससे बनाता है।"
  h2_saaf: "सोचो, किस घर में रहकर तुम बीमार नहीं पड़ते और खुश रहते हो?"

concepts:
- code: cbse2h.02.ghar
  title: घर
  notes: |
    घर पर एक पाठ/कविता: घर में परिवार रहता है, घर हमें धूप-बारिश से बचाता है, अलग-अलग तरह के घर। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: घर वह जगह है जहाँ हमारा परिवार रहता है। घर हमें धूप, बारिश और ठंड से बचाता है। घर कई तरह के होते हैं।
    visual: 'चित्र बनाओ: एक घर जिसमें छत, दरवाज़ा और खिड़की हो, और बाहर एक पेड़।'
    step_by_step: 1. पाठ पढ़ो। 2. घर में कौन-कौन रहता है? 3. घर हमें किससे बचाता है? 4. घर के हिस्सों के नाम बताओ।
    real_world: पहाड़ों पर घर की छत ढलवाँ होती है ताकि बर्फ़ और बारिश फिसल जाए।
  picture:
    kind: compare
    columns:
    - title: जीव
      points:
      - चिड़िया
      - मधुमक्खी
      - हम
    - title: घर
      points:
      - घोंसला
      - छत्ता
      - मकान
    alt: चिड़िया का घर घोंसला, मधुमक्खी का छत्ता और हमारा घर मकान है।
  items:
  - prompt: घर हमें किससे बचाता है?
    options:
    - धूप और बारिश से
    - खाने से
    - दोस्तों से
    - किताबों से
    answer: धूप और बारिश से
    difficulty: 1
    hints:
    - छत ऊपर होती है।
    - मौसम।
    solution: घर धूप और बारिश से बचाता है।
    mistakes: {"खाने से": "h2_ghar_bachav", "दोस्तों से": "h2_ghar_bachav", "किताबों से": "h2_ghar_bachav"}
  - prompt: चिड़िया का घर क्या कहलाता है?
    options:
    - घोंसला
    - बिल
    - माँद
    - छत्ता
    answer: घोंसला
    difficulty: 1
    hints:
    - तिनकों से बना।
    - पेड़ पर।
    solution: चिड़िया का घर घोंसला है।
    mistakes: {"बिल": "h2_jeev_ghar", "माँद": "h2_jeev_ghar", "छत्ता": "h2_jeev_ghar"}
  - prompt: घर में अंदर आने के लिए क्या होता है?
    options:
    - दरवाज़ा
    - छत
    - दीवार
    - फ़र्श
    answer: दरवाज़ा
    difficulty: 1
    hints:
    - खुलता-बंद होता है।
    - द से शुरू।
    solution: हम दरवाज़े से घर में आते हैं।
    mistakes: {"छत": "h2_ghar_hisse", "दीवार": "h2_ghar_hisse", "फ़र्श": "h2_ghar_hisse"}
  - prompt: '''घर'' का दूसरा शब्द क्या है?'
    options:
    - मकान
    - पेड़
    - नदी
    - सड़क
    answer: मकान
    difficulty: 2
    hints:
    - जिसमें हम रहते हैं।
    - म से शुरू।
    solution: घर को मकान भी कहते हैं।
    mistakes:
      पेड़: hin2_word
  - prompt: मधुमक्खी का घर क्या है?
    options:
    - छत्ता
    - घोंसला
    - बिल
    - तालाब
    answer: छत्ता
    difficulty: 2
    hints:
    - शहद वहीं बनता है।
    - पेड़ से लटका।
    solution: मधुमक्खी का घर छत्ता है।
    mistakes: {"घोंसला": "h2_jeev_ghar", "बिल": "h2_jeev_ghar", "तालाब": "h2_jeev_ghar"}
  - prompt: घर को कैसा रखना चाहिए?
    options:
    - साफ़
    - गंदा
    - टूटा
    - अँधेरा
    answer: साफ़
    difficulty: 1
    hints:
    - सफ़ाई अच्छी आदत है।
    - सुंदर घर।
    solution: घर को साफ़ रखना चाहिए।
    mistakes: {"गंदा": "h2_saaf", "टूटा": "h2_saaf", "अँधेरा": "h2_saaf"}
